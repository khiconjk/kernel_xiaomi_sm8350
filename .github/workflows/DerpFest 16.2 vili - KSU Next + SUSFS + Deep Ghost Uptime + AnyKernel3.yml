name: DerpFest 16.2 vili - KSU Next + SUSFS + Deep Ghost Uptime + AnyKernel3

"on":
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel branch/tag/SHA to build"
        required: true
        default: "main"
        type: string
      defconfig:
        description: "arm64 defconfig"
        required: true
        default: "kangaroox-vili_defconfig"
        type: string
      ksu_ref:
        description: "KernelSU-Next ref pinned for this 5.4 manual-hook tree"
        required: true
        default: "v3.2.0-legacy"
        type: string
      susfs_ref:
        description: "SuSFS branch for Linux 5.4"
        required: true
        default: "kernel-5.4"
        type: string
      ghost_uptime_profile:
        description: "Deep ghost uptime profile. v88-safe avoids MONOTONIC/RAW/scheduler-core patches."
        required: true
        default: "v88-safe"
        type: choice
        options:
          - "v88-safe"
          - "off"
      ghost_min_days:
        description: "Minimum randomized fake uptime age in days"
        required: true
        default: "15"
        type: string
      ghost_max_days:
        description: "Maximum randomized fake uptime age in days"
        required: true
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  group: a16-vili-ksu-susfs-${{ github.ref }}-${{ inputs.kernel_ref }}
  cancel-in-progress: true

env:
  DEVICE: vili
  DEVICE_NAME: Xiaomi 11T Pro
  ROM_TARGET: DerpFest 16.2 Android 16 AOSP
  ROM_BUILD: DerpFest-v16.2-20260517-vili-Official-Stable
  ROM_PACKAGE_URL: https://sourceforge.net/projects/derpfest/files/vili/DerpFest-v16.2-20260517-vili-Official-Stable.zip/download
  AK3_REF: 1c9a500dd4aa8081952523126e97eb155aed941b
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEFCONFIG: ${{ inputs.defconfig }}
  ENABLE_KERNELSU: "true"
  KSU_REF: ${{ inputs.ksu_ref }}
  ENABLE_SUSFS: "true"
  SUSFS_REF: ${{ inputs.susfs_ref }}

  # This exact V98 commit has a successful GitHub Actions build in this repo.
  # We reuse ONLY its repo-specific "Fix KernelSU references" step, because it
  # contains the vili/Linux-5.4 manual-hook + SuSFS compatibility port.
  V98_COMPAT_COMMIT: 3d6e946d4bd31b3aca11df3d587c87b49b722e66
  V98_WORKFLOW_PATH: .github/workflows/V98-sched-clock-offset-FIX-FLASH-SU.yml

  KBUILD_BUILD_USER: github
  KBUILD_BUILD_HOST: actions

jobs:
  build:
    name: Build vili DerpFest 16.2 kernel + AnyKernel3
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Initialize diagnostic logs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs artifacts
          : > setup.log
          : > build.log
          {
            echo "# ChatGPT-friendly kernel build"
            echo
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "device=${DEVICE}"
            echo "rom_target=${ROM_TARGET}"
            echo "kernel_ref=${{ inputs.kernel_ref }}"
            echo "defconfig=${DEFCONFIG}"
            echo "ksu_ref=${KSU_REF}"
            echo "susfs_ref=${SUSFS_REF}"
            echo "rom_build=${ROM_BUILD}"
            echo "rom_package_url=${ROM_PACKAGE_URL}"
            echo "ghost_uptime_profile=${{ inputs.ghost_uptime_profile }}"
            echo "ghost_min_days=${{ inputs.ghost_min_days }}"
            echo "ghost_max_days=${{ inputs.ghost_max_days }}"
            echo "ak3_ref=${AK3_REF}"
            echo "v98_compat_commit=${V98_COMPAT_COMMIT}"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } | tee logs/00-environment.txt setup.log

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_ref }}
          fetch-depth: 0
          submodules: false
          path: kernel

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "===== apt dependencies ====="
            sudo apt-get update
            sudo apt-get install -y \
              bc \
              bison \
              build-essential \
              ca-certificates \
              ccache \
              cpio \
              curl \
              dwarves \
              file \
              flex \
              gcc-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi \
              git \
              kmod \
              libelf-dev \
              libncurses-dev \
              libssl-dev \
              lld \
              llvm \
              lz4 \
              make \
              pahole \
              patch \
              perl \
              python-is-python3 \
              python3 \
              python3-pip \
              python3-yaml \
              rsync \
              unzip \
              xz-utils \
              zip \
              zstd
          } 2>&1 | tee -a setup.log

      - name: Record source baseline
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          {
            echo "===== SOURCE ====="
            echo "HEAD=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current || true)"
            echo "remote=$(git remote get-url origin || true)"
            echo
            echo "===== KERNEL VERSION ====="
            grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true
            echo
            echo "===== DEFCONFIG ====="
            test -f "arch/arm64/configs/${DEFCONFIG}"
            echo "path=arch/arm64/configs/${DEFCONFIG}"
            sha256sum "arch/arm64/configs/${DEFCONFIG}"
            echo
            echo "===== EXISTING KSU MANUAL HOOK MARKERS ====="
            grep -RnsE 'ksu_handle_(execveat|faccessat|stat|vfs_read|sys_reboot)' fs kernel 2>/dev/null | head -120 || true
            echo
            echo "===== UPTIME BASELINE ====="
            grep -nE 'ktime_get_boottime_ts64|timens_add_boottime|seq_printf' fs/proc/uptime.c || true
            grep -nE 'getboottime64|btime ' fs/proc/stat.c || true
            grep -nE 'info->uptime|ktime_get_boottime_ts64' kernel/sys.c || true
          } 2>&1 | tee ../logs/10-source.txt | tee -a ../setup.log

      - name: Cache WeebX Clang
        uses: actions/cache@v4
        with:
          path: ~/.cache/weebx-clang
          key: weebx-clang-${{ runner.os }}-v2

      - name: Setup Clang toolchain
        id: clang
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_DIR="$HOME/.cache/weebx-clang/clang"
          TMP_DIR="$RUNNER_TEMP/weebx-clang"

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            rm -rf "$CLANG_DIR" "$TMP_DIR"
            mkdir -p "$CLANG_DIR" "$TMP_DIR/extract"

            CLANG_URL="$(curl -fsSL https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt | tr -d '\r\n')"
            test -n "$CLANG_URL"
            echo "clang_url=$CLANG_URL" | tee -a setup.log
            curl -L --fail --retry 10 --retry-all-errors --retry-delay 5 \
              "$CLANG_URL" -o "$TMP_DIR/clang.tar.gz" 2>&1 | tee -a setup.log
            sha256sum "$TMP_DIR/clang.tar.gz" | tee -a setup.log
            tar -xf "$TMP_DIR/clang.tar.gz" -C "$TMP_DIR/extract" 2>&1 | tee -a setup.log

            CLANG_BIN="$(find "$TMP_DIR/extract" -type f \
              \( -path '*/bin/clang' -o -path '*/bin/clang-[0-9]*' \) \
              -print | sort -V | tail -n 1 || true)"
            if [ -z "$CLANG_BIN" ]; then
              echo "ERROR: clang binary was not found in WeebX archive" | tee -a setup.log
              find "$TMP_DIR/extract" -maxdepth 4 -type f | head -250 | tee -a setup.log || true
              exit 1
            fi

            SRC_ROOT="$(cd "$(dirname "$CLANG_BIN")/.." && pwd)"
            cp -a "$SRC_ROOT"/. "$CLANG_DIR"/

            # Some releases expose clang-N only. Normalize to clang when needed.
            if [ ! -x "$CLANG_DIR/bin/clang" ]; then
              REAL_CLANG="$(find "$CLANG_DIR/bin" -maxdepth 1 -type f -name 'clang-[0-9]*' -print | sort -V | tail -n1)"
              ln -sf "$(basename "$REAL_CLANG")" "$CLANG_DIR/bin/clang"
            fi
          fi

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          {
            echo "===== TOOLCHAIN ====="
            "$CLANG_DIR/bin/clang" --version
            "$CLANG_DIR/bin/ld.lld" --version || true
            echo "clang_path=$CLANG_DIR/bin/clang"
          } 2>&1 | tee logs/15-toolchain.txt | tee -a setup.log

      - name: Integrate KernelSU-Next + SuSFS using proven vili compatibility port
        id: ksu_susfs
        shell: bash
        run: |
          set +e
          rc=0

          {
            echo "===== PINNED V98 COMPATIBILITY SOURCE ====="
            echo "commit=${V98_COMPAT_COMMIT}"
            echo "workflow=${V98_WORKFLOW_PATH}"

            if ! git -C kernel cat-file -e "${V98_COMPAT_COMMIT}^{commit}" 2>/dev/null; then
              echo "Pinned commit is not present locally; fetching it explicitly..."
              git -C kernel fetch --no-tags origin "${V98_COMPAT_COMMIT}" || exit 81
            fi

            git -C kernel show "${V98_COMPAT_COMMIT}:${V98_WORKFLOW_PATH}" > "$RUNNER_TEMP/v98-pinned.yml" || exit 82

            python3 - "$RUNNER_TEMP/v98-pinned.yml" "$RUNNER_TEMP/v98-ksu-susfs.sh" <<'PY_EXTRACT'
          import sys
          from pathlib import Path
          import yaml

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          data = yaml.safe_load(src.read_text())
          steps = data.get("jobs", {}).get("build", {}).get("steps", [])
          matches = [s for s in steps if s.get("name") == "Fix KernelSU references"]
          if len(matches) != 1:
              raise SystemExit(f"ERROR: expected one 'Fix KernelSU references' step, found {len(matches)}")
          run = matches[0].get("run")
          if not isinstance(run, str) or not run.strip():
              raise SystemExit("ERROR: pinned KSU/SuSFS step has no run script")
          dst.write_text(run)
          print(f"Extracted {len(run.splitlines())} lines to {dst}")
          PY_EXTRACT
            extract_rc=$?
            if [ "$extract_rc" -ne 0 ]; then
              exit "$extract_rc"
            fi

            chmod +x "$RUNNER_TEMP/v98-ksu-susfs.sh"
            echo "compat_script_sha256=$(sha256sum "$RUNNER_TEMP/v98-ksu-susfs.sh" | awk '{print $1}')"
            echo "compat_script_lines=$(wc -l < "$RUNNER_TEMP/v98-ksu-susfs.sh")"
            echo
            echo "===== RUN KSU/SUSFS PORT ====="
            # IMPORTANT: the extracted script itself starts with `cd kernel`.
            bash "$RUNNER_TEMP/v98-ksu-susfs.sh"
          } 2>&1 | tee logs/20-ksu-susfs.txt | tee -a setup.log

          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "===== POST-INTEGRATION VERIFY ====="
            if [ -d kernel/drivers/kernelsu ]; then
              echo "OK: kernel/drivers/kernelsu exists"
            else
              echo "MISSING: kernel/drivers/kernelsu"
            fi
            test -f kernel/fs/susfs.c && echo "OK: fs/susfs.c" || echo "MISSING: fs/susfs.c"
            test -f kernel/include/linux/susfs.h && echo "OK: include/linux/susfs.h" || echo "MISSING: include/linux/susfs.h"
            grep -nE 'CONFIG_KSU|CONFIG_KSU_SUSFS' "kernel/arch/arm64/configs/${DEFCONFIG}" 2>/dev/null | tail -100 || true
            find kernel -name '*.rej' -o -name '*.orig' | sort || true
          } 2>&1 | tee -a logs/20-ksu-susfs.txt | tee -a setup.log

          exit 0

      - name: Apply deep ghost uptime V88 safe profile from proven vili workflow
        id: uptime
        shell: bash
        run: |
          set +e
          PROFILE="${{ inputs.ghost_uptime_profile }}"
          MIN_DAYS="${{ inputs.ghost_min_days }}"
          MAX_DAYS="${{ inputs.ghost_max_days }}"

          {
            echo "===== DEEP GHOST UPTIME ====="
            echo "profile=$PROFILE"
            echo "min_days=$MIN_DAYS"
            echo "max_days=$MAX_DAYS"

            if [ "$PROFILE" = "off" ]; then
              echo "Deep ghost uptime disabled."
              exit 0
            fi

            if ! [[ "$MIN_DAYS" =~ ^[0-9]+$ && "$MAX_DAYS" =~ ^[0-9]+$ ]]; then
              echo "ERROR: ghost_min_days/ghost_max_days must be unsigned integers"
              exit 31
            fi
            if [ "$MIN_DAYS" -lt 1 ] || [ "$MAX_DAYS" -lt "$MIN_DAYS" ] || [ "$MAX_DAYS" -gt 3650 ]; then
              echo "ERROR: require 1 <= min_days <= max_days <= 3650"
              exit 32
            fi

            if ! git -C kernel cat-file -e "${V98_COMPAT_COMMIT}^{commit}" 2>/dev/null; then
              git -C kernel fetch --no-tags origin "${V98_COMPAT_COMMIT}" || exit 81
            fi
            git -C kernel show "${V98_COMPAT_COMMIT}:${V98_WORKFLOW_PATH}" > "$RUNNER_TEMP/v98-pinned.yml" || exit 82

            python3 - "$RUNNER_TEMP/v98-pinned.yml" "$RUNNER_TEMP/v98-deep-uptime.sh" <<'PY_EXTRACT_GHOST'
          import sys
          from pathlib import Path
          import yaml

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])
          data = yaml.safe_load(src.read_text())
          steps = data.get("jobs", {}).get("build", {}).get("steps", [])

          wanted = [
              "Port ghost uptime from ssS21 RTC to sm8350",
              "Patch V68 task starttime proc stat sync without MONOTONIC core",
              "Patch V74 FIX3 task starttime safe early-window tighten",
              "Patch V77 process age policy for early userland tasks",
              "Patch V80 proc uptime idle field sync",
              "Patch V82 proc stat output idle jiffies sync",
              "Patch V85 proc softirqs display sync",
              "Patch V88 proc interrupts desc kstat arch timer display sync",
          ]

          by_name = {s.get("name"): s for s in steps if isinstance(s, dict) and s.get("name")}
          missing = [name for name in wanted if name not in by_name]
          if missing:
              raise SystemExit("ERROR: missing pinned deep-uptime steps: " + "; ".join(missing))

          out = [
              "#!/usr/bin/env bash",
              "set -Eeuo pipefail",
              "echo '===== EXTRACTED V88-SAFE DEEP GHOST UPTIME PROFILE ====='",
          ]
          for i, name in enumerate(wanted, 1):
              run = by_name[name].get("run")
              if not isinstance(run, str) or not run.strip():
                  raise SystemExit(f"ERROR: step has no run script: {name}")
              # Every original workflow step starts from $GITHUB_WORKSPACE and many
              # begin with `cd kernel`. Run each extracted step in its own subshell
              # so the previous step's working directory cannot leak into the next.
              out.append("(")
              out.append('cd "$GITHUB_WORKSPACE"')
              out.append(f"echo '===== [{i}/{len(wanted)}] {name} ====='")
              out.append(run)
              out.append(")")
          dst.write_text("\n".join(out) + "\n")
          print("Selected steps:")
          for name in wanted:
              print(" - " + name)
          print(f"Extracted {len(out)} script chunks / {len(dst.read_text().splitlines())} lines")
          PY_EXTRACT_GHOST
            extract_rc=$?
            if [ "$extract_rc" -ne 0 ]; then
              exit "$extract_rc"
            fi

            chmod +x "$RUNNER_TEMP/v98-deep-uptime.sh"
            sha256sum "$RUNNER_TEMP/v98-deep-uptime.sh" | tee logs/31-deep-uptime-script.sha256
            cp "$RUNNER_TEMP/v98-deep-uptime.sh" logs/31-deep-uptime-extracted.sh

            # Each extracted V98 step starts with `cd kernel`, so execute each step
            # from repository root exactly as the proven workflow does.
            bash "$RUNNER_TEMP/v98-deep-uptime.sh"

            echo
            echo "===== OVERRIDE RANDOM GHOST-UPTIME RANGE ====="
            python3 - "$MIN_DAYS" "$MAX_DAYS" <<'PY_RANGE'
          import re
          import sys
          from pathlib import Path

          mn, mx = map(int, sys.argv[1:3])
          p = Path("kernel/include/linux/ghost_uptime.h")
          s = p.read_text(errors="ignore")
          s2, n1 = re.subn(r'#define\s+GHOST_UPTIME_MIN_DAYS\s+\d+ULL', f'#define GHOST_UPTIME_MIN_DAYS        {mn}ULL', s, count=1)
          s3, n2 = re.subn(r'#define\s+GHOST_UPTIME_MAX_DAYS\s+\d+ULL', f'#define GHOST_UPTIME_MAX_DAYS        {mx}ULL', s2, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"ERROR: failed to override ghost day range min={n1} max={n2}")
          p.write_text(s3)
          print(f"Ghost uptime randomized range: {mn}..{mx} days")
          PY_RANGE

            echo
            echo "===== V88-SAFE MARKER VERIFY ====="
            test -f kernel/include/linux/ghost_uptime.h
            grep -q 'arch_sys_boot_offset' kernel/kernel/time/timekeeping.c
            grep -q 'ghost_uptime_proc_task_start_time_ticks' kernel/fs/proc/array.c
            grep -q 'Vili CI V80' kernel/fs/proc/uptime.c
            grep -q 'Vili CI V82' kernel/fs/proc/stat.c
            grep -q 'Vili CI V85' kernel/fs/proc/softirqs.c
            grep -q 'Vili CI V88' kernel/kernel/irq/proc.c

            # Explicitly reject later risky experiments. V88-safe intentionally keeps
            # global MONOTONIC/RAW, sched_clock/local_clock and V92 vDSO basetime untouched.
            if grep -RqsE 'Vili CI V91A|Vili CI V92|ghost_uptime_posix_clock_ts64|ghost_uptime_vdso_shift_ts' \
              kernel/kernel/time/posix-timers.c kernel/kernel/time/vsyscall.c 2>/dev/null; then
              echo "ERROR: risky post-V88 ghost clock patch detected"
              exit 33
            fi

            grep -nE 'GHOST_UPTIME_(MIN|MAX)_DAYS' kernel/include/linux/ghost_uptime.h
            echo
            echo "===== NON-FATAL DIFF WHITESPACE CHECK ====="
            if ! git -C kernel diff --check; then
              echo "WARN: git diff --check found whitespace introduced by the compatibility patches; this is diagnostic only and will not block config/build."
            fi
            true
          } 2>&1 | tee logs/30-uptime.txt | tee -a setup.log

          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate and audit final kernel config
        id: config
        if: steps.ksu_susfs.outputs.rc == '0' && steps.uptime.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          cd kernel
          export PATH="$HOME/.cache/weebx-clang/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          {
            echo "===== DEFCONFIG BUILD ====="
            make O=out ARCH=arm64 "${DEFCONFIG}"
            cfg_rc=$?
            if [ "$cfg_rc" -ne 0 ]; then
              echo "ERROR: make ${DEFCONFIG} failed rc=$cfg_rc"
              exit "$cfg_rc"
            fi

            echo
            echo "===== REQUIRED CONFIG ====="
            grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KPROBES|CONFIG_LTO)|^# CONFIG_KSU' out/.config | sort || true

            grep -q '^CONFIG_KSU=y$' out/.config || { echo "ERROR: CONFIG_KSU is not y"; exit 41; }
            grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config || { echo "ERROR: CONFIG_KSU_MANUAL_HOOK is not y"; exit 42; }
            grep -q '^CONFIG_KSU_SUSFS=y$' out/.config || { echo "ERROR: CONFIG_KSU_SUSFS is not y"; exit 43; }

            cp out/.config ../logs/final.config
            sha256sum out/.config
          } 2>&1 | tee ../logs/40-config.txt | tee -a ../setup.log

          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build kernel
        id: build_kernel
        if: steps.config.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          cd kernel
          export PATH="$HOME/.cache/weebx-clang/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out ARCH=arm64 -j"$(nproc)" \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            V=0 2>&1 | tee ../build.log

          rc=${PIPESTATUS[0]}

          if [ "$rc" -eq 0 ]; then
            IMAGE="out/arch/arm64/boot/Image"
            if [ ! -s "$IMAGE" ]; then
              echo "ERROR: build returned 0 but Image is missing/empty" | tee -a ../build.log
              rc=61
            else
              cp -v "$IMAGE" ../artifacts/Image | tee -a ../build.log
              gzip -c -9 "$IMAGE" > ../artifacts/Image.gz
              sha256sum ../artifacts/Image ../artifacts/Image.gz | tee ../artifacts/SHA256SUMS.txt
            fi
          fi

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create DerpFest Android 16 AnyKernel3 flashable ZIP
        id: package_ak3
        if: steps.build_kernel.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          {
            echo "===== CREATE DERPFEST ANYKERNEL3 ZIP ====="
            AK3_DIR="$RUNNER_TEMP/AnyKernel3-vili"
            ZIP_NAME="vili-DerpFest16.2-KSUN-SUSFS-GhostUptime-${GITHUB_RUN_NUMBER}.zip"
            rm -rf "$AK3_DIR"

            git clone --no-checkout https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR"
            git -C "$AK3_DIR" fetch --depth=1 origin "$AK3_REF"
            git -C "$AK3_DIR" checkout --detach FETCH_HEAD
            test "$(git -C "$AK3_DIR" rev-parse HEAD)" = "$AK3_REF"
            echo "AnyKernel3 commit=$(git -C "$AK3_DIR" rev-parse HEAD)"

            # Keep LICENSE in the redistributable ZIP. Remove only repository/dev files.
            rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md" \
              "$AK3_DIR/ramdisk" "$AK3_DIR/patch" "$AK3_DIR/vendor_ramdisk" "$AK3_DIR/vendor_patch"

            cat > "$AK3_DIR/anykernel.sh" <<'EOF_AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## Target: Xiaomi 11T Pro (vili), DerpFest 16.2 / Android 16

          properties() { '
          kernel.string=KangarooX vili - DerpFest 16.2 A16 - KernelSU-Next + SuSFS + Deep Ghost Uptime
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=Xiaomi 11T Pro
          device.name3=2107113SG
          device.name4=2107113SI
          device.name5=2107113SR
          supported.versions=16 - 16
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # vili is slot-based. AnyKernel3 appends the active slot suffix automatically.
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          # Preserve DerpFest's existing ramdisk/header/boot parameters; replace only kernel.
          dump_boot;
          write_boot;
          EOF_AK3

            if [ -s artifacts/Image.gz ]; then
              cp artifacts/Image.gz "$AK3_DIR/Image.gz"
            elif [ -s artifacts/Image ]; then
              cp artifacts/Image "$AK3_DIR/Image"
            else
              echo "ERROR: no kernel Image/Image.gz available for AnyKernel3"
              exit 71
            fi

            cat > artifacts/README-FLASH-DERPFEST.txt <<EOF_README
          Target ROM:
            ${ROM_BUILD}
            ${ROM_PACKAGE_URL}

          Device:
            Xiaomi 11T Pro / vili

          Flash:
            1. Backup boot partition in TWRP first.
            2. Flash ${ZIP_NAME}.
            3. Reboot system.
            4. If bootloop, restore the original boot backup from TWRP.

          AnyKernel3 behavior:
            - writes active boot slot only
            - preserves current DerpFest ramdisk and boot parameters
            - does not replace vendor_boot/dtbo/vendor_dlkm
            - does not install kernel modules
          EOF_README

            mkdir -p artifacts/flashable
            (cd "$AK3_DIR" && zip -r9 "$RUNNER_TEMP/$ZIP_NAME" . -x '*.git*')
            mv "$RUNNER_TEMP/$ZIP_NAME" "artifacts/flashable/$ZIP_NAME"

            echo "===== ANYKERNEL3 PREFLIGHT ====="
            unzip -l "artifacts/flashable/$ZIP_NAME" | tee logs/70-anykernel-filelist.txt
            unzip -l "artifacts/flashable/$ZIP_NAME" | grep -qE '[[:space:]]Image(\.gz)?$'
            unzip -p "artifacts/flashable/$ZIP_NAME" anykernel.sh | grep -q '^BLOCK=/dev/block/bootdevice/by-name/boot;'
            unzip -p "artifacts/flashable/$ZIP_NAME" anykernel.sh | grep -q '^IS_SLOT_DEVICE=auto;'
            unzip -p "artifacts/flashable/$ZIP_NAME" anykernel.sh | grep -q '^supported.versions=16 - 16$'
            unzip -l "artifacts/flashable/$ZIP_NAME" | grep -qE '[[:space:]]LICENSE$'
            if unzip -p "artifacts/flashable/$ZIP_NAME" anykernel.sh | grep -qE '^(block|is_slot_device|ramdisk_compression|patch_vbmeta_flag)='; then
              echo "ERROR: legacy lowercase AnyKernel3 variables detected"
              exit 72
            fi

            sha256sum "artifacts/flashable/$ZIP_NAME" | tee artifacts/flashable/SHA256SUMS.txt
            echo "flashable_zip=$ZIP_NAME"
          } 2>&1 | tee logs/70-anykernel3.txt | tee -a build.log

          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate ChatGPT-readable diagnostics
        if: always()
        shell: bash
        env:
          KSU_SUSFS_RC: ${{ steps.ksu_susfs.outputs.rc }}
          UPTIME_RC: ${{ steps.uptime.outputs.rc }}
          CONFIG_RC: ${{ steps.config.outputs.rc }}
          BUILD_RC: ${{ steps.build_kernel.outputs.rc }}
          AK3_RC: ${{ steps.package_ak3.outputs.rc }}
        run: |
          set +e
          mkdir -p logs artifacts

          # Keep the complete source diff, including generated KSU/SuSFS integration.
          if [ -d kernel/.git ]; then
            git -C kernel status --short > logs/55-git-status.txt 2>&1 || true
            git -C kernel diff --binary > logs/56-git-diff.patch 2>&1 || true
            find kernel -name '*.rej' -print -exec sh -c 'echo "===== $1 ====="; cat "$1"' _ {} \; \
              > logs/57-rejects.txt 2>&1 || true
          fi

          grep -Ein '(^|[^a-z])(error:|fatal:|undefined reference|ld\.lld: error|No rule to make target|FAILED:|patch.*FAILED|Hunk #[0-9]+ FAILED)' \
            setup.log build.log > logs/50-errors.txt 2>/dev/null || true

          grep -Ein '(^|[^a-z])(warning:|WARN:|deprecated|unused|mismatch)' \
            setup.log build.log > logs/51-warnings.txt 2>/dev/null || true

          {
            echo "===== OUTPUT FILES ====="
            find artifacts -maxdepth 2 -type f -printf '%p\t%s bytes\n' | sort || true
            echo
            if [ -f artifacts/SHA256SUMS.txt ]; then
              cat artifacts/SHA256SUMS.txt
            fi
          } > logs/60-artifacts.txt

          {
            echo "# Kernel Build Report for ChatGPT"
            echo
            echo "## Result codes"
            echo "- KSU/SuSFS integration: ${KSU_SUSFS_RC:-not-run}"
            echo "- Uptime patch: ${UPTIME_RC:-not-run}"
            echo "- Config: ${CONFIG_RC:-not-run}"
            echo "- Kernel build: ${BUILD_RC:-not-run}"
            echo "- AnyKernel3 package: ${AK3_RC:-not-run}"
            echo
            echo "## Requested build"
            echo "- Device: ${DEVICE_NAME} (${DEVICE})"
            echo "- ROM target: ${ROM_TARGET}"
            echo "- Kernel ref: ${{ inputs.kernel_ref }}"
            echo "- Defconfig: ${DEFCONFIG}"
            echo "- KernelSU-Next: ${KSU_REF}"
            echo "- SuSFS: ${SUSFS_REF}"
            echo "- ROM build: ${ROM_BUILD}"
            echo "- ROM package: ${ROM_PACKAGE_URL}"
            echo "- Ghost uptime profile: ${{ inputs.ghost_uptime_profile }}"
            echo "- Ghost uptime range: ${{ inputs.ghost_min_days }}..${{ inputs.ghost_max_days }} days"
            echo "- AnyKernel3 ref: ${AK3_REF}"
            echo "- V98 compatibility commit: ${V98_COMPAT_COMMIT}"
            echo
            echo "## Source"
            if [ -d kernel/.git ]; then
              echo '- HEAD:' "$(git -C kernel rev-parse HEAD 2>/dev/null || true)"
              echo '- Describe:' "$(git -C kernel describe --always --dirty 2>/dev/null || true)"
            fi
            echo
            echo "## Toolchain"
            "$HOME/.cache/weebx-clang/clang/bin/clang" --version 2>/dev/null | head -3 || true
            echo
            echo "## First 200 detected errors"
            echo '```text'
            head -200 logs/50-errors.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## First 200 warnings"
            echo '```text'
            head -200 logs/51-warnings.txt 2>/dev/null || true
            echo '```'
            echo
            echo "## Files to send back to ChatGPT"
            echo "1. chatgpt-build-report.md"
            echo "2. 50-errors.txt"
            echo "3. build.log"
            echo "4. setup.log"
            echo "5. 56-git-diff.patch (when patch/integration fails)"
            echo "6. 57-rejects.txt (when non-empty)"
            echo "7. 70-anykernel3.txt (when packaging fails)"
          } > logs/chatgpt-build-report.md

          cp setup.log logs/setup.log 2>/dev/null || true
          cp build.log logs/build.log 2>/dev/null || true

      - name: Upload kernel images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vili-derpfest16-ksu-susfs-ghost-anykernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ChatGPT diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vili-derpfest16-chatgpt-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Final build gate
        if: always()
        shell: bash
        env:
          KSU_SUSFS_RC: ${{ steps.ksu_susfs.outputs.rc }}
          UPTIME_RC: ${{ steps.uptime.outputs.rc }}
          CONFIG_RC: ${{ steps.config.outputs.rc }}
          BUILD_RC: ${{ steps.build_kernel.outputs.rc }}
          AK3_RC: ${{ steps.package_ak3.outputs.rc }}
        run: |
          set -Eeuo pipefail
          fail=0

          check_rc() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "FAIL: $name did not run or produced no result code"
              fail=1
            elif [ "$value" != "0" ]; then
              echo "FAIL: $name rc=$value"
              fail=1
            else
              echo "PASS: $name"
            fi
          }

          check_rc "KSU/SuSFS integration" "${KSU_SUSFS_RC:-}"
          check_rc "uptime patch" "${UPTIME_RC:-}"
          check_rc "config" "${CONFIG_RC:-}"
          check_rc "kernel build" "${BUILD_RC:-}"
          check_rc "AnyKernel3 package" "${AK3_RC:-}"

          if [ "$fail" -ne 0 ]; then
            echo
            echo "Build failed. Download artifact 'vili-derpfest16-chatgpt-logs-*' and send chatgpt-build-report.md + 50-errors.txt + build.log + setup.log."
            exit 1
          fi

          echo "Build completed successfully."
