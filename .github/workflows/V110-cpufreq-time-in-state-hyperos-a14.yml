              marker,
              'static u64 vili_ghost_cpufreq_time_in_state(int index, u64 time)',
              'u64 shown_ticks = nsec_to_clock_t(time);',
              'add_ticks = nsec_to_clock_t(ghost_uptime_offset_ns());',
              'vili_ghost_cpufreq_time_in_state(i, time)',
              'unsigned long long cur_time = local_clock();',
