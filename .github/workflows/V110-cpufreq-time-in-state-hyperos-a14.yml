          echo "===== V109 SYSINFO UPTIME SINGLE-OFFSET FIX =====" | tee -a ../setup.log
          echo "Starting point: V108 boot and audio PASS with cpuidle concealment confirmed." | tee -a ../setup.log
          echo "V108 runtime evidence: uptime was about 36 days while PID starttime and cpuidle were about 18 days." | tee -a ../setup.log
          echo "Correct only sysinfo.uptime: ktime_get_boottime_ts64() already follows the V61 shifted TK_OFFS_BOOT path." | tee -a ../setup.log
          echo "Do not change vDSO, clocks, scheduler, cpuidle accounting, cpufreq accounting or non-time sysinfo fields." | tee -a ../setup.log

          python3 - <<'PY_V109_SYSINFO_SINGLE_OFFSET'
          from pathlib import Path

          path = Path('kernel/sys.c')
          text = path.read_text()

          old_helper = r'''/*
           * Vili CI V106: sysinfo(2) uptime readout sync only.
           * Keep the kernel's real boot clock intact and shift only the public
           * struct sysinfo.uptime field. All other sysinfo fields remain real.
           */
          static long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)
          {
          	u64 real_sec;
          	u64 off_sec = ghost_uptime_offset_sec();

          	if (tp->tv_sec < 0)
          		return 0;
          	real_sec = (u64)tp->tv_sec;
          	if (tp->tv_nsec) {
          		if (real_sec == (u64)LONG_MAX)
          			return LONG_MAX;
          		real_sec++;
          	}
          	if (off_sec > (u64)LONG_MAX - real_sec)
          		return LONG_MAX;
          	return (long)(real_sec + off_sec);
          }

          '''
          new_helper = r'''/*
           * Vili CI V109: sysinfo(2) consumes shifted BOOTTIME exactly once.
           * ktime_get_boottime_ts64() reaches ktime_get_with_offset(TK_OFFS_BOOT),
           * whose V61 read path already applies ghost_uptime_offset_ns(). Do not
           * add ghost_uptime_offset_sec here a second time. Other sysinfo fields
           * remain unchanged.
           */
          static long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)
          {
          	u64 shown_sec;

          	if (tp->tv_sec < 0)
          		return 0;
          	shown_sec = (u64)tp->tv_sec;
          	if (tp->tv_nsec) {
          		if (shown_sec == (u64)LONG_MAX)
          			return LONG_MAX;
          		shown_sec++;
          	}
          	return (long)shown_sec;
          }

          '''

          marker = 'Vili CI V109: sysinfo(2) consumes shifted BOOTTIME exactly once.'
          assignment = 'info->uptime = vili_ghost_sysinfo_uptime(&tp);'
          if marker in text:
              raise SystemExit('ERROR: V109 sysinfo consistency fix was unexpectedly present before this step')
          if text.count(old_helper) != 1:
              raise SystemExit(
                  f'ERROR: V106 sysinfo helper count is {text.count(old_helper)}, expected 1')
          if text.count(assignment) != 1:
              raise SystemExit(
                  f'ERROR: sysinfo helper assignment count is {text.count(assignment)}, expected 1')

          text = text.replace(old_helper, new_helper, 1)

          start = text.index(marker)
          end = text.index('/**\n * do_sysinfo - fill in sysinfo struct', start)
          helper_span = text[start:end]
          if 'ghost_uptime_offset_sec()' in helper_span:
              raise SystemExit('ERROR: V109 sysinfo helper still adds a second ghost offset')
          for retained in (
              assignment,
              'ktime_get_boottime_ts64(&tp);',
              'get_avenrun(info->loads, 0, SI_LOAD_SHIFT - FSHIFT);',
              'info->procs = nr_threads;',
              'si_meminfo(info);',
              'si_swapinfo(info);',
          ):
              if retained not in text:
                  raise SystemExit(f'ERROR: required sysinfo code missing after V109: {retained}')

          path.write_text(text)
          print('V109 sysinfo single-offset consistency fix applied.')
          PY_V109_SYSINFO_SINGLE_OFFSET

          if ! grep -q 'Vili CI V61: CLOCK_BOOTTIME API + VDSO sync' kernel/time/timekeeping.c; then
