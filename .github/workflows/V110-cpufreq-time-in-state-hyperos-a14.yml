            printf '\n# Vili CI V96: sched_clock/local_clock readout probe only\nobj-y += ghost_sched_clock_probe.o\n' >> fs/proc/Makefile
          fi

          echo "===== V96 VERIFY SOURCE =====" | tee -a ../setup.log
          grep -RnsE 'Vili CI V96|ghost_sched_clock_probe|sched_clock\(|local_clock\(|ktime_get_ns|ktime_get_boottime_ns|ktime_get_raw_ns|proc_create_single' fs/proc/ghost_sched_clock_probe.c fs/proc/Makefile 2>/dev/null | head -220 | tee -a ../setup.log || true

          if ! grep -q 'proc_create_single("ghost_sched_clock_probe"' fs/proc/ghost_sched_clock_probe.c; then
            echo "ERROR: V96 proc entry creation missing" | tee -a ../setup.log
            exit 1
          fi
          if grep -Rqs 'Vili CI V96' kernel/sched kernel/time kernel/printk arch/arm64 drivers/clocksource 2>/dev/null; then
            echo "ERROR: V96 marker leaked into forbidden core files" | tee -a ../setup.log
            grep -Rns 'Vili CI V96' kernel/sched kernel/time kernel/printk arch/arm64 drivers/clocksource 2>/dev/null | tee -a ../setup.log || true
            exit 1
          fi

          echo "V96 sched_clock/local_clock readout probe patch OK" | tee -a ../setup.log
      

      - name: Mark V75 process age audit baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          echo "===== V75 PROCESS AGE AUDIT BASELINE =====" | tee -a ../setup.log
          echo "V75 intentionally keeps V74 FIX3 kernel behavior unchanged. It is a deeper validation step focused on process-age surfaces: /proc/[pid]/stat field22, toybox ps output, pid lifetimes, and Android core/app process consistency." | tee -a ../setup.log
          echo "No CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, scheduler core, hrtimer core, local_clock, sched_clock, ktime_get(), or timekeeping_get_delta changes." | tee -a ../setup.log

      - name: Cache WeebX Clang
        uses: actions/cache@v4
        with:
          path: ~/.cache/weebx-clang
          key: weebx-clang-${{ runner.os }}-v2

      - name: Setup WeebX Clang
        shell: bash
        run: |
          set -Eeuo pipefail
          CLANG_DIR="$HOME/.cache/weebx-clang/clang"
          TMP_DIR="$RUNNER_TEMP/weebx-clang"
          mkdir -p "$CLANG_DIR" "$TMP_DIR"

          echo "===== WEEBX CLANG SETUP =====" | tee -a setup.log
          echo "Toolchain cache dir: $CLANG_DIR" | tee -a setup.log

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            rm -rf "$CLANG_DIR" "$TMP_DIR"
            mkdir -p "$CLANG_DIR" "$TMP_DIR/extract"

            CLANG_URL="$(curl -fsSL https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt | tr -d '\r\n')"
            if [ -z "$CLANG_URL" ]; then
              echo "ERROR: empty WeebX Clang URL" | tee -a setup.log
              exit 1
            fi

            echo "Downloading: $CLANG_URL" | tee -a setup.log
            curl -L --fail --retry 10 --retry-all-errors --retry-delay 5 "$CLANG_URL" -o "$TMP_DIR/clang.tar.gz" 2>&1 | tee -a setup.log
            tar -xf "$TMP_DIR/clang.tar.gz" -C "$TMP_DIR/extract" 2>&1 | tee -a setup.log

            # WeebX release may ship clang as bin/clang-20 instead of bin/clang.
            # Find either layout, then normalize the installed toolchain below.
            CLANG_BIN="$(find "$TMP_DIR/extract" -type f \( -path '*/bin/clang' -o -path '*/bin/clang-[0-9]*' \) -print | sort -V | tail -n 1 || true)"
            if [ -z "$CLANG_BIN" ]; then
              echo "ERROR: clang/clang-N binary not found inside archive" | tee -a setup.log
              echo "===== FIRST 250 FILES IN TOOLCHAIN ARCHIVE =====" | tee -a setup.log
              find "$TMP_DIR/extract" -maxdepth 4 -type f | head -250 | tee -a setup.log || true
              exit 1
            fi

            chmod +x "$CLANG_BIN" || true
            CLANG_ROOT="$(dirname "$(dirname "$CLANG_BIN")")"
            echo "Detected clang binary: $CLANG_BIN" | tee -a setup.log
            echo "Detected clang root: $CLANG_ROOT" | tee -a setup.log
            cp -a "$CLANG_ROOT"/. "$CLANG_DIR"/
          fi

          mkdir -p "$CLANG_DIR/bin"
          chmod -R u+rx "$CLANG_DIR/bin" || true

          cd "$CLANG_DIR/bin"

          # Normalize common binary names expected by Android kernel Makefiles.
          if [ ! -x clang ]; then
            CAND="$(find . -maxdepth 1 -type f -name 'clang-[0-9]*' -print | sort -V | tail -n 1 || true)"
            if [ -n "$CAND" ]; then
              ln -sf "${CAND#./}" clang
            fi
          fi

          if [ ! -x clang++ ]; then
            CXX_CAND="$(find . -maxdepth 1 -type f -name 'clang++-[0-9]*' -print | sort -V | tail -n 1 || true)"
            if [ -n "$CXX_CAND" ]; then
              ln -sf "${CXX_CAND#./}" clang++
            elif [ -x clang ]; then
              ln -sf clang clang++
            fi
          fi

          if [ ! -x ld.lld ] && [ -x lld ]; then
            ln -sf lld ld.lld
          fi

          # Some custom clang archives include GNU-style names but not every LLVM alias.
          [ ! -x llvm-strip   ] && [ -x strip   ] && ln -sf strip   llvm-strip   || true
          [ ! -x llvm-objcopy ] && [ -x objcopy ] && ln -sf objcopy llvm-objcopy || true
          [ ! -x llvm-objdump ] && [ -x objdump ] && ln -sf objdump llvm-objdump || true
          [ ! -x llvm-readelf ] && [ -x readelf ] && ln -sf readelf llvm-readelf || true
          [ ! -x llvm-ar      ] && [ -x ar      ] && ln -sf ar      llvm-ar      || true
          [ ! -x llvm-nm      ] && [ -x nm      ] && ln -sf nm      llvm-nm      || true

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            echo "ERROR: clang still not executable after compatibility symlink setup" | tee -a ../../setup.log
            echo "===== TOOLCHAIN BIN DIR =====" | tee -a ../../setup.log
            ls -lah "$CLANG_DIR/bin" | tee -a ../../setup.log || true
            exit 1
          fi

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

          echo "" | tee -a ../../setup.log
          echo "===== CLANG VERSION =====" | tee -a ../../setup.log
          "$CLANG_DIR/bin/clang" --version | tee -a ../../setup.log
          echo "" | tee -a ../../setup.log
          echo "===== NORMALIZED TOOLCHAIN BINARIES =====" | tee -a ../../setup.log
          ls -lah "$CLANG_DIR/bin" | grep -E 'clang|lld|llvm-|aarch64|arm-linux' | head -250 | tee -a ../../setup.log || true

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-vili-hyperos-a14-v110-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-vili-hyperos-a14-v110-${{ github.ref_name }}-
            ccache-vili-hyperos-a14-

      - name: Prepare defconfig
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          export PATH="$CLANG_DIR/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export KBUILD_BUILD_USER="$KBUILD_BUILD_USER"
          export KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST"
          export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_TIMESTAMP"
          export SOURCE_DATE_EPOCH="$KERNEL_SOURCE_DATE_EPOCH"
          ccache -M 5G || true
          ccache -z || true

          MAKE_ARGS=(
            O="$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            HOSTCC="ccache clang"
            HOSTCXX="ccache clang++"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            AR=llvm-ar
            NM=llvm-nm
            LD=ld.lld
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
          )

          echo "===== MAKE ${DEFCONFIG} =====" | tee -a ../build.log
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          make "${MAKE_ARGS[@]}" "$DEFCONFIG" 2>&1 | tee -a ../build.log
          test -f "$OUT_DIR/.config"

          echo "" | tee -a ../build.log
          echo "===== CONFIG AFTER DEFCONFIG =====" | tee -a ../build.log
          grep -nE "CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_BUILD_ARM64_DT_OVERLAY|CONFIG_KSU|CONFIG_KERNELSU|CONFIG_SUSFS|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_LTO" "$OUT_DIR/.config" | tee -a ../build.log || true

          echo "" | tee -a ../build.log
          if [ "${ENABLE_KERNELSU}" = "true" ]; then
            echo "" | tee -a ../build.log
            echo "===== FORCE KERNELSU MANUAL-HOOK CONFIG BEFORE OLDDEFCONFIG =====" | tee -a ../build.log
            if [ -x scripts/config ]; then
              scripts/config --file "$OUT_DIR/.config" \
                -e KSU \
                -e KSU_MANUAL_HOOK \
                -d KSU_KPROBES_HOOK \
                -d KSU_DEBUG \
                -e KSU_SUSFS \
                -d KSU_SUSFS_SUS_KSTAT \
                -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                -e KSU_SUSFS_SUS_SU \
                -e KSU_SUSFS_OPEN_REDIRECT \
                -d KSU_SUSFS_ENABLE_LOG || true
            else
              sed -i '/CONFIG_KSU/d;/CONFIG_KERNELSU/d' "$OUT_DIR/.config" 2>/dev/null || true
              printf '%s\n' \
                'CONFIG_KSU=y' \
                'CONFIG_KSU_MANUAL_HOOK=y' \
                '# CONFIG_KSU_KPROBES_HOOK is not set' \
                '# CONFIG_KSU_DEBUG is not set' \
                '# CONFIG_KSU_SUSFS_SUS_KSTAT is not set' \
                'CONFIG_KSU_SUSFS_SUS_SU=y' \
                '# CONFIG_KSU_SUSFS_ENABLE_LOG is not set' \
                >> "$OUT_DIR/.config"
            fi
            grep -nE "CONFIG_KSU|CONFIG_KERNELSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS" "$OUT_DIR/.config" | tee -a ../build.log || true
          fi

          echo "===== OLDDEFCONFIG =====" | tee -a ../build.log
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a ../build.log

          if [ "${ENABLE_KERNELSU}" = "true" ] && [ -x scripts/config ]; then
            echo "" | tee -a ../build.log
            echo "===== FORCE DISABLE SUSFS SUS_KSTAT AFTER OLDDEFCONFIG V61 =====" | tee -a ../build.log
            scripts/config --file "$OUT_DIR/.config" -d KSU_SUSFS_SUS_KSTAT || true
            make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a ../build.log
          fi

          echo "" | tee -a ../build.log
          echo "===== CONFIG AFTER OLDDEFCONFIG V61 =====" | tee -a ../build.log
          grep -nE "CONFIG_KSU|CONFIG_KERNELSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS" "$OUT_DIR/.config" | tee -a ../build.log || true
          if [ "${ENABLE_KERNELSU}" = "true" ]; then
            if ! grep -q '^CONFIG_KSU=y' "$OUT_DIR/.config"; then
              echo "ERROR: CONFIG_KSU=y missing in final .config" | tee -a ../build.log
              echo "===== KernelSU Kconfig =====" | tee -a ../build.log
              sed -n '1,220p' drivers/kernelsu/Kconfig | tee -a ../build.log || true
              exit 1
            fi
            if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$OUT_DIR/.config"; then
              echo "ERROR: CONFIG_KSU_MANUAL_HOOK=y missing in final .config" | tee -a ../build.log
              echo "This kernel already has manual KernelSU hooks, so KPROBES mode is not the target." | tee -a ../build.log
              echo "===== KernelSU Kconfig =====" | tee -a ../build.log
              sed -n '1,260p' drivers/kernelsu/Kconfig | tee -a ../build.log || true
              exit 1
            fi
            if grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y' "$OUT_DIR/.config"; then
              echo "ERROR: CONFIG_KSU_SUSFS_SUS_KSTAT must be disabled in V61 to avoid 1970 stat artifacts" | tee -a ../build.log
              grep -nE "CONFIG_KSU_SUSFS_SUS_KSTAT|CONFIG_KSU_SUSFS|CONFIG_KSU" "$OUT_DIR/.config" | tee -a ../build.log || true
              exit 1
            fi
            if ! grep -q '^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' "$OUT_DIR/.config"; then
              echo "ERROR: CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y missing in final .config" | tee -a ../build.log
              grep -nE "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS|CONFIG_KSU_SUSFS|CONFIG_KSU" "$OUT_DIR/.config" | tee -a ../build.log || true
              echo "===== KernelSU Kconfig HIDE_SYMBOLS block =====" | tee -a ../build.log
              grep -nA8 -B4 "config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS" drivers/kernelsu/Kconfig | tee -a ../build.log || true
              exit 1
            fi
            if ! grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$OUT_DIR/.config"; then
              echo "ERROR: CONFIG_KSU_SUSFS_OPEN_REDIRECT=y missing in final .config" | tee -a ../build.log
              grep -nE "CONFIG_KSU_SUSFS_OPEN_REDIRECT|CONFIG_KSU_SUSFS|CONFIG_KSU" "$OUT_DIR/.config" | tee -a ../build.log || true
              echo "===== KernelSU Kconfig OPEN_REDIRECT block =====" | tee -a ../build.log
              grep -nA8 -B4 "config KSU_SUSFS_OPEN_REDIRECT" drivers/kernelsu/Kconfig | tee -a ../build.log || true
              exit 1
            fi
            if ! grep -q '^CONFIG_KSU_SUSFS_SUS_SU=y' "$OUT_DIR/.config"; then
              echo "ERROR: CONFIG_KSU_SUSFS_SUS_SU=y missing in final .config" | tee -a ../build.log
              echo "V42 requires SUS_SU, OPEN_REDIRECT, and HIDE_SYMBOLS enabled after config forcing. Check drivers/kernelsu/Kconfig and fs/Makefile registration." | tee -a ../build.log
              grep -nE "CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_SUSFS_SUS_SU|CONFIG_KSU_KPROBES_HOOK|CONFIG_KSU_MANUAL_HOOK" "$OUT_DIR/.config" | tee -a ../build.log || true
              echo "===== KernelSU Kconfig SUS_SU block =====" | tee -a ../build.log
              grep -nA8 -B4 "config KSU_SUSFS_SUS_SU" drivers/kernelsu/Kconfig | tee -a ../build.log || true
              exit 1
            fi
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          export PATH="$CLANG_DIR/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export KBUILD_BUILD_USER="$KBUILD_BUILD_USER"
          export KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST"
          export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_TIMESTAMP"
          export SOURCE_DATE_EPOCH="$KERNEL_SOURCE_DATE_EPOCH"

          MAKE_ARGS=(
            O="$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            HOSTCC="ccache clang"
            HOSTCXX="ccache clang++"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            AR=llvm-ar
            NM=llvm-nm
            LD=ld.lld
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
          )

          JOBS="$(nproc --all)"
          echo "===== BUILD KERNEL IMAGE =====" | tee -a ../build.log
          echo "Jobs: $JOBS" | tee -a ../build.log
          echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" | tee -a ../build.log
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" | tee -a ../build.log
          make "${MAKE_ARGS[@]}" -j"$JOBS" Image.gz 2>&1 | tee -a ../build.log

          echo "" | tee -a ../build.log
          echo "===== BUILD MODULES OPTIONAL =====" | tee -a ../build.log
          if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then
            make "${MAKE_ARGS[@]}" -j"$JOBS" modules 2>&1 | tee -a ../build.log
          else
            echo "CONFIG_MODULES is not enabled in final .config; skipping make modules." | tee -a ../build.log
          fi

          echo "" | tee -a ../build.log
          echo "===== BUILD DTBS OPTIONAL =====" | tee -a ../build.log
          make "${MAKE_ARGS[@]}" -j"$JOBS" dtbs 2>&1 | tee -a ../build.log || true

          echo "" | tee -a ../build.log
          echo "===== BUILD DTBO.IMG OPTIONAL =====" | tee -a ../build.log
          echo "Skipping make dtbo.img on GitHub Actions because this kernel tree calls python2 for mkdtimg." | tee -a ../build.log
          echo "DTB/DTBO inspection files are still collected from out/arch/arm64/boot/dts." | tee -a ../build.log

          echo "" | tee -a ../build.log
          echo "===== BUILD OUTPUT QUICK LIST =====" | tee -a ../build.log
          find "$OUT_DIR/arch/arm64/boot" -maxdepth 4 -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \) \
            -printf '%p  %s bytes\n' | sort | tee -a ../build.log || true

          echo "" | tee -a ../build.log
          echo "===== CCACHE STATS =====" | tee -a ../build.log
          ccache -s | tee -a ../build.log || true

      - name: Prepare V110 diagnostics and runtime tools
        shell: bash
        run: |
          set -Eeuo pipefail
          DIAG=V110-diagnostics
          TOOLS=V110-tools
          rm -rf "$DIAG" "$TOOLS"
          mkdir -p "$DIAG/patched-source" "$TOOLS"

          echo "===== V110 BUILD DIAGNOSTICS =====" | tee -a setup.log
          {
            echo "workflow_marker=V110_HYPEROS_A14_CPUFREQ_TIME_IN_STATE_READOUT"
            echo "kernel_source_commit=${KERNEL_SOURCE_COMMIT}"
            echo "kernelsu_commit=${KSU_COMMIT}"
            echo "susfs_commit=${SUSFS_COMMIT}"
            echo "audio_source_commit=${AUDIO_COMPAT_SOURCE_COMMIT}"
            echo "vdso_stage=${VDSO_STAGE}"
            echo "current_layer=cpufreq_time_in_state_sysfs_readout"
            echo "base_boot_result=V108_BOOT_AUDIO_PASS"
            echo "retained_layers=V109_SYSINFO_SINGLE_OFFSET,V108_CPUIDLE_SYSFS_TIME_READOUT"
            echo "runtime_result=CPUFREQ_REAL_BOOT_AGE_LEAK_CONFIRMED_ACROSS_TWO_REPORTS"
            echo "rom=${ROM_TARGET}"
          } >"$DIAG/source-pins.txt"

          cat >"$DIAG/V110-runtime-analysis.txt" <<'EOF_V110_RUNTIME_ANALYSIS'
          Inputs:
          - V108-noroot-uptime-audit-20260819-094543.txt
          - V108-noroot-uptime-audit-20260819-101539.txt
          - V109 GitHub Actions build logs

          Confirmed observations:
          - The audit ran as untrusted_app UID 10302, so /proc/uptime, /proc/stat btime,
            dumpsys and several proc/debug surfaces were denied. This is a visibility limit
            of that app UID, not evidence that those surfaces disappeared globally.
          - The reports were captured about 1,796 seconds apart on the same boot. The
            uptime text and /proc/self/stat axis advanced by the same interval.
          - First-report uptime showed about 36 days while /proc/self/stat and V108
            cpuidle were near 1,555,600 seconds on the single-offset axis. This remains
            V108 evidence; neither report used the V109 audit tool after a confirmed reboot.
          - V108 cpuidle totals were about 1,555,501 to 1,555,573 seconds per CPU, confirming
            that the V108 cpuidle readout layer is active and consistent with the fake axis.
          - cpufreq time_in_state policy totals rose from about 439.29 seconds to about
            2,235.42 seconds, a delta of about 1,796.13 seconds. It therefore tracks real
            runtime and remains far below the exposed ghost axis.

          V110 scope:
          - drivers/cpufreq/cpufreq_stats.c stores real nanoseconds using local_clock().
          - V110 preserves that accounting and changes only show_time_in_state(). The
            existing random ghost offset is converted with nsec_to_clock_t() and added to
            index zero, so the public per-policy sum moves onto the ghost-uptime axis once.
          - total_trans, trans_table, reset handling, policy selection, governor, vDSO,
            scheduler, clocks, V109 sysinfo, V108 cpuidle and audio sources remain unchanged.
          EOF_V110_RUNTIME_ANALYSIS

          git -C kernel status --short --untracked-files=no >"$DIAG/git-status-tracked.txt" || true
          git -C kernel diff --stat >"$DIAG/source-diff.stat.txt" || true
          git -C kernel diff --no-ext-diff >"$DIAG/source-diff.patch" || true
          sha256sum \
            kernel/lib/vdso/gettimeofday.c \
            kernel/kernel/time/vsyscall.c \
            kernel/kernel/sys.c \
            kernel/drivers/cpuidle/sysfs.c \
            kernel/drivers/cpufreq/cpufreq_stats.c \
            kernel/techpack/audio/asoc/msm-dai-q6-v2.c \
            kernel/techpack/audio/asoc/msm-dai-q6-v2.h \
            kernel/techpack/audio/asoc/msm_dailink.h \
            >"$DIAG/critical-source-sha256.txt"

          for file in \
            lib/vdso/gettimeofday.c \
            kernel/time/vsyscall.c \
            kernel/time/posix-timers.c \
            kernel/sys.c \
            drivers/cpuidle/sysfs.c \
            drivers/cpufreq/cpufreq_stats.c \
            include/linux/ghost_uptime.h \
            kernel/time/ghost_uptime.c \
            fs/proc/uptime.c \
            fs/proc/stat.c \
            fs/proc/softirqs.c \
            kernel/irq/proc.c \
            techpack/audio/asoc/msm-dai-q6-v2.c \
            techpack/audio/asoc/msm-dai-q6-v2.h \
            techpack/audio/asoc/msm_dailink.h
          do
            if [ -f "kernel/$file" ]; then
              mkdir -p "$DIAG/patched-source/$(dirname "$file")"
              cp -a "kernel/$file" "$DIAG/patched-source/$file"
            fi
          done

          {
            echo "V110 cpufreq time_in_state readout audit"
            echo "base=V109 compile PASS; V108 boot and audio PASS"
            echo "runtime_finding=cpufreq totals advanced by real elapsed time and remained far below the ghost axis"
            echo "changed_surface=drivers/cpufreq/cpufreq_stats.c show_time_in_state text only"
            echo "retained=V109 sysinfo, V108 cpuidle, V105 POSIX times, all earlier concealment, audio PASS"
            echo "unchanged=cpufreq accounting/transitions/reset/governor, sysinfo non-time fields, cpuidle accounting, tms CPU fields, vDSO, scheduler, hrtimer, sched_clock, local_clock, ktime_get, core timekeeping"
            echo
            echo "===== V105/V109 MARKERS IN kernel/sys.c ====="
            grep -nE 'Vili CI V10(5|9)|vili_ghost_(times|sysinfo)|SYSCALL_DEFINE1\((times|sysinfo)' kernel/kernel/sys.c
            echo
            echo "===== RETAINED V108 MARKERS IN drivers/cpuidle/sysfs.c ====="
            grep -nE 'Vili CI V108|vili_ghost_cpuidle_time_show|cattr == &attr_time' kernel/drivers/cpuidle/sysfs.c
            echo
            echo "===== V110 MARKERS IN drivers/cpufreq/cpufreq_stats.c ====="
            grep -nE 'Vili CI V110|vili_ghost_cpufreq_time_in_state|show_time_in_state|cpufreq_stats_update' kernel/drivers/cpufreq/cpufreq_stats.c
            echo
            echo "===== PRISTINE VDSO HASHES ====="
            sha256sum kernel/lib/vdso/gettimeofday.c kernel/kernel/time/vsyscall.c
            echo
            echo "===== AUDIO PASS HASHES ====="
            sha256sum \
              kernel/techpack/audio/asoc/msm-dai-q6-v2.c \
              kernel/techpack/audio/asoc/msm-dai-q6-v2.h \
              kernel/techpack/audio/asoc/msm_dailink.h
          } >"$DIAG/V110-layer-audit.txt"

          cat >"$TOOLS/V110-collect-in-twrp.sh" <<'EOF_V110_TWRP'
          #!/sbin/sh
          # V110 read-only bootloop collector for Xiaomi 11T Pro (vili).
          # Run in TWRP/OrangeFox terminal: sh /sdcard/V110-collect-in-twrp.sh
          
          set -u
          
          if [ -d /sdcard ] && [ -w /sdcard ]; then
            BASE=/sdcard
          else
            BASE=/tmp
          fi
          
          STAMP="$(date +%Y%m%d-%H%M%S 2>/dev/null || echo unknown)"
          NAME="V110-bootloop-logs-${STAMP}"
          OUT="${BASE}/${NAME}"
          ARCHIVE="${BASE}/${NAME}.tar.gz"
          TAR_ERROR="${BASE}/${NAME}-tar-error.txt"
          mkdir -p "$OUT"
          
          run_to() {
            target="$1"
            shift
            {
              echo "COMMAND: $*"
              "$@"
            } >"$OUT/$target" 2>&1 || true
          }
          
          {
            echo "collector=V110"
            echo "started_utc=$(date -u 2>/dev/null || true)"
            echo "output=$OUT"
            echo "This collector never writes to a block device."
          } >"$OUT/00-summary.txt"
          
          run_to 01-uname.txt uname -a
          run_to 02-props.txt getprop
          run_to 03-cmdline.txt cat /proc/cmdline
          run_to 04-mounts.txt cat /proc/mounts
          run_to 05-proc-mtd.txt cat /proc/mtd
          run_to 06-partitions.txt cat /proc/partitions
          run_to 07-block-links.txt ls -la /dev/block /dev/block/by-name /dev/block/bootdevice/by-name
          run_to 08-block-sysfs.txt sh -c 'for f in /sys/class/block/sda15/size /sys/class/block/sda15/start /sys/class/block/sda15/dev; do echo "===== $f ====="; cat "$f" 2>&1; done'
          run_to 09-device-tree-model.txt sh -c 'for f in /proc/device-tree/model /proc/device-tree/compatible; do echo "===== $f ====="; tr "\000" "\n" < "$f" 2>/dev/null; done'
          run_to 20-recovery-dmesg.txt dmesg
          run_to 21-kernel-state.txt sh -c 'cat /proc/uptime; echo; head -20 /proc/stat; echo; cat /proc/interrupts; echo; cat /proc/timer_list 2>/dev/null; echo; cat /proc/softirqs'
          run_to 22-recovery-log.txt sh -c 'cat /tmp/recovery.log 2>/dev/null; cat /cache/recovery/last_log 2>/dev/null'
          run_to 23-logcat.txt sh -c 'logcat -b all -d -v threadtime 2>/dev/null'
          
          mkdir -p /sys/fs/pstore 2>/dev/null || true
          if ! grep -q ' /sys/fs/pstore ' /proc/mounts 2>/dev/null; then
            mount -t pstore pstore /sys/fs/pstore 2>"$OUT/10-pstore-mount-error.txt" || true
          fi
          run_to 11-pstore-status.txt sh -c 'grep pstore /proc/mounts; ls -la /sys/fs/pstore'
          mkdir -p "$OUT/pstore"
          cp -a /sys/fs/pstore/. "$OUT/pstore/" 2>"$OUT/12-pstore-copy-error.txt" || true
          run_to 13-last-kmsg.txt sh -c 'cat /proc/last_kmsg 2>/dev/null'
          run_to 14-pstore-registration.txt sh -c 'dmesg | grep -iE "pstore|ramoops|mtdoops|block2mtd|panic|oops"'
          run_to 15-sysinfo-userspace.txt sh -c 'echo "===== /proc/uptime ====="; cat /proc/uptime 2>/dev/null; echo; echo "===== uptime commands ====="; command -v uptime 2>/dev/null; uptime 2>/dev/null; command -v toybox 2>/dev/null && toybox uptime 2>/dev/null; command -v busybox 2>/dev/null && busybox uptime 2>/dev/null'
          
          # V103 showed this exact mapping. Read it only when the active cmdline confirms it.
          BLOCK=/dev/block/sda15
          EXPECTED_MAP='block2mtd.block2mtd=/dev/block/sda15,2097152'
          if grep -q "$EXPECTED_MAP" /proc/cmdline 2>/dev/null && [ -b "$BLOCK" ]; then
            SECTORS="$(cat /sys/class/block/sda15/size 2>/dev/null || echo 0)"
            case "$SECTORS" in
              ''|*[!0-9]*) SECTORS=0 ;;
            esac
            BYTES=$((SECTORS * 512))
            {
              echo "mapping_confirmed=$EXPECTED_MAP"
              echo "block=$BLOCK"
              echo "sectors=$SECTORS"
              echo "bytes=$BYTES"
              echo "mode=read-only"
            } >"$OUT/30-mtdoops-read-info.txt"
          
            if [ "$BYTES" -gt 0 ] && [ "$BYTES" -le 67108864 ]; then
              dd if="$BLOCK" of="$OUT/31-mtdoops-sda15-full.bin" bs=1048576 \
                2>"$OUT/31-mtdoops-dd.txt" || true
              RAW="$OUT/31-mtdoops-sda15-full.bin"
            else
              dd if="$BLOCK" of="$OUT/31-mtdoops-sda15-first-4MiB.bin" bs=1048576 count=4 \
                2>"$OUT/31-mtdoops-first-dd.txt" || true
              RAW="$OUT/31-mtdoops-sda15-first-4MiB.bin"
              if [ "$SECTORS" -gt 8192 ]; then
                SKIP_MIB=$((SECTORS / 2048 - 4))
                dd if="$BLOCK" of="$OUT/32-mtdoops-sda15-last-4MiB.bin" bs=1048576 skip="$SKIP_MIB" count=4 \
                  2>"$OUT/32-mtdoops-last-dd.txt" || true
              fi
            fi
          
            if command -v strings >/dev/null 2>&1; then
              strings -a -t d "$RAW" >"$OUT/33-mtdoops-strings.txt" 2>&1 || true
              [ ! -f "$OUT/32-mtdoops-sda15-last-4MiB.bin" ] || \
                strings -a -t d "$OUT/32-mtdoops-sda15-last-4MiB.bin" >>"$OUT/33-mtdoops-strings.txt" 2>&1 || true
            fi
            command -v gzip >/dev/null 2>&1 && gzip -9 "$OUT"/*.bin 2>/dev/null || true
          else
            {
              echo "SKIPPED: exact V103 block2mtd mapping was not present or $BLOCK was not a block device."
              echo "No raw partition was read."
            } >"$OUT/30-mtdoops-read-info.txt"
          fi
          
          cat >"$OUT/V110-UPLOAD-README.txt" <<'EOF'
          Send this complete archive together with the GitHub Actions V110 artifact.
          The pstore directory may be empty. The mtdoops files are read-only snapshots
          and can contain the previous panic when pstore/ramoops does not.
          EOF
          
          rm -f "$ARCHIVE" "$TAR_ERROR"
          if tar -czf "$ARCHIVE" -C "$BASE" "$NAME" 2>"$TAR_ERROR"; then
            rm -f "$TAR_ERROR"
            echo "DONE: $ARCHIVE"
          else
            cp -a "$TAR_ERROR" "$OUT/90-tar-error.txt" 2>/dev/null || true
            ARCHIVE="${BASE}/${NAME}.tar"
            tar -cf "$ARCHIVE" -C "$BASE" "$NAME"
            rm -f "$TAR_ERROR"
            echo "DONE: $ARCHIVE"
          fi
          echo "Folder kept at: $OUT"
          EOF_V110_TWRP
          chmod 0755 "$TOOLS/V110-collect-in-twrp.sh"
          sh -n "$TOOLS/V110-collect-in-twrp.sh"

          base64 -d >"$TOOLS/V110-check-ghost-uptime-noroot.sh" <<'EOF_V110_NOROOT_B64'
