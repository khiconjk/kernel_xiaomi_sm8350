              'ksu_show_allow_list': 'show_allow_list',
              'context: %s': 'ctx: ok',
              ', context: %s': ', ctx: ok',
          }

          def rewrite_c_string_literals(text: str) -> str:
              out = []
              i = 0
              n = len(text)
              while i < n:
                  ch = text[i]
                  if ch != '"':
                      out.append(ch)
                      i += 1
                      continue
                  # Parse a C string literal, preserving escapes.
                  j = i + 1
                  escaped = False
                  buf = ['"']
                  content = []
                  while j < n:
                      c = text[j]
                      if escaped:
