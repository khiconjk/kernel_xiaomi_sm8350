          2. adb shell chmod 755 /data/local/tmp/V110-check-ghost-uptime-noroot.sh
          3. adb shell /data/local/tmp/V110-check-ghost-uptime-noroot.sh
          4. Note the exact DONE path printed by the script, then run:
             adb pull /sdcard/Download/V110-noroot-uptime-audit-YYYYMMDD-HHMMSS.txt

          Directly from an Android terminal, without root:
             sh /sdcard/Download/V110-check-ghost-uptime-noroot.sh

          Prefer adb shell for the fullest report. An ordinary terminal app UID may
          be denied /proc/uptime and dumpsys; V110 tool then falls back to the current
          process starttime for the sysinfo consistency comparison.

          Bootloop collector in TWRP/OrangeFox:
          1. Copy V110-collect-in-twrp.sh to /sdcard.
          2. Open Recovery > Advanced > Terminal.
          3. Run: sh /sdcard/V110-collect-in-twrp.sh
          4. Send the resulting V110-bootloop-logs-*.tar.gz file.

          Both scripts are read-only. The TWRP script reads /dev/block/sda15 only
          when /proc/cmdline contains the exact block2mtd mapping observed in V103.
          EOF_V110_README

      - name: Collect outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          ARTIFACT_DIR="../${ARTIFACT_DIR}"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/kernel" "$ARTIFACT_DIR/dtb-output" "$ARTIFACT_DIR/modules" \
            "$ARTIFACT_DIR/logs/diagnostics" "$ARTIFACT_DIR/tools"

          echo "===== COLLECT OUTPUTS =====" | tee -a ../build.log
          BOOT_DIR="$OUT_DIR/arch/arm64/boot"

          if [ -f "$BOOT_DIR/Image.gz" ]; then
            cp -a "$BOOT_DIR/Image.gz" "$ARTIFACT_DIR/kernel/Image.gz"
          fi
          if [ -f "$BOOT_DIR/Image" ]; then
            cp -a "$BOOT_DIR/Image" "$ARTIFACT_DIR/kernel/Image"
          fi
          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            cp -a "$BOOT_DIR/Image.gz-dtb" "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only"
          fi

          find "$BOOT_DIR" -type f \( -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \) -exec cp -a {} "$ARTIFACT_DIR/dtb-output/" \; 2>/dev/null || true
          find "$OUT_DIR" -type f -name '*.ko' -exec cp -a {} "$ARTIFACT_DIR/modules/" \; 2>/dev/null || true

          cp -a ../setup.log "$ARTIFACT_DIR/logs/setup.log" || true
          cp -a ../build.log "$ARTIFACT_DIR/logs/build.log" || true
          cp -a "$OUT_DIR/System.map" "$ARTIFACT_DIR/logs/System.map" || true
          cp -a "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/logs/Module.symvers" || true
          cp -a ../V110-diagnostics/. "$ARTIFACT_DIR/logs/diagnostics/" || true
          cp -a ../V110-tools/. "$ARTIFACT_DIR/tools/" || true

          echo "" | tee -a ../build.log
          echo "===== ARTIFACT TREE =====" | tee -a ../build.log
          find "$ARTIFACT_DIR" -maxdepth 3 -type f -printf '%p  %s bytes\n' | sort | tee -a ../build.log

          if [ ! -f "$ARTIFACT_DIR/kernel/Image.gz" ] && [ ! -f "$ARTIFACT_DIR/kernel/Image" ]; then
            echo "ERROR: no Image.gz/Image found. Kernel build is not usable." | tee -a ../build.log
            exit 1
          fi

      - name: Create AnyKernel3 flashable zip
        shell: bash
        run: |
          set -Eeuo pipefail
          ARTIFACT_DIR="${ARTIFACT_DIR}"
          AK3_DIR="AnyKernel3-vili"
          ZIP_NAME="${KERNEL_NAME}-AnyKernel3-${GITHUB_RUN_NUMBER}.zip"

          echo "===== CREATE ANYKERNEL3 ZIP =====" | tee -a build.log
          # AnyKernel3 removed backwards compatibility for lowercase user variables on 2026-06-28.
          # Pin a known revision and use the current uppercase API below.
          AK3_REF="1c9a500dd4aa8081952523126e97eb155aed941b"
          rm -rf "$AK3_DIR"
          git clone --no-checkout https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR" 2>&1 | tee -a build.log
          git -C "$AK3_DIR" fetch --depth=1 origin "$AK3_REF" 2>&1 | tee -a build.log
          git -C "$AK3_DIR" checkout --detach FETCH_HEAD 2>&1 | tee -a build.log
          echo "AnyKernel3 pinned commit: $(git -C "$AK3_DIR" rev-parse HEAD)" | tee -a build.log
          test "$(git -C "$AK3_DIR" rev-parse HEAD)" = "$AK3_REF"
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md" "$AK3_DIR/LICENSE" "$AK3_DIR/ramdisk" "$AK3_DIR/patch"

          cat > "$AK3_DIR/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # Flash target: Xiaomi 11T Pro / vili / HyperOS 1.0.22 Android 14
          
          properties() { '
          kernel.string=V110 KangarooX vili A14 cpufreq time_in_state KSU SuSFS audio PASS
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=Xiaomi 11T Pro
          device.name3=2107113SG
          device.name4=2107113SI
          device.name5=2107113SR
          supported.versions=14 - 14
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          
          dump_boot;
          write_boot;
          EOF

          if [ -f "$ARTIFACT_DIR/kernel/Image.gz" ]; then
            cp -a "$ARTIFACT_DIR/kernel/Image.gz" "$AK3_DIR/Image.gz"
          elif [ -f "$ARTIFACT_DIR/kernel/Image" ]; then
            cp -a "$ARTIFACT_DIR/kernel/Image" "$AK3_DIR/Image"
          elif [ -f "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only" ]; then
            echo "WARNING: Image.gz not found, using Image.gz-dtb fallback. For HyperOS A14, Image.gz is preferred." | tee -a build.log
            cp -a "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only" "$AK3_DIR/Image.gz-dtb"
          else
            echo "ERROR: no kernel image found for AnyKernel3" | tee -a build.log
            exit 1
          fi

          cat > "$ARTIFACT_DIR/V110-README-FLASH.txt" <<EOF
          V110 - Xiaomi 11T Pro vili - HyperOS 1.0.22 Android 14
          KernelSU-Next legacy manual-hook + SuSFS concealment + ghost uptime + confirmed audio PASS

          V110 change only:
            Starting from compile-confirmed V109 and boot/audio-confirmed V108, correct only
            the public cpufreq policy*/stats/time_in_state readout. Add the existing random
            ghost offset to one deterministic frequency bucket (index 0) when text is shown.
            Internal local_clock() accounting, transition counters, current frequency,
            governor and scheduler behavior remain unchanged. V109 sysinfo, V108 cpuidle,
            V105 POSIX times(2), all earlier hidden layers and audio stay retained.
            lib/vdso/gettimeofday.c and kernel/time/vsyscall.c stay pinned pristine.
          
          Flash file:
            flashable/$ZIP_NAME
          
          Khuyến nghị:
            1. Backup boot.img gốc trước khi flash.
            2. Chỉ flash AnyKernel3 ZIP này vào boot partition.
            3. Sau khi boot, cài KernelSU Next Manager đúng bản mới nhất để kiểm tra trạng thái root.
            4. Không flash dtbo-output hoặc modules zip nếu chưa xác minh chúng khớp đúng ROM stock của máy.
            5. Nếu bootloop: chạy tools/V110-collect-in-twrp.sh trong terminal recovery trước, sau đó restore V108 đã xác nhận boot/audio hoặc boot.img gốc.
            6. Khi boot thành công: kiểm tra âm thanh, rồi chạy tools/V110-check-ghost-uptime-noroot.sh không cần root và gửi report.
          
          Artifact khác:
            kernel/Image.gz: kernel image chính.
            dtb-output/: chỉ để kiểm tra, không tự flash.
            modules/: chỉ để kiểm tra, không tự thay vendor_dlkm.
            logs/: setup.log, build.log, final.config và diagnostics/source-diff.patch.
            tools/: V110-check-ghost-uptime-noroot.sh, V110-collect-in-twrp.sh và hướng dẫn.
          EOF

          mkdir -p "$ARTIFACT_DIR/flashable"
          (cd "$AK3_DIR" && zip -r9 "../$ZIP_NAME" . -x '*.git*' 2>&1 | tee -a ../build.log)
          mv "$ZIP_NAME" "$ARTIFACT_DIR/flashable/$ZIP_NAME"

          echo "" | tee -a build.log
          echo "===== FLASHABLE ZIP =====" | tee -a build.log
          ls -lh "$ARTIFACT_DIR/flashable" | tee -a build.log

          echo "===== FLASHABLE ZIP PREFLIGHT =====" | tee -a build.log
          unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" | tee -a build.log
          unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" | grep -qE '[[:space:]]Image\.gz$'
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -q '^BLOCK='
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -q '^IS_SLOT_DEVICE='
          if unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -qE '^(block|is_slot_device|ramdisk_compression|patch_vbmeta_flag)='; then
            echo "ERROR: legacy lowercase AnyKernel3 variables detected" | tee -a build.log
            exit 1
          fi
          sha256sum "$ARTIFACT_DIR/flashable/$ZIP_NAME" | tee -a build.log

      - name: Pack modules inspection zip
        shell: bash
        run: |
          set -Eeuo pipefail
          ARTIFACT_DIR="${ARTIFACT_DIR}"
          echo "===== PACK MODULES INSPECTION ZIP =====" | tee -a build.log
          if find "$ARTIFACT_DIR/modules" -type f -name '*.ko' | grep -q .; then
            (cd "$ARTIFACT_DIR/modules" && zip -r9 "../${KERNEL_NAME}-modules-inspection-only-${GITHUB_RUN_NUMBER}.zip" . 2>&1 | tee -a ../../build.log)
          else
            echo "No modules found." | tee -a build.log
          fi

      - name: Finalize artifact logs
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d "${ARTIFACT_DIR}" ]; then
            mkdir -p "${ARTIFACT_DIR}/logs"
            cp -a setup.log "${ARTIFACT_DIR}/logs/setup.log" 2>/dev/null || true
            cp -a build.log "${ARTIFACT_DIR}/logs/build.log" 2>/dev/null || true
            echo "Final artifact logs refreshed after AnyKernel3 packaging." | tee -a build.log
            cp -a build.log "${ARTIFACT_DIR}/logs/build.log" 2>/dev/null || true
          fi

      - name: Show real errors if failed
        if: failure()
        shell: bash
        run: |
          echo "===== SETUP ERROR LINES ====="
          if [ -f setup.log ]; then
            grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\.lld|make(\[[0-9]+\])?: \*\*\*' setup.log | tail -200 || true
          else
            echo "setup.log missing"
          fi

          echo ""
          echo "===== BUILD ERROR LINES ====="
          if [ -f build.log ]; then
            grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\.lld|make(\[[0-9]+\])?: \*\*\*' build.log | tail -300 || true
            echo ""
            echo "===== LAST 250 BUILD LINES ====="
            tail -250 build.log || true
          else
            echo "build.log missing"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V110-vili-hyperos-a14-cpufreq-time-in-state-${{ github.run_number }}
          path: |
            V110-artifact-vili-hyperos-a14-cpufreq-time-in-state/**
            setup.log
            build.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
