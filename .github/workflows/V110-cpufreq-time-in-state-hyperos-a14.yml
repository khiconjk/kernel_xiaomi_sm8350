          /* Vili CI V61: procfs shift plus old sysfs/pstore timestamp sanitizer. */
          #ifndef GHOST_UPTIME_MIN_VALID_REALTIME
          #define GHOST_UPTIME_MIN_VALID_REALTIME 1600000000LL
          #endif

          #ifndef SYSFS_MAGIC
          #define SYSFS_MAGIC 0x62656572
          #endif

          #ifndef PSTOREFS_MAGIC
          #define PSTOREFS_MAGIC 0x6165676C
          #endif

          #ifndef DEBUGFS_MAGIC
          #define DEBUGFS_MAGIC 0x64626720
          #endif

          #ifndef TRACEFS_MAGIC
          #define TRACEFS_MAGIC 0x74726163
          #endif

          static bool ghost_uptime_is_procfs(const struct inode *inode)
          {
                  if (!inode || !inode->i_sb)
                          return false;
                  return inode->i_sb->s_magic == PROC_SUPER_MAGIC;
          }

          static bool ghost_uptime_is_old_pseudo_fs(const struct inode *inode)
          {
                  unsigned long magic;

                  if (!inode || !inode->i_sb)
                          return false;

                  magic = inode->i_sb->s_magic;
                  return magic == SYSFS_MAGIC ||
                         magic == PSTOREFS_MAGIC ||
                         magic == DEBUGFS_MAGIC ||
                         magic == TRACEFS_MAGIC;
          }

          static bool ghost_uptime_ts_is_old(const struct timespec64 *ts)
          {
                  return ts && ts->tv_sec > 0 &&
                         ts->tv_sec < (time64_t)GHOST_UPTIME_MIN_VALID_REALTIME;
          }

          static void ghost_uptime_shift_ts(struct timespec64 *ts, u64 off_sec)
          {
                  if (!ts || !off_sec)
                          return;

                  if (ts->tv_sec > (time64_t)off_sec)
                          ts->tv_sec -= (time64_t)off_sec;
                  else if (ts->tv_sec > 0)
                          ts->tv_sec = 0;
          }

          static void ghost_uptime_set_ts(struct timespec64 *ts, time64_t sec)
          {
                  if (!ts || sec <= 0)
                          return;
                  ts->tv_sec = sec;
                  ts->tv_nsec = 0;
          }

          static void ghost_uptime_sanitize_old_pseudo_ts(struct kstat *stat, u64 off_sec)
          {
                  time64_t now;
                  time64_t fake_boot_sec;

                  if (!stat || !off_sec)
                          return;

                  if (!ghost_uptime_ts_is_old(&stat->atime) &&
                      !ghost_uptime_ts_is_old(&stat->mtime) &&
                      !ghost_uptime_ts_is_old(&stat->ctime) &&
                      !ghost_uptime_ts_is_old(&stat->btime))
                          return;

                  now = ktime_get_real_seconds();
                  if (now <= (time64_t)(off_sec + GHOST_UPTIME_MIN_VALID_REALTIME))
                          return;

                  fake_boot_sec = now - (time64_t)off_sec;
                  ghost_uptime_set_ts(&stat->atime, fake_boot_sec);
                  ghost_uptime_set_ts(&stat->mtime, fake_boot_sec);
                  ghost_uptime_set_ts(&stat->ctime, fake_boot_sec);
                  ghost_uptime_set_ts(&stat->btime, fake_boot_sec);
          }

          static bool ghost_uptime_stat_has_old_ts(const struct kstat *stat)
          {
                  if (!stat)
                          return false;

                  return ghost_uptime_ts_is_old(&stat->atime) ||
                         ghost_uptime_ts_is_old(&stat->mtime) ||
                         ghost_uptime_ts_is_old(&stat->ctime) ||
                         ghost_uptime_ts_is_old(&stat->btime);
