          printf '%s  %s\n' "$EXPECTED_REPO_C_SHA256" "$AUDIO_C" | sha256sum -c - | tee -a ../setup.log
          printf '%s  %s\n' "$EXPECTED_REPO_H_SHA256" "$AUDIO_H" | sha256sum -c - | tee -a ../setup.log
          printf '%s  %s\n' "$EXPECTED_REPO_DAILINK_SHA256" "$AUDIO_DAILINK" | sha256sum -c - | tee -a ../setup.log

          if ! grep -q 'qcom,msm-mi2s-lines' "$AUDIO_C"; then
            echo "ERROR: pinned kernel source no longer has the split MI2S driver ABI seen in V100B" | tee -a ../setup.log
            exit 1
          fi
          if ! grep -q 'msm-dai-q6-mi2s.11' "$AUDIO_DAILINK"; then
            echo "ERROR: pinned machine-link source no longer has split MI2S CPU IDs 0-11" | tee -a ../setup.log
            exit 1
          fi

          AUDIO_TMP="$(mktemp -d)"
          trap 'rm -rf "$AUDIO_TMP"' EXIT
          AUDIO_BASE_URL="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/${AUDIO_COMPAT_SOURCE_COMMIT}/techpack/audio/asoc"

          curl --fail --location --retry 5 --retry-delay 2 \
            "${AUDIO_BASE_URL}/msm-dai-q6-v2.c" \
            --output "$AUDIO_TMP/msm-dai-q6-v2.c"
          curl --fail --location --retry 5 --retry-delay 2 \
            "${AUDIO_BASE_URL}/msm-dai-q6-v2.h" \
            --output "$AUDIO_TMP/msm-dai-q6-v2.h"
          curl --fail --location --retry 5 --retry-delay 2 \
            "${AUDIO_BASE_URL}/msm_dailink.h" \
            --output "$AUDIO_TMP/msm_dailink.h"

          printf '%s  %s\n' "$AUDIO_UPSTREAM_C_SHA256" "$AUDIO_TMP/msm-dai-q6-v2.c" | sha256sum -c - | tee -a ../setup.log
          printf '%s  %s\n' "$AUDIO_UPSTREAM_H_SHA256" "$AUDIO_TMP/msm-dai-q6-v2.h" | sha256sum -c - | tee -a ../setup.log
          printf '%s  %s\n' "$AUDIO_UPSTREAM_DAILINK_SHA256" "$AUDIO_TMP/msm_dailink.h" | sha256sum -c - | tee -a ../setup.log

          python3 - "$AUDIO_C" "$AUDIO_H" "$AUDIO_DAILINK" \
            "$AUDIO_TMP/msm-dai-q6-v2.c" "$AUDIO_TMP/msm-dai-q6-v2.h" "$AUDIO_TMP/msm_dailink.h" \
            "$AUDIO_TMP/msm-dai-q6-v2-hybrid.c" "$AUDIO_TMP/msm-dai-q6-v2-hybrid.h" \
            "$AUDIO_TMP/msm_dailink-hybrid.h" <<'PY_AUDIO_ABI'
          from pathlib import Path
          import re
          import sys

          (current_c_path, current_h_path, current_dailink_path,
           official_c_path, official_h_path, official_dailink_path,
           out_c_path, out_h_path, out_dailink_path) = map(Path, sys.argv[1:])
          current_c = current_c_path.read_text()
          current_h = current_h_path.read_text()
          current_dailink = current_dailink_path.read_text()
          official_c = official_c_path.read_text()
          official_h = official_h_path.read_text()
          official_dailink = official_dailink_path.read_text()

          def transplant(dst, src, dst_start, src_start, dst_end, src_end, label):
              ds = dst.find(dst_start)
              de = dst.find(dst_end, ds + len(dst_start))
              ss = src.find(src_start)
              se = src.find(src_end, ss + len(src_start))
              if min(ds, de, ss, se) < 0:
                  raise SystemExit(f'ERROR: missing audio transplant anchor for {label}')
              checks = (
                  (dst, dst_start, 'destination start'),
                  (dst, dst_end, 'destination end'),
                  (src, src_start, 'official start'),
                  (src, src_end, 'official end'),
              )
              for text, marker, side in checks:
                  if text.count(marker) != 1:
                      raise SystemExit(f'ERROR: non-unique {side} anchor for {label}: {text.count(marker)}')
              return dst[:ds] + src[ss:se] + dst[de:]

          hybrid_c = transplant(
              current_c, official_c,
              'struct msm_dai_q6_mi2s_dai_data {',
              'struct msm_dai_q6_mi2s_dai_data {',
              'struct msm_dai_q6_meta_mi2s_dai_data {',
              'struct msm_dai_q6_meta_mi2s_dai_data {',
              'MI2S runtime data structure')
          hybrid_c = transplant(
              hybrid_c, official_c,
              'static int msm_dai_q6_dai_mi2s_probe(',
              'static int msm_dai_q6_dai_mi2s_probe(',
              'static int msm_dai_q6_mi2s_dev_remove(',
              'static int msm_dai_q6_mi2s_dev_remove(',
              'MI2S driver implementation')
          hybrid_h = transplant(
              current_h, official_h,
              '#define MSM_PRIM_MI2S_RX 0',
              '#define MSM_PRIM_MI2S 0',
              '#define MSM_DISPLAY_PORT\t0',
              '#define MSM_DISPLAY_PORT\t0',
              'MI2S interface IDs')
          hybrid_h = transplant(
              hybrid_h, official_h,
              'struct msm_mi2s_pdata {',
              'struct msm_mi2s_pdata {',
              'struct msm_meta_mi2s_pdata {',
              'struct msm_meta_mi2s_pdata {',
              'MI2S platform data')

          expected_ids = {
              'pri_mi2s_rx': 0, 'pri_mi2s_tx': 0,
              'sec_mi2s_rx': 1, 'sec_mi2s_tx': 1,
              'tert_mi2s_rx': 2, 'tert_mi2s_tx': 2,
              'quat_mi2s_rx': 3, 'quat_mi2s_tx': 3,
              'quin_mi2s_rx': 4, 'quin_mi2s_tx': 4,
              'sen_mi2s_rx': 5, 'sen_mi2s_tx': 5,
          }
          expected_counts = {name: 1 for name in expected_ids}
          expected_counts['pri_mi2s_rx'] = 2
          expected_counts['tert_mi2s_rx'] = 2
          start_re = re.compile(r'^SND_SOC_DAILINK_DEFS\(([a-z0-9_]+),')
          cpu_re = re.compile(r'msm-dai-q6-mi2s\.\d+')

          def collect_ids(text):
              found = {name: [] for name in expected_ids}
              active = None
              for line in text.splitlines():
                  match = start_re.match(line)
                  if match:
                      active = match.group(1) if match.group(1) in expected_ids else None
                  if active:
                      cpu = re.search(r'COMP_CPU\("msm-dai-q6-mi2s\.(\d+)"\)', line)
                      if cpu:
                          found[active].append(int(cpu.group(1)))
              return found

          official_ids = collect_ids(official_dailink)
          for name, expected_id in expected_ids.items():
              if not official_ids[name] or set(official_ids[name]) != {expected_id}:
                  raise SystemExit(
                      f'ERROR: official vili mapping mismatch for {name}: {official_ids[name]}')

          seen = {name: 0 for name in expected_ids}
          active = None
          output_lines = []
          for line in current_dailink.splitlines(keepends=True):
              match = start_re.match(line)
              if match:
                  active = match.group(1) if match.group(1) in expected_ids else None
              if active and 'COMP_CPU("msm-dai-q6-mi2s.' in line:
                  line, count = cpu_re.subn(
                      f'msm-dai-q6-mi2s.{expected_ids[active]}', line)
                  if count != 1:
                      raise SystemExit(
                          f'ERROR: bad machine-link replacement count for {active}: {count}')
                  seen[active] += 1
              output_lines.append(line)
          if seen != expected_counts:
              raise SystemExit(
                  f'ERROR: machine-link definition counts changed: {seen} != {expected_counts}')
          hybrid_dailink = ''.join(output_lines)
          final_ids = collect_ids(hybrid_dailink)
          for name, expected_id in expected_ids.items():
              if set(final_ids[name]) != {expected_id}:
                  raise SystemExit(
                      f'ERROR: final machine-link mapping mismatch for {name}: {final_ids[name]}')

          out_c_path.write_text(hybrid_c)
          out_h_path.write_text(hybrid_h)
          out_dailink_path.write_text(hybrid_dailink)
          print('Official vili MI2S driver ABI and paired 0-5 machine-link mapping applied.')
          PY_AUDIO_ABI

          printf '%s  %s\n' "$AUDIO_COMPAT_C_SHA256" "$AUDIO_TMP/msm-dai-q6-v2-hybrid.c" | sha256sum -c - | tee -a ../setup.log
          printf '%s  %s\n' "$AUDIO_COMPAT_H_SHA256" "$AUDIO_TMP/msm-dai-q6-v2-hybrid.h" | sha256sum -c - | tee -a ../setup.log
          printf '%s  %s\n' "$AUDIO_COMPAT_DAILINK_SHA256" "$AUDIO_TMP/msm_dailink-hybrid.h" | sha256sum -c - | tee -a ../setup.log

          install -m 0644 "$AUDIO_TMP/msm-dai-q6-v2-hybrid.c" "$AUDIO_C"
          install -m 0644 "$AUDIO_TMP/msm-dai-q6-v2-hybrid.h" "$AUDIO_H"
          install -m 0644 "$AUDIO_TMP/msm_dailink-hybrid.h" "$AUDIO_DAILINK"

          printf '%s  %s\n' "$AUDIO_COMPAT_C_SHA256" "$AUDIO_C" | sha256sum -c - | tee -a ../setup.log
          printf '%s  %s\n' "$AUDIO_COMPAT_H_SHA256" "$AUDIO_H" | sha256sum -c - | tee -a ../setup.log
          printf '%s  %s\n' "$AUDIO_COMPAT_DAILINK_SHA256" "$AUDIO_DAILINK" | sha256sum -c - | tee -a ../setup.log

          grep -q '^#define MSM_PRIM_MI2S 0$' "$AUDIO_H"
          grep -q 'u16 rx_sd_lines;' "$AUDIO_H"
          grep -q 'u16 tx_sd_lines;' "$AUDIO_H"
          grep -q 'qcom,msm-mi2s-rx-lines' "$AUDIO_C"
          grep -q 'qcom,msm-mi2s-tx-lines' "$AUDIO_C"
          grep -q 'COMP_CPU("msm-dai-q6-mi2s.5")' "$AUDIO_DAILINK"
          if grep -qE '^#define MSM_(PRIM|SEC|TERT|QUAT|QUIN|SENARY|INT[0-6])_MI2S_(RX|TX)' "$AUDIO_H"; then
            echo "ERROR: split RX/TX MI2S ID ABI remains in the driver header" | tee -a ../setup.log
            exit 1
          fi
          if grep -qE 'COMP_CPU\("msm-dai-q6-mi2s\.([6-9]|1[01])"\)' "$AUDIO_DAILINK"; then
            echo "ERROR: split MI2S machine-link CPU IDs 6-11 remain after FIX2" | tee -a ../setup.log
            exit 1
          fi

          echo "===== AUDIO FIX2 DIFFSTAT =====" | tee -a ../setup.log
          git diff --stat -- "$AUDIO_C" "$AUDIO_H" "$AUDIO_DAILINK" | tee -a ../setup.log
          echo "Complete official vili combined-node MI2S ABI applied successfully" | tee -a ../setup.log

      - name: Retain V105 POSIX times uptime readout layer
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel

          echo "===== RETAIN V105 POSIX times(2) UPTIME READOUT =====" | tee -a ../setup.log
          echo "V105 booted successfully. Reapply its exact elapsed-return patch before retaining V106/V108/V109 and adding V110." | tee -a ../setup.log
          echo "The tms CPU-duration fields stay real; vDSO and core timekeeping stay untouched." | tee -a ../setup.log

          python3 - <<'PY_V105_TIMES'
          from pathlib import Path

          path = Path('kernel/sys.c')
          text = path.read_text()
          original = text

          include = '#include <linux/ghost_uptime.h>'
          include_anchor = '#include <linux/times.h>'
          if include not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit(
                      f'ERROR: V105 times include anchor count is {text.count(include_anchor)}, expected 1')
              text = text.replace(include_anchor, include_anchor + '\n' + include, 1)

          marker = 'Vili CI V105: POSIX times(2) elapsed readout sync only.'
          helper_anchor = 'static void do_sys_times(struct tms *tms)'
          helper = r'''
          /*
           * Vili CI V105: POSIX times(2) elapsed readout sync only.
           * Shift only the public elapsed-time return value. The tms CPU accounting
           * fields and the kernel's internal jiffies remain untouched.
           */
          static u64 vili_ghost_times_jiffies(void)
          {
          	u64 now = get_jiffies_64();
          	u64 off_sec = ghost_uptime_offset_sec();

          	if (!off_sec)
          		return now;
          	if (off_sec > div_u64(~0ULL - now, HZ))
          		return ~0ULL;
          	return now + off_sec * HZ;
          }

          static long vili_ghost_times_clock_t(void)
          {
          	u64 ticks = jiffies_64_to_clock_t(vili_ghost_times_jiffies());

          	if (ticks > LONG_MAX)
          		return LONG_MAX;
          	return (long)ticks;
          }

          '''
          if marker not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit(
                      f'ERROR: V105 times helper anchor count is {text.count(helper_anchor)}, expected 1')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          native_old = 'return (long) jiffies_64_to_clock_t(get_jiffies_64());'
          native_new = 'return vili_ghost_times_clock_t();'
          if native_new not in text:
              if text.count(native_old) != 1:
                  raise SystemExit(
                      f'ERROR: V105 native times return count is {text.count(native_old)}, expected 1')
              text = text.replace(native_old, native_new, 1)

          compat_old = 'return compat_jiffies_to_clock_t(jiffies);'
          compat_new = 'return compat_jiffies_to_clock_t(vili_ghost_times_jiffies());'
          if compat_new not in text:
              if text.count(compat_old) != 1:
                  raise SystemExit(
                      f'ERROR: V105 compat times return count is {text.count(compat_old)}, expected 1')
              text = text.replace(compat_old, compat_new, 1)

          required = (
              include,
              marker,
              'static u64 vili_ghost_times_jiffies(void)',
              native_new,
              compat_new,
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: incomplete retained V105 times layer: {missing}')
          if text == original:
              raise SystemExit('ERROR: retained V105 times layer made no source change')
          path.write_text(text)
          print('Retained V105 POSIX times(2) readout layer for native and compat tasks.')
          PY_V105_TIMES

          git diff --check -- kernel/sys.c
          grep -nE 'Vili CI V105|vili_ghost_times|SYSCALL_DEFINE1\(times' kernel/sys.c | tee -a ../setup.log

      - name: Apply V106 sysinfo uptime readout layer
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel

          echo "===== V106 sysinfo(2) UPTIME READOUT =====" | tee -a ../setup.log
          echo "Starting point: V105 boot PASS. Change one read-only field in kernel/sys.c." | tee -a ../setup.log
          echo "Only struct sysinfo.uptime receives the existing random ghost offset." | tee -a ../setup.log
          echo "Load averages, process count, RAM/swap, vDSO, clocks, scheduler and CPU accounting remain unchanged." | tee -a ../setup.log

          python3 - <<'PY_V106_SYSINFO'
          from pathlib import Path

          path = Path('kernel/sys.c')
          text = path.read_text()
          original = text

          if '#include <linux/ghost_uptime.h>' not in text:
              raise SystemExit('ERROR: V105 ghost_uptime include is missing from kernel/sys.c')
          if 'Vili CI V105: POSIX times(2) elapsed readout sync only.' not in text:
              raise SystemExit('ERROR: V105 POSIX times layer is missing before V106')

          marker = 'Vili CI V106: sysinfo(2) uptime readout sync only.'
          helper_anchor = '''/**
           * do_sysinfo - fill in sysinfo struct
           * @info: pointer to buffer to fill
           */
          static int do_sysinfo(struct sysinfo *info)'''
          helper = r'''
          /*
           * Vili CI V106: sysinfo(2) uptime readout sync only.
           * Keep the kernel's real boot clock intact and shift only the public
           * struct sysinfo.uptime field. All other sysinfo fields remain real.
           */
          static long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)
          {
          	u64 real_sec;
          	u64 off_sec = ghost_uptime_offset_sec();

          	if (tp->tv_sec < 0)
          		return 0;
          	real_sec = (u64)tp->tv_sec;
          	if (tp->tv_nsec) {
          		if (real_sec == (u64)LONG_MAX)
          			return LONG_MAX;
          		real_sec++;
          	}
          	if (off_sec > (u64)LONG_MAX - real_sec)
          		return LONG_MAX;
          	return (long)(real_sec + off_sec);
          }

          '''
          if marker in text:
              raise SystemExit('ERROR: V106 sysinfo layer was unexpectedly present before this step')
          if text.count(helper_anchor) != 1:
              raise SystemExit(
                  f'ERROR: V106 do_sysinfo helper anchor count is {text.count(helper_anchor)}, expected 1')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_assignment = 'info->uptime = tp.tv_sec + (tp.tv_nsec ? 1 : 0);'
          new_assignment = 'info->uptime = vili_ghost_sysinfo_uptime(&tp);'
          if text.count(old_assignment) != 1:
              raise SystemExit(
                  f'ERROR: V106 sysinfo uptime assignment count is {text.count(old_assignment)}, expected 1')
          text = text.replace(old_assignment, new_assignment, 1)

          required = (
              marker,
              'static long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)',
              new_assignment,
              'get_avenrun(info->loads, 0, SI_LOAD_SHIFT - FSHIFT);',
              'info->procs = nr_threads;',
              'si_meminfo(info);',
              'si_swapinfo(info);',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: incomplete V106 sysinfo layer: {missing}')
          if old_assignment in text:
              raise SystemExit('ERROR: real sysinfo uptime assignment remains after V106')
          path.write_text(text)
          print('V106 sysinfo(2) uptime readout patch applied to the shared native/compat producer.')
          PY_V106_SYSINFO

          git diff --check -- kernel/sys.c
          grep -nE 'Vili CI V10(5|6)|vili_ghost_(times|sysinfo)|do_sysinfo|SYSCALL_DEFINE1\(sysinfo' \
            kernel/sys.c | tee -a ../setup.log

          if grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \
              lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then
            echo "ERROR: experimental vDSO code reappeared in V106" | tee -a ../setup.log
            exit 1
          fi

          echo "V106 single-layer patch verified: only sysinfo.uptime adds a new ghost-uptime readout." | tee -a ../setup.log

      - name: Apply retained V108 fixed cpuidle sysfs time readout layer
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel

          echo "===== RETAINED V108 FIXED CPUIDLE SYSFS TIME READOUT =====" | tee -a ../setup.log
          echo "Starting point: V106 boot and audio PASS." | tee -a ../setup.log
          echo "V107 did not compile because its local variable named current collided with the ARM64 current macro." | tee -a ../setup.log
          echo "Shift only /sys/devices/system/cpu/cpu*/cpuidle/state*/time at readout." | tee -a ../setup.log
          echo "Internal cpuidle accounting, governor decisions, state usage, scheduler, clocks and vDSO stay unchanged." | tee -a ../setup.log

          python3 - <<'PY_V108_CPUIDLE_TIME'
          from pathlib import Path

          path = Path('drivers/cpuidle/sysfs.c')
          text = path.read_text()
          original = text

          include = '#include <linux/ghost_uptime.h>'
          include_anchor = '#include <linux/cpuidle.h>'
          if include not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit(
                      f'ERROR: V108 cpuidle include anchor count is {text.count(include_anchor)}, expected 1')
              text = text.replace(include_anchor, include_anchor + '\n' + include, 1)

          marker = 'Vili CI V108: cpuidle state time sysfs readout sync only.'
          helper_anchor = '''static ssize_t cpuidle_state_show(struct kobject *kobj, struct attribute *attr,
          				  char * buf)'''
          helper = r'''
          /*
           * Vili CI V108: cpuidle state time sysfs readout sync only.
           * Add the existing ghost-boot offset to one deepest enabled idle state
           * per CPU. This changes only the public stateN/time text; accounting and
           * governor inputs remain real.
           */
          static ssize_t vili_ghost_cpuidle_time_show(struct cpuidle_device *dev,
          					    struct cpuidle_state *state,
          					    struct cpuidle_state_usage *usage,
          					    char *buf)
          {
          	struct cpuidle_driver *drv = cpuidle_get_cpu_driver(dev);
          	u64 shown = usage->time;
          	u64 off_sec = ghost_uptime_offset_sec();
          	u64 add_us;
          	int state_index = -1;
          	int target = -1;
          	int i;

          	if (!off_sec || !drv || drv->state_count <= 0)
          		return sprintf(buf, "%llu\n", shown);

          	for (i = 0; i < drv->state_count; i++) {
          		if (state == &drv->states[i])
          			state_index = i;
          	}

          	for (i = drv->state_count - 1; i >= 0; i--) {
          		if (!drv->states[i].disabled && !dev->states_usage[i].disable) {
          			target = i;
          			break;
          		}
          	}

          	if (state_index < 0 || state_index != target)
          		return sprintf(buf, "%llu\n", shown);

          	if (off_sec > div_u64(~0ULL, 1000000ULL))
          		return sprintf(buf, "%llu\n", ~0ULL);
          	add_us = off_sec * 1000000ULL;
          	if (shown > ~0ULL - add_us)
          		shown = ~0ULL;
          	else
          		shown += add_us;

          	return sprintf(buf, "%llu\n", shown);
          }

          '''
          if marker in text:
              raise SystemExit('ERROR: V108 cpuidle layer was unexpectedly present before this step')
          if text.count(helper_anchor) != 1:
              raise SystemExit(
                  f'ERROR: V108 cpuidle helper anchor count is {text.count(helper_anchor)}, expected 1')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_dispatch = '''	if (cattr->show)
          		ret = cattr->show(state, state_usage, buf);'''
          new_dispatch = '''	if (cattr == &attr_time)
          		ret = vili_ghost_cpuidle_time_show(kobj_to_device(kobj), state,
          						   state_usage, buf);
          	else if (cattr->show)
          		ret = cattr->show(state, state_usage, buf);'''
          if text.count(old_dispatch) != 1:
              raise SystemExit(
                  f'ERROR: V108 cpuidle show dispatch count is {text.count(old_dispatch)}, expected 1')
          text = text.replace(old_dispatch, new_dispatch, 1)

          required = (
              include,
              marker,
              'static ssize_t vili_ghost_cpuidle_time_show(',
              'struct cpuidle_driver *drv = cpuidle_get_cpu_driver(dev);',
              'int state_index = -1;',
              'if (cattr == &attr_time)',
              'shown += add_us;',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: incomplete V108 cpuidle layer: {missing}')
          if text.count('vili_ghost_cpuidle_time_show(') != 2:
              raise SystemExit('ERROR: V108 helper must have exactly one definition and one call')
          if 'int current' in text:
              raise SystemExit('ERROR: V108 must not use the ARM64-reserved current macro as a local variable')
          path.write_text(text)
          print('V108 cpuidle state time readout layer retained.')
          PY_V108_CPUIDLE_TIME

          git diff --check -- drivers/cpuidle/sysfs.c
          grep -nE 'Vili CI V108|vili_ghost_cpuidle_time_show|cattr == &attr_time|state_usage->_name' \
            drivers/cpuidle/sysfs.c | tee -a ../setup.log

          if grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \
              lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then
