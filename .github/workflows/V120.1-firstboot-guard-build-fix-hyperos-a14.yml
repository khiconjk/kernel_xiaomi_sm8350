      - name: Apply V115 proc stat ctxt display-only readout layer
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel

          echo "===== V115 PROC STAT CTXT DISPLAY-ONLY READOUT LAYER =====" | tee -a ../setup.log
          echo "V114 build/boot/KSU runtime evidence is retained. This step changes only the final /proc/stat ctxt text." | tee -a ../setup.log
          echo "The V114 root report exposed 1,984,515 context switches at about 573 real seconds, approximately 3463/s." | tee -a ../setup.log
          echo "Use ten times the established V114 synthetic timer-IRQ addition: about 3520 context switches/s on eight possible CPUs." | tee -a ../setup.log
          echo "Do not alter nr_context_switches accounting, scheduler, task switching, IRQ accounting, vDSO, hrtimer or any core clock." | tee -a ../setup.log

          python3 - <<'PY_V115_PROC_STAT_CTXT'
          from pathlib import Path

          path = Path('fs/proc/stat.c')
          text = path.read_text()

          marker = 'Vili CI V115: /proc/stat ctxt display-only ghost axis.'
          helper_anchor = 'static int show_stat(struct seq_file *p, void *v)'
          helper = r'''/*
           * Vili CI V115: /proc/stat ctxt display-only ghost axis.
           * Keep the real context-switch accounting untouched.  Reuse exactly
           * the retained V114 timer-IRQ display addition and multiply it by ten,
           * which gives a plausible 3520 ctxt/s axis on eight possible CPUs and
           * closely matches the 3463 ctxt/s observed on the V114 runtime report.
           */
          static u64 vili_ghost_proc_stat_ctxt_count(u64 base)
          {
          @@T@@u64 irq_display_add = vili_ghost_proc_stat_intr_count(0);
          @@T@@u64 add;

          @@T@@if (!irq_display_add)
          @@T@@@@T@@return base;

          @@T@@if (irq_display_add > ~0ULL / 10ULL)
          @@T@@@@T@@return ~0ULL;
          @@T@@add = irq_display_add * 10ULL;

          @@T@@if (add > ~0ULL - base)
          @@T@@@@T@@return ~0ULL;

          @@T@@return base + add;
          }

          '''
          helper = helper.replace('@@T@@', '\t')

          if marker in text:
              raise SystemExit('ERROR: V115 proc stat ctxt layer was unexpectedly present before this step')
          if 'Vili CI V114: /proc/stat intr duplicate aggregate display sync only.' not in text:
              raise SystemExit('ERROR: retained V114 proc stat intr marker is missing')
          if text.count('vili_ghost_proc_stat_intr_count(') != 2:
              raise SystemExit('ERROR: retained V114 intr helper must have one definition and one call')
          if text.count(helper_anchor) != 1:
              raise SystemExit(
                  f'ERROR: V115 show_stat anchor count is {text.count(helper_anchor)}, expected 1')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_ctxt = '\t\tnr_context_switches(),'
          new_ctxt = (
              '\t\t(unsigned long long)'
              'vili_ghost_proc_stat_ctxt_count(nr_context_switches()),'
          )
          if text.count(old_ctxt) != 1:
              raise SystemExit(
                  f'ERROR: V115 ctxt output anchor count is {text.count(old_ctxt)}, expected 1')
          text = text.replace(old_ctxt, new_ctxt, 1)

          required = (
              marker,
              'static u64 vili_ghost_proc_stat_ctxt_count(u64 base)',
              'u64 irq_display_add = vili_ghost_proc_stat_intr_count(0);',
              'add = irq_display_add * 10ULL;',
              'vili_ghost_proc_stat_ctxt_count(nr_context_switches())',
              'Vili CI V114: /proc/stat intr duplicate aggregate display sync only.',
              'vili_ghost_proc_stat_intr_count(sum)',
              'Vili CI V111: /proc/stat softirq duplicate readout sync only.',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: incomplete V115 proc stat ctxt layer: {missing}')
          if text.count('vili_ghost_proc_stat_ctxt_count(') != 2:
              raise SystemExit('ERROR: V115 ctxt helper must have one definition and one call')
          if text.count('nr_context_switches()') != 1:
              raise SystemExit('ERROR: nr_context_switches must remain a single readout call')

          path.write_text(text)
          print('V115 /proc/stat ctxt display-only layer applied.')

          for off in (15 * 86400, 25 * 86400):
              irq_add = sum(
                  off * 40 + cpu * 131 + off * 4 + cpu * 131
                  for cpu in range(8)
              )
              ctxt_add = irq_add * 10
              if ctxt_add <= 0 or ctxt_add >= 2**64:
                  raise SystemExit('ERROR: V115 synthetic ctxt addition overflow simulation failed')
              print(
                  f'V115 formula audit: off={off}s irq_add={irq_add} '
                  f'ctxt_add={ctxt_add} ctxt_rate={ctxt_add / off:.2f}/s'
              )
          PY_V115_PROC_STAT_CTXT

          git diff --check -- fs/proc/stat.c
          grep -nE 'Vili CI V(61|82|111|114|115)|vili_ghost_proc_stat_(softirq|intr|ctxt)|intr |ctxt |softirq ' \
            fs/proc/stat.c | tee -a ../setup.log

          if grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \
              lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then
            echo "ERROR: experimental vDSO code reappeared while applying V115" | tee -a ../setup.log
            exit 1
          fi

          echo "V115 verified: only /proc/stat ctxt text receives the synthetic historical display addition." | tee -a ../setup.log

      - name: V119.1 patch proc stat processes display-only history
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel

          echo "===== V119.1 /PROC/STAT PROCESSES DISPLAY-ONLY HISTORY =====" | tee -a ../setup.log
          echo "Runtime V119 exposed only ~14k total_forks while the visible uptime was ~25 days. This step changes the /proc/stat processes text only; real fork accounting remains untouched." | tee -a ../setup.log
          echo "Policy: add one synthetic historical process per ghost-offset second. This is intentionally conservative and avoids extrapolating the high early-boot fork rate across multiple days." | tee -a ../setup.log

          python3 - <<'PY_V119_PROC_STAT_PROCESSES'
          from pathlib import Path

          path = Path('fs/proc/stat.c')
          text = path.read_text()

          marker = 'Vili CI V119.1: /proc/stat processes display-only ghost history.'
          helper_anchor = 'static int show_stat(struct seq_file *p, void *v)'
          helper = r'''/*
           * Vili CI V119.1: /proc/stat processes display-only ghost history.
           * Keep total_forks accounting unchanged.  Add a conservative one-event
           * per ghost-offset-second history only when formatting /proc/stat.
           */
          static unsigned long vili_ghost_proc_stat_processes_count(unsigned long base)
          {
          @@T@@u64 off = ghost_uptime_offset_sec();

          @@T@@if (!off)
          @@T@@@@T@@return base;

          @@T@@if (off > (u64)(~0UL - base))
          @@T@@@@T@@return ~0UL;

          @@T@@return base + (unsigned long)off;
          }

          '''
          helper = helper.replace('@@T@@', '\t')

          if marker in text:
              raise SystemExit('ERROR: V119.1 processes layer was unexpectedly present before this step')
          if 'Vili CI V115: /proc/stat ctxt display-only ghost axis.' not in text:
              raise SystemExit('ERROR: retained V115 ctxt layer is missing before V119.1 processes patch')
          if text.count(helper_anchor) != 1:
              raise SystemExit(
                  f'ERROR: V119.1 show_stat anchor count is {text.count(helper_anchor)}, expected 1')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old = '\t\ttotal_forks,'
          new = '\t\tvili_ghost_proc_stat_processes_count(total_forks),'
          if text.count(old) != 1:
              raise SystemExit(
                  f'ERROR: V119.1 direct total_forks output anchor count is {text.count(old)}, expected 1')
          text = text.replace(old, new, 1)

          required = (
              marker,
              'static unsigned long vili_ghost_proc_stat_processes_count(unsigned long base)',
              'u64 off = ghost_uptime_offset_sec();',
              'return base + (unsigned long)off;',
              'vili_ghost_proc_stat_processes_count(total_forks)',
              'vili_ghost_proc_stat_ctxt_count(nr_context_switches())',
              'ghost_uptime_fake_btime_sec(&boottime)',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: incomplete V119.1 processes layer: {missing}')
          if text.count('vili_ghost_proc_stat_processes_count(') != 2:
              raise SystemExit('ERROR: V119.1 processes helper must have one definition and one call')
          if text.count('vili_ghost_proc_stat_processes_count(total_forks)') != 1:
              raise SystemExit('ERROR: V119.1 processes output must contain exactly one helper call around total_forks')

          path.write_text(text)
          print('V119.1 /proc/stat processes display-only history layer applied.')

          for off in (15 * 86400, 25 * 86400):
              add = off
              if add <= 0 or add >= 2**64:
                  raise SystemExit('ERROR: V119.1 synthetic processes addition simulation failed')
              print(
                  f'V119.1 formula audit: off={off}s processes_add={add} '
                  f'synthetic_rate={add / off:.2f}/s'
              )
          PY_V119_PROC_STAT_PROCESSES

          git diff --check -- fs/proc/stat.c
          grep -nE 'Vili CI V(61|82|111|114|115|119.1)|vili_ghost_proc_stat_(softirq|intr|ctxt|processes)|intr |ctxt |processes |softirq ' \
            fs/proc/stat.c | tee -a ../setup.log

          echo "V119.1 processes hardening OK: only /proc/stat readout changed; total_forks accounting is untouched." | tee -a ../setup.log

