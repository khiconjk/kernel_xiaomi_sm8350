              n = len(text)
              while i < n:
                  if text[i] != '"':
                      i += 1
                      continue
                  j = i + 1
                  escaped = False
                  content = []
                  while j < n:
                      c = text[j]
                      if escaped:
                          content.append(c)
                          escaped = False
                          j += 1
                          continue
                      if c == '\\':
                          content.append(c)
                          escaped = True
                          j += 1
                          continue
                      if c == '"':
                          yield ''.join(content)
                          j += 1
                          break
                      content.append(c)
                      j += 1
                  i = j

          bad = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix not in suffixes:
                      continue
                  data = p.read_text(errors='ignore')
                  for literal in iter_c_string_literals(data):
                      for frag in bad_fragments:
                          if frag in literal:
                              bad.append((str(p), frag, literal[:160]))
