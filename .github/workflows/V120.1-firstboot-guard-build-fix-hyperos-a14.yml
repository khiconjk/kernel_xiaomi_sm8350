          // SPDX-License-Identifier: GPL-2.0
          /*
           * Vili CI V22: real-domain debug compat for SuSFS 5.4 namespace/mount port.
           *
           * V20/V21 booted with SUS_MOUNT enabled, but domain helpers were weak
           * conservative fallbacks.  This build upgrades KSU/zygote detection to
