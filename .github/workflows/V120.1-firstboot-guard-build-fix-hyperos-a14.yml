          grep -q 'u16 tx_sd_lines;' "$AUDIO_H"
          grep -q 'qcom,msm-mi2s-rx-lines' "$AUDIO_C"
          grep -q 'qcom,msm-mi2s-tx-lines' "$AUDIO_C"
          grep -q 'COMP_CPU("msm-dai-q6-mi2s.5")' "$AUDIO_DAILINK"
          if grep -qE '^#define MSM_(PRIM|SEC|TERT|QUAT|QUIN|SENARY|INT[0-6])_MI2S_(RX|TX)' "$AUDIO_H"; then
            echo "ERROR: split RX/TX MI2S ID ABI remains in the driver header" | tee -a ../setup.log
            exit 1
