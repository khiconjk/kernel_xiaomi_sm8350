                  return 0;
          }
          """.replace('          ', '')
          if 'ghost_uptime_fake_btime_sec' not in p:
              sig = 'static int show_stat(struct seq_file *p, void *v)'
              if sig not in p:
                  raise SystemExit('ERROR: show_stat signature not found in fs/proc/stat.c')
              p = p.replace(sig, btime_helper + '\n' + sig, 1)

          old = '(unsigned long long)boottime.tv_sec,\n\t\ttotal_forks'
          new = '(unsigned long long)ghost_uptime_fake_btime_sec(&boottime),\n\t\ttotal_forks'
          if old in p:
              p = p.replace(old, new, 1)
          elif 'ghost_uptime_fake_btime_sec(&boottime)' not in p:
              # Fallback for single-line/minified formatting.
              p2, n = re.subn(r'\(unsigned long long\)boottime\.tv_sec', r'(unsigned long long)ghost_uptime_fake_btime_sec(&boottime)', p, count=1)
              if n != 1:
                  raise SystemExit('ERROR: btime boottime.tv_sec anchor not found in fs/proc/stat.c')
              p = p2
          write(ps, p)

          print('Wrote include/linux/ghost_uptime.h')
          print('Patched kernel/time/timekeeping.c: arch_sys_boot_offset plus CLOCK_BOOTTIME API wrapper offset, no boot_offset shift')
          print('Patched fs/stat.c: procfs shift/sanitize plus old sysfs/pstore timestamp sanitizer V67')
          print('Patched fs/proc/uptime.c: no direct offset; follows patched CLOCK_BOOTTIME path')
          print('Patched fs/proc/stat.c: btime offset sync')
          PY_GHOST_UPTIME_V61

          echo "===== GHOST UPTIME V61 VERIFY =====" | tee -a ../setup.log
          grep -RnsE 'arch_sys_boot_offset|ghost_uptime|GHOST_UPTIME|ghost_uptime_shift_stat|ghost_uptime_fake_btime_sec|TK_OFFS_BOOT|CLOCK_BOOTTIME' include/linux/ghost_uptime.h kernel/time/timekeeping.c kernel/time/timer_list.c kernel/printk/printk.c fs/stat.c fs/proc/uptime.c fs/proc/stat.c 2>/dev/null | head -260 | tee -a ../setup.log || true

          if ! grep -q 'arch_sys_boot_offset' kernel/time/timekeeping.c; then
            echo "ERROR: arch_sys_boot_offset missing from timekeeping.c" | tee -a ../setup.log
            exit 1
          fi
          if grep -q 'boot_offset.tv_sec +=.*ghost' kernel/time/timekeeping.c; then
