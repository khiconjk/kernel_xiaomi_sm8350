          EOF_V120_NOROOT_B64
          chmod 0755 "$TOOLS/V120.1-check-ghost-uptime-noroot.sh"
          sh -n "$TOOLS/V120.1-check-ghost-uptime-noroot.sh" 2>&1 | tee -a setup.log
          sha256sum "$TOOLS/V120.1-check-ghost-uptime-noroot.sh" | tee -a setup.log

          cat >"$TOOLS/V120.1-README-TOOLS.txt" <<'EOF_V120_README'
          V120.1 tools

          
          V120.1 firstboot guard module:
          1. Install ksu-modules/V120.1-firstboot-guard-KSU.zip in KernelSU Manager.
          2. Reboot once.
          3. Verify /data/local/tmp/V120.1-firstboot-guard.log.
          4. Run the V120 audit again. Root/ADB should report ro.runtime.firstboot
             age close to the exposed ghost uptime (within about 300 seconds).
          The module does not alter kernel timekeeping. It uses resetprop -n in
          post-fs-data before Zygote and refreshes the value at boot-completed.

          Runtime audit without root (run only after V120.1 boot and audio are confirmed):
          1. adb push V120.1-check-ghost-uptime-noroot.sh /data/local/tmp/
          2. adb shell chmod 755 /data/local/tmp/V120.1-check-ghost-uptime-noroot.sh
          3. adb shell /data/local/tmp/V120.1-check-ghost-uptime-noroot.sh
          4. Note the exact DONE path printed by the script, then run:
             adb pull /sdcard/Download/V120.1-noroot-uptime-audit-YYYYMMDD-HHMMSS.txt

          Directly from an Android terminal, without root:
             sh /sdcard/Download/V120.1-check-ghost-uptime-noroot.sh

          Prefer adb shell for the fullest report. An ordinary terminal app UID may
          be denied /proc/uptime and dumpsys; V120.1 tool then falls back to the current
          process starttime for the sysinfo consistency comparison.

          V120.1 retains V119.1 hardening: /proc/stat processes at readout only while leaving real
          total_forks accounting untouched, and retains the V115 ctxt range check. The
          V96 direct MONOTONIC/RAW proc probe is removed before the production build.
          The audit captures suspend_stats directories and flags
          alarmtimer/failed-suspend lines from dmesg. The retained V114 IRQ comparison sums
          only CPU columns and includes numeric IRQ plus IPI/arch rows. The old V114/V113-
          labelled tool incorrectly included non-CPU numeric tokens and excluded IPI/arch
          rows. The TWRP collector also captures files below suspend_stats directories.

          Bootloop collector in TWRP/OrangeFox:
          1. Copy V120.1-collect-in-twrp.sh to /sdcard.
          2. Open Recovery > Advanced > Terminal.
          3. Run: sh /sdcard/V120.1-collect-in-twrp.sh
          4. Send the resulting V120.1-bootloop-logs-*.tar.gz file.

          Both scripts are read-only. The TWRP script reads /dev/block/sda15 only
          when /proc/cmdline contains the exact block2mtd mapping observed in V103.
          EOF_V120_README

      - name: Build V120.1 KernelSU firstboot guard module
        shell: bash
        run: |
          set -Eeuo pipefail

          MODDIR="V120.1-firstboot-guard-module"
          MODZIP="V120.1-firstboot-guard-KSU.zip"
          rm -rf "$MODDIR" "$MODZIP"
          mkdir -p "$MODDIR"

          cat >"$MODDIR/module.prop" <<'EOF_V120_KSU_MODULE_PROP'
          id=v1201_firstboot_guard
          name=V120.1 Ghost Uptime Firstboot Guard
          version=V120.1
          versionCode=1201
          author=khiconjk
          description=Pre-seed ro.runtime.firstboot from the current ghost /proc/uptime before Zygote; refresh after boot without changing kernel timekeeping.
          EOF_V120_KSU_MODULE_PROP

          cat >"$MODDIR/post-fs-data.sh" <<'EOF_V120_KSU_POSTFS'
          #!/system/bin/sh
          # V120.1: early property guard; resetprop is the only property writer used here.
          LOG=/data/local/tmp/V120.1-firstboot-guard.log

          log()
          {
              printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)" "$*" >>"$LOG" 2>/dev/null || true
          }

          apply_firstboot_guard()
          {
              phase="$1"
              up_raw=""
              up_sec=""
              now_sec=""
              old=""
              new=""

              if [ -r /proc/uptime ]; then
                  read up_raw _rest </proc/uptime 2>/dev/null || up_raw=""
              fi
              up_sec="${up_raw%%.*}"
              now_sec="$(date +%s 2>/dev/null || true)"

              case "$up_sec" in
                  ''|*[!0-9]*) log "$phase invalid ghost uptime: ${up_raw:-unavailable}"; return 0 ;;
              esac
              case "$now_sec" in
                  ''|*[!0-9]*) log "$phase invalid wall clock: ${now_sec:-unavailable}"; return 0 ;;
              esac
              [ "$up_sec" -gt 0 ] || { log "$phase ghost uptime is zero"; return 0; }
              [ "$now_sec" -gt "$up_sec" ] || { log "$phase wall clock not usable yet"; return 0; }

              fake_boot_ms=$(( (now_sec - up_sec) * 1000 ))
              old="$(getprop ro.runtime.firstboot 2>/dev/null || true)"

              if ! command -v resetprop >/dev/null 2>&1; then
                  log "$phase resetprop unavailable; old=$old target=$fake_boot_ms"
                  return 0
              fi

              resetprop -n ro.runtime.firstboot "$fake_boot_ms" >/dev/null 2>&1 || {
                  log "$phase resetprop failed; old=$old target=$fake_boot_ms"
                  return 0
              }

              new="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
              log "$phase ghost_uptime_sec=$up_sec wall_epoch_sec=$now_sec old=$old target=$fake_boot_ms new=$new"
          }

          apply_firstboot_guard post-fs-data
          exit 0
          EOF_V120_KSU_POSTFS

          cat >"$MODDIR/boot-completed.sh" <<'EOF_V120_KSU_BOOT'
          #!/system/bin/sh
          # V120.1: refresh after boot in case RTC/network time moved after post-fs-data.
          LOG=/data/local/tmp/V120.1-firstboot-guard.log

          log()
          {
              printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)" "$*" >>"$LOG" 2>/dev/null || true
          }

          up_raw=""
          if [ -r /proc/uptime ]; then
              read up_raw _rest </proc/uptime 2>/dev/null || up_raw=""
          fi
          up_sec="${up_raw%%.*}"
          now_sec="$(date +%s 2>/dev/null || true)"

          case "$up_sec" in
              ''|*[!0-9]*) log "boot-completed invalid ghost uptime: ${up_raw:-unavailable}"; exit 0 ;;
          esac
          case "$now_sec" in
              ''|*[!0-9]*) log "boot-completed invalid wall clock"; exit 0 ;;
          esac
          [ "$up_sec" -gt 0 ] || exit 0
          [ "$now_sec" -gt "$up_sec" ] || exit 0

          fake_boot_ms=$(( (now_sec - up_sec) * 1000 ))
          old="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
          if command -v resetprop >/dev/null 2>&1; then
              resetprop -n ro.runtime.firstboot "$fake_boot_ms" >/dev/null 2>&1 || true
          fi
          new="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
          log "boot-completed ghost_uptime_sec=$up_sec wall_epoch_sec=$now_sec old=$old target=$fake_boot_ms new=$new"
          exit 0
          EOF_V120_KSU_BOOT

          chmod 0755 "$MODDIR/post-fs-data.sh" "$MODDIR/boot-completed.sh"
          sh -n "$MODDIR/post-fs-data.sh"
          sh -n "$MODDIR/boot-completed.sh"

          (cd "$MODDIR" && zip -r9 "../$MODZIP" . >/dev/null)
          test -s "$MODZIP"
          unzip -l "$MODZIP" | tee -a setup.log
          unzip -p "$MODZIP" module.prop | grep -qx 'version=V120.1'
          unzip -p "$MODZIP" post-fs-data.sh | grep -q 'resetprop -n ro.runtime.firstboot'
          unzip -p "$MODZIP" boot-completed.sh | grep -q 'resetprop -n ro.runtime.firstboot'
          # Ignore full-line comments when checking for the standalone setprop command.
          # V120 failed here because the safety comment itself contained the forbidden word.
          if unzip -p "$MODZIP" post-fs-data.sh \
              | sed '/^[[:space:]]*#/d' \
              | grep -Eq '(^|[[:space:]])setprop([[:space:]]|$)'; then
              echo "ERROR: unsafe standalone setprop command found in V120.1 post-fs-data" | tee -a setup.log
              exit 1
          fi
          sha256sum "$MODZIP" | tee -a setup.log

      - name: Collect outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          ARTIFACT_DIR="../${ARTIFACT_DIR}"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/kernel" "$ARTIFACT_DIR/dtb-output" "$ARTIFACT_DIR/modules" \
            "$ARTIFACT_DIR/logs/diagnostics" "$ARTIFACT_DIR/tools" "$ARTIFACT_DIR/ksu-modules"

          echo "===== COLLECT OUTPUTS =====" | tee -a ../build.log
          BOOT_DIR="$OUT_DIR/arch/arm64/boot"

          if [ -f "$BOOT_DIR/Image.gz" ]; then
            cp -a "$BOOT_DIR/Image.gz" "$ARTIFACT_DIR/kernel/Image.gz"
          fi
          if [ -f "$BOOT_DIR/Image" ]; then
            cp -a "$BOOT_DIR/Image" "$ARTIFACT_DIR/kernel/Image"
          fi
          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            cp -a "$BOOT_DIR/Image.gz-dtb" "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only"
          fi

          find "$BOOT_DIR" -type f \( -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \) -exec cp -a {} "$ARTIFACT_DIR/dtb-output/" \; 2>/dev/null || true
          find "$OUT_DIR" -type f -name '*.ko' -exec cp -a {} "$ARTIFACT_DIR/modules/" \; 2>/dev/null || true

          cp -a ../setup.log "$ARTIFACT_DIR/logs/setup.log" || true
          cp -a ../build.log "$ARTIFACT_DIR/logs/build.log" || true
          cp -a "../${APT_NETWORK_LOG}" "$ARTIFACT_DIR/logs/${APT_NETWORK_LOG}" || true
          cp -a "$OUT_DIR/System.map" "$ARTIFACT_DIR/logs/System.map" || true
          cp -a "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/logs/Module.symvers" || true
          cp -a ../V120.1-diagnostics/. "$ARTIFACT_DIR/logs/diagnostics/" || true
          cp -a ../V120.1-tools/. "$ARTIFACT_DIR/tools/" || true
          cp -a ../V120.1-firstboot-guard-KSU.zip "$ARTIFACT_DIR/ksu-modules/" || true

          echo "" | tee -a ../build.log
          echo "===== ARTIFACT TREE =====" | tee -a ../build.log
          find "$ARTIFACT_DIR" -maxdepth 3 -type f -printf '%p  %s bytes\n' | sort | tee -a ../build.log

          if [ ! -f "$ARTIFACT_DIR/kernel/Image.gz" ] && [ ! -f "$ARTIFACT_DIR/kernel/Image" ]; then
            echo "ERROR: no Image.gz/Image found. Kernel build is not usable." | tee -a ../build.log
            exit 1
          fi

      - name: Create AnyKernel3 flashable zip
        shell: bash
        run: |
          set -Eeuo pipefail
          ARTIFACT_DIR="${ARTIFACT_DIR}"
          AK3_DIR="AnyKernel3-vili"
          ZIP_NAME="${KERNEL_NAME}-AnyKernel3-${GITHUB_RUN_NUMBER}.zip"

          echo "===== CREATE ANYKERNEL3 ZIP =====" | tee -a build.log
          # AnyKernel3 removed backwards compatibility for lowercase user variables on 2026-06-28.
          # Pin a known revision and use the current uppercase API below.
          AK3_REF="1c9a500dd4aa8081952523126e97eb155aed941b"
          rm -rf "$AK3_DIR"
          git clone --no-checkout https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR" 2>&1 | tee -a build.log
          git -C "$AK3_DIR" fetch --depth=1 origin "$AK3_REF" 2>&1 | tee -a build.log
          git -C "$AK3_DIR" checkout --detach FETCH_HEAD 2>&1 | tee -a build.log
          echo "AnyKernel3 pinned commit: $(git -C "$AK3_DIR" rev-parse HEAD)" | tee -a build.log
          test "$(git -C "$AK3_DIR" rev-parse HEAD)" = "$AK3_REF"
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md" "$AK3_DIR/LICENSE" "$AK3_DIR/ramdisk" "$AK3_DIR/patch"

          cat > "$AK3_DIR/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # Flash target: Xiaomi 11T Pro / vili / HyperOS 1.0.22 Android 14
          
          properties() { '
          kernel.string=V120 KangarooX vili A14 V119.1 retained + firstboot guard KSU module
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=Xiaomi 11T Pro
          device.name3=2107113SG
          device.name4=2107113SI
          device.name5=2107113SR
          supported.versions=14 - 14
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          
          . tools/ak3-core.sh;
          
          dump_boot;
          write_boot;
          EOF

          if [ -f "$ARTIFACT_DIR/kernel/Image.gz" ]; then
            cp -a "$ARTIFACT_DIR/kernel/Image.gz" "$AK3_DIR/Image.gz"
          elif [ -f "$ARTIFACT_DIR/kernel/Image" ]; then
            cp -a "$ARTIFACT_DIR/kernel/Image" "$AK3_DIR/Image"
          elif [ -f "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only" ]; then
            echo "WARNING: Image.gz not found, using Image.gz-dtb fallback. For HyperOS A14, Image.gz is preferred." | tee -a build.log
            cp -a "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only" "$AK3_DIR/Image.gz-dtb"
          else
            echo "ERROR: no kernel image found for AnyKernel3" | tee -a build.log
            exit 1
          fi

          cat > "$ARTIFACT_DIR/V120.1-README-FLASH.txt" <<EOF
          V120 - Xiaomi 11T Pro vili - HyperOS 1.0.22 Android 14
          KernelSU-Next legacy + SuSFS + ghost uptime + Xiaomi audio-compatible sources retained

          V120 change:
            Retain the complete V119.1 kernel image behavior and pristine vDSO.
            Add an optional KernelSU module that pre-seeds ro.runtime.firstboot from
            wall clock minus the current ghost /proc/uptime before Zygote, then refreshes
            the property after boot completion. No kernel clock source is changed by V120.

          Retained and unchanged:
            V115 /proc/stat ctxt, V114 intr, V111 softirq, V110 cpufreq, V109 sysinfo,
            V108 cpuidle, V105 POSIX times, all earlier concealment, audio FIX2,
            KernelSU/SuSFS, V61 BOOTTIME ghost exposure, V91A syscall-only MONOTONIC,
            pristine lib/vdso/gettimeofday.c and pristine kernel/time/vsyscall.c.
            No real process/context-switch accounting, IRQ accounting, vDSO, scheduler,
            hrtimer, sched_clock, local_clock, ktime_get or core timekeeping is changed.
            V119.1 /proc/stat processes hardening and V96 probe removal are retained exactly.

          Flash file:
            flashable/$ZIP_NAME

          Safety:
            1. Back up boot.img before flashing.
            2. Flash only the AnyKernel3 ZIP in flashable/ through TWRP.
            3. Do not flash dtb-output/ or modules inspection files.
            4. Verify boot, speaker, microphone, KernelSU, Wi-Fi and a basic call.
            5. If bootloop occurs, run tools/V120.1-collect-in-twrp.sh before restoring
               the confirmed V114 boot image or stock boot.img.
            6. After a successful kernel boot, install ksu-modules/V120.1-firstboot-guard-KSU.zip
               through KernelSU Manager and reboot once.
            7. Check /data/local/tmp/V120.1-firstboot-guard.log, then run
               tools/V120.1-check-ghost-uptime-noroot.sh and send the exact V120.1 report.

          Artifact contents:
            kernel/: Image.gz or Image.
            logs/: setup.log, build.log, final.config and diagnostics/source-diff.patch.
            tools/: V120.1-check-ghost-uptime-noroot.sh, V120.1-collect-in-twrp.sh and README.
            ksu-modules/: V120.1-firstboot-guard-KSU.zip (optional userspace property guard).
          EOF

          mkdir -p "$ARTIFACT_DIR/flashable"
          (cd "$AK3_DIR" && zip -r9 "../$ZIP_NAME" . -x '*.git*' 2>&1 | tee -a ../build.log)
          mv "$ZIP_NAME" "$ARTIFACT_DIR/flashable/$ZIP_NAME"

          echo "" | tee -a build.log
          echo "===== FLASHABLE ZIP =====" | tee -a build.log
          ls -lh "$ARTIFACT_DIR/flashable" | tee -a build.log

          echo "===== FLASHABLE ZIP PREFLIGHT =====" | tee -a build.log
          unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" | tee -a build.log
          unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" | grep -qE '[[:space:]]Image\.gz$'
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -q '^BLOCK='
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -q '^IS_SLOT_DEVICE='
          if unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -qE '^(block|is_slot_device|ramdisk_compression|patch_vbmeta_flag)='; then
            echo "ERROR: legacy lowercase AnyKernel3 variables detected" | tee -a build.log
            exit 1
          fi
          sha256sum "$ARTIFACT_DIR/flashable/$ZIP_NAME" | tee -a build.log

      - name: Pack modules inspection zip
        shell: bash
        run: |
          set -Eeuo pipefail
          ARTIFACT_DIR="${ARTIFACT_DIR}"
          echo "===== PACK MODULES INSPECTION ZIP =====" | tee -a build.log
          if find "$ARTIFACT_DIR/modules" -type f -name '*.ko' | grep -q .; then
            (cd "$ARTIFACT_DIR/modules" && zip -r9 "../${KERNEL_NAME}-modules-inspection-only-${GITHUB_RUN_NUMBER}.zip" . 2>&1 | tee -a ../../build.log)
          else
            echo "No modules found." | tee -a build.log
          fi

      - name: Finalize artifact logs
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d "${ARTIFACT_DIR}" ]; then
            mkdir -p "${ARTIFACT_DIR}/logs"
            cp -a setup.log "${ARTIFACT_DIR}/logs/setup.log" 2>/dev/null || true
            cp -a build.log "${ARTIFACT_DIR}/logs/build.log" 2>/dev/null || true
            cp -a "${APT_NETWORK_LOG}" "${ARTIFACT_DIR}/logs/${APT_NETWORK_LOG}" 2>/dev/null || true
            echo "Final artifact logs refreshed after AnyKernel3 packaging." | tee -a build.log
            cp -a build.log "${ARTIFACT_DIR}/logs/build.log" 2>/dev/null || true
          fi

      - name: Show real errors if failed
        if: failure()
        shell: bash
        run: |
          echo "===== SETUP ERROR LINES ====="
          if [ -f setup.log ]; then
            grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\.lld|make(\[[0-9]+\])?: \*\*\*' setup.log | tail -200 || true
          else
            echo "setup.log missing"
          fi

          echo ""
          echo "===== APT NETWORK LOG ====="
          if [ -f "${APT_NETWORK_LOG}" ]; then
            tail -250 "${APT_NETWORK_LOG}" || true
          else
            echo "${APT_NETWORK_LOG} missing"
          fi

          echo ""
          echo "===== BUILD ERROR LINES ====="
          if [ -f build.log ]; then
            grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\.lld|make(\[[0-9]+\])?: \*\*\*' build.log | tail -300 || true
            echo ""
            echo "===== LAST 250 BUILD LINES ====="
            tail -250 build.log || true
          else
            echo "build.log missing"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V120.1-vili-hyperos-a14-firstboot-guard-${{ github.run_number }}
          path: |
            V120.1-artifact-vili-hyperos-a14-firstboot-guard/**
            setup.log
            build.log
            V120.1-apt-network.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
