              'static int msm_dai_q6_dai_mi2s_probe(',
              'static int msm_dai_q6_mi2s_dev_remove(',
              'static int msm_dai_q6_mi2s_dev_remove(',
              'MI2S driver implementation')
          hybrid_h = transplant(
              current_h, official_h,
              '#define MSM_PRIM_MI2S_RX 0',
              '#define MSM_PRIM_MI2S 0',
              '#define MSM_DISPLAY_PORT\t0',
              '#define MSM_DISPLAY_PORT\t0',
              'MI2S interface IDs')
          hybrid_h = transplant(
              hybrid_h, official_h,
              'struct msm_mi2s_pdata {',
              'struct msm_mi2s_pdata {',
              'struct msm_meta_mi2s_pdata {',
              'struct msm_meta_mi2s_pdata {',
              'MI2S platform data')

          expected_ids = {
              'pri_mi2s_rx': 0, 'pri_mi2s_tx': 0,
