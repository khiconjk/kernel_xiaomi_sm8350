name: V120.1 HyperOS A14 firstboot guard and framework clock audit

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: V120.1-vili-hyperos-a14-firstboot-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: vili
  DEVICE_NAME: Xiaomi 11T Pro
  ROM_TARGET: HyperOS 1.0.22 Android 14
  DEFCONFIG: kangaroox-vili_defconfig
  ENABLE_KERNELSU: "true"
  KSU_REF: v3.2.0-legacy
  ENABLE_SUSFS: "true"
  SUSFS_REF: kernel-5.4
  VDSO_STAGE: "v1201-pristine-vdso-firstboot-guard"
  KERNEL_SOURCE_COMMIT: e2a1ac0d830bc241f61c3ffc3dc3afbbce25e00b
  KSU_COMMIT: 9b08e88862000d5c50fb2e43a5b75123cf472e54
  SUSFS_COMMIT: 76affd70abf61d77feb0a132f61365d6848505df
  AUDIO_COMPAT_SOURCE_COMMIT: b35c72560413287b0d8457838c55e2742267520a
  AUDIO_UPSTREAM_C_SHA256: fe5b431afeb4a21a98ac805725b77518974c68c1a074f04b039cc1d543136a2c
  AUDIO_UPSTREAM_H_SHA256: a18223e1c6f8a9b7f6642fa8dacbda8a8f38c2b0856113e7625f151dbdd3e23b
  AUDIO_UPSTREAM_DAILINK_SHA256: 68373ff2f994a08338b93a58a75394e09eebf1bf9d56b4550b32ab6e9fae4107
  AUDIO_COMPAT_C_SHA256: 8a3fcdda24fde932be23471a1a5a8eb5299077b6a99e6cf18639fb3d53f9aebd
  AUDIO_COMPAT_H_SHA256: fe7b5de6ffaf70cee34019d28ff4561cc9998d560195e44da87e0faca7adab25
  AUDIO_COMPAT_DAILINK_SHA256: f671d7fde1608c456e80433d47e487238f57f6a7963624ef2af9350ef04cc333
  KERNEL_BUILD_TIMESTAMP: Fri Aug 29 08:45:15 UTC 2025
  KERNEL_SOURCE_DATE_EPOCH: "1756457115"
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  ARTIFACT_DIR: V120.1-artifact-vili-hyperos-a14-firstboot-guard
  KERNEL_NAME: V120.1-vili-hyperos-a14-kangaroox-ksu-susfs-ghost-uptime-firstboot-guard
  APT_NETWORK_LOG: V120.1-apt-network.log
  KBUILD_BUILD_USER: github
  KBUILD_BUILD_HOST: actions

jobs:
  build:
    name: Build V120.1 vili kernel, AnyKernel3 zip and KernelSU firstboot guard
    runs-on: ubuntu-22.04

    steps:
      - name: Initialize logs
        shell: bash
        run: |
          set -Eeuo pipefail
          : > setup.log
          : > build.log
          : > "${APT_NETWORK_LOG}"
          echo "===== INIT =====" | tee -a setup.log
          echo "YAML_MARKER=V120_1_HYPEROS_A14_FIRSTBOOT_GUARD_BUILD_FIX" | tee -a setup.log
          echo "V120_CHANGE=Retain the proven V119.1 kernel readout hardening unchanged; add a KernelSU early-boot ro.runtime.firstboot guard derived from the current ghost /proc/uptime, plus stronger framework clock evidence collection." | tee -a setup.log
          echo "V120_1_BUILD_FIX=Ignore full-line comments when validating that post-fs-data contains no standalone setprop command." | tee -a setup.log
          echo "BUILD_FINDING=V114 passed bounded APT, compiled Image.gz, and created a verified AnyKernel3 ZIP." | tee -a setup.log
          echo "RUNTIME_FINDING=V114 booted with sys.boot_completed=1 and KernelSU root; its IRQ warning was caused by the V113-labelled audit parser summing non-CPU numeric fields and excluding IPI/arch rows." | tee -a setup.log
          echo "RUNTIME_SCOPE=V120 does not add another kernel clock shift. V119.1 proc/sysfs/BOOTTIME layers remain unchanged; V120 targets the privileged ro.runtime.firstboot property with a KernelSU module and audits remaining Java/native MONOTONIC framework duration leakage." | tee -a setup.log
          echo "V118_LOG_FINDING=The supplied archive has no direct V118 pstore panic. Android reached services, while alarm/framework timestamps were inconsistent with the kernel timer axis; this supports vDSO clock-domain incompatibility rather than an early kernel crash." | tee -a setup.log
          echo "LOG_FINDING=V103 pstore was empty; recovery cmdline maps mtdoops to /dev/block/sda15 with a 2 MiB record." | tee -a setup.log
          echo "LEVEL8_NOTE=V71 starts from V68 FIX2 PASS baseline. It keeps uptime/btime, sysfs/pstore sanitizer, CLOCK_BOOTTIME/VDSO, timer_list now-at/expires-at/next_event, printk/dmesg display sync, /proc/stat 1970 fix, and /proc/[pid]/stat field 22 task starttime sync. It intentionally removes the V69 scheduler visibility experiment because /proc/*/sched is absent on this ROM and V69 showed scheduling-while-atomic warnings. V71 only adds root/security dmesg noise cleanup and still does NOT patch CLOCK_MONOTONIC, RAW, scheduler core, hrtimer core, local_clock, sched_clock, ktime_get(), or timekeeping_get_delta." | tee -a setup.log
          date -u | tee -a setup.log
          echo "Kernel build timestamp forced to: ${KERNEL_BUILD_TIMESTAMP}" | tee -a setup.log
          echo "SOURCE_DATE_EPOCH forced to: ${KERNEL_SOURCE_DATE_EPOCH}" | tee -a setup.log
          uname -a | tee -a setup.log
          echo "" | tee -a setup.log
          echo "===== DISK BEFORE =====" | tee -a setup.log
          df -h | tee -a setup.log

      - name: Free disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "===== FREE DISK SPACE =====" | tee -a setup.log
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android/sdk || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          echo "" | tee -a setup.log
          echo "===== DISK AFTER CLEAN =====" | tee -a setup.log
          df -h | tee -a setup.log

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_SOURCE_COMMIT }}
          fetch-depth: 1
          submodules: false
          path: kernel

      - name: Install dependencies with bounded Ubuntu-only mirrors
        timeout-minutes: 14
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          APT_SOURCE_LIST=/tmp/V120.1-ubuntu-only.list
          packages=(
            bc
            bison
            build-essential
            ca-certificates
            ccache
            cpio
            curl
            dwarves
            file
            flex
            git
            kmod
            libelf-dev
            libssl-dev
            lld
            llvm
            lz4
            make
            pahole
            perl
            python-is-python3
            python3
            python3-pip
            rsync
            unzip
            xz-utils
            zip
            zstd
          )
          apt_options=(
            -o "Dir::Etc::sourcelist=${APT_SOURCE_LIST}"
            -o "Dir::Etc::sourceparts=-"
            -o "APT::Get::List-Cleanup=0"
            -o "Acquire::Retries=2"
            -o "Acquire::ForceIPv4=true"
            -o "Acquire::http::Timeout=20"
            -o "Acquire::https::Timeout=20"
            -o "DPkg::Lock::Timeout=60"
            -o "Dpkg::Use-Pty=0"
          )

          apt_log() {
            tee -a setup.log "${APT_NETWORK_LOG}"
          }

          write_ubuntu_sources() {
            local mirror="$1"
            printf '%s\n' \
              "deb ${mirror} jammy main restricted universe multiverse" \
              "deb ${mirror} jammy-updates main restricted universe multiverse" \
              "deb ${mirror} jammy-security main restricted universe multiverse" \
              "deb ${mirror} jammy-backports main restricted universe multiverse" \
              | sudo tee "${APT_SOURCE_LIST}" >/dev/null
          }

          update_from_mirror() {
            local mirror="$1"
            write_ubuntu_sources "$mirror"
            echo "APT mirror attempt: ${mirror}" | apt_log
            sudo sed -n '1,20p' "${APT_SOURCE_LIST}" | apt_log
            sudo timeout --signal=TERM --kill-after=15s 180s \
              apt-get "${apt_options[@]}" update 2>&1 | apt_log
          }

          echo "===== INSTALL DEPENDENCIES V120 RETAINED BOUNDED NETWORK FIX =====" | apt_log
          echo "Default runner APT sources are intentionally excluded from this step." | apt_log
          echo "This prevents unavailable Azure/Microsoft/Google indexes from blocking the kernel build." | apt_log
          date -u | apt_log

          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All required packages are already installed; apt-get update is skipped." | apt_log
          else
            echo "Missing packages: ${missing[*]}" | apt_log
            if update_from_mirror "https://archive.ubuntu.com/ubuntu"; then
              echo "Primary Ubuntu mirror update succeeded." | apt_log
            else
              echo "Primary Ubuntu mirror failed or timed out; trying the bounded fallback." | apt_log
              if update_from_mirror "https://mirrors.edge.kernel.org/ubuntu"; then
                echo "Fallback Ubuntu mirror update succeeded." | apt_log
              else
                echo "ERROR: both bounded Ubuntu mirror attempts failed." | apt_log
                exit 1
              fi
            fi

            echo "Installing only the missing packages with a five-minute command timeout." | apt_log
            sudo timeout --signal=TERM --kill-after=15s 300s \
              apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}" \
              2>&1 | apt_log
          fi

          echo "===== DEPENDENCY VERSION CHECK =====" | apt_log
          for command in bc bison ccache curl flex git ld.lld lz4 make pahole python3 rsync unzip zip zstd; do
            if command -v "$command" >/dev/null 2>&1; then
              printf 'OK: %-12s %s\n' "$command" "$(command -v "$command")" | apt_log
            else
              echo "ERROR: required command unavailable after dependency setup: ${command}" | apt_log
              exit 1
            fi
          done
          echo "Dependency setup completed without using the runner third-party repositories." | apt_log

      - name: Verify source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          echo "===== SOURCE INFO =====" | tee -a ../setup.log
          git remote -v | tee -a ../setup.log
          SOURCE_HEAD="$(git rev-parse HEAD)"
          echo "Kernel source HEAD: ${SOURCE_HEAD}" | tee -a ../setup.log
          if [ "$SOURCE_HEAD" != "$KERNEL_SOURCE_COMMIT" ]; then
            echo "ERROR: expected kernel source ${KERNEL_SOURCE_COMMIT}, got ${SOURCE_HEAD}" | tee -a ../setup.log
            exit 1
          fi
          git branch --show-current | tee -a ../setup.log || true
          echo "" | tee -a ../setup.log
          echo "===== REQUIRED FILES =====" | tee -a ../setup.log
          test -f Makefile
          test -f "arch/arm64/configs/${DEFCONFIG}"
          echo "OK: arch/arm64/configs/${DEFCONFIG}" | tee -a ../setup.log
          echo "" | tee -a ../setup.log
          echo "===== MAKEFILE VERSION =====" | tee -a ../setup.log
          grep -nE "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=" Makefile | tee -a ../setup.log || true
          echo "" | tee -a ../setup.log
          echo "===== DEFCONFIG QUICK CHECK =====" | tee -a ../setup.log
          grep -nE "CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_BUILD_ARM64_DT_OVERLAY|CONFIG_KSU|CONFIG_KERNELSU|CONFIG_SUSFS|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_LTO" "arch/arm64/configs/${DEFCONFIG}" | tee -a ../setup.log || true

      - name: Fix KernelSU references
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel
          echo "===== FIX KERNELSU REFERENCES =====" | tee -a ../setup.log
          echo "ENABLE_KERNELSU=${ENABLE_KERNELSU}" | tee -a ../setup.log
          echo "KSU_REF=${KSU_REF}" | tee -a ../setup.log
          echo "ENABLE_SUSFS=${ENABLE_SUSFS}" | tee -a ../setup.log
          echo "SUSFS_REF=${SUSFS_REF}" | tee -a ../setup.log

          echo "" | tee -a ../setup.log
          echo "===== KERNELSU REFERENCES BEFORE =====" | tee -a ../setup.log
          grep -nE 'kernelsu|CONFIG_KSU|CONFIG_KERNELSU' drivers/Makefile drivers/Kconfig "arch/arm64/configs/${DEFCONFIG}" 2>/dev/null | tee -a ../setup.log || true

          if [ "${ENABLE_KERNELSU}" = "true" ]; then
            echo "KernelSU enabled: installing KernelSU-Next into drivers/kernelsu." | tee -a ../setup.log
            rm -rf KernelSU KernelSU-Next

            # Preferred path: official KernelSU-Next setup script. It creates drivers/kernelsu
            # as a symlink to KernelSU-Next/kernel and injects Makefile/Kconfig lines if needed.
            if curl -fsSL https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh -o /tmp/ksu-setup.sh; then
              if [ -z "${KSU_REF}" ] || [ "${KSU_REF}" = "latest" ]; then
                sh /tmp/ksu-setup.sh 2>&1 | tee -a ../setup.log || true
              else
                sh /tmp/ksu-setup.sh "${KSU_REF}" 2>&1 | tee -a ../setup.log || true
              fi
            fi

            # Fallback: manual clone/symlink if setup.sh did not produce drivers/kernelsu/Makefile.
            if [ ! -f drivers/kernelsu/Makefile ]; then
              rm -rf drivers/kernelsu KernelSU-Next
              if [ -n "${KSU_REF}" ] && [ "${KSU_REF}" != "latest" ]; then
                git clone --depth=1 --branch "${KSU_REF}" https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next 2>&1 | tee -a ../setup.log \
                  || git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next 2>&1 | tee -a ../setup.log
              else
                git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next 2>&1 | tee -a ../setup.log
              fi
              ln -s ../KernelSU-Next/kernel drivers/kernelsu
            fi

            echo "===== PIN KERNELSU-NEXT SOURCE =====" | tee -a ../setup.log
            if [ ! -d KernelSU-Next/.git ]; then
              echo "ERROR: KernelSU-Next checkout is missing .git; cannot verify the pinned source" | tee -a ../setup.log
              exit 1
            fi
            if ! git -C KernelSU-Next cat-file -e "${KSU_COMMIT}^{commit}" 2>/dev/null; then
              git -C KernelSU-Next fetch --depth=1 origin "$KSU_COMMIT" 2>&1 | tee -a ../setup.log
            fi
            git -C KernelSU-Next checkout --detach "$KSU_COMMIT" 2>&1 | tee -a ../setup.log
            KSU_HEAD="$(git -C KernelSU-Next rev-parse HEAD)"
            echo "KernelSU-Next pinned commit: ${KSU_HEAD}" | tee -a ../setup.log
            test "$KSU_HEAD" = "$KSU_COMMIT"

            if [ ! -f drivers/kernelsu/Makefile ]; then
              echo "ERROR: drivers/kernelsu/Makefile still missing after KernelSU setup" | tee -a ../setup.log
              find drivers -maxdepth 2 \( -type d -o -type l \) \( -name '*kernel*' -o -name '*su*' \) | tee -a ../setup.log || true
              exit 1
            fi

            grep -q 'kernelsu' drivers/Makefile || printf '%s\n' 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

            # This vili kernel tree already contains manual KernelSU hooks in fs/*.c.
            # Use KernelSU-Next manual hook mode. Do NOT force KPROBES hook here.
            if ! grep -q 'config KSU_MANUAL_HOOK' drivers/kernelsu/Kconfig; then
              echo "ERROR: selected KernelSU-Next ref does not provide KSU_MANUAL_HOOK." | tee -a ../setup.log
              echo "Use ksu_ref=legacy for this vili Android 11/5.4 manual-hook kernel." | tee -a ../setup.log
              echo "===== drivers/kernelsu/Kconfig =====" | tee -a ../setup.log
              sed -n '1,260p' drivers/kernelsu/Kconfig | tee -a ../setup.log || true
              exit 1
            fi

            echo "===== KERNELSU-NEXT VERSION =====" | tee -a ../setup.log
            echo "Use the version generated by the pinned KernelSU-Next source; do not append a second -DKSU_VERSION." | tee -a ../setup.log

            echo "===== PATCH KERNELSU LEGACY MANUAL HOOK MARKER =====" | tee -a ../setup.log
            # KernelSU-Next legacy Kbuild validates manual-hook integration by
            # grepping kernel/reboot.c for ksu_handle_sys_reboot. This source
            # already has the fs hooks, but reboot.c is missing, so Kbuild stops
            # with: No hooks were defined. Patch reboot.c idempotently here.
            python3 - <<'PY_KSU_REBOOT_PATCH' 2>&1 | tee -a ../setup.log
          from pathlib import Path

          p = Path('kernel/reboot.c')
          s = p.read_text()
          orig = s

          extern_block = """#ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,
                                           void __user **arg);
          #endif

          """

          if 'ksu_handle_sys_reboot' not in s:
              marker_candidates = [
                  "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)",
                  "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd, void __user *, arg)",
              ]
              marker = next((m for m in marker_candidates if m in s), None)
              if marker is None:
                  raise SystemExit('ERROR: cannot find SYSCALL_DEFINE4(reboot...) in kernel/reboot.c')

              s = s.replace(marker, extern_block + marker, 1)

              variable_candidates = [
                  "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n\tchar buffer[256];\n\tint ret = 0;\n",
                  " struct pid_namespace *pid_ns = task_active_pid_ns(current); char buffer[256]; int ret = 0; ",
              ]
              old = next((v for v in variable_candidates if v in s), None)
              if old is None:
                  raise SystemExit('ERROR: cannot find local variable block in kernel/reboot.c')

              if '\n' in old:
                  new = old + "\n#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n"
              else:
                  new = old + "\n#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n"
              s = s.replace(old, new, 1)

          if s != orig:
              p.write_text(s)
              print('Patched kernel/reboot.c with ksu_handle_sys_reboot manual hook marker.')
          else:
              print('kernel/reboot.c already has ksu_handle_sys_reboot.')

          print('===== KSU HOOK MARKER CHECK =====')
          for path, token in [
              ('fs/exec.c', 'ksu_handle_execveat'),
              ('fs/open.c', 'ksu_handle_faccessat'),
              ('fs/read_write.c', 'ksu_handle_'),
              ('fs/stat.c', 'ksu_handle_stat'),
              ('kernel/reboot.c', 'ksu_handle_sys_reboot'),
          ]:
              data = Path(path).read_text(errors='ignore')
              print(('OK' if token in data else 'MISSING') + ': ' + path + ' contains ' + token)
          PY_KSU_REBOOT_PATCH

            if ! grep -q 'ksu_handle_sys_reboot' kernel/reboot.c; then
              echo "ERROR: kernel/reboot.c still lacks ksu_handle_sys_reboot after patch" | tee -a ../setup.log
              exit 1
            fi

            echo "===== PREPATCH KERNELSU LEGACY BACKPORTS BEFORE COMPILE =====" | tee -a ../setup.log
            # KernelSU-Next legacy tries to sed-in path_umount/can_umount from
            # drivers/kernelsu/Kbuild. That happens too late: fs/namespace.c may
            # already be compiled, then final LTO fails with undefined path_umount.
            # Patch these helpers before any make compile step so namespace.o
            # actually contains the symbol.
            python3 - <<'PY_KSU_BACKPORTS' 2>&1 | tee -a ../setup.log
          from pathlib import Path

          ns = Path('fs/namespace.c')
          ns_text = ns.read_text()

          anchor = 'static bool is_mnt_ns_file'
          if anchor not in ns_text:
              raise SystemExit('ERROR: cannot find anchor "static bool is_mnt_ns_file" in fs/namespace.c')

          can_umount_code = r'''static int can_umount(const struct path *path, int flags)
          {
                  struct mount *mnt = real_mount(path->mnt);
          
                  if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
                          return -EINVAL;
                  if (!may_mount())
                          return -EPERM;
                  if (path->dentry != path->mnt->mnt_root)
                          return -EINVAL;
                  if (!check_mnt(mnt))
                          return -EINVAL;
                  if (mnt->mnt.mnt_flags & MNT_LOCKED)
                          return -EINVAL;
                  if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
                          return -EPERM;
          
                  return 0;
          }
          
          '''

          path_umount_code = r'''int path_umount(struct path *path, int flags)
          {
                  struct mount *mnt = real_mount(path->mnt);
                  int ret;
          
                  ret = can_umount(path, flags);
                  if (!ret)
                          ret = do_umount(mnt, flags);
          
                  dput(path->dentry);
                  mntput_no_expire(mnt);
                  return ret;
          }
          
          '''

          insert = ''
          if 'static int can_umount(const struct path *path, int flags)' not in ns_text:
              insert += can_umount_code
              print('Prepatched fs/namespace.c: added can_umount().')
          else:
              print('fs/namespace.c already has can_umount().')

          if 'int path_umount(struct path *path, int flags)' not in ns_text:
              insert += path_umount_code
              print('Prepatched fs/namespace.c: added path_umount().')
          else:
              print('fs/namespace.c already has path_umount().')

          if insert:
              ns_text = ns_text.replace(anchor, insert + anchor, 1)
              ns.write_text(ns_text)

          internal = Path('fs/internal.h')
          ih = internal.read_text()
          if 'int path_umount(struct path *path, int flags);' not in ih:
              proto = 'int path_umount(struct path *path, int flags);\n'
              if 'extern void __init mnt_init' in ih:
                  lines = ih.splitlines(True)
                  out_lines = []
                  done = False
                  for line in lines:
                      out_lines.append(line)
                      if not done and 'extern void __init mnt_init' in line:
                          out_lines.append(proto)
                          done = True
                  ih = ''.join(out_lines)
              else:
                  ih += '\n' + proto
              internal.write_text(ih)
              print('Prepatched fs/internal.h: added path_umount prototype.')
          else:
              print('fs/internal.h already has path_umount prototype.')

          seccomp = Path('include/linux/seccomp.h')
          if seccomp.exists():
              sh = seccomp.read_text()
              if 'atomic_t filter_count;' not in sh and 'int mode;' in sh:
                  if '#include <linux/atomic.h>' not in sh:
                      sh = sh.replace('#include <linux/thread_info.h>\n', '#include <linux/thread_info.h>\n#include <linux/atomic.h>\n', 1)
                  sh = sh.replace('int mode;\n', 'int mode;\n\tatomic_t filter_count;\n', 1)
                  seccomp.write_text(sh)
                  print('Prepatched include/linux/seccomp.h: added filter_count.')
              else:
                  print('include/linux/seccomp.h already has filter_count or no standard mode field.')

          final_ns = ns.read_text()
          if 'int path_umount(struct path *path, int flags)' not in final_ns:
              raise SystemExit('ERROR: path_umount still missing after prepatch')
          PY_KSU_BACKPORTS

            if ! grep -q '^int path_umount(struct path \*path, int flags)' fs/namespace.c; then
              echo "ERROR: fs/namespace.c still lacks path_umount after prepatch" | tee -a ../setup.log
              exit 1
            fi

            if [ "${ENABLE_SUSFS}" = "true" ]; then
              echo "===== PORT SUSFS ON TOP OF KSU LEGACY MANUAL-HOOK =====" | tee -a ../setup.log
              echo "Root-first mode: keep KernelSU-Next legacy/manual-hook unchanged; port SuSFS kernel files around it." | tee -a ../setup.log
              rm -rf susfs4ksu

              if ! git clone --depth=1 --branch "${SUSFS_REF}" https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu 2>&1 | tee -a ../setup.log; then
                echo "GitLab clone failed, trying GitHub mirror Star-Seven/susfs4ksu." | tee -a ../setup.log
                git clone --depth=1 https://github.com/Star-Seven/susfs4ksu.git susfs4ksu 2>&1 | tee -a ../setup.log
              fi

              echo "===== PIN SUSFS SOURCE =====" | tee -a ../setup.log
              if ! git -C susfs4ksu cat-file -e "${SUSFS_COMMIT}^{commit}" 2>/dev/null; then
                if ! git -C susfs4ksu fetch --depth=1 origin "$SUSFS_COMMIT" 2>&1 | tee -a ../setup.log; then
                  git -C susfs4ksu remote remove v106-pin 2>/dev/null || true
                  git -C susfs4ksu remote add v106-pin https://github.com/Star-Seven/susfs4ksu.git
