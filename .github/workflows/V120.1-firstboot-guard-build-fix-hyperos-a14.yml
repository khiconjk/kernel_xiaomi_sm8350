          #ifdef CMD_SUSFS_ADD_SUS_PATH
                  case CMD_SUSFS_ADD_SUS_PATH:
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
                          return susfs_add_sus_path((struct st_susfs_sus_path __user *)arg3);
          #else
                          return -EOPNOTSUPP;
          #endif
          #endif

          #ifdef CMD_SUSFS_ADD_SUS_KSTAT
                  case CMD_SUSFS_ADD_SUS_KSTAT:
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
                          return susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg3);
          #else
                          return -EOPNOTSUPP;
          #endif
          #endif

          #ifdef CMD_SUSFS_UPDATE_SUS_KSTAT
                  case CMD_SUSFS_UPDATE_SUS_KSTAT:
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
                          return susfs_update_sus_kstat((struct st_susfs_sus_kstat __user *)arg3);
          #else
                          return -EOPNOTSUPP;
          #endif
          #endif

          #ifdef CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY
                  case CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:
