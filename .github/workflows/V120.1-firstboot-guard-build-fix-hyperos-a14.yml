           * LOG is enabled so runtime behaviour can be inspected from dmesg/kallsyms.
           */
          #include <linux/compiler.h>
          #include <linux/cred.h>
          #include <linux/kernel.h>
          #include <linux/sched.h>
          #include <linux/security.h>
          #include <linux/string.h>
          #include <linux/types.h>

          static bool vili_susfs_current_secctx_has(const char *needle)
          {
          #if IS_ENABLED(CONFIG_SECURITY)
                  u32 secid = 0;
                  char *secctx = NULL;
                  u32 secctx_len = 0;
                  bool matched = false;

                  if (!needle || !needle[0])
                          return false;

                  security_cred_getsecid(current_cred(), &secid);
                  if (!secid)
                          return false;

                  if (security_secid_to_secctx(secid, &secctx, &secctx_len))
                          return false;

                  if (secctx) {
                          matched = strstr(secctx, needle) != NULL;
                          security_release_secctx(secctx, secctx_len);
                  }

                  return matched;
          #else
                  (void)needle;
                  return false;
          #endif
          }

          bool susfs_is_current_ksu_domain(void)
          {
                  const char *comm = current->comm;

                  if (vili_susfs_current_secctx_has("u:r:ksu:s0") ||
                      vili_susfs_current_secctx_has(":ksu:"))
                          return true;

                  /* Fallback for very early KSU helper threads or kernels where
                   * secctx lookup is unavailable during this call path.
                   */
                  if (comm && (!strcmp(comm, "ksud") ||
                               !strcmp(comm, "su") ||
                               !strcmp(comm, "ksu")))
                          return true;

                  return false;
          }

          bool susfs_is_current_zygote_domain(void)
          {
                  const char *comm = current->comm;

                  if (vili_susfs_current_secctx_has("u:r:zygote:s0") ||
                      vili_susfs_current_secctx_has(":zygote:"))
                          return true;

                  if (!comm)
                          return false;

                  return !strcmp(comm, "zygote") ||
                         !strcmp(comm, "zygote64") ||
                         !strcmp(comm, "zygote32") ||
                         !strcmp(comm, "main");
          }

