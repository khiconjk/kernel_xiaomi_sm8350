          cat >"$MODDIR/boot-completed.sh" <<'EOF_V1251_BOOTCOMPLETED'
          #!/system/bin/sh
          # V125.1: refresh firstboot after RTC/NITZ/NTP has stabilized and record wrapper integrity.
          LOG=/data/local/tmp/V125.1-ghost-guard.log
          REAL_RUNTIME=/dev/.v1251-logcat-real
          WRAP_RUNTIME=/dev/.v1251-logcat-wrapper
          TARGET=/system/bin/logcat
          
          logmsg()
          {
