              'static long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)',
              new_assignment,
              'get_avenrun(info->loads, 0, SI_LOAD_SHIFT - FSHIFT);',
              'info->procs = nr_threads;',
              'si_meminfo(info);',
              'si_swapinfo(info);',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: incomplete V106 sysinfo layer: {missing}')
          if old_assignment in text:
              raise SystemExit('ERROR: real sysinfo uptime assignment remains after V106')
          path.write_text(text)
          print('V106 sysinfo(2) uptime readout patch applied to the shared native/compat producer.')
          PY_V106_SYSINFO

          git diff --check -- kernel/sys.c
          grep -nE 'Vili CI V10(5|6)|vili_ghost_(times|sysinfo)|do_sysinfo|SYSCALL_DEFINE1\(sysinfo' \
            kernel/sys.c | tee -a ../setup.log

          if grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \
              lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then
            echo "ERROR: experimental vDSO code reappeared in V106" | tee -a ../setup.log
            exit 1
          fi

          echo "V106 single-layer patch verified: only sysinfo.uptime adds a new ghost-uptime readout." | tee -a ../setup.log

      - name: Apply retained V108 fixed cpuidle sysfs time readout layer
