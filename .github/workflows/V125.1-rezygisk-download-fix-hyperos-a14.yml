          expected_counts['tert_mi2s_rx'] = 2
          start_re = re.compile(r'^SND_SOC_DAILINK_DEFS\(([a-z0-9_]+),')
          cpu_re = re.compile(r'msm-dai-q6-mi2s\.\d+')

          def collect_ids(text):
              found = {name: [] for name in expected_ids}
              active = None
              for line in text.splitlines():
                  match = start_re.match(line)
                  if match:
                      active = match.group(1) if match.group(1) in expected_ids else None
                  if active:
                      cpu = re.search(r'COMP_CPU\("msm-dai-q6-mi2s\.(\d+)"\)', line)
