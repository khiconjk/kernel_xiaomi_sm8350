          for name, expected_id in expected_ids.items():
              if not official_ids[name] or set(official_ids[name]) != {expected_id}:
                  raise SystemExit(
                      f'ERROR: official vili mapping mismatch for {name}: {official_ids[name]}')

          seen = {name: 0 for name in expected_ids}
