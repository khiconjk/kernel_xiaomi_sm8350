                  line, count = cpu_re.subn(
                      f'msm-dai-q6-mi2s.{expected_ids[active]}', line)
                  if count != 1:
                      raise SystemExit(
                          f'ERROR: bad machine-link replacement count for {active}: {count}')
                  seen[active] += 1
              output_lines.append(line)
          if seen != expected_counts:
              raise SystemExit(
                  f'ERROR: machine-link definition counts changed: {seen} != {expected_counts}')
