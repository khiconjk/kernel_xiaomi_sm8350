      - name: Create AnyKernel3 flashable zip
        shell: bash
        run: |
          set -Eeuo pipefail
          ARTIFACT_DIR="${ARTIFACT_DIR}"
          AK3_DIR="AnyKernel3-vili"
          ZIP_NAME="${KERNEL_NAME}-AnyKernel3-${GITHUB_RUN_NUMBER}.zip"

          echo "===== CREATE ANYKERNEL3 ZIP =====" | tee -a build.log
          # AnyKernel3 removed backwards compatibility for lowercase user variables on 2026-06-28.
          # Pin a known revision and use the current uppercase API below.
          AK3_REF="1c9a500dd4aa8081952523126e97eb155aed941b"
          rm -rf "$AK3_DIR"
          git clone --no-checkout https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR" 2>&1 | tee -a build.log
          git -C "$AK3_DIR" fetch --depth=1 origin "$AK3_REF" 2>&1 | tee -a build.log
          git -C "$AK3_DIR" checkout --detach FETCH_HEAD 2>&1 | tee -a build.log
          echo "AnyKernel3 pinned commit: $(git -C "$AK3_DIR" rev-parse HEAD)" | tee -a build.log
          test "$(git -C "$AK3_DIR" rev-parse HEAD)" = "$AK3_REF"
          rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md" "$AK3_DIR/LICENSE" "$AK3_DIR/ramdisk" "$AK3_DIR/patch"

          # Carry the V125.1 V123-retained shell guards plus package-scoped Zygisk Java canary inside the flashable package.
          # It uses skip_mount and its own bind mounts, so no KernelSU metamodule is required.
          rm -rf "$AK3_DIR/v1251-ksu-module"
          mkdir -p "$AK3_DIR/v1251-ksu-module"
          unzip -q "V125.1-ghost-app-clock-autoloader-KSU.zip" -d "$AK3_DIR/v1251-ksu-module"
          test -f "$AK3_DIR/v1251-ksu-module/module.prop"
          test -f "$AK3_DIR/v1251-ksu-module/post-fs-data.sh"
          test -f "$AK3_DIR/v1251-ksu-module/boot-completed.sh"
          test -f "$AK3_DIR/v1251-ksu-module/post-mount.sh"
          test -f "$AK3_DIR/v1251-ksu-module/bin/logcat-wrapper"
          test -f "$AK3_DIR/v1251-ksu-module/target_package"
          test -f "$AK3_DIR/v1251-ksu-module/zygisk/arm64-v8a.so"
          test -f "$AK3_DIR/v1251-ksu-module/zygisk/armeabi-v7a.so"
          grep -qx 'id=v1251_ghost_guard' "$AK3_DIR/v1251-ksu-module/module.prop"

          cat > "$AK3_DIR/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # Flash target: Xiaomi 11T Pro / vili / HyperOS 1.0.22 Android 14

          properties() { '
          kernel.string=V125.1 KangarooX vili A14 V119.1 retained + package-scoped app clock canary
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=vili
          device.name2=Xiaomi 11T Pro
          device.name3=2107113SG
          device.name4=2107113SI
          device.name5=2107113SR
          supported.versions=14 - 14
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          V1251_AK3_HOME="$PWD";
          . tools/ak3-core.sh;

          V1251_SRC="$V1251_AK3_HOME/v1251-ksu-module";
          V1251_DST="/data/adb/modules/v1251_ghost_guard";
          if [ -d /data/adb ] && [ -w /data/adb ] && [ -f "$V1251_SRC/module.prop" ]; then
            ui_print "V125.1: activating KernelSU ghost app-clock canary";
            mkdir -p /data/adb/modules;
            rm -rf /data/adb/modules/v120_firstboot_guard /data/adb/modules/v1201_firstboot_guard /data/adb/modules/v121_firstboot_guard /data/adb/modules/v122_ghost_guard /data/adb/modules/v123_ghost_guard "$V1251_DST";
            mkdir -p "$V1251_DST";
            cp -af "$V1251_SRC"/. "$V1251_DST"/;
            chown -R 0:0 "$V1251_DST" 2>/dev/null || true;
            chmod 0755 "$V1251_DST/post-fs-data.sh" "$V1251_DST/post-mount.sh" "$V1251_DST/boot-completed.sh" "$V1251_DST/bin/logcat-wrapper" "$V1251_DST/zygisk/arm64-v8a.so" "$V1251_DST/zygisk/armeabi-v7a.so" 2>/dev/null || true;
            chmod 0644 "$V1251_DST/module.prop" "$V1251_DST/skip_mount" "$V1251_DST/target_package" "$V1251_DST/src/module.cpp" "$V1251_DST/src/zygisk_min.hpp" 2>/dev/null || true;
            rm -f "$V1251_DST/disable" "$V1251_DST/remove";
            ui_print "V125.1: ghost app-clock canary staged at $V1251_DST";
          else
            ui_print "V125.1: /data/adb unavailable; ghost guard auto-activation skipped";
            ui_print "V125.1: install the bundled KSU module manually after boot";
          fi;

          dump_boot;
          write_boot;
          EOF

          if [ -f "$ARTIFACT_DIR/kernel/Image.gz" ]; then
            cp -a "$ARTIFACT_DIR/kernel/Image.gz" "$AK3_DIR/Image.gz"
          elif [ -f "$ARTIFACT_DIR/kernel/Image" ]; then
            cp -a "$ARTIFACT_DIR/kernel/Image" "$AK3_DIR/Image"
          elif [ -f "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only" ]; then
            echo "WARNING: Image.gz not found, using Image.gz-dtb fallback. For HyperOS A14, Image.gz is preferred." | tee -a build.log
            cp -a "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only" "$AK3_DIR/Image.gz-dtb"
          else
            echo "ERROR: no kernel image found for AnyKernel3" | tee -a build.log
            exit 1
          fi

          cat > "$ARTIFACT_DIR/V125.1-README-FLASH.txt" <<EOF
          V125.1 - Xiaomi 11T Pro vili - HyperOS 1.0.22 Android 14
          KernelSU legacy + SuSFS + retained V119.1/V123 ghost layers + package-scoped Java MONOTONIC canary

          Proven V123 input evidence:
          - Root: 21 PASS / 1 WARN. ADB shell: 18 PASS / 1 WARN.
          - /proc/uptime and btime were aligned on ~17-day ghost axis.
          - ro.runtime.firstboot differed from ghost uptime by only 1 second.
          - preserved real logcat was 169552 bytes, wrapper 2659 bytes, hashes distinct.
          - logcat -v monotonic was aligned to ghost axis by 3 seconds (root) and 6 seconds (shell), watchdog timeout 0.
          - Remaining warning was framework/app session-relative MONOTONIC behavior.

          V125.1 new layer:
          - Keeps all V123 shell guards unchanged.
          - Adds Zygisk API v4 canary libraries for arm64-v8a and armeabi-v7a.
          - Resolves only package bin.mt.plus to target_uid and hooks only that UID's app processes.
          - Attempts android.os.SystemClock.uptimeMillis() and java.lang.System.nanoTime() JNI native entries.
          - Uses fake /proc/uptime minus real CLOCK_BOOTTIME to derive the existing ghost offset.
          - Does NOT hook elapsedRealtime because retained BOOTTIME is already ghosted.
          - Does NOT load into system_server; other apps remain untouched.
          - Any missing target UID, Zygisk loader, invalid offset, or JNI lookup is fail-open.

          Dependency/bootstrap:
          - V125.1 bundles the pinned ReZygisk v1.0.0 dependency only when the validated stable asset can be fetched; third-party dependency network failure no longer aborts the kernel/AnyKernel build.
          - If no compatible loader is present, V125.1 asks KernelSU ksud to install ReZygisk during boot-completed, then writes a reboot-required marker; it never auto-reboots.
          - Existing enabled ReZygisk or Zygisk Next is respected and V125.1 will not install a second loader.
          - If dependency staging fails, firstboot/logcat guards still work and the Java canary remains fail-open.

          Validation after boot:
          1. Open bin.mt.plus once.
          2. su -c 'cat /data/local/tmp/V125.1-ghost-guard.log'
          3. su -c 'cat /data/local/tmp/V125.1-app-clock-hook.log'
          4. su -c 'cat /data/adb/modules/v1251_ghost_guard/target_uid'
          5. logcat -v monotonic -d -t 10
          6. Run tools/V125.1-check-ghost-uptime-noroot.sh as root and adb shell.

          Safety boundary:
          V125.1 does not change global vDSO, CLOCK_MONOTONIC core, ktime_get, hrtimer, futex, scheduler, alarm/timer deadlines, or system_server. Direct native app clock_gettime(CLOCK_MONOTONIC/RAW) remains a later V126 candidate only if the V125.1 Java canary is stable.
          EOF

          mkdir -p "$ARTIFACT_DIR/flashable"
          (cd "$AK3_DIR" && zip -r9 "../$ZIP_NAME" . -x '*.git*' 2>&1 | tee -a ../build.log)
          mv "$ZIP_NAME" "$ARTIFACT_DIR/flashable/$ZIP_NAME"

          echo "" | tee -a build.log
          echo "===== FLASHABLE ZIP =====" | tee -a build.log
          ls -lh "$ARTIFACT_DIR/flashable" | tee -a build.log

          echo "===== FLASHABLE ZIP PREFLIGHT =====" | tee -a build.log
          unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" | tee -a build.log
          unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" | grep -qE '[[:space:]]Image\.gz$'
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -q '^BLOCK='
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -q '^IS_SLOT_DEVICE='
          unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" | grep -qE '[[:space:]]v1251-ksu-module/module\.prop$'
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v1251-ksu-module/module.prop | grep -qx 'id=v1251_ghost_guard'
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -q 'V125.1: ghost app-clock canary staged'
          unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" | grep -qE '[[:space:]]v1251-ksu-module/bin/logcat-wrapper$'
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v1251-ksu-module/bin/logcat-wrapper | sh -n
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v1251-ksu-module/bin/logcat-wrapper | grep -q '/dev/.v1251-logcat-real'
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v1251-ksu-module/target_package | grep -qx 'bin.mt.plus'
          for abi in arm64-v8a armeabi-v7a; do
            unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" "v1251-ksu-module/zygisk/$abi.so" >"$RUNNER_TEMP/ak-v1251-$abi.so"
            readelf -Ws "$RUNNER_TEMP/ak-v1251-$abi.so" | grep -q 'zygisk_module_entry'
            readelf -Ws "$RUNNER_TEMP/ak-v1251-$abi.so" | grep -q 'zygisk_companion_entry'
          done
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v1251-ksu-module/post-fs-data.sh | grep -q 'cp -f /system/bin/logcat'
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v1251-ksu-module/post-fs-data.sh | grep -q 'real_size.*-le 8192'
          if unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v1251-ksu-module/post-fs-data.sh | grep -q 'mount --bind /system/bin/logcat'; then
            echo "ERROR: V122 recursive file-bind preservation accidentally reintroduced" | tee -a build.log
            exit 1
          fi
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v1251-ksu-module/post-mount.sh | grep -q '/dev/.v1251-logcat-wrapper'
          if unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh | grep -qE '^(block|is_slot_device|ramdisk_compression|patch_vbmeta_flag)='; then
            echo "ERROR: legacy lowercase AnyKernel3 variables detected" | tee -a build.log
            exit 1
          fi
          sha256sum "$ARTIFACT_DIR/flashable/$ZIP_NAME" | tee -a build.log

      - name: Pack modules inspection zip
        shell: bash
        run: |
          set -Eeuo pipefail
          ARTIFACT_DIR="${ARTIFACT_DIR}"
          echo "===== PACK MODULES INSPECTION ZIP =====" | tee -a build.log
          if find "$ARTIFACT_DIR/modules" -type f -name '*.ko' | grep -q .; then
            (cd "$ARTIFACT_DIR/modules" && zip -r9 "../${KERNEL_NAME}-modules-inspection-only-${GITHUB_RUN_NUMBER}.zip" . 2>&1 | tee -a ../../build.log)
          else
            echo "No modules found." | tee -a build.log
          fi

      - name: Finalize artifact logs
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d "${ARTIFACT_DIR}" ]; then
            mkdir -p "${ARTIFACT_DIR}/logs"
            cp -a setup.log "${ARTIFACT_DIR}/logs/setup.log" 2>/dev/null || true
            cp -a build.log "${ARTIFACT_DIR}/logs/build.log" 2>/dev/null || true
            cp -a "${APT_NETWORK_LOG}" "${ARTIFACT_DIR}/logs/${APT_NETWORK_LOG}" 2>/dev/null || true
            echo "Final artifact logs refreshed after AnyKernel3 packaging." | tee -a build.log
            cp -a build.log "${ARTIFACT_DIR}/logs/build.log" 2>/dev/null || true
          fi

      - name: Show real errors if failed
        if: failure()
        shell: bash
        run: |
          echo "===== SETUP ERROR LINES ====="
          if [ -f setup.log ]; then
            grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\.lld|make(\[[0-9]+\])?: \*\*\*' setup.log | tail -200 || true
          else
            echo "setup.log missing"
          fi

          echo ""
          echo "===== APT NETWORK LOG ====="
          if [ -f "${APT_NETWORK_LOG}" ]; then
            tail -250 "${APT_NETWORK_LOG}" || true
          else
            echo "${APT_NETWORK_LOG} missing"
          fi

          echo ""
          echo "===== BUILD ERROR LINES ====="
          if [ -f build.log ]; then
            grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\.lld|make(\[[0-9]+\])?: \*\*\*' build.log | tail -300 || true
            echo ""
            echo "===== LAST 250 BUILD LINES ====="
            tail -250 build.log || true
          else
            echo "build.log missing"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V125.1-vili-hyperos-a14-rezygisk-app-clock-${{ github.run_number }}
          path: |
            V125.1-artifact-vili-hyperos-a14-rezygisk-app-clock/**
            setup.log
            build.log
            V125.1-apt-network.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
