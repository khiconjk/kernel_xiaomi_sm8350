            echo "ERROR: split MI2S machine-link CPU IDs 6-11 remain after FIX2" | tee -a ../setup.log
            exit 1
          fi

          echo "===== AUDIO FIX2 DIFFSTAT =====" | tee -a ../setup.log
          git diff --stat -- "$AUDIO_C" "$AUDIO_H" "$AUDIO_DAILINK" | tee -a ../setup.log
          echo "Complete official vili combined-node MI2S ABI applied successfully" | tee -a ../setup.log

      - name: Retain V105 POSIX times uptime readout layer
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel

          echo "===== RETAIN V105 POSIX times(2) UPTIME READOUT =====" | tee -a ../setup.log
          echo "V105 booted successfully. Reapply its exact elapsed-return patch before retaining V106/V108/V109 and adding V111." | tee -a ../setup.log
          echo "The tms CPU-duration fields stay real; vDSO and core timekeeping stay untouched." | tee -a ../setup.log

          python3 - <<'PY_V105_TIMES'
          from pathlib import Path

          path = Path('kernel/sys.c')
          text = path.read_text()
          original = text

          include = '#include <linux/ghost_uptime.h>'
          include_anchor = '#include <linux/times.h>'
          if include not in text:
              if text.count(include_anchor) != 1:
                  raise SystemExit(
                      f'ERROR: V105 times include anchor count is {text.count(include_anchor)}, expected 1')
              text = text.replace(include_anchor, include_anchor + '\n' + include, 1)

          marker = 'Vili CI V105: POSIX times(2) elapsed readout sync only.'
          helper_anchor = 'static void do_sys_times(struct tms *tms)'
          helper = r'''
          /*
           * Vili CI V105: POSIX times(2) elapsed readout sync only.
           * Shift only the public elapsed-time return value. The tms CPU accounting
           * fields and the kernel's internal jiffies remain untouched.
           */
          static u64 vili_ghost_times_jiffies(void)
          {
          	u64 now = get_jiffies_64();
          	u64 off_sec = ghost_uptime_offset_sec();

          	if (!off_sec)
          		return now;
          	if (off_sec > div_u64(~0ULL - now, HZ))
          		return ~0ULL;
          	return now + off_sec * HZ;
          }

          static long vili_ghost_times_clock_t(void)
          {
          	u64 ticks = jiffies_64_to_clock_t(vili_ghost_times_jiffies());

          	if (ticks > LONG_MAX)
          		return LONG_MAX;
          	return (long)ticks;
          }

          '''
          if marker not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit(
                      f'ERROR: V105 times helper anchor count is {text.count(helper_anchor)}, expected 1')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          native_old = 'return (long) jiffies_64_to_clock_t(get_jiffies_64());'
          native_new = 'return vili_ghost_times_clock_t();'
          if native_new not in text:
              if text.count(native_old) != 1:
                  raise SystemExit(
                      f'ERROR: V105 native times return count is {text.count(native_old)}, expected 1')
              text = text.replace(native_old, native_new, 1)

          compat_old = 'return compat_jiffies_to_clock_t(jiffies);'
          compat_new = 'return compat_jiffies_to_clock_t(vili_ghost_times_jiffies());'
          if compat_new not in text:
              if text.count(compat_old) != 1:
                  raise SystemExit(
                      f'ERROR: V105 compat times return count is {text.count(compat_old)}, expected 1')
              text = text.replace(compat_old, compat_new, 1)

          required = (
              include,
              marker,
              'static u64 vili_ghost_times_jiffies(void)',
              native_new,
              compat_new,
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'ERROR: incomplete retained V105 times layer: {missing}')
          if text == original:
              raise SystemExit('ERROR: retained V105 times layer made no source change')
          path.write_text(text)
          print('Retained V105 POSIX times(2) readout layer for native and compat tasks.')
          PY_V105_TIMES

          git diff --check -- kernel/sys.c
          grep -nE 'Vili CI V105|vili_ghost_times|SYSCALL_DEFINE1\(times' kernel/sys.c | tee -a ../setup.log

      - name: Apply V106 sysinfo uptime readout layer
        shell: bash
        run: |
          set -Eeuo pipefail
          cd kernel

          echo "===== V106 sysinfo(2) UPTIME READOUT =====" | tee -a ../setup.log
          echo "Starting point: V105 boot PASS. Change one read-only field in kernel/sys.c." | tee -a ../setup.log
          echo "Only struct sysinfo.uptime receives the existing random ghost offset." | tee -a ../setup.log
          echo "Load averages, process count, RAM/swap, vDSO, clocks, scheduler and CPU accounting remain unchanged." | tee -a ../setup.log

          python3 - <<'PY_V106_SYSINFO'
          from pathlib import Path

          path = Path('kernel/sys.c')
          text = path.read_text()
          original = text

          if '#include <linux/ghost_uptime.h>' not in text:
              raise SystemExit('ERROR: V105 ghost_uptime include is missing from kernel/sys.c')
          if 'Vili CI V105: POSIX times(2) elapsed readout sync only.' not in text:
              raise SystemExit('ERROR: V105 POSIX times layer is missing before V106')

          marker = 'Vili CI V106: sysinfo(2) uptime readout sync only.'
          helper_anchor = '''/**
           * do_sysinfo - fill in sysinfo struct
           * @info: pointer to buffer to fill
           */
          static int do_sysinfo(struct sysinfo *info)'''
          helper = r'''
          /*
           * Vili CI V106: sysinfo(2) uptime readout sync only.
           * Keep the kernel's real boot clock intact and shift only the public
           * struct sysinfo.uptime field. All other sysinfo fields remain real.
           */
          static long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)
          {
          	u64 real_sec;
          	u64 off_sec = ghost_uptime_offset_sec();

          	if (tp->tv_sec < 0)
          		return 0;
          	real_sec = (u64)tp->tv_sec;
          	if (tp->tv_nsec) {
          		if (real_sec == (u64)LONG_MAX)
          			return LONG_MAX;
          		real_sec++;
          	}
          	if (off_sec > (u64)LONG_MAX - real_sec)
          		return LONG_MAX;
          	return (long)(real_sec + off_sec);
          }

          '''
          if marker in text:
              raise SystemExit('ERROR: V106 sysinfo layer was unexpectedly present before this step')
          if text.count(helper_anchor) != 1:
              raise SystemExit(
                  f'ERROR: V106 do_sysinfo helper anchor count is {text.count(helper_anchor)}, expected 1')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_assignment = 'info->uptime = tp.tv_sec + (tp.tv_nsec ? 1 : 0);'
          new_assignment = 'info->uptime = vili_ghost_sysinfo_uptime(&tp);'
          if text.count(old_assignment) != 1:
              raise SystemExit(
                  f'ERROR: V106 sysinfo uptime assignment count is {text.count(old_assignment)}, expected 1')
          text = text.replace(old_assignment, new_assignment, 1)

          required = (
