          #endif
          #ifndef CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS
          #define CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS 0x555d0
          #endif
          #ifndef CMD_SUSFS_SHOW_VERSION
          #define CMD_SUSFS_SHOW_VERSION 0x555e1
          #endif
          #ifndef CMD_SUSFS_SHOW_ENABLED_FEATURES
          #define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x555e2
          #endif
          #ifndef CMD_SUSFS_SHOW_VARIANT
          #define CMD_SUSFS_SHOW_VARIANT 0x555e3
          #endif
          #ifndef CMD_SUSFS_SHOW_SUS_SU_WORKING_MODE
          #define CMD_SUSFS_SHOW_SUS_SU_WORKING_MODE 0x555e4
          #endif
          #ifndef CMD_SUSFS_IS_SUS_SU_READY
          #define CMD_SUSFS_IS_SUS_SU_READY 0x555f0
          #endif
          #ifndef CMD_SUSFS_SUS_SU
          #define CMD_SUSFS_SUS_SU 0x60000
          #endif
          #ifndef SUSFS_VERSION
          #define SUSFS_VERSION "1.5.5"
          #endif
          #ifndef SUSFS_VARIANT
          #define SUSFS_VARIANT "ksu"
          #endif

          #define VILI_SUSFS_FEAT_SUS_PATH          (1UL << 0)
          #define VILI_SUSFS_FEAT_SUS_MOUNT         (1UL << 1)
          #define VILI_SUSFS_FEAT_SUS_KSTAT         (1UL << 2)
          #define VILI_SUSFS_FEAT_TRY_UMOUNT        (1UL << 3)
          #define VILI_SUSFS_FEAT_SPOOF_UNAME       (1UL << 4)
          #define VILI_SUSFS_FEAT_ENABLE_LOG        (1UL << 5)
          #define VILI_SUSFS_FEAT_HIDE_SYMBOLS      (1UL << 6)
          #define VILI_SUSFS_FEAT_SPOOF_CMDLINE     (1UL << 7)
          #define VILI_SUSFS_FEAT_OPEN_REDIRECT     (1UL << 8)
          #define VILI_SUSFS_FEAT_SUS_SU            (1UL << 9)
          #define VILI_SUSFS_FEAT_SUS_MAP           (1UL << 10)
          #define VILI_SUSFS_FEAT_MAGIC_MOUNT       (1UL << 11)

          static unsigned long vili_susfs_enabled_features(void)
          {
                  unsigned long features = 0;
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
                  features |= VILI_SUSFS_FEAT_SUS_PATH;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
                  features |= VILI_SUSFS_FEAT_SUS_MOUNT;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
                  features |= VILI_SUSFS_FEAT_SUS_KSTAT;
          #endif
          #ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT
                  features |= VILI_SUSFS_FEAT_TRY_UMOUNT;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
                  features |= VILI_SUSFS_FEAT_SPOOF_UNAME;
          #endif
          #ifdef CONFIG_KSU_SUSFS_ENABLE_LOG
                  features |= VILI_SUSFS_FEAT_ENABLE_LOG;
          #endif
          #ifdef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
                  features |= VILI_SUSFS_FEAT_HIDE_SYMBOLS;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
                  features |= VILI_SUSFS_FEAT_SPOOF_CMDLINE;
          #endif
          #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT
                  /*
                   * Vili CI V42:
                   * OPEN_REDIRECT is enabled in kernel, but this bundled
                   * susfsd prints '?' when bit 8 is advertised in the generic
                   * feature mask. Keep the kernel function active and hide
                   * only the generic userspace bit, same strategy as SUS_SU.
                   */
                  if (0) features |= VILI_SUSFS_FEAT_OPEN_REDIRECT;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_SU
                  /*
                   * Vili CI V42:
                   * The bundled susfsd probes SUS_SU with dedicated commands.
                   * Advertising bit 9 in the generic feature mask makes this
                   * susfsd print '?'. Keep SUS_SU enabled but hide only this
                   * generic feature bit for userspace compatibility.
                   */
                  if (0) features |= VILI_SUSFS_FEAT_SUS_SU;
          #endif
          #ifdef CONFIG_KSU_SUSFS_SUS_MAP
                  features |= VILI_SUSFS_FEAT_SUS_MAP;
          #endif
          #ifdef CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
                  features |= VILI_SUSFS_FEAT_MAGIC_MOUNT;
          #endif
                  /*
                   * Vili CI V42:
                   * Keep OPEN_REDIRECT compiled in, but report the known-safe
                   * V36 userspace feature mask. The bundled susfsd prints '?'
                   * when newer optional bits are advertised, even though the
                   * kernel symbols and command handlers exist.
                   * Safe mask 2079 = SUS_PATH | SUS_MOUNT | SUS_KSTAT |
                   * TRY_UMOUNT | SPOOF_UNAME | HAS_MAGIC_MOUNT.
                   */
                  return 2079;
          }

          static int vili_get_i32_user(unsigned long user_ptr, s32 *value)
          {
                  if (!user_ptr || !value)
                          return -EINVAL;
                  if (copy_from_user(value, (void __user *)user_ptr, sizeof(*value)))
                          return -EFAULT;
                  return 0;
          }

          static int vili_put_i32_user(unsigned long user_ptr, s32 value)
          {
                  if (!user_ptr)
                          return 0;
                  if (copy_to_user((void __user *)user_ptr, &value, sizeof(value)))
                          return -EFAULT;
                  return 0;
          }

          static int vili_put_i32_pair(unsigned long p1, unsigned long p2,
                                       s32 v1, s32 v2, const char *tag)
          {
                  s32 old1 = 0x7fffffff;
                  s32 old2 = 0x7fffffff;
                  int ret;

                  if (p1)
                          vili_get_i32_user(p1, &old1);
                  if (p2)
                          vili_get_i32_user(p2, &old2);

                  ret = vili_put_i32_user(p1, v1);
                  if (ret)
                          goto out;
                  ret = vili_put_i32_user(p2, v2);

          out:
                  if (0) pr_err("VILI_SUSFS_BRIDGE_V30_%s: p1=0x%lx old1=%d new1=%d p2=0x%lx old2=%d new2=%d ret=%d\n",
                         tag ? tag : "I32", p1, old1, v1, p2, old2, v2, ret);
                  return ret;
          }

          static int vili_put_string_status(unsigned long p1, unsigned long p2,
                                            const char *value, const char *tag)
          {
                  s32 old2 = 0x7fffffff;
                  s32 ok = 0;
                  size_t len;
                  int ret;

                  if (!p1 || !value)
                          return -EINVAL;

                  len = strlen(value) + 1;
                  ret = copy_to_user((void __user *)p1, value, len) ? -EFAULT : 0;
                  if (!ret && p2) {
                          vili_get_i32_user(p2, &old2);
                          ret = vili_put_i32_user(p2, ok);
                  }

                  if (0) pr_err("VILI_SUSFS_BRIDGE_V30_%s: p1=0x%lx str=%s len=%zu p2=0x%lx old2=%d new2=%d ret=%d\n",
                         tag ? tag : "STRING_STATUS", p1, value, len, p2, old2, ok, ret);
                  return ret;
          }

          static int vili_put_features(unsigned long p1, unsigned long p2,
                                       unsigned long features)
          {
                  int ret;
                  ret = vili_put_i32_pair(p1, p2, (s32)features, 0, "FEATURES_I32");
                  if (!ret)
                          return 0;
                  return (int)features;
          }

          int ksu_vili_handle_susfs_prctl(unsigned long cmd, unsigned long arg3,
                                          unsigned long arg4, unsigned long arg5)
          {
                  if (0) pr_err("VILI_SUSFS_BRIDGE_V30: cmd=0x%lx arg3=0x%lx arg4=0x%lx arg5=0x%lx uid=%u comm=%s\n",
                         cmd, arg3, arg4, arg5, current_uid().val, current->comm);
                  switch (cmd) {
          #ifdef CMD_SUSFS_ADD_SUS_PATH
                  case CMD_SUSFS_ADD_SUS_PATH:
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
                          return susfs_add_sus_path((struct st_susfs_sus_path __user *)arg3);
          #else
                          return -EOPNOTSUPP;
          #endif
          #endif

          #ifdef CMD_SUSFS_ADD_SUS_KSTAT
                  case CMD_SUSFS_ADD_SUS_KSTAT:
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
                          return susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg3);
          #else
                          return -EOPNOTSUPP;
          #endif
          #endif

          #ifdef CMD_SUSFS_UPDATE_SUS_KSTAT
                  case CMD_SUSFS_UPDATE_SUS_KSTAT:
          #ifdef CONFIG_KSU_SUSFS_SUS_KSTAT
                          return susfs_update_sus_kstat((struct st_susfs_sus_kstat __user *)arg3);
          #else
                          return -EOPNOTSUPP;
          #endif
