          case "$now_sec" in ''|*[!0-9]*) now_sec=0 ;; esac
          
          if [ "$up_sec" -gt 0 ] && [ "$now_sec" -gt "$up_sec" ] && command -v resetprop >/dev/null 2>&1; then
              fake_boot_ms=$(( (now_sec - up_sec) * 1000 ))
              old="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
              resetprop -n ro.runtime.firstboot "$fake_boot_ms" >/dev/null 2>&1 || true
              new="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
              logmsg "boot-completed ghost_uptime_sec=$up_sec wall_epoch_sec=$now_sec old=$old target=$fake_boot_ms new=$new"
          fi
          
          real_size="$(wc -c <"$REAL_RUNTIME" 2>/dev/null | tr -cd '0-9')"
          wrap_size="$(wc -c <"$WRAP_RUNTIME" 2>/dev/null | tr -cd '0-9')"
          target_size="$(wc -c <"$TARGET" 2>/dev/null | tr -cd '0-9')"
          logmsg "boot-completed logcat_integrity real_size=${real_size:-0} wrapper_size=${wrap_size:-0} target_size=${target_size:-0}"
          
          MODDIR=${0%/*}
          pkg="$(head -n 1 "$MODDIR/target_package" 2>/dev/null | tr -d '\r\n' || true)"
          uid=""
          case "$pkg" in
              ''|*[!A-Za-z0-9._-]*) ;;
              *)
                  if [ -r /data/system/packages.list ]; then
                      uid="$(awk -v p="$pkg" '$1==p {print $2; exit}' /data/system/packages.list 2>/dev/null || true)"
                  fi
                  ;;
          esac
          case "$uid" in
              ''|*[!0-9]*)
                  logmsg "boot-completed target_uid unresolved package=${pkg:-unavailable}; Java canary remains fail-open"
                  ;;
              *)
                  printf '%s\n' "$uid" >"$MODDIR/target_uid" 2>/dev/null || true
                  chmod 0644 "$MODDIR/target_uid" "$MODDIR/target_package" 2>/dev/null || true
                  if command -v chcon >/dev/null 2>&1; then
                      chcon u:object_r:system_file:s0 "$MODDIR/target_uid" "$MODDIR/target_package" >/dev/null 2>&1 || true
                      chcon -R u:object_r:system_file:s0 "$MODDIR/zygisk" >/dev/null 2>&1 || true
                  fi
                  logmsg "boot-completed target_package=$pkg target_uid=$uid Java clock canary armed"
                  ;;
          esac
          
          # V125.1: bootstrap exactly one compatible Zygisk loader when none exists.
          # Never auto-reboot; a successful first install writes a reboot-required marker.
          REZ_DEP="$MODDIR/deps/ReZygisk-v1.0.0-515-333d423-release.zip"
          REZ_INSTALL_LOG=/data/local/tmp/V125.1-rezygisk-install.log
          REZ_REBOOT_MARKER=/data/local/tmp/V125.1-rezygisk-reboot-required

          loader_enabled()
          {
              d="$1"
              [ -f "$d/module.prop" ] && [ ! -e "$d/disable" ] && [ ! -e "$d/remove" ]
          }

          bootstrap_rezygisk()
          {
              if loader_enabled /data/adb/modules/rezygisk; then
                  rm -f "$REZ_REBOOT_MARKER" >/dev/null 2>&1 || true
                  logmsg "boot-completed ReZygisk already enabled; Java hook loader ready"
                  return 0
              fi
              if loader_enabled /data/adb/modules/zygisksu; then
                  rm -f "$REZ_REBOOT_MARKER" >/dev/null 2>&1 || true
                  logmsg "boot-completed existing Zygisk Next enabled; respecting existing loader"
                  return 0
              fi

