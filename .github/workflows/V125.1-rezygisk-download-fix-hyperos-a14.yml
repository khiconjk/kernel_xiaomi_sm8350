          u = read(up)
          uptime_anchor = 'ktime_get_boottime_ts64(&uptime);'
          if uptime_anchor not in u:
              raise SystemExit('ERROR: uptime ktime_get_boottime_ts64 anchor not found')
          u = re.sub(r'\n\s*/\* Vili CI V5[0-9]: make /proc/uptime reflect ghost boot age\. \*/\s*\n\s*if \(ghost_uptime_offset_sec\(\)\)\s*\n\s*uptime\.tv_sec \+= \(time64_t\)ghost_uptime_offset_sec\(\);', '', u, flags=re.S)
          uptime_marker = '/* Vili CI V61: /proc/uptime now follows patched CLOCK_BOOTTIME path; no second offset here. */'
          if uptime_marker not in u:
              u = u.replace(uptime_anchor, uptime_anchor + '\n\t' + uptime_marker, 1)
          write(up, u)

          # 5) /proc/stat btime: subtract the same visible offset from btime.
          ps = Path('fs/proc/stat.c')
          if not ps.exists():
              raise SystemExit('ERROR: fs/proc/stat.c missing')
          p = read(ps)
          if '<linux/ghost_uptime.h>' not in p:
              includes = list(re.finditer(r'^#include .*$', p, flags=re.M))
              if not includes:
                  raise SystemExit('ERROR: include anchor not found in proc stat.c')
              pos = includes[-1].end()
              p = p[:pos] + '\n#include <linux/ghost_uptime.h>' + p[pos:]

          btime_helper = """

          /* Vili CI V61: keep /proc/stat btime consistent with fake /proc/uptime. */
          static u64 ghost_uptime_fake_btime_sec(const struct timespec64 *boottime)
          {
                  u64 btime;
                  u64 off_sec;

                  if (!boottime || boottime->tv_sec <= 0)
                          return 0;

                  btime = (u64)boottime->tv_sec;
                  off_sec = ghost_uptime_offset_sec();

                  if (!off_sec)
