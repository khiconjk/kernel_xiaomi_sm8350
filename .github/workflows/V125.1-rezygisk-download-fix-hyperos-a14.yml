          chmod 0755 "$TOOLS/V125.1-check-ghost-uptime-noroot.sh"
          sh -n "$TOOLS/V125.1-check-ghost-uptime-noroot.sh" 2>&1 | tee -a setup.log
          sha256sum "$TOOLS/V125.1-check-ghost-uptime-noroot.sh" | tee -a setup.log

          cat >"$TOOLS/V125.1-README-TOOLS.txt" <<'EOF_V1251_README'
          V125.1 tools

          V125.1 self-bootstrapping package-scoped Java clock canary:
          1. Flash the V125.1 AnyKernel3 ZIP. It stages /data/adb/modules/v1251_ghost_guard when /data/adb is writable.
          2. Reboot once. V123 firstboot + recursion-proof logcat guards remain active without extra dependencies.
          3. V125.1 tries the official stable ReZygisk v1.0.0 asset first, then the IzzySoft mirror. The embedded module must report version v1.0.0 (515-333d423-release). If both external sources are unavailable, the kernel/AnyKernel build still completes and the Java canary remains fail-open until a compatible loader is installed manually.
          4. If the reboot-required marker exists after the first V125.1 boot, reboot once more so ReZygisk can load the V125.1 Zygisk SO. Existing enabled loaders are respected; V125.1 never installs a second loader.
          5. Default target is bin.mt.plus only. system_server and every other app UID remain untouched.
          6. Open/use bin.mt.plus after the loader-active boot, then run the root audit and inspect /data/local/tmp/V125.1-app-clock-hook.log.
          7. If /data/adb was unavailable while flashing, install ksu-modules/V125.1-ghost-app-clock-autoloader-KSU.zip manually in KernelSU Manager and reboot.

          Expected root evidence when the canary loads:
          - target_uid is resolved from /data/system/packages.list.
          - preAppSpecialize logs uptime_hook=1 and, when available, nano_hook=1.
          - a runtime uptimeMillis fake value is within about 120 seconds of the ghost uptime axis.
          - logcat -v monotonic remains within about 120 seconds of the ghost axis with watchdog_timeout=0.

          V125.1 does NOT modify kernel vDSO, ktime_get, scheduler, hrtimer, futex, alarm deadlines, or system_server clocks. If loader installation or a JNI lookup is unavailable, the Java canary fails open while the proven firstboot/logcat guards continue normally.

          Runtime audit:
          1. adb push V125.1-check-ghost-uptime-noroot.sh /data/local/tmp/
          2. adb shell chmod 755 /data/local/tmp/V125.1-check-ghost-uptime-noroot.sh
          3. adb shell su -c /data/local/tmp/V125.1-check-ghost-uptime-noroot.sh
          4. adb shell /data/local/tmp/V125.1-check-ghost-uptime-noroot.sh
          5. Pull the DONE paths printed by each run.

          Bootloop collector in TWRP/OrangeFox:
          1. Copy V125.1-collect-in-twrp.sh to /sdcard.
          2. Open Recovery > Advanced > Terminal.
          3. Run: sh /sdcard/V125.1-collect-in-twrp.sh
          4. Send the resulting V125.1-bootloop-logs-*.tar.gz file.

          Both audit/collector scripts are read-only. The TWRP script reads /dev/block/sda15 only when /proc/cmdline contains the exact block2mtd mapping observed in V103.
          EOF_V1251_README

      - name: Build V125.1 KernelSU app-clock canary + pinned ReZygisk dependency
        shell: bash
        run: |
          set -Eeuo pipefail

          MODDIR="V125.1-ghost-app-clock-autoloader-module"
          MODZIP="V125.1-ghost-app-clock-autoloader-KSU.zip"
          rm -rf "$MODDIR" "$MODZIP"
          mkdir -p "$MODDIR/bin" "$MODDIR/zygisk" "$MODDIR/src" "$MODDIR/deps"
          : >"$MODDIR/skip_mount"

          cat >"$MODDIR/module.prop" <<'EOF_V1251_MODULE_PROP'
          id=v1251_ghost_guard
          name=V125.1 Ghost Uptime App Clock Autoloader
          version=V125.1
          versionCode=1251
          author=khiconjk
          description=Retains proven firstboot and recursion-proof logcat guards, package-scopes Java MONOTONIC hooks to bin.mt.plus, and can stage pinned ReZygisk v1.0.0 when no compatible loader exists; kernel vDSO/system_server clocks remain untouched.
          EOF_V1251_MODULE_PROP
          cat >"$MODDIR/target_package" <<'EOF_V1251_TARGET_PACKAGE'
          bin.mt.plus
          EOF_V1251_TARGET_PACKAGE
          cat >"$MODDIR/post-fs-data.sh" <<'EOF_V1251_POSTFS'
          #!/system/bin/sh
          # V125.1: firstboot guard + recursion-proof preservation of the genuine logcat.
          # KernelSU runs this stage before module mounts. Never use setprop here.
          MODDIR=${0%/*}
          LOG=/data/local/tmp/V125.1-ghost-guard.log
          REAL_RUNTIME=/dev/.v1251-logcat-real
          WRAP_SOURCE="$MODDIR/bin/logcat-wrapper"
          
          logmsg()
          {
              printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)" "$*" >>"$LOG" 2>/dev/null || true
          }
          
          apply_firstboot_guard()
          {
              phase="$1"
              up_raw=""
              if [ -r /proc/uptime ]; then
                  read up_raw _rest </proc/uptime 2>/dev/null || up_raw=""
              fi
              up_sec="${up_raw%%.*}"
              now_sec="$(date +%s 2>/dev/null || true)"
          
              case "$up_sec" in
                  ''|*[!0-9]*) logmsg "$phase invalid ghost uptime: ${up_raw:-unavailable}"; return 0 ;;
              esac
              case "$now_sec" in
                  ''|*[!0-9]*) logmsg "$phase invalid wall clock: ${now_sec:-unavailable}"; return 0 ;;
              esac
              [ "$up_sec" -gt 0 ] || { logmsg "$phase ghost uptime is zero"; return 0; }
              [ "$now_sec" -gt "$up_sec" ] || { logmsg "$phase wall clock not usable yet"; return 0; }
          
              fake_boot_ms=$(( (now_sec - up_sec) * 1000 ))
              old="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
              if command -v resetprop >/dev/null 2>&1; then
                  resetprop -n ro.runtime.firstboot "$fake_boot_ms" >/dev/null 2>&1 || {
                      logmsg "$phase resetprop failed; old=$old target=$fake_boot_ms"
                      return 0
                  }
                  new="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
                  logmsg "$phase ghost_uptime_sec=$up_sec wall_epoch_sec=$now_sec old=$old target=$fake_boot_ms new=$new"
              else
                  logmsg "$phase resetprop unavailable; old=$old target=$fake_boot_ms"
              fi
          }
          
          file_size()
          {
              wc -c <"$1" 2>/dev/null | tr -cd '0-9'
          }
          
          file_hash()
          {
              if command -v sha256sum >/dev/null 2>&1; then
                  sha256sum "$1" 2>/dev/null | awk '{print $1}'
              else
                  cksum "$1" 2>/dev/null | awk '{print $1 ":" $2}'
              fi
          }
          
          apply_firstboot_guard post-fs-data
          
          resolve_v1251_target_uid()
          {
              pkg="$(head -n 1 "$MODDIR/target_package" 2>/dev/null | tr -d '\r\n' || true)"
              case "$pkg" in
                  ''|*[!A-Za-z0-9._-]*)
                      rm -f "$MODDIR/target_uid" >/dev/null 2>&1 || true
                      logmsg "post-fs-data target package is invalid: ${pkg:-unavailable}"
                      return 0
                      ;;
              esac
          
              uid=""
              if [ -r /data/system/packages.list ]; then
                  uid="$(awk -v p="$pkg" '$1==p {print $2; exit}' /data/system/packages.list 2>/dev/null || true)"
              fi
              case "$uid" in
                  ''|*[!0-9]*)
                      rm -f "$MODDIR/target_uid" >/dev/null 2>&1 || true
                      logmsg "post-fs-data target_uid unresolved package=$pkg; Java canary stays fail-open"
                      return 0
                      ;;
              esac
          
              printf '%s\n' "$uid" >"$MODDIR/target_uid" 2>/dev/null || {
                  logmsg "post-fs-data cannot write target_uid package=$pkg uid=$uid"
                  return 0
              }
