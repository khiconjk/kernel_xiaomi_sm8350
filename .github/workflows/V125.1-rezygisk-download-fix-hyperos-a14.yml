          static unsigned long long udivmod64(unsigned long long n, unsigned long long d, unsigned long long *rem) {
              if (d == 0) {
                  if (rem) *rem = 0;
                  return 0;
              }
              unsigned long long q = 0;
              unsigned long long r = 0;
              for (int i = 63; i >= 0; --i) {
                  r = (r << 1) | ((n >> i) & 1ULL);
                  if (r >= d) {
                      r -= d;
                      q |= (1ULL << i);
                  }
              }
              if (rem) *rem = r;
              return q;
          }
          
          static long long div_positive_i64(long long v, unsigned long long d) {
              if (v <= 0) return 0;
              return static_cast<long long>(udivmod64(static_cast<unsigned long long>(v), d, nullptr));
          }
          
          static unsigned long cstrlen(const char *s) {
              unsigned long n = 0;
              if (s) while (s[n]) ++n;
              return n;
          }
          
          static void append_char(char *buf, int &p, int cap, char c) {
              if (p < cap - 1) buf[p++] = c;
          }
          
          static void append_text(char *buf, int &p, int cap, const char *s) {
              if (!s) return;
              while (*s && p < cap - 1) buf[p++] = *s++;
          }
          
          static void append_i64(char *buf, int &p, int cap, long long v) {
              if (v < 0) {
                  append_char(buf, p, cap, '-');
                  if (v == (-9223372036854775807LL - 1LL)) {
                      append_text(buf, p, cap, "9223372036854775808");
                      return;
                  }
                  v = -v;
              }
              char tmp[32];
              int n = 0;
              do {
                  unsigned long long rem = 0;
                  unsigned long long q = udivmod64(static_cast<unsigned long long>(v), 10ULL, &rem);
                  tmp[n++] = char('0' + rem);
                  v = static_cast<long long>(q);
              } while (v && n < int(sizeof(tmp)));
              while (n > 0) append_char(buf, p, cap, tmp[--n]);
          }
          
          static void write_line(const char *kind, long long raw, long long fake) {
              if (event_fd < 0) return;
              char b[320];
              int p = 0;
              append_text(b, p, sizeof(b), kind);
              append_text(b, p, sizeof(b), " raw=");
              append_i64(b, p, sizeof(b), raw);
              append_text(b, p, sizeof(b), " fake=");
              append_i64(b, p, sizeof(b), fake);
              append_text(b, p, sizeof(b), " offset_ns=");
              append_i64(b, p, sizeof(b), ghost_offset_ns);
              append_char(b, p, sizeof(b), '\n');
              write(event_fd, b, (unsigned long)p);
          }
          
          static long long parse_positive_integer(const char *s, int n) {
              long long v = 0;
              bool any = false;
              for (int i = 0; i < n; ++i) {
                  char c = s[i];
                  if (c >= '0' && c <= '9') {
                      any = true;
                      if (v > 900000000000000000LL) return -1;
                      v = v * 10 + (c - '0');
                  } else if (c == '\n' || c == '\r' || c == ' ' || c == '\t') {
                      if (any) break;
                  } else {
                      return -1;
                  }
              }
              return any ? v : -1;
          }
          
          static long long read_target_uid(zygisk::Api *api) {
              if (!api) return -1;
              int dfd = api->getModuleDir();
              if (dfd < 0) return -1;
              int fd = openat(dfd, "target_uid", O_RDONLY_V1251, 0);
              close(dfd);
              if (fd < 0) return -1;
              char b[64];
              long n = read(fd, b, sizeof(b));
              close(fd);
              if (n <= 0) return -1;
              return parse_positive_integer(b, (int)n);
          }
          
          static long long parse_uptime_ns() {
              int fd = open("/proc/uptime", O_RDONLY_V1251, 0);
              if (fd < 0) return -1;
              char b[96];
              long n = read(fd, b, sizeof(b) - 1);
              close(fd);
              if (n <= 0) return -1;
              b[n] = 0;
          
              long long sec = 0;
              long long frac = 0;
              int frac_digits = 0;
              bool dot = false;
              bool any = false;
              for (long i = 0; i < n; ++i) {
                  const char c = b[i];
                  if (c >= '0' && c <= '9') {
                      any = true;
                      if (!dot) {
                          if (sec > 900000000LL) return -1;
                          sec = sec * 10 + (c - '0');
                      } else if (frac_digits < 9) {
                          frac = frac * 10 + (c - '0');
                          ++frac_digits;
                      }
                  } else if (c == '.' && !dot) {
                      dot = true;
                  } else {
                      break;
                  }
              }
              if (!any) return -1;
              while (frac_digits < 9) {
                  frac *= 10;
                  ++frac_digits;
              }
              return sec * 1000000000LL + frac;
          }
          
          static long long compute_offset_ns() {
              long long fake_boot_ns = parse_uptime_ns();
              if (fake_boot_ns <= 0) return 0;
              timespec_v125 ts{};
              if (clock_gettime(CLOCK_BOOTTIME_V1251, &ts) != 0) return 0;
              long long real_boot_ns = (long long)ts.tv_sec * 1000000000LL + ts.tv_nsec;
              long long off = fake_boot_ns - real_boot_ns;
              const long long min_off = 86400LL * 1000000000LL;
              const long long max_off = 40LL * 86400LL * 1000000000LL;
              if (off < min_off || off > max_off) return 0;
              return off;
          }
          
          static jlong hooked_uptime_millis() {
              if (!orig_uptime_millis) return 0;
              const jlong raw = orig_uptime_millis();
              const jlong fake = raw + div_positive_i64(ghost_offset_ns, 1000000ULL);
              if (uptime_log_budget > 0) {
                  --uptime_log_budget;
                  write_line("uptimeMillis", raw, fake);
              }
              return fake;
          }
          
          static jlong hooked_nano_time() {
              if (!orig_nano_time) return 0;
              const jlong raw = orig_nano_time();
              const jlong fake = raw + ghost_offset_ns;
              if (nano_log_budget > 0) {
                  --nano_log_budget;
                  write_line("nanoTime", raw, fake);
              }
              return fake;
          }
          
          class V1251Module final : public zygisk::ModuleBase {
          public:
              void onLoad(zygisk::Api *a, JNIEnv *e) override {
                  api = a;
                  env = e;
              }
          
              void preAppSpecialize(zygisk::AppSpecializeArgs *args) override {
                  if (!api || !env || !args) return;
                  const long long target_uid = read_target_uid(api);
                  if (target_uid <= 0 || (long long)args->uid != target_uid) return;
          
                  const long long off = compute_offset_ns();
                  if (off == 0) return;
                  ghost_offset_ns = off;
          
                  event_fd = api->connectCompanion();
                  if (event_fd >= 0 && !api->exemptFd(event_fd)) {
                      close(event_fd);
                      event_fd = -1;
                  }
          
                  JNINativeMethod uptime_method[] = {
                      {"uptimeMillis", "()J", (void *)hooked_uptime_millis},
                  };
                  api->hookJniNativeMethods(env, "android/os/SystemClock", uptime_method, 1);
                  orig_uptime_millis = reinterpret_cast<jlong (*)()>(uptime_method[0].fnPtr);
          
                  JNINativeMethod nano_method[] = {
                      {"nanoTime", "()J", (void *)hooked_nano_time},
                  };
                  api->hookJniNativeMethods(env, "java/lang/System", nano_method, 1);
                  orig_nano_time = reinterpret_cast<jlong (*)()>(nano_method[0].fnPtr);
          
                  char b[384];
                  int p = 0;
                  append_text(b, p, sizeof(b), "preAppSpecialize uid=");
                  append_i64(b, p, sizeof(b), args->uid);
                  append_text(b, p, sizeof(b), " offset_ms=");
                  append_i64(b, p, sizeof(b), div_positive_i64(ghost_offset_ns, 1000000ULL));
                  append_text(b, p, sizeof(b), " uptime_hook=");
                  append_i64(b, p, sizeof(b), orig_uptime_millis ? 1 : 0);
                  append_text(b, p, sizeof(b), " nano_hook=");
                  append_i64(b, p, sizeof(b), orig_nano_time ? 1 : 0);
                  append_char(b, p, sizeof(b), '\n');
                  if (event_fd >= 0) write(event_fd, b, (unsigned long)p);
              }
          
          private:
              zygisk::Api *api = nullptr;
              JNIEnv *env = nullptr;
          };
          
          extern "C" __attribute__((visibility("default")))
          void zygisk_companion_entry(int client) {
              int out = open("/data/local/tmp/V125.1-app-clock-hook.log",
                             O_WRONLY_V1251 | O_CREAT_V1251 | O_APPEND_V1251, 0666);
              if (out >= 0) fchmod(out, 0644);
              char b[512];
              int newline_count = 0;
              while (newline_count < 7) {
                  pollfd_v1251 pfd{client, POLLIN_V1251, 0};
                  int pr = poll(&pfd, 1, 15000);
                  if (pr <= 0) break;
                  long n = read(client, b, sizeof(b));
                  if (n <= 0) break;
                  if (out >= 0) write(out, b, (unsigned long)n);
                  for (long i = 0; i < n; ++i) if (b[i] == '\n') ++newline_count;
              }
              if (out >= 0) close(out);
              close(client);
          }
          
          extern "C" __attribute__((visibility("default")))
          void zygisk_module_entry(zygisk::internal::api_table *table, JNIEnv *env) {
              static zygisk::Api api;
              static V1251Module module;
              static zygisk::internal::module_abi abi(&module);
              api.tbl = table;
              if (!table || !table->registerModule || !table->registerModule(table, &abi)) return;
              module.onLoad(&api, env);
          }
          EOF_V1251_MODULE_CPP

          chmod 0755 "$MODDIR/post-fs-data.sh" "$MODDIR/post-mount.sh" "$MODDIR/boot-completed.sh" "$MODDIR/bin/logcat-wrapper"
          chmod 0644 "$MODDIR/module.prop" "$MODDIR/target_package" "$MODDIR/skip_mount" "$MODDIR/src/zygisk_min.hpp" "$MODDIR/src/module.cpp"

          sh -n "$MODDIR/post-fs-data.sh"
          sh -n "$MODDIR/post-mount.sh"
          sh -n "$MODDIR/boot-completed.sh"
          sh -n "$MODDIR/bin/logcat-wrapper"
          grep -qx 'id=v1251_ghost_guard' "$MODDIR/module.prop"
          grep -qx 'bin.mt.plus' "$MODDIR/target_package"
          grep -q 'resetprop -n ro.runtime.firstboot' "$MODDIR/post-fs-data.sh"
          grep -q 'cp -f /system/bin/logcat' "$MODDIR/post-fs-data.sh"
          grep -q 'target_uid' "$MODDIR/post-fs-data.sh"
          grep -q 'hookJniNativeMethods(env, "android/os/SystemClock"' "$MODDIR/src/module.cpp"
          grep -q 'hookJniNativeMethods(env, "java/lang/System"' "$MODDIR/src/module.cpp"
          grep -q 'CLOCK_BOOTTIME_V1251' "$MODDIR/src/module.cpp"
          grep -q '^#define ZYGISK_API_VERSION 4$' "$MODDIR/src/zygisk_min.hpp"
          if sed '/^[[:space:]]*#/d' "$MODDIR/post-fs-data.sh" | grep -Eq '(^|[[:space:]])setprop([[:space:]]|$)'; then
            echo "ERROR: unsafe setprop found in V125.1 post-fs-data"
            exit 1
          fi

          CXX="$HOME/.cache/weebx-clang/clang/bin/clang++"
          if [ ! -x "$CXX" ]; then
            CXX="$(command -v clang++ || true)"
          fi
          if [ -z "$CXX" ] || [ ! -x "$CXX" ]; then
            echo "ERROR: clang++ unavailable for V125.1 Zygisk canary build"
            exit 1
          fi
          echo "V125.1 Zygisk compiler: $($CXX --version | head -n 1)" | tee -a setup.log

          COMMON_FLAGS=(
            -fPIC -shared -nostdlib
            -fno-exceptions -fno-rtti -fno-threadsafe-statics -fno-use-cxa-atexit
            -Wl,--hash-style=gnu -Wl,--build-id=none -Wl,-soname,v1251_app_clock.so
          )
          "$CXX" --target=aarch64-linux-android24 "${COMMON_FLAGS[@]}" \
            -o "$MODDIR/zygisk/arm64-v8a.so" "$MODDIR/src/module.cpp"
          "$CXX" --target=armv7a-linux-androideabi24 "${COMMON_FLAGS[@]}" \
            -o "$MODDIR/zygisk/armeabi-v7a.so" "$MODDIR/src/module.cpp"
          chmod 0755 "$MODDIR/zygisk/arm64-v8a.so" "$MODDIR/zygisk/armeabi-v7a.so"

          for so in "$MODDIR/zygisk/arm64-v8a.so" "$MODDIR/zygisk/armeabi-v7a.so"; do
            file "$so" | tee -a setup.log
            readelf -Ws "$so" | grep -q 'zygisk_module_entry'
            readelf -Ws "$so" | grep -q 'zygisk_companion_entry'
            UND="$(readelf -Ws "$so" | awk '$7=="UND" && $8!="" {print $8}' | sort -u | tr '\n' ' ')"
            echo "V125.1 $(basename "$so") undefined: $UND" | tee -a setup.log
            BAD="$(readelf -Ws "$so" | awk '$7=="UND" && $8!="" {print $8}' | sort -u | grep -Ev '^(clock_gettime|close|fchmod|open|openat|poll|read|write)$' || true)"
            if [ -n "$BAD" ]; then
              echo "ERROR: unexpected V125.1 Zygisk undefined symbols: $BAD" | tee -a setup.log
              exit 1
            fi
          done

          # V125.1: V125 failed here after the kernel had already compiled.
          # The stable v1.0.0 GitHub release publishes the generic stable asset
          # ReZygisk-v1.0.0-release.zip; its embedded module version pins
          # 515-333d423-release. The commit-specific filename belongs to the
          # nightly artifact stream and is not a valid asset path under tag v1.0.0.
          REZ_LOCAL_NAME="ReZygisk-v1.0.0-515-333d423-release.zip"
          REZ_UPSTREAM_NAME="ReZygisk-v1.0.0-release.zip"
          REZ_URL_OFFICIAL="https://github.com/PerformanC/ReZygisk/releases/download/v1.0.0/${REZ_UPSTREAM_NAME}"
          REZ_URL_MIRROR="https://apt.izzysoft.de/magisk/modules/rezygisk/v1.0.0_515-333d423-release.zip"
          REZ_DEP="$MODDIR/deps/$REZ_LOCAL_NAME"
          REZ_LICENSE="$MODDIR/deps/ReZygisk-LICENSE.txt"
          REZ_SOURCE="$MODDIR/deps/ReZygisk-SOURCE.txt"
          REZ_STATUS="$MODDIR/deps/ReZygisk-BUNDLE-STATUS.txt"
          REZ_BUNDLED=0
          REZ_FETCH_SOURCE=none

          echo "===== V125.1 PINNED REZYGISK DEPENDENCY =====" | tee -a setup.log
          REZ_TAG_SHA="$(git ls-remote https://github.com/PerformanC/ReZygisk.git 'refs/tags/v1.0.0^{}' | awk 'NR==1{print $1}')"
          if [ -z "$REZ_TAG_SHA" ]; then
            REZ_TAG_SHA="$(git ls-remote https://github.com/PerformanC/ReZygisk.git refs/tags/v1.0.0 | awk 'NR==1{print $1}')"
          fi
          case "$REZ_TAG_SHA" in
            333d423*) ;;
            *)
              echo "ERROR: ReZygisk v1.0.0 tag did not resolve to expected release commit prefix 333d423: ${REZ_TAG_SHA:-missing}" | tee -a setup.log
              exit 1
              ;;
          esac
          echo "ReZygisk v1.0.0 tag commit=$REZ_TAG_SHA" | tee -a setup.log

          fetch_rezygisk()
          {
            rm -f "$REZ_DEP.tmp"
            echo "Trying official stable asset: $REZ_URL_OFFICIAL" | tee -a setup.log
            if curl -fL --retry 8 --retry-delay 3 --retry-all-errors \
                --connect-timeout 20 --max-time 300 \
                -o "$REZ_DEP.tmp" "$REZ_URL_OFFICIAL"; then
              REZ_FETCH_SOURCE=github-stable-release
              return 0
            fi

            rm -f "$REZ_DEP.tmp"
            echo "WARN: official ReZygisk stable asset fetch failed; trying IzzySoft mirror." | tee -a setup.log
            if curl -fL --retry 6 --retry-delay 3 --retry-all-errors \
                --connect-timeout 20 --max-time 300 \
                -o "$REZ_DEP.tmp" "$REZ_URL_MIRROR"; then
              REZ_FETCH_SOURCE=izzysoft-mirror
              return 0
            fi

            rm -f "$REZ_DEP.tmp"
            return 1
          }

          validate_rezygisk()
          {
            candidate="$1"
            unzip -t "$candidate" >/dev/null 2>&1 || return 1
            unzip -p "$candidate" module.prop 2>/dev/null | grep -qx 'id=rezygisk' || return 1
            unzip -p "$candidate" module.prop 2>/dev/null | grep -Eq '^version=v?1\.0\.0 \(515-333d423-release\)$' || return 1
            unzip -p "$candidate" module.prop 2>/dev/null | grep -qx 'versionCode=515' || return 1
            size="$(wc -c <"$candidate" 2>/dev/null | tr -cd '0-9')"
            case "$size" in ''|*[!0-9]*) return 1 ;; esac
            [ "$size" -ge 350000 ] && [ "$size" -le 900000 ] || return 1
            return 0
          }

          if fetch_rezygisk; then
            if validate_rezygisk "$REZ_DEP.tmp"; then
              mv "$REZ_DEP.tmp" "$REZ_DEP"
              REZ_BUNDLED=1
              echo "ReZygisk dependency validated from $REZ_FETCH_SOURCE" | tee -a setup.log
            else
              echo "WARN: downloaded ReZygisk candidate failed pinned module.prop/ZIP/size validation; dependency will not be bundled." | tee -a setup.log
              rm -f "$REZ_DEP.tmp"
            fi
          else
            echo "WARN: both ReZygisk dependency sources were unavailable. V125.1 will still produce the kernel/AnyKernel artifact; Java app-clock canary remains fail-open until a compatible loader is installed manually." | tee -a setup.log
          fi

          cat >"$REZ_SOURCE" <<EOF_V1251_REZ_SOURCE
          Project: PerformanC/ReZygisk
          Upstream license: AGPL-3.0
          Pinned tag: v1.0.0
          Pinned release commit: $REZ_TAG_SHA
          Expected embedded module version: v1.0.0 (515-333d423-release)
          Expected embedded versionCode: 515
          Official stable release asset: $REZ_UPSTREAM_NAME
          Official stable release URL: $REZ_URL_OFFICIAL
          Trusted fallback mirror: $REZ_URL_MIRROR
          Fetch result: $REZ_FETCH_SOURCE
          Source: https://github.com/PerformanC/ReZygisk/tree/v1.0.0
          EOF_V1251_REZ_SOURCE

          if [ "$REZ_BUNDLED" -eq 1 ]; then
            # Include the upstream license when redistribution is actually bundled.
            if curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
                --connect-timeout 20 --max-time 120 \
                -o "$REZ_LICENSE.tmp" \
                "https://raw.githubusercontent.com/PerformanC/ReZygisk/v1.0.0/LICENSE" \
                && grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' "$REZ_LICENSE.tmp"; then
              mv "$REZ_LICENSE.tmp" "$REZ_LICENSE"
            else
              echo "WARN: could not fetch/validate upstream AGPL license; omitting bundled ReZygisk dependency so the build can remain compliant and deterministic." | tee -a setup.log
              rm -f "$REZ_DEP" "$REZ_LICENSE.tmp"
              REZ_BUNDLED=0
              REZ_FETCH_SOURCE=license-fetch-failed
            fi
          fi

          {
            echo "bundled=$REZ_BUNDLED"
            echo "fetch_source=$REZ_FETCH_SOURCE"
            echo "tag_commit=$REZ_TAG_SHA"
            echo "expected_version=v1.0.0 (515-333d423-release)"
            echo "expected_versionCode=515"
          } >"$REZ_STATUS"

          chmod 0644 "$REZ_SOURCE" "$REZ_STATUS"
          if [ "$REZ_BUNDLED" -eq 1 ]; then
            chmod 0644 "$REZ_DEP" "$REZ_LICENSE"
            sha256sum "$REZ_DEP" "$REZ_LICENSE" | tee -a setup.log
          else
            echo "V125.1 ReZygisk bundle status: dependency not embedded; build continues fail-open." | tee -a setup.log
          fi

          rm -f "$MODZIP"
          (cd "$MODDIR" && zip -qr "../$MODZIP" .)
          unzip -t "$MODZIP" >/dev/null
          unzip -p "$MODZIP" module.prop | grep -qx 'id=v1251_ghost_guard'
          unzip -p "$MODZIP" target_package | grep -qx 'bin.mt.plus'
          unzip -p "$MODZIP" src/module.cpp | grep -q 'preAppSpecialize'
          unzip -l "$MODZIP" | grep -q 'deps/ReZygisk-BUNDLE-STATUS.txt'
          unzip -l "$MODZIP" | grep -q 'deps/ReZygisk-SOURCE.txt'
          unzip -p "$MODZIP" boot-completed.sh | grep -Fq '"$KSUD" module install'
          if [ "$REZ_BUNDLED" -eq 1 ]; then
            unzip -l "$MODZIP" | grep -q 'deps/ReZygisk-v1.0.0-515-333d423-release.zip'
            unzip -l "$MODZIP" | grep -q 'deps/ReZygisk-LICENSE.txt'
          fi
          for abi in arm64-v8a armeabi-v7a; do
            unzip -p "$MODZIP" "zygisk/$abi.so" >"$RUNNER_TEMP/v1251-$abi.so"
            readelf -Ws "$RUNNER_TEMP/v1251-$abi.so" | grep -q 'zygisk_module_entry'
          done
          sha256sum "$MODZIP" | tee -a setup.log

      - name: Collect outputs
