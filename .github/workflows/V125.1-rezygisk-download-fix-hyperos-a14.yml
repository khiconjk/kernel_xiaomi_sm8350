          struct ServerSpecializeArgs {
              jint &uid;
              jint &gid;
              jintArray &gids;
              jint &runtime_flags;
              jlong &permitted_capabilities;
              jlong &effective_capabilities;
              ServerSpecializeArgs() = delete;
          };
          
          enum Option : int {
              FORCE_DENYLIST_UNMOUNT = 0,
              DLCLOSE_MODULE_LIBRARY = 1,
          };
          
          enum StateFlag : unsigned int {
              PROCESS_GRANTED_ROOT = (1u << 0),
              PROCESS_ON_DENYLIST = (1u << 1),
          };
          
          namespace internal {
          struct api_table;
          struct module_abi {
              long api_version;
              ModuleBase *impl;
              void (*preAppSpecialize)(ModuleBase *, AppSpecializeArgs *);
              void (*postAppSpecialize)(ModuleBase *, const AppSpecializeArgs *);
              void (*preServerSpecialize)(ModuleBase *, ServerSpecializeArgs *);
              void (*postServerSpecialize)(ModuleBase *, const ServerSpecializeArgs *);
          
              explicit module_abi(ModuleBase *m) : api_version(ZYGISK_API_VERSION), impl(m) {
                  preAppSpecialize = [](ModuleBase *x, AppSpecializeArgs *a) { x->preAppSpecialize(a); };
                  postAppSpecialize = [](ModuleBase *x, const AppSpecializeArgs *a) { x->postAppSpecialize(a); };
                  preServerSpecialize = [](ModuleBase *x, ServerSpecializeArgs *a) { x->preServerSpecialize(a); };
                  postServerSpecialize = [](ModuleBase *x, const ServerSpecializeArgs *a) { x->postServerSpecialize(a); };
              }
          };
          
          struct api_table {
              void *impl;
              bool (*registerModule)(api_table *, module_abi *);
              void (*hookJniNativeMethods)(JNIEnv *, const char *, JNINativeMethod *, int);
              void (*pltHookRegister)(dev_t, ino_t, const char *, void *, void **);
              bool (*exemptFd)(int);
              bool (*pltHookCommit)();
              int (*connectCompanion)(void *);
              void (*setOption)(void *, Option);
              int (*getModuleDir)(void *);
              unsigned int (*getFlags)(void *);
          };
          } // namespace internal
          
          struct Api {
              internal::api_table *tbl = nullptr;
              int getModuleDir() { return tbl && tbl->getModuleDir ? tbl->getModuleDir(tbl->impl) : -1; }
              int connectCompanion() { return tbl && tbl->connectCompanion ? tbl->connectCompanion(tbl->impl) : -1; }
              bool exemptFd(int fd) { return tbl && tbl->exemptFd && tbl->exemptFd(fd); }
              void hookJniNativeMethods(JNIEnv *env, const char *cls, JNINativeMethod *m, int n) {
