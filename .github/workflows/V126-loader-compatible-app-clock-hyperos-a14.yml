            current_c, official_c,
            'struct msm_dai_q6_mi2s_dai_data {',
            'struct msm_dai_q6_mi2s_dai_data {',
            'struct msm_dai_q6_meta_mi2s_dai_data {',
            'struct msm_dai_q6_meta_mi2s_dai_data {',
