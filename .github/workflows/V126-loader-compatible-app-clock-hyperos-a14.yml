        V126 tools

        V126 self-bootstrapping package-scoped Java clock canary:
        1. Flash the V126 AnyKernel3 ZIP. It stages /data/adb/modules/v126_ghost_guard when /data/adb is writable.
        2. Reboot once. V123 firstboot + recursion-proof logcat guards remain active without extra dependencies.
        3. V126 tries the official stable ReZygisk v1.0.0 asset first, then the IzzySoft mirror. The embedded module must report version v1.0.0 (515-333d423-release). If both external sources are unavailable, the kernel/AnyKernel build still completes and the Java canary remains fail-open until a compatible loader is installed manually.
        4. If the reboot-required marker exists after the first V126 boot, reboot once more so ReZygisk can load the V126 Zygisk SO. Existing enabled loaders are respected; V126 never installs a second loader.
        5. Default target is bin.mt.plus only. system_server and every other app UID remain untouched.
        6. Open/use bin.mt.plus after the loader-active boot, then run the root audit and inspect /data/local/tmp/V126-app-clock-hook.log.
        7. If /data/adb was unavailable while flashing, install ksu-modules/V126-ghost-app-clock-autoloader-KSU.zip manually in KernelSU Manager and reboot.

        Expected root evidence when the canary loads:
        - target_uid is resolved from /data/system/packages.list.
        - preAppSpecialize logs uptime_hook=1 and, when available, nano_hook=1.
        - a runtime uptimeMillis fake value is within about 120 seconds of the ghost uptime axis.
        - logcat -v monotonic remains within about 120 seconds of the ghost axis with watchdog_timeout=0.

        V126 does NOT modify kernel vDSO, ktime_get, scheduler, hrtimer, futex, alarm deadlines, or system_server clocks. If loader installation or a JNI lookup is unavailable, the Java canary fails open while the proven firstboot/logcat guards continue normally.

        Runtime audit:
        1. adb push V126-check-ghost-uptime-noroot.sh /data/local/tmp/
        2. adb shell chmod 755 /data/local/tmp/V126-check-ghost-uptime-noroot.sh
        3. adb shell su -c /data/local/tmp/V126-check-ghost-uptime-noroot.sh
        4. adb shell /data/local/tmp/V126-check-ghost-uptime-noroot.sh
        5. Pull the DONE paths printed by each run.

        Bootloop collector in TWRP/OrangeFox:
        1. Copy V126-collect-in-twrp.sh to /sdcard.
        2. Open Recovery > Advanced > Terminal.
        3. Run: sh /sdcard/V126-collect-in-twrp.sh
        4. Send the resulting V126-bootloop-logs-*.tar.gz file.

        Both audit/collector scripts are read-only. The TWRP script reads /dev/block/sda15 only when /proc/cmdline contains the exact block2mtd mapping observed in V103.
        EOF_V126_README
    - name: Build V126 loader-compatible KernelSU app-clock guard
      shell: bash
      run: |
        set -Eeuo pipefail
        MODDIR="V126-ghost-app-clock-guard-module"
        MODZIP="V126-ghost-app-clock-guard-KSU.zip"
        rm -rf "$MODDIR" "$MODZIP"
