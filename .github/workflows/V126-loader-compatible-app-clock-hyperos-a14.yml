        from pathlib import Path

        targets = [
            ('kernel/sched/clock.c', ['sched_clock', 'local_clock', 'cpu_clock']),
            ('include/linux/sched/clock.h', ['sched_clock', 'local_clock', 'cpu_clock']),
            ('kernel/printk/printk.c', ['sched_clock', 'local_clock', 'printk_time', 'print_time', 'msg_print_text']),
            ('kernel/trace/trace_clock.c', ['sched_clock', 'local_clock', 'trace_clock']),
            ('drivers/clocksource/arm_arch_timer.c', ['sched_clock', 'arch_timer', 'cntvct', 'sched_clock_register']),
        ]

        for rel, terms in targets:
            p = Path(rel)
            print(f'===== V95 SOURCE CONTEXT {rel} =====')
            if not p.exists():
                print('MISSING')
                continue
            s = p.read_text(errors='ignore')
            hits = [t for t in terms if t in s]
            print('hits=' + (','.join(hits) if hits else 'none'))
            shown = 0
            for t in hits:
                idx = s.find(t)
                if idx >= 0:
                    print(f'--- term={t} offset={idx} ---')
                    print(s[max(0, idx-800):idx+1600])
                    shown += 1
                if shown >= 5:
                    break

        print('===== V95 DECISION =====')
        print('No sched_clock/local_clock core patch is applied in V95.')
        print('Runtime V94 already showed dmesg timestamps follow fake uptime, so printk display patch is unnecessary and may double-shift.')
        print('If a future V96 is attempted, it should be a display-only printk formatter guard, not sched_clock core.')
        PY_V95_SCHED_CLOCK_GUARD

        echo "V95 sched_clock surface guard OK" | tee -a ../setup.log
    - name: V96 add sched clock readout probe only
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== V96 SCHED_CLOCK / LOCAL_CLOCK READOUT PROBE ONLY =====" | tee -a ../setup.log
        echo "V96 does not patch sched_clock(), local_clock(), ktime_get(), printk, timer core, scheduler core, or vDSO. It only adds a read-only /proc/ghost_sched_clock_probe entry so runtime can compare sched_clock/local_clock/ktime_get against fake /proc uptime." | tee -a ../setup.log

        echo "===== V96 REQUIRED BASE MARKER LOCK =====" | tee -a ../setup.log
        for spec in \
          "fs/proc/uptime.c:Vili CI V80" \
          "fs/proc/stat.c:Vili CI V82" \
          "fs/proc/softirqs.c:Vili CI V85" \
          "kernel/irq/proc.c:Vili CI V88"
        do
          file="${spec%%:*}"
          marker="${spec#*:}"
          echo "-- checking $file :: $marker" | tee -a ../setup.log
          if ! grep -q "$marker" "$file"; then
            echo "ERROR: required base marker missing: $file :: $marker" | tee -a ../setup.log
            exit 1
          fi
        done

        echo "===== V96 FORBID OLD RISKY PATCHES =====" | tee -a ../setup.log
        if grep -RqsE 'Vili CI V92|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|arch_sys_boot_offset for vDSO updater' kernel/time/vsyscall.c 2>/dev/null; then
          echo "ERROR: stale V92 vDSO basetime patch found" | tee -a ../setup.log
          exit 1
        fi

        cat > fs/proc/ghost_sched_clock_probe.c <<'EOF_V96_PROBE'
        // SPDX-License-Identifier: GPL-2.0
        /*
         * Vili CI V96: sched_clock/local_clock readout probe only.
         *
         * This file does not modify sched_clock(), local_clock(), ktime_get(),
         * printk, timer core, scheduler core, or vDSO. It only exposes a
         * temporary read-only proc entry for controlled runtime comparison.
         */
        #include <linux/init.h>
        #include <linux/kernel.h>
        #include <linux/ktime.h>
        #include <linux/proc_fs.h>
        #include <linux/sched/clock.h>
        #include <linux/seq_file.h>
        #include <linux/types.h>

        static int ghost_sched_clock_probe_show(struct seq_file *m, void *v)
        {
                u64 sched_ns = sched_clock();
                u64 local_ns = local_clock();
                u64 mono_ns = ktime_get_ns();
                u64 boot_ns = ktime_get_boottime_ns();
                u64 raw_ns = ktime_get_raw_ns();

                seq_puts(m, "Vili CI V96 sched_clock/local_clock readout probe only\n");
                seq_printf(m, "sched_clock_ns=%llu\n", sched_ns);
                seq_printf(m, "local_clock_ns=%llu\n", local_ns);
                seq_printf(m, "ktime_get_ns=%llu\n", mono_ns);
                seq_printf(m, "ktime_get_boottime_ns=%llu\n", boot_ns);
                seq_printf(m, "ktime_get_raw_ns=%llu\n", raw_ns);
                seq_printf(m, "sched_clock_sec=%llu.%09llu\n",
                           div_u64(sched_ns, NSEC_PER_SEC),
                           sched_ns % NSEC_PER_SEC);
                seq_printf(m, "local_clock_sec=%llu.%09llu\n",
                           div_u64(local_ns, NSEC_PER_SEC),
                           local_ns % NSEC_PER_SEC);
                seq_printf(m, "ktime_get_sec=%llu.%09llu\n",
                           div_u64(mono_ns, NSEC_PER_SEC),
                           mono_ns % NSEC_PER_SEC);
                seq_printf(m, "boottime_sec=%llu.%09llu\n",
                           div_u64(boot_ns, NSEC_PER_SEC),
                           boot_ns % NSEC_PER_SEC);
                seq_printf(m, "raw_sec=%llu.%09llu\n",
                           div_u64(raw_ns, NSEC_PER_SEC),
                           raw_ns % NSEC_PER_SEC);
                return 0;
        }

        static int __init ghost_sched_clock_probe_init(void)
        {
                proc_create_single("ghost_sched_clock_probe", 0444, NULL,
                                   ghost_sched_clock_probe_show);
                return 0;
        }
        late_initcall(ghost_sched_clock_probe_init);
        EOF_V96_PROBE

        if ! grep -q 'ghost_sched_clock_probe.o' fs/proc/Makefile; then
          printf '\n# Vili CI V96: sched_clock/local_clock readout probe only\nobj-y += ghost_sched_clock_probe.o\n' >> fs/proc/Makefile
        fi

        echo "===== V96 VERIFY SOURCE =====" | tee -a ../setup.log
        grep -RnsE 'Vili CI V96|ghost_sched_clock_probe|sched_clock\(|local_clock\(|ktime_get_ns|ktime_get_boottime_ns|ktime_get_raw_ns|proc_create_single' fs/proc/ghost_sched_clock_probe.c fs/proc/Makefile 2>/dev/null | head -220 | tee -a ../setup.log || true

        if ! grep -q 'proc_create_single("ghost_sched_clock_probe"' fs/proc/ghost_sched_clock_probe.c; then
          echo "ERROR: V96 proc entry creation missing" | tee -a ../setup.log
          exit 1
        fi
        if grep -Rqs 'Vili CI V96' kernel/sched kernel/time kernel/printk arch/arm64 drivers/clocksource 2>/dev/null; then
          echo "ERROR: V96 marker leaked into forbidden core files" | tee -a ../setup.log
          grep -Rns 'Vili CI V96' kernel/sched kernel/time kernel/printk arch/arm64 drivers/clocksource 2>/dev/null | tee -a ../setup.log || true
          exit 1
        fi

        echo "V96 sched_clock/local_clock readout probe patch OK" | tee -a ../setup.log
    - name: V119.1 remove V96 real-clock debug probe before production build
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== V119.1 REMOVE V96 REAL-CLOCK DEBUG PROBE =====" | tee -a ../setup.log
        echo "The V119 runtime report proved /proc/ghost_sched_clock_probe directly exposed ~450s MONOTONIC/RAW while BOOTTIME was ~25 days. Keep the evidence in old logs, but do not ship this debug endpoint in production." | tee -a ../setup.log

        python3 - <<'PY_V119_REMOVE_V96_PROBE'
        from pathlib import Path

        makefile = Path('fs/proc/Makefile')
        source = Path('fs/proc/ghost_sched_clock_probe.c')

        if makefile.exists():
            text = makefile.read_text(errors='ignore')
            lines = text.splitlines()
            out = []
            for line in lines:
                if 'Vili CI V96: sched_clock/local_clock readout probe only' in line:
                    continue
                if 'ghost_sched_clock_probe.o' in line:
                    continue
                out.append(line)
            makefile.write_text('\n'.join(out).rstrip() + '\n')

        if source.exists():
            source.unlink()

        final_make = makefile.read_text(errors='ignore') if makefile.exists() else ''
        if 'ghost_sched_clock_probe.o' in final_make or 'Vili CI V96: sched_clock/local_clock readout probe only' in final_make:
            raise SystemExit('ERROR: V96 probe Makefile registration still present')
        if source.exists():
            raise SystemExit('ERROR: V96 probe source still present')

        print('V119.1 production cleanup removed fs/proc/ghost_sched_clock_probe.c and its Makefile registration.')
        PY_V119_REMOVE_V96_PROBE

        git diff --check -- fs/proc/Makefile
        if grep -RqsE 'ghost_sched_clock_probe|Vili CI V96: sched_clock/local_clock readout probe only' fs/proc 2>/dev/null; then
          echo "ERROR: V96 direct real-clock probe still exists in production fs/proc sources" | tee -a ../setup.log
          grep -RnsE 'ghost_sched_clock_probe|Vili CI V96: sched_clock/local_clock readout probe only' fs/proc 2>/dev/null | tee -a ../setup.log || true
          exit 1
        fi
        echo "V119.1 V96 probe removal verified." | tee -a ../setup.log
    - name: Mark V75 process age audit baseline
