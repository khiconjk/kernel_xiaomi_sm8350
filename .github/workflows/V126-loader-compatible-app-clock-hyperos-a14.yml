    - name: Patch V80 proc uptime idle field sync
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== PATCH V80 /PROC/UPTIME IDLE FIELD SYNC =====" | tee -a ../setup.log
        echo "V77 fixed process-age, but /proc/uptime field2 still exposed real idle seconds. V80 shifts field2 idle display by ghost offset * possible CPUs. Display-only; no MONOTONIC/RAW/timekeeping/scheduler core changes." | tee -a ../setup.log

        python3 - <<'PY_V80_PROC_UPTIME_IDLE' 2>&1 | tee -a ../setup.log
        from pathlib import Path
        import re

        p = Path('fs/proc/uptime.c')
        if not p.exists():
            raise SystemExit('ERROR: fs/proc/uptime.c not found')

        s = p.read_text(errors='ignore')

        if '<linux/ghost_uptime.h>' not in s:
            includes = list(re.finditer(r'^#include\s+<[^>]+>\s*$', s, flags=re.M))
            if includes:
                pos = includes[-1].end()
                s = s[:pos] + '\n#include <linux/ghost_uptime.h>' + s[pos:]
            else:
                s = '#include <linux/ghost_uptime.h>\n' + s

        marker = 'Vili CI V80: sync /proc/uptime idle field'
        if marker not in s:
            block_lines = [
                '        /* Vili CI V80: sync /proc/uptime idle field to fake uptime scale. */',
                '        if (ghost_uptime_offset_sec())',
                '                idle.tv_sec += ghost_uptime_offset_sec() * num_possible_cpus();',
            ]
            block = '\n'.join(block_lines)

            patterns = [
                r'(idle\.tv_sec\s*=\s*div_u64_rem\([^;]+;\s*\n\s*idle\.tv_nsec\s*=\s*[^;]+;)',
                r'(idle\.tv_sec\s*=\s*[^;]+;\s*\n\s*idle\.tv_nsec\s*=\s*[^;]+;)',
            ]

            inserted = False
            for pat in patterns:
                m = re.search(pat, s, flags=re.S)
                if m:
                    s = s[:m.end()] + '\n' + block + s[m.end():]
                    inserted = True
                    break

            if not inserted:
                m = re.search(r'(seq_printf\s*\(\s*m\s*,)', s)
                if not m:
                    raise SystemExit('ERROR: cannot find idle field assignment or seq_printf in fs/proc/uptime.c')
                s = s[:m.start()] + block + '\n' + s[m.start():]

        if 'num_possible_cpus()' not in s:
            raise SystemExit('ERROR: V80 idle field patch missing num_possible_cpus()')
        if 'ghost_uptime_offset_sec()' not in s:
            raise SystemExit('ERROR: V80 idle field patch missing ghost_uptime_offset_sec()')
        if marker not in s:
            raise SystemExit('ERROR: V80 marker missing')

        p.write_text(s)
        print('Patched fs/proc/uptime.c: V80 /proc/uptime idle field sync')
        PY_V80_PROC_UPTIME_IDLE

        echo "===== V80 /PROC/UPTIME IDLE FIELD VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'Vili CI V80|ghost_uptime_offset_sec\(\)|num_possible_cpus\(\)|seq_printf' fs/proc/uptime.c 2>/dev/null | head -160 | tee -a ../setup.log || true
        if ! grep -q 'Vili CI V80: sync /proc/uptime idle field' fs/proc/uptime.c; then
          echo "ERROR: V80 marker missing in fs/proc/uptime.c" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'idle.tv_sec += ghost_uptime_offset_sec() \* num_possible_cpus();' fs/proc/uptime.c; then
          echo "ERROR: V80 idle boost assignment missing" | tee -a ../setup.log
          exit 1
        fi
        echo "V80 /proc/uptime idle field sync patch OK" | tee -a ../setup.log
    - name: Patch V82 proc stat output idle jiffies sync
