        install -m 0644 "$AUDIO_TMP/msm-dai-q6-v2-hybrid.h" "$AUDIO_H"
        install -m 0644 "$AUDIO_TMP/msm_dailink-hybrid.h" "$AUDIO_DAILINK"

        printf '%s  %s\n' "$AUDIO_COMPAT_C_SHA256" "$AUDIO_C" | sha256sum -c - | tee -a ../setup.log
        printf '%s  %s\n' "$AUDIO_COMPAT_H_SHA256" "$AUDIO_H" | sha256sum -c - | tee -a ../setup.log
        printf '%s  %s\n' "$AUDIO_COMPAT_DAILINK_SHA256" "$AUDIO_DAILINK" | sha256sum -c - | tee -a ../setup.log

        grep -q '^#define MSM_PRIM_MI2S 0$' "$AUDIO_H"
        grep -q 'u16 rx_sd_lines;' "$AUDIO_H"
        grep -q 'u16 tx_sd_lines;' "$AUDIO_H"
        grep -q 'qcom,msm-mi2s-rx-lines' "$AUDIO_C"
        grep -q 'qcom,msm-mi2s-tx-lines' "$AUDIO_C"
        grep -q 'COMP_CPU("msm-dai-q6-mi2s.5")' "$AUDIO_DAILINK"
        if grep -qE '^#define MSM_(PRIM|SEC|TERT|QUAT|QUIN|SENARY|INT[0-6])_MI2S_(RX|TX)' "$AUDIO_H"; then
          echo "ERROR: split RX/TX MI2S ID ABI remains in the driver header" | tee -a ../setup.log
          exit 1
        fi
        if grep -qE 'COMP_CPU\("msm-dai-q6-mi2s\.([6-9]|1[01])"\)' "$AUDIO_DAILINK"; then
          echo "ERROR: split MI2S machine-link CPU IDs 6-11 remain after FIX2" | tee -a ../setup.log
          exit 1
        fi

        echo "===== AUDIO FIX2 DIFFSTAT =====" | tee -a ../setup.log
        git diff --stat -- "$AUDIO_C" "$AUDIO_H" "$AUDIO_DAILINK" | tee -a ../setup.log
        echo "Complete official vili combined-node MI2S ABI applied successfully" | tee -a ../setup.log
    - name: Retain V105 POSIX times uptime readout layer
