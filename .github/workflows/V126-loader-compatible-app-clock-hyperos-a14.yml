            '#define MSM_PRIM_MI2S_RX 0',
            '#define MSM_PRIM_MI2S 0',
            '#define MSM_DISPLAY_PORT\t0',
            '#define MSM_DISPLAY_PORT\t0',
            'MI2S interface IDs')
