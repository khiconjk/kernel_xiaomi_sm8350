          SUBARCH=arm64
          LLVM=1
          LLVM_IAS=1
          CC="ccache clang"
          HOSTCC="ccache clang"
          HOSTCXX="ccache clang++"
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          AR=llvm-ar
          NM=llvm-nm
          LD=ld.lld
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          STRIP=llvm-strip
        )

        JOBS="$(nproc --all)"
        echo "===== BUILD KERNEL IMAGE =====" | tee -a ../build.log
        echo "Jobs: $JOBS" | tee -a ../build.log
        echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" | tee -a ../build.log
        echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" | tee -a ../build.log
        make "${MAKE_ARGS[@]}" -j"$JOBS" Image.gz 2>&1 | tee -a ../build.log

        echo "" | tee -a ../build.log
        echo "===== BUILD MODULES OPTIONAL =====" | tee -a ../build.log
        if grep -q '^CONFIG_MODULES=y' "$OUT_DIR/.config"; then
          make "${MAKE_ARGS[@]}" -j"$JOBS" modules 2>&1 | tee -a ../build.log
        else
          echo "CONFIG_MODULES is not enabled in final .config; skipping make modules." | tee -a ../build.log
        fi

        echo "" | tee -a ../build.log
        echo "===== BUILD DTBS OPTIONAL =====" | tee -a ../build.log
        make "${MAKE_ARGS[@]}" -j"$JOBS" dtbs 2>&1 | tee -a ../build.log || true

        echo "" | tee -a ../build.log
        echo "===== BUILD DTBO.IMG OPTIONAL =====" | tee -a ../build.log
        echo "Skipping make dtbo.img on GitHub Actions because this kernel tree calls python2 for mkdtimg." | tee -a ../build.log
        echo "DTB/DTBO inspection files are still collected from out/arch/arm64/boot/dts." | tee -a ../build.log

        echo "" | tee -a ../build.log
        echo "===== BUILD OUTPUT QUICK LIST =====" | tee -a ../build.log
        find "$OUT_DIR/arch/arm64/boot" -maxdepth 4 -type f \
          \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \) \
          -printf '%p  %s bytes\n' | sort | tee -a ../build.log || true

        echo "" | tee -a ../build.log
        echo "===== CCACHE STATS =====" | tee -a ../build.log
        ccache -s | tee -a ../build.log || true
    - name: Prepare V126 diagnostics and runtime tools
      shell: bash
      run: |
        set -Eeuo pipefail
        DIAG=V126-diagnostics
        TOOLS=V126-tools
        rm -rf "$DIAG" "$TOOLS"
        mkdir -p "$DIAG/patched-source" "$TOOLS"

        echo "===== V126 BUILD DIAGNOSTICS =====" | tee -a setup.log
        {
          echo "workflow_marker=V126_HYPEROS_A14_AUTO_FIRSTBOOT_GUARD"
          echo "kernel_source_commit=${KERNEL_SOURCE_COMMIT}"
          echo "kernelsu_commit=${KSU_COMMIT}"
          echo "susfs_commit=${SUSFS_COMMIT}"
          echo "audio_source_commit=${AUDIO_COMPAT_SOURCE_COMMIT}"
          echo "vdso_stage=${VDSO_STAGE}"
          echo "current_layer=V126_DYNAMIC_ZYGISK_APP_CLOCK_GUARD_RETAINING_V119_1_KERNEL"
          echo "processes_policy=readout_only_base_plus_one_per_ghost_offset_second_real_total_forks_unchanged"
          echo "workflow_fix=retained_bounded_Ubuntu_only_APT_with_primary_and_fallback_mirrors"
          echo "base_boot_result=V114_BUILD_BOOT_KSU_RUNTIME_PASS_AUDIO_CONFIRMATION_REQUIRED"
          echo "retained_layers=V114_PROC_STAT_INTR,V111_PROC_STAT_SOFTIRQ,V110_CPUFREQ_TIME_IN_STATE,V109_SYSINFO_SINGLE_OFFSET,V108_CPUIDLE_SYSFS_TIME_READOUT"
          echo "runtime_result=V1251_ROOT_23_PASS_LOGCAT_FIRSTBOOT_PASS_APP_ZYGISK_TELEMETRY_MISSING"
          echo "rom=${ROM_TARGET}"
        } >"$DIAG/source-pins.txt"

        cat >"$DIAG/V126-runtime-analysis.txt" <<'EOF_V126_RUNTIME_ANALYSIS'
        Inputs:
        - V114 setup.log and build.log
        - V114 artifact logs.zip and patched-source snapshot
        - V113-labelled runtime reports 20250829-155423 and 20250829-155434,
          generated by the mislabelled audit tool packaged in V114

        Confirmed observations:
        - V114 bounded APT completed, Image.gz compiled, and the AnyKernel3 ZIP passed
          preflight with SHA-256 e4927368b065041791709e2915c47447cf0fab0ccf216d6f2c697fde10b9bcf3.
        - V114 booted on vili with sys.boot_completed=1 and KernelSU context u:r:ksu:s0.
        - Ghost uptime was 2,160,573 seconds while the session was about 573 seconds,
          confirming a 25-day offset. Retained sysinfo, cpuidle, cpufreq and softirq checks passed.
        - The V114 audit was incorrectly labelled V113. Its IRQ parser summed every
          numeric token after an IRQ label, including hardware IRQ IDs/numeric action
          names, while excluding IPI/arch rows with nonnumeric labels. Therefore its
          93.47 percent IRQ warning is a tool defect, not evidence of a kernel mismatch.
        - The V114 source formula adds exactly the established V88 display additions:
          40/s arch_timer plus 4/s arch_mem_timer for every possible CPU, with the same
          131*cpu bias. V119 corrects the audit parser to sum only CPU columns and include
          all colon-labelled IRQ/IPI/arch rows.
        - The V115 root report exposed ctxt=4,872,817,799 over 1,386,635 displayed
          seconds, or 3514.13/s, and passed every targeted /proc/stat comparison.
        - Android framework services still reported about 1h10m while the exposed
          BOOTTIME axis reported about 16d1h10m.
        - The same V115 report recorded alarmtimer.0.auto suspend failure -16.

        V126 scope:
        - Retain the V119.1 kernel behavior without adding another kernel clock concealment layer.
        - Harden /proc/stat processes at readout only by adding one synthetic historical
          event per ghost-offset second. Real total_forks accounting remains unchanged.
        - Keep nr_context_switches accounting, total_forks/process accounting, IRQ accounting,
          scheduler, hrtimer, vDSO, local_clock, sched_clock, ktime_get and core timekeeping unchanged.
        - Remove the V96 /proc/ghost_sched_clock_probe from the production image after it
          proved the real MONOTONIC/RAW leak; retain that evidence in the supplied V119 logs.
        - Add a KernelSU firstboot property guard and stronger framework clock evidence. Direct MONOTONIC remains evidence-only; no vDSO/core timekeeping patch is included.
        EOF_V126_RUNTIME_ANALYSIS

        git -C kernel status --short --untracked-files=no >"$DIAG/git-status-tracked.txt" || true
        git -C kernel diff --stat >"$DIAG/source-diff.stat.txt" || true
        git -C kernel diff --no-ext-diff >"$DIAG/source-diff.patch" || true
        sha256sum \
          kernel/lib/vdso/gettimeofday.c \
          kernel/kernel/time/vsyscall.c \
          kernel/kernel/sys.c \
          kernel/fs/proc/stat.c \
          kernel/fs/proc/softirqs.c \
          kernel/kernel/irq/proc.c \
          kernel/drivers/cpuidle/sysfs.c \
          kernel/drivers/cpufreq/cpufreq_stats.c \
          kernel/techpack/audio/asoc/msm-dai-q6-v2.c \
          kernel/techpack/audio/asoc/msm-dai-q6-v2.h \
          kernel/techpack/audio/asoc/msm_dailink.h \
          >"$DIAG/critical-source-sha256.txt"

        for file in \
          lib/vdso/gettimeofday.c \
          kernel/time/vsyscall.c \
          kernel/time/posix-timers.c \
          kernel/sys.c \
          drivers/cpuidle/sysfs.c \
          drivers/cpufreq/cpufreq_stats.c \
          include/linux/ghost_uptime.h \
          kernel/time/ghost_uptime.c \
          fs/proc/uptime.c \
          fs/proc/stat.c \
          fs/proc/softirqs.c \
          kernel/irq/proc.c \
          techpack/audio/asoc/msm-dai-q6-v2.c \
          techpack/audio/asoc/msm-dai-q6-v2.h \
          techpack/audio/asoc/msm_dailink.h
        do
          if [ -f "kernel/$file" ]; then
            mkdir -p "$DIAG/patched-source/$(dirname "$file")"
            cp -a "kernel/$file" "$DIAG/patched-source/$file"
          fi
        done

        {
          echo "V126 auto firstboot guard + MONOTONIC leak audit with retained pristine-vDSO V119.1 baseline"
          echo "base=V114 build/boot/KSU/runtime PASS; physical audio confirmation remains user-supplied"
          echo "runtime_finding=V115 root audit passed 15 checks with 0 warnings; framework remained near 1h10m while BOOTTIME exposed about 16d1h10m; alarmtimer suspend returned -16"
          echo "changed_surface=userspace property guard artifact only; retained V119.1 kernel readout hardening and V96 probe removal"
          echo "processes_policy=display-only ghost history; real total_forks accounting retained"
          echo "retained=V119.1 processes, V115 ctxt, V114 intr, V111 softirq, V110 cpufreq, V109 sysinfo, V108 cpuidle, V105 POSIX times and audio-compatible sources"
          echo "unchanged=nr_context_switches accounting, real total_forks/process accounting, real IRQ accounting, cpufreq/cpuidle accounting, pristine vDSO, scheduler, hrtimer, sched_clock, local_clock, ktime_get and core timekeeping"
          echo
          echo "===== V105/V109 MARKERS IN kernel/sys.c ====="
          grep -nE 'Vili CI V10(5|9)|vili_ghost_(times|sysinfo)|SYSCALL_DEFINE1\((times|sysinfo)' kernel/kernel/sys.c
          echo
          echo "===== RETAINED V108 MARKERS IN drivers/cpuidle/sysfs.c ====="
          grep -nE 'Vili CI V108|vili_ghost_cpuidle_time_show|cattr == &attr_time' kernel/drivers/cpuidle/sysfs.c
          echo
          echo "===== RETAINED V110 MARKERS IN drivers/cpufreq/cpufreq_stats.c ====="
          grep -nE 'Vili CI V110|vili_ghost_cpufreq_time_in_state|show_time_in_state|cpufreq_stats_update' kernel/drivers/cpufreq/cpufreq_stats.c
          echo
          echo "===== V111/V114/V115/V119.1 MARKERS IN fs/proc/stat.c ====="
          grep -nE 'Vili CI V(61|82|111|114|115|119.1)|vili_ghost_proc_stat_(softirq|intr|ctxt|processes)|intr |ctxt |processes |softirq ' kernel/fs/proc/stat.c
          echo
          echo "===== RETAINED V85 MARKERS IN fs/proc/softirqs.c ====="
          grep -nE 'Vili CI V85|ghost_uptime_proc_softirq_count|TIMER_SOFTIRQ|SCHED_SOFTIRQ|RCU_SOFTIRQ' kernel/fs/proc/softirqs.c
          echo
          echo "===== RETAINED V88 MARKERS IN kernel/irq/proc.c ====="
          grep -nE 'Vili CI V88|ghost_uptime_proc_interrupt_desc_count|arch_timer|arch_mem_timer|40ULL|4ULL|131ULL' kernel/kernel/irq/proc.c
          echo
          echo "===== RETAINED V61 MARKERS IN kernel/time/timer_list.c ====="
          grep -nE 'Vili CI V61|ghost_uptime_offset_ns|now at' kernel/kernel/time/timer_list.c
          echo
          echo "===== PRISTINE VDSO HASHES ====="
          sha256sum kernel/lib/vdso/gettimeofday.c kernel/kernel/time/vsyscall.c
          echo
          echo "===== AUDIO PASS HASHES ====="
          sha256sum \
            kernel/techpack/audio/asoc/msm-dai-q6-v2.c \
            kernel/techpack/audio/asoc/msm-dai-q6-v2.h \
            kernel/techpack/audio/asoc/msm_dailink.h
        } >"$DIAG/V126-layer-audit.txt"

        cat >"$TOOLS/V126-collect-in-twrp.sh" <<'EOF_V126_TWRP'
        #!/sbin/sh
        # V126 read-only bootloop collector for Xiaomi 11T Pro (vili).
        # Run in TWRP/OrangeFox terminal: sh /sdcard/V126-collect-in-twrp.sh

        set -u

        if [ -d /sdcard ] && [ -w /sdcard ]; then
          BASE=/sdcard
        else
          BASE=/tmp
        fi

        STAMP="$(date +%Y%m%d-%H%M%S 2>/dev/null || echo unknown)"
        NAME="V126-bootloop-logs-${STAMP}"
        OUT="${BASE}/${NAME}"
        ARCHIVE="${BASE}/${NAME}.tar.gz"
        TAR_ERROR="${BASE}/${NAME}-tar-error.txt"
        mkdir -p "$OUT"

        run_to() {
          target="$1"
          shift
          {
            echo "COMMAND: $*"
            "$@"
          } >"$OUT/$target" 2>&1 || true
        }

        {
          echo "collector=V126"
          echo "started_utc=$(date -u 2>/dev/null || true)"
          echo "output=$OUT"
          echo "This collector never writes to a block device."
        } >"$OUT/00-summary.txt"

        run_to 01-uname.txt uname -a
        run_to 02-props.txt getprop
        run_to 03-cmdline.txt cat /proc/cmdline
        run_to 04-mounts.txt cat /proc/mounts
        run_to 05-proc-mtd.txt cat /proc/mtd
        run_to 06-partitions.txt cat /proc/partitions
        run_to 07-block-links.txt ls -la /dev/block /dev/block/by-name /dev/block/bootdevice/by-name
        run_to 08-block-sysfs.txt sh -c 'for f in /sys/class/block/sda15/size /sys/class/block/sda15/start /sys/class/block/sda15/dev; do echo "===== $f ====="; cat "$f" 2>&1; done'
        run_to 09-device-tree-model.txt sh -c 'for f in /proc/device-tree/model /proc/device-tree/compatible; do echo "===== $f ====="; tr "\000" "\n" < "$f" 2>/dev/null; done'
        run_to 20-recovery-dmesg.txt dmesg
        run_to 21-kernel-state.txt sh -c 'cat /proc/uptime; echo; head -20 /proc/stat; echo; cat /proc/interrupts; echo; cat /proc/timer_list 2>/dev/null; echo; cat /proc/softirqs'
        run_to 24-suspend-stats.txt sh -c '
        for root in /sys/power/suspend_stats /sys/kernel/debug/suspend_stats; do
          echo "===== $root ====="
          if [ -d "$root" ]; then
            found=0
            for child in "$root"/*; do
              [ -f "$child" ] || continue
              found=1
              echo "--- ${child##*/} ---"
              cat "$child" 2>&1 || true
            done
            [ "$found" -eq 1 ] || echo "directory has no readable regular child files"
          elif [ -r "$root" ]; then
            cat "$root" 2>&1 || true
          else
            echo "unavailable"
          fi
        done'
        run_to 22-recovery-log.txt sh -c 'cat /tmp/recovery.log 2>/dev/null; cat /cache/recovery/last_log 2>/dev/null'
        run_to 23-logcat.txt sh -c 'logcat -b all -d -v threadtime 2>/dev/null'

        mkdir -p /sys/fs/pstore 2>/dev/null || true
        if ! grep -q ' /sys/fs/pstore ' /proc/mounts 2>/dev/null; then
          mount -t pstore pstore /sys/fs/pstore 2>"$OUT/10-pstore-mount-error.txt" || true
        fi
        run_to 11-pstore-status.txt sh -c 'grep pstore /proc/mounts; ls -la /sys/fs/pstore'
        mkdir -p "$OUT/pstore"
        cp -a /sys/fs/pstore/. "$OUT/pstore/" 2>"$OUT/12-pstore-copy-error.txt" || true
        run_to 13-last-kmsg.txt sh -c 'cat /proc/last_kmsg 2>/dev/null'
        run_to 14-pstore-registration.txt sh -c 'dmesg | grep -iE "pstore|ramoops|mtdoops|block2mtd|panic|oops"'
        run_to 15-sysinfo-userspace.txt sh -c 'echo "===== /proc/uptime ====="; cat /proc/uptime 2>/dev/null; echo; echo "===== uptime commands ====="; command -v uptime 2>/dev/null; uptime 2>/dev/null; command -v toybox 2>/dev/null && toybox uptime 2>/dev/null; command -v busybox 2>/dev/null && busybox uptime 2>/dev/null'

        # V103 showed this exact mapping. Read it only when the active cmdline confirms it.
        BLOCK=/dev/block/sda15
        EXPECTED_MAP='block2mtd.block2mtd=/dev/block/sda15,2097152'
        if grep -q "$EXPECTED_MAP" /proc/cmdline 2>/dev/null && [ -b "$BLOCK" ]; then
          SECTORS="$(cat /sys/class/block/sda15/size 2>/dev/null || echo 0)"
          case "$SECTORS" in
            ''|*[!0-9]*) SECTORS=0 ;;
          esac
          BYTES=$((SECTORS * 512))
          {
            echo "mapping_confirmed=$EXPECTED_MAP"
            echo "block=$BLOCK"
            echo "sectors=$SECTORS"
            echo "bytes=$BYTES"
            echo "mode=read-only"
          } >"$OUT/30-mtdoops-read-info.txt"

          if [ "$BYTES" -gt 0 ] && [ "$BYTES" -le 67108864 ]; then
            dd if="$BLOCK" of="$OUT/31-mtdoops-sda15-full.bin" bs=1048576 \
              2>"$OUT/31-mtdoops-dd.txt" || true
            RAW="$OUT/31-mtdoops-sda15-full.bin"
          else
            dd if="$BLOCK" of="$OUT/31-mtdoops-sda15-first-4MiB.bin" bs=1048576 count=4 \
              2>"$OUT/31-mtdoops-first-dd.txt" || true
            RAW="$OUT/31-mtdoops-sda15-first-4MiB.bin"
            if [ "$SECTORS" -gt 8192 ]; then
              SKIP_MIB=$((SECTORS / 2048 - 4))
              dd if="$BLOCK" of="$OUT/32-mtdoops-sda15-last-4MiB.bin" bs=1048576 skip="$SKIP_MIB" count=4 \
                2>"$OUT/32-mtdoops-last-dd.txt" || true
            fi
          fi

          if command -v strings >/dev/null 2>&1; then
            strings -a -t d "$RAW" >"$OUT/33-mtdoops-strings.txt" 2>&1 || true
            [ ! -f "$OUT/32-mtdoops-sda15-last-4MiB.bin" ] || \
              strings -a -t d "$OUT/32-mtdoops-sda15-last-4MiB.bin" >>"$OUT/33-mtdoops-strings.txt" 2>&1 || true
          fi
          command -v gzip >/dev/null 2>&1 && gzip -9 "$OUT"/*.bin 2>/dev/null || true
        else
          {
            echo "SKIPPED: exact V103 block2mtd mapping was not present or $BLOCK was not a block device."
            echo "No raw partition was read."
          } >"$OUT/30-mtdoops-read-info.txt"
        fi

        cat >"$OUT/V126-UPLOAD-README.txt" <<'EOF'
        Send this complete archive together with the GitHub Actions V126 artifact.
        The pstore directory may be empty. The mtdoops files are read-only snapshots
        and can contain the previous panic when pstore/ramoops does not.
        EOF

        rm -f "$ARCHIVE" "$TAR_ERROR"
        if tar -czf "$ARCHIVE" -C "$BASE" "$NAME" 2>"$TAR_ERROR"; then
          rm -f "$TAR_ERROR"
          echo "DONE: $ARCHIVE"
        else
          cp -a "$TAR_ERROR" "$OUT/90-tar-error.txt" 2>/dev/null || true
          ARCHIVE="${BASE}/${NAME}.tar"
          tar -cf "$ARCHIVE" -C "$BASE" "$NAME"
          rm -f "$TAR_ERROR"
          echo "DONE: $ARCHIVE"
        fi
        echo "Folder kept at: $OUT"
        EOF_V126_TWRP
        chmod 0755 "$TOOLS/V126-collect-in-twrp.sh"
        sh -n "$TOOLS/V126-collect-in-twrp.sh" 2>&1 | tee -a setup.log
        sha256sum "$TOOLS/V126-collect-in-twrp.sh" | tee -a setup.log

        base64 -d >"$TOOLS/V126-check-ghost-uptime-noroot.sh" <<'EOF_V126_NOROOT_B64'
