                if idx >= 0:
                    print(s[max(0, idx-600):idx+900])
                raise SystemExit('ERROR: cannot find kstat_softirqs_cpu(i, j) output call')
            s = s.replace(target, repl, 1)

        if repl not in s:
            raise SystemExit('ERROR: V85 softirq output replacement missing')
        if 'nr == TIMER_SOFTIRQ' not in s or 'nr == SCHED_SOFTIRQ' not in s or 'nr == RCU_SOFTIRQ' not in s:
            raise SystemExit('ERROR: V85 helper missing softirq family checks')
        if 'UINT_MAX' not in s:
            raise SystemExit('ERROR: V85 saturation guard missing')

        p.write_text(s)
        print('Patched fs/proc/softirqs.c: V85 TIMER/SCHED/RCU display counter sync')
        PY_V85_PROC_SOFTIRQS

        echo "===== V85 /PROC/SOFTIRQS VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'Vili CI V85|ghost_uptime_proc_softirq_count|TIMER_SOFTIRQ|SCHED_SOFTIRQ|RCU_SOFTIRQ|kstat_softirqs_cpu' fs/proc/softirqs.c 2>/dev/null | head -220 | tee -a ../setup.log || true
