        printf '%s  %s\n' "$AUDIO_COMPAT_H_SHA256" "$AUDIO_TMP/msm-dai-q6-v2-hybrid.h" | sha256sum -c - | tee -a ../setup.log
        printf '%s  %s\n' "$AUDIO_COMPAT_DAILINK_SHA256" "$AUDIO_TMP/msm_dailink-hybrid.h" | sha256sum -c - | tee -a ../setup.log

