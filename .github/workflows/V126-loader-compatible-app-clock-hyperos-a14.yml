        \ uptime readout sync only.'\nhelper_anchor = '''/**\n * do_sysinfo - fill in sysinfo struct\n * @info: pointer to\
        \ buffer to fill\n */\nstatic int do_sysinfo(struct sysinfo *info)'''\nhelper = r'''\n/*\n * Vili CI V106: sysinfo(2)\
        \ uptime readout sync only.\n * Keep the kernel's real boot clock intact and shift only the public\n * struct sysinfo.uptime\
        \ field. All other sysinfo fields remain real.\n */\nstatic long vili_ghost_sysinfo_uptime(const struct timespec64\
        \ *tp)\n{\n\tu64 real_sec;\n\tu64 off_sec = ghost_uptime_offset_sec();\n\n\tif (tp->tv_sec < 0)\n\t\treturn 0;\n\t\
        real_sec = (u64)tp->tv_sec;\n\tif (tp->tv_nsec) {\n\t\tif (real_sec == (u64)LONG_MAX)\n\t\t\treturn LONG_MAX;\n\t\t\
        real_sec++;\n\t}\n\tif (off_sec > (u64)LONG_MAX - real_sec)\n\t\treturn LONG_MAX;\n\treturn (long)(real_sec + off_sec);\n\
        }\n\n'''\nif marker in text:\n    raise SystemExit('ERROR: V106 sysinfo layer was unexpectedly present before this\
        \ step')\nif text.count(helper_anchor) != 1:\n    raise SystemExit(\n        f'ERROR: V106 do_sysinfo helper anchor\
