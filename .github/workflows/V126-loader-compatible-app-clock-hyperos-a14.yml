        current_c = current_c_path.read_text()
        current_h = current_h_path.read_text()
        current_dailink = current_dailink_path.read_text()
        official_c = official_c_path.read_text()
        official_h = official_h_path.read_text()
        official_dailink = official_dailink_path.read_text()

        def transplant(dst, src, dst_start, src_start, dst_end, src_end, label):
            ds = dst.find(dst_start)
            de = dst.find(dst_end, ds + len(dst_start))
            ss = src.find(src_start)
            se = src.find(src_end, ss + len(src_start))
            if min(ds, de, ss, se) < 0:
                raise SystemExit(f'ERROR: missing audio transplant anchor for {label}')
            checks = (
                (dst, dst_start, 'destination start'),
                (dst, dst_end, 'destination end'),
                (src, src_start, 'official start'),
                (src, src_end, 'official end'),
            )
            for text, marker, side in checks:
                if text.count(marker) != 1:
                    raise SystemExit(f'ERROR: non-unique {side} anchor for {label}: {text.count(marker)}')
            return dst[:ds] + src[ss:se] + dst[de:]

