            pos = incs[-1].end() if incs else 0
            s = s[:pos] + '\n#include <linux/ghost_uptime.h>' + s[pos:]

        helper_marker = 'Vili CI V91A: POSIX syscall-only clock_gettime offset helper'
        if helper_marker not in s:
            insert_pos = s.find('/* Get clock_realtime */')
            if insert_pos < 0:
                insert_pos = s.find('static int posix_clock_realtime_get')
            if insert_pos < 0:
                raise SystemExit('ERROR: cannot find helper insertion point in posix-timers.c')
            helper_lines = [
                '/* Vili CI V91A: POSIX syscall-only clock_gettime offset helper.',
                ' * This deliberately affects only kernel syscall clock_gettime helpers.',
                ' * It does not change global ktime_get(), hrtimer, scheduler, or vDSO state.',
                ' */',
                'static inline void ghost_uptime_posix_clock_ts64(struct timespec64 *tp)',
                '{',
                '        u64 off = ghost_uptime_offset_sec();',
                '',
                '        if (!tp || !off)',
                '                return;',
                '',
                '        tp->tv_sec += (time64_t)off;',
                '}',
                '',
                '',
            ]
            s = s[:insert_pos] + '\n'.join(helper_lines) + s[insert_pos:]

        def patch_func(txt, func_name, marker):
            start = txt.find('static int ' + func_name)
            if start < 0:
                raise SystemExit('ERROR: cannot find ' + func_name)
            brace = txt.find('{', start)
            if brace < 0:
                raise SystemExit('ERROR: cannot find opening brace for ' + func_name)
            depth = 0
            end = -1
            for i in range(brace, len(txt)):
                if txt[i] == '{':
                    depth += 1
                elif txt[i] == '}':
                    depth -= 1
                    if depth == 0:
                        end = i + 1
                        break
            if end < 0:
                raise SystemExit('ERROR: cannot find closing brace for ' + func_name)
            body = txt[start:end]
            if marker in body:
                return txt
            m = re.search(r'(\bktime_get[^;]*\(tp\);\s*)', body)
            if not m:
                print(body)
                raise SystemExit('ERROR: cannot find ktime_get*(tp); call in ' + func_name)
