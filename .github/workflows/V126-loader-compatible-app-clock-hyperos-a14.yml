                "\t * KernelSU-Next legacy root path stays untouched; this only services\n"
                "\t * root-owned ksu_susfs userspace commands using prctl(0xDEADBEEF, ...).\n"
                "\t */\n"
                "\t/* IMPORTANT: do not swallow KernelSU Manager/userspace requests. */\n"
                "\tif (option == KERNEL_SU_OPTION && !strncmp(current->comm, \"susfsd\", 6)) {\n"
                "\t\tif (0) pr_err(\"VILI_SUSFSD_PRCTL_FIX: option=0x%lx arg2=0x%lx arg3=0x%lx arg4=0x%lx arg5=0x%lx uid=%u\\n\",\n"
                "\t\t       option, arg2, arg3, arg4, arg5, current_uid().val);\n"
                "\t\tif (current_uid().val != 0)\n"
                "\t\t\treturn -EPERM;\n"
                "\t\t{\n"
                "\t\t\tint vili_susfs_ret = ksu_vili_handle_susfs_prctl(arg2, arg3, arg4, arg5);\n"
                "\t\t\tif (vili_susfs_ret != -EOPNOTSUPP)\n"
                "\t\t\t\treturn vili_susfs_ret;\n"
                "\t\t}\n"
                "\t}\n"
                "#endif\n")


        if 'Vili CI: direct SuSFS prctl bridge level 3 try_umount debug v8 v8' not in s:
