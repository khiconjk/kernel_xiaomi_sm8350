        id=v126_ghost_guard
        name=V126 Ghost Uptime App Clock Guard
        version=V126
        versionCode=1260
        author=khiconjk
        description=Retains stable ghost uptime/readout guards and fixes app-process Zygisk compatibility with dynamically linked libc.so ELF plus staged hook telemetry; package-scoped Java MONOTONIC canary remains fail-open.
