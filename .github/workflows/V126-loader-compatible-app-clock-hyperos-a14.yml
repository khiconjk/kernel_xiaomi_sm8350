        # arithmetic block that caused timer_list.c: expected expression.
        if 'Vili CI V60: timer_list active timer display sync only' in q or 'show_soft - show_now' in q:
            raise SystemExit('ERROR: unsafe old V60 active timer expires patch still present')

        write(tl, q)

        # 3) fs/stat.c: shift procfs only. Do NOT shift sysfs/tmpfs/nsfs/devpts/debugfs/tracefs; V55 runtime log showed 1970 kstat artifacts when broader kstat spoofing was active.
        st = Path('fs/stat.c')
        if not st.exists():
            raise SystemExit('ERROR: fs/stat.c missing')
        s = read(st)

        marker = '/**\n * generic_fillattr'
        if marker not in s:
            raise SystemExit('ERROR: generic_fillattr comment anchor not found')
        stat_includes = ''
        if '<linux/ghost_uptime.h>' not in s:
            stat_includes += '#include <linux/ghost_uptime.h>\n'
        if '<linux/timekeeping.h>' not in s:
            stat_includes += '#include <linux/timekeeping.h>\n'
        if '<linux/magic.h>' not in s:
            stat_includes += '#include <linux/magic.h>\n'
        if stat_includes:
            s = s.replace(marker, stat_includes + marker, 1)

        helper = """

        /* Vili CI V61: procfs shift plus old sysfs/pstore timestamp sanitizer. */
        #ifndef GHOST_UPTIME_MIN_VALID_REALTIME
        #define GHOST_UPTIME_MIN_VALID_REALTIME 1600000000LL
        #endif

        #ifndef SYSFS_MAGIC
        #define SYSFS_MAGIC 0x62656572
        #endif

        #ifndef PSTOREFS_MAGIC
        #define PSTOREFS_MAGIC 0x6165676C
        #endif

        #ifndef DEBUGFS_MAGIC
        #define DEBUGFS_MAGIC 0x64626720
        #endif

        #ifndef TRACEFS_MAGIC
        #define TRACEFS_MAGIC 0x74726163
        #endif

        static bool ghost_uptime_is_procfs(const struct inode *inode)
        {
                if (!inode || !inode->i_sb)
                        return false;
                return inode->i_sb->s_magic == PROC_SUPER_MAGIC;
        }

        static bool ghost_uptime_is_old_pseudo_fs(const struct inode *inode)
        {
                unsigned long magic;

                if (!inode || !inode->i_sb)
                        return false;

                magic = inode->i_sb->s_magic;
                return magic == SYSFS_MAGIC ||
                       magic == PSTOREFS_MAGIC ||
                       magic == DEBUGFS_MAGIC ||
                       magic == TRACEFS_MAGIC;
        }

        static bool ghost_uptime_ts_is_old(const struct timespec64 *ts)
        {
                return ts && ts->tv_sec > 0 &&
                       ts->tv_sec < (time64_t)GHOST_UPTIME_MIN_VALID_REALTIME;
        }

        static void ghost_uptime_shift_ts(struct timespec64 *ts, u64 off_sec)
        {
                if (!ts || !off_sec)
                        return;

                if (ts->tv_sec > (time64_t)off_sec)
                        ts->tv_sec -= (time64_t)off_sec;
                else if (ts->tv_sec > 0)
                        ts->tv_sec = 0;
        }

        static void ghost_uptime_set_ts(struct timespec64 *ts, time64_t sec)
        {
                if (!ts || sec <= 0)
                        return;
                ts->tv_sec = sec;
                ts->tv_nsec = 0;
        }

        static void ghost_uptime_sanitize_old_pseudo_ts(struct kstat *stat, u64 off_sec)
        {
                time64_t now;
                time64_t fake_boot_sec;

                if (!stat || !off_sec)
                        return;

                if (!ghost_uptime_ts_is_old(&stat->atime) &&
                    !ghost_uptime_ts_is_old(&stat->mtime) &&
                    !ghost_uptime_ts_is_old(&stat->ctime) &&
                    !ghost_uptime_ts_is_old(&stat->btime))
                        return;

                now = ktime_get_real_seconds();
                if (now <= (time64_t)(off_sec + GHOST_UPTIME_MIN_VALID_REALTIME))
                        return;

                fake_boot_sec = now - (time64_t)off_sec;
                ghost_uptime_set_ts(&stat->atime, fake_boot_sec);
                ghost_uptime_set_ts(&stat->mtime, fake_boot_sec);
                ghost_uptime_set_ts(&stat->ctime, fake_boot_sec);
                ghost_uptime_set_ts(&stat->btime, fake_boot_sec);
        }

        static bool ghost_uptime_stat_has_old_ts(const struct kstat *stat)
        {
                if (!stat)
                        return false;

                return ghost_uptime_ts_is_old(&stat->atime) ||
                       ghost_uptime_ts_is_old(&stat->mtime) ||
                       ghost_uptime_ts_is_old(&stat->ctime) ||
                       ghost_uptime_ts_is_old(&stat->btime);
        }

        static void ghost_uptime_shift_proc_ts_or_sanitize(struct kstat *stat, u64 off_sec)
        {
                if (!stat || !off_sec)
                        return;

                /* Vili CI V67: procfs inode timestamps can be mixed.
                 * /proc/uptime may have a valid realtime inode timestamp, while
                 * /proc/stat can carry an old 1970-era timestamp on this tree.
                 * Blind subtraction turns that into a visible 1970 regression.
                 * If any procfs timestamp is old, sanitize the whole kstat to
                 * fake boot realtime instead of subtracting the ghost offset.
                 */
                if (ghost_uptime_stat_has_old_ts(stat)) {
                        ghost_uptime_sanitize_old_pseudo_ts(stat, off_sec);
                        return;
                }

                ghost_uptime_shift_ts(&stat->atime, off_sec);
                ghost_uptime_shift_ts(&stat->mtime, off_sec);
                ghost_uptime_shift_ts(&stat->ctime, off_sec);
                ghost_uptime_shift_ts(&stat->btime, off_sec);
        }

        static void ghost_uptime_shift_stat(struct inode *inode, struct kstat *stat)
        {
                u64 off_sec;

                off_sec = ghost_uptime_offset_sec();
                if (!off_sec)
                        return;

                if (ghost_uptime_is_procfs(inode)) {
                        ghost_uptime_shift_proc_ts_or_sanitize(stat, off_sec);
                        return;
                }

                if (ghost_uptime_is_old_pseudo_fs(inode))
                        ghost_uptime_sanitize_old_pseudo_ts(stat, off_sec);
        }
        """.replace('          ', '')
        if 'ghost_uptime_should_shift_stat' not in s:
            sig = 'void generic_fillattr(struct inode *inode, struct kstat *stat)'
            if sig not in s:
                raise SystemExit('ERROR: generic_fillattr signature not found')
            s = s.replace(sig, helper + '\n' + sig, 1)
        else:
            # Source tree should be clean in CI, but this makes the patch safe if reapplied.
            s = re.sub(r'/\* Vili CI V5[23]:.*?static void ghost_uptime_shift_stat\(struct inode \*inode, struct kstat \*stat\)\s*\{.*?\n\}', helper.strip(), s, flags=re.S)

        if 'ghost_uptime_shift_stat(inode, stat);' not in s:
            target = 'stat->blocks = inode->i_blocks;\n}'
            repl = 'stat->blocks = inode->i_blocks;\n\tghost_uptime_shift_stat(inode, stat);\n}'
            if target not in s:
                raise SystemExit('ERROR: generic_fillattr blocks anchor not found')
            s = s.replace(target, repl, 1)
        write(st, s)

        # 4) /proc/uptime content: V61 uses patched CLOCK_BOOTTIME path.
        # Do not keep the V57 direct addition here, otherwise /proc/uptime would double-add the ghost offset.
        up = Path('fs/proc/uptime.c')
        if not up.exists():
            raise SystemExit('ERROR: fs/proc/uptime.c missing')
        u = read(up)
        uptime_anchor = 'ktime_get_boottime_ts64(&uptime);'
        if uptime_anchor not in u:
            raise SystemExit('ERROR: uptime ktime_get_boottime_ts64 anchor not found')
        u = re.sub(r'\n\s*/\* Vili CI V5[0-9]: make /proc/uptime reflect ghost boot age\. \*/\s*\n\s*if \(ghost_uptime_offset_sec\(\)\)\s*\n\s*uptime\.tv_sec \+= \(time64_t\)ghost_uptime_offset_sec\(\);', '', u, flags=re.S)
        uptime_marker = '/* Vili CI V61: /proc/uptime now follows patched CLOCK_BOOTTIME path; no second offset here. */'
        if uptime_marker not in u:
            u = u.replace(uptime_anchor, uptime_anchor + '\n\t' + uptime_marker, 1)
        write(up, u)

        # 5) /proc/stat btime: subtract the same visible offset from btime.
        ps = Path('fs/proc/stat.c')
        if not ps.exists():
            raise SystemExit('ERROR: fs/proc/stat.c missing')
        p = read(ps)
        if '<linux/ghost_uptime.h>' not in p:
            includes = list(re.finditer(r'^#include .*$', p, flags=re.M))
            if not includes:
                raise SystemExit('ERROR: include anchor not found in proc stat.c')
            pos = includes[-1].end()
            p = p[:pos] + '\n#include <linux/ghost_uptime.h>' + p[pos:]

        btime_helper = """

        /* Vili CI V61: keep /proc/stat btime consistent with fake /proc/uptime. */
        static u64 ghost_uptime_fake_btime_sec(const struct timespec64 *boottime)
        {
                u64 btime;
                u64 off_sec;

                if (!boottime || boottime->tv_sec <= 0)
                        return 0;

                btime = (u64)boottime->tv_sec;
                off_sec = ghost_uptime_offset_sec();

                if (!off_sec)
                        return btime;
                if (btime > off_sec)
                        return btime - off_sec;
                return 0;
        }
        """.replace('          ', '')
        if 'ghost_uptime_fake_btime_sec' not in p:
            sig = 'static int show_stat(struct seq_file *p, void *v)'
            if sig not in p:
                raise SystemExit('ERROR: show_stat signature not found in fs/proc/stat.c')
            p = p.replace(sig, btime_helper + '\n' + sig, 1)

        old = '(unsigned long long)boottime.tv_sec,\n\t\ttotal_forks'
        new = '(unsigned long long)ghost_uptime_fake_btime_sec(&boottime),\n\t\ttotal_forks'
        if old in p:
            p = p.replace(old, new, 1)
        elif 'ghost_uptime_fake_btime_sec(&boottime)' not in p:
            # Fallback for single-line/minified formatting.
            p2, n = re.subn(r'\(unsigned long long\)boottime\.tv_sec', r'(unsigned long long)ghost_uptime_fake_btime_sec(&boottime)', p, count=1)
            if n != 1:
                raise SystemExit('ERROR: btime boottime.tv_sec anchor not found in fs/proc/stat.c')
            p = p2
        write(ps, p)

        print('Wrote include/linux/ghost_uptime.h')
        print('Patched kernel/time/timekeeping.c: arch_sys_boot_offset plus CLOCK_BOOTTIME API wrapper offset, no boot_offset shift')
        print('Patched fs/stat.c: procfs shift/sanitize plus old sysfs/pstore timestamp sanitizer V67')
        print('Patched fs/proc/uptime.c: no direct offset; follows patched CLOCK_BOOTTIME path')
        print('Patched fs/proc/stat.c: btime offset sync')
        PY_GHOST_UPTIME_V61

        echo "===== GHOST UPTIME V61 VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'arch_sys_boot_offset|ghost_uptime|GHOST_UPTIME|ghost_uptime_shift_stat|ghost_uptime_fake_btime_sec|TK_OFFS_BOOT|CLOCK_BOOTTIME' include/linux/ghost_uptime.h kernel/time/timekeeping.c kernel/time/timer_list.c kernel/printk/printk.c fs/stat.c fs/proc/uptime.c fs/proc/stat.c 2>/dev/null | head -260 | tee -a ../setup.log || true

        if ! grep -q 'arch_sys_boot_offset' kernel/time/timekeeping.c; then
          echo "ERROR: arch_sys_boot_offset missing from timekeeping.c" | tee -a ../setup.log
          exit 1
        fi
        if grep -q 'boot_offset.tv_sec +=.*ghost' kernel/time/timekeeping.c; then
          echo "ERROR: V61 must not shift boot_offset.tv_sec" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_shift_stat' fs/stat.c; then
          echo "ERROR: ghost_uptime_shift_stat missing from fs/stat.c" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_sanitize_old_pseudo_ts' fs/stat.c; then
          echo "ERROR: V61 sysfs/pstore old timestamp sanitizer missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_shift_proc_ts_or_sanitize' fs/stat.c; then
          echo "ERROR: V67 procfs old timestamp sanitizer missing" | tee -a ../setup.log
          exit 1
        fi
        if grep -q 'TMPFS_MAGIC\|NSFS_MAGIC\|DEVPTS_SUPER_MAGIC\|0x01021994\|0x6e736673\|0x00001cd1' fs/stat.c; then
          echo "ERROR: V61 must not globally shift tmpfs/nsfs/devpts timestamps" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: /proc/uptime now follows patched CLOCK_BOOTTIME path' fs/proc/uptime.c; then
          echo "ERROR: /proc/uptime V61 no-double marker missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: CLOCK_BOOTTIME API + VDSO sync' kernel/time/timekeeping.c; then
          echo "ERROR: V61 CLOCK_BOOTTIME API patch missing in ktime_get_with_offset" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: CLOCK_BOOTTIME coarse API sync' kernel/time/timekeeping.c; then
          echo "ERROR: V61 CLOCK_BOOTTIME coarse patch missing" | tee -a ../setup.log
          exit 1
        fi
