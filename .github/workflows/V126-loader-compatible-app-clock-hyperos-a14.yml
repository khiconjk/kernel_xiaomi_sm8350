        from pathlib import Path

        # Only rewrite text inside C string literals. This avoids renaming real
        # symbols, config names, SELinux constants, or function identifiers.
        replacements = {
            'KernelSU:': 'Security:',
            'KernelSU': 'Security',
            'kernelSU': 'security',
            'kernelsu': 'security',
            'ksu fd installed': 'fd installed',
            'ksu fd released': 'fd released',
            'ksu_file': 'policy_file',
            'ksu_show_allow_list': 'show_allow_list',
            'context: %s': 'ctx: ok',
            ', context: %s': ', ctx: ok',
        }

        def rewrite_c_string_literals(text: str) -> str:
            out = []
            i = 0
            n = len(text)
            while i < n:
                ch = text[i]
                if ch != '"':
                    out.append(ch)
                    i += 1
                    continue
                # Parse a C string literal, preserving escapes.
                j = i + 1
                escaped = False
                buf = ['"']
                content = []
                while j < n:
                    c = text[j]
                    if escaped:
                        content.append(c)
                        buf.append(c)
                        escaped = False
                        j += 1
                        continue
                    if c == '\\':
                        content.append(c)
                        buf.append(c)
                        escaped = True
                        j += 1
                        continue
                    if c == '"':
                        raw = ''.join(content)
                        new = raw
                        for old, repl in replacements.items():
                            new = new.replace(old, repl)
                        out.append('"' + new + '"')
                        j += 1
                        break
                    content.append(c)
                    buf.append(c)
                    j += 1
                else:
                    # Unclosed string, keep original tail.
                    out.append(text[i:])
                    return ''.join(out)
                i = j
            return ''.join(out)

        roots = [Path('drivers/kernelsu')]
        suffixes = {'.c', '.h'}
        changed = []
        for root in roots:
            if not root.exists():
                continue
            for p in root.rglob('*'):
                if not p.is_file() or p.suffix not in suffixes:
                    continue
                try:
                    data = p.read_text(errors='ignore')
                except Exception:
                    continue
                new = rewrite_c_string_literals(data)
                if new != data:
                    p.write_text(new)
                    changed.append(str(p))

        print('Changed files:')
        for item in changed:
            print('  ' + item)
        if not changed:
            print('  none; KernelSU strings may already be quieted')

        # Verification V61: only inspect C string literals, not identifiers.
        # V43 stopped because identifiers such as ksu_file and
        # ksu_show_allow_list remained in source code. Those are not dmesg
        # text by themselves. Hard-hide kallsyms was already handled in the
        # previous step, so this step must only validate visible log strings.
        bad_fragments = ['KernelSU:', 'ksu fd installed', 'ksu fd released', 'ksu_file', 'ksu_show_allow_list', 'context: %s']

        def iter_c_string_literals(text: str):
            i = 0
            n = len(text)
            while i < n:
                if text[i] != '"':
                    i += 1
                    continue
                j = i + 1
                escaped = False
                content = []
                while j < n:
                    c = text[j]
                    if escaped:
                        content.append(c)
                        escaped = False
                        j += 1
                        continue
                    if c == '\\':
                        content.append(c)
                        escaped = True
                        j += 1
                        continue
                    if c == '"':
                        yield ''.join(content)
                        j += 1
                        break
                    content.append(c)
                    j += 1
                i = j

        bad = []
        for root in roots:
            if not root.exists():
                continue
            for p in root.rglob('*'):
                if not p.is_file() or p.suffix not in suffixes:
                    continue
                data = p.read_text(errors='ignore')
                for literal in iter_c_string_literals(data):
                    for frag in bad_fragments:
                        if frag in literal:
                            bad.append((str(p), frag, literal[:160]))
        if bad:
            print('ERROR: visible dmesg fragments still present inside C string literals:')
            for path, frag, literal in bad[:80]:
