        \  'static u64 vili_ghost_times_jiffies(void)',\n    native_new,\n    compat_new,\n)\nmissing = [item for item in\
        \ required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete retained V105 times layer:\
        \ {missing}')\nif text == original:\n    raise SystemExit('ERROR: retained V105 times layer made no source change')\n\
        path.write_text(text)\nprint('Retained V105 POSIX times(2) readout layer for native and compat tasks.')\nPY_V105_TIMES\n\
