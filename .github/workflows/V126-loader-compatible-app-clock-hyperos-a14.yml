        echo "===== VERIFY V85 SOURCE MARKERS ARE PRESENT =====" | tee -a ../setup.log
        if ! grep -Rqs 'Vili CI V85: /proc/softirqs display counter sync' fs/proc/softirqs.c; then
          echo "ERROR: V85 softirqs helper marker missing; do not continue." | tee -a ../setup.log
          exit 1
        fi
        if ! grep -Rqs 'ghost_uptime_proc_softirq_count(i, j, kstat_softirqs_cpu(i, j))' fs/proc/softirqs.c; then
          echo "ERROR: V85 softirqs output replacement missing; do not continue." | tee -a ../setup.log
          exit 1
        fi
        grep -RnsE 'Vili CI V85|ghost_uptime_proc_softirq_count|TIMER_SOFTIRQ|SCHED_SOFTIRQ|RCU_SOFTIRQ|kstat_softirqs_cpu' fs/proc/softirqs.c 2>/dev/null | head -180 | tee -a ../setup.log || true

        echo "===== FIND /PROC/INTERRUPTS IMPLEMENTATION CONTEXT FOR LATER V88 =====" | tee -a ../setup.log
        python3 - <<'PY_V87_IRQ_AUDIT' 2>&1 | tee -a ../setup.log
        from pathlib import Path

        roots = [Path('kernel'), Path('arch'), Path('fs')]
        terms = ['show_interrupts', 'arch_show_interrupts', 'kstat_irqs', 'for_each_irq_desc', 'seq_printf(p, "%10']
        hits = []
        for root in roots:
            if not root.exists():
                continue
            for p in root.rglob('*.c'):
                try:
                    s = p.read_text(errors='ignore')
                except Exception:
                    continue
                score = sum(1 for t in terms if t in s)
                if score:
                    hits.append((score, str(p), s))

        hits.sort(key=lambda x: (-x[0], x[1]))
        print('V87 interrupt implementation candidates:')
        for score, path, s in hits[:30]:
            print(f'  score={score:02d} {path}')

        for score, path, s in hits[:8]:
            print('\n===== IRQ CONTEXT:', path, 'score', score, '=====')
            shown = False
            for term in terms:
                idx = s.find(term)
                if idx >= 0:
                    print('--- term:', term, '---')
                    print(s[max(0, idx-900):idx+1800])
                    shown = True
                    break
            if not shown:
                print('no context printed')
        PY_V87_IRQ_AUDIT

        echo "V87 lock/audit OK: build will keep V85 and not patch interrupts yet" | tee -a ../setup.log
