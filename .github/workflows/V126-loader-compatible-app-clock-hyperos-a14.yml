        echo "===== PATCH V82 /PROC/STAT OUTPUT IDLE JIFFIES SYNC =====" | tee -a ../setup.log
        echo "V81 get_idle_time hook did not affect this tree's /proc/stat output. V82 patches the output-stage seq_put_decimal_ull idle fields directly: aggregate cpu gets offset*NR_CPUS*USER_HZ and cpuN gets offset*USER_HZ. No MONOTONIC/RAW/timekeeping/scheduler core changes." | tee -a ../setup.log

