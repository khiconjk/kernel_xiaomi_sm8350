\"#else\\n\"\n    \"extern void susfs_try_umount_all(uid_t uid);\\n\"\n    \"#endif\\n\"\n)\n\nif 'Vili CI V22: namespace susfs_try_umount_all conditional compat' not in s:\n    pattern = r'^\\s*extern\\s+void\\s+susfs_try_umount_all\\s*\\(\\s*uid_t\\s+uid\\s*\\)\\s*;\\s*$'\n    if re.search(pattern, s, flags=re.M):\n        s = re.sub(pattern, stub.rstrip(), s, count=1, flags=re.M)\n    else:\n        m = re.search(r'void\\s+susfs_run_try_umount_for_current_mnt_ns\\s*\\(', s)\n        if not m:\n            raise SystemExit('ERROR: cannot locate susfs_try_umount_all extern or susfs_run_try_umount_for_current_mnt_ns in fs/namespace.c')\n        s = s[:m.start()] + stub + '\\n' + s[m.start():]\n    p.write_text(s)\n    print('Patched fs/namespace.c: added conditional susfs_try_umount_all compat')\nelse:\n    print('fs/namespace.c already has V22 susfs_try_umount_all conditional compat')\n\nfinal = p.read_text(errors='ignore')\nif 'Vili CI V22: namespace susfs_try_umount_all conditional compat' not in final:\n    raise SystemExit('ERROR: V22 susfs_try_umount_all conditional compat verification failed')\nPY_NS_TRY_UMOUNT_ALL_STUB\n\n    echo \"===== NAMESPACE susfs_try_umount_all CONDITIONAL COMPAT VERIFY =====\" | tee -a ../setup.log\n    grep -Rns \"Vili CI V22: namespace susfs_try_umount_all conditional compat\\|susfs_try_umount_all\\|susfs_run_try_umount_for_current_mnt_ns\" fs/namespace.c 2>/dev/null | head -80 | tee -a ../setup.log || true\n\n    echo \"===== ADD SUSFS KCONFIG/KBUILD GLUE FOR LEGACY KSU ROOT-FIRST BUILD =====\" | tee -a ../setup.log\n    python3 - <<'PY_SUSFS_LEGACY_GLUE' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\nkconf = Path('drivers/kernelsu/Kconfig')\ns = kconf.read_text(errors='ignore')\nif 'config KSU_SUSFS' not in s:\n    block = \"\"\"\n\nmenu \\\"KernelSU legacy + SuSFS port\\\"\n\nconfig KSU_SUSFS\n    bool \\\"KernelSU addon - SuSFS root hiding hooks\\\"\n    depends on KSU\n    depends on THREAD_INFO_IN_TASK\n    default y\n\nconfig KSU_SUSFS_HAS_MAGIC_MOUNT\n    bool \\\"SuSFS has Magic Mount support marker\\\"\n   \
        \ depends on KSU_SUSFS\n    default y\n\nconfig KSU_SUSFS_SUS_PATH\n    bool \\\"SuSFS suspicious path hiding\\\"\n    depends on KSU_SUSFS\n    default y\n\nconfig KSU_SUSFS_SUS_KSTAT\n    bool \\\"SuSFS suspicious kstat spoofing\\\"\n    depends on KSU_SUSFS\n    default y\n\nconfig KSU_SUSFS_SPOOF_UNAME\n    bool \\\"SuSFS uname spoofing\\\"\n    depends on KSU_SUSFS\n    default y\n\nconfig KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS\n    bool \\\"SuSFS hide KSU/SuSFS kallsyms symbols\\\"\n    depends on KSU_SUSFS\n    default y\n\nconfig KSU_SUSFS_ENABLE_LOG\n    bool \\\"SuSFS kernel logging\\\"\n    depends on KSU_SUSFS\n    default n\n\nconfig KSU_SUSFS_SUS_MOUNT\n    bool \\\"SuSFS suspicious mount hiding\\\"\n    depends on KSU_SUSFS\n    default n\n\nconfig KSU_SUSFS_TRY_UMOUNT\n    bool \\\"SuSFS try umount\\\"\n    depends on KSU_SUSFS\n    default n\n\nconfig KSU_SUSFS_OPEN_REDIRECT\n    bool \\\"SuSFS open redirect\\\"\n    depends on KSU_SUSFS\n    default n\n\nconfig KSU_SUSFS_SUS_MAP\n    bool \\\"SuSFS map hiding\\\"\n    depends on KSU_SUSFS\n    default n\n\nconfig KSU_SUSFS_SUS_SU\n    bool \\\"SuSFS sus_su\\\"\n    depends on KSU_SUSFS && KPROBES && HAVE_KPROBES && KPROBE_EVENTS\n    default n\n\nconfig KSU_SUSFS_MNT_ID_REORDER\n    bool \\\"SuSFS mount id reorder\\\"\n    depends on KSU_SUSFS_SUS_MOUNT\n    default n\n\nconfig KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n    bool \\\"SuSFS cmdline or bootconfig spoofing\\\"\n    depends on KSU_SUSFS\n    default n\n\nendmenu\n\"\"\"\n    if 'endmenu' in s:\n        idx = s.rfind('endmenu')\n        s = s[:idx] + block + '\\n' + s[idx:]\n    else:\n        s += block\n    kconf.write_text(s)\n    print('Added KSU_SUSFS Kconfig block into drivers/kernelsu/Kconfig')\nelse:\n    print('drivers/kernelsu/Kconfig already has KSU_SUSFS')\n\nfsmk = Path('fs/Makefile')\nfs = fsmk.read_text(errors='ignore')\nif 'susfs.o' not in fs:\n    fs += '\\n# vili SuSFS legacy manual-hook port\\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\\nobj-$(CONFIG_KSU_SUSFS_SUS_SU) += sus_su.o\\n'\n    fsmk.write_text(fs)\n    print('Added susfs.o/sus_su.o to fs/Makefile')\nelse:\n    print('fs/Makefile already references susfs.o')\nPY_SUSFS_LEGACY_GLUE\n\necho \"===== ADD SUSFS KSU COMMAND BRIDGE LEVEL 2 =====\" | tee -a ../setup.log\necho \"Level 5 SUS_SU runtime debug goal: V35 keeps V33 bootable SUS_SU, fixes susfsd features output, and logs only SUS_SU mode/ready/command calls. Keep KSU manual-hook root path and hide symbols disabled.\" | tee -a ../setup.log\ncat > drivers/kernelsu/vili_susfs_cmd_bridge.c <<'EOF_VILI_SUSFS_CMD_BRIDGE'\n// SPDX-License-Identifier: GPL-2.0\n/*\n * Xiaomi 11T Pro vili / kernel 5.4 / KernelSU-Next legacy manual-hook\n * SuSFS command bridge level 2.\n */\n#include <linux/kernel.h>\n#include <linux/types.h>\n#include <linux/uaccess.h>\n#include <linux/errno.h>\n#include <linux/string.h>\n#include <linux/uidgid.h>\n#include <linux/cred.h>\n#include <linux/sched.h>\n#include <linux/susfs.h>\n#include <linux/susfs_def.h>\n\n#ifndef EOPNOTSUPP\n#define EOPNOTSUPP 95\n#endif\n\n/*\n * Vili CI V30: Some KernelSU-Next legacy trees do not expose the\n * SuSFS CMD_* values to this bridge at compile time even though the\n * copied userspace susfsd calls the fixed ABI command numbers.\n * Hardcode the kernel-5.4 SuSFS userspace ABI IDs and probe the\n * userspace ABI as mixed pointer/status: features uses int-pointer pair while version/variant use string buffer plus status int.\n */\n#ifndef CMD_SUSFS_ADD_SUS_PATH\n#define CMD_SUSFS_ADD_SUS_PATH 0x55550\n#endif\n#ifndef CMD_SUSFS_ADD_SUS_MOUNT\n#define CMD_SUSFS_ADD_SUS_MOUNT 0x55560\n#endif\n#ifndef CMD_SUSFS_ADD_SUS_KSTAT\n#define CMD_SUSFS_ADD_SUS_KSTAT 0x55570\n#endif\n#ifndef CMD_SUSFS_UPDATE_SUS_KSTAT\n#define CMD_SUSFS_UPDATE_SUS_KSTAT 0x55571\n#endif\n#ifndef CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY\n#define CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY 0x55572\n#endif\n#ifndef CMD_SUSFS_ADD_TRY_UMOUNT\n#define CMD_SUSFS_ADD_TRY_UMOUNT 0x55580\n#endif\n#ifndef CMD_SUSFS_SET_UNAME\n#define CMD_SUSFS_SET_UNAME 0x55590\n#endif\n#ifndef CMD_SUSFS_ENABLE_LOG\n\
        #define CMD_SUSFS_ENABLE_LOG 0x555a0\n#endif\n#ifndef CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG\n#define CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG 0x555b0\n#endif\n#ifndef CMD_SUSFS_ADD_OPEN_REDIRECT\n#define CMD_SUSFS_ADD_OPEN_REDIRECT 0x555c0\n#endif\n#ifndef CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS\n#define CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS 0x555d0\n#endif\n#ifndef CMD_SUSFS_SHOW_VERSION\n#define CMD_SUSFS_SHOW_VERSION 0x555e1\n#endif\n#ifndef CMD_SUSFS_SHOW_ENABLED_FEATURES\n#define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x555e2\n#endif\n#ifndef CMD_SUSFS_SHOW_VARIANT\n#define CMD_SUSFS_SHOW_VARIANT 0x555e3\n#endif\n#ifndef CMD_SUSFS_SHOW_SUS_SU_WORKING_MODE\n#define CMD_SUSFS_SHOW_SUS_SU_WORKING_MODE 0x555e4\n#endif\n#ifndef CMD_SUSFS_IS_SUS_SU_READY\n#define CMD_SUSFS_IS_SUS_SU_READY 0x555f0\n#endif\n#ifndef CMD_SUSFS_SUS_SU\n#define CMD_SUSFS_SUS_SU 0x60000\n#endif\n#ifndef SUSFS_VERSION\n#define SUSFS_VERSION \"1.5.5\"\n#endif\n#ifndef SUSFS_VARIANT\n#define SUSFS_VARIANT \"ksu\"\n#endif\n\n#define VILI_SUSFS_FEAT_SUS_PATH          (1UL << 0)\n#define VILI_SUSFS_FEAT_SUS_MOUNT         (1UL << 1)\n#define VILI_SUSFS_FEAT_SUS_KSTAT         (1UL << 2)\n#define VILI_SUSFS_FEAT_TRY_UMOUNT        (1UL << 3)\n#define VILI_SUSFS_FEAT_SPOOF_UNAME       (1UL << 4)\n#define VILI_SUSFS_FEAT_ENABLE_LOG        (1UL << 5)\n#define VILI_SUSFS_FEAT_HIDE_SYMBOLS      (1UL << 6)\n#define VILI_SUSFS_FEAT_SPOOF_CMDLINE     (1UL << 7)\n#define VILI_SUSFS_FEAT_OPEN_REDIRECT     (1UL << 8)\n#define VILI_SUSFS_FEAT_SUS_SU            (1UL << 9)\n#define VILI_SUSFS_FEAT_SUS_MAP           (1UL << 10)\n#define VILI_SUSFS_FEAT_MAGIC_MOUNT       (1UL << 11)\n\nstatic unsigned long vili_susfs_enabled_features(void)\n{\n        unsigned long features = 0;\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n        features |= VILI_SUSFS_FEAT_SUS_PATH;\n#endif\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n        features |= VILI_SUSFS_FEAT_SUS_MOUNT;\n#endif\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n        features |= VILI_SUSFS_FEAT_SUS_KSTAT;\n#endif\n#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\n        features |= VILI_SUSFS_FEAT_TRY_UMOUNT;\n#endif\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n        features |= VILI_SUSFS_FEAT_SPOOF_UNAME;\n#endif\n#ifdef CONFIG_KSU_SUSFS_ENABLE_LOG\n        features |= VILI_SUSFS_FEAT_ENABLE_LOG;\n#endif\n#ifdef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS\n        features |= VILI_SUSFS_FEAT_HIDE_SYMBOLS;\n#endif\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n        features |= VILI_SUSFS_FEAT_SPOOF_CMDLINE;\n#endif\n#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n        /*\n         * Vili CI V42:\n         * OPEN_REDIRECT is enabled in kernel, but this bundled\n         * susfsd prints '?' when bit 8 is advertised in the generic\n         * feature mask. Keep the kernel function active and hide\n         * only the generic userspace bit, same strategy as SUS_SU.\n         */\n        if (0) features |= VILI_SUSFS_FEAT_OPEN_REDIRECT;\n#endif\n#ifdef CONFIG_KSU_SUSFS_SUS_SU\n        /*\n         * Vili CI V42:\n         * The bundled susfsd probes SUS_SU with dedicated commands.\n         * Advertising bit 9 in the generic feature mask makes this\n         * susfsd print '?'. Keep SUS_SU enabled but hide only this\n         * generic feature bit for userspace compatibility.\n         */\n        if (0) features |= VILI_SUSFS_FEAT_SUS_SU;\n#endif\n#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n        features |= VILI_SUSFS_FEAT_SUS_MAP;\n#endif\n#ifdef CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT\n        features |= VILI_SUSFS_FEAT_MAGIC_MOUNT;\n#endif\n        /*\n         * Vili CI V42:\n         * Keep OPEN_REDIRECT compiled in, but report the known-safe\n         * V36 userspace feature mask. The bundled susfsd prints '?'\n         * when newer optional bits are advertised, even though the\n         * kernel symbols and command handlers exist.\n         * Safe mask 2079 = SUS_PATH | SUS_MOUNT | SUS_KSTAT |\n         * TRY_UMOUNT | SPOOF_UNAME | HAS_MAGIC_MOUNT.\n         */\n        return