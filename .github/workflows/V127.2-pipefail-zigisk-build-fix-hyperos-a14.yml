        \ no direct offset; follows patched CLOCK_BOOTTIME path')\nprint('Patched fs/proc/stat.c: btime offset sync')\nPY_GHOST_UPTIME_V61\n\necho \"===== GHOST UPTIME V61 VERIFY =====\" | tee -a ../setup.log\ngrep -RnsE 'arch_sys_boot_offset|ghost_uptime|GHOST_UPTIME|ghost_uptime_shift_stat|ghost_uptime_fake_btime_sec|TK_OFFS_BOOT|CLOCK_BOOTTIME' include/linux/ghost_uptime.h kernel/time/timekeeping.c kernel/time/timer_list.c kernel/printk/printk.c fs/stat.c fs/proc/uptime.c fs/proc/stat.c 2>/dev/null | head -260 | tee -a ../setup.log || true\n\nif ! grep -q 'arch_sys_boot_offset' kernel/time/timekeeping.c; then\n  echo \"ERROR: arch_sys_boot_offset missing from timekeeping.c\" | tee -a ../setup.log\n  exit 1\nfi\nif grep -q 'boot_offset.tv_sec +=.*ghost' kernel/time/timekeeping.c; then\n  echo \"ERROR: V61 must not shift boot_offset.tv_sec\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'ghost_uptime_shift_stat' fs/stat.c; then\n  echo \"ERROR: ghost_uptime_shift_stat missing from fs/stat.c\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'ghost_uptime_sanitize_old_pseudo_ts' fs/stat.c; then\n  echo \"ERROR: V61 sysfs/pstore old timestamp sanitizer missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'ghost_uptime_shift_proc_ts_or_sanitize' fs/stat.c; then\n  echo \"ERROR: V67 procfs old timestamp sanitizer missing\" | tee -a ../setup.log\n  exit 1\nfi\nif grep -q 'TMPFS_MAGIC\\|NSFS_MAGIC\\|DEVPTS_SUPER_MAGIC\\|0x01021994\\|0x6e736673\\|0x00001cd1' fs/stat.c; then\n  echo \"ERROR: V61 must not globally shift tmpfs/nsfs/devpts timestamps\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V61: /proc/uptime now follows patched CLOCK_BOOTTIME path' fs/proc/uptime.c; then\n  echo \"ERROR: /proc/uptime V61 no-double marker missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V61: CLOCK_BOOTTIME API + VDSO sync' kernel/time/timekeeping.c; then\n  echo \"ERROR: V61 CLOCK_BOOTTIME API patch missing in ktime_get_with_offset\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V61: CLOCK_BOOTTIME coarse API sync' kernel/time/timekeeping.c; then\n  echo \"ERROR: V61 CLOCK_BOOTTIME coarse patch missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V61: ktime_get_boot_fast_ns ghost offset' kernel/time/timekeeping.c; then\n  echo \"ERROR: V61 ktime_get_boot_fast_ns patch missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'ghost_uptime_sync_vdso_boot_offset' kernel/time/timekeeping.c; then\n  echo \"ERROR: V61 VDSO/userspace BOOTTIME sync helper missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V61: sync VDSO/userspace CLOCK_BOOTTIME exposure before update_vsyscall' kernel/time/timekeeping.c; then\n  echo \"ERROR: V61 update_vsyscall BOOTTIME sync call missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'ghost_uptime_fake_btime_sec(&boottime)' fs/proc/stat.c; then\n  echo \"ERROR: /proc/stat btime patch missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V61: timer_list header now-at display sync only' kernel/time/timer_list.c; then\n  echo \"ERROR: V61 timer_list now-at patch missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V61F: timer_list active timer expires-at local-var display sync only' kernel/time/timer_list.c; then\n  echo \"ERROR: V61 timer_list expires-at display patch missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V62: timer_list tickdevice next_event display sync only' kernel/time/timer_list.c; then\n  echo \"WARNING: V62 timer_list tickdevice next_event display patch marker missing; build will continue as V61 FIX2 for safety\" | tee -a ../setup.log\nfi\n\nif ! grep -q 'Vili CI V63 FIX: dmesg human timestamp display sync' kernel/printk/printk.c; then\n  echo \"ERROR: V63 dmesg human timestamp display patch missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V63 FIX: /dev/kmsg extended timestamp display sync' kernel/printk/printk.c; then\n  echo \"ERROR: V63 /dev/kmsg extended timestamp display patch missing\" | tee -a ../setup.log\n  exit 1\nfi\necho \"\
        V67 SAFE ghost uptime stable baseline OK: CLOCK_BOOTTIME + timer_list now/expires/next_event + printk/dmesg display-only, no MONOTONIC patch\" | tee -a ../setup.log\n"
    - name: Patch V68 task starttime proc stat sync without MONOTONIC core
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== PATCH V68 FIX2 TASK STARTTIME /PROC PID STAT SYNC =====\" | tee -a ../setup.log\npython3 - <<'PY_V68_TASK_STARTTIME_FIX2' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\nimport textwrap\n\narr = Path('fs/proc/array.c')\nif not arr.exists():\n    raise SystemExit('ERROR: fs/proc/array.c missing')\n\ns = arr.read_text(errors='ignore')\n\n# Some Android kernel trees are line-preserved, some are partially minified.\n# Insert the include in a way that is safe for both layouts.\nif '<linux/ghost_uptime.h>' not in s:\n    if s.startswith('// SPDX'):\n        nl = s.find('\\n')\n        if nl >= 0:\n            s = s[:nl+1] + '#include <linux/ghost_uptime.h>\\n' + s[nl+1:]\n        else:\n            s = '#include <linux/ghost_uptime.h>\\n' + s\n    else:\n        s = '#include <linux/ghost_uptime.h>\\n' + s\n\nhelper = textwrap.dedent(r'''\n\n/* Vili CI V68 FIX2: task starttime sync for /proc/[pid]/stat field 22.\n * This is deeper than dmesg/timer_list display cleanup, but still avoids\n * global CLOCK_MONOTONIC/RAW and scheduler clock changes that caused V65\n * bootloop.  Field 22 is exported as clock ticks since boot.\n *\n * Fix2 policy:\n * - V59/V63 can make task->real_start_time appear in fake BOOTTIME\n *   scale already.  V68 FIX added the offset again, producing field-22\n *   values around 2x fake uptime and negative age.\n * - /proc/[pid]/stat field 22 is ticks since boot, so early boot tasks\n *   such as init/system_server should be close to zero, while newly\n *   launched shell/app tasks should be near the current fake uptime.\n * - If start_ns is already fake-scale and still inside the first early\n *   boot window, rebase it by subtracting the ghost offset.  If it is\n *   old real-scale and not early, shift it forward.  Otherwise leave it.\n */\n#define GHOST_UPTIME_TASK_EARLY_BOOT_NS (120ULL * 1000000000ULL)\n\nstatic unsigned long long ghost_uptime_proc_task_start_time_ticks(const struct task_struct *task)\n{\n        u64 start_ns;\n        u64 off_ns;\n        u64 off_sec;\n\n        if (!task)\n                return 0;\n\n        start_ns = task->real_start_time;\n        off_sec = ghost_uptime_offset_sec();\n        off_ns = off_sec * 1000000000ULL;\n\n        if (off_ns) {\n                if (start_ns >= off_ns) {\n                        if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS)\n                                start_ns -= off_ns;\n                } else if (start_ns >= GHOST_UPTIME_TASK_EARLY_BOOT_NS) {\n                        start_ns += off_ns;\n                }\n        }\n\n        return nsec_to_clock_t(start_ns);\n}\n''')\n\nif 'ghost_uptime_proc_task_start_time_ticks' not in s:\n    m = re.search(r'static\\s+int\\s+do_task_stat\\s*\\(', s)\n    if not m:\n        raise SystemExit('ERROR: do_task_stat signature not found in fs/proc/array.c')\n    s = s[:m.start()] + helper + '\\n' + s[m.start():]\n\nif 'start_time = ghost_uptime_proc_task_start_time_ticks(task);' not in s:\n    s2, n = re.subn(\n        r'start_time\\s*=\\s*nsec_to_clock_t\\s*\\(\\s*task->real_start_time\\s*\\)\\s*;',\n        'start_time = ghost_uptime_proc_task_start_time_ticks(task);',\n        s,\n        count=1,\n    )\n    if n != 1:\n        idx = s.find('real_start_time')\n        print('ERROR: task real_start_time assignment anchor not found in fs/proc/array.c')\n        if idx >= 0:\n            print('===== real_start_time context =====')\n            print(s[max(0, idx-300): idx+300])\n        raise SystemExit(1)\n    s = s2\n\narr.write_text(s)\nprint('Patched fs/proc/array.c: /proc/[pid]/stat field 22 task starttime sync V68 FIX2')\nPY_V68_TASK_STARTTIME_FIX2\n\necho \"===== V68 FIX2 TASK STARTTIME VERIFY =====\" | tee -a ../setup.log\ngrep -RnsE 'ghost_uptime_proc_task_start_time_ticks|Vili CI V68 FIX2|real_start_time|do_task_stat|start_time = ghost' fs/proc/array.c 2>/dev/null | head -160 | tee -a ../setup.log || true\nif ! grep -q 'Vili CI V68 FIX2: task starttime sync' fs/proc/array.c; then\n  echo \"ERROR: V68 FIX2 task\
        \ starttime marker missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'start_time = ghost_uptime_proc_task_start_time_ticks(task);' fs/proc/array.c; then\n  echo \"ERROR: V68 FIX2 /proc/[pid]/stat start_time assignment missing\" | tee -a ../setup.log\n  exit 1\nfi\necho \"V68 FIX2 task starttime proc-stat patch OK: no MONOTONIC/RAW/core clock changes\" | tee -a ../setup.log\n"
    - name: Patch V74 FIX3 task starttime safe early-window tighten
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== PATCH V74 FIX3 TASK STARTTIME SAFE EARLY-WINDOW TIGHTEN =====\" | tee -a ../setup.log\necho \"V74 FIX2 stopped in setup because its verifier falsely treated the valid V68/V73 else-if helper logic as broken. V74 FIX3 keeps that compile-tested helper and only changes GHOST_UPTIME_TASK_EARLY_BOOT_NS from 120s to 30s.\" | tee -a ../setup.log\n\npython3 - <<'PY_V74_FIX3_EARLY_WINDOW' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\np = Path('fs/proc/array.c')\ns = p.read_text(errors='ignore')\n\nif 'ghost_uptime_proc_task_start_time_ticks' not in s:\n    raise SystemExit('ERROR: V68/V73 task starttime helper missing')\n\nif 'start_time = ghost_uptime_proc_task_start_time_ticks(task);' not in s:\n    raise SystemExit('ERROR: V68/V73 start_time assignment missing')\n\n# Accept either untouched 120s define or a previous 30s define if rerun.\npattern = re.compile(\n    r'(?m)^\\s*(/\\*\\s*Vili CI V74 FIX[23]:.*?\\*/\\s*)?'\n    r'#define\\s+GHOST_UPTIME_TASK_EARLY_BOOT_NS\\s+\\((?:120|30)ULL\\s*\\*\\s*1000000000ULL\\)'\n)\n\nif not pattern.search(s):\n    print('ERROR: cannot find GHOST_UPTIME_TASK_EARLY_BOOT_NS define')\n    idx = s.find('GHOST_UPTIME_TASK_EARLY_BOOT_NS')\n    if idx >= 0:\n        print(s[max(0, idx - 500):idx + 800])\n    raise SystemExit(1)\n\ns = pattern.sub(\n    '/* Vili CI V74 FIX3: tighten early-task window from 120s to 30s. */\\n'\n    '#define GHOST_UPTIME_TASK_EARLY_BOOT_NS (30ULL * 1000000000ULL)',\n    s,\n    count=1,\n)\n\n# Sanity: this valid else-if is expected in the V68/V73 helper; do NOT fail on it.\nif 'GHOST_UPTIME_TASK_EARLY_BOOT_NS (30ULL' not in s:\n    raise SystemExit('ERROR: V74 FIX3 30s define not present after patch')\n\nif 'ghost_uptime_proc_task_keep_small_start' in s:\n    raise SystemExit('ERROR: unexpected V74/V74-FIX helper-rewrite fragment found; workflow should be based on V73 or V74 FIX2 safe baseline')\n\np.write_text(s)\nprint('Patched fs/proc/array.c: V74 FIX3 early window 30s; existing V68/V73 helper preserved')\nPY_V74_FIX3_EARLY_WINDOW\n\necho \"===== V74 FIX3 TASK STARTTIME VERIFY =====\" | tee -a ../setup.log\ngrep -RnsE 'GHOST_UPTIME_TASK_EARLY_BOOT_NS|ghost_uptime_proc_task_start_time_ticks|start_time = ghost|V74 FIX3' fs/proc/array.c 2>/dev/null | head -180 | tee -a ../setup.log || true\nif ! grep -q 'GHOST_UPTIME_TASK_EARLY_BOOT_NS (30ULL' fs/proc/array.c; then\n  echo \"ERROR: V74 FIX3 30s early window not applied\" | tee -a ../setup.log\n  exit 1\nfi\nif grep -q 'ghost_uptime_proc_task_keep_small_start' fs/proc/array.c; then\n  echo \"ERROR: V74 FIX3 found old broken helper-rewrite fragment\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'start_time = ghost_uptime_proc_task_start_time_ticks(task);' fs/proc/array.c; then\n  echo \"ERROR: V74 FIX3 start_time assignment missing\" | tee -a ../setup.log\n  exit 1\nfi\necho \"V74 FIX3 task starttime patch OK: existing helper preserved, early window now 30s\" | tee -a ../setup.log\n"
    - name: Patch V77 process age policy for early userland tasks
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== PATCH V77 PROCESS AGE POLICY FOR EARLY USERLAND TASKS =====\" | tee -a ../setup.log\necho \"V76 showed early userland tasks can remain small. V77 keeps PID1/kernel threads small but shifts userland tasks near fake uptime. No MONOTONIC/RAW/core scheduler changes.\" | tee -a ../setup.log\n\npython3 - <<'PY_V77_PROC_AGE_POLICY' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\np = Path('fs/proc/array.c')\ns = p.read_text(errors='ignore')\n\nif 'ghost_uptime_proc_task_start_time_ticks' not in s:\n    raise SystemExit('ERROR: task starttime helper missing')\n\nif 'ghost_uptime_proc_task_keep_early_display' not in s:\n    marker = 'static unsigned long long ghost_uptime_proc_task_start_time_ticks(const struct task_struct *task)'\n    pos = s.find(marker)\n    if pos < 0:\n        raise SystemExit('ERROR: cannot find insertion point before task starttime helper')\n\n    helper_lines = [\n        'static bool ghost_uptime_proc_task_keep_early_display(const struct task_struct *task)',\n        '{',\n        '        if (!task)',\n        '                return false;',\n        '',\n        '        if (task->pid == 1 || task->tgid == 1)',\n        '                return true;',\n        '',\n        '        if (!task->mm)',\n        '                return true;',\n        '',\n        '        return false;',\n        '}',\n        '',\n        '',\n    ]\n    s = s[:pos] + '\\n'.join(helper_lines) + s[pos:]\n\nold1_tab = 'if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS)\\n\\t\\t\\t\\t\\tstart_ns -= off_ns;'\nnew1_tab = 'if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS &&\\n\\t\\t\\t\\t    ghost_uptime_proc_task_keep_early_display(task))\\n\\t\\t\\t\\t\\tstart_ns -= off_ns;'\n\nold1_spaces = 'if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS)\\n                                start_ns -= off_ns;'\nnew1_spaces = 'if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS &&\\n                                    ghost_uptime_proc_task_keep_early_display(task))\\n                                start_ns -= off_ns;'\n\nif old1_tab in s:\n    s = s.replace(old1_tab, new1_tab, 1)\nelif old1_spaces in s:\n    s = s.replace(old1_spaces, new1_spaces, 1)\nelif 'ghost_uptime_proc_task_keep_early_display(task)' not in s:\n    idx = s.find('if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS')\n    if idx >= 0:\n        print(s[max(0, idx-300):idx+500])\n    raise SystemExit('ERROR: cannot patch already-fake-scale early condition')\n\nold2 = '} else if (start_ns >= GHOST_UPTIME_TASK_EARLY_BOOT_NS) {'\nnew2 = '} else if (start_ns >= GHOST_UPTIME_TASK_EARLY_BOOT_NS ||\\n\\t\\t\\t\\t   !ghost_uptime_proc_task_keep_early_display(task)) {'\n\nif old2 in s:\n    s = s.replace(old2, new2, 1)\nelif '!ghost_uptime_proc_task_keep_early_display(task)' not in s:\n    idx = s.find('else if (start_ns >= GHOST_UPTIME_TASK_EARLY_BOOT_NS')\n    if idx >= 0:\n        print(s[max(0, idx-300):idx+500])\n    raise SystemExit('ERROR: cannot patch real-scale early condition')\n\nif 'start_time = ghost_uptime_proc_task_start_time_ticks(task);' not in s:\n    raise SystemExit('ERROR: start_time assignment missing')\nif 'ghost_uptime_proc_task_keep_early_display' not in s:\n    raise SystemExit('ERROR: V77 helper missing after patch')\nif '!ghost_uptime_proc_task_keep_early_display(task)' not in s:\n    raise SystemExit('ERROR: V77 real-scale userland shift condition missing')\n\np.write_text(s)\nprint('Patched fs/proc/array.c: V77 process age policy for early userland tasks')\nPY_V77_PROC_AGE_POLICY\n\necho \"===== V77 PROCESS AGE POLICY VERIFY =====\" | tee -a ../setup.log\ngrep -RnsE 'ghost_uptime_proc_task_keep_early_display|GHOST_UPTIME_TASK_EARLY_BOOT_NS|ghost_uptime_proc_task_start_time_ticks|start_time = ghost' fs/proc/array.c 2>/dev/null | head -240 | tee -a ../setup.log || true\nif ! grep -q 'ghost_uptime_proc_task_keep_early_display' fs/proc/array.c; then\n  echo \"ERROR: V77 helper missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q '!ghost_uptime_proc_task_keep_early_display(task)'\
        \ fs/proc/array.c; then\n  echo \"ERROR: V77 userland shift condition missing\" | tee -a ../setup.log\n  exit 1\nfi\necho \"V77 process age policy patch OK: PID1/kernel threads keep small; early userland shifts near fake uptime\" | tee -a ../setup.log\n"
    - name: Patch V80 proc uptime idle field sync
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== PATCH V80 /PROC/UPTIME IDLE FIELD SYNC =====\" | tee -a ../setup.log\necho \"V77 fixed process-age, but /proc/uptime field2 still exposed real idle seconds. V80 shifts field2 idle display by ghost offset * possible CPUs. Display-only; no MONOTONIC/RAW/timekeeping/scheduler core changes.\" | tee -a ../setup.log\n\npython3 - <<'PY_V80_PROC_UPTIME_IDLE' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\np = Path('fs/proc/uptime.c')\nif not p.exists():\n    raise SystemExit('ERROR: fs/proc/uptime.c not found')\n\ns = p.read_text(errors='ignore')\n\nif '<linux/ghost_uptime.h>' not in s:\n    includes = list(re.finditer(r'^#include\\s+<[^>]+>\\s*$', s, flags=re.M))\n    if includes:\n        pos = includes[-1].end()\n        s = s[:pos] + '\\n#include <linux/ghost_uptime.h>' + s[pos:]\n    else:\n        s = '#include <linux/ghost_uptime.h>\\n' + s\n\nmarker = 'Vili CI V80: sync /proc/uptime idle field'\nif marker not in s:\n    block_lines = [\n        '        /* Vili CI V80: sync /proc/uptime idle field to fake uptime scale. */',\n        '        if (ghost_uptime_offset_sec())',\n        '                idle.tv_sec += ghost_uptime_offset_sec() * num_possible_cpus();',\n    ]\n    block = '\\n'.join(block_lines)\n\n    patterns = [\n        r'(idle\\.tv_sec\\s*=\\s*div_u64_rem\\([^;]+;\\s*\\n\\s*idle\\.tv_nsec\\s*=\\s*[^;]+;)',\n        r'(idle\\.tv_sec\\s*=\\s*[^;]+;\\s*\\n\\s*idle\\.tv_nsec\\s*=\\s*[^;]+;)',\n    ]\n\n    inserted = False\n    for pat in patterns:\n        m = re.search(pat, s, flags=re.S)\n        if m:\n            s = s[:m.end()] + '\\n' + block + s[m.end():]\n            inserted = True\n            break\n\n    if not inserted:\n        m = re.search(r'(seq_printf\\s*\\(\\s*m\\s*,)', s)\n        if not m:\n            raise SystemExit('ERROR: cannot find idle field assignment or seq_printf in fs/proc/uptime.c')\n        s = s[:m.start()] + block + '\\n' + s[m.start():]\n\nif 'num_possible_cpus()' not in s:\n    raise SystemExit('ERROR: V80 idle field patch missing num_possible_cpus()')\nif 'ghost_uptime_offset_sec()' not in s:\n    raise SystemExit('ERROR: V80 idle field patch missing ghost_uptime_offset_sec()')\nif marker not in s:\n    raise SystemExit('ERROR: V80 marker missing')\n\np.write_text(s)\nprint('Patched fs/proc/uptime.c: V80 /proc/uptime idle field sync')\nPY_V80_PROC_UPTIME_IDLE\n\necho \"===== V80 /PROC/UPTIME IDLE FIELD VERIFY =====\" | tee -a ../setup.log\ngrep -RnsE 'Vili CI V80|ghost_uptime_offset_sec\\(\\)|num_possible_cpus\\(\\)|seq_printf' fs/proc/uptime.c 2>/dev/null | head -160 | tee -a ../setup.log || true\nif ! grep -q 'Vili CI V80: sync /proc/uptime idle field' fs/proc/uptime.c; then\n  echo \"ERROR: V80 marker missing in fs/proc/uptime.c\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'idle.tv_sec += ghost_uptime_offset_sec() \\* num_possible_cpus();' fs/proc/uptime.c; then\n  echo \"ERROR: V80 idle boost assignment missing\" | tee -a ../setup.log\n  exit 1\nfi\necho \"V80 /proc/uptime idle field sync patch OK\" | tee -a ../setup.log\n"
    - name: Patch V82 proc stat output idle jiffies sync
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== PATCH V82 /PROC/STAT OUTPUT IDLE JIFFIES SYNC =====\" | tee -a ../setup.log\necho \"V81 get_idle_time hook did not affect this tree's /proc/stat output. V82 patches the output-stage seq_put_decimal_ull idle fields directly: aggregate cpu gets offset*NR_CPUS*USER_HZ and cpuN gets offset*USER_HZ. No MONOTONIC/RAW/timekeeping/scheduler core changes.\" | tee -a ../setup.log\n\npython3 - <<'PY_V82_PROC_STAT_OUTPUT_IDLE' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\np = Path('fs/proc/stat.c')\nif not p.exists():\n    raise SystemExit('ERROR: fs/proc/stat.c not found')\n\ns = p.read_text(errors='ignore')\n\n# Make sure we are not carrying the ineffective V81 get_idle_time output patch.\nif 'Vili CI V81: sync /proc/stat CPU idle jiffies' in s:\n    raise SystemExit('ERROR: V82 must be based on V80/V77, not V81-patched stat.c')\n\nif '<linux/ghost_uptime.h>' not in s:\n    includes = list(re.finditer(r'^#include\\s+<[^>]+>\\s*$', s, flags=re.M))\n    if includes:\n        pos = includes[-1].end()\n        s = s[:pos] + '\\n#include <linux/ghost_uptime.h>' + s[pos:]\n    else:\n        s = '#include <linux/ghost_uptime.h>\\n' + s\n\nif '<linux/kernel_stat.h>' not in s:\n    # Usually already included; do not hard require.\n    pass\n\nhelper_marker = 'Vili CI V82: /proc/stat output-stage idle clock_t sync'\nif helper_marker not in s:\n    # Insert helper before show_stat() if possible.\n    show_pos = s.find('static int show_stat')\n    if show_pos < 0:\n        show_pos = s.find('show_stat')\n    if show_pos < 0:\n        raise SystemExit('ERROR: cannot find show_stat in fs/proc/stat.c')\n\n    helper_lines = [\n        '/* Vili CI V82: /proc/stat output-stage idle clock_t sync. */',\n        'static u64 ghost_uptime_proc_stat_idle_clock_t(u64 base, bool aggregate)',\n        '{',\n        '        u64 off = ghost_uptime_offset_sec();',\n        '',\n        '        if (!off)',\n        '                return base;',\n        '',\n        '        off *= USER_HZ;',\n        '        if (aggregate)',\n        '                off *= num_possible_cpus();',\n        '',\n        '        return base + off;',\n        '}',\n        '',\n        '',\n    ]\n    s = s[:show_pos] + '\\n'.join(helper_lines) + s[show_pos:]\n\ntarget = 'seq_put_decimal_ull(p, \" \", nsec_to_clock_t(idle));'\nif target not in s:\n    idx = s.find('nsec_to_clock_t(idle)')\n    if idx >= 0:\n        print(s[max(0, idx-500):idx+700])\n    raise SystemExit('ERROR: cannot find idle seq_put_decimal_ull output lines')\n\nreplacement_agg = 'seq_put_decimal_ull(p, \" \", ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), true));'\nreplacement_cpu = 'seq_put_decimal_ull(p, \" \", ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), false));'\n\ncount_before = s.count(target)\nif count_before < 2:\n    print(f'ERROR: expected at least 2 idle output lines, found {count_before}')\n    idx = s.find(target)\n    if idx >= 0:\n        print(s[max(0, idx-700):idx+900])\n    raise SystemExit(1)\n\n# Replace first occurrence: aggregate \"cpu  \" line. Second occurrence: per-cpu cpuN loop.\ns = s.replace(target, replacement_agg, 1)\ns = s.replace(target, replacement_cpu, 1)\n\nif target in s:\n    print('WARNING: additional nsec_to_clock_t(idle) outputs remain after first two replacements:')\n    idx = s.find(target)\n    print(s[max(0, idx-700):idx+900])\n\nif 'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), true)' not in s:\n    raise SystemExit('ERROR: aggregate V82 replacement missing')\nif 'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), false)' not in s:\n    raise SystemExit('ERROR: per-cpu V82 replacement missing')\nif 'off *= USER_HZ;' not in s or 'off *= num_possible_cpus();' not in s:\n    raise SystemExit('ERROR: V82 helper body incomplete')\n\np.write_text(s)\nprint('Patched fs/proc/stat.c: V82 output-stage /proc/stat idle jiffies sync')\nPY_V82_PROC_STAT_OUTPUT_IDLE\n\necho \"===== V82 /PROC/STAT OUTPUT IDLE VERIFY =====\" | tee -a ../setup.log\ngrep -RnsE\
        \ 'Vili CI V82|ghost_uptime_proc_stat_idle_clock_t|nsec_to_clock_t\\(idle\\)|USER_HZ|num_possible_cpus' fs/proc/stat.c 2>/dev/null | head -240 | tee -a ../setup.log || true\nif ! grep -q 'Vili CI V82: /proc/stat output-stage idle clock_t sync' fs/proc/stat.c; then\n  echo \"ERROR: V82 helper marker missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), true)' fs/proc/stat.c; then\n  echo \"ERROR: V82 aggregate idle output replacement missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), false)' fs/proc/stat.c; then\n  echo \"ERROR: V82 per-cpu idle output replacement missing\" | tee -a ../setup.log\n  exit 1\nfi\necho \"V82 /proc/stat output-stage idle jiffies sync patch OK\" | tee -a ../setup.log\n"
    - name: Patch V85 proc softirqs display sync
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== PATCH V85 /PROC/SOFTIRQS DISPLAY SYNC =====\" | tee -a ../setup.log\necho \"V84 showed /proc/softirqs TIMER/SCHED/RCU counters still look like real-session counters. V85 changes /proc/softirqs display only for TIMER/SCHED/RCU; no irq core, scheduler core, MONOTONIC/RAW/timekeeping changes.\" | tee -a ../setup.log\n\npython3 - <<'PY_V85_PROC_SOFTIRQS' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\np = Path('fs/proc/softirqs.c')\nif not p.exists():\n    raise SystemExit('ERROR: fs/proc/softirqs.c not found')\n\ns = p.read_text(errors='ignore')\n\nif '<linux/ghost_uptime.h>' not in s:\n    incs = list(re.finditer(r'^#include\\s+<[^>]+>\\s*$', s, flags=re.M))\n    pos = incs[-1].end() if incs else 0\n    s = s[:pos] + '\\n#include <linux/ghost_uptime.h>' + s[pos:]\n\nif '<linux/limits.h>' not in s:\n    incs = list(re.finditer(r'^#include\\s+<[^>]+>\\s*$', s, flags=re.M))\n    pos = incs[-1].end() if incs else 0\n    s = s[:pos] + '\\n#include <linux/limits.h>' + s[pos:]\n\nmarker = 'Vili CI V85: /proc/softirqs display counter sync'\nif marker not in s:\n    show_pos = s.find('static int show_softirqs')\n    if show_pos < 0:\n        show_pos = s.find('show_softirqs')\n    if show_pos < 0:\n        raise SystemExit('ERROR: cannot find show_softirqs in fs/proc/softirqs.c')\n\n    helper_lines = [\n        '/* Vili CI V85: /proc/softirqs display counter sync.',\n        ' * Display-only: keep real counters internally, but avoid exposing tiny',\n        ' * real-session TIMER/SCHED/RCU softirq counts next to fake multi-day uptime.',\n        ' */',\n        'static unsigned int ghost_uptime_proc_softirq_count(unsigned int nr,',\n        '                                                    unsigned int cpu,',\n        '                                                    unsigned int base)',\n        '{',\n        '        u64 off = ghost_uptime_offset_sec();',\n        '        u64 add = 0;',\n        '',\n        '        if (!off)',\n        '                return base;',\n        '',\n        '        if (nr == TIMER_SOFTIRQ)',\n        '                add = off * 50ULL;',\n        '        else if (nr == SCHED_SOFTIRQ)',\n        '                add = off * 28ULL;',\n        '        else if (nr == RCU_SOFTIRQ)',\n        '                add = off * 24ULL;',\n        '        else',\n        '                return base;',\n        '',\n        '        add += (u64)cpu * 97ULL;',\n        '',\n        '        if (add > (u64)UINT_MAX - base)',\n        '                return UINT_MAX;',\n        '',\n        '        return base + (unsigned int)add;',\n        '}',\n        '',\n        '',\n    ]\n    helper = '\\n'.join(helper_lines)\n    s = s[:show_pos] + helper + s[show_pos:]\n\ntarget = 'kstat_softirqs_cpu(i, j)'\nrepl = 'ghost_uptime_proc_softirq_count(i, j, kstat_softirqs_cpu(i, j))'\nif repl not in s:\n    if target not in s:\n        idx = s.find('kstat_softirqs_cpu')\n        if idx >= 0:\n            print(s[max(0, idx-600):idx+900])\n        raise SystemExit('ERROR: cannot find kstat_softirqs_cpu(i, j) output call')\n    s = s.replace(target, repl, 1)\n\nif repl not in s:\n    raise SystemExit('ERROR: V85 softirq output replacement missing')\nif 'nr == TIMER_SOFTIRQ' not in s or 'nr == SCHED_SOFTIRQ' not in s or 'nr == RCU_SOFTIRQ' not in s:\n    raise SystemExit('ERROR: V85 helper missing softirq family checks')\nif 'UINT_MAX' not in s:\n    raise SystemExit('ERROR: V85 saturation guard missing')\n\np.write_text(s)\nprint('Patched fs/proc/softirqs.c: V85 TIMER/SCHED/RCU display counter sync')\nPY_V85_PROC_SOFTIRQS\n\necho \"===== V85 /PROC/SOFTIRQS VERIFY =====\" | tee -a ../setup.log\ngrep -RnsE 'Vili CI V85|ghost_uptime_proc_softirq_count|TIMER_SOFTIRQ|SCHED_SOFTIRQ|RCU_SOFTIRQ|kstat_softirqs_cpu' fs/proc/softirqs.c 2>/dev/null | head -220 | tee -a ../setup.log || true\nif ! grep -q 'ghost_uptime_proc_softirq_count(i, j, kstat_softirqs_cpu(i, j))' fs/proc/softirqs.c; then\n  echo \"ERROR: V85 softirq output replacement missing\" |\
        \ tee -a ../setup.log\n  exit 1\nfi\necho \"V85 /proc/softirqs display sync patch OK\" | tee -a ../setup.log\n"
    - name: V87 lock V85 and audit proc interrupts only
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V87 LOCK V85 + AUDIT /PROC/INTERRUPTS ONLY =====\" | tee -a ../setup.log\necho \"V86 FIX2 runtime showed V85 softirqs got lost. V87 intentionally applies no /proc/interrupts patch. It locks/validates V85 and prints the real interrupt implementation context for a later safer patch.\" | tee -a ../setup.log\n\necho \"===== VERIFY V85 SOURCE MARKERS ARE PRESENT =====\" | tee -a ../setup.log\nif ! grep -Rqs 'Vili CI V85: /proc/softirqs display counter sync' fs/proc/softirqs.c; then\n  echo \"ERROR: V85 softirqs helper marker missing; do not continue.\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -Rqs 'ghost_uptime_proc_softirq_count(i, j, kstat_softirqs_cpu(i, j))' fs/proc/softirqs.c; then\n  echo \"ERROR: V85 softirqs output replacement missing; do not continue.\" | tee -a ../setup.log\n  exit 1\nfi\ngrep -RnsE 'Vili CI V85|ghost_uptime_proc_softirq_count|TIMER_SOFTIRQ|SCHED_SOFTIRQ|RCU_SOFTIRQ|kstat_softirqs_cpu' fs/proc/softirqs.c 2>/dev/null | head -180 | tee -a ../setup.log || true\n\necho \"===== FIND /PROC/INTERRUPTS IMPLEMENTATION CONTEXT FOR LATER V88 =====\" | tee -a ../setup.log\npython3 - <<'PY_V87_IRQ_AUDIT' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\nroots = [Path('kernel'), Path('arch'), Path('fs')]\nterms = ['show_interrupts', 'arch_show_interrupts', 'kstat_irqs', 'for_each_irq_desc', 'seq_printf(p, \"%10']\nhits = []\nfor root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*.c'):\n        try:\n            s = p.read_text(errors='ignore')\n        except Exception:\n            continue\n        score = sum(1 for t in terms if t in s)\n        if score:\n            hits.append((score, str(p), s))\n\nhits.sort(key=lambda x: (-x[0], x[1]))\nprint('V87 interrupt implementation candidates:')\nfor score, path, s in hits[:30]:\n    print(f'  score={score:02d} {path}')\n\nfor score, path, s in hits[:8]:\n    print('\\n===== IRQ CONTEXT:', path, 'score', score, '=====')\n    shown = False\n    for term in terms:\n        idx = s.find(term)\n        if idx >= 0:\n            print('--- term:', term, '---')\n            print(s[max(0, idx-900):idx+1800])\n            shown = True\n            break\n    if not shown:\n        print('no context printed')\nPY_V87_IRQ_AUDIT\n\necho \"V87 lock/audit OK: build will keep V85 and not patch interrupts yet\" | tee -a ../setup.log\n"
    - name: Patch V88 proc interrupts desc kstat arch timer display sync
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== PATCH V88 /PROC/INTERRUPTS DESC KSTAT ARCH_TIMER DISPLAY SYNC =====\" | tee -a ../setup.log\necho \"V87 audit found the real path in kernel/irq/proc.c: show_interrupts() prints desc->kstat_irqs via per_cpu_ptr(). V88 wraps that display expression only for arch_timer/arch_mem_timer. No irq accounting core, scheduler core, MONOTONIC/RAW/timekeeping changes.\" | tee -a ../setup.log\n\npython3 - <<'PY_V88_PROC_INTERRUPTS_DESC_KSTAT' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\np = Path('kernel/irq/proc.c')\nif not p.exists():\n    raise SystemExit('ERROR: kernel/irq/proc.c not found')\n\ns = p.read_text(errors='ignore')\n\nfor inc in ['<linux/ghost_uptime.h>', '<linux/string.h>', '<linux/limits.h>']:\n    if inc not in s:\n        incs = list(re.finditer(r'^#include\\s+<[^>]+>\\s*$', s, flags=re.M))\n        pos = incs[-1].end() if incs else 0\n        s = s[:pos] + '\\n#include ' + inc + s[pos:]\n\nmarker = 'Vili CI V88: /proc/interrupts desc kstat arch_timer display sync'\nif marker not in s:\n    pos = s.find('int show_interrupts(struct seq_file *p, void *v)')\n    if pos < 0:\n        pos = s.find('int show_interrupts')\n    if pos < 0:\n        raise SystemExit('ERROR: cannot find show_interrupts in kernel/irq/proc.c')\n\n    helper_lines = [\n        '/* Vili CI V88: /proc/interrupts desc kstat arch_timer display sync.',\n        ' * Display-only: keep real interrupt counters internally, but avoid exposing',\n        ' * tiny real-session arch_timer interrupt counts next to fake multi-day uptime.',\n        ' */',\n        'static unsigned int ghost_uptime_proc_interrupt_desc_count(unsigned int cpu,',\n        '                                                             struct irq_desc *desc,',\n        '                                                             unsigned int base)',\n        '{',\n        '        u64 off = ghost_uptime_offset_sec();',\n        '        u64 add = 0;',\n        '        struct irqaction *act;',\n        '',\n        '        if (!off || !desc)',\n        '                return base;',\n        '',\n        '        for (act = desc->action; act; act = act->next) {',\n        '                if (!act->name)',\n        '                        continue;',\n        '',\n        '                if (strstr(act->name, \"arch_timer\")) {',\n        '                        add = off * 40ULL;',\n        '                        break;',\n        '                }',\n        '',\n        '                if (strstr(act->name, \"arch_mem_timer\")) {',\n        '                        add = off * 4ULL;',\n        '                        break;',\n        '                }',\n        '        }',\n        '',\n        '        if (!add)',\n        '                return base;',\n        '',\n        '        add += (u64)cpu * 131ULL;',\n        '',\n        '        if (add > (u64)UINT_MAX - base)',\n        '                return UINT_MAX;',\n        '',\n        '        return base + (unsigned int)add;',\n        '}',\n        '',\n        '',\n    ]\n    s = s[:pos] + '\\n'.join(helper_lines) + s[pos:]\n\ncall = 'ghost_uptime_proc_interrupt_desc_count(j, desc,'\nif call not in s:\n    pat = re.compile(r'seq_printf\\(p,\\s*\"%10u\\s*\",\\s*desc->kstat_irqs\\s*\\?\\s*\\*per_cpu_ptr\\(desc->kstat_irqs,\\s*j\\)\\s*:\\s*0\\s*\\);', re.S)\n    new_expr = 'seq_printf(p, \"%10u \", ghost_uptime_proc_interrupt_desc_count(j, desc, desc->kstat_irqs ? *per_cpu_ptr(desc->kstat_irqs, j) : 0));'\n    m = pat.search(s)\n    if not m:\n        idx = s.find('desc->kstat_irqs')\n        if idx >= 0:\n            print('===== V88 CONTEXT AROUND desc->kstat_irqs =====')\n            print(s[max(0, idx-1000):idx+1600])\n        raise SystemExit('ERROR: cannot find desc->kstat_irqs / per_cpu_ptr output expression')\n    s = s[:m.start()] + new_expr + s[m.end():]\n\nif marker not in s:\n    raise SystemExit('ERROR: V88 helper marker missing')\nif call not in s:\n    raise SystemExit('ERROR: V88 output wrapper missing')\nif 'strstr(act->name,\
        \ \"arch_timer\")' not in s:\n    raise SystemExit('ERROR: V88 arch_timer match missing')\nif 'strstr(act->name, \"arch_mem_timer\")' not in s:\n    raise SystemExit('ERROR: V88 arch_mem_timer match missing')\n\np.write_text(s)\nprint('Patched kernel/irq/proc.c: V88 desc->kstat_irqs arch_timer /proc/interrupts display sync')\nPY_V88_PROC_INTERRUPTS_DESC_KSTAT\n\necho \"===== V88 VERIFY SOURCE =====\" | tee -a ../setup.log\ngrep -RnsE 'Vili CI V88|ghost_uptime_proc_interrupt_desc_count|arch_timer|arch_mem_timer|desc->kstat_irqs|per_cpu_ptr\\(desc->kstat_irqs' kernel/irq/proc.c 2>/dev/null | head -260 | tee -a ../setup.log || true\nif ! grep -q 'ghost_uptime_proc_interrupt_desc_count(j, desc,' kernel/irq/proc.c; then\n  echo \"ERROR: V88 output wrapper missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'strstr(act->name, \"arch_timer\")' kernel/irq/proc.c; then\n  echo \"ERROR: V88 arch_timer match missing\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"===== VERIFY V85 STILL PRESENT AFTER V88 =====\" | tee -a ../setup.log\nif ! grep -Rqs 'ghost_uptime_proc_softirq_count(i, j, kstat_softirqs_cpu(i, j))' fs/proc/softirqs.c; then\n  echo \"ERROR: V85 softirqs replacement missing after V88\" | tee -a ../setup.log\n  exit 1\nfi\necho \"V88 /proc/interrupts desc-kstat arch_timer display sync patch OK; V85 still locked\" | tee -a ../setup.log\n"
    - name: V89 post V88 deep source audit only
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V89 POST-V88 DEEP SOURCE AUDIT ONLY =====\" | tee -a ../setup.log\necho \"V89 adds no new kernel time patch. It locks V80/V82/V85/V88 source markers and audits remaining surfaces for a later V90 if a clear leak remains.\" | tee -a ../setup.log\n\necho \"===== V89 REQUIRED MARKER CHECK =====\" | tee -a ../setup.log\ndeclare -a REQUIRED=(\n  \"fs/proc/uptime.c:Vili CI V80\"\n  \"fs/proc/stat.c:Vili CI V82\"\n  \"fs/proc/softirqs.c:Vili CI V85\"\n  \"kernel/irq/proc.c:Vili CI V88\"\n)\nfor item in \"${REQUIRED[@]}\"; do\n  file=\"${item%%:*}\"\n  marker=\"${item#*:}\"\n  echo \"-- checking $file :: $marker\" | tee -a ../setup.log\n  if ! grep -q \"$marker\" \"$file\"; then\n    echo \"ERROR: required marker missing: $file :: $marker\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\necho \"V89 marker lock OK: V80/V82/V85/V88 all present\" | tee -a ../setup.log\n\necho \"===== V89 SOURCE MARKER CONTEXT =====\" | tee -a ../setup.log\ngrep -RnsE 'Vili CI V80|ghost_uptime_offset_sec|idle.tv_sec|seq_printf' fs/proc/uptime.c 2>/dev/null | head -120 | tee -a ../setup.log || true\ngrep -RnsE 'Vili CI V82|ghost_uptime_proc_stat_idle_clock_t|nsec_to_clock_t\\(idle\\)|num_possible_cpus' fs/proc/stat.c 2>/dev/null | head -180 | tee -a ../setup.log || true\ngrep -RnsE 'Vili CI V85|ghost_uptime_proc_softirq_count|TIMER_SOFTIRQ|SCHED_SOFTIRQ|RCU_SOFTIRQ|kstat_softirqs_cpu' fs/proc/softirqs.c 2>/dev/null | head -180 | tee -a ../setup.log || true\ngrep -RnsE 'Vili CI V88|ghost_uptime_proc_interrupt_desc_count|arch_timer|arch_mem_timer|desc->kstat_irqs|per_cpu_ptr\\(desc->kstat_irqs' kernel/irq/proc.c 2>/dev/null | head -220 | tee -a ../setup.log || true\n\necho \"===== V89 REMAINING SOURCE SURFACE LOCATOR =====\" | tee -a ../setup.log\npython3 - <<'PY_V89_SOURCE_AUDIT' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\ngroups = {\n    'schedstat': ['kernel/sched/stats.c', 'kernel/sched/debug.c', 'kernel/sched/core.c'],\n    'timer_list': ['kernel/time/timer_list.c', 'kernel/time/timer.c', 'kernel/time/hrtimer.c'],\n    'binder': ['drivers/android/binder.c', 'drivers/android/binderfs.c'],\n    'trace_clock': ['kernel/trace/trace.c', 'kernel/trace/trace_clock.c'],\n    'wakeup_suspend': ['kernel/power/suspend.c', 'kernel/power/wakelock.c', 'drivers/base/power/wakeup.c'],\n    'proc_misc': ['fs/proc/array.c', 'fs/proc/base.c', 'fs/proc/stat.c', 'fs/proc/uptime.c'],\n}\n\nterms = [\n    'seq_printf',\n    'seq_put_decimal_ull',\n    'ktime_get',\n    'ktime_get_boottime',\n    'ktime_get_ns',\n    'local_clock',\n    'sched_clock',\n    'jiffies',\n    'start_time',\n    'real_start_time',\n    'elapsed',\n    'uptime',\n    'timer_list',\n    'wakeup',\n    'binder',\n    'trace_clock',\n]\n\nfor group, files in groups.items():\n    print(f'===== V89 SOURCE GROUP {group} =====')\n    for rel in files:\n        p = Path(rel)\n        if not p.exists():\n            print(f'MISSING {rel}')\n            continue\n        data = p.read_text(errors='ignore')\n        hits = [t for t in terms if t in data]\n        print(f'FILE {rel} hits={\",\".join(hits[:12]) if hits else \"none\"}')\n        shown = 0\n        for t in hits[:5]:\n            idx = data.find(t)\n            if idx >= 0:\n                print(f'--- {rel} term={t} ---')\n                print(data[max(0, idx-500):idx+900])\n                shown += 1\n                if shown >= 3:\n                    break\nPY_V89_SOURCE_AUDIT\n\necho \"===== V89 AUDIT DECISION =====\" | tee -a ../setup.log\necho \"V89 intentionally does not patch dumpsys alarm/framework Runtime uptime or global MONOTONIC/RAW paths.\" | tee -a ../setup.log\necho \"V89 source audit OK\" | tee -a ../setup.log\n"
    - name: V90 core clock stubbornness source audit only
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V90 CORE CLOCK STUBBORNNESS SOURCE AUDIT ONLY =====\" | tee -a ../setup.log\necho \"V90 adds no new risky core time patch. It locates CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, ktime_get*, sched_clock, clocksource/vDSO paths and locks V80/V82/V85/V88 markers.\" | tee -a ../setup.log\n\necho \"===== V90 REQUIRED MARKER LOCK =====\" | tee -a ../setup.log\nfor spec in             \"fs/proc/uptime.c:Vili CI V80\"             \"fs/proc/stat.c:Vili CI V82\"             \"fs/proc/softirqs.c:Vili CI V85\"             \"kernel/irq/proc.c:Vili CI V88\"\ndo\n  file=\"${spec%%:*}\"\n  marker=\"${spec#*:}\"\n  echo \"-- checking $file :: $marker\" | tee -a ../setup.log\n  if ! grep -q \"$marker\" \"$file\"; then\n    echo \"ERROR: required marker missing: $file :: $marker\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\necho \"V90 marker lock OK: V80/V82/V85/V88 all present\" | tee -a ../setup.log\n\npython3 - <<'PY_V90_CORE_CLOCK_AUDIT' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\nfiles = [\n    'kernel/time/timekeeping.c',\n    'kernel/time/posix-timers.c',\n    'kernel/time/hrtimer.c',\n    'kernel/time/timer.c',\n    'kernel/time/timer_list.c',\n    'kernel/sched/clock.c',\n    'kernel/sched/core.c',\n    'kernel/sched/fair.c',\n    'kernel/printk/printk.c',\n    'kernel/trace/trace_clock.c',\n    'arch/arm64/kernel/vdso.c',\n    'arch/arm64/kernel/vdso/vgettimeofday.c',\n    'arch/arm64/kernel/time.c',\n    'drivers/clocksource/arm_arch_timer.c',\n]\n\nterms = [\n    'ktime_get',\n    'ktime_get_ns',\n    'ktime_get_ts64',\n    'ktime_get_raw',\n    'ktime_get_raw_ts64',\n    'ktime_get_boottime',\n    'CLOCK_MONOTONIC',\n    'CLOCK_MONOTONIC_RAW',\n    'sched_clock',\n    'local_clock',\n    'vdso',\n    'vgettimeofday',\n    'clocksource',\n    'cyclecounter',\n    'timekeeping_get_ns',\n    'tk_core',\n    'tk_read_base',\n    'hrtimer',\n    'timer_list',\n]\n\nfor rel in files:\n    p = Path(rel)\n    print('\\n===== V90 CORE FILE', rel, '=====')\n    if not p.exists():\n        print('MISSING')\n        continue\n    data = p.read_text(errors='ignore')\n    hits = [t for t in terms if t in data]\n    print('hits=' + (','.join(hits) if hits else 'none'))\n    shown = 0\n    for t in hits:\n        start = 0\n        while True:\n            idx = data.find(t, start)\n            if idx < 0:\n                break\n            print(f'--- term={t} offset={idx} ---')\n            print(data[max(0, idx-650):idx+1300])\n            shown += 1\n            start = idx + len(t)\n            if shown >= 8:\n                break\n        if shown >= 8:\n            break\n\nprint('\\n===== V90 CORE CLOCK PATCH RISK MAP =====')\nprint('ktime_get/ktime_get_ns: highest risk; used by timers, hrtimers, scheduler-visible timing, driver deadlines.')\nprint('CLOCK_MONOTONIC: usually served by timekeeping/vDSO; touching core can break alarms, binder, SurfaceFlinger, ART, watchdog timing.')\nprint('CLOCK_MONOTONIC_RAW: lower framework use but used by profiling/perf/trace/jitter checks; still not safe if global.')\nprint('sched_clock/local_clock: printk/scheduler/trace hot path; offset discontinuities can trigger warnings or bad ordering.')\nprint('Preferred next experiment: runtime check first; if patching, patch one narrow exported read/display path, never all four at once.')\nPY_V90_CORE_CLOCK_AUDIT\n\necho \"V90 core clock stubbornness source audit OK\" | tee -a ../setup.log\n"
    - name: Patch V91A POSIX syscall monotonic raw probe only
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== PATCH V91A POSIX SYSCALL MONOTONIC/RAW PROBE ONLY =====\" | tee -a ../setup.log\necho \"V91A patches only kernel/time/posix-timers.c clock_gettime syscall helpers for CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, and CLOCK_MONOTONIC_COARSE. It does not patch global ktime_get(), ktime_get_ns(), sched_clock(), local_clock(), hrtimer core, timer core, or vDSO.\" | tee -a ../setup.log\n\npython3 - <<'PY_V91A_POSIX_CLOCK_SYSCALL' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\np = Path('kernel/time/posix-timers.c')\nif not p.exists():\n    raise SystemExit('ERROR: kernel/time/posix-timers.c not found')\n\ns = p.read_text(errors='ignore')\n\nif '<linux/ghost_uptime.h>' not in s:\n    incs = list(re.finditer(r'^#include\\s+<[^>]+>\\s*$', s, flags=re.M))\n    pos = incs[-1].end() if incs else 0\n    s = s[:pos] + '\\n#include <linux/ghost_uptime.h>' + s[pos:]\n\nhelper_marker = 'Vili CI V91A: POSIX syscall-only clock_gettime offset helper'\nif helper_marker not in s:\n    insert_pos = s.find('/* Get clock_realtime */')\n    if insert_pos < 0:\n        insert_pos = s.find('static int posix_clock_realtime_get')\n    if insert_pos < 0:\n        raise SystemExit('ERROR: cannot find helper insertion point in posix-timers.c')\n    helper_lines = [\n        '/* Vili CI V91A: POSIX syscall-only clock_gettime offset helper.',\n        ' * This deliberately affects only kernel syscall clock_gettime helpers.',\n        ' * It does not change global ktime_get(), hrtimer, scheduler, or vDSO state.',\n        ' */',\n        'static inline void ghost_uptime_posix_clock_ts64(struct timespec64 *tp)',\n        '{',\n        '        u64 off = ghost_uptime_offset_sec();',\n        '',\n        '        if (!tp || !off)',\n        '                return;',\n        '',\n        '        tp->tv_sec += (time64_t)off;',\n        '}',\n        '',\n        '',\n    ]\n    s = s[:insert_pos] + '\\n'.join(helper_lines) + s[insert_pos:]\n\ndef patch_func(txt, func_name, marker):\n    start = txt.find('static int ' + func_name)\n    if start < 0:\n        raise SystemExit('ERROR: cannot find ' + func_name)\n    brace = txt.find('{', start)\n    if brace < 0:\n        raise SystemExit('ERROR: cannot find opening brace for ' + func_name)\n    depth = 0\n    end = -1\n    for i in range(brace, len(txt)):\n        if txt[i] == '{':\n            depth += 1\n        elif txt[i] == '}':\n            depth -= 1\n            if depth == 0:\n                end = i + 1\n                break\n    if end < 0:\n        raise SystemExit('ERROR: cannot find closing brace for ' + func_name)\n    body = txt[start:end]\n    if marker in body:\n        return txt\n    m = re.search(r'(\\bktime_get[^;]*\\(tp\\);\\s*)', body)\n    if not m:\n        print(body)\n        raise SystemExit('ERROR: cannot find ktime_get*(tp); call in ' + func_name)\n    add = m.group(1) + '\\t/* ' + marker + ' */\\n\\tghost_uptime_posix_clock_ts64(tp);\\n'\n    body2 = body[:m.start()] + add + body[m.end():]\n    return txt[:start] + body2 + txt[end:]\n\ns = patch_func(s, 'posix_ktime_get_ts', 'Vili CI V91A: shift POSIX CLOCK_MONOTONIC syscall result')\ns = patch_func(s, 'posix_get_monotonic_raw', 'Vili CI V91A: shift POSIX CLOCK_MONOTONIC_RAW syscall result')\ns = patch_func(s, 'posix_get_monotonic_coarse', 'Vili CI V91A: shift POSIX CLOCK_MONOTONIC_COARSE syscall result')\n\nfor r in [\n    'ghost_uptime_posix_clock_ts64(tp);',\n    'Vili CI V91A: shift POSIX CLOCK_MONOTONIC syscall result',\n    'Vili CI V91A: shift POSIX CLOCK_MONOTONIC_RAW syscall result',\n    'Vili CI V91A: shift POSIX CLOCK_MONOTONIC_COARSE syscall result',\n]:\n    if r not in s:\n        raise SystemExit('ERROR: missing required V91A marker: ' + r)\n\np.write_text(s)\nprint('Patched kernel/time/posix-timers.c: V91A POSIX syscall-only MONOTONIC/RAW/COARSE probe')\nPY_V91A_POSIX_CLOCK_SYSCALL\n\necho \"===== V91A VERIFY SOURCE =====\" | tee -a ../setup.log\ngrep -RnsE 'Vili CI V91A|ghost_uptime_posix_clock_ts64|posix_ktime_get_ts|posix_get_monotonic_raw|posix_get_monotonic_coarse'\
        \ kernel/time/posix-timers.c 2>/dev/null | head -220 | tee -a ../setup.log || true\nif grep -Rqs 'Vili CI V91A' kernel/time/timekeeping.c kernel/sched kernel/time/hrtimer.c kernel/time/timer.c arch/arm64 2>/dev/null; then\n  echo \"ERROR: V91A marker leaked into forbidden core/vDSO files\" | tee -a ../setup.log\n  exit 1\nfi\necho \"V91A POSIX syscall-only monotonic/raw probe patch OK\" | tee -a ../setup.log\n"
    - name: V91B locate arm64 vDSO clock fast path only
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V91B LOCATE ARM64 VDSO CLOCK FAST PATH ONLY =====\" | tee -a ../setup.log\necho \"V91A booted but logcat -v monotonic stayed real-runtime. V91B does not patch vDSO yet. It locates vdso_data/update_vsyscall/__cvdso_clock_gettime paths so V92 can patch a precise point instead of guessing.\" | tee -a ../setup.log\n\necho \"===== V91B REQUIRED OLD MARKER LOCK =====\" | tee -a ../setup.log\nfor spec in             \"fs/proc/uptime.c:Vili CI V80\"             \"fs/proc/stat.c:Vili CI V82\"             \"fs/proc/softirqs.c:Vili CI V85\"             \"kernel/irq/proc.c:Vili CI V88\"\ndo\n  file=\"${spec%%:*}\"\n  marker=\"${spec#*:}\"\n  echo \"-- checking $file :: $marker\" | tee -a ../setup.log\n  if ! grep -q \"$marker\" \"$file\"; then\n    echo \"ERROR: required marker missing: $file :: $marker\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\necho \"V91B old marker lock OK\" | tee -a ../setup.log\n\necho \"===== V91B OPTIONAL V91A MARKER CHECK =====\" | tee -a ../setup.log\nif grep -Rqs 'Vili CI V91A' kernel/time/posix-timers.c 2>/dev/null; then\n  echo \"V91A POSIX syscall probe marker is present\" | tee -a ../setup.log\n  grep -RnsE 'Vili CI V91A|ghost_uptime_posix_clock_ts64|posix_ktime_get_ts|posix_get_monotonic_raw|posix_get_monotonic_coarse' kernel/time/posix-timers.c 2>/dev/null | head -160 | tee -a ../setup.log || true\nelse\n  echo \"V91A marker not present; V91B can still audit vDSO source\" | tee -a ../setup.log\nfi\n\npython3 - <<'PY_V91B_VDSO_LOCATOR' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\nroots = [\n    Path('arch/arm64/kernel'),\n    Path('arch/arm64/include'),\n    Path('lib/vdso'),\n    Path('include/vdso'),\n    Path('include/linux'),\n    Path('kernel/time'),\n]\n\nterms = [\n    'update_vsyscall',\n    'vdso_data',\n    'vdso_time_data',\n    'basetime',\n    'tk_read_base',\n    'tkr_mono',\n    'tkr_raw',\n    'clock_mode',\n    'cycle_last',\n    'mask',\n    'mult',\n    'shift',\n    '__cvdso_clock_gettime',\n    '__kernel_clock_gettime',\n    'CLOCK_MONOTONIC',\n    'CLOCK_MONOTONIC_RAW',\n    'CLOCK_BOOTTIME',\n    'VDSO_CLOCKMODE',\n    'vgettimeofday',\n    'tk_core',\n]\n\ncandidates = []\nfor root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*'):\n        if not p.is_file():\n            continue\n        if p.suffix not in ['.c', '.h', '.S', '.lds']:\n            continue\n        try:\n            s = p.read_text(errors='ignore')\n        except Exception:\n            continue\n        score = 0\n        for t in terms:\n            if t in s:\n                score += 1\n        if 'update_vsyscall' in s:\n            score += 8\n        if '__cvdso_clock_gettime' in s:\n            score += 8\n        if 'vdso_data' in s and 'basetime' in s:\n            score += 8\n        if 'CLOCK_MONOTONIC_RAW' in s:\n            score += 3\n        if score:\n            candidates.append((score, str(p), s))\n\ncandidates.sort(key=lambda x: (-x[0], x[1]))\nprint('V91B vDSO/clock candidate files:')\nfor score, path, s in candidates[:60]:\n    print(f'  score={score:02d} {path}')\n\nfor score, path, s in candidates[:15]:\n    print('\\n===== V91B CONTEXT:', path, 'score', score, '=====')\n    shown = 0\n    for term in terms:\n        start = 0\n        while True:\n            idx = s.find(term, start)\n            if idx < 0:\n                break\n            print(f'--- term={term} offset={idx} ---')\n            print(s[max(0, idx-900):idx+1800])\n            shown += 1\n            start = idx + len(term)\n            if shown >= 4:\n                break\n        if shown >= 4:\n            break\n\nprint('\\n===== V91B DECISION NOTES =====')\nprint('If update_vsyscall/vdso_data basetime exists, V92 should patch the kernel-side vdso_data update, not the user vDSO blob.')\nprint('If only lib/vdso/gettimeofday.c has __cvdso_clock_gettime, adding ghost_uptime_offset_sec() there is invalid because vDSO cannot call kernel helpers directly.')\nprint('Do not patch global ktime_get or sched_clock\
        \ from this step.')\nPY_V91B_VDSO_LOCATOR\n\necho \"V91B vDSO fast path locator OK; no vDSO patch applied yet\" | tee -a ../setup.log\n"
    - name: V111 enforce full V101 vDSO rollback
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V111 SAFETY LOCK: KEEP BOTH VDSO FILES PRISTINE =====\" | tee -a ../setup.log\necho \"Retain the boot-confirmed V104/V105 vDSO rollback; V111 does not change either vDSO file.\" | tee -a ../setup.log\n\nfor file in lib/vdso/gettimeofday.c kernel/time/vsyscall.c; do\n  HEAD_BLOB=\"$(git rev-parse \"HEAD:${file}\")\"\n  WORK_BLOB=\"$(git hash-object \"$file\")\"\n  echo \"$file HEAD=${HEAD_BLOB} WORK=${WORK_BLOB}\" | tee -a ../setup.log\n  if [ \"$HEAD_BLOB\" != \"$WORK_BLOB\" ]; then\n    echo \"ERROR: V111 requires pristine source for $file\" | tee -a ../setup.log\n    git diff -- \"$file\" | tee -a ../setup.log || true\n    exit 1\n  fi\ndone\n\nprintf '%s  %s\\n' \\\n  66e04000c62e078883df4b4f0b48c913e1342cc5ffc76d88e51d59d0d8309c07 \\\n  lib/vdso/gettimeofday.c | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \\\n  e14f82fd54042e80cda5dc161368fead68cfdf9a47e7fd6492b6268f0be70bf8 \\\n  kernel/time/vsyscall.c | sha256sum -c - | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: an experimental vDSO marker remains in V111\" | tee -a ../setup.log\n  grep -RnsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c | tee -a ../setup.log || true\n  exit 1\nfi\n\necho \"V111 vDSO rollback verified: no vDSO experiment is compiled\" | tee -a ../setup.log\n"
    - name: Apply complete official Xiaomi vili MI2S ABI audio fix2
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V111 AUDIO PASS LOCK: RETAIN COMPLETE OFFICIAL VILI MI2S ABI =====\" | tee -a ../setup.log\necho \"Transplant the MI2S driver ABI and remap only the 12 lahaina MI2S machine-link CPU IDs.\" | tee -a ../setup.log\necho \"vDSO and every ghost-uptime source file remain unchanged by this step.\" | tee -a ../setup.log\necho \"Official Xiaomi source commit: ${AUDIO_COMPAT_SOURCE_COMMIT}\" | tee -a ../setup.log\n\nAUDIO_C=\"techpack/audio/asoc/msm-dai-q6-v2.c\"\nAUDIO_H=\"techpack/audio/asoc/msm-dai-q6-v2.h\"\nAUDIO_DAILINK=\"techpack/audio/asoc/msm_dailink.h\"\nEXPECTED_REPO_C_SHA256=\"a51120d409082aac81ea65d85d64b4e9971a4e99ae9f64ce9876a63236e25660\"\nEXPECTED_REPO_H_SHA256=\"c3df76f160c696dfab964936608dd01e6f3110551eb8d42aae971dbe3494b6a4\"\nEXPECTED_REPO_DAILINK_SHA256=\"89884c9e2af53832190ec8068a0b804e6ad9b91d155f4e6534193fc874c9b2c8\"\n\ntest -f \"$AUDIO_C\"\ntest -f \"$AUDIO_H\"\ntest -f \"$AUDIO_DAILINK\"\nprintf '%s  %s\\n' \"$EXPECTED_REPO_C_SHA256\" \"$AUDIO_C\" | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \"$EXPECTED_REPO_H_SHA256\" \"$AUDIO_H\" | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \"$EXPECTED_REPO_DAILINK_SHA256\" \"$AUDIO_DAILINK\" | sha256sum -c - | tee -a ../setup.log\n\nif ! grep -q 'qcom,msm-mi2s-lines' \"$AUDIO_C\"; then\n  echo \"ERROR: pinned kernel source no longer has the split MI2S driver ABI seen in V100B\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'msm-dai-q6-mi2s.11' \"$AUDIO_DAILINK\"; then\n  echo \"ERROR: pinned machine-link source no longer has split MI2S CPU IDs 0-11\" | tee -a ../setup.log\n  exit 1\nfi\n\nAUDIO_TMP=\"$(mktemp -d)\"\ntrap 'rm -rf \"$AUDIO_TMP\"' EXIT\nAUDIO_BASE_URL=\"https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/${AUDIO_COMPAT_SOURCE_COMMIT}/techpack/audio/asoc\"\n\ncurl --fail --location --retry 5 --retry-delay 2 \\\n  \"${AUDIO_BASE_URL}/msm-dai-q6-v2.c\" \\\n  --output \"$AUDIO_TMP/msm-dai-q6-v2.c\"\ncurl --fail --location --retry 5 --retry-delay 2 \\\n  \"${AUDIO_BASE_URL}/msm-dai-q6-v2.h\" \\\n  --output \"$AUDIO_TMP/msm-dai-q6-v2.h\"\ncurl --fail --location --retry 5 --retry-delay 2 \\\n  \"${AUDIO_BASE_URL}/msm_dailink.h\" \\\n  --output \"$AUDIO_TMP/msm_dailink.h\"\n\nprintf '%s  %s\\n' \"$AUDIO_UPSTREAM_C_SHA256\" \"$AUDIO_TMP/msm-dai-q6-v2.c\" | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \"$AUDIO_UPSTREAM_H_SHA256\" \"$AUDIO_TMP/msm-dai-q6-v2.h\" | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \"$AUDIO_UPSTREAM_DAILINK_SHA256\" \"$AUDIO_TMP/msm_dailink.h\" | sha256sum -c - | tee -a ../setup.log\n\npython3 - \"$AUDIO_C\" \"$AUDIO_H\" \"$AUDIO_DAILINK\" \\\n  \"$AUDIO_TMP/msm-dai-q6-v2.c\" \"$AUDIO_TMP/msm-dai-q6-v2.h\" \"$AUDIO_TMP/msm_dailink.h\" \\\n  \"$AUDIO_TMP/msm-dai-q6-v2-hybrid.c\" \"$AUDIO_TMP/msm-dai-q6-v2-hybrid.h\" \\\n  \"$AUDIO_TMP/msm_dailink-hybrid.h\" <<'PY_AUDIO_ABI'\nfrom pathlib import Path\nimport re\nimport sys\n\n(current_c_path, current_h_path, current_dailink_path,\n official_c_path, official_h_path, official_dailink_path,\n out_c_path, out_h_path, out_dailink_path) = map(Path, sys.argv[1:])\ncurrent_c = current_c_path.read_text()\ncurrent_h = current_h_path.read_text()\ncurrent_dailink = current_dailink_path.read_text()\nofficial_c = official_c_path.read_text()\nofficial_h = official_h_path.read_text()\nofficial_dailink = official_dailink_path.read_text()\n\ndef transplant(dst, src, dst_start, src_start, dst_end, src_end, label):\n    ds = dst.find(dst_start)\n    de = dst.find(dst_end, ds + len(dst_start))\n    ss = src.find(src_start)\n    se = src.find(src_end, ss + len(src_start))\n    if min(ds, de, ss, se) < 0:\n        raise SystemExit(f'ERROR: missing audio transplant anchor for {label}')\n    checks = (\n        (dst, dst_start, 'destination start'),\n        (dst, dst_end, 'destination end'),\n        (src, src_start, 'official start'),\n        (src, src_end, 'official end'),\n    )\n    for text, marker, side in checks:\n        if text.count(marker) != 1:\n            raise SystemExit(f'ERROR:\
        \ non-unique {side} anchor for {label}: {text.count(marker)}')\n    return dst[:ds] + src[ss:se] + dst[de:]\n\nhybrid_c = transplant(\n    current_c, official_c,\n    'struct msm_dai_q6_mi2s_dai_data {',\n    'struct msm_dai_q6_mi2s_dai_data {',\n    'struct msm_dai_q6_meta_mi2s_dai_data {',\n    'struct msm_dai_q6_meta_mi2s_dai_data {',\n    'MI2S runtime data structure')\nhybrid_c = transplant(\n    hybrid_c, official_c,\n    'static int msm_dai_q6_dai_mi2s_probe(',\n    'static int msm_dai_q6_dai_mi2s_probe(',\n    'static int msm_dai_q6_mi2s_dev_remove(',\n    'static int msm_dai_q6_mi2s_dev_remove(',\n    'MI2S driver implementation')\nhybrid_h = transplant(\n    current_h, official_h,\n    '#define MSM_PRIM_MI2S_RX 0',\n    '#define MSM_PRIM_MI2S 0',\n    '#define MSM_DISPLAY_PORT\\t0',\n    '#define MSM_DISPLAY_PORT\\t0',\n    'MI2S interface IDs')\nhybrid_h = transplant(\n    hybrid_h, official_h,\n    'struct msm_mi2s_pdata {',\n    'struct msm_mi2s_pdata {',\n    'struct msm_meta_mi2s_pdata {',\n    'struct msm_meta_mi2s_pdata {',\n    'MI2S platform data')\n\nexpected_ids = {\n    'pri_mi2s_rx': 0, 'pri_mi2s_tx': 0,\n    'sec_mi2s_rx': 1, 'sec_mi2s_tx': 1,\n    'tert_mi2s_rx': 2, 'tert_mi2s_tx': 2,\n    'quat_mi2s_rx': 3, 'quat_mi2s_tx': 3,\n    'quin_mi2s_rx': 4, 'quin_mi2s_tx': 4,\n    'sen_mi2s_rx': 5, 'sen_mi2s_tx': 5,\n}\nexpected_counts = {name: 1 for name in expected_ids}\nexpected_counts['pri_mi2s_rx'] = 2\nexpected_counts['tert_mi2s_rx'] = 2\nstart_re = re.compile(r'^SND_SOC_DAILINK_DEFS\\(([a-z0-9_]+),')\ncpu_re = re.compile(r'msm-dai-q6-mi2s\\.\\d+')\n\ndef collect_ids(text):\n    found = {name: [] for name in expected_ids}\n    active = None\n    for line in text.splitlines():\n        match = start_re.match(line)\n        if match:\n            active = match.group(1) if match.group(1) in expected_ids else None\n        if active:\n            cpu = re.search(r'COMP_CPU\\(\"msm-dai-q6-mi2s\\.(\\d+)\"\\)', line)\n            if cpu:\n                found[active].append(int(cpu.group(1)))\n    return found\n\nofficial_ids = collect_ids(official_dailink)\nfor name, expected_id in expected_ids.items():\n    if not official_ids[name] or set(official_ids[name]) != {expected_id}:\n        raise SystemExit(\n            f'ERROR: official vili mapping mismatch for {name}: {official_ids[name]}')\n\nseen = {name: 0 for name in expected_ids}\nactive = None\noutput_lines = []\nfor line in current_dailink.splitlines(keepends=True):\n    match = start_re.match(line)\n    if match:\n        active = match.group(1) if match.group(1) in expected_ids else None\n    if active and 'COMP_CPU(\"msm-dai-q6-mi2s.' in line:\n        line, count = cpu_re.subn(\n            f'msm-dai-q6-mi2s.{expected_ids[active]}', line)\n        if count != 1:\n            raise SystemExit(\n                f'ERROR: bad machine-link replacement count for {active}: {count}')\n        seen[active] += 1\n    output_lines.append(line)\nif seen != expected_counts:\n    raise SystemExit(\n        f'ERROR: machine-link definition counts changed: {seen} != {expected_counts}')\nhybrid_dailink = ''.join(output_lines)\nfinal_ids = collect_ids(hybrid_dailink)\nfor name, expected_id in expected_ids.items():\n    if set(final_ids[name]) != {expected_id}:\n        raise SystemExit(\n            f'ERROR: final machine-link mapping mismatch for {name}: {final_ids[name]}')\n\nout_c_path.write_text(hybrid_c)\nout_h_path.write_text(hybrid_h)\nout_dailink_path.write_text(hybrid_dailink)\nprint('Official vili MI2S driver ABI and paired 0-5 machine-link mapping applied.')\nPY_AUDIO_ABI\n\nprintf '%s  %s\\n' \"$AUDIO_COMPAT_C_SHA256\" \"$AUDIO_TMP/msm-dai-q6-v2-hybrid.c\" | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \"$AUDIO_COMPAT_H_SHA256\" \"$AUDIO_TMP/msm-dai-q6-v2-hybrid.h\" | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \"$AUDIO_COMPAT_DAILINK_SHA256\" \"$AUDIO_TMP/msm_dailink-hybrid.h\" | sha256sum -c - | tee -a ../setup.log\n\ninstall -m 0644 \"$AUDIO_TMP/msm-dai-q6-v2-hybrid.c\" \"$AUDIO_C\"\ninstall -m 0644 \"$AUDIO_TMP/msm-dai-q6-v2-hybrid.h\"\
        \ \"$AUDIO_H\"\ninstall -m 0644 \"$AUDIO_TMP/msm_dailink-hybrid.h\" \"$AUDIO_DAILINK\"\n\nprintf '%s  %s\\n' \"$AUDIO_COMPAT_C_SHA256\" \"$AUDIO_C\" | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \"$AUDIO_COMPAT_H_SHA256\" \"$AUDIO_H\" | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \"$AUDIO_COMPAT_DAILINK_SHA256\" \"$AUDIO_DAILINK\" | sha256sum -c - | tee -a ../setup.log\n\ngrep -q '^#define MSM_PRIM_MI2S 0$' \"$AUDIO_H\"\ngrep -q 'u16 rx_sd_lines;' \"$AUDIO_H\"\ngrep -q 'u16 tx_sd_lines;' \"$AUDIO_H\"\ngrep -q 'qcom,msm-mi2s-rx-lines' \"$AUDIO_C\"\ngrep -q 'qcom,msm-mi2s-tx-lines' \"$AUDIO_C\"\ngrep -q 'COMP_CPU(\"msm-dai-q6-mi2s.5\")' \"$AUDIO_DAILINK\"\nif grep -qE '^#define MSM_(PRIM|SEC|TERT|QUAT|QUIN|SENARY|INT[0-6])_MI2S_(RX|TX)' \"$AUDIO_H\"; then\n  echo \"ERROR: split RX/TX MI2S ID ABI remains in the driver header\" | tee -a ../setup.log\n  exit 1\nfi\nif grep -qE 'COMP_CPU\\(\"msm-dai-q6-mi2s\\.([6-9]|1[01])\"\\)' \"$AUDIO_DAILINK\"; then\n  echo \"ERROR: split MI2S machine-link CPU IDs 6-11 remain after FIX2\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"===== AUDIO FIX2 DIFFSTAT =====\" | tee -a ../setup.log\ngit diff --stat -- \"$AUDIO_C\" \"$AUDIO_H\" \"$AUDIO_DAILINK\" | tee -a ../setup.log\necho \"Complete official vili combined-node MI2S ABI applied successfully\" | tee -a ../setup.log\n"
    - name: Retain V105 POSIX times uptime readout layer
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== RETAIN V105 POSIX times(2) UPTIME READOUT =====\" | tee -a ../setup.log\necho \"V105 booted successfully. Reapply its exact elapsed-return patch before retaining V106/V108/V109 and adding V111.\" | tee -a ../setup.log\necho \"The tms CPU-duration fields stay real; vDSO and core timekeeping stay untouched.\" | tee -a ../setup.log\n\npython3 - <<'PY_V105_TIMES'\nfrom pathlib import Path\n\npath = Path('kernel/sys.c')\ntext = path.read_text()\noriginal = text\n\ninclude = '#include <linux/ghost_uptime.h>'\ninclude_anchor = '#include <linux/times.h>'\nif include not in text:\n    if text.count(include_anchor) != 1:\n        raise SystemExit(\n            f'ERROR: V105 times include anchor count is {text.count(include_anchor)}, expected 1')\n    text = text.replace(include_anchor, include_anchor + '\\n' + include, 1)\n\nmarker = 'Vili CI V105: POSIX times(2) elapsed readout sync only.'\nhelper_anchor = 'static void do_sys_times(struct tms *tms)'\nhelper = r'''\n/*\n * Vili CI V105: POSIX times(2) elapsed readout sync only.\n * Shift only the public elapsed-time return value. The tms CPU accounting\n * fields and the kernel's internal jiffies remain untouched.\n */\nstatic u64 vili_ghost_times_jiffies(void)\n{\n\tu64 now = get_jiffies_64();\n\tu64 off_sec = ghost_uptime_offset_sec();\n\n\tif (!off_sec)\n\t\treturn now;\n\tif (off_sec > div_u64(~0ULL - now, HZ))\n\t\treturn ~0ULL;\n\treturn now + off_sec * HZ;\n}\n\nstatic long vili_ghost_times_clock_t(void)\n{\n\tu64 ticks = jiffies_64_to_clock_t(vili_ghost_times_jiffies());\n\n\tif (ticks > LONG_MAX)\n\t\treturn LONG_MAX;\n\treturn (long)ticks;\n}\n\n'''\nif marker not in text:\n    if text.count(helper_anchor) != 1:\n        raise SystemExit(\n            f'ERROR: V105 times helper anchor count is {text.count(helper_anchor)}, expected 1')\n    text = text.replace(helper_anchor, helper + helper_anchor, 1)\n\nnative_old = 'return (long) jiffies_64_to_clock_t(get_jiffies_64());'\nnative_new = 'return vili_ghost_times_clock_t();'\nif native_new not in text:\n    if text.count(native_old) != 1:\n        raise SystemExit(\n            f'ERROR: V105 native times return count is {text.count(native_old)}, expected 1')\n    text = text.replace(native_old, native_new, 1)\n\ncompat_old = 'return compat_jiffies_to_clock_t(jiffies);'\ncompat_new = 'return compat_jiffies_to_clock_t(vili_ghost_times_jiffies());'\nif compat_new not in text:\n    if text.count(compat_old) != 1:\n        raise SystemExit(\n            f'ERROR: V105 compat times return count is {text.count(compat_old)}, expected 1')\n    text = text.replace(compat_old, compat_new, 1)\n\nrequired = (\n    include,\n    marker,\n    'static u64 vili_ghost_times_jiffies(void)',\n    native_new,\n    compat_new,\n)\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete retained V105 times layer: {missing}')\nif text == original:\n    raise SystemExit('ERROR: retained V105 times layer made no source change')\npath.write_text(text)\nprint('Retained V105 POSIX times(2) readout layer for native and compat tasks.')\nPY_V105_TIMES\n\ngit diff --check -- kernel/sys.c\ngrep -nE 'Vili CI V105|vili_ghost_times|SYSCALL_DEFINE1\\(times' kernel/sys.c | tee -a ../setup.log\n"
    - name: Apply V106 sysinfo uptime readout layer
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V106 sysinfo(2) UPTIME READOUT =====\" | tee -a ../setup.log\necho \"Starting point: V105 boot PASS. Change one read-only field in kernel/sys.c.\" | tee -a ../setup.log\necho \"Only struct sysinfo.uptime receives the existing random ghost offset.\" | tee -a ../setup.log\necho \"Load averages, process count, RAM/swap, vDSO, clocks, scheduler and CPU accounting remain unchanged.\" | tee -a ../setup.log\n\npython3 - <<'PY_V106_SYSINFO'\nfrom pathlib import Path\n\npath = Path('kernel/sys.c')\ntext = path.read_text()\noriginal = text\n\nif '#include <linux/ghost_uptime.h>' not in text:\n    raise SystemExit('ERROR: V105 ghost_uptime include is missing from kernel/sys.c')\nif 'Vili CI V105: POSIX times(2) elapsed readout sync only.' not in text:\n    raise SystemExit('ERROR: V105 POSIX times layer is missing before V106')\n\nmarker = 'Vili CI V106: sysinfo(2) uptime readout sync only.'\nhelper_anchor = '''/**\n * do_sysinfo - fill in sysinfo struct\n * @info: pointer to buffer to fill\n */\nstatic int do_sysinfo(struct sysinfo *info)'''\nhelper = r'''\n/*\n * Vili CI V106: sysinfo(2) uptime readout sync only.\n * Keep the kernel's real boot clock intact and shift only the public\n * struct sysinfo.uptime field. All other sysinfo fields remain real.\n */\nstatic long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)\n{\n\tu64 real_sec;\n\tu64 off_sec = ghost_uptime_offset_sec();\n\n\tif (tp->tv_sec < 0)\n\t\treturn 0;\n\treal_sec = (u64)tp->tv_sec;\n\tif (tp->tv_nsec) {\n\t\tif (real_sec == (u64)LONG_MAX)\n\t\t\treturn LONG_MAX;\n\t\treal_sec++;\n\t}\n\tif (off_sec > (u64)LONG_MAX - real_sec)\n\t\treturn LONG_MAX;\n\treturn (long)(real_sec + off_sec);\n}\n\n'''\nif marker in text:\n    raise SystemExit('ERROR: V106 sysinfo layer was unexpectedly present before this step')\nif text.count(helper_anchor) != 1:\n    raise SystemExit(\n        f'ERROR: V106 do_sysinfo helper anchor count is {text.count(helper_anchor)}, expected 1')\ntext = text.replace(helper_anchor, helper + helper_anchor, 1)\n\nold_assignment = 'info->uptime = tp.tv_sec + (tp.tv_nsec ? 1 : 0);'\nnew_assignment = 'info->uptime = vili_ghost_sysinfo_uptime(&tp);'\nif text.count(old_assignment) != 1:\n    raise SystemExit(\n        f'ERROR: V106 sysinfo uptime assignment count is {text.count(old_assignment)}, expected 1')\ntext = text.replace(old_assignment, new_assignment, 1)\n\nrequired = (\n    marker,\n    'static long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)',\n    new_assignment,\n    'get_avenrun(info->loads, 0, SI_LOAD_SHIFT - FSHIFT);',\n    'info->procs = nr_threads;',\n    'si_meminfo(info);',\n    'si_swapinfo(info);',\n)\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete V106 sysinfo layer: {missing}')\nif old_assignment in text:\n    raise SystemExit('ERROR: real sysinfo uptime assignment remains after V106')\npath.write_text(text)\nprint('V106 sysinfo(2) uptime readout patch applied to the shared native/compat producer.')\nPY_V106_SYSINFO\n\ngit diff --check -- kernel/sys.c\ngrep -nE 'Vili CI V10(5|6)|vili_ghost_(times|sysinfo)|do_sysinfo|SYSCALL_DEFINE1\\(sysinfo' \\\n  kernel/sys.c | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: experimental vDSO code reappeared in V106\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"V106 single-layer patch verified: only sysinfo.uptime adds a new ghost-uptime readout.\" | tee -a ../setup.log\n"
    - name: Apply retained V108 fixed cpuidle sysfs time readout layer
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== RETAINED V108 FIXED CPUIDLE SYSFS TIME READOUT =====\" | tee -a ../setup.log\necho \"Starting point: V106 boot and audio PASS.\" | tee -a ../setup.log\necho \"V107 did not compile because its local variable named current collided with the ARM64 current macro.\" | tee -a ../setup.log\necho \"Shift only /sys/devices/system/cpu/cpu*/cpuidle/state*/time at readout.\" | tee -a ../setup.log\necho \"Internal cpuidle accounting, governor decisions, state usage, scheduler, clocks and vDSO stay unchanged.\" | tee -a ../setup.log\n\npython3 - <<'PY_V108_CPUIDLE_TIME'\nfrom pathlib import Path\n\npath = Path('drivers/cpuidle/sysfs.c')\ntext = path.read_text()\noriginal = text\n\ninclude = '#include <linux/ghost_uptime.h>'\ninclude_anchor = '#include <linux/cpuidle.h>'\nif include not in text:\n    if text.count(include_anchor) != 1:\n        raise SystemExit(\n            f'ERROR: V108 cpuidle include anchor count is {text.count(include_anchor)}, expected 1')\n    text = text.replace(include_anchor, include_anchor + '\\n' + include, 1)\n\nmarker = 'Vili CI V108: cpuidle state time sysfs readout sync only.'\nhelper_anchor = '''static ssize_t cpuidle_state_show(struct kobject *kobj, struct attribute *attr,\n\t\t\t\t  char * buf)'''\nhelper = r'''\n/*\n * Vili CI V108: cpuidle state time sysfs readout sync only.\n * Add the existing ghost-boot offset to one deepest enabled idle state\n * per CPU. This changes only the public stateN/time text; accounting and\n * governor inputs remain real.\n */\nstatic ssize_t vili_ghost_cpuidle_time_show(struct cpuidle_device *dev,\n\t\t\t\t\t    struct cpuidle_state *state,\n\t\t\t\t\t    struct cpuidle_state_usage *usage,\n\t\t\t\t\t    char *buf)\n{\n\tstruct cpuidle_driver *drv = cpuidle_get_cpu_driver(dev);\n\tu64 shown = usage->time;\n\tu64 off_sec = ghost_uptime_offset_sec();\n\tu64 add_us;\n\tint state_index = -1;\n\tint target = -1;\n\tint i;\n\n\tif (!off_sec || !drv || drv->state_count <= 0)\n\t\treturn sprintf(buf, \"%llu\\n\", shown);\n\n\tfor (i = 0; i < drv->state_count; i++) {\n\t\tif (state == &drv->states[i])\n\t\t\tstate_index = i;\n\t}\n\n\tfor (i = drv->state_count - 1; i >= 0; i--) {\n\t\tif (!drv->states[i].disabled && !dev->states_usage[i].disable) {\n\t\t\ttarget = i;\n\t\t\tbreak;\n\t\t}\n\t}\n\n\tif (state_index < 0 || state_index != target)\n\t\treturn sprintf(buf, \"%llu\\n\", shown);\n\n\tif (off_sec > div_u64(~0ULL, 1000000ULL))\n\t\treturn sprintf(buf, \"%llu\\n\", ~0ULL);\n\tadd_us = off_sec * 1000000ULL;\n\tif (shown > ~0ULL - add_us)\n\t\tshown = ~0ULL;\n\telse\n\t\tshown += add_us;\n\n\treturn sprintf(buf, \"%llu\\n\", shown);\n}\n\n'''\nif marker in text:\n    raise SystemExit('ERROR: V108 cpuidle layer was unexpectedly present before this step')\nif text.count(helper_anchor) != 1:\n    raise SystemExit(\n        f'ERROR: V108 cpuidle helper anchor count is {text.count(helper_anchor)}, expected 1')\ntext = text.replace(helper_anchor, helper + helper_anchor, 1)\n\nold_dispatch = '''\tif (cattr->show)\n\t\tret = cattr->show(state, state_usage, buf);'''\nnew_dispatch = '''\tif (cattr == &attr_time)\n\t\tret = vili_ghost_cpuidle_time_show(kobj_to_device(kobj), state,\n\t\t\t\t\t\t   state_usage, buf);\n\telse if (cattr->show)\n\t\tret = cattr->show(state, state_usage, buf);'''\nif text.count(old_dispatch) != 1:\n    raise SystemExit(\n        f'ERROR: V108 cpuidle show dispatch count is {text.count(old_dispatch)}, expected 1')\ntext = text.replace(old_dispatch, new_dispatch, 1)\n\nrequired = (\n    include,\n    marker,\n    'static ssize_t vili_ghost_cpuidle_time_show(',\n    'struct cpuidle_driver *drv = cpuidle_get_cpu_driver(dev);',\n    'int state_index = -1;',\n    'if (cattr == &attr_time)',\n    'shown += add_us;',\n)\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete V108 cpuidle layer: {missing}')\nif text.count('vili_ghost_cpuidle_time_show(') != 2:\n    raise SystemExit('ERROR: V108 helper must have exactly one definition and one call')\nif\
        \ 'int current' in text:\n    raise SystemExit('ERROR: V108 must not use the ARM64-reserved current macro as a local variable')\npath.write_text(text)\nprint('V108 cpuidle state time readout layer retained.')\nPY_V108_CPUIDLE_TIME\n\ngit diff --check -- drivers/cpuidle/sysfs.c\ngrep -nE 'Vili CI V108|vili_ghost_cpuidle_time_show|cattr == &attr_time|state_usage->_name' \\\n  drivers/cpuidle/sysfs.c | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: experimental vDSO code reappeared while retaining V108\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"V108 retained layer verified: the V107 current macro collision is absent; only cpuidle stateN/time receives the readout shift.\" | tee -a ../setup.log\n"
    - name: Apply retained V109 sysinfo uptime single-offset consistency fix
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V109 SYSINFO UPTIME SINGLE-OFFSET FIX =====\" | tee -a ../setup.log\necho \"Starting point: V108 boot and audio PASS with cpuidle concealment confirmed.\" | tee -a ../setup.log\necho \"V108 runtime evidence: uptime was about 36 days while PID starttime and cpuidle were about 18 days.\" | tee -a ../setup.log\necho \"Correct only sysinfo.uptime: ktime_get_boottime_ts64() already follows the V61 shifted TK_OFFS_BOOT path.\" | tee -a ../setup.log\necho \"Do not change vDSO, clocks, scheduler, cpuidle accounting, cpufreq accounting or non-time sysinfo fields.\" | tee -a ../setup.log\n\npython3 - <<'PY_V109_SYSINFO_SINGLE_OFFSET'\nfrom pathlib import Path\n\npath = Path('kernel/sys.c')\ntext = path.read_text()\n\nold_helper = r'''/*\n * Vili CI V106: sysinfo(2) uptime readout sync only.\n * Keep the kernel's real boot clock intact and shift only the public\n * struct sysinfo.uptime field. All other sysinfo fields remain real.\n */\nstatic long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)\n{\n\tu64 real_sec;\n\tu64 off_sec = ghost_uptime_offset_sec();\n\n\tif (tp->tv_sec < 0)\n\t\treturn 0;\n\treal_sec = (u64)tp->tv_sec;\n\tif (tp->tv_nsec) {\n\t\tif (real_sec == (u64)LONG_MAX)\n\t\t\treturn LONG_MAX;\n\t\treal_sec++;\n\t}\n\tif (off_sec > (u64)LONG_MAX - real_sec)\n\t\treturn LONG_MAX;\n\treturn (long)(real_sec + off_sec);\n}\n\n'''\nnew_helper = r'''/*\n * Vili CI V109: sysinfo(2) consumes shifted BOOTTIME exactly once.\n * ktime_get_boottime_ts64() reaches ktime_get_with_offset(TK_OFFS_BOOT),\n * whose V61 read path already applies ghost_uptime_offset_ns(). Do not\n * add ghost_uptime_offset_sec here a second time. Other sysinfo fields\n * remain unchanged.\n */\nstatic long vili_ghost_sysinfo_uptime(const struct timespec64 *tp)\n{\n\tu64 shown_sec;\n\n\tif (tp->tv_sec < 0)\n\t\treturn 0;\n\tshown_sec = (u64)tp->tv_sec;\n\tif (tp->tv_nsec) {\n\t\tif (shown_sec == (u64)LONG_MAX)\n\t\t\treturn LONG_MAX;\n\t\tshown_sec++;\n\t}\n\treturn (long)shown_sec;\n}\n\n'''\n\nmarker = 'Vili CI V109: sysinfo(2) consumes shifted BOOTTIME exactly once.'\nassignment = 'info->uptime = vili_ghost_sysinfo_uptime(&tp);'\nif marker in text:\n    raise SystemExit('ERROR: V109 sysinfo consistency fix was unexpectedly present before this step')\nif text.count(old_helper) != 1:\n    raise SystemExit(\n        f'ERROR: V106 sysinfo helper count is {text.count(old_helper)}, expected 1')\nif text.count(assignment) != 1:\n    raise SystemExit(\n        f'ERROR: sysinfo helper assignment count is {text.count(assignment)}, expected 1')\n\ntext = text.replace(old_helper, new_helper, 1)\n\nstart = text.index(marker)\nend = text.index('/**\\n * do_sysinfo - fill in sysinfo struct', start)\nhelper_span = text[start:end]\nif 'ghost_uptime_offset_sec()' in helper_span:\n    raise SystemExit('ERROR: V109 sysinfo helper still adds a second ghost offset')\nfor retained in (\n    assignment,\n    'ktime_get_boottime_ts64(&tp);',\n    'get_avenrun(info->loads, 0, SI_LOAD_SHIFT - FSHIFT);',\n    'info->procs = nr_threads;',\n    'si_meminfo(info);',\n    'si_swapinfo(info);',\n):\n    if retained not in text:\n        raise SystemExit(f'ERROR: required sysinfo code missing after V109: {retained}')\n\npath.write_text(text)\nprint('V109 sysinfo single-offset consistency fix applied.')\nPY_V109_SYSINFO_SINGLE_OFFSET\n\nif ! grep -q 'Vili CI V61: CLOCK_BOOTTIME API + VDSO sync' kernel/time/timekeeping.c; then\n  echo \"ERROR: V61 shifted TK_OFFS_BOOT producer is missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'return ktime_get_with_offset(TK_OFFS_BOOT);' include/linux/timekeeping.h; then\n  echo \"ERROR: ktime_get_boottime no longer reaches ktime_get_with_offset(TK_OFFS_BOOT)\" | tee -a ../setup.log\n  exit 1\nfi\n\ngit diff --check -- kernel/sys.c\ngrep -nE 'Vili CI V10(5|9)|vili_ghost_(times|sysinfo)|do_sysinfo|SYSCALL_DEFINE1\\(sysinfo' \\\n  kernel/sys.c | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC\
        \ through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: experimental vDSO code reappeared in V109\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"V109 verified: sysinfo.uptime rounds the already-shifted BOOTTIME value without adding a second offset.\" | tee -a ../setup.log\n"
    - name: Apply V110 cpufreq time_in_state readout layer
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V110 CPUFREQ TIME_IN_STATE READOUT LAYER =====\" | tee -a ../setup.log\necho \"Starting point: V109 compile PASS; retain V109 sysinfo, V108 cpuidle and audio PASS sources.\" | tee -a ../setup.log\necho \"The two supplied V108 reports were 1796 seconds apart on one boot; cpufreq policy totals rose from about 439 seconds to about 2235 seconds.\" | tee -a ../setup.log\necho \"Shift only stats/time_in_state text. Keep local_clock accounting, transitions, reset handling, governor and frequency selection unchanged.\" | tee -a ../setup.log\n\npython3 - <<'PY_V110_CPUFREQ_TIS'\nfrom pathlib import Path\n\npath = Path('drivers/cpufreq/cpufreq_stats.c')\ntext = path.read_text()\n\ninclude = '#include <linux/ghost_uptime.h>'\ninclude_anchor = '#include <linux/cpufreq.h>'\nif include not in text:\n    if text.count(include_anchor) != 1:\n        raise SystemExit(\n            f'ERROR: V110 cpufreq include anchor count is {text.count(include_anchor)}, expected 1')\n    text = text.replace(include_anchor, include_anchor + '\\n' + include, 1)\n\nmarker = 'Vili CI V110: cpufreq time_in_state sysfs readout sync only.'\nhelper_anchor = '''static ssize_t show_time_in_state(struct cpufreq_policy *policy, char *buf)'''\nhelper = r'''/*\n * Vili CI V110: cpufreq time_in_state sysfs readout sync only.\n * Add the existing random ghost-boot offset to one deterministic\n * frequency bucket. The real per-policy accounting, transition table,\n * reset state, governor decisions and local_clock() remain untouched.\n */\nstatic u64 vili_ghost_cpufreq_time_in_state(int index, u64 time)\n{\n\tu64 shown_ticks = nsec_to_clock_t(time);\n\tu64 add_ticks;\n\n\tif (index != 0)\n\t\treturn shown_ticks;\n\n\tadd_ticks = nsec_to_clock_t(ghost_uptime_offset_ns());\n\tif (shown_ticks > ~0ULL - add_ticks)\n\t\treturn ~0ULL;\n\n\treturn shown_ticks + add_ticks;\n}\n\n'''\nif marker in text:\n    raise SystemExit('ERROR: V110 cpufreq layer was unexpectedly present before this step')\nif text.count(helper_anchor) != 1:\n    raise SystemExit(\n        f'ERROR: V110 show_time_in_state anchor count is {text.count(helper_anchor)}, expected 1')\ntext = text.replace(helper_anchor, helper + helper_anchor, 1)\n\nold_output = (\n    '\\t\\tlen += sprintf(buf + len, \"%u %llu\\\\n\", stats->freq_table[i],\\n'\n    '\\t\\t\\t       nsec_to_clock_t(time));'\n)\nnew_output = (\n    '\\t\\tlen += sprintf(buf + len, \"%u %llu\\\\n\", stats->freq_table[i],\\n'\n    '\\t\\t\\t       vili_ghost_cpufreq_time_in_state(i, time));'\n)\nif text.count(old_output) != 1:\n    raise SystemExit(\n        f'ERROR: V110 time_in_state output anchor count is {text.count(old_output)}, expected 1')\ntext = text.replace(old_output, new_output, 1)\n\nrequired = (\n    include,\n    marker,\n    'static u64 vili_ghost_cpufreq_time_in_state(int index, u64 time)',\n    'u64 shown_ticks = nsec_to_clock_t(time);',\n    'add_ticks = nsec_to_clock_t(ghost_uptime_offset_ns());',\n    'vili_ghost_cpufreq_time_in_state(i, time)',\n    'unsigned long long cur_time = local_clock();',\n    'stats->time_in_state[stats->last_index] += cur_time - time;',\n)\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete V110 cpufreq layer: {missing}')\nif text.count('vili_ghost_cpufreq_time_in_state(') != 2:\n    raise SystemExit('ERROR: V110 helper must have exactly one definition and one call')\nif old_output in text:\n    raise SystemExit('ERROR: unshifted cpufreq time_in_state output remains')\n\npath.write_text(text)\nprint('V110 cpufreq time_in_state readout layer applied.')\nPY_V110_CPUFREQ_TIS\n\ngit diff --check -- drivers/cpufreq/cpufreq_stats.c\ngrep -nE 'Vili CI V110|vili_ghost_cpufreq_time_in_state|show_time_in_state|cpufreq_stats_update|local_clock' \\\n  drivers/cpufreq/cpufreq_stats.c | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c;\
        \ then\n  echo \"ERROR: experimental vDSO code reappeared while applying V110\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"V110 verified: only the public cpufreq time_in_state readout receives one ghost-offset bucket.\" | tee -a ../setup.log\n"
    - name: Apply V111 proc stat softirq duplicate readout layer
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V111 PROC STAT SOFTIRQ DUPLICATE READOUT LAYER =====\" | tee -a ../setup.log\necho \"Starting point: V110 boot/runtime PASS; retain V110 cpufreq, V109 sysinfo, V108 cpuidle and audio-compatible sources.\" | tee -a ../setup.log\necho \"V85 already shifts TIMER/SCHED/RCU in /proc/softirqs. /proc/stat independently sums and prints the same raw counters.\" | tee -a ../setup.log\necho \"Shift only the duplicate /proc/stat softirq text with the exact V85 rates. Keep real softirq accounting and all other /proc/stat fields unchanged.\" | tee -a ../setup.log\n\npython3 - <<'PY_V111_PROC_STAT_SOFTIRQ'\nfrom pathlib import Path\n\npath = Path('fs/proc/stat.c')\ntext = path.read_text()\n\nmarker = 'Vili CI V111: /proc/stat softirq duplicate readout sync only.'\nhelper_anchor = 'static int show_stat(struct seq_file *p, void *v)'\nhelper = r'''/*\n * Vili CI V111: /proc/stat softirq duplicate readout sync only.\n * /proc/softirqs already adds the V85 display-only TIMER/SCHED/RCU\n * ghost counts per possible CPU. Mirror that addition in the second\n * public exporter without changing any real softirq accounting.\n */\nstatic u64 vili_ghost_proc_stat_softirq_count(unsigned int nr,\n\t\t\t\t\t\t unsigned int cpu,\n\t\t\t\t\t\t unsigned int base)\n{\n\tu64 off = ghost_uptime_offset_sec();\n\tu64 add = 0;\n\n\tif (!off)\n\t\treturn base;\n\n\tif (nr == TIMER_SOFTIRQ)\n\t\tadd = off * 50ULL;\n\telse if (nr == SCHED_SOFTIRQ)\n\t\tadd = off * 28ULL;\n\telse if (nr == RCU_SOFTIRQ)\n\t\tadd = off * 24ULL;\n\telse\n\t\treturn base;\n\n\tadd += (u64)cpu * 97ULL;\n\tif (add > (u64)~0U - base)\n\t\treturn ~0U;\n\n\treturn base + (unsigned int)add;\n}\n\n'''\nif marker in text:\n    raise SystemExit('ERROR: V111 proc stat softirq layer was unexpectedly present before this step')\nif text.count(helper_anchor) != 1:\n    raise SystemExit(\n        f'ERROR: V111 show_stat anchor count is {text.count(helper_anchor)}, expected 1')\ntext = text.replace(helper_anchor, helper + helper_anchor, 1)\n\nold_decl = (\n    '\\tu64 sum_softirq = 0;\\n'\n    '\\tunsigned int per_softirq_sums[NR_SOFTIRQS] = {0};'\n)\nnew_decl = (\n    '\\tu64 sum_softirq = 0;\\n'\n    '\\tu64 per_softirq_sums[NR_SOFTIRQS] = {0};'\n)\nold_sum = (\n    '\\t\\t\\tunsigned int softirq_stat = kstat_softirqs_cpu(j, i);\\n\\n'\n    '\\t\\t\\tper_softirq_sums[j] += softirq_stat;\\n'\n    '\\t\\t\\tsum_softirq += softirq_stat;'\n)\nnew_sum = (\n    '\\t\\t\\tunsigned int softirq_stat = kstat_softirqs_cpu(j, i);\\n'\n    '\\t\\t\\tu64 shown_softirq;\\n\\n'\n    '\\t\\t\\tshown_softirq = vili_ghost_proc_stat_softirq_count(j, i,\\n'\n    '\\t\\t\\t\\t\\t\\t\\t\\t\\t softirq_stat);\\n'\n    '\\t\\t\\tper_softirq_sums[j] += shown_softirq;\\n'\n    '\\t\\t\\tsum_softirq += shown_softirq;'\n)\nfor label, old, new in (\n    ('sum declarations', old_decl, new_decl),\n    ('raw sum accumulation', old_sum, new_sum),\n):\n    if text.count(old) != 1:\n        raise SystemExit(\n            f'ERROR: V111 {label} anchor count is {text.count(old)}, expected 1')\n    text = text.replace(old, new, 1)\n\nrequired = (\n    marker,\n    'static u64 vili_ghost_proc_stat_softirq_count(unsigned int nr,',\n    'add = off * 50ULL;',\n    'add = off * 28ULL;',\n    'add = off * 24ULL;',\n    'add += (u64)cpu * 97ULL;',\n    'u64 per_softirq_sums[NR_SOFTIRQS] = {0};',\n    'shown_softirq = vili_ghost_proc_stat_softirq_count(j, i,',\n    'ghost_uptime_fake_btime_sec(&boottime)',\n    'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), true)',\n)\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete V111 proc stat softirq layer: {missing}')\nif text.count('vili_ghost_proc_stat_softirq_count(') != 2:\n    raise SystemExit('ERROR: V111 count helper must have one definition and one call')\n\npath.write_text(text)\nprint('V111 /proc/stat softirq duplicate readout layer applied.')\nPY_V111_PROC_STAT_SOFTIRQ\n\nfor anchor in \\\n  'Vili CI V85: /proc/softirqs display counter sync.' \\\n  'add = off * 50ULL;'\
        \ \\\n  'add = off * 28ULL;' \\\n  'add = off * 24ULL;' \\\n  'add += (u64)cpu * 97ULL;'\ndo\n  if ! grep -Fq \"$anchor\" fs/proc/softirqs.c; then\n    echo \"ERROR: retained V85 /proc/softirqs formula drifted: $anchor\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\n\ngit diff --check -- fs/proc/stat.c\ngrep -nE 'Vili CI V(61|82|111)|vili_ghost_proc_stat_softirq|softirq ' \\\n  fs/proc/stat.c | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: experimental vDSO code reappeared while applying V111\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"V111 verified: only the duplicate /proc/stat softirq line mirrors the established V85 display offsets.\" | tee -a ../setup.log\n"
    - name: Apply V114 proc stat intr duplicate aggregate layer
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V114 PROC STAT INTR DUPLICATE AGGREGATE LAYER =====\" | tee -a ../setup.log\necho \"Starting point: V111 boot/audio/runtime PASS; retain every previous concealment and audio-compatible source.\" | tee -a ../setup.log\necho \"Retained intended V113 kernel layer: its source guards and /proc/stat intr patch stay unchanged; V114 changes only CI dependency handling.\" | tee -a ../setup.log\necho \"V88 already shifts arch_timer and arch_mem_timer only in /proc/interrupts. /proc/stat independently sums the raw IRQ counters into intr.\" | tee -a ../setup.log\necho \"Shift only the final /proc/stat intr text with the exact V88 rates and per-CPU bias. Keep real IRQ accounting and all other /proc/stat fields unchanged.\" | tee -a ../setup.log\n\npython3 - <<'PY_V114_PROC_STAT_INTR'\nfrom pathlib import Path\n\npath = Path('fs/proc/stat.c')\ntext = path.read_text()\n\nmarker = 'Vili CI V114: /proc/stat intr duplicate aggregate display sync only.'\nhelper_anchor = 'static int show_stat(struct seq_file *p, void *v)'\nhelper = r'''/*\n * Vili CI V114: /proc/stat intr duplicate aggregate display sync only.\n * V88 shifts arch_timer and arch_mem_timer only in /proc/interrupts.\n * Add the exact same display-only values to the independent intr\n * aggregate without changing any real IRQ accounting.\n */\nstatic u64 vili_ghost_proc_stat_intr_count(u64 base)\n{\n\tu64 off = ghost_uptime_offset_sec();\n\tu64 add = 0;\n\tint cpu;\n\n\tif (!off)\n\t\treturn base;\n\n\tfor_each_possible_cpu(cpu) {\n\t\tu64 timer_add = off * 40ULL + (u64)cpu * 131ULL;\n\t\tu64 mem_timer_add = off * 4ULL + (u64)cpu * 131ULL;\n\n\t\tif (timer_add > ~0ULL - add)\n\t\t\treturn ~0ULL;\n\t\tadd += timer_add;\n\t\tif (mem_timer_add > ~0ULL - add)\n\t\t\treturn ~0ULL;\n\t\tadd += mem_timer_add;\n\t}\n\n\tif (add > ~0ULL - base)\n\t\treturn ~0ULL;\n\n\treturn base + add;\n}\n\n'''\nif marker in text:\n    raise SystemExit('ERROR: V114 proc stat intr layer was unexpectedly present before this step')\nif text.count(helper_anchor) != 1:\n    raise SystemExit(\n        f'ERROR: V114 show_stat anchor count is {text.count(helper_anchor)}, expected 1')\ntext = text.replace(helper_anchor, helper + helper_anchor, 1)\n\nold_output = '\\tseq_put_decimal_ull(p, \"intr \", (unsigned long long)sum);'\nnew_output = (\n    '\\t/* Vili CI V114: show the V88-shifted duplicate aggregate only. */\\n'\n    '\\tseq_put_decimal_ull(p, \"intr \",\\n'\n    '\\t\\t\\t\\t    (unsigned long long)vili_ghost_proc_stat_intr_count(sum));'\n)\nif text.count(old_output) != 1:\n    raise SystemExit(\n        f'ERROR: V114 intr output anchor count is {text.count(old_output)}, expected 1')\ntext = text.replace(old_output, new_output, 1)\n\nrequired = (\n    marker,\n    'static u64 vili_ghost_proc_stat_intr_count(u64 base)',\n    'u64 timer_add = off * 40ULL + (u64)cpu * 131ULL;',\n    'u64 mem_timer_add = off * 4ULL + (u64)cpu * 131ULL;',\n    'vili_ghost_proc_stat_intr_count(sum)',\n    'Vili CI V111: /proc/stat softirq duplicate readout sync only.',\n    'vili_ghost_proc_stat_softirq_count(j, i,',\n    'ghost_uptime_fake_btime_sec(&boottime)',\n    'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), true)',\n)\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete V114 proc stat intr layer: {missing}')\nif text.count('vili_ghost_proc_stat_intr_count(') != 2:\n    raise SystemExit('ERROR: V114 count helper must have one definition and one call')\n\npath.write_text(text)\nprint('V114 /proc/stat intr duplicate aggregate layer applied.')\nPY_V114_PROC_STAT_INTR\n\nfor anchor in \\\n  'Vili CI V88: /proc/interrupts desc kstat arch_timer display sync.' \\\n  'ghost_uptime_proc_interrupt_desc_count(unsigned int cpu,' \\\n  'strstr(act->name, \"arch_timer\")' \\\n  'strstr(act->name, \"arch_mem_timer\")' \\\n  'add = off * 40ULL;' \\\n  'add = off * 4ULL;' \\\n  'add += (u64)cpu * 131ULL;'\ndo\n  if ! grep -Fq \"$anchor\" kernel/irq/proc.c; then\n    echo \"ERROR: retained V88 /proc/interrupts\
        \ formula drifted: $anchor\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\n\ngit diff --check -- fs/proc/stat.c\ngrep -nE 'Vili CI V(61|82|111|114)|vili_ghost_proc_stat_(softirq|intr)|intr |softirq ' \\\n  fs/proc/stat.c | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: experimental vDSO code reappeared while applying V114\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"V114 verified: only the duplicate /proc/stat intr aggregate mirrors the established V88 display offsets.\" | tee -a ../setup.log\n"
    - name: Apply V115 proc stat ctxt display-only readout layer
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V115 PROC STAT CTXT DISPLAY-ONLY READOUT LAYER =====\" | tee -a ../setup.log\necho \"V114 build/boot/KSU runtime evidence is retained. This step changes only the final /proc/stat ctxt text.\" | tee -a ../setup.log\necho \"The V114 root report exposed 1,984,515 context switches at about 573 real seconds, approximately 3463/s.\" | tee -a ../setup.log\necho \"Use ten times the established V114 synthetic timer-IRQ addition: about 3520 context switches/s on eight possible CPUs.\" | tee -a ../setup.log\necho \"Do not alter nr_context_switches accounting, scheduler, task switching, IRQ accounting, vDSO, hrtimer or any core clock.\" | tee -a ../setup.log\n\npython3 - <<'PY_V115_PROC_STAT_CTXT'\nfrom pathlib import Path\n\npath = Path('fs/proc/stat.c')\ntext = path.read_text()\n\nmarker = 'Vili CI V115: /proc/stat ctxt display-only ghost axis.'\nhelper_anchor = 'static int show_stat(struct seq_file *p, void *v)'\nhelper = r'''/*\n * Vili CI V115: /proc/stat ctxt display-only ghost axis.\n * Keep the real context-switch accounting untouched.  Reuse exactly\n * the retained V114 timer-IRQ display addition and multiply it by ten,\n * which gives a plausible 3520 ctxt/s axis on eight possible CPUs and\n * closely matches the 3463 ctxt/s observed on the V114 runtime report.\n */\nstatic u64 vili_ghost_proc_stat_ctxt_count(u64 base)\n{\n@@T@@u64 irq_display_add = vili_ghost_proc_stat_intr_count(0);\n@@T@@u64 add;\n\n@@T@@if (!irq_display_add)\n@@T@@@@T@@return base;\n\n@@T@@if (irq_display_add > ~0ULL / 10ULL)\n@@T@@@@T@@return ~0ULL;\n@@T@@add = irq_display_add * 10ULL;\n\n@@T@@if (add > ~0ULL - base)\n@@T@@@@T@@return ~0ULL;\n\n@@T@@return base + add;\n}\n\n'''\nhelper = helper.replace('@@T@@', '\\t')\n\nif marker in text:\n    raise SystemExit('ERROR: V115 proc stat ctxt layer was unexpectedly present before this step')\nif 'Vili CI V114: /proc/stat intr duplicate aggregate display sync only.' not in text:\n    raise SystemExit('ERROR: retained V114 proc stat intr marker is missing')\nif text.count('vili_ghost_proc_stat_intr_count(') != 2:\n    raise SystemExit('ERROR: retained V114 intr helper must have one definition and one call')\nif text.count(helper_anchor) != 1:\n    raise SystemExit(\n        f'ERROR: V115 show_stat anchor count is {text.count(helper_anchor)}, expected 1')\ntext = text.replace(helper_anchor, helper + helper_anchor, 1)\n\nold_ctxt = '\\t\\tnr_context_switches(),'\nnew_ctxt = (\n    '\\t\\t(unsigned long long)'\n    'vili_ghost_proc_stat_ctxt_count(nr_context_switches()),'\n)\nif text.count(old_ctxt) != 1:\n    raise SystemExit(\n        f'ERROR: V115 ctxt output anchor count is {text.count(old_ctxt)}, expected 1')\ntext = text.replace(old_ctxt, new_ctxt, 1)\n\nrequired = (\n    marker,\n    'static u64 vili_ghost_proc_stat_ctxt_count(u64 base)',\n    'u64 irq_display_add = vili_ghost_proc_stat_intr_count(0);',\n    'add = irq_display_add * 10ULL;',\n    'vili_ghost_proc_stat_ctxt_count(nr_context_switches())',\n    'Vili CI V114: /proc/stat intr duplicate aggregate display sync only.',\n    'vili_ghost_proc_stat_intr_count(sum)',\n    'Vili CI V111: /proc/stat softirq duplicate readout sync only.',\n)\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete V115 proc stat ctxt layer: {missing}')\nif text.count('vili_ghost_proc_stat_ctxt_count(') != 2:\n    raise SystemExit('ERROR: V115 ctxt helper must have one definition and one call')\nif text.count('nr_context_switches()') != 1:\n    raise SystemExit('ERROR: nr_context_switches must remain a single readout call')\n\npath.write_text(text)\nprint('V115 /proc/stat ctxt display-only layer applied.')\n\nfor off in (15 * 86400, 25 * 86400):\n    irq_add = sum(\n        off * 40 + cpu * 131 + off * 4 + cpu * 131\n        for cpu in range(8)\n    )\n    ctxt_add = irq_add * 10\n    if ctxt_add <= 0 or ctxt_add >= 2**64:\n        raise SystemExit('ERROR: V115 synthetic ctxt addition overflow simulation failed')\n    print(\n        f'V115 formula audit:\
        \ off={off}s irq_add={irq_add} '\n        f'ctxt_add={ctxt_add} ctxt_rate={ctxt_add / off:.2f}/s'\n    )\nPY_V115_PROC_STAT_CTXT\n\ngit diff --check -- fs/proc/stat.c\ngrep -nE 'Vili CI V(61|82|111|114|115)|vili_ghost_proc_stat_(softirq|intr|ctxt)|intr |ctxt |softirq ' \\\n  fs/proc/stat.c | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: experimental vDSO code reappeared while applying V115\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"V115 verified: only /proc/stat ctxt text receives the synthetic historical display addition.\" | tee -a ../setup.log\n"
    - name: V119.1 patch proc stat processes display-only history
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V119.1 /PROC/STAT PROCESSES DISPLAY-ONLY HISTORY =====\" | tee -a ../setup.log\necho \"Runtime V119 exposed only ~14k total_forks while the visible uptime was ~25 days. This step changes the /proc/stat processes text only; real fork accounting remains untouched.\" | tee -a ../setup.log\necho \"Policy: add one synthetic historical process per ghost-offset second. This is intentionally conservative and avoids extrapolating the high early-boot fork rate across multiple days.\" | tee -a ../setup.log\n\npython3 - <<'PY_V119_PROC_STAT_PROCESSES'\nfrom pathlib import Path\n\npath = Path('fs/proc/stat.c')\ntext = path.read_text()\n\nmarker = 'Vili CI V119.1: /proc/stat processes display-only ghost history.'\nhelper_anchor = 'static int show_stat(struct seq_file *p, void *v)'\nhelper = r'''/*\n * Vili CI V119.1: /proc/stat processes display-only ghost history.\n * Keep total_forks accounting unchanged.  Add a conservative one-event\n * per ghost-offset-second history only when formatting /proc/stat.\n */\nstatic unsigned long vili_ghost_proc_stat_processes_count(unsigned long base)\n{\n@@T@@u64 off = ghost_uptime_offset_sec();\n\n@@T@@if (!off)\n@@T@@@@T@@return base;\n\n@@T@@if (off > (u64)(~0UL - base))\n@@T@@@@T@@return ~0UL;\n\n@@T@@return base + (unsigned long)off;\n}\n\n'''\nhelper = helper.replace('@@T@@', '\\t')\n\nif marker in text:\n    raise SystemExit('ERROR: V119.1 processes layer was unexpectedly present before this step')\nif 'Vili CI V115: /proc/stat ctxt display-only ghost axis.' not in text:\n    raise SystemExit('ERROR: retained V115 ctxt layer is missing before V119.1 processes patch')\nif text.count(helper_anchor) != 1:\n    raise SystemExit(\n        f'ERROR: V119.1 show_stat anchor count is {text.count(helper_anchor)}, expected 1')\ntext = text.replace(helper_anchor, helper + helper_anchor, 1)\n\nold = '\\t\\ttotal_forks,'\nnew = '\\t\\tvili_ghost_proc_stat_processes_count(total_forks),'\nif text.count(old) != 1:\n    raise SystemExit(\n        f'ERROR: V119.1 direct total_forks output anchor count is {text.count(old)}, expected 1')\ntext = text.replace(old, new, 1)\n\nrequired = (\n    marker,\n    'static unsigned long vili_ghost_proc_stat_processes_count(unsigned long base)',\n    'u64 off = ghost_uptime_offset_sec();',\n    'return base + (unsigned long)off;',\n    'vili_ghost_proc_stat_processes_count(total_forks)',\n    'vili_ghost_proc_stat_ctxt_count(nr_context_switches())',\n    'ghost_uptime_fake_btime_sec(&boottime)',\n)\nmissing = [item for item in required if item not in text]\nif missing:\n    raise SystemExit(f'ERROR: incomplete V119.1 processes layer: {missing}')\nif text.count('vili_ghost_proc_stat_processes_count(') != 2:\n    raise SystemExit('ERROR: V119.1 processes helper must have one definition and one call')\nif text.count('vili_ghost_proc_stat_processes_count(total_forks)') != 1:\n    raise SystemExit('ERROR: V119.1 processes output must contain exactly one helper call around total_forks')\n\npath.write_text(text)\nprint('V119.1 /proc/stat processes display-only history layer applied.')\n\nfor off in (15 * 86400, 25 * 86400):\n    add = off\n    if add <= 0 or add >= 2**64:\n        raise SystemExit('ERROR: V119.1 synthetic processes addition simulation failed')\n    print(\n        f'V119.1 formula audit: off={off}s processes_add={add} '\n        f'synthetic_rate={add / off:.2f}/s'\n    )\nPY_V119_PROC_STAT_PROCESSES\n\ngit diff --check -- fs/proc/stat.c\ngrep -nE 'Vili CI V(61|82|111|114|115|119.1)|vili_ghost_proc_stat_(softirq|intr|ctxt|processes)|intr |ctxt |processes |softirq ' \\\n  fs/proc/stat.c | tee -a ../setup.log\n\necho \"V119.1 processes hardening OK: only /proc/stat readout changed; total_forks accounting is untouched.\" | tee -a ../setup.log\n"
    - name: Guard V119 pristine vDSO rollback scope
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V119 V118 vDSO MONOTONIC ROLLBACK GUARD =====\" | tee -a ../setup.log\necho \"V119.1 processes plus retained V115 ctxt, V114 intr and V111 softirq readout layers are required.\" | tee -a ../setup.log\necho \"V119 compiles the pristine kernel/time/vsyscall.c and lib/vdso/gettimeofday.c from the pinned source commit.\" | tee -a ../setup.log\necho \"V61 BOOTTIME and V91A syscall-only MONOTONIC remain; global clocks, timer core and scheduler remain unchanged.\" | tee -a ../setup.log\n\ngit diff --check -- fs/proc/stat.c\ngrep -nE 'Vili CI V(61|82|111|114|115|119.1)|vili_ghost_proc_stat_(softirq|intr|ctxt|processes)|intr |ctxt |processes |softirq ' \\\n  fs/proc/stat.c | tee -a ../setup.log\n\nif ! grep -q 'Vili CI V119.1: /proc/stat processes display-only ghost history.' fs/proc/stat.c; then\n  echo \"ERROR: V119.1 processes display marker is missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'vili_ghost_proc_stat_processes_count(total_forks)' fs/proc/stat.c; then\n  echo \"ERROR: V119.1 processes display call is missing\" | tee -a ../setup.log\n  exit 1\nfi\nif grep -q $'^\\t\\ttotal_forks,$' fs/proc/stat.c; then\n  echo \"ERROR: direct /proc/stat total_forks readout remained after V119.1 processes hardening\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V115: /proc/stat ctxt display-only ghost axis.' fs/proc/stat.c; then\n  echo \"ERROR: retained V115 ctxt marker is missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'vili_ghost_proc_stat_ctxt_count(nr_context_switches())' fs/proc/stat.c; then\n  echo \"ERROR: retained V115 ctxt call is missing\" | tee -a ../setup.log\n  exit 1\nfi\n\nfor file in lib/vdso/gettimeofday.c kernel/time/vsyscall.c; do\n  HEAD_BLOB=\"$(git rev-parse \"HEAD:${file}\")\"\n  WORK_BLOB=\"$(git hash-object \"$file\")\"\n  echo \"$file HEAD=${HEAD_BLOB} WORK=${WORK_BLOB}\" | tee -a ../setup.log\n  if [ \"$HEAD_BLOB\" != \"$WORK_BLOB\" ]; then\n    echo \"ERROR: V119 rollback requires pristine source for $file\" | tee -a ../setup.log\n    git diff -- \"$file\" | tee -a ../setup.log || true\n    exit 1\n  fi\ndone\n\nprintf '%s  %s\\n' \\\n  66e04000c62e078883df4b4f0b48c913e1342cc5ffc76d88e51d59d0d8309c07 \\\n  lib/vdso/gettimeofday.c | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \\\n  e14f82fd54042e80cda5dc161368fead68cfdf9a47e7fd6492b6268f0be70bf8 \\\n  kernel/time/vsyscall.c | sha256sum -c - | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101|118)|ghost_vdso_shift_(hres|coarse)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: forbidden V118/legacy experimental vDSO code is present in V119\" | tee -a ../setup.log\n  grep -RnsE 'Vili CI V(92|97|100A|101|118)|ghost_vdso_shift_(hres|coarse)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c | tee -a ../setup.log || true\n  exit 1\nfi\n\nif ! grep -q 'Vili CI V61: CLOCK_BOOTTIME API + VDSO sync' kernel/time/timekeeping.c; then\n  echo \"ERROR: retained V61 BOOTTIME producer marker is missing\" | tee -a ../setup.log\n  exit 1\nfi\nif ! grep -q 'Vili CI V91A: shift POSIX CLOCK_MONOTONIC syscall result' kernel/time/posix-timers.c; then\n  echo \"ERROR: retained V91A syscall-only MONOTONIC marker is missing\" | tee -a ../setup.log\n  exit 1\nfi\n\necho \"V119 rollback verified: vDSO MONOTONIC is pristine; BOOTTIME and syscall-only layers remain available.\" | tee -a ../setup.log\n"
    - name: V93 rollback guard no v92 vdso patch
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V93 ROLLBACK GUARD: NO V92 VDSO BASETIME PATCH =====\" | tee -a ../setup.log\necho \"V92/FIX1/FIX2 boot-hang direction is disabled. V93 keeps V91B locator/audit only and must not contain V92 vDSO basetime markers.\" | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V92|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|arch_sys_boot_offset for vDSO updater' kernel/time/vsyscall.c 2>/dev/null; then\n  echo \"ERROR: stale V92 vDSO basetime patch found in kernel/time/vsyscall.c\" | tee -a ../setup.log\n  grep -RnsE 'Vili CI V92|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|arch_sys_boot_offset for vDSO updater' kernel/time/vsyscall.c 2>/dev/null | tee -a ../setup.log || true\n  exit 1\nfi\n\nfor spec in \\\n  \"fs/proc/uptime.c:Vili CI V80\" \\\n  \"fs/proc/stat.c:Vili CI V82\" \\\n  \"fs/proc/softirqs.c:Vili CI V85\" \\\n  \"kernel/irq/proc.c:Vili CI V88\"\ndo\n  file=\"${spec%%:*}\"\n  marker=\"${spec#*:}\"\n  echo \"-- checking $file :: $marker\" | tee -a ../setup.log\n  if ! grep -q \"$marker\" \"$file\"; then\n    echo \"ERROR: required marker missing after V93 rollback: $file :: $marker\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\n\necho \"V93 rollback guard OK: V91B safe-base direction restored\" | tee -a ../setup.log\n"
    - name: V94 sched clock printk source audit only
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V94 SCHED_CLOCK / LOCAL_CLOCK / PRINTK TIMESTAMP AUDIT ONLY =====\" | tee -a ../setup.log\necho \"V94 is audit-only. It does not patch sched_clock(), local_clock(), printk, tracing, scheduler, ktime_get(), timekeeping, hrtimer, timer core, or vDSO. This step locates the exact source paths so a later V95 can patch one narrow display path only.\" | tee -a ../setup.log\n\necho \"===== V94 REQUIRED BASE MARKER LOCK =====\" | tee -a ../setup.log\nfor spec in \\\n  \"fs/proc/uptime.c:Vili CI V80\" \\\n  \"fs/proc/stat.c:Vili CI V82\" \\\n  \"fs/proc/softirqs.c:Vili CI V85\" \\\n  \"kernel/irq/proc.c:Vili CI V88\"\ndo\n  file=\"${spec%%:*}\"\n  marker=\"${spec#*:}\"\n  echo \"-- checking $file :: $marker\" | tee -a ../setup.log\n  if ! grep -q \"$marker\" \"$file\"; then\n    echo \"ERROR: required base marker missing: $file :: $marker\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\n\necho \"===== V94 FORBID V92 VDSO BASETIME PATCH =====\" | tee -a ../setup.log\nif grep -RqsE 'Vili CI V92|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|arch_sys_boot_offset for vDSO updater' kernel/time/vsyscall.c 2>/dev/null; then\n  echo \"ERROR: stale V92 vDSO basetime patch found; aborting V94\" | tee -a ../setup.log\n  grep -RnsE 'Vili CI V92|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|arch_sys_boot_offset for vDSO updater' kernel/time/vsyscall.c 2>/dev/null | tee -a ../setup.log || true\n  exit 1\nfi\n\npython3 - <<'PY_V98_SCHED_CLOCK_OFFSET' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\nfiles = [\n    'kernel/sched/clock.c',\n    'kernel/sched/core.c',\n    'kernel/sched/debug.c',\n    'kernel/printk/printk.c',\n    'kernel/printk/printk_safe.c',\n    'kernel/trace/trace_clock.c',\n    'kernel/trace/trace.c',\n    'kernel/time/timekeeping.c',\n    'arch/arm64/kernel/time.c',\n    'arch/arm64/kernel/smp.c',\n    'drivers/clocksource/arm_arch_timer.c',\n    'include/linux/sched/clock.h',\n    'include/linux/printk.h',\n    'include/linux/ktime.h',\n]\n\nterms = [\n    'sched_clock',\n    'local_clock',\n    'cpu_clock',\n    'printk_time',\n    'print_time',\n    'msg_print_text',\n    'printk_get_ts',\n    'ktime_get',\n    'ktime_get_ns',\n    'ktime_get_mono_fast_ns',\n    'trace_clock',\n    'trace_clock_local',\n    'trace_clock_global',\n    'trace_clock_counter',\n    'clocksource',\n    'arch_timer',\n    'cntvct',\n    'cntfrq',\n]\n\nprint('===== V94 SOURCE LOCATOR SUMMARY =====')\nfor rel in files:\n    p = Path(rel)\n    print(f'\\n===== FILE {rel} =====')\n    if not p.exists():\n        print('MISSING')\n        continue\n    s = p.read_text(errors='ignore')\n    hits = [t for t in terms if t in s]\n    print('hits=' + (','.join(hits) if hits else 'none'))\n    shown = 0\n    for t in hits:\n        start = 0\n        while True:\n            idx = s.find(t, start)\n            if idx < 0:\n                break\n            print(f'--- term={t} offset={idx} ---')\n            print(s[max(0, idx-700):idx+1600])\n            shown += 1\n            start = idx + len(t)\n            if shown >= 8:\n                break\n        if shown >= 8:\n            break\n\nprint('\\n===== V94 RISK NOTES =====')\nprint('sched_clock/local_clock are hot paths. Do not offset globally before proving a display-only target.')\nprint('printk timestamps are safer than scheduler clock itself if patching only formatting/output.')\nprint('trace_clock can leak true monotonic, but debugfs tracing is absent on this ROM in prior V89/V93 checks.')\nprint('Recommended V95 candidate: printk timestamp display-only, not sched_clock core.')\nPY_V98_SCHED_CLOCK_OFFSET\n\necho \"V94 sched_clock/local_clock/printk source audit OK\" | tee -a ../setup.log\n"
    - name: V95 sched clock surface guard no core patch
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V95 SCHED_CLOCK SURFACE GUARD - NO CORE PATCH =====\" | tee -a ../setup.log\necho \"V94 runtime showed printk/dmesg timestamps are already fake-scale, trace_clock is absent, and sched debug is absent. V95 therefore does not patch sched_clock() or local_clock(). It locks the safe base and collects source context only.\" | tee -a ../setup.log\n\necho \"===== V95 REQUIRED BASE MARKER LOCK =====\" | tee -a ../setup.log\nfor spec in \\\n  \"fs/proc/uptime.c:Vili CI V80\" \\\n  \"fs/proc/stat.c:Vili CI V82\" \\\n  \"fs/proc/softirqs.c:Vili CI V85\" \\\n  \"kernel/irq/proc.c:Vili CI V88\"\ndo\n  file=\"${spec%%:*}\"\n  marker=\"${spec#*:}\"\n  echo \"-- checking $file :: $marker\" | tee -a ../setup.log\n  if ! grep -q \"$marker\" \"$file\"; then\n    echo \"ERROR: required base marker missing: $file :: $marker\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\n\necho \"===== V95 FORBIDDEN PATCH CHECK =====\" | tee -a ../setup.log\nif grep -RqsE 'Vili CI V92|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|arch_sys_boot_offset for vDSO updater' kernel/time/vsyscall.c 2>/dev/null; then\n  echo \"ERROR: stale V92 vDSO basetime patch found\" | tee -a ../setup.log\n  exit 1\nfi\nif grep -RqsE 'Vili CI V95.*sched_clock|Vili CI V95.*local_clock' kernel/sched include/linux/sched kernel/time arch/arm64 2>/dev/null; then\n  echo \"ERROR: V95 must not patch sched_clock/local_clock core\" | tee -a ../setup.log\n  grep -RnsE 'Vili CI V95.*sched_clock|Vili CI V95.*local_clock' kernel/sched include/linux/sched kernel/time arch/arm64 2>/dev/null | tee -a ../setup.log || true\n  exit 1\nfi\n\npython3 - <<'PY_V95_SCHED_CLOCK_GUARD' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\ntargets = [\n    ('kernel/sched/clock.c', ['sched_clock', 'local_clock', 'cpu_clock']),\n    ('include/linux/sched/clock.h', ['sched_clock', 'local_clock', 'cpu_clock']),\n    ('kernel/printk/printk.c', ['sched_clock', 'local_clock', 'printk_time', 'print_time', 'msg_print_text']),\n    ('kernel/trace/trace_clock.c', ['sched_clock', 'local_clock', 'trace_clock']),\n    ('drivers/clocksource/arm_arch_timer.c', ['sched_clock', 'arch_timer', 'cntvct', 'sched_clock_register']),\n]\n\nfor rel, terms in targets:\n    p = Path(rel)\n    print(f'===== V95 SOURCE CONTEXT {rel} =====')\n    if not p.exists():\n        print('MISSING')\n        continue\n    s = p.read_text(errors='ignore')\n    hits = [t for t in terms if t in s]\n    print('hits=' + (','.join(hits) if hits else 'none'))\n    shown = 0\n    for t in hits:\n        idx = s.find(t)\n        if idx >= 0:\n            print(f'--- term={t} offset={idx} ---')\n            print(s[max(0, idx-800):idx+1600])\n            shown += 1\n        if shown >= 5:\n            break\n\nprint('===== V95 DECISION =====')\nprint('No sched_clock/local_clock core patch is applied in V95.')\nprint('Runtime V94 already showed dmesg timestamps follow fake uptime, so printk display patch is unnecessary and may double-shift.')\nprint('If a future V96 is attempted, it should be a display-only printk formatter guard, not sched_clock core.')\nPY_V95_SCHED_CLOCK_GUARD\n\necho \"V95 sched_clock surface guard OK\" | tee -a ../setup.log\n"
    - name: V96 add sched clock readout probe only
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V96 SCHED_CLOCK / LOCAL_CLOCK READOUT PROBE ONLY =====\" | tee -a ../setup.log\necho \"V96 does not patch sched_clock(), local_clock(), ktime_get(), printk, timer core, scheduler core, or vDSO. It only adds a read-only /proc/ghost_sched_clock_probe entry so runtime can compare sched_clock/local_clock/ktime_get against fake /proc uptime.\" | tee -a ../setup.log\n\necho \"===== V96 REQUIRED BASE MARKER LOCK =====\" | tee -a ../setup.log\nfor spec in \\\n  \"fs/proc/uptime.c:Vili CI V80\" \\\n  \"fs/proc/stat.c:Vili CI V82\" \\\n  \"fs/proc/softirqs.c:Vili CI V85\" \\\n  \"kernel/irq/proc.c:Vili CI V88\"\ndo\n  file=\"${spec%%:*}\"\n  marker=\"${spec#*:}\"\n  echo \"-- checking $file :: $marker\" | tee -a ../setup.log\n  if ! grep -q \"$marker\" \"$file\"; then\n    echo \"ERROR: required base marker missing: $file :: $marker\" | tee -a ../setup.log\n    exit 1\n  fi\ndone\n\necho \"===== V96 FORBID OLD RISKY PATCHES =====\" | tee -a ../setup.log\nif grep -RqsE 'Vili CI V92|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|arch_sys_boot_offset for vDSO updater' kernel/time/vsyscall.c 2>/dev/null; then\n  echo \"ERROR: stale V92 vDSO basetime patch found\" | tee -a ../setup.log\n  exit 1\nfi\n\ncat > fs/proc/ghost_sched_clock_probe.c <<'EOF_V96_PROBE'\n// SPDX-License-Identifier: GPL-2.0\n/*\n * Vili CI V96: sched_clock/local_clock readout probe only.\n *\n * This file does not modify sched_clock(), local_clock(), ktime_get(),\n * printk, timer core, scheduler core, or vDSO. It only exposes a\n * temporary read-only proc entry for controlled runtime comparison.\n */\n#include <linux/init.h>\n#include <linux/kernel.h>\n#include <linux/ktime.h>\n#include <linux/proc_fs.h>\n#include <linux/sched/clock.h>\n#include <linux/seq_file.h>\n#include <linux/types.h>\n\nstatic int ghost_sched_clock_probe_show(struct seq_file *m, void *v)\n{\n        u64 sched_ns = sched_clock();\n        u64 local_ns = local_clock();\n        u64 mono_ns = ktime_get_ns();\n        u64 boot_ns = ktime_get_boottime_ns();\n        u64 raw_ns = ktime_get_raw_ns();\n\n        seq_puts(m, \"Vili CI V96 sched_clock/local_clock readout probe only\\n\");\n        seq_printf(m, \"sched_clock_ns=%llu\\n\", sched_ns);\n        seq_printf(m, \"local_clock_ns=%llu\\n\", local_ns);\n        seq_printf(m, \"ktime_get_ns=%llu\\n\", mono_ns);\n        seq_printf(m, \"ktime_get_boottime_ns=%llu\\n\", boot_ns);\n        seq_printf(m, \"ktime_get_raw_ns=%llu\\n\", raw_ns);\n        seq_printf(m, \"sched_clock_sec=%llu.%09llu\\n\",\n                   div_u64(sched_ns, NSEC_PER_SEC),\n                   sched_ns % NSEC_PER_SEC);\n        seq_printf(m, \"local_clock_sec=%llu.%09llu\\n\",\n                   div_u64(local_ns, NSEC_PER_SEC),\n                   local_ns % NSEC_PER_SEC);\n        seq_printf(m, \"ktime_get_sec=%llu.%09llu\\n\",\n                   div_u64(mono_ns, NSEC_PER_SEC),\n                   mono_ns % NSEC_PER_SEC);\n        seq_printf(m, \"boottime_sec=%llu.%09llu\\n\",\n                   div_u64(boot_ns, NSEC_PER_SEC),\n                   boot_ns % NSEC_PER_SEC);\n        seq_printf(m, \"raw_sec=%llu.%09llu\\n\",\n                   div_u64(raw_ns, NSEC_PER_SEC),\n                   raw_ns % NSEC_PER_SEC);\n        return 0;\n}\n\nstatic int __init ghost_sched_clock_probe_init(void)\n{\n        proc_create_single(\"ghost_sched_clock_probe\", 0444, NULL,\n                           ghost_sched_clock_probe_show);\n        return 0;\n}\nlate_initcall(ghost_sched_clock_probe_init);\nEOF_V96_PROBE\n\nif ! grep -q 'ghost_sched_clock_probe.o' fs/proc/Makefile; then\n  printf '\\n# Vili CI V96: sched_clock/local_clock readout probe only\\nobj-y += ghost_sched_clock_probe.o\\n' >> fs/proc/Makefile\nfi\n\necho \"===== V96 VERIFY SOURCE =====\" | tee -a ../setup.log\ngrep -RnsE 'Vili CI V96|ghost_sched_clock_probe|sched_clock\\(|local_clock\\(|ktime_get_ns|ktime_get_boottime_ns|ktime_get_raw_ns|proc_create_single' fs/proc/ghost_sched_clock_probe.c fs/proc/Makefile 2>/dev/null | head -220 | tee -a ../setup.log\
        \ || true\n\nif ! grep -q 'proc_create_single(\"ghost_sched_clock_probe\"' fs/proc/ghost_sched_clock_probe.c; then\n  echo \"ERROR: V96 proc entry creation missing\" | tee -a ../setup.log\n  exit 1\nfi\nif grep -Rqs 'Vili CI V96' kernel/sched kernel/time kernel/printk arch/arm64 drivers/clocksource 2>/dev/null; then\n  echo \"ERROR: V96 marker leaked into forbidden core files\" | tee -a ../setup.log\n  grep -Rns 'Vili CI V96' kernel/sched kernel/time kernel/printk arch/arm64 drivers/clocksource 2>/dev/null | tee -a ../setup.log || true\n  exit 1\nfi\n\necho \"V96 sched_clock/local_clock readout probe patch OK\" | tee -a ../setup.log\n"
    - name: V119.1 remove V96 real-clock debug probe before production build
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== V119.1 REMOVE V96 REAL-CLOCK DEBUG PROBE =====\" | tee -a ../setup.log\necho \"The V119 runtime report proved /proc/ghost_sched_clock_probe directly exposed ~450s MONOTONIC/RAW while BOOTTIME was ~25 days. Keep the evidence in old logs, but do not ship this debug endpoint in production.\" | tee -a ../setup.log\n\npython3 - <<'PY_V119_REMOVE_V96_PROBE'\nfrom pathlib import Path\n\nmakefile = Path('fs/proc/Makefile')\nsource = Path('fs/proc/ghost_sched_clock_probe.c')\n\nif makefile.exists():\n    text = makefile.read_text(errors='ignore')\n    lines = text.splitlines()\n    out = []\n    for line in lines:\n        if 'Vili CI V96: sched_clock/local_clock readout probe only' in line:\n            continue\n        if 'ghost_sched_clock_probe.o' in line:\n            continue\n        out.append(line)\n    makefile.write_text('\\n'.join(out).rstrip() + '\\n')\n\nif source.exists():\n    source.unlink()\n\nfinal_make = makefile.read_text(errors='ignore') if makefile.exists() else ''\nif 'ghost_sched_clock_probe.o' in final_make or 'Vili CI V96: sched_clock/local_clock readout probe only' in final_make:\n    raise SystemExit('ERROR: V96 probe Makefile registration still present')\nif source.exists():\n    raise SystemExit('ERROR: V96 probe source still present')\n\nprint('V119.1 production cleanup removed fs/proc/ghost_sched_clock_probe.c and its Makefile registration.')\nPY_V119_REMOVE_V96_PROBE\n\ngit diff --check -- fs/proc/Makefile\nif grep -RqsE 'ghost_sched_clock_probe|Vili CI V96: sched_clock/local_clock readout probe only' fs/proc 2>/dev/null; then\n  echo \"ERROR: V96 direct real-clock probe still exists in production fs/proc sources\" | tee -a ../setup.log\n  grep -RnsE 'ghost_sched_clock_probe|Vili CI V96: sched_clock/local_clock readout probe only' fs/proc 2>/dev/null | tee -a ../setup.log || true\n  exit 1\nfi\necho \"V119.1 V96 probe removal verified.\" | tee -a ../setup.log\n"
    - name: Mark V75 process age audit baseline
      shell: bash
      run: 'set -Eeuo pipefail

        cd kernel

        echo "===== V75 PROCESS AGE AUDIT BASELINE =====" | tee -a ../setup.log

        echo "V75 intentionally keeps V74 FIX3 kernel behavior unchanged. It is a deeper validation step focused on process-age surfaces: /proc/[pid]/stat field22, toybox ps output, pid lifetimes, and Android core/app process consistency." | tee -a ../setup.log

        echo "No CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, scheduler core, hrtimer core, local_clock, sched_clock, ktime_get(), or timekeeping_get_delta changes." | tee -a ../setup.log

        '
    - name: Cache WeebX Clang
      uses: actions/cache@v4
      with:
        path: ~/.cache/weebx-clang
        key: weebx-clang-${{ runner.os }}-v2
    - name: Setup WeebX Clang
      shell: bash
      run: "set -Eeuo pipefail\nCLANG_DIR=\"$HOME/.cache/weebx-clang/clang\"\nTMP_DIR=\"$RUNNER_TEMP/weebx-clang\"\nmkdir -p \"$CLANG_DIR\" \"$TMP_DIR\"\n\necho \"===== WEEBX CLANG SETUP =====\" | tee -a setup.log\necho \"Toolchain cache dir: $CLANG_DIR\" | tee -a setup.log\n\nif [ ! -x \"$CLANG_DIR/bin/clang\" ]; then\n  rm -rf \"$CLANG_DIR\" \"$TMP_DIR\"\n  mkdir -p \"$CLANG_DIR\" \"$TMP_DIR/extract\"\n\n  CLANG_URL=\"$(curl -fsSL https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt | tr -d '\\r\\n')\"\n  if [ -z \"$CLANG_URL\" ]; then\n    echo \"ERROR: empty WeebX Clang URL\" | tee -a setup.log\n    exit 1\n  fi\n\n  echo \"Downloading: $CLANG_URL\" | tee -a setup.log\n  curl -L --fail --retry 10 --retry-all-errors --retry-delay 5 \"$CLANG_URL\" -o \"$TMP_DIR/clang.tar.gz\" 2>&1 | tee -a setup.log\n  tar -xf \"$TMP_DIR/clang.tar.gz\" -C \"$TMP_DIR/extract\" 2>&1 | tee -a setup.log\n\n  # WeebX release may ship clang as bin/clang-20 instead of bin/clang.\n  # Find either layout, then normalize the installed toolchain below.\n  CLANG_BIN=\"$(find \"$TMP_DIR/extract\" -type f \\( -path '*/bin/clang' -o -path '*/bin/clang-[0-9]*' \\) -print | sort -V | tail -n 1 || true)\"\n  if [ -z \"$CLANG_BIN\" ]; then\n    echo \"ERROR: clang/clang-N binary not found inside archive\" | tee -a setup.log\n    echo \"===== FIRST 250 FILES IN TOOLCHAIN ARCHIVE =====\" | tee -a setup.log\n    find \"$TMP_DIR/extract\" -maxdepth 4 -type f | head -250 | tee -a setup.log || true\n    exit 1\n  fi\n\n  chmod +x \"$CLANG_BIN\" || true\n  CLANG_ROOT=\"$(dirname \"$(dirname \"$CLANG_BIN\")\")\"\n  echo \"Detected clang binary: $CLANG_BIN\" | tee -a setup.log\n  echo \"Detected clang root: $CLANG_ROOT\" | tee -a setup.log\n  cp -a \"$CLANG_ROOT\"/. \"$CLANG_DIR\"/\nfi\n\nmkdir -p \"$CLANG_DIR/bin\"\nchmod -R u+rx \"$CLANG_DIR/bin\" || true\n\ncd \"$CLANG_DIR/bin\"\n\n# Normalize common binary names expected by Android kernel Makefiles.\nif [ ! -x clang ]; then\n  CAND=\"$(find . -maxdepth 1 -type f -name 'clang-[0-9]*' -print | sort -V | tail -n 1 || true)\"\n  if [ -n \"$CAND\" ]; then\n    ln -sf \"${CAND#./}\" clang\n  fi\nfi\n\nif [ ! -x clang++ ]; then\n  CXX_CAND=\"$(find . -maxdepth 1 -type f -name 'clang++-[0-9]*' -print | sort -V | tail -n 1 || true)\"\n  if [ -n \"$CXX_CAND\" ]; then\n    ln -sf \"${CXX_CAND#./}\" clang++\n  elif [ -x clang ]; then\n    ln -sf clang clang++\n  fi\nfi\n\nif [ ! -x ld.lld ] && [ -x lld ]; then\n  ln -sf lld ld.lld\nfi\n\n# Some custom clang archives include GNU-style names but not every LLVM alias.\n[ ! -x llvm-strip   ] && [ -x strip   ] && ln -sf strip   llvm-strip   || true\n[ ! -x llvm-objcopy ] && [ -x objcopy ] && ln -sf objcopy llvm-objcopy || true\n[ ! -x llvm-objdump ] && [ -x objdump ] && ln -sf objdump llvm-objdump || true\n[ ! -x llvm-readelf ] && [ -x readelf ] && ln -sf readelf llvm-readelf || true\n[ ! -x llvm-ar      ] && [ -x ar      ] && ln -sf ar      llvm-ar      || true\n[ ! -x llvm-nm      ] && [ -x nm      ] && ln -sf nm      llvm-nm      || true\n\nif [ ! -x \"$CLANG_DIR/bin/clang\" ]; then\n  echo \"ERROR: clang still not executable after compatibility symlink setup\" | tee -a ../../setup.log\n  echo \"===== TOOLCHAIN BIN DIR =====\" | tee -a ../../setup.log\n  ls -lah \"$CLANG_DIR/bin\" | tee -a ../../setup.log || true\n  exit 1\nfi\n\necho \"$CLANG_DIR/bin\" >> \"$GITHUB_PATH\"\necho \"CLANG_DIR=$CLANG_DIR\" >> \"$GITHUB_ENV\"\n\necho \"\" | tee -a ../../setup.log\necho \"===== CLANG VERSION =====\" | tee -a ../../setup.log\n\"$CLANG_DIR/bin/clang\" --version | tee -a ../../setup.log\necho \"\" | tee -a ../../setup.log\necho \"===== NORMALIZED TOOLCHAIN BINARIES =====\" | tee -a ../../setup.log\nls -lah \"$CLANG_DIR/bin\" | grep -E 'clang|lld|llvm-|aarch64|arm-linux' | head -250 | tee -a ../../setup.log || true\n"
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-vili-hyperos-a14-v111-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: 'ccache-vili-hyperos-a14-v111-${{ github.ref_name }}-

