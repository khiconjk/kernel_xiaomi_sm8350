Kernel build still completes and the Java canary remains fail-open until a compatible loader is installed\
        \ manually.\n4. If the reboot-required marker exists after the first V127 boot, reboot once more so ReZygisk can load the V127 Zygisk SO. Existing enabled loaders are respected; V127 never installs a second loader.\n5. Target package comes from the Run workflow input (default bin.mt.plus). system_server and every other app UID remain untouched.\n6. Open/use the workflow-selected target package after the loader-active boot, then run the root audit and inspect /data/local/tmp/V127-app-clock-hook.log.\n7. If /data/adb was unavailable while flashing, install ksu-modules/V127-ghost-app-clock-autoloader-KSU.zip manually in KernelSU Manager and reboot.\n\nExpected root evidence when the canary loads:\n- target_uid is resolved from /data/system/packages.list.\n- preAppSpecialize logs uptime_hook=1 and, when available, nano_hook=1.\n- a runtime uptimeMillis fake value is within about 120 seconds of the ghost uptime axis.\n- logcat -v monotonic remains within about 120 seconds of the ghost axis with watchdog_timeout=0.\n\nV127 does NOT modify kernel vDSO, ktime_get, scheduler, hrtimer, futex, alarm deadlines, or system_server clocks. If loader installation or a JNI lookup is unavailable, the Java canary fails open while the proven firstboot/logcat guards continue normally.\n\nRuntime audit:\n1. adb push V127-check-ghost-uptime-noroot.sh /data/local/tmp/\n2. adb shell chmod 755 /data/local/tmp/V127-check-ghost-uptime-noroot.sh\n3. adb shell su -c /data/local/tmp/V127-check-ghost-uptime-noroot.sh\n4. adb shell /data/local/tmp/V127-check-ghost-uptime-noroot.sh\n5. Pull the DONE paths printed by each run.\n\nBootloop collector in TWRP/OrangeFox:\n1. Copy V127-collect-in-twrp.sh to /sdcard.\n2. Open Recovery > Advanced > Terminal.\n3. Run: sh /sdcard/V127-collect-in-twrp.sh\n4. Send the resulting V127-bootloop-logs-*.tar.gz file.\n\nBoth audit/collector scripts are read-only. The TWRP script reads /dev/block/sda15 only when /proc/cmdline contains the exact block2mtd mapping observed in V103.\nEOF_V126_README\n\necho \"===== V127.2 DIAGNOSTICS STEP COMPLETE =====\" | tee -a setup.log\n"
    - name: Build V127 generation-aware KernelSU app-clock guard
      shell: bash
      run: "set -Eeuo pipefail\ntrap 'rc=$?; echo \"ERROR: V127.2 app-clock build rc=$rc line=$LINENO command=$BASH_COMMAND\" | tee -a setup.log; exit $rc' ERR\necho \"===== V127.2 APP CLOCK MODULE BUILD START =====\" | tee -a setup.log\nMODDIR=\"V127-ghost-app-clock-guard-module\"\nMODZIP=\"V127-ghost-app-clock-guard-KSU.zip\"\nrm -rf \"$MODDIR\" \"$MODZIP\"\nmkdir -p \"$MODDIR/bin\" \"$MODDIR/zygisk\" \"$MODDIR/src\" \"$MODDIR/deps\" \"$MODDIR/linkstub/arm64-v8a\" \"$MODDIR/linkstub/armeabi-v7a\"\n: >\"$MODDIR/skip_mount\"\n\ncat >\"$MODDIR/module.prop\" <<'EOF_V127_MODULE_PROP'\nid=v127_ghost_guard\nname=V127 Ghost Uptime Generation-Aware App Clock Guard\nversion=V127\nversionCode=1270\nauthor=khiconjk\ndescription=Retains stable ghost/readout layers and dynamic Zygisk Java clock canary; adds generation-aware health telemetry, workflow-selected target package, and kernel LOCALVERSION verification without global clock changes.\nEOF_V127_MODULE_PROP\n\nprintf '%s\n' \"$TARGET_PACKAGE\" >\"$MODDIR/target_package\"\nprintf '%s\n' \"$KERNEL_LOCALVERSION\" >\"$MODDIR/kernel_localversion_expected\"\n\ncat >\"$MODDIR/customize.sh\" <<'EOF_V127_CUSTOMIZE'\n#!/system/bin/sh\n# V127 install-time migration: keep exactly one active ghost guard generation.\nui_print \"- V127: removing stale ghost-uptime guard generations\"\nfor old in \\\n  v120_firstboot_guard v1201_firstboot_guard v121_firstboot_guard \\\n  v122_ghost_guard v123_ghost_guard v124_ghost_guard \\\n  v125_ghost_guard v1251_ghost_guard v126_ghost_guard v1261_ghost_guard; do\n  rm -rf \"/data/adb/modules/$old\" \"/data/adb/modules_update/$old\" 2>/dev/null || true\ndone\nui_print \"- V127: stale ghost guards cleaned; reboot after install\"\nEOF_V127_CUSTOMIZE\n\ncat >\"$MODDIR/post-fs-data.sh\" <<'EOF_V127_POSTFS'\n#!/system/bin/sh\n# V127: firstboot guard + recursion-proof preservation of the genuine logcat.\n# KernelSU runs this stage before module mounts. Never use setprop here.\nMODDIR=${0%/*}\nLOG=/data/local/tmp/V127-ghost-guard.log\nREAL_RUNTIME=/dev/.v127-logcat-real\nWRAP_SOURCE=\"$MODDIR/bin/logcat-wrapper\"\n\nlogmsg()\n{\n    printf '%s %s\\n' \"$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)\" \"$*\" >>\"$LOG\" 2>/dev/null || true\n}\n\napply_firstboot_guard()\n{\n    phase=\"$1\"\n    up_raw=\"\"\n    if [ -r /proc/uptime ]; then\n        read up_raw _rest </proc/uptime 2>/dev/null || up_raw=\"\"\n    fi\n    up_sec=\"${up_raw%%.*}\"\n    now_sec=\"$(date +%s 2>/dev/null || true)\"\n\n    case \"$up_sec\" in\n        ''|*[!0-9]*) logmsg \"$phase invalid ghost uptime: ${up_raw:-unavailable}\"; return 0 ;;\n    esac\n    case \"$now_sec\" in\n        ''|*[!0-9]*) logmsg \"$phase invalid wall clock: ${now_sec:-unavailable}\"; return 0 ;;\n    esac\n    [ \"$up_sec\" -gt 0 ] || { logmsg \"$phase ghost uptime is zero\"; return 0; }\n    [ \"$now_sec\" -gt \"$up_sec\" ] || { logmsg \"$phase wall clock not usable yet\"; return 0; }\n\n    fake_boot_ms=$(( (now_sec - up_sec) * 1000 ))\n    old=\"$(getprop ro.runtime.firstboot 2>/dev/null || true)\"\n    if command -v resetprop >/dev/null 2>&1; then\n        resetprop -n ro.runtime.firstboot \"$fake_boot_ms\" >/dev/null 2>&1 || {\n            logmsg \"$phase resetprop failed; old=$old target=$fake_boot_ms\"\n            return 0\n        }\n        new=\"$(getprop ro.runtime.firstboot 2>/dev/null || true)\"\n        logmsg \"$phase ghost_uptime_sec=$up_sec wall_epoch_sec=$now_sec old=$old target=$fake_boot_ms new=$new\"\n    else\n        logmsg \"$phase resetprop unavailable; old=$old target=$fake_boot_ms\"\n    fi\n}\n\nfile_size()\n{\n    wc -c <\"$1\" 2>/dev/null | tr -cd '0-9'\n}\n\nfile_hash()\n{\n    if command -v sha256sum >/dev/null 2>&1; then\n        sha256sum \"$1\" 2>/dev/null | awk '{print $1}'\n    else\n        cksum \"$1\" 2>/dev/null | awk '{print $1 \":\" $2}'\n    fi\n}\n\napply_firstboot_guard post-fs-data\n\nresolve_v127_target_uid()\n{\n    pkg=\"$(head -n 1 \"$MODDIR/target_package\" 2>/dev/null | tr -d '\\r\\n' || true)\"\n    case \"$pkg\" in\n        ''|*[!A-Za-z0-9._-]*)\n      \
        \      rm -f \"$MODDIR/target_uid\" >/dev/null 2>&1 || true\n            logmsg \"post-fs-data target package is invalid: ${pkg:-unavailable}\"\n            return 0\n            ;;\n    esac\n\n    uid=\"\"\n    if [ -r /data/system/packages.list ]; then\n        uid=\"$(awk -v p=\"$pkg\" '$1==p {print $2; exit}' /data/system/packages.list 2>/dev/null || true)\"\n    fi\n    case \"$uid\" in\n        ''|*[!0-9]*)\n            rm -f \"$MODDIR/target_uid\" >/dev/null 2>&1 || true\n            logmsg \"post-fs-data target_uid unresolved package=$pkg; Java canary stays fail-open\"\n            return 0\n            ;;\n    esac\n\n    printf '%s\\n' \"$uid\" >\"$MODDIR/target_uid\" 2>/dev/null || {\n        logmsg \"post-fs-data cannot write target_uid package=$pkg uid=$uid\"\n        return 0\n    }\n    chmod 0644 \"$MODDIR/target_uid\" \"$MODDIR/target_package\" 2>/dev/null || true\n    if command -v chcon >/dev/null 2>&1; then\n        chcon u:object_r:system_file:s0 \"$MODDIR/target_uid\" \"$MODDIR/target_package\" >/dev/null 2>&1 || true\n        chcon -R u:object_r:system_file:s0 \"$MODDIR/zygisk\" >/dev/null 2>&1 || true\n    fi\n    logmsg \"post-fs-data target_package=$pkg target_uid=$uid Java clock canary armed\"\n}\n\nresolve_v127_target_uid\n\n# Clean only V122/V127 runtime remnants. They live on tmpfs and are recreated each boot.\numount /system/bin/logcat >/dev/null 2>&1 || true\nrm -f /dev/.v122-logcat-real /dev/.v122-logcat-wrapper \"$REAL_RUNTIME\" >/dev/null 2>&1 || true\n\nif [ ! -x /system/bin/logcat ]; then\n    logmsg \"post-fs-data ERROR: /system/bin/logcat is missing or not executable\"\n    exit 0\nfi\n\n# V122 used a file bind-mount as the preserved \"real\" executable. Runtime evidence\n# showed that path could resolve to the wrapper itself (same 2477-byte file), causing\n# recursion. V127 makes a byte-for-byte copy before module mounts and validates it.\nif ! cp -f /system/bin/logcat \"$REAL_RUNTIME\" >/dev/null 2>&1; then\n    logmsg \"post-fs-data ERROR: cannot copy genuine logcat to $REAL_RUNTIME\"\n    exit 0\nfi\nchmod 0755 \"$REAL_RUNTIME\" 2>/dev/null || true\nchown 0:0 \"$REAL_RUNTIME\" 2>/dev/null || true\nif command -v chcon >/dev/null 2>&1; then\n    chcon u:object_r:system_file:s0 \"$REAL_RUNTIME\" >/dev/null 2>&1 || true\nfi\n\nreal_size=\"$(file_size \"$REAL_RUNTIME\")\"\nwrap_size=\"$(file_size \"$WRAP_SOURCE\")\"\nreal_hash=\"$(file_hash \"$REAL_RUNTIME\")\"\nwrap_hash=\"$(file_hash \"$WRAP_SOURCE\")\"\ncase \"$real_size\" in ''|*[!0-9]*) real_size=0 ;; esac\ncase \"$wrap_size\" in ''|*[!0-9]*) wrap_size=0 ;; esac\n\nif [ \"$real_size\" -le 8192 ]; then\n    logmsg \"post-fs-data ERROR: copied logcat is implausibly small (${real_size} bytes); wrapper will remain disabled\"\n    rm -f \"$REAL_RUNTIME\" >/dev/null 2>&1 || true\n    exit 0\nfi\nif [ -n \"$real_hash\" ] && [ -n \"$wrap_hash\" ] && [ \"$real_hash\" = \"$wrap_hash\" ]; then\n    logmsg \"post-fs-data ERROR: copied logcat hash equals wrapper hash; recursion prevented\"\n    rm -f \"$REAL_RUNTIME\" >/dev/null 2>&1 || true\n    exit 0\nfi\n\n# A copied binary on /dev must actually be executable before V127 is allowed to\n# cover the system path. Failure is safe: post-mount simply leaves stock logcat.\nif ! \"$REAL_RUNTIME\" -h >/dev/null 2>&1; then\n    logmsg \"post-fs-data ERROR: copied logcat cannot execute from /dev; wrapper will remain disabled\"\n    rm -f \"$REAL_RUNTIME\" >/dev/null 2>&1 || true\n    exit 0\nfi\n\nlogmsg \"post-fs-data preserved genuine logcat copy size=$real_size hash=$real_hash path=$REAL_RUNTIME\"\nexit 0\nEOF_V127_POSTFS\n\ncat >\"$MODDIR/post-mount.sh\" <<'EOF_V127_POSTMOUNT'\n#!/system/bin/sh\n# V127: bind the validated wrapper only after proving the preserved real logcat\n# is a distinct executable. Any failure leaves stock /system/bin/logcat untouched.\nMODDIR=${0%/*}\nLOG=/data/local/tmp/V127-ghost-guard.log\nWRAP_SOURCE=\"$MODDIR/bin/logcat-wrapper\"\nWRAP_RUNTIME=/dev/.v127-logcat-wrapper\nREAL_RUNTIME=/dev/.v127-logcat-real\nTARGET=/system/bin/logcat\n\nlogmsg()\n{\n    printf '%s\
        \ %s\\n' \"$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)\" \"$*\" >>\"$LOG\" 2>/dev/null || true\n}\n\nfile_size()\n{\n    wc -c <\"$1\" 2>/dev/null | tr -cd '0-9'\n}\n\nfile_hash()\n{\n    if command -v sha256sum >/dev/null 2>&1; then\n        sha256sum \"$1\" 2>/dev/null | awk '{print $1}'\n    else\n        cksum \"$1\" 2>/dev/null | awk '{print $1 \":\" $2}'\n    fi\n}\n\n[ -x \"$REAL_RUNTIME\" ] || {\n    logmsg \"post-mount SAFE-SKIP: validated real logcat is unavailable\"\n    exit 0\n}\n[ -f \"$WRAP_SOURCE\" ] || {\n    logmsg \"post-mount SAFE-SKIP: wrapper source is missing\"\n    exit 0\n}\n\nreal_size=\"$(file_size \"$REAL_RUNTIME\")\"\nwrap_size=\"$(file_size \"$WRAP_SOURCE\")\"\nreal_hash=\"$(file_hash \"$REAL_RUNTIME\")\"\nwrap_hash=\"$(file_hash \"$WRAP_SOURCE\")\"\ncase \"$real_size\" in ''|*[!0-9]*) real_size=0 ;; esac\ncase \"$wrap_size\" in ''|*[!0-9]*) wrap_size=0 ;; esac\n\nif [ \"$real_size\" -le 8192 ] || [ \"$real_size\" -eq \"$wrap_size\" ]; then\n    logmsg \"post-mount SAFE-SKIP: real_size=$real_size wrap_size=$wrap_size; recursion guard tripped\"\n    exit 0\nfi\nif [ -n \"$real_hash\" ] && [ -n \"$wrap_hash\" ] && [ \"$real_hash\" = \"$wrap_hash\" ]; then\n    logmsg \"post-mount SAFE-SKIP: real logcat and wrapper hashes are identical\"\n    exit 0\nfi\nif ! \"$REAL_RUNTIME\" -h >/dev/null 2>&1; then\n    logmsg \"post-mount SAFE-SKIP: preserved real logcat no longer executes\"\n    exit 0\nfi\n\nrm -f \"$WRAP_RUNTIME\" >/dev/null 2>&1 || true\nif ! cp -f \"$WRAP_SOURCE\" \"$WRAP_RUNTIME\" >/dev/null 2>&1; then\n    logmsg \"post-mount SAFE-SKIP: cannot stage wrapper\"\n    exit 0\nfi\nchmod 0755 \"$WRAP_RUNTIME\" 2>/dev/null || true\nchown 0:0 \"$WRAP_RUNTIME\" 2>/dev/null || true\nif command -v chcon >/dev/null 2>&1; then\n    if ! chcon u:object_r:system_file:s0 \"$WRAP_RUNTIME\" >/dev/null 2>&1; then\n        logmsg \"post-mount SAFE-SKIP: chcon system_file failed\"\n        rm -f \"$WRAP_RUNTIME\" >/dev/null 2>&1 || true\n        exit 0\n    fi\nfi\n\nctx=\"$(ls -Z \"$WRAP_RUNTIME\" 2>/dev/null || true)\"\ncase \"$ctx\" in\n    *u:object_r:system_file:s0*) ;;\n    *)\n        logmsg \"post-mount SAFE-SKIP: wrapper lacks system_file label: $ctx\"\n        rm -f \"$WRAP_RUNTIME\" >/dev/null 2>&1 || true\n        exit 0\n        ;;\nesac\n\nif ! mount --bind \"$WRAP_RUNTIME\" \"$TARGET\" >/dev/null 2>&1; then\n    logmsg \"post-mount SAFE-SKIP: bind wrapper over $TARGET failed\"\n    exit 0\nfi\n\ntarget_hash=\"$(file_hash \"$TARGET\")\"\nreal_hash_after=\"$(file_hash \"$REAL_RUNTIME\")\"\nif [ -z \"$target_hash\" ] || [ -z \"$wrap_hash\" ] || [ \"$target_hash\" != \"$wrap_hash\" ] ||\n   [ -z \"$real_hash_after\" ] || [ \"$real_hash_after\" != \"$real_hash\" ]; then\n    umount \"$TARGET\" >/dev/null 2>&1 || true\n    logmsg \"post-mount ERROR: post-bind integrity check failed; stock logcat restored\"\n    exit 0\nfi\n\nlogmsg \"post-mount V127 wrapper active real_size=$real_size wrap_size=$wrap_size real_hash=$real_hash wrapper_hash=$wrap_hash\"\nexit 0\nEOF_V127_POSTMOUNT\n\ncat >\"$MODDIR/boot-completed.sh\" <<'EOF_V127_BOOTCOMPLETED'\n#!/system/bin/sh\n# V127: refresh firstboot after RTC/NITZ/NTP has stabilized and record wrapper integrity.\nLOG=/data/local/tmp/V127-ghost-guard.log\nREAL_RUNTIME=/dev/.v127-logcat-real\nWRAP_RUNTIME=/dev/.v127-logcat-wrapper\nTARGET=/system/bin/logcat\n\nlogmsg()\n{\n    printf '%s %s\\n' \"$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)\" \"$*\" >>\"$LOG\" 2>/dev/null || true\n}\n\nup_raw=\"\"\nif [ -r /proc/uptime ]; then\n    read up_raw _rest </proc/uptime 2>/dev/null || up_raw=\"\"\nfi\nup_sec=\"${up_raw%%.*}\"\nnow_sec=\"$(date +%s 2>/dev/null || true)\"\ncase \"$up_sec\" in ''|*[!0-9]*) up_sec=0 ;; esac\ncase \"$now_sec\" in ''|*[!0-9]*) now_sec=0 ;; esac\n\nif [ \"$up_sec\" -gt 0 ] && [ \"$now_sec\" -gt \"$up_sec\" ] && command -v resetprop >/dev/null 2>&1; then\n    fake_boot_ms=$(( (now_sec - up_sec) * 1000 ))\n    old=\"$(getprop ro.runtime.firstboot 2>/dev/null || true)\"\n    resetprop -n ro.runtime.firstboot \"$fake_boot_ms\"\
        \ >/dev/null 2>&1 || true\n    new=\"$(getprop ro.runtime.firstboot 2>/dev/null || true)\"\n    logmsg \"boot-completed ghost_uptime_sec=$up_sec wall_epoch_sec=$now_sec old=$old target=$fake_boot_ms new=$new\"\nfi\n\nreal_size=\"$(wc -c <\"$REAL_RUNTIME\" 2>/dev/null | tr -cd '0-9')\"\nwrap_size=\"$(wc -c <\"$WRAP_RUNTIME\" 2>/dev/null | tr -cd '0-9')\"\ntarget_size=\"$(wc -c <\"$TARGET\" 2>/dev/null | tr -cd '0-9')\"\nlogmsg \"boot-completed logcat_integrity real_size=${real_size:-0} wrapper_size=${wrap_size:-0} target_size=${target_size:-0}\"\n\nMODDIR=${0%/*}\npkg=\"$(head -n 1 \"$MODDIR/target_package\" 2>/dev/null | tr -d '\\r\\n' || true)\"\nuid=\"\"\ncase \"$pkg\" in\n    ''|*[!A-Za-z0-9._-]*) ;;\n    *)\n        if [ -r /data/system/packages.list ]; then\n            uid=\"$(awk -v p=\"$pkg\" '$1==p {print $2; exit}' /data/system/packages.list 2>/dev/null || true)\"\n        fi\n        ;;\nesac\ncase \"$uid\" in\n    ''|*[!0-9]*)\n        logmsg \"boot-completed target_uid unresolved package=${pkg:-unavailable}; Java canary remains fail-open\"\n        ;;\n    *)\n        printf '%s\\n' \"$uid\" >\"$MODDIR/target_uid\" 2>/dev/null || true\n        chmod 0644 \"$MODDIR/target_uid\" \"$MODDIR/target_package\" 2>/dev/null || true\n        if command -v chcon >/dev/null 2>&1; then\n            chcon u:object_r:system_file:s0 \"$MODDIR/target_uid\" \"$MODDIR/target_package\" >/dev/null 2>&1 || true\n            chcon -R u:object_r:system_file:s0 \"$MODDIR/zygisk\" >/dev/null 2>&1 || true\n        fi\n        logmsg \"boot-completed target_package=$pkg target_uid=$uid Java clock canary armed\"\n        ;;\nesac\n\n# V127: bootstrap exactly one compatible Zygisk loader when none exists.\n# Never auto-reboot; a successful first install writes a reboot-required marker.\nREZ_DEP=\"$MODDIR/deps/ReZygisk-v1.0.0-515-333d423-release.zip\"\nREZ_INSTALL_LOG=/data/local/tmp/V127-rezygisk-install.log\nREZ_REBOOT_MARKER=/data/local/tmp/V127-rezygisk-reboot-required\n\nloader_enabled()\n{\n    d=\"$1\"\n    [ -f \"$d/module.prop\" ] && [ ! -e \"$d/disable\" ] && [ ! -e \"$d/remove\" ]\n}\n\nbootstrap_rezygisk()\n{\n    if loader_enabled /data/adb/modules/rezygisk; then\n        rm -f \"$REZ_REBOOT_MARKER\" >/dev/null 2>&1 || true\n        logmsg \"boot-completed ReZygisk already enabled; Java hook loader ready\"\n        return 0\n    fi\n    if loader_enabled /data/adb/modules/zygisksu; then\n        rm -f \"$REZ_REBOOT_MARKER\" >/dev/null 2>&1 || true\n        logmsg \"boot-completed existing Zygisk Next enabled; respecting existing loader\"\n        return 0\n    fi\n\n    # Respect an explicit user-disabled/remove state instead of silently replacing it.\n    if [ -d /data/adb/modules/rezygisk ] || [ -d /data/adb/modules/zygisksu ]; then\n        logmsg \"boot-completed loader module directory exists but is disabled/removed; auto-install skipped to respect user state\"\n        return 0\n    fi\n\n    if [ -f /data/adb/modules_update/rezygisk/module.prop ] || [ -e \"$REZ_REBOOT_MARKER\" ]; then\n        logmsg \"boot-completed ReZygisk already staged; reboot still required\"\n        return 0\n    fi\n\n    [ -r \"$REZ_DEP\" ] || {\n        logmsg \"boot-completed ReZygisk dependency missing: $REZ_DEP\"\n        return 0\n    }\n\n    KSUD=/data/adb/ksu/bin/ksud\n    if [ ! -x \"$KSUD\" ]; then\n        KSUD=\"$(command -v ksud 2>/dev/null || true)\"\n    fi\n    [ -n \"$KSUD\" ] && [ -x \"$KSUD\" ] || {\n        logmsg \"boot-completed ksud unavailable; ReZygisk bootstrap skipped\"\n        return 0\n    }\n\n    : >\"$REZ_INSTALL_LOG\" 2>/dev/null || true\n    if \"$KSUD\" module install \"$REZ_DEP\" >>\"$REZ_INSTALL_LOG\" 2>&1; then\n        printf 'V127 installed pinned ReZygisk dependency; reboot once to activate Java hooks.\\n' >\"$REZ_REBOOT_MARKER\" 2>/dev/null || true\n        chmod 0644 \"$REZ_REBOOT_MARKER\" \"$REZ_INSTALL_LOG\" 2>/dev/null || true\n        logmsg \"boot-completed ReZygisk v1.0.0 staged successfully; ONE REBOOT REQUIRED; no automatic reboot performed\"\n    else\n        rc=$?\n        logmsg \"\
        boot-completed ReZygisk install failed rc=$rc; inspect $REZ_INSTALL_LOG\"\n    fi\n}\n\nbootstrap_rezygisk\n\nexit 0\nEOF_V127_BOOTCOMPLETED\n\ncat >\"$MODDIR/service.sh\" <<'EOF_V127_SERVICE'\n#!/system/bin/sh\nMODDIR=${0%/*}\nLOG=/data/local/tmp/V127-module-health.log\nAPPLOG=/data/local/tmp/V127-app-clock-hook.log\nlogmsg() { printf '%s %s\\n' \"$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)\" \"$*\" >>\"$LOG\" 2>/dev/null || true; }\nn=0\nwhile [ \"$(getprop sys.boot_completed 2>/dev/null)\" != \"1\" ]; do sleep 2; n=$((n+1)); [ \"$n\" -lt 90 ] || break; done\npkg=\"$(head -n 1 \"$MODDIR/target_package\" 2>/dev/null | tr -d '\\r\\n' || true)\"\nuid=\"$(head -n 1 \"$MODDIR/target_uid\" 2>/dev/null | tr -cd '0-9' || true)\"\npids=\"\"\ncase \"$pkg\" in ''|*[!A-Za-z0-9._-]*) ;; *) pids=\"$(pidof \"$pkg\" 2>/dev/null || true)\" ;; esac\nloader=none\nif [ -f /data/adb/modules/rezygisk/module.prop ] && [ ! -e /data/adb/modules/rezygisk/disable ] && [ ! -e /data/adb/modules/rezygisk/remove ]; then loader=rezygisk; fi\nif [ -f /data/adb/modules/zygisksu/module.prop ] && [ ! -e /data/adb/modules/zygisksu/disable ] && [ ! -e /data/adb/modules/zygisksu/remove ]; then loader=zygisksu; fi\nlogmsg \"module=v127_ghost_guard pkg=${pkg:-unavailable} uid=${uid:-unresolved} pids=${pids:-none} loader=$loader arm64=$([ -f \"$MODDIR/zygisk/arm64-v8a.so\" ] && echo yes || echo no) arm32=$([ -f \"$MODDIR/zygisk/armeabi-v7a.so\" ] && echo yes || echo no) app_log=$([ -r \"$APPLOG\" ] && echo yes || echo no) kernel=$(uname -r 2>/dev/null || echo unavailable)\"\nexit 0\nEOF_V127_SERVICE\n\ncat >\"$MODDIR/bin/logcat-wrapper\" <<'EOF_V127_LOGCAT_WRAPPER'\n#!/system/bin/sh\n# V127 display-only guard for /system/bin/logcat.\n# It never changes kernel clocks. It modifies only rendered timestamps when the\n# caller explicitly requests a monotonic text format.\nREAL=/dev/.v127-logcat-real\n\n[ -x \"$REAL\" ] || exit 126\n\n# Hard anti-recursion guard. V122 runtime evidence showed its preserved \"real\"\n# path could become the wrapper itself; V127 refuses to run in that condition.\nself_size=\"$(wc -c <\"$0\" 2>/dev/null | tr -cd '0-9')\"\nreal_size=\"$(wc -c <\"$REAL\" 2>/dev/null | tr -cd '0-9')\"\ncase \"$self_size\" in ''|*[!0-9]*) self_size=0 ;; esac\ncase \"$real_size\" in ''|*[!0-9]*) real_size=0 ;; esac\n[ \"$real_size\" -gt 8192 ] || exit 126\n[ \"$real_size\" -ne \"$self_size\" ] || exit 126\n\nif command -v sha256sum >/dev/null 2>&1; then\n    self_hash=\"$(sha256sum \"$0\" 2>/dev/null | awk '{print $1}')\"\n    real_hash=\"$(sha256sum \"$REAL\" 2>/dev/null | awk '{print $1}')\"\n    [ -z \"$self_hash\" ] || [ -z \"$real_hash\" ] || [ \"$self_hash\" != \"$real_hash\" ] || exit 126\nfi\n\nwant_monotonic=0\nbinary_mode=0\nfor arg in \"$@\"; do\n    case \"$arg\" in\n        *monotonic*) want_monotonic=1 ;;\n        -B|--binary) binary_mode=1 ;;\n    esac\ndone\n\nif [ \"$want_monotonic\" -ne 1 ] || [ \"$binary_mode\" -eq 1 ]; then\n    exec \"$REAL\" \"$@\"\nfi\n\n# /proc/self/stat field 22 is already on the retained ghost MONOTONIC display axis.\nstart_ticks=\"$(awk '{print $22; exit}' /proc/self/stat 2>/dev/null || true)\"\nhz=\"$(getconf CLK_TCK 2>/dev/null || true)\"\ncase \"$start_ticks\" in ''|*[!0-9]*) exec \"$REAL\" \"$@\" ;; esac\ncase \"$hz\" in ''|*[!0-9]*) hz=100 ;; esac\n[ \"$hz\" -gt 0 ] 2>/dev/null || hz=100\n\nmarker=\"v127-ghost-$$-$(date +%s 2>/dev/null || echo 0)\"\nif command -v log >/dev/null 2>&1; then\n    log -t V127Ghost \"$marker\" >/dev/null 2>&1 || true\nfi\n\nprobe=\"$(\"$REAL\" -v monotonic -d -t 24 2>/dev/null | awk '\n    /^[[:space:]]*[0-9]+\\.[0-9]+[[:space:]]/ { last=$1 }\n    END { if (last != \"\") print last }\n' || true)\"\ncase \"$probe\" in ''|*[!0-9.]* ) exec \"$REAL\" \"$@\" ;; esac\n\noffset=\"$(awk -v ticks=\"$start_ticks\" -v hz=\"$hz\" -v real=\"$probe\" 'BEGIN {\n    fake=ticks/hz;\n    off=fake-real;\n    if (off < 0) exit 1;\n    printf \"%.0f\\n\", off;\n}' 2>/dev/null || true)\"\ncase \"$offset\" in ''|*[!0-9]*) exec \"$REAL\" \"$@\" ;; esac\n\n\"$REAL\" \"$@\" | awk -v off=\"\
        $offset\" '\n    /^[[:space:]]*[0-9]+\\.[0-9]+[[:space:]]/ {\n        old=$1;\n        split(old,a,\".\");\n        precision=(length(a) > 1 ? length(a[2]) : 3);\n        fmt=\"%.\" precision \"f\";\n        new=sprintf(fmt, old + off);\n        pos=index($0, old);\n        if (pos > 0) {\n            print substr($0,1,pos-1) new substr($0,pos+length(old));\n            next;\n        }\n    }\n    { print }\n'\nexit $?\nEOF_V127_LOGCAT_WRAPPER\n\ncat >\"$MODDIR/src/zygisk_min.hpp\" <<'EOF_V127_ZYGISK_MIN_HPP'\n/*\n * Minimal Zygisk API v4 ABI subset for V127, matching the published API-v4 layout.\n * Layout follows topjohnwu/zygisk-module-sample zygisk.hpp (0BSD).\n * This local subset avoids an Android NDK dependency in the kernel CI job.\n */\n#pragma once\n\nusing jboolean = unsigned char;\nusing jbyte = signed char;\nusing jchar = unsigned short;\nusing jshort = short;\nusing jint = int;\nusing jlong = long long;\nusing jfloat = float;\nusing jdouble = double;\nusing jsize = jint;\n\nstruct _jobject {};\nusing jobject = _jobject *;\nusing jclass = jobject;\nusing jstring = jobject;\nusing jarray = jobject;\nusing jobjectArray = jarray;\nusing jintArray = jarray;\nstruct _JNIEnv;\nusing JNIEnv = _JNIEnv;\n\nstruct JNINativeMethod {\n    const char *name;\n    const char *signature;\n    void *fnPtr;\n};\n\nusing dev_t = unsigned long;\nusing ino_t = unsigned long;\n\n#define ZYGISK_API_VERSION 4\n\nnamespace zygisk {\nstruct Api;\nstruct AppSpecializeArgs;\nstruct ServerSpecializeArgs;\n\nclass ModuleBase {\npublic:\n    virtual void onLoad(Api *, JNIEnv *) {}\n    virtual void preAppSpecialize(AppSpecializeArgs *) {}\n    virtual void postAppSpecialize(const AppSpecializeArgs *) {}\n    virtual void preServerSpecialize(ServerSpecializeArgs *) {}\n    virtual void postServerSpecialize(const ServerSpecializeArgs *) {}\n};\n\nstruct AppSpecializeArgs {\n    jint &uid;\n    jint &gid;\n    jintArray &gids;\n    jint &runtime_flags;\n    jobjectArray &rlimits;\n    jint &mount_external;\n    jstring &se_info;\n    jstring &nice_name;\n    jstring &instruction_set;\n    jstring &app_data_dir;\n    jintArray *const fds_to_ignore;\n    jboolean *const is_child_zygote;\n    jboolean *const is_top_app;\n    jobjectArray *const pkg_data_info_list;\n    jobjectArray *const whitelisted_data_info_list;\n    jboolean *const mount_data_dirs;\n    jboolean *const mount_storage_dirs;\n    jboolean *const mount_sysprop_overrides;\n    AppSpecializeArgs() = delete;\n};\n\nstruct ServerSpecializeArgs {\n    jint &uid;\n    jint &gid;\n    jintArray &gids;\n    jint &runtime_flags;\n    jlong &permitted_capabilities;\n    jlong &effective_capabilities;\n    ServerSpecializeArgs() = delete;\n};\n\nenum Option : int {\n    FORCE_DENYLIST_UNMOUNT = 0,\n    DLCLOSE_MODULE_LIBRARY = 1,\n};\n\nenum StateFlag : unsigned int {\n    PROCESS_GRANTED_ROOT = (1u << 0),\n    PROCESS_ON_DENYLIST = (1u << 1),\n};\n\nnamespace internal {\nstruct api_table;\nstruct module_abi {\n    long api_version;\n    ModuleBase *impl;\n    void (*preAppSpecialize)(ModuleBase *, AppSpecializeArgs *);\n    void (*postAppSpecialize)(ModuleBase *, const AppSpecializeArgs *);\n    void (*preServerSpecialize)(ModuleBase *, ServerSpecializeArgs *);\n    void (*postServerSpecialize)(ModuleBase *, const ServerSpecializeArgs *);\n\n    explicit module_abi(ModuleBase *m) : api_version(ZYGISK_API_VERSION), impl(m) {\n        preAppSpecialize = [](ModuleBase *x, AppSpecializeArgs *a) { x->preAppSpecialize(a); };\n        postAppSpecialize = [](ModuleBase *x, const AppSpecializeArgs *a) { x->postAppSpecialize(a); };\n        preServerSpecialize = [](ModuleBase *x, ServerSpecializeArgs *a) { x->preServerSpecialize(a); };\n        postServerSpecialize = [](ModuleBase *x, const ServerSpecializeArgs *a) { x->postServerSpecialize(a); };\n    }\n};\n\nstruct api_table {\n    void *impl;\n    bool (*registerModule)(api_table *, module_abi *);\n    void (*hookJniNativeMethods)(JNIEnv *, const char *, JNINativeMethod *, int);\n    void (*pltHookRegister)(dev_t, ino_t, const char *,\
        \ void *, void **);\n    bool (*exemptFd)(int);\n    bool (*pltHookCommit)();\n    int (*connectCompanion)(void *);\n    void (*setOption)(void *, Option);\n    int (*getModuleDir)(void *);\n    unsigned int (*getFlags)(void *);\n};\n} // namespace internal\n\nstruct Api {\n    internal::api_table *tbl = nullptr;\n    int getModuleDir() { return tbl && tbl->getModuleDir ? tbl->getModuleDir(tbl->impl) : -1; }\n    int connectCompanion() { return tbl && tbl->connectCompanion ? tbl->connectCompanion(tbl->impl) : -1; }\n    bool exemptFd(int fd) { return tbl && tbl->exemptFd && tbl->exemptFd(fd); }\n    void hookJniNativeMethods(JNIEnv *env, const char *cls, JNINativeMethod *m, int n) {\n        if (tbl && tbl->hookJniNativeMethods) tbl->hookJniNativeMethods(env, cls, m, n);\n    }\n};\n} // namespace zygisk\nEOF_V127_ZYGISK_MIN_HPP\n\ncat >\"$MODDIR/src/module.cpp\" <<'EOF_V127_MODULE_CPP'\n#include \"zygisk_min.hpp\"\n\nextern \"C\" long read(int, void *, unsigned long);\nextern \"C\" long write(int, const void *, unsigned long);\nextern \"C\" int close(int);\nextern \"C\" int fchmod(int, unsigned int);\nstruct pollfd_v127 { int fd; short events; short revents; };\nextern \"C\" int poll(pollfd_v127 *, unsigned long, int);\nextern \"C\" int open(const char *, int, ...);\nextern \"C\" int openat(int, const char *, int, ...);\n\nstruct timespec_v125 { long tv_sec; long tv_nsec; };\nextern \"C\" int clock_gettime(int, timespec_v125 *);\n\nstatic constexpr int O_RDONLY_V127 = 0;\nstatic constexpr int O_WRONLY_V127 = 1;\nstatic constexpr int O_CREAT_V127 = 64;\nstatic constexpr int O_APPEND_V127 = 1024;\nstatic constexpr int CLOCK_MONOTONIC_V127 = 1;\nstatic constexpr int CLOCK_BOOTTIME_V127 = 7;\nstatic constexpr short POLLIN_V127 = 0x0001;\n\nstatic jlong (*orig_uptime_millis)() = nullptr;\nstatic jlong (*orig_nano_time)() = nullptr;\nstatic long long ghost_offset_ns = 0;\nstatic int event_fd = -1;\nstatic int uptime_log_budget = 3;\nstatic int nano_log_budget = 3;\n\nextern \"C\" void *memset(void *dst, int c, unsigned long n) {\n    unsigned char *p = static_cast<unsigned char *>(dst);\n    for (unsigned long i = 0; i < n; ++i) p[i] = static_cast<unsigned char>(c);\n    return dst;\n}\n\nstatic unsigned long long udivmod64(unsigned long long n, unsigned long long d, unsigned long long *rem) {\n    if (d == 0) {\n        if (rem) *rem = 0;\n        return 0;\n    }\n    unsigned long long q = 0;\n    unsigned long long r = 0;\n    for (int i = 63; i >= 0; --i) {\n        r = (r << 1) | ((n >> i) & 1ULL);\n        if (r >= d) {\n            r -= d;\n            q |= (1ULL << i);\n        }\n    }\n    if (rem) *rem = r;\n    return q;\n}\n\nstatic long long div_positive_i64(long long v, unsigned long long d) {\n    if (v <= 0) return 0;\n    return static_cast<long long>(udivmod64(static_cast<unsigned long long>(v), d, nullptr));\n}\n\nstatic unsigned long cstrlen(const char *s) {\n    unsigned long n = 0;\n    if (s) while (s[n]) ++n;\n    return n;\n}\n\nstatic void append_char(char *buf, int &p, int cap, char c) {\n    if (p < cap - 1) buf[p++] = c;\n}\n\nstatic void append_text(char *buf, int &p, int cap, const char *s) {\n    if (!s) return;\n    while (*s && p < cap - 1) buf[p++] = *s++;\n}\n\nstatic void append_i64(char *buf, int &p, int cap, long long v) {\n    if (v < 0) {\n        append_char(buf, p, cap, '-');\n        if (v == (-9223372036854775807LL - 1LL)) {\n            append_text(buf, p, cap, \"9223372036854775808\");\n            return;\n        }\n        v = -v;\n    }\n    char tmp[32];\n    int n = 0;\n    do {\n        unsigned long long rem = 0;\n        unsigned long long q = udivmod64(static_cast<unsigned long long>(v), 10ULL, &rem);\n        tmp[n++] = char('0' + rem);\n        v = static_cast<long long>(q);\n    } while (v && n < int(sizeof(tmp)));\n    while (n > 0) append_char(buf, p, cap, tmp[--n]);\n}\n\nstatic void write_line(const char *kind, long long raw, long long fake) {\n    if (event_fd < 0) return;\n    char b[320];\n    int p = 0;\n    append_text(b, p, sizeof(b), kind);\n    append_text(b,\
        \ p, sizeof(b), \" raw=\");\n    append_i64(b, p, sizeof(b), raw);\n    append_text(b, p, sizeof(b), \" fake=\");\n    append_i64(b, p, sizeof(b), fake);\n    append_text(b, p, sizeof(b), \" offset_ns=\");\n    append_i64(b, p, sizeof(b), ghost_offset_ns);\n    append_char(b, p, sizeof(b), '\\n');\n    write(event_fd, b, (unsigned long)p);\n}\n\nstatic long long parse_positive_integer(const char *s, int n) {\n    long long v = 0;\n    bool any = false;\n    for (int i = 0; i < n; ++i) {\n        char c = s[i];\n        if (c >= '0' && c <= '9') {\n            any = true;\n            if (v > 900000000000000000LL) return -1;\n            v = v * 10 + (c - '0');\n        } else if (c == '\\n' || c == '\\r' || c == ' ' || c == '\\t') {\n            if (any) break;\n        } else {\n            return -1;\n        }\n    }\n    return any ? v : -1;\n}\n\nstatic long long read_target_uid(zygisk::Api *api) {\n    if (!api) return -1;\n    int dfd = api->getModuleDir();\n    if (dfd < 0) return -1;\n    int fd = openat(dfd, \"target_uid\", O_RDONLY_V127, 0);\n    close(dfd);\n    if (fd < 0) return -1;\n    char b[64];\n    long n = read(fd, b, sizeof(b));\n    close(fd);\n    if (n <= 0) return -1;\n    return parse_positive_integer(b, (int)n);\n}\n\nstatic long long parse_uptime_ns() {\n    int fd = open(\"/proc/uptime\", O_RDONLY_V127, 0);\n    if (fd < 0) return -1;\n    char b[96];\n    long n = read(fd, b, sizeof(b) - 1);\n    close(fd);\n    if (n <= 0) return -1;\n    b[n] = 0;\n\n    long long sec = 0;\n    long long frac = 0;\n    int frac_digits = 0;\n    bool dot = false;\n    bool any = false;\n    for (long i = 0; i < n; ++i) {\n        const char c = b[i];\n        if (c >= '0' && c <= '9') {\n            any = true;\n            if (!dot) {\n                if (sec > 900000000LL) return -1;\n                sec = sec * 10 + (c - '0');\n            } else if (frac_digits < 9) {\n                frac = frac * 10 + (c - '0');\n                ++frac_digits;\n            }\n        } else if (c == '.' && !dot) {\n            dot = true;\n        } else {\n            break;\n        }\n    }\n    if (!any) return -1;\n    while (frac_digits < 9) {\n        frac *= 10;\n        ++frac_digits;\n    }\n    return sec * 1000000000LL + frac;\n}\n\nstatic long long compute_offset_ns() {\n    long long fake_boot_ns = parse_uptime_ns();\n    if (fake_boot_ns <= 0) return 0;\n    timespec_v125 ts{};\n    if (clock_gettime(CLOCK_BOOTTIME_V127, &ts) != 0) return 0;\n    long long real_boot_ns = (long long)ts.tv_sec * 1000000000LL + ts.tv_nsec;\n    long long off = fake_boot_ns - real_boot_ns;\n    const long long min_off = 86400LL * 1000000000LL;\n    const long long max_off = 40LL * 86400LL * 1000000000LL;\n    if (off < min_off || off > max_off) return 0;\n    return off;\n}\n\nstatic jlong hooked_uptime_millis() {\n    if (!orig_uptime_millis) return 0;\n    const jlong raw = orig_uptime_millis();\n    const jlong fake = raw + div_positive_i64(ghost_offset_ns, 1000000ULL);\n    if (uptime_log_budget > 0) {\n        --uptime_log_budget;\n        write_line(\"uptimeMillis\", raw, fake);\n    }\n    return fake;\n}\n\nstatic jlong hooked_nano_time() {\n    if (!orig_nano_time) return 0;\n    const jlong raw = orig_nano_time();\n    const jlong fake = raw + ghost_offset_ns;\n    if (nano_log_budget > 0) {\n        --nano_log_budget;\n        write_line(\"nanoTime\", raw, fake);\n    }\n    return fake;\n}\n\nclass V127Module final : public zygisk::ModuleBase {\npublic:\n    void onLoad(zygisk::Api *a, JNIEnv *e) override {\n        api = a;\n        env = e;\n    }\n\n    void preAppSpecialize(zygisk::AppSpecializeArgs *args) override {\n        if (!api || !env || !args) return;\n        const long long target_uid = read_target_uid(api);\n        if (target_uid <= 0 || (long long)args->uid != target_uid) return;\n\n        event_fd = api->connectCompanion();\n        if (event_fd >= 0 && !api->exemptFd(event_fd)) {\n            close(event_fd);\n            event_fd = -1;\n        }\n        if (event_fd >= 0) {\n     \
        \       char enter[192];\n            int ep = 0;\n            append_text(enter, ep, sizeof(enter), \"preAppSpecialize_enter uid=\");\n            append_i64(enter, ep, sizeof(enter), args->uid);\n            append_text(enter, ep, sizeof(enter), \" target_uid=\");\n            append_i64(enter, ep, sizeof(enter), target_uid);\n            append_char(enter, ep, sizeof(enter), '\\n');\n            write(event_fd, enter, (unsigned long)ep);\n        }\n\n        const long long off = compute_offset_ns();\n        if (event_fd >= 0) {\n            char ob[192];\n            int op = 0;\n            append_text(ob, op, sizeof(ob), \"offset_probe_ns=\");\n            append_i64(ob, op, sizeof(ob), off);\n            append_char(ob, op, sizeof(ob), '\\n');\n            write(event_fd, ob, (unsigned long)op);\n        }\n        if (off == 0) return;\n        ghost_offset_ns = off;\n\n        JNINativeMethod uptime_method[] = {\n            {\"uptimeMillis\", \"()J\", (void *)hooked_uptime_millis},\n        };\n        api->hookJniNativeMethods(env, \"android/os/SystemClock\", uptime_method, 1);\n        orig_uptime_millis = reinterpret_cast<jlong (*)()>(uptime_method[0].fnPtr);\n\n        JNINativeMethod nano_method[] = {\n            {\"nanoTime\", \"()J\", (void *)hooked_nano_time},\n        };\n        api->hookJniNativeMethods(env, \"java/lang/System\", nano_method, 1);\n        orig_nano_time = reinterpret_cast<jlong (*)()>(nano_method[0].fnPtr);\n\n        char b[384];\n        int p = 0;\n        append_text(b, p, sizeof(b), \"preAppSpecialize uid=\");\n        append_i64(b, p, sizeof(b), args->uid);\n        append_text(b, p, sizeof(b), \" offset_ms=\");\n        append_i64(b, p, sizeof(b), div_positive_i64(ghost_offset_ns, 1000000ULL));\n        append_text(b, p, sizeof(b), \" uptime_hook=\");\n        append_i64(b, p, sizeof(b), orig_uptime_millis ? 1 : 0);\n        append_text(b, p, sizeof(b), \" nano_hook=\");\n        append_i64(b, p, sizeof(b), orig_nano_time ? 1 : 0);\n        append_char(b, p, sizeof(b), '\\n');\n        if (event_fd >= 0) write(event_fd, b, (unsigned long)p);\n    }\n\nprivate:\n    zygisk::Api *api = nullptr;\n    JNIEnv *env = nullptr;\n};\n\nextern \"C\" __attribute__((visibility(\"default\")))\nvoid zygisk_companion_entry(int client) {\n    int out = open(\"/data/local/tmp/V127-app-clock-hook.log\",\n                   O_WRONLY_V127 | O_CREAT_V127 | O_APPEND_V127, 0666);\n    if (out >= 0) fchmod(out, 0644);\n    char b[512];\n    int newline_count = 0;\n    while (newline_count < 10) {\n        pollfd_v127 pfd{client, POLLIN_V127, 0};\n        int pr = poll(&pfd, 1, 15000);\n        if (pr <= 0) break;\n        long n = read(client, b, sizeof(b));\n        if (n <= 0) break;\n        if (out >= 0) write(out, b, (unsigned long)n);\n        for (long i = 0; i < n; ++i) if (b[i] == '\\n') ++newline_count;\n    }\n    if (out >= 0) close(out);\n    close(client);\n}\n\nextern \"C\" __attribute__((visibility(\"default\")))\nvoid zygisk_module_entry(zygisk::internal::api_table *table, JNIEnv *env) {\n    static zygisk::Api api;\n    static V127Module module;\n    static zygisk::internal::module_abi abi(&module);\n    api.tbl = table;\n    if (!table || !table->registerModule || !table->registerModule(table, &abi)) return;\n    module.onLoad(&api, env);\n}\nEOF_V127_MODULE_CPP\n\nchmod 0755 \"$MODDIR/customize.sh\" \"$MODDIR/post-fs-data.sh\" \"$MODDIR/post-mount.sh\" \"$MODDIR/boot-completed.sh\" \"$MODDIR/service.sh\" \"$MODDIR/bin/logcat-wrapper\"\nchmod 0644 \"$MODDIR/module.prop\" \"$MODDIR/target_package\" \"$MODDIR/kernel_localversion_expected\" \"$MODDIR/skip_mount\" \"$MODDIR/src/zygisk_min.hpp\" \"$MODDIR/src/module.cpp\"\nsh -n \"$MODDIR/customize.sh\"\nsh -n \"$MODDIR/post-fs-data.sh\"\nsh -n \"$MODDIR/post-mount.sh\"\nsh -n \"$MODDIR/boot-completed.sh\"\nsh -n \"$MODDIR/service.sh\"\nsh -n \"$MODDIR/bin/logcat-wrapper\"\ngrep -qx 'id=v127_ghost_guard' \"$MODDIR/module.prop\"\ngrep -qx 'versionCode=1270' \"$MODDIR/module.prop\"\ngrep -Fxqx \"$TARGET_PACKAGE\" \"$MODDIR/target_package\"\
        \ngrep -Fxqx -- \"$KERNEL_LOCALVERSION\" \"$MODDIR/kernel_localversion_expected\"\ngrep -q 'v1251_ghost_guard' \"$MODDIR/customize.sh\"\ngrep -q '^#define ZYGISK_API_VERSION 4$' \"$MODDIR/src/zygisk_min.hpp\"\ngrep -q 'preAppSpecialize_enter uid=' \"$MODDIR/src/module.cpp\"\ngrep -q 'offset_probe_ns=' \"$MODDIR/src/module.cpp\"\n\nCXX=\"$HOME/.cache/weebx-clang/clang/bin/clang++\"\n[ -x \"$CXX\" ] || CXX=\"$(command -v clang++ || true)\"\nif [ -z \"$CXX\" ] || [ ! -x \"$CXX\" ]; then\n  echo \"ERROR: clang++ unavailable for V127 Zygisk build\" | tee -a setup.log\n  exit 1\nfi\nCXX_VERSION_FULL=\"$(\"$CXX\" --version 2>&1)\"\nCXX_VERSION_FIRST=\"$(printf '%s\\n' \"$CXX_VERSION_FULL\" | sed -n '1p')\"\necho \"V127 Zygisk compiler: $CXX_VERSION_FIRST\" | tee -a setup.log\n\n# ReZygisk/BreZygisk uses a custom linker. V125.1 produced a -nostdlib SO with\n# no DT_NEEDED entry and file(1) reported static-pie. Create tiny link-only\n# libc stubs so the final module retains unresolved Android libc imports but\n# advertises a normal DT_NEEDED libc.so dependency to the custom linker.\ncat >\"$MODDIR/linkstub/empty.c\" <<'EOF_V127_LIBC_STUB'\nvoid __v127_libc_link_stub(void) {}\nEOF_V127_LIBC_STUB\n\"$CXX\" --target=aarch64-linux-android24 -fPIC -shared -nostdlib \\\n  -Wl,-soname,libc.so -o \"$MODDIR/linkstub/arm64-v8a/libc.so\" \"$MODDIR/linkstub/empty.c\"\n\"$CXX\" --target=armv7a-linux-androideabi24 -fPIC -shared -nostdlib \\\n  -Wl,-soname,libc.so -o \"$MODDIR/linkstub/armeabi-v7a/libc.so\" \"$MODDIR/linkstub/empty.c\"\n\nCOMMON_FLAGS=(\n  -fPIC -shared -nostdlib\n  -fno-exceptions -fno-rtti -fno-threadsafe-statics -fno-use-cxa-atexit\n  -Wl,--hash-style=gnu -Wl,--build-id=none -Wl,--allow-shlib-undefined -Wl,--no-as-needed\n)\n\"$CXX\" --target=aarch64-linux-android24 \"${COMMON_FLAGS[@]}\" \\\n  -L\"$MODDIR/linkstub/arm64-v8a\" -lc -Wl,-soname,v127_app_clock.so \\\n  -o \"$MODDIR/zygisk/arm64-v8a.so\" \"$MODDIR/src/module.cpp\"\n\"$CXX\" --target=armv7a-linux-androideabi24 \"${COMMON_FLAGS[@]}\" \\\n  -L\"$MODDIR/linkstub/armeabi-v7a\" -lc -Wl,-soname,v127_app_clock.so \\\n  -o \"$MODDIR/zygisk/armeabi-v7a.so\" \"$MODDIR/src/module.cpp\"\nchmod 0755 \"$MODDIR/zygisk/arm64-v8a.so\" \"$MODDIR/zygisk/armeabi-v7a.so\"\n\nfor so in \"$MODDIR/zygisk/arm64-v8a.so\" \"$MODDIR/zygisk/armeabi-v7a.so\"; do\n  file \"$so\" | tee -a setup.log\n  SYMFILE=\"$RUNNER_TEMP/v127-$(basename \"$so\").symbols.txt\"\n  DYNFILE=\"$RUNNER_TEMP/v127-$(basename \"$so\").dynamic.txt\"\n  readelf -Ws \"$so\" >\"$SYMFILE\"\n  readelf -d \"$so\" >\"$DYNFILE\"\n  grep -q 'zygisk_module_entry' \"$SYMFILE\"\n  grep -q 'zygisk_companion_entry' \"$SYMFILE\"\n  grep -q 'NEEDED.*libc.so' \"$DYNFILE\"\n  UND=\"$(awk '$7==\"UND\" && $8!=\"\" {print $8}' \"$SYMFILE\" | sort -u | tr '\n' ' ')\"\n  echo \"V127 $(basename \"$so\") undefined: $UND\" | tee -a setup.log\n  BAD=\"$(awk '$7==\"UND\" && $8!=\"\" {print $8}' \"$SYMFILE\" | sort -u | grep -Ev '^(clock_gettime|close|fchmod|open|openat|poll|read|write)$' || true)\"\n  if [ -n \"$BAD\" ]; then\n    echo \"ERROR: unexpected V127 Zygisk undefined symbols: $BAD\" | tee -a setup.log\n    exit 1\n  fi\ndone\nrm -rf \"$MODDIR/linkstub\"\n\n# Do not bundle or replace the user's loader in V127. The runtime audit has\n# already confirmed an enabled BreZygisk/ReZygisk loader on the target device.\ncat >\"$MODDIR/deps/LOADER-POLICY.txt\" <<'EOF_V127_LOADER_POLICY'\nV127 loader policy:\n- Use an already-enabled ReZygisk/BreZygisk/Zygisk-compatible loader.\n- Do not replace or auto-install a loader.\n- V127 fixes the app module ELF/link ABI and emits staged telemetry.\nEOF_V127_LOADER_POLICY\nchmod 0644 \"$MODDIR/deps/LOADER-POLICY.txt\"\n\n(cd \"$MODDIR\" && zip -r9 \"../$MODZIP\" . >/dev/null)\nunzip -t \"$MODZIP\" >/dev/null\nunzip -p \"$MODZIP\" module.prop >\"$RUNNER_TEMP/v1272-module.prop\"\ngrep -qx 'id=v127_ghost_guard' \"$RUNNER_TEMP/v1272-module.prop\"\nfor abi in arm64-v8a armeabi-v7a; do\n  unzip -p \"$MODZIP\" \"zygisk/$abi.so\" >\"$RUNNER_TEMP/v127-$abi.so\"\n  readelf -d \"$RUNNER_TEMP/v127-$abi.so\" >\"\
        $RUNNER_TEMP/v127-$abi.dynamic.txt\"\n  readelf -Ws \"$RUNNER_TEMP/v127-$abi.so\" >\"$RUNNER_TEMP/v127-$abi.symbols.txt\"\n  grep -q 'NEEDED.*libc.so' \"$RUNNER_TEMP/v127-$abi.dynamic.txt\"\n  grep -q 'zygisk_module_entry' \"$RUNNER_TEMP/v127-$abi.symbols.txt\"\ndone\nsha256sum \"$MODZIP\" | tee -a setup.log\necho \"===== V127.2 APP CLOCK MODULE BUILD COMPLETE =====\" | tee -a setup.log\n"
    - name: Collect outputs
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\nARTIFACT_DIR=\"../${ARTIFACT_DIR}\"\nrm -rf \"$ARTIFACT_DIR\"\nmkdir -p \"$ARTIFACT_DIR/kernel\" \"$ARTIFACT_DIR/dtb-output\" \"$ARTIFACT_DIR/modules\" \\\n  \"$ARTIFACT_DIR/logs/diagnostics\" \"$ARTIFACT_DIR/tools\" \"$ARTIFACT_DIR/ksu-modules\"\n\necho \"===== COLLECT OUTPUTS =====\" | tee -a ../build.log\nBOOT_DIR=\"$OUT_DIR/arch/arm64/boot\"\n\nif [ -f \"$BOOT_DIR/Image.gz\" ]; then\n  cp -a \"$BOOT_DIR/Image.gz\" \"$ARTIFACT_DIR/kernel/Image.gz\"\nfi\nif [ -f \"$BOOT_DIR/Image\" ]; then\n  cp -a \"$BOOT_DIR/Image\" \"$ARTIFACT_DIR/kernel/Image\"\nfi\nif [ -f \"$BOOT_DIR/Image.gz-dtb\" ]; then\n  cp -a \"$BOOT_DIR/Image.gz-dtb\" \"$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only\"\nfi\n\nfind \"$BOOT_DIR\" -type f \\( -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \\) -exec cp -a {} \"$ARTIFACT_DIR/dtb-output/\" \\; 2>/dev/null || true\nfind \"$OUT_DIR\" -type f -name '*.ko' -exec cp -a {} \"$ARTIFACT_DIR/modules/\" \\; 2>/dev/null || true\n\ncp -a ../setup.log \"$ARTIFACT_DIR/logs/setup.log\" || true\ncp -a ../build.log \"$ARTIFACT_DIR/logs/build.log\" || true\ncp -a \"../${APT_NETWORK_LOG}\" \"$ARTIFACT_DIR/logs/${APT_NETWORK_LOG}\" || true\ncp -a \"$OUT_DIR/System.map\" \"$ARTIFACT_DIR/logs/System.map\" || true\ncp -a \"$OUT_DIR/Module.symvers\" \"$ARTIFACT_DIR/logs/Module.symvers\" || true\ncp -a ../V127-diagnostics/. \"$ARTIFACT_DIR/logs/diagnostics/\" || true\ncp -a ../V127-tools/. \"$ARTIFACT_DIR/tools/\" || true\ncp -a ../V127-ghost-app-clock-guard-KSU.zip \"$ARTIFACT_DIR/ksu-modules/\" || true\ncp -a ../V127.2-kernel-release.txt \"$ARTIFACT_DIR/kernel/kernel-release.txt\" || true\n\necho \"\" | tee -a ../build.log\necho \"===== ARTIFACT TREE =====\" | tee -a ../build.log\nfind \"$ARTIFACT_DIR\" -maxdepth 3 -type f -printf '%p  %s bytes\\n' | sort | tee -a ../build.log\n\nif [ ! -f \"$ARTIFACT_DIR/kernel/Image.gz\" ] && [ ! -f \"$ARTIFACT_DIR/kernel/Image\" ]; then\n  echo \"ERROR: no Image.gz/Image found. Kernel build is not usable.\" | tee -a ../build.log\n  exit 1\nfi\n"
    - name: Create AnyKernel3 flashable zip
      shell: bash
      run: "set -Eeuo pipefail\ntrap 'rc=$?; echo \"ERROR: V127.2 AnyKernel step rc=$rc line=$LINENO command=$BASH_COMMAND\" | tee -a build.log; exit $rc' ERR\nARTIFACT_DIR=\"${ARTIFACT_DIR}\"\nAK3_DIR=\"AnyKernel3-vili\"\nZIP_NAME=\"${KERNEL_NAME}-AnyKernel3-${GITHUB_RUN_NUMBER}.zip\"\n\necho \"===== CREATE ANYKERNEL3 ZIP =====\" | tee -a build.log\n# AnyKernel3 removed backwards compatibility for lowercase user variables on 2026-06-28.\n# Pin a known revision and use the current uppercase API below.\nAK3_REF=\"1c9a500dd4aa8081952523126e97eb155aed941b\"\nrm -rf \"$AK3_DIR\"\ngit clone --no-checkout https://github.com/osm0sis/AnyKernel3.git \"$AK3_DIR\" 2>&1 | tee -a build.log\ngit -C \"$AK3_DIR\" fetch --depth=1 origin \"$AK3_REF\" 2>&1 | tee -a build.log\ngit -C \"$AK3_DIR\" checkout --detach FETCH_HEAD 2>&1 | tee -a build.log\necho \"AnyKernel3 pinned commit: $(git -C \"$AK3_DIR\" rev-parse HEAD)\" | tee -a build.log\ntest \"$(git -C \"$AK3_DIR\" rev-parse HEAD)\" = \"$AK3_REF\"\nrm -rf \"$AK3_DIR/.git\" \"$AK3_DIR/.github\" \"$AK3_DIR/README.md\" \"$AK3_DIR/LICENSE\" \"$AK3_DIR/ramdisk\" \"$AK3_DIR/patch\"\n\n# Carry the V127 retained shell guards plus loader-compatible package-scoped Zygisk Java guard inside the flashable package.\n# It uses skip_mount and its own bind mounts, so no KernelSU metamodule is required.\nrm -rf \"$AK3_DIR/v127-ksu-module\"\nmkdir -p \"$AK3_DIR/v127-ksu-module\"\nunzip -q \"V127-ghost-app-clock-guard-KSU.zip\" -d \"$AK3_DIR/v127-ksu-module\"\ntest -f \"$AK3_DIR/v127-ksu-module/module.prop\"\ntest -f \"$AK3_DIR/v127-ksu-module/customize.sh\"\ntest -f \"$AK3_DIR/v127-ksu-module/post-fs-data.sh\"\ntest -f \"$AK3_DIR/v127-ksu-module/boot-completed.sh\"\ntest -f \"$AK3_DIR/v127-ksu-module/post-mount.sh\"\ntest -f \"$AK3_DIR/v127-ksu-module/bin/logcat-wrapper\"\ntest -f \"$AK3_DIR/v127-ksu-module/target_package\"\ntest -f \"$AK3_DIR/v127-ksu-module/kernel_localversion_expected\"\ntest -f \"$AK3_DIR/v127-ksu-module/service.sh\"\ntest -f \"$AK3_DIR/v127-ksu-module/zygisk/arm64-v8a.so\"\ntest -f \"$AK3_DIR/v127-ksu-module/zygisk/armeabi-v7a.so\"\ngrep -qx 'id=v127_ghost_guard' \"$AK3_DIR/v127-ksu-module/module.prop\"\ngrep -Fxqx \"$TARGET_PACKAGE\" \"$AK3_DIR/v127-ksu-module/target_package\"\ngrep -Fxqx -- \"$KERNEL_LOCALVERSION\" \"$AK3_DIR/v127-ksu-module/kernel_localversion_expected\"\n\ncat > \"$AK3_DIR/anykernel.sh\" <<'EOF'\n# AnyKernel3 Ramdisk Mod Script\n# Flash target: Xiaomi 11T Pro / vili / HyperOS 1.0.22 Android 14\n\nproperties() { '\nkernel.string=V127 KangarooX vili A14 V119.1 retained + package-scoped app clock canary\ndo.devicecheck=1\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=vili\ndevice.name2=Xiaomi 11T Pro\ndevice.name3=2107113SG\ndevice.name4=2107113SI\ndevice.name5=2107113SR\nsupported.versions=14 - 14\nsupported.patchlevels=\nsupported.vendorpatchlevels=\n'; }\n\nBLOCK=/dev/block/bootdevice/by-name/boot;\nIS_SLOT_DEVICE=auto;\nRAMDISK_COMPRESSION=auto;\nPATCH_VBMETA_FLAG=auto;\n\nV127_AK3_HOME=\"$PWD\";\n. tools/ak3-core.sh;\n\nV127_SRC=\"$V127_AK3_HOME/v127-ksu-module\";\nV127_DST=\"/data/adb/modules/v127_ghost_guard\";\nif [ -d /data/adb ] && [ -w /data/adb ] && [ -f \"$V127_SRC/module.prop\" ]; then\n  ui_print \"V127: activating KernelSU ghost app-clock canary\";\n  mkdir -p /data/adb/modules;\n  rm -rf /data/adb/modules/v120_firstboot_guard /data/adb/modules/v1201_firstboot_guard /data/adb/modules/v121_firstboot_guard /data/adb/modules/v122_ghost_guard /data/adb/modules/v123_ghost_guard /data/adb/modules/v124_ghost_guard /data/adb/modules/v125_ghost_guard /data/adb/modules/v1251_ghost_guard /data/adb/modules/v126_ghost_guard /data/adb/modules/v1261_ghost_guard \"$V127_DST\";\n  mkdir -p \"$V127_DST\";\n  cp -af \"$V127_SRC\"/. \"$V127_DST\"/;\n  chown -R 0:0 \"$V127_DST\" 2>/dev/null || true;\n  chmod 0755 \"$V127_DST/customize.sh\" \"$V127_DST/post-fs-data.sh\" \"$V127_DST/post-mount.sh\" \"$V127_DST/boot-completed.sh\" \"$V127_DST/service.sh\" \"$V127_DST/bin/logcat-wrapper\" \"$V127_DST/zygisk/arm64-v8a.so\" \"$V127_DST/zygisk/armeabi-v7a.so\"\
        \ 2>/dev/null || true;\n  chmod 0644 \"$V127_DST/module.prop\" \"$V127_DST/skip_mount\" \"$V127_DST/target_package\" \"$V127_DST/kernel_localversion_expected\" \"$V127_DST/src/module.cpp\" \"$V127_DST/src/zygisk_min.hpp\" 2>/dev/null || true;\n  rm -f \"$V127_DST/disable\" \"$V127_DST/remove\";\n  ui_print \"V127: ghost app-clock canary staged at $V127_DST\";\nelse\n  ui_print \"V127: /data/adb unavailable; ghost guard auto-activation skipped\";\n  ui_print \"V127: install the bundled KSU module manually after boot\";\nfi;\n\ndump_boot;\nwrite_boot;\nEOF\n\nif [ -f \"$ARTIFACT_DIR/kernel/Image.gz\" ]; then\n  cp -a \"$ARTIFACT_DIR/kernel/Image.gz\" \"$AK3_DIR/Image.gz\"\nelif [ -f \"$ARTIFACT_DIR/kernel/Image\" ]; then\n  cp -a \"$ARTIFACT_DIR/kernel/Image\" \"$AK3_DIR/Image\"\nelif [ -f \"$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only\" ]; then\n  echo \"WARNING: Image.gz not found, using Image.gz-dtb fallback. For HyperOS A14, Image.gz is preferred.\" | tee -a build.log\n  cp -a \"$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only\" \"$AK3_DIR/Image.gz-dtb\"\nelse\n  echo \"ERROR: no kernel image found for AnyKernel3\" | tee -a build.log\n  exit 1\nfi\n\ncat > \"$ARTIFACT_DIR/V127-README-FLASH.txt\" <<EOF\nV127 - Xiaomi 11T Pro vili - HyperOS 1.0.22 Android 14\nKernelSU legacy + SuSFS + retained V119.1/V123 ghost layers + package-scoped Java MONOTONIC canary\n\nProven V123 input evidence:\n- Root: 21 PASS / 1 WARN. ADB shell: 18 PASS / 1 WARN.\n- /proc/uptime and btime were aligned on ~17-day ghost axis.\n- ro.runtime.firstboot differed from ghost uptime by only 1 second.\n- preserved real logcat was 169552 bytes, wrapper 2659 bytes, hashes distinct.\n- logcat -v monotonic was aligned to ghost axis by 3 seconds (root) and 6 seconds (shell), watchdog timeout 0.\n- Remaining warning was framework/app session-relative MONOTONIC behavior.\n\nV127 new layer:\n- Keeps all V123 shell guards unchanged.\n- Adds Zygisk API v4 canary libraries for arm64-v8a and armeabi-v7a.\n- Resolves only the workflow-selected target package to target_uid and hooks only that UID's app processes.\n- Attempts android.os.SystemClock.uptimeMillis() and java.lang.System.nanoTime() JNI native entries.\n- Uses fake /proc/uptime minus real CLOCK_BOOTTIME to derive the existing ghost offset.\n- Does NOT hook elapsedRealtime because retained BOOTTIME is already ghosted.\n- Does NOT load into system_server; other apps remain untouched.\n- Any missing target UID, Zygisk loader, invalid offset, or JNI lookup is fail-open.\n\nDependency/bootstrap:\n- V127 does not replace the installed Zygisk implementation; the audited target device already has an enabled BreZygisk/ReZygisk-compatible loader.\n- V127 fixes the app module ELF to a custom-linker-friendly dynamic libc.so form and emits staged loader/hook telemetry.\n- V127 install-time migration removes stale V124/V125/V125.1 ghost Zygisk modules so only one clock-hook generation competes for the target UID.\n- If dependency staging fails, firstboot/logcat guards still work and the Java canary remains fail-open.\n\nValidation after boot:\n1. Open the workflow-selected target package once.\n2. su -c 'cat /data/local/tmp/V127-ghost-guard.log'\n3. su -c 'cat /data/local/tmp/V127-app-clock-hook.log'\n4. su -c 'cat /data/adb/modules/v127_ghost_guard/target_uid'\n5. logcat -v monotonic -d -t 10\n6. Run tools/V127-check-ghost-uptime-noroot.sh as root and adb shell.\n\nSafety boundary:\nV127 does not change global vDSO, CLOCK_MONOTONIC core, ktime_get, hrtimer, futex, scheduler, alarm/timer deadlines, or system_server. Direct native app clock_gettime(CLOCK_MONOTONIC/RAW) remains a later V127 candidate only if the V127 Java canary is stable.\nEOF\n\nmkdir -p \"$ARTIFACT_DIR/flashable\"\n(cd \"$AK3_DIR\" && zip -r9 \"../$ZIP_NAME\" . -x '*.git*' 2>&1 | tee -a ../build.log)\nmv \"$ZIP_NAME\" \"$ARTIFACT_DIR/flashable/$ZIP_NAME\"\n\necho \"\" | tee -a build.log\necho \"===== FLASHABLE ZIP =====\" | tee -a build.log\nls -lh \"$ARTIFACT_DIR/flashable\" | tee -a build.log\n\necho \"===== FLASHABLE ZIP PREFLIGHT =====\"\
        \ | tee -a build.log\nAK_LIST=\"$RUNNER_TEMP/v1272-anykernel-list.txt\"\nAK_SCRIPT=\"$RUNNER_TEMP/v1272-anykernel.sh\"\nAK_PROP=\"$RUNNER_TEMP/v1272-module.prop\"\nAK_WRAP=\"$RUNNER_TEMP/v1272-logcat-wrapper\"\nAK_TARGET=\"$RUNNER_TEMP/v1272-target-package\"\nAK_KLV=\"$RUNNER_TEMP/v1272-kernel-localversion\"\nAK_SERVICE=\"$RUNNER_TEMP/v1272-service.sh\"\nAK_POSTFS=\"$RUNNER_TEMP/v1272-post-fs-data.sh\"\nAK_POSTMOUNT=\"$RUNNER_TEMP/v1272-post-mount.sh\"\n\nunzip -l \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" >\"$AK_LIST\"\ncat \"$AK_LIST\" | tee -a build.log\nunzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" anykernel.sh >\"$AK_SCRIPT\"\nunzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" v127-ksu-module/module.prop >\"$AK_PROP\"\nunzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" v127-ksu-module/bin/logcat-wrapper >\"$AK_WRAP\"\nunzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" v127-ksu-module/target_package >\"$AK_TARGET\"\nunzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" v127-ksu-module/kernel_localversion_expected >\"$AK_KLV\"\nunzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" v127-ksu-module/service.sh >\"$AK_SERVICE\"\nunzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" v127-ksu-module/post-fs-data.sh >\"$AK_POSTFS\"\nunzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" v127-ksu-module/post-mount.sh >\"$AK_POSTMOUNT\"\n\ngrep -E '[[:space:]]Image\\.gz$' \"$AK_LIST\" >/dev/null\ngrep '^BLOCK=' \"$AK_SCRIPT\" >/dev/null\ngrep '^IS_SLOT_DEVICE=' \"$AK_SCRIPT\" >/dev/null\ngrep -E '[[:space:]]v127-ksu-module/module\\.prop$' \"$AK_LIST\" >/dev/null\ngrep -qx 'id=v127_ghost_guard' \"$AK_PROP\"\ngrep 'V127: ghost app-clock canary staged' \"$AK_SCRIPT\" >/dev/null\ngrep -E '[[:space:]]v127-ksu-module/bin/logcat-wrapper$' \"$AK_LIST\" >/dev/null\nsh -n \"$AK_WRAP\"\ngrep '/dev/.v127-logcat-real' \"$AK_WRAP\" >/dev/null\ngrep -Fxqx \"$TARGET_PACKAGE\" \"$AK_TARGET\"\ngrep -Fxqx -- \"$KERNEL_LOCALVERSION\" \"$AK_KLV\"\nsh -n \"$AK_SERVICE\"\nfor abi in arm64-v8a armeabi-v7a; do\n  unzip -p \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" \"v127-ksu-module/zygisk/$abi.so\" >\"$RUNNER_TEMP/ak-v127-$abi.so\"\n  readelf -Ws \"$RUNNER_TEMP/ak-v127-$abi.so\" >\"$RUNNER_TEMP/ak-v127-$abi.symbols.txt\"\n  grep 'zygisk_module_entry' \"$RUNNER_TEMP/ak-v127-$abi.symbols.txt\" >/dev/null\n  grep 'zygisk_companion_entry' \"$RUNNER_TEMP/ak-v127-$abi.symbols.txt\" >/dev/null\ndone\ngrep 'cp -f /system/bin/logcat' \"$AK_POSTFS\" >/dev/null\ngrep 'real_size.*-le 8192' \"$AK_POSTFS\" >/dev/null\nif grep 'mount --bind /system/bin/logcat' \"$AK_POSTFS\" >/dev/null; then\n  echo \"ERROR: V122 recursive file-bind preservation accidentally reintroduced\" | tee -a build.log\n  exit 1\nfi\ngrep '/dev/.v127-logcat-wrapper' \"$AK_POSTMOUNT\" >/dev/null\nif grep -E '^(block|is_slot_device|ramdisk_compression|patch_vbmeta_flag)=' \"$AK_SCRIPT\" >/dev/null; then\n  echo \"ERROR: legacy lowercase AnyKernel3 variables detected\" | tee -a build.log\n  exit 1\nfi\nsha256sum \"$ARTIFACT_DIR/flashable/$ZIP_NAME\" | tee -a build.log\necho \"===== V127.2 ANYKERNEL PREFLIGHT COMPLETE =====\" | tee -a build.log\n"
    - name: Pack modules inspection zip
      shell: bash
      run: "set -Eeuo pipefail\nARTIFACT_DIR=\"${ARTIFACT_DIR}\"\necho \"===== PACK MODULES INSPECTION ZIP =====\" | tee -a build.log\nFIRST_KO=\"$(find \"$ARTIFACT_DIR/modules\" -type f -name '*.ko' -print -quit 2>/dev/null || true)\"\nif [ -n \"$FIRST_KO\" ]; then\n  (cd \"$ARTIFACT_DIR/modules\" && zip -r9 \"../${KERNEL_NAME}-modules-inspection-only-${GITHUB_RUN_NUMBER}.zip\" . 2>&1 | tee -a ../../build.log)\nelse\n  echo \"No modules found.\" | tee -a build.log\nfi\n"
    - name: Verify V127 artifact and kernel release before upload
      if: success()
      shell: bash
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "ERROR: V127.2 final preflight rc=$rc line=$LINENO command=$BASH_COMMAND" | tee -a build.log; exit $rc'' ERR

        echo "===== V127.2 FINAL ARTIFACT PAYLOAD PREFLIGHT =====" | tee -a build.log

        test -d "${ARTIFACT_DIR}"

        test -s "${ARTIFACT_DIR}/kernel/Image.gz"

        test -s "${ARTIFACT_DIR}/kernel/kernel-release.txt"

        grep -Fqx "$(cat V127.2-kernel-release.txt)" "${ARTIFACT_DIR}/kernel/kernel-release.txt"

        test -s "${ARTIFACT_DIR}/ksu-modules/V127-ghost-app-clock-guard-KSU.zip"

        FLASH_ZIP="$(find "${ARTIFACT_DIR}/flashable" -maxdepth 1 -type f -name "${KERNEL_NAME}-AnyKernel3-*.zip" -print -quit)"

        test -n "$FLASH_ZIP"

        test -s "$FLASH_ZIP"

        unzip -t "$FLASH_ZIP" >/dev/null

        echo "artifact_dir=${ARTIFACT_DIR}" | tee -a build.log

        echo "kernel_release=$(cat "${ARTIFACT_DIR}/kernel/kernel-release.txt")" | tee -a build.log

        echo "flash_zip=$FLASH_ZIP" | tee -a build.log

        echo "flash_zip_bytes=$(stat -c %s "$FLASH_ZIP")" | tee -a build.log

        echo "ksu_zip_bytes=$(stat -c %s "${ARTIFACT_DIR}/ksu-modules/V127-ghost-app-clock-guard-KSU.zip")" | tee -a build.log

        echo "V127.2 artifact payload preflight PASS" | tee -a build.log

        '
    - name: Finalize artifact logs
      if: always()
      shell: bash
      run: "set +e\nif [ -d \"${ARTIFACT_DIR}\" ]; then\n  mkdir -p \"${ARTIFACT_DIR}/logs\"\n  cp -a setup.log \"${ARTIFACT_DIR}/logs/setup.log\" 2>/dev/null || true\n  cp -a build.log \"${ARTIFACT_DIR}/logs/build.log\" 2>/dev/null || true\n  cp -a \"${APT_NETWORK_LOG}\" \"${ARTIFACT_DIR}/logs/${APT_NETWORK_LOG}\" 2>/dev/null || true\n  echo \"Final artifact logs refreshed after AnyKernel3 packaging.\" | tee -a build.log\n  cp -a build.log \"${ARTIFACT_DIR}/logs/build.log\" 2>/dev/null || true\nfi\n"
    - name: Show real errors if failed
      if: failure()
      shell: bash
      run: "echo \"===== SETUP ERROR LINES =====\"\nif [ -f setup.log ]; then\n  grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\\.lld|make(\\[[0-9]+\\])?: \\*\\*\\*' setup.log | tail -200 || true\nelse\n  echo \"setup.log missing\"\nfi\n\necho \"\"\necho \"===== APT NETWORK LOG =====\"\nif [ -f \"${APT_NETWORK_LOG}\" ]; then\n  tail -250 \"${APT_NETWORK_LOG}\" || true\nelse\n  echo \"${APT_NETWORK_LOG} missing\"\nfi\n\necho \"\"\necho \"===== BUILD ERROR LINES =====\"\nif [ -f build.log ]; then\n  grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\\.lld|make(\\[[0-9]+\\])?: \\*\\*\\*' build.log | tail -300 || true\n  echo \"\"\n  echo \"===== LAST 250 BUILD LINES =====\"\n  tail -250 build.log || true\nelse\n  echo \"build.log missing\"\nfi\n"
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: V127.2-vili-hyperos-a14-app-clock-guard-${{ github.run_number }}
        path: '${{ env.ARTIFACT_DIR }}/**

          setup.log

          build.log

          V127-apt-network.log

          '
        if-no-files-found: error
        compression-level: 6
        retention-days: 14
