    - name: Prepare defconfig
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\nexport PATH=\"$CLANG_DIR/bin:$PATH\"\nexport CCACHE_DIR=\"$HOME/.ccache\"\nexport KBUILD_BUILD_USER=\"$KBUILD_BUILD_USER\"\nexport KBUILD_BUILD_HOST=\"$KBUILD_BUILD_HOST\"\nexport KBUILD_BUILD_VERSION=\"$KERNEL_BUILD_VERSION\"\nexport KBUILD_BUILD_TIMESTAMP=\"$KERNEL_BUILD_TIMESTAMP\"\nexport SOURCE_DATE_EPOCH=\"$KERNEL_SOURCE_DATE_EPOCH\"\nccache -M 5G || true\nccache -z || true\n\nMAKE_ARGS=(\n  O=\"$OUT_DIR\"\n  ARCH=arm64\n  SUBARCH=arm64\n  LLVM=1\n  LLVM_IAS=1\n  CC=\"ccache clang\"\n  HOSTCC=\"ccache clang\"\n  HOSTCXX=\"ccache clang++\"\n  CLANG_TRIPLE=aarch64-linux-gnu-\n  CROSS_COMPILE=aarch64-linux-gnu-\n  CROSS_COMPILE_ARM32=arm-linux-gnueabi-\n  AR=llvm-ar\n  NM=llvm-nm\n  LD=ld.lld\n  OBJCOPY=llvm-objcopy\n  OBJDUMP=llvm-objdump\n  STRIP=llvm-strip\n)\n\necho \"===== MAKE ${DEFCONFIG} =====\" | tee -a ../build.log\nrm -rf \"$OUT_DIR\"\nmkdir -p \"$OUT_DIR\"\nmake \"${MAKE_ARGS[@]}\" \"$DEFCONFIG\" 2>&1 | tee -a ../build.log\ntest -f \"$OUT_DIR/.config\"\n\necho \"\" | tee -a ../build.log\necho \"===== V127 WORKFLOW KERNEL VERSION OVERRIDE =====\" | tee -a ../build.log\ncase \"${KERNEL_LOCALVERSION}\" in\n  -*) ;;\n  *) echo \"ERROR: kernel_localversion must start with '-'\" | tee -a ../build.log; exit 1 ;;\nesac\nLOCALVERSION_BODY=\"${KERNEL_LOCALVERSION#-}\"\ncase \"$LOCALVERSION_BODY\" in\n  ''|*[!A-Za-z0-9._+-]*) echo \"ERROR: kernel_localversion contains unsupported characters; allowed: A-Za-z0-9._+-\" | tee -a ../build.log; exit 1 ;;\nesac\nif [ \"${#KERNEL_LOCALVERSION}\" -gt 56 ]; then echo \"ERROR: kernel_localversion is longer than 56 characters\" | tee -a ../build.log; exit 1; fi\ncase \"${KERNEL_BUILD_VERSION}\" in ''|*[!0-9]*) echo \"ERROR: kernel_build_version must be numeric\" | tee -a ../build.log; exit 1 ;; esac\ncase \"${TARGET_PACKAGE}\" in ''|*[!A-Za-z0-9._-]*) echo \"ERROR: target_package contains unsupported characters\" | tee -a ../build.log; exit 1 ;; esac\n[ -x scripts/config ] || { echo \"ERROR: scripts/config is required for deterministic LOCALVERSION override\" | tee -a ../build.log; exit 1; }\nscripts/config --file \"$OUT_DIR/.config\" --set-str LOCALVERSION \"$KERNEL_LOCALVERSION\"\nscripts/config --file \"$OUT_DIR/.config\" -d LOCALVERSION_AUTO\necho \"KERNEL_LOCALVERSION=$KERNEL_LOCALVERSION\" | tee -a ../build.log\necho \"KERNEL_BUILD_VERSION=$KERNEL_BUILD_VERSION\" | tee -a ../build.log\necho \"TARGET_PACKAGE=$TARGET_PACKAGE\" | tee -a ../build.log\n\necho \"\" | tee -a ../build.log\necho \"===== CONFIG AFTER DEFCONFIG =====\" | tee -a ../build.log\ngrep -nE \"CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_BUILD_ARM64_DT_OVERLAY|CONFIG_KSU|CONFIG_KERNELSU|CONFIG_SUSFS|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_LTO\" \"$OUT_DIR/.config\" | tee -a ../build.log || true\n\necho \"\" | tee -a ../build.log\nif [ \"${ENABLE_KERNELSU}\" = \"true\" ]; then\n  echo \"\" | tee -a ../build.log\n  echo \"===== FORCE KERNELSU MANUAL-HOOK CONFIG BEFORE OLDDEFCONFIG =====\" | tee -a ../build.log\n  if [ -x scripts/config ]; then\n    scripts/config --file \"$OUT_DIR/.config\" \\\n      -e KSU \\\n      -e KSU_MANUAL_HOOK \\\n      -d KSU_KPROBES_HOOK \\\n      -d KSU_DEBUG \\\n      -e KSU_SUSFS \\\n      -d KSU_SUSFS_SUS_KSTAT \\\n      -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \\\n      -e KSU_SUSFS_SUS_SU \\\n      -e KSU_SUSFS_OPEN_REDIRECT \\\n      -d KSU_SUSFS_ENABLE_LOG || true\n  else\n    sed -i '/CONFIG_KSU/d;/CONFIG_KERNELSU/d' \"$OUT_DIR/.config\" 2>/dev/null || true\n    printf '%s\\n' \\\n      'CONFIG_KSU=y' \\\n      'CONFIG_KSU_MANUAL_HOOK=y' \\\n      '# CONFIG_KSU_KPROBES_HOOK is not set' \\\n      '# CONFIG_KSU_DEBUG is not set' \\\n      '# CONFIG_KSU_SUSFS_SUS_KSTAT is not set' \\\n      'CONFIG_KSU_SUSFS_SUS_SU=y' \\\n      '# CONFIG_KSU_SUSFS_ENABLE_LOG is not set' \\\n      >> \"$OUT_DIR/.config\"\n  fi\n  grep -nE \"CONFIG_KSU|CONFIG_KERNELSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS\" \"$OUT_DIR/.config\" | tee -a ../build.log || true\nfi\n\necho \"===== OLDDEFCONFIG =====\" | tee -a ../build.log\nmake \"${MAKE_ARGS[@]}\"\
        \ olddefconfig 2>&1 | tee -a ../build.log\n\nif [ \"${ENABLE_KERNELSU}\" = \"true\" ] && [ -x scripts/config ]; then\n  echo \"\" | tee -a ../build.log\n  echo \"===== FORCE DISABLE SUSFS SUS_KSTAT AFTER OLDDEFCONFIG V61 =====\" | tee -a ../build.log\n  scripts/config --file \"$OUT_DIR/.config\" -d KSU_SUSFS_SUS_KSTAT || true\n  make \"${MAKE_ARGS[@]}\" olddefconfig 2>&1 | tee -a ../build.log\nfi\n\necho \"\" | tee -a ../build.log\necho \"===== CONFIG AFTER OLDDEFCONFIG V61 =====\" | tee -a ../build.log\ngrep -nE \"CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO|CONFIG_KSU|CONFIG_KERNELSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS\" \"$OUT_DIR/.config\" | tee -a ../build.log || true\n\necho \"\" | tee -a ../build.log\necho \"===== V127.2 SYNCCONFIG BEFORE KERNELRELEASE =====\" | tee -a ../build.log\n# scripts/setlocalversion reads include/config/auto.conf. The kernelrelease target is intentionally\n# no-sync-config in this 5.4 tree, so synchronize Kconfig explicitly after scripts/config/olddefconfig.\nmake \"${MAKE_ARGS[@]}\" syncconfig 2>&1 | tee -a ../build.log\ntest -f \"$OUT_DIR/include/config/auto.conf\"\n\necho \"-- .config LOCALVERSION --\" | tee -a ../build.log\ngrep -nE '^CONFIG_LOCALVERSION=|^# CONFIG_LOCALVERSION_AUTO' \"$OUT_DIR/.config\" | tee -a ../build.log || true\necho \"-- auto.conf LOCALVERSION --\" | tee -a ../build.log\ngrep -nE '^CONFIG_LOCALVERSION=|^CONFIG_LOCALVERSION_AUTO=' \"$OUT_DIR/include/config/auto.conf\" | tee -a ../build.log || true\n\nCFG_LV=\"$(sed -n 's/^CONFIG_LOCALVERSION=//p' \"$OUT_DIR/.config\" | head -n1)\"\nAUTO_LV=\"$(sed -n 's/^CONFIG_LOCALVERSION=//p' \"$OUT_DIR/include/config/auto.conf\" | head -n1)\"\nCFG_LV=\"$(printf '%s' \"$CFG_LV\" | sed 's/^\"//;s/\"$//')\"\nAUTO_LV=\"$(printf '%s' \"$AUTO_LV\" | sed 's/^\"//;s/\"$//')\"\necho \"requested_localversion=$KERNEL_LOCALVERSION\" | tee -a ../build.log\necho \"dotconfig_localversion=$CFG_LV\" | tee -a ../build.log\necho \"autoconf_localversion=$AUTO_LV\" | tee -a ../build.log\nif [ \"$CFG_LV\" != \"$KERNEL_LOCALVERSION\" ]; then\n  echo \"ERROR: .config LOCALVERSION does not match requested value\" | tee -a ../build.log\n  exit 1\nfi\nif [ \"$AUTO_LV\" != \"$KERNEL_LOCALVERSION\" ]; then\n  echo \"ERROR: include/config/auto.conf LOCALVERSION is stale after syncconfig\" | tee -a ../build.log\n  exit 1\nfi\nif grep -q '^CONFIG_LOCALVERSION_AUTO=y' \"$OUT_DIR/include/config/auto.conf\"; then\n  echo \"ERROR: CONFIG_LOCALVERSION_AUTO unexpectedly enabled in auto.conf\" | tee -a ../build.log\n  exit 1\nfi\n\nFINAL_KREL=\"$(make -s \"${MAKE_ARGS[@]}\" kernelrelease)\"\necho \"V127.2 kernelrelease=$FINAL_KREL\" | tee -a ../build.log\ncase \"$FINAL_KREL\" in\n  *\"$KERNEL_LOCALVERSION\") ;;\n  *)\n    echo \"ERROR: kernelrelease does not end with requested LOCALVERSION: $KERNEL_LOCALVERSION\" | tee -a ../build.log\n    echo \"===== DEBUG scripts/setlocalversion =====\" | tee -a ../build.log\n    (cd \"$OUT_DIR\" && \"$OLDPWD/scripts/setlocalversion\" \"$OLDPWD\" 2>&1) | tee -a ../build.log || true\n    exit 1\n    ;;\nesac\nprintf '%s\\n' \"$FINAL_KREL\" > ../V127.2-kernel-release.txt\nif [ \"${ENABLE_KERNELSU}\" = \"true\" ]; then\n  if ! grep -q '^CONFIG_KSU=y' \"$OUT_DIR/.config\"; then\n    echo \"ERROR: CONFIG_KSU=y missing in final .config\" | tee -a ../build.log\n    echo \"===== KernelSU Kconfig =====\" | tee -a ../build.log\n    sed -n '1,220p' drivers/kernelsu/Kconfig | tee -a ../build.log || true\n    exit 1\n  fi\n  if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' \"$OUT_DIR/.config\"; then\n    echo \"ERROR: CONFIG_KSU_MANUAL_HOOK=y missing in final .config\" | tee -a ../build.log\n    echo \"This kernel already has manual KernelSU hooks, so KPROBES mode is not the target.\" | tee -a ../build.log\n    echo \"===== KernelSU Kconfig =====\" | tee -a ../build.log\n    sed -n '1,260p' drivers/kernelsu/Kconfig | tee -a ../build.log || true\n    exit 1\n  fi\n  if grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y' \"$OUT_DIR/.config\"; then\n    echo \"ERROR: CONFIG_KSU_SUSFS_SUS_KSTAT must be disabled in V61 to avoid 1970\
        \ stat artifacts\" | tee -a ../build.log\n    grep -nE \"CONFIG_KSU_SUSFS_SUS_KSTAT|CONFIG_KSU_SUSFS|CONFIG_KSU\" \"$OUT_DIR/.config\" | tee -a ../build.log || true\n    exit 1\n  fi\n  if ! grep -q '^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' \"$OUT_DIR/.config\"; then\n    echo \"ERROR: CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y missing in final .config\" | tee -a ../build.log\n    grep -nE \"CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS|CONFIG_KSU_SUSFS|CONFIG_KSU\" \"$OUT_DIR/.config\" | tee -a ../build.log || true\n    echo \"===== KernelSU Kconfig HIDE_SYMBOLS block =====\" | tee -a ../build.log\n    grep -nA8 -B4 \"config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS\" drivers/kernelsu/Kconfig | tee -a ../build.log || true\n    exit 1\n  fi\n  if ! grep -q '^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \"$OUT_DIR/.config\"; then\n    echo \"ERROR: CONFIG_KSU_SUSFS_OPEN_REDIRECT=y missing in final .config\" | tee -a ../build.log\n    grep -nE \"CONFIG_KSU_SUSFS_OPEN_REDIRECT|CONFIG_KSU_SUSFS|CONFIG_KSU\" \"$OUT_DIR/.config\" | tee -a ../build.log || true\n    echo \"===== KernelSU Kconfig OPEN_REDIRECT block =====\" | tee -a ../build.log\n    grep -nA8 -B4 \"config KSU_SUSFS_OPEN_REDIRECT\" drivers/kernelsu/Kconfig | tee -a ../build.log || true\n    exit 1\n  fi\n  if ! grep -q '^CONFIG_KSU_SUSFS_SUS_SU=y' \"$OUT_DIR/.config\"; then\n    echo \"ERROR: CONFIG_KSU_SUSFS_SUS_SU=y missing in final .config\" | tee -a ../build.log\n    echo \"V42 requires SUS_SU, OPEN_REDIRECT, and HIDE_SYMBOLS enabled after config forcing. Check drivers/kernelsu/Kconfig and fs/Makefile registration.\" | tee -a ../build.log\n    grep -nE \"CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_KSU_SUSFS_SUS_SU|CONFIG_KSU_KPROBES_HOOK|CONFIG_KSU_MANUAL_HOOK\" \"$OUT_DIR/.config\" | tee -a ../build.log || true\n    echo \"===== KernelSU Kconfig SUS_SU block =====\" | tee -a ../build.log\n    grep -nA8 -B4 \"config KSU_SUSFS_SUS_SU\" drivers/kernelsu/Kconfig | tee -a ../build.log || true\n    exit 1\n  fi\nfi\n"
    - name: V119 final prebuild vDSO rollback lock
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\n\necho \"===== V119 FINAL PREBUILD VDSO ROLLBACK LOCK =====\" | tee -a ../setup.log\nprintf '%s  %s\\n' \\\n  66e04000c62e078883df4b4f0b48c913e1342cc5ffc76d88e51d59d0d8309c07 \\\n  lib/vdso/gettimeofday.c | sha256sum -c - | tee -a ../setup.log\nprintf '%s  %s\\n' \\\n  e14f82fd54042e80cda5dc161368fead68cfdf9a47e7fd6492b6268f0be70bf8 \\\n  kernel/time/vsyscall.c | sha256sum -c - | tee -a ../setup.log\n\nif grep -RqsE 'Vili CI V(92|97|100A|101|118)|ghost_vdso_shift_(hres|coarse)|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|force CLOCK_MONOTONIC through syscall fallback' \\\n    lib/vdso/gettimeofday.c kernel/time/vsyscall.c; then\n  echo \"ERROR: forbidden vDSO experiment appeared after the V119 rollback guard\" | tee -a ../setup.log\n  exit 1\nfi\necho \"V119 final lock passed: compiler will receive pristine vDSO MONOTONIC sources.\" | tee -a ../setup.log\n"
    - name: Build kernel
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\nexport PATH=\"$CLANG_DIR/bin:$PATH\"\nexport CCACHE_DIR=\"$HOME/.ccache\"\nexport KBUILD_BUILD_USER=\"$KBUILD_BUILD_USER\"\nexport KBUILD_BUILD_HOST=\"$KBUILD_BUILD_HOST\"\nexport KBUILD_BUILD_VERSION=\"$KERNEL_BUILD_VERSION\"\nexport KBUILD_BUILD_TIMESTAMP=\"$KERNEL_BUILD_TIMESTAMP\"\nexport SOURCE_DATE_EPOCH=\"$KERNEL_SOURCE_DATE_EPOCH\"\n\nMAKE_ARGS=(\n  O=\"$OUT_DIR\"\n  ARCH=arm64\n  SUBARCH=arm64\n  LLVM=1\n  LLVM_IAS=1\n  CC=\"ccache clang\"\n  HOSTCC=\"ccache clang\"\n  HOSTCXX=\"ccache clang++\"\n  CLANG_TRIPLE=aarch64-linux-gnu-\n  CROSS_COMPILE=aarch64-linux-gnu-\n  CROSS_COMPILE_ARM32=arm-linux-gnueabi-\n  AR=llvm-ar\n  NM=llvm-nm\n  LD=ld.lld\n  OBJCOPY=llvm-objcopy\n  OBJDUMP=llvm-objdump\n  STRIP=llvm-strip\n)\n\nJOBS=\"$(nproc --all)\"\necho \"===== BUILD KERNEL IMAGE =====\" | tee -a ../build.log\necho \"Jobs: $JOBS\" | tee -a ../build.log\necho \"KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP\" | tee -a ../build.log\necho \"SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH\" | tee -a ../build.log\necho \"KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION\" | tee -a ../build.log\necho \"Requested LOCALVERSION=$KERNEL_LOCALVERSION\" | tee -a ../build.log\nmake \"${MAKE_ARGS[@]}\" -j\"$JOBS\" Image.gz 2>&1 | tee -a ../build.log\n\necho \"\" | tee -a ../build.log\necho \"===== BUILD MODULES OPTIONAL =====\" | tee -a ../build.log\nif grep -q '^CONFIG_MODULES=y' \"$OUT_DIR/.config\"; then\n  make \"${MAKE_ARGS[@]}\" -j\"$JOBS\" modules 2>&1 | tee -a ../build.log\nelse\n  echo \"CONFIG_MODULES is not enabled in final .config; skipping make modules.\" | tee -a ../build.log\nfi\n\necho \"\" | tee -a ../build.log\necho \"===== BUILD DTBS OPTIONAL =====\" | tee -a ../build.log\nmake \"${MAKE_ARGS[@]}\" -j\"$JOBS\" dtbs 2>&1 | tee -a ../build.log || true\n\necho \"\" | tee -a ../build.log\necho \"===== BUILD DTBO.IMG OPTIONAL =====\" | tee -a ../build.log\necho \"Skipping make dtbo.img on GitHub Actions because this kernel tree calls python2 for mkdtimg.\" | tee -a ../build.log\necho \"DTB/DTBO inspection files are still collected from out/arch/arm64/boot/dts.\" | tee -a ../build.log\n\necho \"\" | tee -a ../build.log\necho \"===== BUILD OUTPUT QUICK LIST =====\" | tee -a ../build.log\nfind \"$OUT_DIR/arch/arm64/boot\" -maxdepth 4 -type f \\\n  \\( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \\) \\\n  -printf '%p  %s bytes\\n' | sort | tee -a ../build.log || true\n\necho \"\" | tee -a ../build.log\necho \"===== CCACHE STATS =====\" | tee -a ../build.log\nccache -s | tee -a ../build.log || true\n"
    - name: Prepare V127 generation-aware diagnostics and runtime tools
      shell: bash
      run: "set -Eeuo pipefail\ntrap 'rc=$?; echo \"ERROR: V127.2 diagnostics rc=$rc line=$LINENO command=$BASH_COMMAND\" | tee -a setup.log; echo \"===== V127.2 DIAGNOSTICS FAILURE DISK =====\" | tee -a setup.log; df -h | tee -a setup.log; exit $rc' ERR\nDIAG=V127-diagnostics\nTOOLS=V127-tools\nrm -rf \"$DIAG\" \"$TOOLS\"\nmkdir -p \"$DIAG/patched-source\" \"$TOOLS\"\n\necho \"===== V127 BUILD DIAGNOSTICS =====\" | tee -a setup.log\n{\n  echo \"workflow_marker=V126_HYPEROS_A14_AUTO_FIRSTBOOT_GUARD\"\n  echo \"kernel_source_commit=${KERNEL_SOURCE_COMMIT}\"\n  echo \"kernelsu_commit=${KSU_COMMIT}\"\n  echo \"susfs_commit=${SUSFS_COMMIT}\"\n  echo \"audio_source_commit=${AUDIO_COMPAT_SOURCE_COMMIT}\"\n  echo \"vdso_stage=${VDSO_STAGE}\"\n  echo \"current_layer=V126_DYNAMIC_ZYGISK_APP_CLOCK_GUARD_RETAINING_V119_1_KERNEL\"\n  echo \"processes_policy=readout_only_base_plus_one_per_ghost_offset_second_real_total_forks_unchanged\"\n  echo \"workflow_fix=retained_bounded_Ubuntu_only_APT_with_primary_and_fallback_mirrors\"\n  echo \"base_boot_result=V114_BUILD_BOOT_KSU_RUNTIME_PASS_AUDIO_CONFIRMATION_REQUIRED\"\n  echo \"retained_layers=V114_PROC_STAT_INTR,V111_PROC_STAT_SOFTIRQ,V110_CPUFREQ_TIME_IN_STATE,V109_SYSINFO_SINGLE_OFFSET,V108_CPUIDLE_SYSFS_TIME_READOUT\"\n  echo \"runtime_result=V1251_ROOT_23_PASS_LOGCAT_FIRSTBOOT_PASS_APP_ZYGISK_TELEMETRY_MISSING\"\n  echo \"rom=${ROM_TARGET}\"\n} >\"$DIAG/source-pins.txt\"\n\ncat >\"$DIAG/V127-runtime-analysis.txt\" <<'EOF_V126_RUNTIME_ANALYSIS'\nInputs:\n- V114 setup.log and build.log\n- V114 artifact logs.zip and patched-source snapshot\n- V113-labelled runtime reports 20250829-155423 and 20250829-155434,\n  generated by the mislabelled audit tool packaged in V114\n\nConfirmed observations:\n- V114 bounded APT completed, Image.gz compiled, and the AnyKernel3 ZIP passed\n  preflight with SHA-256 e4927368b065041791709e2915c47447cf0fab0ccf216d6f2c697fde10b9bcf3.\n- V114 booted on vili with sys.boot_completed=1 and KernelSU context u:r:ksu:s0.\n- Ghost uptime was 2,160,573 seconds while the session was about 573 seconds,\n  confirming a 25-day offset. Retained sysinfo, cpuidle, cpufreq and softirq checks passed.\n- The V114 audit was incorrectly labelled V113. Its IRQ parser summed every\n  numeric token after an IRQ label, including hardware IRQ IDs/numeric action\n  names, while excluding IPI/arch rows with nonnumeric labels. Therefore its\n  93.47 percent IRQ warning is a tool defect, not evidence of a kernel mismatch.\n- The V114 source formula adds exactly the established V88 display additions:\n  40/s arch_timer plus 4/s arch_mem_timer for every possible CPU, with the same\n  131*cpu bias. V119 corrects the audit parser to sum only CPU columns and include\n  all colon-labelled IRQ/IPI/arch rows.\n- The V115 root report exposed ctxt=4,872,817,799 over 1,386,635 displayed\n  seconds, or 3514.13/s, and passed every targeted /proc/stat comparison.\n- Android framework services still reported about 1h10m while the exposed\n  BOOTTIME axis reported about 16d1h10m.\n- The same V115 report recorded alarmtimer.0.auto suspend failure -16.\n\nV127 scope:\n- Retain V119.1 kernel/readout behavior and pristine vDSO.\n- Correct the V126-vs-V126.1 audit generation skew before judging app-hook success.\n- Add module health telemetry plus workflow-selected kernel LOCALVERSION/KBUILD_BUILD_VERSION and target package.\n- Harden /proc/stat processes at readout only by adding one synthetic historical\n  event per ghost-offset second. Real total_forks accounting remains unchanged.\n- Keep nr_context_switches accounting, total_forks/process accounting, IRQ accounting,\n  scheduler, hrtimer, vDSO, local_clock, sched_clock, ktime_get and core timekeeping unchanged.\n- Remove the V96 /proc/ghost_sched_clock_probe from the production image after it\n  proved the real MONOTONIC/RAW leak; retain that evidence in the supplied V119 logs.\n- Add a KernelSU firstboot property guard and stronger framework clock evidence. Direct MONOTONIC remains evidence-only; no vDSO/core timekeeping patch is included.\nEOF_V126_RUNTIME_ANALYSIS\n\
        \ngit -C kernel status --short --untracked-files=no >\"$DIAG/git-status-tracked.txt\" || true\ngit -C kernel diff --stat >\"$DIAG/source-diff.stat.txt\" || true\ngit -C kernel diff --no-ext-diff >\"$DIAG/source-diff.patch\" || true\nsha256sum \\\n  kernel/lib/vdso/gettimeofday.c \\\n  kernel/kernel/time/vsyscall.c \\\n  kernel/kernel/sys.c \\\n  kernel/fs/proc/stat.c \\\n  kernel/fs/proc/softirqs.c \\\n  kernel/kernel/irq/proc.c \\\n  kernel/drivers/cpuidle/sysfs.c \\\n  kernel/drivers/cpufreq/cpufreq_stats.c \\\n  kernel/techpack/audio/asoc/msm-dai-q6-v2.c \\\n  kernel/techpack/audio/asoc/msm-dai-q6-v2.h \\\n  kernel/techpack/audio/asoc/msm_dailink.h \\\n  >\"$DIAG/critical-source-sha256.txt\"\n\nfor file in \\\n  lib/vdso/gettimeofday.c \\\n  kernel/time/vsyscall.c \\\n  kernel/time/posix-timers.c \\\n  kernel/sys.c \\\n  drivers/cpuidle/sysfs.c \\\n  drivers/cpufreq/cpufreq_stats.c \\\n  include/linux/ghost_uptime.h \\\n  kernel/time/ghost_uptime.c \\\n  fs/proc/uptime.c \\\n  fs/proc/stat.c \\\n  fs/proc/softirqs.c \\\n  kernel/irq/proc.c \\\n  techpack/audio/asoc/msm-dai-q6-v2.c \\\n  techpack/audio/asoc/msm-dai-q6-v2.h \\\n  techpack/audio/asoc/msm_dailink.h\ndo\n  if [ -f \"kernel/$file\" ]; then\n    mkdir -p \"$DIAG/patched-source/$(dirname \"$file\")\"\n    cp -a \"kernel/$file\" \"$DIAG/patched-source/$file\"\n  fi\ndone\n\n{\n  echo \"V127 auto firstboot guard + MONOTONIC leak audit with retained pristine-vDSO V119.1 baseline\"\n  echo \"base=V114 build/boot/KSU/runtime PASS; physical audio confirmation remains user-supplied\"\n  echo \"runtime_finding=V115 root audit passed 15 checks with 0 warnings; framework remained near 1h10m while BOOTTIME exposed about 16d1h10m; alarmtimer suspend returned -16\"\n  echo \"changed_surface=userspace property guard artifact only; retained V119.1 kernel readout hardening and V96 probe removal\"\n  echo \"processes_policy=display-only ghost history; real total_forks accounting retained\"\n  echo \"retained=V119.1 processes, V115 ctxt, V114 intr, V111 softirq, V110 cpufreq, V109 sysinfo, V108 cpuidle, V105 POSIX times and audio-compatible sources\"\n  echo \"unchanged=nr_context_switches accounting, real total_forks/process accounting, real IRQ accounting, cpufreq/cpuidle accounting, pristine vDSO, scheduler, hrtimer, sched_clock, local_clock, ktime_get and core timekeeping\"\n  echo\n  echo \"===== V105/V109 MARKERS IN kernel/sys.c =====\"\n  grep -nE 'Vili CI V10(5|9)|vili_ghost_(times|sysinfo)|SYSCALL_DEFINE1\\((times|sysinfo)' kernel/kernel/sys.c\n  echo\n  echo \"===== RETAINED V108 MARKERS IN drivers/cpuidle/sysfs.c =====\"\n  grep -nE 'Vili CI V108|vili_ghost_cpuidle_time_show|cattr == &attr_time' kernel/drivers/cpuidle/sysfs.c\n  echo\n  echo \"===== RETAINED V110 MARKERS IN drivers/cpufreq/cpufreq_stats.c =====\"\n  grep -nE 'Vili CI V110|vili_ghost_cpufreq_time_in_state|show_time_in_state|cpufreq_stats_update' kernel/drivers/cpufreq/cpufreq_stats.c\n  echo\n  echo \"===== V111/V114/V115/V119.1 MARKERS IN fs/proc/stat.c =====\"\n  grep -nE 'Vili CI V(61|82|111|114|115|119.1)|vili_ghost_proc_stat_(softirq|intr|ctxt|processes)|intr |ctxt |processes |softirq ' kernel/fs/proc/stat.c\n  echo\n  echo \"===== RETAINED V85 MARKERS IN fs/proc/softirqs.c =====\"\n  grep -nE 'Vili CI V85|ghost_uptime_proc_softirq_count|TIMER_SOFTIRQ|SCHED_SOFTIRQ|RCU_SOFTIRQ' kernel/fs/proc/softirqs.c\n  echo\n  echo \"===== RETAINED V88 MARKERS IN kernel/irq/proc.c =====\"\n  grep -nE 'Vili CI V88|ghost_uptime_proc_interrupt_desc_count|arch_timer|arch_mem_timer|40ULL|4ULL|131ULL' kernel/kernel/irq/proc.c\n  echo\n  echo \"===== RETAINED V61 MARKERS IN kernel/time/timer_list.c =====\"\n  grep -nE 'Vili CI V61|ghost_uptime_offset_ns|now at' kernel/kernel/time/timer_list.c\n  echo\n  echo \"===== PRISTINE VDSO HASHES =====\"\n  sha256sum kernel/lib/vdso/gettimeofday.c kernel/kernel/time/vsyscall.c\n  echo\n  echo \"===== AUDIO PASS HASHES =====\"\n  sha256sum \\\n    kernel/techpack/audio/asoc/msm-dai-q6-v2.c \\\n    kernel/techpack/audio/asoc/msm-dai-q6-v2.h \\\n    kernel/techpack/audio/asoc/msm_dailink.h\n\
        } >\"$DIAG/V127-layer-audit.txt\"\n\ncat >\"$TOOLS/V127-collect-in-twrp.sh\" <<'EOF_V126_TWRP'\n#!/sbin/sh\n# V127 read-only bootloop collector for Xiaomi 11T Pro (vili).\n# Run in TWRP/OrangeFox terminal: sh /sdcard/V127-collect-in-twrp.sh\n\nset -u\n\nif [ -d /sdcard ] && [ -w /sdcard ]; then\n  BASE=/sdcard\nelse\n  BASE=/tmp\nfi\n\nSTAMP=\"$(date +%Y%m%d-%H%M%S 2>/dev/null || echo unknown)\"\nNAME=\"V127-bootloop-logs-${STAMP}\"\nOUT=\"${BASE}/${NAME}\"\nARCHIVE=\"${BASE}/${NAME}.tar.gz\"\nTAR_ERROR=\"${BASE}/${NAME}-tar-error.txt\"\nmkdir -p \"$OUT\"\n\nrun_to() {\n  target=\"$1\"\n  shift\n  {\n    echo \"COMMAND: $*\"\n    \"$@\"\n  } >\"$OUT/$target\" 2>&1 || true\n}\n\n{\n  echo \"collector=V127\"\n  echo \"started_utc=$(date -u 2>/dev/null || true)\"\n  echo \"output=$OUT\"\n  echo \"This collector never writes to a block device.\"\n} >\"$OUT/00-summary.txt\"\n\nrun_to 01-uname.txt uname -a\nrun_to 02-props.txt getprop\nrun_to 03-cmdline.txt cat /proc/cmdline\nrun_to 04-mounts.txt cat /proc/mounts\nrun_to 05-proc-mtd.txt cat /proc/mtd\nrun_to 06-partitions.txt cat /proc/partitions\nrun_to 07-block-links.txt ls -la /dev/block /dev/block/by-name /dev/block/bootdevice/by-name\nrun_to 08-block-sysfs.txt sh -c 'for f in /sys/class/block/sda15/size /sys/class/block/sda15/start /sys/class/block/sda15/dev; do echo \"===== $f =====\"; cat \"$f\" 2>&1; done'\nrun_to 09-device-tree-model.txt sh -c 'for f in /proc/device-tree/model /proc/device-tree/compatible; do echo \"===== $f =====\"; tr \"\\000\" \"\\n\" < \"$f\" 2>/dev/null; done'\nrun_to 20-recovery-dmesg.txt dmesg\nrun_to 21-kernel-state.txt sh -c 'cat /proc/uptime; echo; head -20 /proc/stat; echo; cat /proc/interrupts; echo; cat /proc/timer_list 2>/dev/null; echo; cat /proc/softirqs'\nrun_to 24-suspend-stats.txt sh -c '\nfor root in /sys/power/suspend_stats /sys/kernel/debug/suspend_stats; do\n  echo \"===== $root =====\"\n  if [ -d \"$root\" ]; then\n    found=0\n    for child in \"$root\"/*; do\n      [ -f \"$child\" ] || continue\n      found=1\n      echo \"--- ${child##*/} ---\"\n      cat \"$child\" 2>&1 || true\n    done\n    [ \"$found\" -eq 1 ] || echo \"directory has no readable regular child files\"\n  elif [ -r \"$root\" ]; then\n    cat \"$root\" 2>&1 || true\n  else\n    echo \"unavailable\"\n  fi\ndone'\nrun_to 22-recovery-log.txt sh -c 'cat /tmp/recovery.log 2>/dev/null; cat /cache/recovery/last_log 2>/dev/null'\nrun_to 23-logcat.txt sh -c 'logcat -b all -d -v threadtime 2>/dev/null'\n\nmkdir -p /sys/fs/pstore 2>/dev/null || true\nif ! grep -q ' /sys/fs/pstore ' /proc/mounts 2>/dev/null; then\n  mount -t pstore pstore /sys/fs/pstore 2>\"$OUT/10-pstore-mount-error.txt\" || true\nfi\nrun_to 11-pstore-status.txt sh -c 'grep pstore /proc/mounts; ls -la /sys/fs/pstore'\nmkdir -p \"$OUT/pstore\"\ncp -a /sys/fs/pstore/. \"$OUT/pstore/\" 2>\"$OUT/12-pstore-copy-error.txt\" || true\nrun_to 13-last-kmsg.txt sh -c 'cat /proc/last_kmsg 2>/dev/null'\nrun_to 14-pstore-registration.txt sh -c 'dmesg | grep -iE \"pstore|ramoops|mtdoops|block2mtd|panic|oops\"'\nrun_to 15-sysinfo-userspace.txt sh -c 'echo \"===== /proc/uptime =====\"; cat /proc/uptime 2>/dev/null; echo; echo \"===== uptime commands =====\"; command -v uptime 2>/dev/null; uptime 2>/dev/null; command -v toybox 2>/dev/null && toybox uptime 2>/dev/null; command -v busybox 2>/dev/null && busybox uptime 2>/dev/null'\n\n# V103 showed this exact mapping. Read it only when the active cmdline confirms it.\nBLOCK=/dev/block/sda15\nEXPECTED_MAP='block2mtd.block2mtd=/dev/block/sda15,2097152'\nif grep -q \"$EXPECTED_MAP\" /proc/cmdline 2>/dev/null && [ -b \"$BLOCK\" ]; then\n  SECTORS=\"$(cat /sys/class/block/sda15/size 2>/dev/null || echo 0)\"\n  case \"$SECTORS\" in\n    ''|*[!0-9]*) SECTORS=0 ;;\n  esac\n  BYTES=$((SECTORS * 512))\n  {\n    echo \"mapping_confirmed=$EXPECTED_MAP\"\n    echo \"block=$BLOCK\"\n    echo \"sectors=$SECTORS\"\n    echo \"bytes=$BYTES\"\n    echo \"mode=read-only\"\n  } >\"$OUT/30-mtdoops-read-info.txt\"\n\n  if [ \"$BYTES\" -gt 0 ] && [ \"$BYTES\" -le 67108864 ]; then\n    dd\
        \ if=\"$BLOCK\" of=\"$OUT/31-mtdoops-sda15-full.bin\" bs=1048576 \\\n      2>\"$OUT/31-mtdoops-dd.txt\" || true\n    RAW=\"$OUT/31-mtdoops-sda15-full.bin\"\n  else\n    dd if=\"$BLOCK\" of=\"$OUT/31-mtdoops-sda15-first-4MiB.bin\" bs=1048576 count=4 \\\n      2>\"$OUT/31-mtdoops-first-dd.txt\" || true\n    RAW=\"$OUT/31-mtdoops-sda15-first-4MiB.bin\"\n    if [ \"$SECTORS\" -gt 8192 ]; then\n      SKIP_MIB=$((SECTORS / 2048 - 4))\n      dd if=\"$BLOCK\" of=\"$OUT/32-mtdoops-sda15-last-4MiB.bin\" bs=1048576 skip=\"$SKIP_MIB\" count=4 \\\n        2>\"$OUT/32-mtdoops-last-dd.txt\" || true\n    fi\n  fi\n\n  if command -v strings >/dev/null 2>&1; then\n    strings -a -t d \"$RAW\" >\"$OUT/33-mtdoops-strings.txt\" 2>&1 || true\n    [ ! -f \"$OUT/32-mtdoops-sda15-last-4MiB.bin\" ] || \\\n      strings -a -t d \"$OUT/32-mtdoops-sda15-last-4MiB.bin\" >>\"$OUT/33-mtdoops-strings.txt\" 2>&1 || true\n  fi\n  command -v gzip >/dev/null 2>&1 && gzip -9 \"$OUT\"/*.bin 2>/dev/null || true\nelse\n  {\n    echo \"SKIPPED: exact V103 block2mtd mapping was not present or $BLOCK was not a block device.\"\n    echo \"No raw partition was read.\"\n  } >\"$OUT/30-mtdoops-read-info.txt\"\nfi\n\ncat >\"$OUT/V127-UPLOAD-README.txt\" <<'EOF'\nSend this complete archive together with the GitHub Actions V127 artifact.\nThe pstore directory may be empty. The mtdoops files are read-only snapshots\nand can contain the previous panic when pstore/ramoops does not.\nEOF\n\nrm -f \"$ARCHIVE\" \"$TAR_ERROR\"\nif tar -czf \"$ARCHIVE\" -C \"$BASE\" \"$NAME\" 2>\"$TAR_ERROR\"; then\n  rm -f \"$TAR_ERROR\"\n  echo \"DONE: $ARCHIVE\"\nelse\n  cp -a \"$TAR_ERROR\" \"$OUT/90-tar-error.txt\" 2>/dev/null || true\n  ARCHIVE=\"${BASE}/${NAME}.tar\"\n  tar -cf \"$ARCHIVE\" -C \"$BASE\" \"$NAME\"\n  rm -f \"$TAR_ERROR\"\n  echo \"DONE: $ARCHIVE\"\nfi\necho \"Folder kept at: $OUT\"\nEOF_V126_TWRP\nchmod 0755 \"$TOOLS/V127-collect-in-twrp.sh\"\nsh -n \"$TOOLS/V127-collect-in-twrp.sh\" 2>&1 | tee -a setup.log\nsha256sum \"$TOOLS/V127-collect-in-twrp.sh\" | tee -a setup.log\n\necho \"===== V127.2 WRITE RUNTIME AUDIT DIRECT =====\" | tee -a setup.log\ncat >\"$TOOLS/V127-check-ghost-uptime-noroot.sh\" <<'EOF_V1272_AUDIT_DIRECT'\n#!/system/bin/sh\n# V127 non-root ghost-uptime audit for Xiaomi 11T Pro (vili).\n# The script is read-only, never invokes su, and works from adb shell or a\n# normal Android terminal. ADB shell can read more surfaces than an app UID.\n\nset -u\numask 077\n\nVERSION=\"V127\"\nSTAMP=\"$(date +%Y%m%d-%H%M%S 2>/dev/null || echo unknown)\"\n\nchoose_output()\n{\n\tif [ \"$#\" -gt 0 ] && [ -n \"${1:-}\" ]; then\n\t\tcase \"$1\" in\n\t\t\t*.txt) printf '%s\\n' \"$1\" ;;\n\t\t\t*) printf '%s/%s-noroot-uptime-audit-%s.txt\\n' \"${1%/}\" \"$VERSION\" \"$STAMP\" ;;\n\t\tesac\n\t\treturn\n\tfi\n\n\tfor dir in /sdcard/Download /data/local/tmp /sdcard /tmp .; do\n\t\tif [ -d \"$dir\" ] && [ -w \"$dir\" ]; then\n\t\t\tprintf '%s/%s-noroot-uptime-audit-%s.txt\\n' \"${dir%/}\" \"$VERSION\" \"$STAMP\"\n\t\t\treturn\n\t\tfi\n\tdone\n\n\tprintf './%s-noroot-uptime-audit-%s.txt\\n' \"$VERSION\" \"$STAMP\"\n}\n\nOUT=\"$(choose_output \"${1:-}\")\"\nOUT_DIR=\"${OUT%/*}\"\n[ \"$OUT_DIR\" = \"$OUT\" ] && OUT_DIR=.\nmkdir -p \"$OUT_DIR\" 2>/dev/null || true\nif ! : >\"$OUT\" 2>/dev/null; then\n\tOUT=\"./${VERSION}-noroot-uptime-audit-${STAMP}.txt\"\n\t: >\"$OUT\" || exit 1\nfi\n\nsay()\n{\n\tprintf '%s\\n' \"$*\" >>\"$OUT\"\n}\n\nsection()\n{\n\tsay \"\"\n\tsay \"===== $* =====\"\n}\n\ncapture()\n{\n\ttitle=\"$1\"\n\tshift\n\tsection \"$title\"\n\t{\n\t\tprintf 'COMMAND:'\n\t\tfor arg in \"$@\"; do printf ' %s' \"$arg\"; done\n\t\tprintf '\\n'\n\t\t\"$@\"\n\t} >>\"$OUT\" 2>&1 || say \"RESULT: unavailable or permission denied (exit=$?)\"\n}\n\nread_first()\n{\n\t[ -r \"$1\" ] || return 1\n\tawk 'NR == 1 { print $1; exit }' \"$1\" 2>/dev/null\n}\n\ninteger_part()\n{\n\tprintf '%s\\n' \"$1\" | awk -F. 'NR == 1 { print $1 + 0 }'\n}\n\nnumeric_or_zero()\n{\n\tcase \"${1:-}\" in\n\t\t''|*[!0-9]*) printf '0\\n' ;;\n\t\t*) printf '%s\\n' \"$1\" ;;\n\tesac\n}\n\ndecimal_add()\n{\n\t\
        awk -v a=\"${1:-0}\" -v b=\"${2:-0}\" 'BEGIN { printf \"%.0f\\n\", a + b }'\n}\n\nless_than_half_uptime_us()\n{\n\tawk -v idle_us=\"${1:-0}\" -v uptime_sec=\"${2:-0}\" \\\n\t\t'BEGIN { exit !(uptime_sec > 0 && idle_us < uptime_sec * 500000) }'\n}\n\nparse_uptime_text_seconds()\n{\n\t# Toybox commonly prints: \"HH:MM:SS up N days, H:MM, N users, ...\"\n\t# Parse only the duration between \"up\" and \"users\". The result is rounded\n\t# to minutes by uptime(1), so later comparisons deliberately allow 180s.\n\tprintf '%s\\n' \"$1\" | awk '\n\t{\n\t\tseen = 0\n\t\tseconds = 0\n\t\tfor (i = 1; i <= NF; i++) {\n\t\t\ttoken = $i\n\t\t\tgsub(/,/, \"\", token)\n\t\t\tif (!seen) {\n\t\t\t\tif (token == \"up\")\n\t\t\t\t\tseen = 1\n\t\t\t\tcontinue\n\t\t\t}\n\n\t\t\tnext_token = $(i + 1)\n\t\t\tgsub(/,/, \"\", next_token)\n\t\t\tif (token ~ /^[0-9]+$/ && next_token ~ /^days?$/) {\n\t\t\t\tseconds += token * 86400\n\t\t\t\ti++\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif (token ~ /^[0-9]+:[0-9]+$/) {\n\t\t\t\tsplit(token, hm, \":\")\n\t\t\t\tseconds += hm[1] * 3600 + hm[2] * 60\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif (token ~ /^[0-9]+$/ && next_token ~ /^mins?$/) {\n\t\t\t\tseconds += token * 60\n\t\t\t\ti++\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif (token ~ /^[0-9]+$/ && next_token ~ /^users?$/)\n\t\t\t\tbreak\n\t\t}\n\t\tif (seen)\n\t\t\tprintf \"%.0f\\n\", seconds\n\t}'\n}\n\nWARN_COUNT=0\nPASS_COUNT=0\nINFO_COUNT=0\n\nwarn()\n{\n\tWARN_COUNT=$((WARN_COUNT + 1))\n\tsay \"WARN[$WARN_COUNT]: $*\"\n}\n\npass()\n{\n\tPASS_COUNT=$((PASS_COUNT + 1))\n\tsay \"PASS[$PASS_COUNT]: $*\"\n}\n\ninfo()\n{\n\tINFO_COUNT=$((INFO_COUNT + 1))\n\tsay \"INFO[$INFO_COUNT]: $*\"\n}\n\nsay \"${VERSION} NON-ROOT GHOST-UPTIME AUDIT\"\nsay \"started_utc=$(date -u 2>/dev/null || true)\"\nsay \"report=$OUT\"\nsay \"mode=read-only; no su; no root required\"\nsay \"scope=ADB shell sees more than an ordinary third-party app UID\"\n\nsection \"IDENTITY AND BUILD\"\nid >>\"$OUT\" 2>&1 || true\nuname -a >>\"$OUT\" 2>&1 || true\nfor prop in \\\n\tro.product.device ro.build.display.id ro.build.fingerprint \\\n\tro.build.version.release ro.build.version.sdk ro.build.date.utc \\\n\tro.boot.slot_suffix sys.boot_completed ro.runtime.firstboot; do\n\tvalue=\"$(getprop \"$prop\" 2>/dev/null || true)\"\n\tsay \"$prop=$value\"\ndone\nif command -v getenforce >/dev/null 2>&1; then\n\tsay \"selinux=$(getenforce 2>/dev/null || true)\"\n\tKERNEL_RELEASE=\"$(uname -r 2>/dev/null || true)\"\n\tsay \"kernel_release=${KERNEL_RELEASE:-unavailable}\"\n\tif [ \"$(id -u 2>/dev/null || echo -1)\" = \"0\" ] && [ -r /data/adb/modules/v127_ghost_guard/kernel_localversion_expected ]; then\n\t\tEXPECTED_LOCALVERSION=\"$(cat /data/adb/modules/v127_ghost_guard/kernel_localversion_expected 2>/dev/null | tr -d '\\r\\n' || true)\"\n\t\tsay \"kernel_localversion_expected=${EXPECTED_LOCALVERSION:-unavailable}\"\n\t\tcase \"$KERNEL_RELEASE\" in\n\t\t\t*\"$EXPECTED_LOCALVERSION\") pass \"V127 running kernel release matches the workflow-selected LOCALVERSION\" ;;\n\t\t\t*) warn \"running kernel release does not end with workflow-selected LOCALVERSION ($EXPECTED_LOCALVERSION)\" ;;\n\t\tesac\n\tfi\nfi\n\nPROC_UP_RAW=\"$(read_first /proc/uptime || true)\"\nPROC_UP_SEC=\"$(integer_part \"${PROC_UP_RAW:-0}\")\"\nPROC_UP_SEC=\"$(numeric_or_zero \"$PROC_UP_SEC\")\"\n\nsection \"PRIMARY UPTIME CROSS-CHECK\"\nsay \"proc_uptime_raw=${PROC_UP_RAW:-unavaileble}\"\nif [ \"$PROC_UP_SEC\" -gt 0 ]; then\n\tpass \"/proc/uptime readable; integer seconds=$PROC_UP_SEC\"\nelse\n\twarn \"/proc/uptime is unavailable or not numeric\"\nfi\n\nUPTIME_TEXT=\"\"\nSYSINFO_UP_SEC=0\nif command -v uptime >/dev/null 2>&1; then\n\tUPTIME_TEXT=\"$(uptime 2>&1 || true)\"\n\tsay \"uptime_command=$UPTIME_TEXT\"\n\tSYSINFO_UP_SEC=\"$(parse_uptime_text_seconds \"$UPTIME_TEXT\" || true)\"\n\tSYSINFO_UP_SEC=\"$(numeric_or_zero \"$SYSINFO_UP_SEC\")\"\n\tsay \"uptime_command_parsed_seconds=$SYSINFO_UP_SEC\"\nfi\nif command -v toybox >/dev/null 2>&1; then\n\tsay \"toybox_uptime=$(toybox uptime 2>&1 || true)\"\nfi\nif command -v busybox >/dev/null 2>&1; then\n\
        \tsay \"busybox_uptime=$(busybox uptime 2>&1 || true)\"\nfi\n\nBTIME=\"$(awk '$1 == \"btime\" { print $2; exit }' /proc/stat 2>/dev/null || true)\"\nNOW_EPOCH=\"$(date +%s 2>/dev/null || true)\"\nBTIME=\"$(numeric_or_zero \"$BTIME\")\"\nNOW_EPOCH=\"$(numeric_or_zero \"$NOW_EPOCH\")\"\nsay \"proc_stat_btime=$BTIME\"\nsay \"wall_epoch_now=$NOW_EPOCH\"\nif [ \"$BTIME\" -gt 0 ] && [ \"$NOW_EPOCH\" -gt \"$BTIME\" ] && [ \"$PROC_UP_SEC\" -gt 0 ]; then\n\tWALL_AGE=$((NOW_EPOCH - BTIME))\n\tDIFF=$((WALL_AGE - PROC_UP_SEC))\n\t[ \"$DIFF\" -lt 0 ] && DIFF=$((-DIFF))\n\tsay \"wall_clock_minus_btime_sec=$WALL_AGE\"\n\tsay \"abs_diff_vs_proc_uptime_sec=$DIFF\"\n\tif [ \"$DIFF\" -le 10 ]; then\n\t\tpass \"/proc/stat btime agrees with /proc/uptime within 10 seconds\"\n\telse\n\t\twarn \"/proc/stat btime differs from /proc/uptime by ${DIFF}s\"\n\tfi\nelse\n\tinfo \"btime comparison skipped because wall clock or fields were unavailable\"\nfi\n\nHZ=\"$(getconf CLK_TCK 2>/dev/null || true)\"\nHZ=\"$(numeric_or_zero \"$HZ\")\"\n[ \"$HZ\" -gt 0 ] || HZ=100\nsay \"userspace_CLK_TCK=$HZ\"\nSELF_START_SEC=0\nfor pid in self 1; do\n\tstat_file=\"/proc/$pid/stat\"\n\tstart_ticks=\"$(sed 's/^.*) //' \"$stat_file\" 2>/dev/null | awk 'NR == 1 { print $20; exit }')\"\n\tstart_ticks=\"$(numeric_or_zero \"$start_ticks\")\"\n\tstart_sec=$((start_ticks / HZ))\n\tsay \"pid_${pid}_start_ticks=$start_ticks\"\n\tsay \"pid_${pid}_start_seconds_on_exposed_monotonic_axis=$start_sec\"\n\t[ \"$pid\" != self ] || SELF_START_SEC=\"$start_sec\"\n\tif [ \"$PROC_UP_SEC\" -gt 0 ] && [ \"$start_sec\" -gt $((PROC_UP_SEC + 10)) ]; then\n\t\twarn \"/proc/$pid/stat starttime is more than 10 seconds later than exposed uptime\"\n\tfi\ndone\n\nEXPOSED_UP_SEC=\"$PROC_UP_SEC\"\nEXPOSED_UP_SOURCE=\"/proc/uptime\"\nif [ \"$EXPOSED_UP_SEC\" -le 0 ] && [ \"$SELF_START_SEC\" -gt 0 ]; then\n\tEXPOSED_UP_SEC=\"$SELF_START_SEC\"\n\tEXPOSED_UP_SOURCE=\"/proc/self/stat starttime\"\n\tinfo \"/proc/uptime unavailable; using current-process starttime as an approximate exposed-uptime reference\"\nfi\nsay \"exposed_uptime_reference_source=$EXPOSED_UP_SOURCE\"\nsay \"exposed_uptime_reference_seconds=$EXPOSED_UP_SEC\"\n\nFIRSTBOOT_MS=\"$(getprop ro.runtime.firstboot 2>/dev/null || true)\"\nFIRSTBOOT_SEC=\"$(printf '%s\\n' \"$FIRSTBOOT_MS\" | awk '/^[0-9]+$/ { printf \"%.0f\\n\", $1 / 1000; exit }')\"\nFIRSTBOOT_SEC=\"$(numeric_or_zero \"$FIRSTBOOT_SEC\")\"\nREAL_BOOT_AGE_SEC=0\nif [ \"$FIRSTBOOT_SEC\" -gt 0 ] && [ \"$NOW_EPOCH\" -gt \"$FIRSTBOOT_SEC\" ]; then\n\tREAL_BOOT_AGE_SEC=$((NOW_EPOCH - FIRSTBOOT_SEC))\nfi\nsay \"runtime_firstboot_epoch_ms=${FIRSTBOOT_MS:-unavailable}\"\nsay \"runtime_firstboot_epoch_sec=$FIRSTBOOT_SEC\"\nsay \"runtime_firstboot_age_seconds=$REAL_BOOT_AGE_SEC\"\nif [ \"$FIRSTBOOT_SEC\" -gt 0 ] && [ \"$EXPOSED_UP_SEC\" -gt 0 ]; then\n\tFIRSTBOOT_DIFF=$((REAL_BOOT_AGE_SEC - EXPOSED_UP_SEC))\n\t[ \"$FIRSTBOOT_DIFF\" -ge 0 ] || FIRSTBOOT_DIFF=$((-FIRSTBOOT_DIFF))\n\tsay \"runtime_firstboot_abs_diff_vs_exposed_reference_sec=$FIRSTBOOT_DIFF\"\n\tif [ \"$FIRSTBOOT_DIFF\" -le 300 ]; then\n\t\tpass \"V127 ro.runtime.firstboot is aligned with the ghost uptime reference within 300 seconds\"\n\telif [ \"$EXPOSED_UP_SEC\" -gt 86400 ] && awk -v real=\"$REAL_BOOT_AGE_SEC\" -v fake=\"$EXPOSED_UP_SEC\" 'BEGIN { exit !(real > 0 && real < fake / 4) }'; then\n\t\twarn \"V127 firstboot guard is not active: ro.runtime.firstboot still exposes the short privileged/root boot age\"\n\telse\n\t\twarn \"ro.runtime.firstboot differs from the exposed ghost uptime reference by ${FIRSTBOOT_DIFF}s\"\n\tfi\nelse\n\tinfo \"ro.runtime.firstboot alignment check unavailable for this UID\"\nfi\n\nsection \"V127 GHOST USERSPACE GUARD ACTIVATION\"\nV127_HEALTH_LOG=/data/local/tmp/V127-module-health.log\nif [ \"$(id -u 2>/dev/null || echo -1)\" = \"0\" ]; then\n    if [ -r \"$V127_HEALTH_LOG\" ]; then\n        say \"-- V127 module health log tail --\"\n        tail -n 80 \"$V127_HEALTH_LOG\" >>\"$OUT\" 2>&1 || true\n    else\n        say \"v127_module_health_log_readable=no\"\n    fi\n    say \"legacy_v1261_module_present=$([\
        \ -d /data/adb/modules/v1261_ghost_guard ] && echo yes || echo no)\"\nfi\nV127_MOD=\"/data/adb/modules/v127_ghost_guard\"\nif [ \"$(id -u 2>/dev/null || echo -1)\" = \"0\" ]; then\n    if [ -f \"$V127_MOD/module.prop\" ]; then\n        say \"v127_module_present=yes\"\n        grep -E '^(id|name|version|versionCode)=' \"$V127_MOD/module.prop\" >>\"$OUT\" 2>/dev/null || true\n        if [ -e \"$V127_MOD/disable\" ]; then\n            warn \"V127 ghost userspace guard module exists but is disabled\"\n        elif [ -e \"$V127_MOD/remove\" ]; then\n            warn \"V127 ghost userspace guard module is marked for removal\"\n        else\n            pass \"V127 ghost userspace guard module directory is present and enabled\"\n        fi\n        say \"v127_post_fs_data_present=$([ -f \"$V127_MOD/post-fs-data.sh\" ] && echo yes || echo no)\"\n        say \"v127_post_mount_present=$([ -f \"$V127_MOD/post-mount.sh\" ] && echo yes || echo no)\"\n        say \"v127_boot_completed_present=$([ -f \"$V127_MOD/boot-completed.sh\" ] && echo yes || echo no)\"\n        say \"v127_logcat_wrapper_present=$([ -f \"$V127_MOD/bin/logcat-wrapper\" ] && echo yes || echo no)\"\n    else\n        say \"v127_module_present=no\"\n        warn \"V127 ghost userspace guard is missing from /data/adb/modules; AnyKernel auto-activation was skipped or /data was unavailable during flashing\"\n    fi\n\n    REAL=/dev/.v127-logcat-real\n    WRAP=/dev/.v127-logcat-wrapper\n    TARGET=/system/bin/logcat\n    real_size=\"$(wc -c <\"$REAL\" 2>/dev/null | tr -cd '0-9')\"\n    wrap_size=\"$(wc -c <\"$WRAP\" 2>/dev/null | tr -cd '0-9')\"\n    target_size=\"$(wc -c <\"$TARGET\" 2>/dev/null | tr -cd '0-9')\"\n    real_size=\"$(numeric_or_zero \"$real_size\")\"\n    wrap_size=\"$(numeric_or_zero \"$wrap_size\")\"\n    target_size=\"$(numeric_or_zero \"$target_size\")\"\n    say \"v127_runtime_real_logcat_present=$([ -x \"$REAL\" ] && echo yes || echo no)\"\n    say \"v127_runtime_wrapper_present=$([ -x \"$WRAP\" ] && echo yes || echo no)\"\n    say \"v127_real_logcat_size=$real_size\"\n    say \"v127_wrapper_size=$wrap_size\"\n    say \"v127_system_logcat_size=$target_size\"\n\n    if [ -e \"$REAL\" ]; then ls -lZ \"$REAL\" >>\"$OUT\" 2>/dev/null || true; fi\n    if [ -e \"$WRAP\" ]; then ls -lZ \"$WRAP\" >>\"$OUT\" 2>/dev/null || true; fi\n\n    if command -v sha256sum >/dev/null 2>&1; then\n        real_hash=\"$(sha256sum \"$REAL\" 2>/dev/null | awk '{print $1}' || true)\"\n        wrap_hash=\"$(sha256sum \"$WRAP\" 2>/dev/null | awk '{print $1}' || true)\"\n        target_hash=\"$(sha256sum \"$TARGET\" 2>/dev/null | awk '{print $1}' || true)\"\n        say \"v127_real_logcat_sha256=${real_hash:-unavailable}\"\n        say \"v127_wrapper_sha256=${wrap_hash:-unavailable}\"\n        say \"v127_system_logcat_sha256=${target_hash:-unavailable}\"\n        if [ -n \"$real_hash\" ] && [ -n \"$wrap_hash\" ] && [ \"$real_hash\" = \"$wrap_hash\" ]; then\n            warn \"V127 recursion guard FAILED: preserved real logcat is identical to the wrapper\"\n        elif [ \"$real_size\" -gt 8192 ] && [ -n \"$target_hash\" ] && [ -n \"$wrap_hash\" ] && [ \"$target_hash\" = \"$wrap_hash\" ]; then\n            pass \"V127 wrapper is active and the preserved real logcat remains a distinct executable\"\n        elif [ \"$real_size\" -gt 8192 ] && [ -n \"$target_hash\" ] && [ -n \"$real_hash\" ] && [ \"$target_hash\" = \"$real_hash\" ]; then\n            info \"V127 fail-open state: stock logcat is active because wrapper validation/mount was skipped\"\n        else\n            warn \"V127 logcat integrity state is ambiguous; inspect guard log before relying on the wrapper\"\n        fi\n    fi\n\n    if [ -r /data/local/tmp/V127-ghost-guard.log ]; then\n        say \"-- V127 ghost guard log tail --\"\n        tail -n 80 /data/local/tmp/V127-ghost-guard.log >>\"$OUT\" 2>&1 || true\n    else\n        say \"v127_guard_log_readable=no\"\n    fi\nelse\n    info \"V127 module activation and runtime integrity checks require root privileges\"\nfi\n\nsection \"V127 APP-FACING JAVA MONOTONIC\
        \ CANARY\"\nV127_APP_LOG=/data/local/tmp/V127-app-clock-hook.log\nif [ \"$(id -u 2>/dev/null || echo -1)\" = \"0\" ]; then\n    V127_MOD=\"/data/adb/modules/v127_ghost_guard\"\n    V127_PKG=\"$(head -n 1 \"$V127_MOD/target_package\" 2>/dev/null | tr -d '\\r\\n' || true)\"\n    V127_UID=\"$(head -n 1 \"$V127_MOD/target_uid\" 2>/dev/null | tr -cd '0-9' || true)\"\n    say \"v127_target_package=${V127_PKG:-unavailable}\"\n    say \"v127_target_uid=${V127_UID:-unavailable}\"\n    say \"v127_zygisk_arm64_present=$([ -f \"$V127_MOD/zygisk/arm64-v8a.so\" ] && echo yes || echo no)\"\n    say \"v127_zygisk_arm32_present=$([ -f \"$V127_MOD/zygisk/armeabi-v7a.so\" ] && echo yes || echo no)\"\n    V127_ARM64_LIBC=0\n    V127_ARM32_LIBC=0\n    if [ -r \"$V127_MOD/zygisk/arm64-v8a.so\" ] && grep -a -q 'libc.so' \"$V127_MOD/zygisk/arm64-v8a.so\" 2>/dev/null; then V127_ARM64_LIBC=1; fi\n    if [ -r \"$V127_MOD/zygisk/armeabi-v7a.so\" ] && grep -a -q 'libc.so' \"$V127_MOD/zygisk/armeabi-v7a.so\" 2>/dev/null; then V127_ARM32_LIBC=1; fi\n    say \"v127_arm64_dynamic_libc_needed=$V127_ARM64_LIBC\"\n    say \"v127_arm32_dynamic_libc_needed=$V127_ARM32_LIBC\"\n    if [ \"$V127_ARM64_LIBC\" -eq 1 ] && [ \"$V127_ARM32_LIBC\" -eq 1 ]; then\n        pass \"V127 Zygisk ELFs carry a normal libc.so dependency for custom-linker compatibility\"\n    else\n        warn \"V127 Zygisk ELF dynamic-link marker is missing on one or more ABIs\"\n    fi\n    V127_TARGET_PIDS=\"\"\n    case \"${V127_PKG:-}\" in\n        ''|unavailable) ;;\n        *) V127_TARGET_PIDS=\"$(pidof \"$V127_PKG\" 2>/dev/null || true)\" ;;\n    esac\n    say \"v127_target_process_pids=${V127_TARGET_PIDS:-none}\"\n    V127_STALE_ENABLED=\"\"\n    for old in v124_ghost_guard v125_ghost_guard v1251_ghost_guard v127_ghost_guard; do\n        if [ -d \"/data/adb/modules/$old\" ] && [ ! -e \"/data/adb/modules/$old/disable\" ] && [ ! -e \"/data/adb/modules/$old/remove\" ]; then\n            V127_STALE_ENABLED=\"$V127_STALE_ENABLED $old\"\n        fi\n    done\n    V127_STALE_ENABLED=\"$(printf '%s' \"$V127_STALE_ENABLED\" | sed 's/^ *//')\"\n    say \"v127_stale_ghost_modules_enabled=${V127_STALE_ENABLED:-none}\"\n    if [ -z \"$V127_STALE_ENABLED\" ]; then\n        pass \"V127 is the only enabled recent ghost app-clock module; stale V124/V125/V125.1/V126/V126.1 Zygisk hooks are not competing\"\n    else\n        warn \"stale ghost Zygisk modules are still enabled: $V127_STALE_ENABLED\"\n    fi\n    REZ_ACTIVE=0\n    ZN_ACTIVE=0\n    REZ_STAGED=0\n    if [ -f /data/adb/modules/rezygisk/module.prop ] && [ ! -e /data/adb/modules/rezygisk/disable ] && [ ! -e /data/adb/modules/rezygisk/remove ]; then\n        REZ_ACTIVE=1\n    fi\n    if [ -f /data/adb/modules/zygisksu/module.prop ] && [ ! -e /data/adb/modules/zygisksu/disable ] && [ ! -e /data/adb/modules/zygisksu/remove ]; then\n        ZN_ACTIVE=1\n    fi\n    if [ -f /data/adb/modules_update/rezygisk/module.prop ] || [ -e /data/local/tmp/V127-rezygisk-reboot-required ]; then\n        REZ_STAGED=1\n    fi\n    say \"rezygisk_active=$REZ_ACTIVE\"\n    say \"zygisknext_active=$ZN_ACTIVE\"\n    say \"rezygisk_staged_reboot_required=$REZ_STAGED\"\n    say \"v127_rezygisk_dependency_present=$([ -f \"$V127_MOD/deps/ReZygisk-v1.0.0-515-333d423-release.zip\" ] && echo yes || echo no)\"\n    if [ -r \"$V127_MOD/deps/ReZygisk-BUNDLE-STATUS.txt\" ]; then\n        say \"-- V127 ReZygisk bundle status --\"\n        cat \"$V127_MOD/deps/ReZygisk-BUNDLE-STATUS.txt\" >>\"$OUT\" 2>/dev/null || true\n    fi\n    if [ \"$REZ_ACTIVE\" -eq 1 ]; then\n        grep -E '^(id|name|version|versionCode)=' /data/adb/modules/rezygisk/module.prop >>\"$OUT\" 2>/dev/null || true\n        pass \"ReZygisk is present and enabled for the V127 app-process canary\"\n    elif [ \"$ZN_ACTIVE\" -eq 1 ]; then\n        grep -E '^(id|name|version|versionCode)=' /data/adb/modules/zygisksu/module.prop >>\"$OUT\" 2>/dev/null || true\n        pass \"An existing Zygisk Next loader is enabled; V127 will not install a second loader\"\n    elif [ \"$REZ_STAGED\" -eq 1 ]; then\n        warn\
        \ \"V127 staged ReZygisk successfully but one additional reboot is required before Java hooks can load\"\n    else\n        warn \"No enabled Zygisk-compatible loader is active and ReZygisk is not staged; inspect V127 bundle status/install log. The V127 build intentionally remains successful if the external dependency could not be fetched.\"\n    fi\n    if [ -r /data/local/tmp/V127-rezygisk-install.log ]; then\n        say \"-- V127 ReZygisk install log tail --\"\n        tail -n 80 /data/local/tmp/V127-rezygisk-install.log >>\"$OUT\" 2>&1 || true\n    fi\n    case \"$V127_UID\" in\n        ''|0) warn \"V127 target UID is unresolved; launch/package hook remains fail-open\" ;;\n        *) pass \"V127 target package UID is resolved for package-scoped injection\" ;;\n    esac\nelse\n    info \"V127 Zygisk engine and target UID checks require root privileges\"\nfi\n\nif [ -r \"$V127_APP_LOG\" ]; then\n    say \"-- V127 app clock hook log tail --\"\n    tail -n 80 \"$V127_APP_LOG\" >>\"$OUT\" 2>&1 || true\n    ENTER_LINE=\"$(grep 'preAppSpecialize_enter uid=' \"$V127_APP_LOG\" 2>/dev/null | tail -n 1 || true)\"\n    OFFSET_LINE=\"$(grep 'offset_probe_ns=' \"$V127_APP_LOG\" 2>/dev/null | tail -n 1 || true)\"\n    PRE_LINE=\"$(grep 'preAppSpecialize uid=' \"$V127_APP_LOG\" 2>/dev/null | tail -n 1 || true)\"\n    UP_LINE=\"$(grep 'uptimeMillis raw=' \"$V127_APP_LOG\" 2>/dev/null | tail -n 1 || true)\"\n    NANO_LINE=\"$(grep 'nanoTime raw=' \"$V127_APP_LOG\" 2>/dev/null | tail -n 1 || true)\"\n    PRE_OFF_MS=\"$(printf '%s\\n' \"$PRE_LINE\" | sed -n 's/.* offset_ms=\\([0-9][0-9]*\\).*/\\1/p')\"\n    PRE_UP_HOOK=\"$(printf '%s\\n' \"$PRE_LINE\" | sed -n 's/.* uptime_hook=\\([01]\\).*/\\1/p')\"\n    PRE_NANO_HOOK=\"$(printf '%s\\n' \"$PRE_LINE\" | sed -n 's/.* nano_hook=\\([01]\\).*/\\1/p')\"\n    UP_FAKE_MS=\"$(printf '%s\\n' \"$UP_LINE\" | sed -n 's/.* fake=\\([0-9][0-9]*\\).*/\\1/p')\"\n    NANO_FAKE_NS=\"$(printf '%s\\n' \"$NANO_LINE\" | sed -n 's/.* fake=\\([0-9][0-9]*\\).*/\\1/p')\"\n    PRE_OFF_MS=\"$(numeric_or_zero \"$PRE_OFF_MS\")\"\n    PRE_UP_HOOK=\"$(numeric_or_zero \"$PRE_UP_HOOK\")\"\n    PRE_NANO_HOOK=\"$(numeric_or_zero \"$PRE_NANO_HOOK\")\"\n    UP_FAKE_MS=\"$(numeric_or_zero \"$UP_FAKE_MS\")\"\n    NANO_FAKE_NS=\"$(numeric_or_zero \"$NANO_FAKE_NS\")\"\n    say \"v127_java_offset_ms=$PRE_OFF_MS\"\n    say \"v127_uptime_hook_installed=$PRE_UP_HOOK\"\n    say \"v127_nano_hook_installed=$PRE_NANO_HOOK\"\n    say \"v127_last_uptimeMillis_fake_ms=$UP_FAKE_MS\"\n    say \"v127_last_nanoTime_fake_ns=$NANO_FAKE_NS\"\n    if [ -n \"$ENTER_LINE\" ]; then\n        pass \"V127 target process reached preAppSpecialize through the Zygisk loader\"\n    elif [ -n \"${V127_TARGET_PIDS:-}\" ]; then\n        warn \"V127 target process is running but no preAppSpecialize_enter telemetry exists; loader/module discovery is still the likely blocker\"\n    else\n        info \"V127 target process is not currently running; launch the configured package before judging Zygisk injection\"\n    fi\n    if [ -n \"$OFFSET_LINE\" ]; then\n        V127_OFFSET_NS=\"$(printf '%s\\n' \"$OFFSET_LINE\" | sed -n 's/.*offset_probe_ns=\\([0-9-][0-9-]*\\).*/\\1/p')\"\n        say \"v127_offset_probe_ns=${V127_OFFSET_NS:-unparsed}\"\n    fi\n\n    if [ \"$PRE_UP_HOOK\" -eq 1 ] && [ \"$UP_FAKE_MS\" -gt 0 ] && [ \"$EXPOSED_UP_SEC\" -gt 0 ]; then\n        UP_FAKE_SEC=$((UP_FAKE_MS / 1000))\n        UP_JAVA_DIFF=$((UP_FAKE_SEC - EXPOSED_UP_SEC)); [ \"$UP_JAVA_DIFF\" -ge 0 ] || UP_JAVA_DIFF=$((-UP_JAVA_DIFF))\n        say \"v127_uptimeMillis_abs_diff_vs_ghost_sec=$UP_JAVA_DIFF\"\n        if [ \"$UP_JAVA_DIFF\" -le 120 ]; then\n            pass \"V127 target-app SystemClock.uptimeMillis is on the ghost MONOTONIC axis\"\n        else\n            warn \"V127 uptimeMillis hook executed but differs from the ghost reference by ${UP_JAVA_DIFF}s\"\n        fi\n    elif [ \"$PRE_UP_HOOK\" -eq 1 ]; then\n        info \"V127 uptimeMillis hook installed but no runtime call evidence has been captured yet; open/use the target app and rerun\"\n    elif [ -n \"$PRE_LINE\"\
        \ ]; then\n        warn \"V127 target process was specialized but SystemClock.uptimeMillis native lookup did not install\"\n    else\n        info \"No V127 target-process hook evidence yet; Zygisk may be absent or the configured target app has not been launched since boot\"\n    fi\n\n    if [ \"$PRE_NANO_HOOK\" -eq 1 ] && [ \"$NANO_FAKE_NS\" -gt 0 ] && [ \"$EXPOSED_UP_SEC\" -gt 0 ]; then\n        NANO_FAKE_SEC=$((NANO_FAKE_NS / 1000000000))\n        NANO_DIFF=$((NANO_FAKE_SEC - EXPOSED_UP_SEC)); [ \"$NANO_DIFF\" -ge 0 ] || NANO_DIFF=$((-NANO_DIFF))\n        say \"v127_nanoTime_abs_diff_vs_ghost_sec=$NANO_DIFF\"\n        if [ \"$NANO_DIFF\" -le 120 ]; then\n            pass \"V127 target-app System.nanoTime hook executed on the ghost MONOTONIC axis\"\n        else\n            warn \"V127 System.nanoTime hook executed but differs from the ghost reference by ${NANO_DIFF}s\"\n        fi\n    elif [ \"$PRE_NANO_HOOK\" -eq 1 ]; then\n        info \"System.nanoTime native hook installed but runtime call evidence is absent; ART intrinsic execution may bypass the JNI entry on some builds\"\n    elif [ -n \"$PRE_LINE\" ]; then\n        info \"System.nanoTime hook was not installed; V127 treats it as a canary result rather than patching ART globally\"\n    fi\nelse\n    say \"v127_app_clock_hook_log_readable=no\"\n    if [ \"$(id -u 2>/dev/null || echo -1)\" = \"0\" ] && [ -n \"${V127_TARGET_PIDS:-}\" ]; then\n        warn \"V127 target process is running but app-clock hook telemetry is absent; inspect loader discovery/custom-linker evidence\"\n    else\n        info \"V127 app clock hook log is absent/unreadable; launch the configured target package after boot and rerun the root audit\"\n    fi\nfi\n\nif [ \"$SYSINFO_UP_SEC\" -gt 0 ] && [ \"$EXPOSED_UP_SEC\" -gt 0 ]; then\n\tSYSINFO_DIFF=$((SYSINFO_UP_SEC - EXPOSED_UP_SEC))\n\t[ \"$SYSINFO_DIFF\" -ge 0 ] || SYSINFO_DIFF=$((-SYSINFO_DIFF))\n\tsay \"sysinfo_abs_diff_vs_exposed_reference_sec=$SYSINFO_DIFF\"\n\tif [ \"$SYSINFO_DIFF\" -le 180 ]; then\n\t\tpass \"retained V109 sysinfo uptime agrees with the exposed monotonic reference within 180 seconds\"\n\telse\n\t\twarn \"sysinfo uptime differs from the exposed monotonic reference by ${SYSINFO_DIFF}s; possible duplicate or missing offset\"\n\tfi\nelse\n\tinfo \"sysinfo consistency comparison skipped because uptime output or a reference was unavailable\"\nfi\n\nsection \"CPUIDLE SYSFS TIME (V108 RETAINED LAYER)\"\nCPU_FOUND=0\nCPU_CHECKED=0\nCPU_WARN=0\nfor cpu_dir in /sys/devices/system/cpu/cpu[0-9]*; do\n\t[ -d \"$cpu_dir\" ] || continue\n\tCPU_FOUND=$((CPU_FOUND + 1))\n\tcpu_name=\"${cpu_dir##*/}\"\n\tonline=1\n\tif [ -r \"$cpu_dir/online\" ]; then\n\t\tonline=\"$(read_first \"$cpu_dir/online\" || echo 0)\"\n\t\tonline=\"$(numeric_or_zero \"$online\")\"\n\tfi\n\tsay \"-- $cpu_name online=$online --\"\n\tsum_us=0\n\tstates=0\n\tfor state_dir in \"$cpu_dir\"/cpuidle/state[0-9]*; do\n\t\t[ -d \"$state_dir\" ] || continue\n\t\tstates=$((states + 1))\n\t\tstate_name=\"$(read_first \"$state_dir/name\" || true)\"\n\t\tstate_time=\"$(read_first \"$state_dir/time\" || true)\"\n\t\tstate_usage=\"$(read_first \"$state_dir/usage\" || true)\"\n\t\tstate_disable=\"$(read_first \"$state_dir/disable\" || true)\"\n\t\tstate_time=\"$(numeric_or_zero \"$state_time\")\"\n\t\t# Android's /system/bin/sh may use signed 32-bit arithmetic. cpuidle\n\t\t# microseconds exceed INT_MAX quickly, so sum through awk instead.\n\t\tsum_us=\"$(decimal_add \"$sum_us\" \"$state_time\")\"\n\t\tsay \"${state_dir##*/}: name=${state_name:-?} time_us=$state_time usage=${state_usage:-?} disable=${state_disable:-?}\"\n\tdone\n\tsay \"$cpu_name.cpuidle_state_count=$states\"\n\tsay \"$cpu_name.cpuidle_sum_us=$sum_us\"\n\tif [ \"$online\" -eq 1 ] && [ \"$states\" -gt 0 ] && [ \"$EXPOSED_UP_SEC\" -gt 0 ]; then\n\t\tCPU_CHECKED=$((CPU_CHECKED + 1))\n\t\tpercent=\"$(awk -v a=\"$sum_us\" -v b=\"$EXPOSED_UP_SEC\" 'BEGIN { if (b > 0) printf \"%.2f\", (100 * a / (b * 1000000)); else print \"0.00\" }')\"\n\t\tsay \"$cpu_name.cpuidle_sum_percent_of_exposed_reference=$percent\"\n\
        \t\t# Idle sum can legitimately be lower than uptime under load, but a very\n\t\t# small value compared with a multi-day fake uptime is a strong leak.\n\t\tif less_than_half_uptime_us \"$sum_us\" \"$EXPOSED_UP_SEC\"; then\n\t\t\tCPU_WARN=$((CPU_WARN + 1))\n\t\t\twarn \"$cpu_name cpuidle time is below 50% of exposed uptime; likely real-boot-age leak\"\n\t\telse\n\t\t\tpass \"$cpu_name cpuidle time is no longer obviously shorter than exposed uptime\"\n\t\tfi\n\tfi\ndone\nsay \"cpuidle_cpu_dirs=$CPU_FOUND checked_online=$CPU_CHECKED warned=$CPU_WARN\"\nif [ \"$CPU_FOUND\" -eq 0 ]; then\n\tinfo \"cpuidle sysfs is absent on this runtime\"\nfi\n\nsection \"CPUFREQ TIME_IN_STATE (RETAINED V110)\"\nTIS_FOUND=0\nTIS_CHECKED=0\nTIS_LEAK=0\nTIS_WARN=0\naudit_tis_file()\n{\n\ttis=\"$1\"\n\t[ -r \"$tis\" ] || return 0\n\tTIS_FOUND=$((TIS_FOUND + 1))\n\tsay \"-- $tis --\"\n\ttis_ticks=\"$(awk '$2 ~ /^[0-9]+$/ { total += $2 } END { printf \"%.0f\\n\", total + 0 }' \"$tis\" 2>/dev/null || echo 0)\"\n\ttis_ticks=\"$(numeric_or_zero \"$tis_ticks\")\"\n\tcat \"$tis\" >>\"$OUT\" 2>&1 || true\n\ttis_seconds=\"$(awk -v ticks=\"$tis_ticks\" -v hz=\"$HZ\" 'BEGIN { if (hz > 0) printf \"%.2f\", ticks / hz; else print \"0.00\" }')\"\n\ttis_percent=\"$(awk -v ticks=\"$tis_ticks\" -v hz=\"$HZ\" -v up=\"$EXPOSED_UP_SEC\" 'BEGIN { if (hz > 0 && up > 0) printf \"%.2f\", 100 * ticks / (hz * up); else print \"0.00\" }')\"\n\tsay \"sum_raw_ticks=$tis_ticks\"\n\tsay \"sum_seconds_at_CLK_TCK=$tis_seconds\"\n\tsay \"sum_percent_of_exposed_reference=$tis_percent\"\n\tif [ \"$EXPOSED_UP_SEC\" -gt 0 ]; then\n\t\tTIS_CHECKED=$((TIS_CHECKED + 1))\n\t\tif awk -v ticks=\"$tis_ticks\" -v hz=\"$HZ\" -v up=\"$EXPOSED_UP_SEC\" \\\n\t\t\t'BEGIN { exit !(hz > 0 && up > 0 && ticks / hz < up / 2) }'; then\n\t\t\tTIS_LEAK=1\n\t\t\tTIS_WARN=$((TIS_WARN + 1))\n\t\tfi\n\tfi\n}\n\n# The per-CPU paths are normally symlinks to policy paths. Prefer the canonical\n# policy list so one physical counter is not reported repeatedly.\nfor tis in /sys/devices/system/cpu/cpufreq/policy[0-9]*/stats/time_in_state; do\n\taudit_tis_file \"$tis\"\ndone\nif [ \"$TIS_FOUND\" -eq 0 ]; then\n\tfor tis in /sys/devices/system/cpu/cpu[0-9]*/cpufreq/stats/time_in_state; do\n\t\taudit_tis_file \"$tis\"\n\tdone\nfi\nsay \"cpufreq_time_in_state_files=$TIS_FOUND checked=$TIS_CHECKED warned=$TIS_WARN\"\nif [ \"$TIS_FOUND\" -eq 0 ]; then\n\tinfo \"no readable cpufreq time_in_state file\"\nelse\n\tinfo \"cpufreq time_in_state found; its tick sum is reported as seconds and percent of the exposed reference\"\n\tif [ \"$TIS_CHECKED\" -eq 0 ]; then\n\t\tinfo \"V110 cpufreq comparison skipped because no exposed uptime reference was available\"\n\telif [ \"$TIS_LEAK\" -eq 1 ]; then\n\t\twarn \"retained V110 cpufreq time_in_state is below 50% of exposed uptime in ${TIS_WARN} readable path(s)\"\n\telse\n\t\tpass \"retained V110 cpufreq time_in_state totals are no longer obviously shorter than exposed uptime\"\n\tfi\nfi\n\nsection \"PROC STAT SOFTIRQ DUPLICATE (V111 TARGET)\"\nif [ -r /proc/stat ]; then\n\tsay \"-- selected /proc/stat counters --\"\n\tawk '$1 ~ /^(intr|ctxt|btime|processes|procs_running|procs_blocked|softirq)$/ { print }' \\\n\t\t/proc/stat >>\"$OUT\" 2>&1 || true\n\tSTAT_SOFT_TOTAL=\"$(awk '$1 == \"softirq\" { print $2; exit }' /proc/stat 2>/dev/null || echo 0)\"\n\tSTAT_SOFT_TOTAL=\"$(numeric_or_zero \"$STAT_SOFT_TOTAL\")\"\n\tsay \"proc_stat_softirq_total=$STAT_SOFT_TOTAL\"\n\n\tif [ -r /proc/softirqs ]; then\n\t\t# Sum every per-CPU numeric cell. This is the same underlying kernel\n\t\t# counter family exported independently by /proc/stat.\n\t\tPROC_SOFT_TOTAL=\"$(awk 'NR > 1 { for (i = 2; i <= NF; i++) if ($i ~ /^[0-9]+$/) total += $i } END { printf \"%.0f\\n\", total + 0 }' /proc/softirqs 2>/dev/null || echo 0)\"\n\t\tPROC_SOFT_TOTAL=\"$(numeric_or_zero \"$PROC_SOFT_TOTAL\")\"\n\t\tSOFT_ABS_DIFF=\"$(awk -v a=\"$STAT_SOFT_TOTAL\" -v b=\"$PROC_SOFT_TOTAL\" 'BEGIN { d = a - b; if (d < 0) d = -d; printf \"%.0f\\n\", d }')\"\n\t\tSOFT_DIFF_PERCENT=\"$(awk -v d=\"$SOFT_ABS_DIFF\" -v b=\"$PROC_SOFT_TOTAL\"\
        \ 'BEGIN { if (b > 0) printf \"%.6f\", 100 * d / b; else print \"0.000000\" }')\"\n\t\tsay \"proc_softirqs_sum=$PROC_SOFT_TOTAL\"\n\t\tsay \"softirq_absolute_diff=$SOFT_ABS_DIFF\"\n\t\tsay \"softirq_diff_percent=$SOFT_DIFF_PERCENT\"\n\n\t\t# The files are opened one after another, so a small live-counter race is\n\t\t# expected. Accept either <=100,000 events or <=0.1 percent difference.\n\t\tif awk -v d=\"$SOFT_ABS_DIFF\" -v p=\"$SOFT_DIFF_PERCENT\" \\\n\t\t\t'BEGIN { exit !(d <= 100000 || p <= 0.1) }'; then\n\t\t\tpass \"V111 /proc/stat softirq duplicates the shifted /proc/softirqs axis within read-race tolerance\"\n\t\telse\n\t\t\twarn \"V111 /proc/stat softirq still disagrees with /proc/softirqs; send this report before another patch\"\n\t\tfi\n\telse\n\t\tinfo \"/proc/softirqs is not readable, so V111 duplicate-counter comparison is unavailable\"\n\tfi\nelse\n\tinfo \"/proc/stat is not readable for this UID\"\nfi\n\nsection \"PROC STAT INTR DUPLICATE AGGREGATE (RETAINED V114)\"\nif [ -r /proc/stat ] && [ -r /proc/interrupts ]; then\n\tSTAT_INTR_TOTAL=\"$(awk '$1 == \"intr\" { print $2; exit }' /proc/stat 2>/dev/null || echo 0)\"\n\tSTAT_INTR_TOTAL=\"$(numeric_or_zero \"$STAT_INTR_TOTAL\")\"\n\t# Sum exactly the CPU columns.  V114's older audit incorrectly summed every\n\t# numeric token after the IRQ label (including hardware IRQ IDs/numeric\n\t# action names) and excluded IPI/arch rows whose labels are not numeric.\n\t# fs/proc/stat.c includes both regular IRQ and arch IRQ statistics, so accept\n\t# every colon-labelled row and stop after the CPU columns from the header.\n\tPROC_IRQ_TOTAL=\"$(awk '\n\t\tNR == 1 {\n\t\t\tcpu_cols = 0\n\t\t\tfor (i = 1; i <= NF; i++)\n\t\t\t\tif ($i ~ /^CPU[0-9]+$/)\n\t\t\t\t\tcpu_cols++\n\t\t\tnext\n\t\t}\n\t\t$1 ~ /:$/ && cpu_cols > 0 {\n\t\t\tfor (i = 2; i <= cpu_cols + 1 && i <= NF; i++)\n\t\t\t\tif ($i ~ /^[0-9]+$/)\n\t\t\t\t\ttotal += $i\n\t\t}\n\t\tEND { printf \"%.0f\\n\", total + 0 }\n\t' /proc/interrupts 2>/dev/null || echo 0)\"\n\tPROC_IRQ_TOTAL=\"$(numeric_or_zero \"$PROC_IRQ_TOTAL\")\"\n\tINTR_ABS_DIFF=\"$(awk -v a=\"$STAT_INTR_TOTAL\" -v b=\"$PROC_IRQ_TOTAL\" 'BEGIN { d = a - b; if (d < 0) d = -d; printf \"%.0f\\n\", d }')\"\n\tINTR_DIFF_PERCENT=\"$(awk -v d=\"$INTR_ABS_DIFF\" -v b=\"$PROC_IRQ_TOTAL\" 'BEGIN { if (b > 0) printf \"%.6f\", 100 * d / b; else print \"0.000000\" }')\"\n\tsay \"proc_stat_intr_total=$STAT_INTR_TOTAL\"\n\tsay \"proc_interrupts_irq_cells_sum=$PROC_IRQ_TOTAL\"\n\tsay \"intr_absolute_diff=$INTR_ABS_DIFF\"\n\tsay \"intr_diff_percent=$INTR_DIFF_PERCENT\"\n\n\t# /proc/stat and /proc/interrupts are sampled sequentially.  The retained V114\n\t# display layer must follow the V88 arch_timer + arch_mem_timer shift, while\n\t# ordinary interrupt activity can advance between the two reads.\n\tif awk -v d=\"$INTR_ABS_DIFF\" -v p=\"$INTR_DIFF_PERCENT\" \\\n\t\t'BEGIN { exit !(d <= 100000 || p <= 0.1) }'; then\n\t\tpass \"retained V114 /proc/stat intr mirrors the V88-shifted /proc/interrupts aggregate within read-race tolerance\"\n\telse\n\t\twarn \"retained V114 /proc/stat intr disagrees with the corrected /proc/interrupts CPU-cell sum\"\n\tfi\nelse\n\tinfo \"/proc/stat or /proc/interrupts is not readable, so retained V114 intr comparison is unavailable\"\nfi\n\nsection \"PROC STAT CONTEXT SWITCH READOUT (V115 RETAINED)\"\nif [ -r /proc/stat ]; then\n\tSTAT_CTXT_TOTAL=\"$(awk '$1 == \"ctxt\" { print $2; exit }' /proc/stat 2>/dev/null || echo 0)\"\n\tSTAT_CTXT_TOTAL=\"$(numeric_or_zero \"$STAT_CTXT_TOTAL\")\"\n\tsay \"proc_stat_ctxt_total=$STAT_CTXT_TOTAL\"\n\tif [ \"$EXPOSED_UP_SEC\" -gt 0 ] && awk -v c=\"$STAT_CTXT_TOTAL\" 'BEGIN { exit !(c + 0 > 0) }'; then\n\t\tCTXT_PER_SEC=\"$(awk -v c=\"$STAT_CTXT_TOTAL\" -v u=\"$EXPOSED_UP_SEC\" 'BEGIN { if (u > 0) printf \"%.2f\", c / u; else print \"0.00\" }')\"\n\t\tsay \"proc_stat_ctxt_per_exposed_second=$CTXT_PER_SEC\"\n\t\t# V115 adds ten times the retained V114 timer-IRQ display offset.  With\n\t\t# eight possible CPUs and V88 rates 40+4/s, the synthetic axis is about\n\t\t# 3520 context switches/s, close to\
        \ the 3463/s measured on V114.\n\t\tif awk -v r=\"$CTXT_PER_SEC\" 'BEGIN { exit !(r >= 3000 && r <= 5000) }'; then\n\t\t\tpass \"retained V115 /proc/stat ctxt is on the expected ghost-uptime display axis\"\n\t\telse\n\t\t\twarn \"retained V115 /proc/stat ctxt rate is outside the expected 3000-5000/s display range\"\n\t\tfi\n\telse\n\t\tinfo \"retained V115 ctxt comparison skipped because ctxt or exposed uptime is unavailable\"\n\tfi\nelse\n\tinfo \"/proc/stat is not readable, so the retained V115 ctxt comparison is unavailable\"\nfi\n\nsection \"PROC STAT PROCESSES READOUT (RETAINED V119.1)\"\nif [ -r /proc/stat ]; then\n\tSTAT_PROCESSES=\"$(awk '$1 == \"processes\" { print $2; exit }' /proc/stat 2>/dev/null || echo 0)\"\n\tSTAT_PROCESSES=\"$(numeric_or_zero \"$STAT_PROCESSES\")\"\n\tsay \"proc_stat_processes_total=$STAT_PROCESSES\"\n\tif [ \"$EXPOSED_UP_SEC\" -gt 0 ] && awk -v p=\"$STAT_PROCESSES\" 'BEGIN { exit !(p + 0 > 0) }'; then\n\t\tPROCESSES_PER_SEC=\"$(awk -v p=\"$STAT_PROCESSES\" -v u=\"$EXPOSED_UP_SEC\" 'BEGIN { if (u > 0) printf \"%.4f\", p / u; else print \"0.0000\" }')\"\n\t\tsay \"proc_stat_processes_per_exposed_second=$PROCESSES_PER_SEC\"\n\t\t# V119.1 adds one synthetic historical process for every ghost-offset\n\t\t# second. Real total_forks is still included, so the observed rate should\n\t\t# normally be at least ~1/s but can be somewhat higher on an active boot.\n\t\tif awk -v r=\"$PROCESSES_PER_SEC\" 'BEGIN { exit !(r >= 0.75 && r <= 8.0) }'; then\n\t\t\tpass \"V119.1 /proc/stat processes no longer exposes a tiny real-session-only history\"\n\t\telse\n\t\t\twarn \"V119.1 /proc/stat processes rate is outside the expected 0.75-8.0/s ghost-history range\"\n\t\tfi\n\telse\n\t\tinfo \"V119.1 processes comparison skipped because processes or exposed uptime is unavailable\"\n\tfi\nelse\n\tinfo \"/proc/stat is not readable, so the V119.1 processes comparison is unavailable\"\nfi\n\nsection \"CLOCK DOMAIN HARDENING (RETAINED V119.1)\"\nif [ -r /proc/ghost_sched_clock_probe ]; then\n\tsay \"ghost_sched_clock_probe_readable=yes\"\n\thead -n 80 /proc/ghost_sched_clock_probe >>\"$OUT\" 2>&1 || true\n\twarn \"V96 debug probe is still shipped and directly exposes sched_clock/local_clock/MONOTONIC/RAW; production cleanup failed\"\nelse\n\tsay \"ghost_sched_clock_probe_readable=no\"\n\tpass \"V119.1 production image no longer exposes the V96 direct real-clock proc probe\"\nfi\n\nsection \"OTHER READABLE TIME SURFACES\"\nfor path in \\\n\t/proc/pressure/cpu /proc/pressure/io /proc/pressure/memory \\\n\t/sys/power/suspend_stats \\\n\t/sys/kernel/debug/suspend_stats \\\n\t/sys/kernel/debug/wakeup_sources \\\n\t/sys/kernel/wakeup_reasons/last_suspend_time \\\n\t/sys/kernel/wakeup_reasons/last_resume_reason \\\n\t/proc/timer_list /proc/softirqs /proc/interrupts; do\n\tsay \"-- $path --\"\n\tif [ -d \"$path\" ]; then\n\t\tsay \"readable_directory=yes\"\n\t\tchild_found=0\n\t\tfor child in \"$path\"/*; do\n\t\t\t[ -f \"$child\" ] || continue\n\t\t\tchild_found=1\n\t\t\tsay \"-- child ${child##*/} --\"\n\t\t\thead -n 80 \"$child\" >>\"$OUT\" 2>&1 || true\n\t\tdone\n\t\t[ \"$child_found\" -eq 1 ] || say \"directory has no readable regular child files\"\n\telif [ -r \"$path\" ]; then\n\t\tsay \"readable=yes\"\n\t\thead -n 80 \"$path\" >>\"$OUT\" 2>&1 || true\n\telse\n\t\tsay \"readable=no\"\n\tfi\ndone\n\nsection \"BOOT AND SERVICE PROPERTIES\"\nif command -v getprop >/dev/null 2>&1; then\n\tgetprop 2>/dev/null | grep -E '\\[(ro\\.boottime\\.|ro\\.runtime\\.firstboot|sys\\.boot_completed|init\\.svc\\.)' | head -n 250 >>\"$OUT\" 2>&1 || true\nelse\n\tinfo \"getprop unavailable\"\nfi\nif command -v settings >/dev/null 2>&1; then\n\tsay \"global.boot_count=$(settings get global boot_count 2>/dev/null || true)\"\nfi\n\nsection \"DUMPSYS / FRAMEWORK CLOCK EVIDENCE (V127)\"\nif command -v dumpsys >/dev/null 2>&1; then\n\tALARM_RUNTIME=\"$(dumpsys alarm 2>/dev/null | sed -n 's/^[[:space:]]*Runtime uptime (elapsed):[[:space:]]*//p' | head -n 1 || true)\"\n\tsay \"alarm_runtime_uptime_elapsed=${ALARM_RUNTIME:-unavailable}\"\n\t\
        for service in alarm power batterystats activity; do\n\t\tsay \"-- dumpsys $service --\"\n\t\tdumpsys \"$service\" 2>/dev/null | \\\n\t\t\tgrep -iE 'uptime|elapsed|realtime|start clock|time since|last wake|last sleep|boot' | \\\n\t\t\thead -n 180 >>\"$OUT\" 2>&1 || say \"unavailable or no matching lines\"\n\tdone\n\tif [ -n \"$ALARM_RUNTIME\" ] && [ \"$EXPOSED_UP_SEC\" -gt 86400 ]; then\n\t\twarn \"framework service Runtime uptime remains session-relative; a constant MONOTONIC offset cancels in now-minus-start durations, so V127 keeps system_server untouched; only the configured app-process Java canary is eligible for a constant offset\"\n\telse\n\t\tinfo \"dumpsys framework duration evidence needs manual review\"\n\tfi\nelse\n\tinfo \"dumpsys unavailable for this UID\"\nfi\n\nsection \"LOGCAT MONOTONIC EVIDENCE (V127)\"\nif command -v logcat >/dev/null 2>&1; then\n    LOGCAT_TMP=\"${OUT}.logcat.$$\"\n    rm -f \"$LOGCAT_TMP\" 2>/dev/null || true\n    logcat -v monotonic -d -t 40 >\"$LOGCAT_TMP\" 2>&1 &\n    LOGCAT_PID=$!\n    LOGCAT_TIMEOUT=0\n    i=0\n    while kill -0 \"$LOGCAT_PID\" 2>/dev/null; do\n        i=$((i + 1))\n        if [ \"$i\" -ge 6 ]; then\n            LOGCAT_TIMEOUT=1\n            kill -TERM \"$LOGCAT_PID\" 2>/dev/null || true\n            sleep 1\n            kill -KILL \"$LOGCAT_PID\" 2>/dev/null || true\n            break\n        fi\n        sleep 1\n    done\n    wait \"$LOGCAT_PID\" 2>/dev/null || true\n\n    LOGCAT_MONO=\"$(head -n 80 \"$LOGCAT_TMP\" 2>/dev/null || true)\"\n    rm -f \"$LOGCAT_TMP\" 2>/dev/null || true\n    printf '%s\\n' \"$LOGCAT_MONO\" >>\"$OUT\"\n\n    if [ \"$LOGCAT_TIMEOUT\" -eq 1 ]; then\n        warn \"V127 logcat -v monotonic exceeded the 6-second watchdog; wrapper recursion or a blocked real binary is still present\"\n    fi\n\n    LOGCAT_MONO_LAST=\"$(printf '%s\\n' \"$LOGCAT_MONO\" | awk '\n        /^[[:space:]]*[0-9]+\\.[0-9]+[[:space:]]/ {\n            x=$1\n            sub(/\\..*/, \"\", x)\n            if (x ~ /^[0-9]+$/) last=x\n        }\n        END { if (last != \"\") print last }\n    ')\"\n    LOGCAT_MONO_LAST=\"$(numeric_or_zero \"$LOGCAT_MONO_LAST\")\"\n    LOGCAT_REF_SEC=\"$SELF_START_SEC\"\n    LOGCAT_REF_SOURCE=\"/proc/self/stat starttime\"\n    if [ \"$LOGCAT_REF_SEC\" -le 0 ]; then\n        LOGCAT_REF_SEC=\"$EXPOSED_UP_SEC\"\n        LOGCAT_REF_SOURCE=\"$EXPOSED_UP_SOURCE\"\n    fi\n    say \"logcat_monotonic_reference_source=$LOGCAT_REF_SOURCE\"\n    say \"logcat_monotonic_reference_seconds=$LOGCAT_REF_SEC\"\n    say \"logcat_monotonic_last_seconds=$LOGCAT_MONO_LAST\"\n    say \"logcat_monotonic_watchdog_timeout=$LOGCAT_TIMEOUT\"\n    if [ \"$LOGCAT_MONO_LAST\" -gt 0 ] && [ \"$LOGCAT_REF_SEC\" -gt 0 ]; then\n        LOGCAT_DIFF=$((LOGCAT_REF_SEC - LOGCAT_MONO_LAST))\n        [ \"$LOGCAT_DIFF\" -ge 0 ] || LOGCAT_DIFF=$((-LOGCAT_DIFF))\n        say \"logcat_monotonic_abs_diff_vs_fake_monotonic_reference_sec=$LOGCAT_DIFF\"\n        if [ \"$LOGCAT_TIMEOUT\" -eq 0 ] && [ \"$LOGCAT_DIFF\" -le 120 ]; then\n            pass \"V127 logcat -v monotonic is aligned with the fake MONOTONIC process-start reference without hanging\"\n        elif [ \"$LOGCAT_REF_SEC\" -gt 86400 ] && awk -v logt=\"$LOGCAT_MONO_LAST\" -v fake=\"$LOGCAT_REF_SEC\" 'BEGIN { exit !(logt > 0 && logt < fake / 4) }'; then\n            warn \"V127 logcat wrapper is not active or failed open: logcat still exposes the short real-session MONOTONIC axis\"\n        else\n            warn \"logcat -v monotonic differs from the fake MONOTONIC reference by ${LOGCAT_DIFF}s\"\n        fi\n    elif [ \"$LOGCAT_TIMEOUT\" -eq 0 ]; then\n        info \"logcat monotonic timestamp was unavailable or unparsable for this UID\"\n    fi\nelse\n    info \"logcat unavailable for this UID\"\nfi\n\nsection \"KERNEL LOG ACCESS\"\nif dmesg >/dev/null 2>&1; then\n\tsay \"dmesg_readable=yes\"\n\tdmesg 2>/dev/null | head -n 20 >>\"$OUT\" || true\n\tSUSPEND_ERRORS=\"$(dmesg 2>/dev/null | grep -iE 'alarmtimer|failed to suspend|Some devices failed to suspend|error -16' | tail -n 40 || true)\"\n\tif [ -n \"$SUSPEND_ERRORS\"\
        \ ]; then\n\t\tsay \"suspend_error_evidence=yes\"\n\t\tprintf '%s\\n' \"$SUSPEND_ERRORS\" >>\"$OUT\"\n\t\twarn \"kernel log contains suspend/alarmtimer failure evidence; investigate before relying on deep sleep\"\n\telse\n\t\tsay \"suspend_error_evidence=no\"\n\tfi\nelse\n\tsay \"dmesg_readable=no\"\nfi\nif [ -r /dev/kmsg ]; then\n\tsay \"/dev/kmsg_readable=yes (not consumed by this audit)\"\nelse\n\tsay \"/dev/kmsg_readable=no\"\nfi\n\nsection \"SUMMARY\"\nsay \"passes=$PASS_COUNT\"\nsay \"warnings=$WARN_COUNT\"\nsay \"information=$INFO_COUNT\"\nsay \"current_v127_target=generation-aware package-scoped Java MONOTONIC guard; V127 retains V126.1 dynamic Zygisk ELF/firstboot/logcat behavior, fixes audit generation skew and empty-package pidof false positives, adds late-start module health telemetry, and verifies the workflow-selected kernel LOCALVERSION\"\nsay \"retained_v119_1_processes_target=/proc/stat processes receives one readout-only synthetic historical event per ghost-offset second; real total_forks accounting is unchanged\"\nsay \"retained_v115_target=/proc/stat ctxt receives ten times the retained V114 timer-IRQ synthetic display offset\"\nsay \"retained_v114_target=/proc/stat intr aggregate duplicates the V88-shifted /proc/interrupts display counters at readout\"\nsay \"retained_v111_target=/proc/stat softirq duplicates the already-shifted /proc/softirqs counters at readout\"\nsay \"retained_v110_target=cpufreq time_in_state sysfs totals receive one readout-only ghost offset\"\nsay \"retained_v109_target=sysinfo uptime consumes the already-shifted BOOTTIME value exactly once\"\nsay \"retained_v108_target=cpuidle state time remains shifted at readout\"\nsay \"timer_list_finding=/proc/timer_list is already on the fake uptime axis from retained V61\"\nsay \"clock_probe_finding=V96 /proc/ghost_sched_clock_probe must be absent from the production build because it directly exposed real MONOTONIC/RAW\"\nsay \"v127_firstboot_target=retained KernelSU post-fs-data guard pre-seeds ro.runtime.firstboot from wall_clock_minus_current_ghost_uptime before Zygote; boot-completed refresh corrects later wall-clock drift\"\nsay \"v127_logcat_target=retained V123 recursion-proof display-only logcat wrapper remains unchanged and fail-open\"\nsay \"v127_app_clock_target=only the configured target UID is eligible for Zygisk hooks to android.os.SystemClock.uptimeMillis and java.lang.System.nanoTime; V127 uses the already-enabled compatible loader, resolves only the configured target UID, and records health/preAppSpecialize/JNI evidence; system_server and all other app UIDs are untouched\"\nsay \"remaining_limitation=V127 intentionally leaves direct native clock_gettime(CLOCK_MONOTONIC/RAW), apps outside the configured target UID, and framework now-minus-start durations unchanged; native interception remains deferred until a correctly-versioned V127 audit proves Java-hook execution\"\nsay \"psi_note=/proc/pressure total values are workload stall accumulators, not direct uptime counters; retained V119.1 intentionally does not synthesize them\"\nsay \"important=Run from adb shell when possible. An untrusted app UID may be denied /proc/uptime, /proc/stat and dumpsys, while Java/native clock APIs can still differ from shell-readable proc surfaces.\"\nsay \"important=This shell audit cannot directly invoke Java SystemClock APIs; dumpsys is only an indirect framework cross-check.\"\n\nprintf 'DONE: %s\\n' \"$OUT\"\nprintf 'Summary: PASS=%s WARN=%s INFO=%s\\n' \"$PASS_COUNT\" \"$WARN_COUNT\" \"$INFO_COUNT\"\n\nexit 0\nEOF_V1272_AUDIT_DIRECT\nIyEvc3lzdGVtL2Jpbi9zaAojIFYxMjYgbm9uLXJvb3QgZ2hvc3QtdXB0aW1lIGF1ZGl0IGZvciBY\naWFvbWkgMTFUIFBybyAodmlsaSkuCiMgVGhlIHNjcmlwdCBpcyByZWFkLW9ubHksIG5ldmVyIGlu\ndm9rZXMgc3UsIGFuZCB3b3JrcyBmcm9tIGFkYiBzaGVsbCBvciBhCiMgbm9ybWFsIEFuZHJvaWQg\ndGVybWluYWwuIEFEQiBzaGVsbCBjYW4gcmVhZCBtb3JlIHN1cmZhY2VzIHRoYW4gYW4gYXBwIFVJ\nRC4KCnNldCAtdQp1bWFzayAwNzcKClZFUlNJT049IlYxMjYiClNUQU1QPSIkKGRhdGUgKyVZJW0l\nZC0lSCVNJVMgMj4vZ