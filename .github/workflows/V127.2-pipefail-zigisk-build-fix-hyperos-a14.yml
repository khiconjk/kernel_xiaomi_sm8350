      run: "set -Eeuo pipefail\ncd kernel\necho \"===== QUIET BOOT KPI / MPM DMESG COUNTERS V72 =====\" | tee -a ../setup.log\necho \"Goal: keep V71 stable uptime behavior, but remove bootloader KPI / MPM counter message content that can reveal real early-boot counters. This does not modify timekeeping, scheduler, hrtimer, perf, or device init logic.\" | tee -a ../setup.log\n\npython3 - <<'PY_QUIET_BOOT_KPI_V72' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\nroots = [\n    Path('arch/arm64'),\n    Path('drivers'),\n    Path('kernel'),\n    Path('fs'),\n    Path('init'),\n]\nsuffixes = {'.c', '.h', '.S'}\n\nnoisy_fragments = [\n    'KPI: Bootloader start count',\n    'KPI: Bootloader end count',\n    'KPI: Bootloader display count',\n    'KPI: Bootloader load kernel count',\n    'KPI: Kernel MPM timestamp',\n    'KPI: Kernel MPM Clock frequency',\n    'Bootloader start count',\n    'Bootloader end count',\n    'Bootloader display count',\n    'Bootloader load kernel count',\n    'Kernel MPM timestamp',\n    'Kernel MPM Clock frequency',\n]\n\nneutral_map = {\n    'KPI: Bootloader start count': 'KPI: boot metric hidden',\n    'KPI: Bootloader end count': 'KPI: boot metric hidden',\n    'KPI: Bootloader display count': 'KPI: boot metric hidden',\n    'KPI: Bootloader load kernel count': 'KPI: boot metric hidden',\n    'KPI: Kernel MPM timestamp': 'KPI: boot metric hidden',\n    'KPI: Kernel MPM Clock frequency': 'KPI: boot metric hidden',\n    'Bootloader start count': 'boot metric hidden',\n    'Bootloader end count': 'boot metric hidden',\n    'Bootloader display count': 'boot metric hidden',\n    'Bootloader load kernel count': 'boot metric hidden',\n    'Kernel MPM timestamp': 'boot metric hidden',\n    'Kernel MPM Clock frequency': 'boot metric hidden',\n}\n\nprintk_re = re.compile(r'\\b(pr_(?:emerg|alert|crit|err|warn|warning|notice|info|debug)|printk|dev_(?:emerg|alert|crit|err|warn|warning|notice|info|dbg))\\b')\n\ndef quiet_file(data: str):\n    changed = False\n    quieted = 0\n    out = []\n    for line in data.splitlines(keepends=True):\n        if any(x in line for x in noisy_fragments) and printk_re.search(line) and ';' in line:\n            indent = line[:len(line) - len(line.lstrip())]\n            newline = '\\n' if line.endswith('\\n') else ''\n            out.append(indent + '/* Vili CI V72: quiet boot KPI/MPM dmesg counter. */' + newline)\n            changed = True\n            quieted += 1\n            continue\n\n        new_line = line\n        if any(x in new_line for x in noisy_fragments):\n            for old, new in neutral_map.items():\n                new_line = new_line.replace(old, new)\n            if new_line != line:\n                changed = True\n        out.append(new_line)\n    return ''.join(out), changed, quieted\n\nchanged_files = []\ntotal_quieted = 0\nfor root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*'):\n        if not p.is_file() or p.suffix not in suffixes:\n            continue\n        try:\n            data = p.read_text(errors='ignore')\n        except Exception:\n            continue\n        if not any(x in data for x in noisy_fragments):\n            continue\n        new, changed, quieted = quiet_file(data)\n        if changed:\n            p.write_text(new)\n            changed_files.append(str(p))\n            total_quieted += quieted\n\nprint('Changed files:')\nfor f in changed_files:\n    print('  ' + f)\nif not changed_files:\n    print('  none; boot KPI/MPM strings may already be absent or generated elsewhere')\nprint(f'Quieted single-line printk/pr/dev_* statements: {total_quieted}')\n\nleftovers = []\nfor root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*'):\n        if not p.is_file() or p.suffix not in suffixes:\n            continue\n        try:\n            data = p.read_text(errors='ignore')\n        except Exception:\n            continue\n        for frag in nois