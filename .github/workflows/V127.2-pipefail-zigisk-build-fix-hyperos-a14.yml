        \ || !value)\n                return -EINVAL;\n        if (copy_from_user(value, (void __user *)user_ptr, sizeof(*value)))\n                return -EFAULT;\n        return 0;\n}\n\nstatic int vili_put_i32_user(unsigned long user_ptr, s32 value)\n{\n        if (!user_ptr)\n                return 0;\n        if (copy_to_user((void __user *)user_ptr, &value, sizeof(value)))\n                return -EFAULT;\n        return 0;\n}\n\nstatic int vili_put_i32_pair(unsigned long p1, unsigned long p2,\n                             s32 v1, s32 v2, const char *tag)\n{\n        s32 old1 = 0x7fffffff;\n        s32 old2 = 0x7fffffff;\n        int ret;\n\n        if (p1)\n                vili_get_i32_user(p1, &old1);\n        if (p2)\n                vili_get_i32_user(p2, &old2);\n\n        ret = vili_put_i32_user(p1, v1);\n        if (ret)\n                goto out;\n        ret = vili_put_i32_user(p2, v2);\n\nout:\n        if (0) pr_err(\"VILI_SUSFS_BRIDGE_V30_%s: p1=0x%lx old1=%d new1=%d p2=0x%lx old2=%d new2=%d ret=%d\\n\",\n               tag ? tag : \"I32\", p1, old1, v1, p2, old2, v2, ret);\n        return ret;\n}\n\nstatic int vili_put_string_status(unsigned long p1, unsigned long p2,\n                                  const char *value, const char *tag)\n{\n        s32 old2 = 0x7fffffff;\n        s32 ok = 0;\n        size_t len;\n        int ret;\n\n        if (!p1 || !value)\n                return -EINVAL;\n\n        len = strlen(value) + 1;\n        ret = copy_to_user((void __user *)p1, value, len) ? -EFAULT : 0;\n        if (!ret && p2) {\n                vili_get_i32_user(p2, &old2);\n                ret = vili_put_i32_user(p2, ok);\n        }\n\n        if (0) pr_err(\"VILI_SUSFS_BRIDGE_V30_%s: p1=0x%lx str=%s len=%zu p2=0x%lx old2=%d new2=%d ret=%d\\n\",\n               tag ? tag : \"STRING_STATUS\", p1, value, len, p2, old2, ok, ret);\n        return ret;\n}\n\nstatic int vili_put_features(unsigned long p1, unsigned long p2,\n                             unsigned long features)\n{\n        int ret;\n        ret = vili_put_i32_pair(p1, p2, (s32)features, 0, \"FEATURES_I32\");\n        if (!ret)\n                return 0;\n        return (int)features;\n}\n\nint ksu_vili_handle_susfs_prctl(unsigned long cmd, unsigned long arg3,\n                                unsigned long arg4, unsigned long arg5)\n{\n        if (0) pr_err(\"VILI_SUSFS_BRIDGE_V30: cmd=0x%lx arg3=0x%lx arg4=0x%lx arg5=0x%lx uid=%u comm=%s\\n\",\n               cmd, arg3, arg4, arg5, current_uid().val, current->comm);\n        switch (cmd) {\n#ifdef CMD_SUSFS_ADD_SUS_PATH\n        case CMD_SUSFS_ADD_SUS_PATH:\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n                return susfs_add_sus_path((struct st_susfs_sus_path __user *)arg3);\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_ADD_SUS_KSTAT\n        case CMD_SUSFS_ADD_SUS_KSTAT:\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n                return susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg3);\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_UPDATE_SUS_KSTAT\n        case CMD_SUSFS_UPDATE_SUS_KSTAT:\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n                return susfs_update_sus_kstat((struct st_susfs_sus_kstat __user *)arg3);\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY\n        case CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY:\n#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n        {\n                struct st_susfs_sus_kstat info;\n                if (copy_from_user(&info, (void __user *)arg3, sizeof(info)))\n                        return -EFAULT;\n                info.is_statically = 1;\n                if (copy_to_user((void __user *)arg3, &info, sizeof(info)))\n                        return -EFAULT;\n                return susfs_add_sus_kstat((struct st_susfs_sus_kstat __user *)arg3);\n        }\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_SET_UNAME\n        case CMD_SUSFS_SET_UNAME:\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n                return susfs_set_uname((struct\
        \ st_susfs_uname __user *)arg3);\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_ENABLE_LOG\n        case CMD_SUSFS_ENABLE_LOG:\n#ifdef CONFIG_KSU_SUSFS_ENABLE_LOG\n                susfs_set_log(arg3 ? true : false);\n                return 0;\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_SHOW_VERSION\n        case CMD_SUSFS_SHOW_VERSION:\n                /*\n                 * V27 showed susfsd prints arg3 as a string buffer\n                 * and uses arg5 as a status int. Return a real NUL\n                 * terminated version string and clear status.\n                 */\n                return vili_put_string_status(arg3, arg5, SUSFS_VERSION, \"VERSION_STRING_STATUS\");\n#endif\n\n#ifdef CMD_SUSFS_SHOW_VARIANT\n        case CMD_SUSFS_SHOW_VARIANT:\n                return vili_put_string_status(arg3, arg5, SUSFS_VARIANT, \"VARIANT_STRING_STATUS\");\n#endif\n\n#ifdef CMD_SUSFS_SHOW_ENABLED_FEATURES\n        case CMD_SUSFS_SHOW_ENABLED_FEATURES:\n                return vili_put_features(arg3, arg5, vili_susfs_enabled_features());\n#endif\n\n#ifdef CMD_SUSFS_ADD_SUS_MOUNT\n        case CMD_SUSFS_ADD_SUS_MOUNT:\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n                return susfs_add_sus_mount((struct st_susfs_sus_mount __user *)arg3);\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_ADD_TRY_UMOUNT\n        case CMD_SUSFS_ADD_TRY_UMOUNT:\n#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\n                return susfs_add_try_umount((struct st_susfs_try_umount __user *)arg3);\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS\n        case CMD_SUSFS_RUN_UMOUNT_FOR_CURRENT_MNT_NS:\n#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\n                susfs_try_umount(current_uid().val);\n                return 0;\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG\n        case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG:\n#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\n                return susfs_set_cmdline_or_bootconfig((char __user *)arg3);\n#else\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_ADD_OPEN_REDIRECT\n        case CMD_SUSFS_ADD_OPEN_REDIRECT:\n#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n        {\n                int ret;\n                ret = susfs_add_open_redirect((struct st_susfs_open_redirect __user *)arg3);\n                pr_info(\"VILI_OPEN_REDIRECT_V61: ADD_OPEN_REDIRECT ret=%d arg3=0x%lx uid=%u comm=%s\\n\",\n                        ret, arg3, current_uid().val, current->comm);\n                return ret;\n        }\n#else\n                pr_info(\"VILI_OPEN_REDIRECT_V61: ADD_OPEN_REDIRECT unsupported uid=%u comm=%s\\n\",\n                        current_uid().val, current->comm);\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_SHOW_SUS_SU_WORKING_MODE\n        case CMD_SUSFS_SHOW_SUS_SU_WORKING_MODE:\n#ifdef CONFIG_KSU_SUSFS_SUS_SU\n        {\n                int mode = susfs_get_sus_su_working_mode();\n                int ret;\n                ret = vili_put_i32_pair(arg3, arg5, (s32)mode, 0, \"SUS_SU_MODE_I32_STATUS\");\n                if (0) pr_info(\"VILI_SUS_SU_RUNTIME_V39: SHOW_MODE mode=%d ret=%d arg3=0x%lx arg5=0x%lx uid=%u comm=%s\\n\",\n                        mode, ret, arg3, arg5, current_uid().val, current->comm);\n                return ret;\n        }\n#else\n                if (0) pr_info(\"VILI_SUS_SU_RUNTIME_V39: SHOW_MODE unsupported uid=%u comm=%s\\n\",\n                        current_uid().val, current->comm);\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_IS_SUS_SU_READY\n        case CMD_SUSFS_IS_SUS_SU_READY:\n#ifdef CONFIG_KSU_SUSFS_SUS_SU\n        {\n                int ret;\n                ret = vili_put_i32_pair(arg3, arg5, 1, 0, \"SUS_SU_READY_I32_STATUS\");\n                if (0) pr_info(\"VILI_SUS_SU_RUNTIME_V39: READY=1 ret=%d arg3=0x%lx arg5=0x%lx uid=%u comm=%s\\n\",\n                        ret, arg3, arg5, current_uid().val,\
        \ current->comm);\n                return ret;\n        }\n#else\n                if (0) pr_info(\"VILI_SUS_SU_RUNTIME_V39: READY=0 uid=%u comm=%s\\n\",\n                        current_uid().val, current->comm);\n                return 0;\n#endif\n#endif\n\n#ifdef CMD_SUSFS_SUS_SU\n        case CMD_SUSFS_SUS_SU:\n#ifdef CONFIG_KSU_SUSFS_SUS_SU\n        {\n                int ret;\n                if (0) pr_info(\"VILI_SUS_SU_RUNTIME_V39: SUS_SU_CMD enter arg3=0x%lx uid=%u comm=%s\\n\",\n                        arg3, current_uid().val, current->comm);\n                ret = susfs_sus_su((struct st_sus_su __user *)arg3);\n                if (0) pr_info(\"VILI_SUS_SU_RUNTIME_V39: SUS_SU_CMD ret=%d uid=%u comm=%s\\n\",\n                        ret, current_uid().val, current->comm);\n                return ret;\n        }\n#else\n                if (0) pr_info(\"VILI_SUS_SU_RUNTIME_V39: SUS_SU_CMD unsupported uid=%u comm=%s\\n\",\n                        current_uid().val, current->comm);\n                return -EOPNOTSUPP;\n#endif\n#endif\n\n        default:\n                if (0) pr_err(\"VILI_SUSFS_BRIDGE_V39_UNKNOWN: cmd=0x%lx arg3=0x%lx arg4=0x%lx arg5=0x%lx uid=%u comm=%s\\n\",\n                       cmd, arg3, arg4, arg5, current_uid().val, current->comm);\n                return -EOPNOTSUPP;\n        }\n}\nEOF_VILI_SUSFS_CMD_BRIDGE\n\npython3 - <<'PY_SUSFS_CMD_BRIDGE' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\nprint('Wrote drivers/kernelsu/vili_susfs_cmd_bridge.c')\n\nfor rel in ['drivers/kernelsu/Kbuild', 'drivers/kernelsu/Makefile']:\n    p = Path(rel)\n    if not p.exists():\n        continue\n    text = p.read_text(errors='ignore')\n    if 'vili_susfs_cmd_bridge.o' not in text:\n        text += '\\n# Vili CI: SuSFS userspace command bridge level 2\\nobj-$(CONFIG_KSU_SUSFS) += vili_susfs_cmd_bridge.o\\n'\n        p.write_text(text)\n        print('Registered vili_susfs_cmd_bridge.o in', rel)\n    else:\n        print(rel, 'already references vili_susfs_cmd_bridge.o')\n\n# KernelSU-Next legacy currently uses the supercall/sys_reboot path and\n# does not expose the classic non-GKI ksu_handle_prctl()/core_hook.c\n# target. SuSFS v1.5.x userspace still talks through prctl(0xDEADBEEF,\n# CMD_SUSFS_*, ...), so inject a small direct dispatcher into\n# kernel/sys.c instead of trying to patch a missing KSU prctl handler.\nsysc = Path('kernel/sys.c')\nif not sysc.exists():\n    raise SystemExit('ERROR: kernel/sys.c not found; cannot inject direct SuSFS prctl bridge')\n\ns = sysc.read_text(errors='ignore')\norig = s\n\ndecl = (\"\\n#ifdef CONFIG_KSU_SUSFS\\n\"\n        \"#ifndef EOPNOTSUPP\\n\"\n        \"#define EOPNOTSUPP 95\\n\"\n        \"#endif\\n\"\n        \"#ifndef KERNEL_SU_OPTION\\n\"\n        \"#define KERNEL_SU_OPTION 0xDEADBEEF\\n\"\n        \"#endif\\n\"\n        \"extern int ksu_vili_handle_susfs_prctl(unsigned long cmd, unsigned long arg3,\\n\"\n        \"                                       unsigned long arg4, unsigned long arg5);\\n\"\n        \"#endif\\n\")\nif 'ksu_vili_handle_susfs_prctl' not in s:\n    include_matches = list(re.finditer(r'^#include[^\\n]+\\n', s, flags=re.M))\n    if include_matches:\n        pos = include_matches[-1].end()\n        s = s[:pos] + decl + s[pos:]\n    else:\n        s = decl + s\n\nbridge_call = (\"\\n#ifdef CONFIG_KSU_SUSFS\\n\"\n        \"\\t/* Vili CI: direct SuSFS prctl bridge level 3 try_umount debug v8 v8.\\n\"\n        \"\\t * KernelSU-Next legacy root path stays untouched; this only services\\n\"\n        \"\\t * root-owned ksu_susfs userspace commands using prctl(0xDEADBEEF, ...).\\n\"\n        \"\\t */\\n\"\n        \"\\t/* IMPORTANT: do not swallow KernelSU Manager/userspace requests. */\\n\"\n        \"\\tif (option == KERNEL_SU_OPTION && !strncmp(current->comm, \\\"susfsd\\\", 6)) {\\n\"\n        \"\\t\\tif (0) pr_err(\\\"VILI_SUSFSD_PRCTL_FIX: option=0x%lx arg2=0x%lx arg3=0x%lx arg4=0x%lx arg5=0x%lx uid=%u\\\\n\\\",\\n\"\n        \"\\t\\t       option, arg2, arg3, arg4, arg5, current_uid().val);\\n\"\n        \"\\t\\tif (current_uid().val\
        \ != 0)\\n\"\n        \"\\t\\t\\treturn -EPERM;\\n\"\n        \"\\t\\t{\\n\"\n        \"\\t\\t\\tint vili_susfs_ret = ksu_vili_handle_susfs_prctl(arg2, arg3, arg4, arg5);\\n\"\n        \"\\t\\t\\tif (vili_susfs_ret != -EOPNOTSUPP)\\n\"\n        \"\\t\\t\\t\\treturn vili_susfs_ret;\\n\"\n        \"\\t\\t}\\n\"\n        \"\\t}\\n\"\n        \"#endif\\n\")\n\n\nif 'Vili CI: direct SuSFS prctl bridge level 3 try_umount debug v8 v8' not in s:\n    m = re.search(r'SYSCALL_DEFINE5\\s*\\(\\s*prctl\\s*,', s)\n    if not m:\n        raise SystemExit('ERROR: cannot find SYSCALL_DEFINE5(prctl) in kernel/sys.c')\n    brace = s.find('{', m.end())\n    if brace < 0:\n        raise SystemExit('ERROR: cannot find opening brace for SYSCALL_DEFINE5(prctl) in kernel/sys.c')\n    s = s[:brace+1] + bridge_call + s[brace+1:]\n\nif s != orig:\n    sysc.write_text(s)\n    print('Patched kernel/sys.c with direct SuSFS prctl syscall bridge.')\nelse:\n    print('kernel/sys.c already has direct SuSFS prctl syscall bridge.')\n\nfinal = sysc.read_text(errors='ignore')\nif 'ksu_vili_handle_susfs_prctl' not in final or 'Vili CI: direct SuSFS prctl bridge level 3 try_umount debug v8 v8' not in final:\n    raise SystemExit('ERROR: direct SuSFS prctl bridge injection verification failed in kernel/sys.c')\n\nprint('Selected SuSFS command bridge target: kernel/sys.c')\nprint('Patched kernel/sys.c with SuSFS command bridge dispatch.')\nPY_SUSFS_CMD_BRIDGE\n\necho \"===== PATCH SUSFS TRY_UMOUNT KSU COMPAT =====\" | tee -a ../setup.log\npython3 - <<'PY_SUSFS_TRY_UMOUNT_COMPAT' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\np = Path('fs/susfs.c')\nif not p.exists():\n    raise SystemExit('ERROR: fs/susfs.c not found; cannot patch ksu_try_umount compat')\ns = p.read_text(errors='ignore')\norig = s\n\nif 'ksu_try_umount(' in s and 'Vili CI: ksu_try_umount compat for legacy KernelSU' not in s:\n    # The upstream SuSFS 5.4 file may declare:\n    #   extern void ksu_try_umount(...);\n    # If we define ksu_try_umount as a macro before that extern line,\n    # clang expands the declaration itself and reports a conflicting type.\n    # Remove the stale extern first, then install the compat wrapper.\n    s = re.sub(r'^\\s*extern\\s+void\\s+ksu_try_umount\\s*\\([^;]*\\);\\s*\\n', '', s, flags=re.M)\n    block = '\\n/* Vili CI: ksu_try_umount compat for legacy KernelSU.\\n * SuSFS kernel-5.4 calls ksu_try_umount(), but KernelSU-Next legacy\\n * used on vili does not expose that helper. Keep TRY_UMOUNT buildable\\n * by routing the requested path to the kernel\\'s internal path_umount().\\n */\\n#ifndef VILI_KSU_TRY_UMOUNT_COMPAT\\n#define VILI_KSU_TRY_UMOUNT_COMPAT\\n#include <linux/namei.h>\\n#include <linux/types.h>\\n#include \"internal.h\"\\nstatic void vili_ksu_try_umount_compat(const char *target, bool check_mnt,\\n                                       int flags, uid_t target_uid)\\n{\\n        struct path path;\\n\\n        (void)check_mnt;\\n        (void)target_uid;\\n\\n        if (!target || !target[0])\\n                return;\\n\\n        if (kern_path(target, LOOKUP_FOLLOW, &path))\\n                return;\\n\\n        path_umount(&path, flags);\\n        path_put(&path);\\n}\\n#define ksu_try_umount(_target, _check_mnt, _flags, _target_uid)         vili_ksu_try_umount_compat((_target), (_check_mnt), (_flags), (_target_uid))\\n#endif\\n'\n    # Put the compat block after the include section so types/macros exist,\n    # while still before susfs_try_umount() calls ksu_try_umount().\n    incs = list(re.finditer(r'^#include[^\\n]+\\n', s, flags=re.M))\n    if incs:\n        pos = incs[-1].end()\n        s = s[:pos] + block + '\\n' + s[pos:]\n    else:\n        s = block + '\\n' + s\n\nif s != orig:\n    p.write_text(s)\n    print('Patched fs/susfs.c with vili_ksu_try_umount_compat().')\nelse:\n    print('fs/susfs.c already has ksu_try_umount compat or no ksu_try_umount call found.')\n\nfinal = p.read_text(errors='ignore')\nif 'ksu_try_umount(' in final and 'vili_ksu_try_umount_compat' not in final:\n    raise SystemExit('ERROR: ksu_try_umount\
        \ compat verification failed')\nif re.search(r'^\\s*extern\\s+void\\s+ksu_try_umount\\s*\\(', final, flags=re.M):\n    raise SystemExit('ERROR: stale extern ksu_try_umount declaration still present')\nPY_SUSFS_TRY_UMOUNT_COMPAT\n\necho \"===== SUSFS TRY_UMOUNT COMPAT VERIFY =====\" | tee -a ../setup.log\ngrep -Rns \"vili_ksu_try_umount_compat\\|ksu_try_umount\" fs/susfs.c 2>/dev/null | head -80 | tee -a ../setup.log || true\n\necho \"===== SUSFS COMMAND BRIDGE VERIFY =====\" | tee -a ../setup.log\ngrep -Rns \"vili_susfs_cmd_bridge\\|ksu_vili_handle_susfs_prctl\\|CMD_SUSFS\" drivers/kernelsu 2>/dev/null | head -160 | tee -a ../setup.log || true\n\necho \"===== ADD SUSFS REAL DOMAIN COMPAT V22 =====\" | tee -a ../setup.log\ncat > drivers/kernelsu/vili_susfs_domain_compat.c <<'EOF_VILI_SUSFS_DOMAIN_COMPAT'\n// SPDX-License-Identifier: GPL-2.0\n/*\n * Vili CI V22: real-domain debug compat for SuSFS 5.4 namespace/mount port.\n *\n * V20/V21 booted with SUS_MOUNT enabled, but domain helpers were weak\n * conservative fallbacks.  This build upgrades KSU/zygote detection to\n * check the current task SELinux security context.  HIDE remains off and\n * LOG is enabled so runtime behaviour can be inspected from dmesg/kallsyms.\n */\n#include <linux/compiler.h>\n#include <linux/cred.h>\n#include <linux/kernel.h>\n#include <linux/sched.h>\n#include <linux/security.h>\n#include <linux/string.h>\n#include <linux/types.h>\n\nstatic bool vili_susfs_current_secctx_has(const char *needle)\n{\n#if IS_ENABLED(CONFIG_SECURITY)\n        u32 secid = 0;\n        char *secctx = NULL;\n        u32 secctx_len = 0;\n        bool matched = false;\n\n        if (!needle || !needle[0])\n                return false;\n\n        security_cred_getsecid(current_cred(), &secid);\n        if (!secid)\n                return false;\n\n        if (security_secid_to_secctx(secid, &secctx, &secctx_len))\n                return false;\n\n        if (secctx) {\n                matched = strstr(secctx, needle) != NULL;\n                security_release_secctx(secctx, secctx_len);\n        }\n\n        return matched;\n#else\n        (void)needle;\n        return false;\n#endif\n}\n\nbool susfs_is_current_ksu_domain(void)\n{\n        const char *comm = current->comm;\n\n        if (vili_susfs_current_secctx_has(\"u:r:ksu:s0\") ||\n            vili_susfs_current_secctx_has(\":ksu:\"))\n                return true;\n\n        /* Fallback for very early KSU helper threads or kernels where\n         * secctx lookup is unavailable during this call path.\n         */\n        if (comm && (!strcmp(comm, \"ksud\") ||\n                     !strcmp(comm, \"su\") ||\n                     !strcmp(comm, \"ksu\")))\n                return true;\n\n        return false;\n}\n\nbool susfs_is_current_zygote_domain(void)\n{\n        const char *comm = current->comm;\n\n        if (vili_susfs_current_secctx_has(\"u:r:zygote:s0\") ||\n            vili_susfs_current_secctx_has(\":zygote:\"))\n                return true;\n\n        if (!comm)\n                return false;\n\n        return !strcmp(comm, \"zygote\") ||\n               !strcmp(comm, \"zygote64\") ||\n               !strcmp(comm, \"zygote32\") ||\n               !strcmp(comm, \"main\");\n}\n\n__weak void susfs_try_umount_all(uid_t uid)\n{\n        /* Keep this weak on V22.  The main purpose of this build is\n         * real-domain validation; TRY_UMOUNT command path remains\n         * available through susfs_add_try_umount/susfs_try_umount.\n         */\n        (void)uid;\n}\nEOF_VILI_SUSFS_DOMAIN_COMPAT\n\npython3 - <<'PY_VILI_SUSFS_DOMAIN_COMPAT' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\nentries = {\n    Path('drivers/kernelsu/Kbuild'): 'obj-$(CONFIG_KSU_SUSFS) += vili_susfs_domain_compat.o',\n    Path('drivers/kernelsu/Makefile'): 'obj-$(CONFIG_KSU_SUSFS) += vili_susfs_domain_compat.o',\n}\nfor path, line in entries.items():\n    if path.exists():\n        data = path.read_text(errors='ignore')\n        if line not in data:\n            data = data.rstrip() + '\\n' + line + '\\n'\n            path.write_text(data)\n\
        \            print(f'Registered vili_susfs_domain_compat.o in {path}')\n        else:\n            print(f'{path} already registers vili_susfs_domain_compat.o')\n    else:\n        print(f'WARN: {path} not found while registering vili_susfs_domain_compat.o')\n\n# Defensive cleanup: some earlier V18/V19 generated literal \\n text inside Kbuild/Makefile.\nfor rel in ['drivers/kernelsu/Kbuild', 'drivers/kernelsu/Makefile']:\n    p = Path(rel)\n    if p.exists():\n        data = p.read_text(errors='ignore')\n        fixed = data.replace('\\\\n', '\\n')\n        if fixed != data:\n            p.write_text(fixed)\n            print(f'Fixed literal backslash-n entries in {p}')\nPY_VILI_SUSFS_DOMAIN_COMPAT\n\necho \"===== SUSFS DOMAIN/MOUNT LINK COMPAT VERIFY =====\" | tee -a ../setup.log\ngrep -Rns \"vili_susfs_domain_compat\\|susfs_is_current_ksu_domain\\|susfs_is_current_zygote_domain\\|susfs_try_umount_all\" drivers/kernelsu fs/namespace.c 2>/dev/null | head -140 | tee -a ../setup.log || true\n\necho \"===== PATCH SUS_SU KCONFIG DEPENDENCY FOR MANUAL-HOOK TREE =====\" | tee -a ../setup.log\npython3 - <<'PY_VILI_SUS_SU_KCONFIG'\nfrom pathlib import Path\np = Path('drivers/kernelsu/Kconfig')\ndata = p.read_text(errors='ignore')\nold = 'depends on KSU_SUSFS && KPROBES && HAVE_KPROBES && KPROBE_EVENTS'\nnew = 'depends on KSU_SUSFS'\nif old in data:\n    data = data.replace(old, new)\n    p.write_text(data)\n    print('Patched KSU_SUSFS_SUS_SU dependency: KSU_SUSFS only')\nelse:\n    print('WARN: exact SUS_SU dependency line not found; showing nearby block')\nPY_VILI_SUS_SU_KCONFIG\ngrep -nA8 -B4 \"config KSU_SUSFS_SUS_SU\" drivers/kernelsu/Kconfig | tee -a ../setup.log || true\n\n\necho \"===== ADD SUS_SU MANUAL-HOOK LINK COMPAT V35 =====\" | tee -a ../setup.log\npython3 - <<'PY_VILI_SUS_SU_LINK_COMPAT'\nfrom pathlib import Path\ncompat = Path('drivers/kernelsu/vili_sus_su_link_compat.c')\ncompat.write_text(r\"\"\"\n#include <linux/types.h>\n#include <linux/printk.h>\n#include <linux/fs.h>\n\n/*\n * Vili CI V61: SUS_SU link compat for KernelSU legacy manual-hook tree.\n *\n * Upstream SuSFS SUS_SU is designed around KSU kprobe hook helpers.  This\n * kernel is intentionally kept on the proven manual-hook root path, so the\n * kprobe-only helpers are not provided by KernelSU-Next legacy.  These weak\n * fallbacks let us build and boot-test CONFIG_KSU_SUSFS_SUS_SU without\n * changing the stable root hook path from V30.\n *\n * If a future KSU tree provides real implementations, the strong symbols from\n * that tree override these weak definitions.\n */\n__attribute__((weak)) void ksu_susfs_enable_sus_su(void)\n{\n#ifdef CONFIG_KSU_SUSFS_ENABLE_LOG\n        if (0) pr_info_once(\"VILI_SUS_SU_COMPAT_V39: ksu_susfs_enable_sus_su fallback active\\n\");\n#endif\n}\n\n__attribute__((weak)) void ksu_susfs_disable_sus_su(void)\n{\n#ifdef CONFIG_KSU_SUSFS_ENABLE_LOG\n        if (0) pr_info_once(\"VILI_SUS_SU_COMPAT_V39: ksu_susfs_disable_sus_su fallback active\\n\");\n#endif\n}\n\n__attribute__((weak)) bool ksu_devpts_hook = false;\n\n__attribute__((weak)) int ksu_handle_devpts(struct inode *inode)\n{\n#ifdef CONFIG_KSU_SUSFS_ENABLE_LOG\n        if (0) pr_info_once(\"VILI_SUS_SU_COMPAT_V39: ksu_handle_devpts fallback active\\n\");\n#endif\n        return 0;\n}\n\"\"\")\nprint('Wrote drivers/kernelsu/vili_sus_su_link_compat.c')\nline = 'obj-$(CONFIG_KSU_SUSFS_SUS_SU) += vili_sus_su_link_compat.o'\nfor rel in ['drivers/kernelsu/Kbuild', 'drivers/kernelsu/Makefile']:\n    p = Path(rel)\n    if p.exists():\n        data = p.read_text(errors='ignore')\n        if 'vili_sus_su_link_compat.o' not in data:\n            if data and not data.endswith('\\n'):\n                data += '\\n'\n            data += '# Vili CI V61: SUS_SU link compat for manual-hook tree\\n' + line + '\\n'\n            p.write_text(data)\n            print(f'Registered vili_sus_su_link_compat.o in {p}')\n        else:\n            print(f'{p} already registers vili_sus_su_link_compat.o')\n    else:\n        print(f'WARN: {p} not found while registering vili_sus_su_link_compat.o')\n\
        PY_VILI_SUS_SU_LINK_COMPAT\ngrep -Rns \"vili_sus_su_link_compat\\|ksu_susfs_enable_sus_su\\|ksu_susfs_disable_sus_su\\|ksu_devpts_hook\" drivers/kernelsu fs 2>/dev/null | head -120 | tee -a ../setup.log || true\n\necho \"===== SUSFS VERIFY AFTER LEGACY PORT =====\" | tee -a ../setup.log\ntest -f fs/susfs.c\ntest -f include/linux/susfs.h\ntest -f include/linux/susfs_def.h\ngrep -Rns \"CONFIG_KSU_SUSFS\\|config KSU_SUSFS\" drivers/kernelsu fs include/linux 2>/dev/null | head -100 | tee -a ../setup.log || true\ngrep -Rns \"susfs\" fs include/linux drivers/kernelsu 2>/dev/null | head -120 | tee -a ../setup.log || true\n  fi\n\n  sed -i '/CONFIG_KSU/d;/CONFIG_KERNELSU/d;/CONFIG_SUSFS/d' \"arch/arm64/configs/${DEFCONFIG}\" 2>/dev/null || true\n  printf '%s\\n' \\\n    'CONFIG_KSU=y' \\\n    'CONFIG_KSU_MANUAL_HOOK=y' \\\n    '# CONFIG_KSU_KPROBES_HOOK is not set' \\\n    '# CONFIG_KSU_DEBUG is not set' \\\n    'CONFIG_KSU_SUSFS=y' \\\n    'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' \\\n    'CONFIG_KSU_SUSFS_SUS_PATH=y' \\\n    '# CONFIG_KSU_SUSFS_SUS_KSTAT is not set' \\\n    'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \\\n    '# CONFIG_KSU_SUSFS_ENABLE_LOG is not set' \\\n    'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' \\\n    'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \\\n    'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \\\n    'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \\\n    '# CONFIG_KSU_SUSFS_SUS_MAP is not set' \\\n    'CONFIG_KSU_SUSFS_SUS_SU=y' \\\n    '# CONFIG_KSU_SUSFS_MNT_ID_REORDER is not set' \\\n    '# CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG is not set' \\\n    >> \"arch/arm64/configs/${DEFCONFIG}\"\nelse\n  echo \"KernelSU disabled: removing stale kernelsu Kbuild/Kconfig/defconfig references.\" | tee -a ../setup.log\n  rm -rf drivers/kernelsu KernelSU KernelSU-Next || true\n  sed -i '/kernelsu/d;/KernelSU/d' drivers/Makefile drivers/Kconfig 2>/dev/null || true\n  sed -i '/CONFIG_KSU/d;/CONFIG_KERNELSU/d' \"arch/arm64/configs/${DEFCONFIG}\" 2>/dev/null || true\n\n  # This tree already has manual KernelSU hooks inside fs/*.c.\n  # Removing drivers/kernelsu alone leaves unresolved symbols such as\n  # ksu_handle_faccessat/ksu_handle_vfs_read/ksu_handle_stat/ksu_handle_execveat.\n  # Add no-op stubs only for the stock-like non-KSU build so the hooks do nothing.\n  cat > kernel/ksu_disabled_stub.c <<'EOF_KSU_STUB'\n#include <linux/types.h>\n#include <linux/fs.h>\n#include <linux/compiler_types.h>\n\nstruct filename;\n\nint ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n                         int *mode, int *flags)\n{\n        return 0;\n}\n\nint ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,\n                        size_t *count_ptr, loff_t **pos)\n{\n        return 0;\n}\n\nint ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags)\n{\n        return 0;\n}\n\nint ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n                        void *argv, void *envp, int *flags)\n{\n        return 0;\n}\nEOF_KSU_STUB\n  grep -q '^obj-y += ksu_disabled_stub.o' kernel/Makefile || printf '%s\\n' 'obj-y += ksu_disabled_stub.o' >> kernel/Makefile\n  echo \"Added non-KSU no-op stubs for leftover manual KernelSU hooks.\" | tee -a ../setup.log\nfi\n\necho \"\" | tee -a ../setup.log\necho \"===== KERNELSU REFERENCES AFTER =====\" | tee -a ../setup.log\ngrep -nE 'kernelsu|CONFIG_KSU|CONFIG_KERNELSU' drivers/Makefile drivers/Kconfig \"arch/arm64/configs/${DEFCONFIG}\" 2>/dev/null | tee -a ../setup.log || true\n"
    - name: Hard hide residual KernelSU kallsyms names
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== HARD HIDE RESIDUAL KERNELSU KALLSYMS V61 SAFE NOFILTER CHKSUM FINAL =====\" | tee -a ../setup.log\necho \"Goal: remove remaining visible kallsyms names apply_kernelsu_rules/kernelsu_init without touching kernel/kallsyms.c runtime path; use hash-style neutral names instead of mm_lock/cred_guard/secctx/vili markers.\" | tee -a ../setup.log\n\npython3 - <<'PY_HARD_HIDE_V61' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\n# Keep this step conservative: rename only the residual exported-looking\n# identifiers observed in V40/V41/V46 kallsyms. Do not touch user-facing\n# strings or KernelSU logs in this step; dmesg string cleanup can be a\n# later build if this one boots.\nreplacements = {\n    'kernelsu_init': 'net_hash_init',\n    'apply_kernelsu_rules': 'net_hash_update',\n}\n\n# Avoid accidental collisions with existing kernel identifiers before replacing.\nreplacement_values = set(replacements.values())\n\nroots = [\n    Path('drivers/kernelsu'),\n    Path('security'),\n    Path('kernel'),\n    Path('fs'),\n    Path('include'),\n]\nsuffixes = {'.c', '.h', '.S', '.s', '.lds', '.ld', '.mk'}\nnames = {'Makefile', 'Kbuild', 'Kconfig'}\nchanged = []\n\ncollisions = []\nfor root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*'):\n        if not p.is_file():\n            continue\n        if p.suffix not in suffixes and p.name not in names:\n            continue\n        try:\n            data = p.read_text(errors='ignore')\n        except Exception:\n            continue\n        for repl in replacement_values:\n            if repl in data:\n                collisions.append((str(p), repl))\nif collisions:\n    print('ERROR: chosen replacement identifiers already exist before rename:')\n    for path, repl in collisions[:50]:\n        print(f'  {repl} in {path}')\n    raise SystemExit(1)\n\nfor root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*'):\n        if not p.is_file():\n            continue\n        if p.suffix not in suffixes and p.name not in names:\n            continue\n        try:\n            data = p.read_text(errors='ignore')\n        except Exception:\n            continue\n        new = data\n        for old, repl in replacements.items():\n            new = new.replace(old, repl)\n        if new != data:\n            p.write_text(new)\n            changed.append(str(p))\n\nprint('Changed files:')\nfor item in changed:\n    print('  ' + item)\nif not changed:\n    print('  none; identifiers may already be renamed')\n\n# Verification: these exact residual symbol identifiers should not remain\n# in compiled source inputs. grep-like text can still appear in this script\n# only after checkout, not inside the kernel source tree after patching.\nbad = []\nfor root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*'):\n        if not p.is_file():\n            continue\n        if p.suffix not in suffixes and p.name not in names:\n            continue\n        data = p.read_text(errors='ignore')\n        for old in replacements:\n            if old in data:\n                bad.append((str(p), old))\nif bad:\n    print('ERROR: residual identifiers still present:')\n    for path, old in bad[:50]:\n        print(f'  {old} in {path}')\n    raise SystemExit(1)\n\nprint('V61 hard-hide source rename verification OK')\nPY_HARD_HIDE_V61\n\necho \"===== HARD HIDE RESIDUAL KERNELSU KALLSYMS V61 SAFE NOFILTER CHKSUM FINAL VERIFY =====\" | tee -a ../setup.log\ngrep -RnsE 'net_hash_init|net_hash_update|mm_lock_init|mm_lock_update|cred_guard_init|cred_guard_update|secctx_init|secctx_apply_rules|vili_kx_init|vili_apply_rules|kernelsu_init|apply_kernelsu_rules' drivers/kernelsu security kernel fs include 2>/dev/null | head -120 | tee -a ../setup.log || true\n"
    - name: Quiet KernelSU dmesg strings
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== QUIET KERNELSU DMESG STRINGS V61 SAFE NOFILTER CHKSUM FINAL =====\" | tee -a ../setup.log\necho \"Goal: remove visible KernelSU/ksu wording from KernelSU dmesg messages while keeping code identifiers and SELinux constants untouched.\" | tee -a ../setup.log\n\npython3 - <<'PY_DMESG_QUIET_V61' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\n\n# Only rewrite text inside C string literals. This avoids renaming real\n# symbols, config names, SELinux constants, or function identifiers.\nreplacements = {\n    'KernelSU:': 'Security:',\n    'KernelSU': 'Security',\n    'kernelSU': 'security',\n    'kernelsu': 'security',\n    'ksu fd installed': 'fd installed',\n    'ksu fd released': 'fd released',\n    'ksu_file': 'policy_file',\n    'ksu_show_allow_list': 'show_allow_list',\n    'context: %s': 'ctx: ok',\n    ', context: %s': ', ctx: ok',\n}\n\ndef rewrite_c_string_literals(text: str) -> str:\n    out = []\n    i = 0\n    n = len(text)\n    while i < n:\n        ch = text[i]\n        if ch != '\"':\n            out.append(ch)\n            i += 1\n            continue\n        # Parse a C string literal, preserving escapes.\n        j = i + 1\n        escaped = False\n        buf = ['\"']\n        content = []\n        while j < n:\n            c = text[j]\n            if escaped:\n                content.append(c)\n                buf.append(c)\n                escaped = False\n                j += 1\n                continue\n            if c == '\\\\':\n                content.append(c)\n                buf.append(c)\n                escaped = True\n                j += 1\n                continue\n            if c == '\"':\n                raw = ''.join(content)\n                new = raw\n                for old, repl in replacements.items():\n                    new = new.replace(old, repl)\n                out.append('\"' + new + '\"')\n                j += 1\n                break\n            content.append(c)\n            buf.append(c)\n            j += 1\n        else:\n            # Unclosed string, keep original tail.\n            out.append(text[i:])\n            return ''.join(out)\n        i = j\n    return ''.join(out)\n\nroots = [Path('drivers/kernelsu')]\nsuffixes = {'.c', '.h'}\nchanged = []\nfor root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*'):\n        if not p.is_file() or p.suffix not in suffixes:\n            continue\n        try:\n            data = p.read_text(errors='ignore')\n        except Exception:\n            continue\n        new = rewrite_c_string_literals(data)\n        if new != data:\n            p.write_text(new)\n            changed.append(str(p))\n\nprint('Changed files:')\nfor item in changed:\n    print('  ' + item)\nif not changed:\n    print('  none; KernelSU strings may already be quieted')\n\n# Verification V61: only inspect C string literals, not identifiers.\n# V43 stopped because identifiers such as ksu_file and\n# ksu_show_allow_list remained in source code. Those are not dmesg\n# text by themselves. Hard-hide kallsyms was already handled in the\n# previous step, so this step must only validate visible log strings.\nbad_fragments = ['KernelSU:', 'ksu fd installed', 'ksu fd released', 'ksu_file', 'ksu_show_allow_list', 'context: %s']\n\ndef iter_c_string_literals(text: str):\n    i = 0\n    n = len(text)\n    while i < n:\n        if text[i] != '\"':\n            i += 1\n            continue\n        j = i + 1\n        escaped = False\n        content = []\n        while j < n:\n            c = text[j]\n            if escaped:\n                content.append(c)\n                escaped = False\n                j += 1\n                continue\n            if c == '\\\\':\n                content.append(c)\n                escaped = True\n                j += 1\n                continue\n            if c == '\"':\n                yield ''.join(content)\n                j += 1\n                break\n            content.append(c)\n            j += 1\n        i = j\n\nbad = []\n\
        for root in roots:\n    if not root.exists():\n        continue\n    for p in root.rglob('*'):\n        if not p.is_file() or p.suffix not in suffixes:\n            continue\n        data = p.read_text(errors='ignore')\n        for literal in iter_c_string_literals(data):\n            for frag in bad_fragments:\n                if frag in literal:\n                    bad.append((str(p), frag, literal[:160]))\nif bad:\n    print('ERROR: visible dmesg fragments still present inside C string literals:')\n    for path, frag, literal in bad[:80]:\n        print(f'  {frag} in {path}: {literal}')\n    raise SystemExit(1)\n\nprint('V61 KernelSU dmesg string-literal quiet verification OK')\nPY_DMESG_QUIET_V61\n\necho \"===== KERNELSU DMESG STRING QUIET V61 DEEPCLEAN STRING/IDENTIFIER REPORT =====\" | tee -a ../setup.log\ngrep -RnsE 'KernelSU:|ksu fd installed|ksu fd released|ksu_file|ksu_show_allow_list|context: %s|Security:' drivers/kernelsu 2>/dev/null | head -160 | tee -a ../setup.log || true\n"
    - name: Quiet root/security dmesg noise V71
      shell: bash
      run: "set -Eeuo pipefail\ncd kernel\necho \"===== QUIET ROOT/SECURITY DMESG NOISE V71 =====\" | tee -a ../setup.log\necho \"Goal: keep V68 FIX2 stable uptime behavior, but remove noisy root/security dmesg strings such as newfstatat/faccessat/exec su markers. This does not change KSU hook behavior.\" | tee -a ../setup.log\n\npython3 - <<'PY_QUIET_ROOT_SECURITY_V71' 2>&1 | tee -a ../setup.log\nfrom pathlib import Path\nimport re\n\nroots = [Path('drivers/kernelsu'), Path('fs'), Path('kernel'), Path('security')]\nsuffixes = {'.c', '.h'}\nsuspicious = [\n    'newfstatat su->sh',\n    'faccessat su->sh',\n    'do_execveat_common su found',\n    'packages.list detected',\n    'su->sh!',\n    'su found',\n]\n# These exact user-visible strings are not useful after root path is confirmed;\n# leaving them in dmesg creates avoidable noise. Prefer disabling the single-line\n# printk/pr_* statement when the whole statement is on one line. For split strings,\n# fall back to neutral wording inside the string literal to avoid breaking C syntax.\nneutral_map = {\n    'newfstatat su->sh!': 'file check ok',\n    'newfstatat su->sh': 'file check ok',\n    'faccessat su->sh!': 'access check ok',\n    'faccessat su->sh': 'access check ok',\n    'do_execveat_common su found': 'exec check ok',\n    'packages.list detected': 'package list cached',\n    'su->sh!': 'event ok',\n    'su->sh': 'event ok',\n    'su found': 'exec ok',\n}\n\ndef quiet_source(text: str):\n    changed = False\n    out_lines = []\n    quieted_lines = 0\n    for line in text.splitlines(keepends=True):\n        line_l = line\n        if any(x in line_l for x in suspicious) and ('pr_' in line_l or 'printk' in line_l) and ';' in line_l:\n            indent = line[:len(line) - len(line.lstrip())]\n            newline = '\\n' if line.endswith('\\n') else ''\n            out_lines.append(indent + '/* Vili CI V71: quiet root/security dmesg noise. */' + newline)\n            changed = True\n            quieted_lines += 