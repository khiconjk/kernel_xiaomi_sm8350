        grep -nA8 -B4 "config KSU_SUSFS_SUS_SU" drivers/kernelsu/Kconfig | tee -a ../setup.log || true


        echo "===== ADD SUS_SU MANUAL-HOOK LINK COMPAT V35 =====" | tee -a ../setup.log
        python3 - <<'PY_VILI_SUS_SU_LINK_COMPAT'
        from pathlib import Path
        compat = Path('drivers/kernelsu/vili_sus_su_link_compat.c')
        compat.write_text(r"""
        #include <linux/types.h>
        #include <linux/printk.h>
        #include <linux/fs.h>

        /*
         * Vili CI V61: SUS_SU link compat for KernelSU legacy manual-hook tree.
         *
         * Upstream SuSFS SUS_SU is designed around KSU kprobe hook helpers.  This
         * kernel is intentionally kept on the proven manual-hook root path, so the
         * kprobe-only helpers are not provided by KernelSU-Next legacy.  These weak
         * fallbacks let us build and boot-test CONFIG_KSU_SUSFS_SUS_SU without
         * changing the stable root hook path from V30.
         *
         * If a future KSU tree provides real implementations, the strong symbols from
         * that tree override these weak definitions.
         */
        __attribute__((weak)) void ksu_susfs_enable_sus_su(void)
