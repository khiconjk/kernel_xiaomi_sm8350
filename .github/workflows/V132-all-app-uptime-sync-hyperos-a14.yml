        Inputs:
        - V130 GitHub Actions setup.log/build.log and final artifact evidence.
        - V131 coherence-first source design and its uptime-only safety boundary.
        - V130 root audit 2026-08-21 21:05:45, shell audit 21:06:09, and target UID audit 20:55:02.
