        new1_tab = 'if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS &&\n\t\t\t\t    ghost_uptime_proc_task_keep_early_display(task))\n\t\t\t\t\tstart_ns -= off_ns;'

        old1_spaces = 'if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS)\n                                start_ns -= off_ns;'
        new1_spaces = 'if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS &&\n                                    ghost_uptime_proc_task_keep_early_display(task))\n                                start_ns -= off_ns;'

        if old1_tab in s:
            s = s.replace(old1_tab, new1_tab, 1)
        elif old1_spaces in s:
            s = s.replace(old1_spaces, new1_spaces, 1)
        elif 'ghost_uptime_proc_task_keep_early_display(task)' not in s:
            idx = s.find('if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS')
            if idx >= 0:
                print(s[max(0, idx-300):idx+500])
            raise SystemExit('ERROR: cannot patch already-fake-scale early condition')

        old2 = '} else if (start_ns >= GHOST_UPTIME_TASK_EARLY_BOOT_NS) {'
        new2 = '} else if (start_ns >= GHOST_UPTIME_TASK_EARLY_BOOT_NS ||\n\t\t\t\t   !ghost_uptime_proc_task_keep_early_display(task)) {'

        if old2 in s:
            s = s.replace(old2, new2, 1)
        elif '!ghost_uptime_proc_task_keep_early_display(task)' not in s:
            idx = s.find('else if (start_ns >= GHOST_UPTIME_TASK_EARLY_BOOT_NS')
            if idx >= 0:
                print(s[max(0, idx-300):idx+500])
            raise SystemExit('ERROR: cannot patch real-scale early condition')

        if 'start_time = ghost_uptime_proc_task_start_time_ticks(task);' not in s:
            raise SystemExit('ERROR: start_time assignment missing')
        if 'ghost_uptime_proc_task_keep_early_display' not in s:
            raise SystemExit('ERROR: V77 helper missing after patch')
        if '!ghost_uptime_proc_task_keep_early_display(task)' not in s:
            raise SystemExit('ERROR: V77 real-scale userland shift condition missing')

        p.write_text(s)
        print('Patched fs/proc/array.c: V77 process age policy for early userland tasks')
        PY_V77_PROC_AGE_POLICY

        echo "===== V77 PROCESS AGE POLICY VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'ghost_uptime_proc_task_keep_early_display|GHOST_UPTIME_TASK_EARLY_BOOT_NS|ghost_uptime_proc_task_start_time_ticks|start_time = ghost' fs/proc/array.c 2>/dev/null | head -240 | tee -a ../setup.log || true
        if ! grep -q 'ghost_uptime_proc_task_keep_early_display' fs/proc/array.c; then
          echo "ERROR: V77 helper missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q '!ghost_uptime_proc_task_keep_early_display(task)' fs/proc/array.c; then
          echo "ERROR: V77 userland shift condition missing" | tee -a ../setup.log
          exit 1
        fi
