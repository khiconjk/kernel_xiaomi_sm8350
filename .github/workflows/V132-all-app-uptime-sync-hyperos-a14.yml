            raise SystemExit('ERROR: V68/V73 start_time assignment missing')

        # Accept either untouched 120s define or a previous 30s define if rerun.
        pattern = re.compile(
            r'(?m)^\s*(/\*\s*Vili CI V74 FIX[23]:.*?\*/\s*)?'
            r'#define\s+GHOST_UPTIME_TASK_EARLY_BOOT_NS\s+\((?:120|30)ULL\s*\*\s*1000000000ULL\)'
        )

        if not pattern.search(s):
            print('ERROR: cannot find GHOST_UPTIME_TASK_EARLY_BOOT_NS define')
            idx = s.find('GHOST_UPTIME_TASK_EARLY_BOOT_NS')
            if idx >= 0:
