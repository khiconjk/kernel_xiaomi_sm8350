        grep -qx 'id=v132_ghost_guard' "$MODDIR/module.prop"
        grep -qx 'versionCode=1320' "$MODDIR/module.prop"
        grep -Fxqx "$TARGET_PACKAGE" "$MODDIR/target_package"
        grep -Fxqx -- "$APP_SCOPE" "$MODDIR/app_scope"
        grep -Fxqx -- "$KERNEL_LOCALVERSION" "$MODDIR/kernel_localversion_expected"
        grep -Fxqx -- "$ZYGISKNEXT_LINKER_MODE" "$MODDIR/zygisknext_linker_mode"
        grep -Fxqx -- "$APP_CLOCK_POLICY" "$MODDIR/app_clock_policy"
        grep -q 'v1251_ghost_guard' "$MODDIR/customize.sh"
        grep -q 'v1273_ghost_guard' "$MODDIR/customize.sh"
        grep -q 'v128_ghost_guard' "$MODDIR/customize.sh"
        grep -q '^#define ZYGISK_API_VERSION 5$' "$MODDIR/src/zygisk_min.hpp"
        grep -q 'preAppSpecialize_enter uid=' "$MODDIR/src/module.cpp"
        grep -q 'offset_probe_ns=' "$MODDIR/src/module.cpp"
        grep -q 'connect_companion_snapshot' "$MODDIR/src/module.cpp"
        grep -q 'companion_fake_uptime_ns=' "$MODDIR/src/module.cpp"
        grep -q 'CLOCK_MONOTONIC_RAW_V132' "$MODDIR/src/module.cpp"
        grep -q 'CLOCK_BOOTTIME_V132' "$MODDIR/src/module.cpp"
        grep -q 'orig_uptime_millis' "$MODDIR/src/module.cpp"
        grep -q 'POLICY_UPTIME_ONLY' "$MODDIR/src/module.cpp"
        grep -q 'SCOPE_ALL_APPS' "$MODDIR/src/module.cpp"
        grep -q 'is_android_app_process_uid' "$MODDIR/src/module.cpp"
        grep -q 'android_app_id' "$MODDIR/src/module.cpp"
        grep -q 'legacy-full-canary' "$MODDIR/src/module.cpp"
        grep -q 'companion_mono' "$MODDIR/src/module.cpp"
        grep -q 'target_uid_source=' "$MODDIR/src/module.cpp"
        grep -q 'preAppSpecialize_probe uid=' "$MODDIR/src/module.cpp"
        grep -q 'companion_fd_closed_before_return=1' "$MODDIR/src/module.cpp"
        if grep -q 'exemptFd' "$MODDIR/src/module.cpp"; then echo 'ERROR: V132 must not exempt/retain companion FDs' | tee -a setup.log; exit 1; fi

        CXX="$HOME/.cache/weebx-clang/clang/bin/clang++"
        [ -x "$CXX" ] || CXX="$(command -v clang++ || true)"
        if [ -z "$CXX" ] || [ ! -x "$CXX" ]; then
          echo "ERROR: clang++ unavailable for V132 Zygisk build" | tee -a setup.log
          exit 1
        fi
        CXX_VERSION_FULL="$("$CXX" --version 2>&1)"
        CXX_VERSION_FIRST="$(printf '%s\n' "$CXX_VERSION_FULL" | sed -n '1p')"
        echo "V132 Zygisk compiler: $CXX_VERSION_FIRST" | tee -a setup.log

        # Zygisk Next and ReZygisk-family loaders may use a custom linker. V125.1 produced a -nostdlib SO with
        # no DT_NEEDED entry and file(1) reported static-pie. Create tiny link-only
        # libc stubs so the final module retains unresolved Android libc imports but
        # advertises a normal DT_NEEDED libc.so dependency to the custom linker.
        cat >"$MODDIR/linkstub/empty.c" <<'EOF_V132_LIBC_STUB'
        void __v132_libc_link_stub(void) {}
        EOF_V132_LIBC_STUB
        "$CXX" --target=aarch64-linux-android24 -fPIC -shared -nostdlib \
          -Wl,-soname,libc.so -o "$MODDIR/linkstub/arm64-v8a/libc.so" "$MODDIR/linkstub/empty.c"
        "$CXX" --target=armv7a-linux-androideabi24 -fPIC -shared -nostdlib \
          -Wl,-soname,libc.so -o "$MODDIR/linkstub/armeabi-v7a/libc.so" "$MODDIR/linkstub/empty.c"

        COMMON_FLAGS=(
          -fPIC -shared -nostdlib -ffreestanding -fno-builtin
          -fno-exceptions -fno-rtti -fno-threadsafe-statics -fno-use-cxa-atexit
          -fvisibility=hidden -fvisibility-inlines-hidden
          -Wl,--hash-style=both -Wl,-Bsymbolic -Wl,--build-id=none
          -Wl,--allow-shlib-undefined -Wl,--no-as-needed
        )
        "$CXX" --target=aarch64-linux-android24 "${COMMON_FLAGS[@]}" \
          -L"$MODDIR/linkstub/arm64-v8a" -lc -Wl,-soname,v132_app_clock.so \
          -o "$MODDIR/zygisk/arm64-v8a.so" "$MODDIR/src/module.cpp"
        "$CXX" --target=armv7a-linux-androideabi24 "${COMMON_FLAGS[@]}" \
          -L"$MODDIR/linkstub/armeabi-v7a" -lc -Wl,-soname,v132_app_clock.so \
          -o "$MODDIR/zygisk/armeabi-v7a.so" "$MODDIR/src/module.cpp"
        chmod 0755 "$MODDIR/zygisk/arm64-v8a.so" "$MODDIR/zygisk/armeabi-v7a.so"

        for so in "$MODDIR/zygisk/arm64-v8a.so" "$MODDIR/zygisk/armeabi-v7a.so"; do
          file "$so" | tee -a setup.log
          base="$(basename "$so")"
          SYMFILE="$RUNNER_TEMP/v132-$base.symbols.txt"
          DYNSYMFILE="$RUNNER_TEMP/v132-$base.dynsymbols.txt"
          DYNFILE="$RUNNER_TEMP/v132-$base.dynamic.txt"
          SECFILE="$RUNNER_TEMP/v132-$base.sections.txt"
          readelf -Ws "$so" >"$SYMFILE"
          readelf --dyn-syms --wide "$so" >"$DYNSYMFILE"
          readelf -d "$so" >"$DYNFILE"
          readelf -S "$so" >"$SECFILE"

          grep -q 'zygisk_module_entry' "$DYNSYMFILE"
          grep -q 'zygisk_companion_entry' "$DYNSYMFILE"
          grep -q 'NEEDED.*libc.so' "$DYNFILE"
          grep -q '(HASH)' "$DYNFILE"
          grep -q '(GNU_HASH)' "$DYNFILE"
          if grep -qE '\.gnu\.version(_r|_d)?([[:space:]]|$)' "$SECFILE"; then
            echo "ERROR: V132 Zygisk ELF contains GNU symbol-version sections unsupported by ZN Linker" | tee -a setup.log
            exit 1
          fi

          UND="$(awk '$7=="UND" && $8!="" {print $8}' "$SYMFILE" | sort -u | tr '\n' ' ')"
          echo "V132 $base undefined: $UND" | tee -a setup.log
          BAD="$(awk '$7=="UND" && $8!="" {print $8}' "$SYMFILE" | sort -u | grep -Ev '^(clock_gettime|close|fchmod|open|openat|read|write)$' || true)"
          if [ -n "$BAD" ]; then
            echo "ERROR: unexpected V132 Zygisk undefined symbols: $BAD" | tee -a setup.log
            exit 1
          fi

          DEF_GLOBAL="$(awk '$4=="FUNC" && $5=="GLOBAL" && $6=="DEFAULT" && $7!="UND" && $8!="" {print $8}' "$DYNSYMFILE" | sort -u)"
          BAD_EXPORT="$(printf '%s\n' "$DEF_GLOBAL" | grep -Ev '^(zygisk_module_entry|zygisk_companion_entry)$' || true)"
          if [ -n "$BAD_EXPORT" ]; then
            echo "ERROR: V132 Zygisk ELF exports unexpected default-visible functions: $BAD_EXPORT" | tee -a setup.log
            exit 1
          fi
        done

        A64_SHA="$(sha256sum "$MODDIR/zygisk/arm64-v8a.so" | awk '{print $1}')"
        A32_SHA="$(sha256sum "$MODDIR/zygisk/armeabi-v7a.so" | awk '{print $1}')"
        cat >"$MODDIR/deps/ZYGISK-ELF-MANIFEST.txt" <<EOF_V132_ELF_MANIFEST
        format=V132-ZYGISK-ELF-MANIFEST-1
        api_version=5
        link_policy=dt_needed_libc_sysv_gnu_hash_hidden_bsymbolic_no_gnu_symbol_version_fd_safe_companion_snapshot
        arm64_sha256=$A64_SHA
        arm64_elf_class=ELF64
        arm64_needed=libc.so
        arm64_hash_style=sysv+gnu
        arm64_soname=v132_app_clock.so
        arm32_sha256=$A32_SHA
        arm32_elf_class=ELF32
        arm32_needed=libc.so
        arm32_hash_style=sysv+gnu
        arm32_soname=v132_app_clock.so
        EOF_V132_ELF_MANIFEST
        chmod 0644 "$MODDIR/deps/ZYGISK-ELF-MANIFEST.txt"
        cat "$MODDIR/deps/ZYGISK-ELF-MANIFEST.txt" | tee -a setup.log
        rm -rf "$MODDIR/linkstub"

        # Do not bundle or replace the user's loader in V132. The runtime audit has
        # latest V127.3 runtime audit confirmed Zygisk Next 1.4.5 enabled on the target device.
        cat >"$MODDIR/deps/LOADER-POLICY.txt" <<'EOF_V132_LOADER_POLICY'
        V132 loader policy:
        - Use the already-enabled ReZygisk/BreZygisk/Zygisk Next loader.
        - V132 is specifically ELF-hardened for Zygisk Next's built-in ZN Linker.
        - V132 does not change linker, memory-type or denylist settings automatically.
        - If no preAppSpecialize telemetry appears, inspect V132-loader-health.log and Zygisk Next status before an optional manual system-linker A/B test.
        EOF_V132_LOADER_POLICY
        chmod 0644 "$MODDIR/deps/LOADER-POLICY.txt"

        (cd "$MODDIR" && zip -r9 "../$MODZIP" . >/dev/null)
        unzip -t "$MODZIP" >/dev/null
        unzip -p "$MODZIP" module.prop >"$RUNNER_TEMP/v132-module.prop"
        unzip -p "$MODZIP" deps/ZYGISK-ELF-MANIFEST.txt >"$RUNNER_TEMP/v132-elf-manifest.txt"
        grep -qx 'api_version=5' "$RUNNER_TEMP/v132-elf-manifest.txt"
        grep -qx 'arm64_hash_style=sysv+gnu' "$RUNNER_TEMP/v132-elf-manifest.txt"
        grep -qx 'arm32_hash_style=sysv+gnu' "$RUNNER_TEMP/v132-elf-manifest.txt"
        grep -qx 'id=v132_ghost_guard' "$RUNNER_TEMP/v132-module.prop"
        for abi in arm64-v8a armeabi-v7a; do
          unzip -p "$MODZIP" "zygisk/$abi.so" >"$RUNNER_TEMP/v132-$abi.so"
          readelf -d "$RUNNER_TEMP/v132-$abi.so" >"$RUNNER_TEMP/v132-$abi.dynamic.txt"
          readelf -Ws "$RUNNER_TEMP/v132-$abi.so" >"$RUNNER_TEMP/v132-$abi.symbols.txt"
          grep -q 'NEEDED.*libc.so' "$RUNNER_TEMP/v132-$abi.dynamic.txt"
          grep -q '(HASH)' "$RUNNER_TEMP/v132-$abi.dynamic.txt"
          grep -q '(GNU_HASH)' "$RUNNER_TEMP/v132-$abi.dynamic.txt"
          grep -q 'zygisk_module_entry' "$RUNNER_TEMP/v132-$abi.symbols.txt"
        done
        sha256sum "$MODZIP" | tee -a setup.log
        echo "===== V132 APP CLOCK MODULE BUILD COMPLETE =====" | tee -a setup.log
    - name: Collect outputs
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        ARTIFACT_DIR="../${ARTIFACT_DIR}"
        rm -rf "$ARTIFACT_DIR"
        mkdir -p "$ARTIFACT_DIR/kernel" "$ARTIFACT_DIR/dtb-output" "$ARTIFACT_DIR/modules" \
          "$ARTIFACT_DIR/logs/diagnostics" "$ARTIFACT_DIR/tools" "$ARTIFACT_DIR/ksu-modules"

        echo "===== COLLECT OUTPUTS =====" | tee -a ../build.log
        BOOT_DIR="$OUT_DIR/arch/arm64/boot"

        if [ -f "$BOOT_DIR/Image.gz" ]; then
          cp -a "$BOOT_DIR/Image.gz" "$ARTIFACT_DIR/kernel/Image.gz"
        fi
        if [ -f "$BOOT_DIR/Image" ]; then
          cp -a "$BOOT_DIR/Image" "$ARTIFACT_DIR/kernel/Image"
        fi
        if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
          cp -a "$BOOT_DIR/Image.gz-dtb" "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only"
        fi

        find "$BOOT_DIR" -type f \( -name '*.dtb' -o -name '*.dtbo' -o -name 'dtbo.img' \) -exec cp -a {} "$ARTIFACT_DIR/dtb-output/" \; 2>/dev/null || true
        find "$OUT_DIR" -type f -name '*.ko' -exec cp -a {} "$ARTIFACT_DIR/modules/" \; 2>/dev/null || true

        cp -a ../setup.log "$ARTIFACT_DIR/logs/setup.log" || true
        cp -a ../build.log "$ARTIFACT_DIR/logs/build.log" || true
        cp -a "../${APT_NETWORK_LOG}" "$ARTIFACT_DIR/logs/${APT_NETWORK_LOG}" || true
        cp -a "$OUT_DIR/System.map" "$ARTIFACT_DIR/logs/System.map" || true
        cp -a "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/logs/Module.symvers" || true
        cp -a ../V132-diagnostics/. "$ARTIFACT_DIR/logs/diagnostics/" || true
        cp -a ../V132-tools/. "$ARTIFACT_DIR/tools/" || true
        cp -a ../V132-ghost-app-clock-guard-KSU.zip "$ARTIFACT_DIR/ksu-modules/" || true
        cp -a ../V132-kernel-release.txt "$ARTIFACT_DIR/kernel/kernel-release.txt" || true

        echo "" | tee -a ../build.log
        echo "===== ARTIFACT TREE =====" | tee -a ../build.log
        find "$ARTIFACT_DIR" -maxdepth 3 -type f -printf '%p  %s bytes\n' | sort | tee -a ../build.log

        if [ ! -f "$ARTIFACT_DIR/kernel/Image.gz" ] && [ ! -f "$ARTIFACT_DIR/kernel/Image" ]; then
          echo "ERROR: no Image.gz/Image found. Kernel build is not usable." | tee -a ../build.log
          exit 1
        fi
    - name: Create AnyKernel3 flashable zip
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "ERROR: V132 AnyKernel step rc=$rc line=$LINENO command=$BASH_COMMAND" | tee -a build.log; exit $rc' ERR
        ARTIFACT_DIR="${ARTIFACT_DIR}"
        AK3_DIR="AnyKernel3-vili"
        ZIP_NAME="${KERNEL_NAME}-AnyKernel3-${GITHUB_RUN_NUMBER}.zip"

        echo "===== CREATE ANYKERNEL3 ZIP =====" | tee -a build.log
        # AnyKernel3 removed backwards compatibility for lowercase user variables on 2026-06-28.
        # Pin a known revision and use the current uppercase API below.
        AK3_REF="1c9a500dd4aa8081952523126e97eb155aed941b"
        rm -rf "$AK3_DIR"
        git clone --no-checkout https://github.com/osm0sis/AnyKernel3.git "$AK3_DIR" 2>&1 | tee -a build.log
        git -C "$AK3_DIR" fetch --depth=1 origin "$AK3_REF" 2>&1 | tee -a build.log
        git -C "$AK3_DIR" checkout --detach FETCH_HEAD 2>&1 | tee -a build.log
        echo "AnyKernel3 pinned commit: $(git -C "$AK3_DIR" rev-parse HEAD)" | tee -a build.log
        test "$(git -C "$AK3_DIR" rev-parse HEAD)" = "$AK3_REF"
        rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github" "$AK3_DIR/README.md" "$AK3_DIR/LICENSE" "$AK3_DIR/ramdisk" "$AK3_DIR/patch"

        # Carry the V132 retained shell guards plus loader-compatible all-app Zygisk uptimeMillis guard inside the flashable package.
        # It uses skip_mount and its own bind mounts, so no KernelSU metamodule is required.
        rm -rf "$AK3_DIR/v132-ksu-module"
        mkdir -p "$AK3_DIR/v132-ksu-module"
        unzip -q "V132-ghost-app-clock-guard-KSU.zip" -d "$AK3_DIR/v132-ksu-module"
        test -f "$AK3_DIR/v132-ksu-module/module.prop"
        test -f "$AK3_DIR/v132-ksu-module/customize.sh"
        test -f "$AK3_DIR/v132-ksu-module/post-fs-data.sh"
        test -f "$AK3_DIR/v132-ksu-module/boot-completed.sh"
        test -f "$AK3_DIR/v132-ksu-module/post-mount.sh"
        test -f "$AK3_DIR/v132-ksu-module/bin/logcat-wrapper"
        test -f "$AK3_DIR/v132-ksu-module/target_package"
        test -f "$AK3_DIR/v132-ksu-module/app_scope"
        test -f "$AK3_DIR/v132-ksu-module/kernel_localversion_expected"
        test -f "$AK3_DIR/v132-ksu-module/app_clock_policy"
        test -f "$AK3_DIR/v132-ksu-module/service.sh"
        test -f "$AK3_DIR/v132-ksu-module/zygisk/arm64-v8a.so"
        test -f "$AK3_DIR/v132-ksu-module/zygisk/armeabi-v7a.so"
        test -f "$AK3_DIR/v132-ksu-module/deps/ZYGISK-ELF-MANIFEST.txt"
        grep -qx 'id=v132_ghost_guard' "$AK3_DIR/v132-ksu-module/module.prop"
        grep -Fxqx "$TARGET_PACKAGE" "$AK3_DIR/v132-ksu-module/target_package"
        grep -Fxqx -- "$APP_SCOPE" "$AK3_DIR/v132-ksu-module/app_scope"
        grep -Fxqx -- "$KERNEL_LOCALVERSION" "$AK3_DIR/v132-ksu-module/kernel_localversion_expected"
        grep -Fxqx -- "$APP_CLOCK_POLICY" "$AK3_DIR/v132-ksu-module/app_clock_policy"

        cat > "$AK3_DIR/anykernel.sh" <<'EOF'
        # AnyKernel3 Ramdisk Mod Script
        # Flash target: Xiaomi 11T Pro / vili / HyperOS 1.0.22 Android 14

        properties() { '
        kernel.string=V132 KangarooX vili A14 V119.1 retained + all-app uptime sync
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=vili
        device.name2=Xiaomi 11T Pro
        device.name3=2107113SG
        device.name4=2107113SI
        device.name5=2107113SR
        supported.versions=14 - 14
        supported.patchlevels=
        supported.vendorpatchlevels=
        '; }

        BLOCK=/dev/block/bootdevice/by-name/boot;
        IS_SLOT_DEVICE=auto;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;

        V132_AK3_HOME="$PWD";
        . tools/ak3-core.sh;

        V132_SRC="$V132_AK3_HOME/v132-ksu-module";
        V132_DST="/data/adb/modules/v132_ghost_guard";
        if [ -d /data/adb ] && [ -w /data/adb ] && [ -f "$V132_SRC/module.prop" ]; then
          ui_print "V132: activating KernelSU all-app ghost uptime sync";
          mkdir -p /data/adb/modules;
          rm -rf /data/adb/modules/v120_firstboot_guard /data/adb/modules/v1201_firstboot_guard /data/adb/modules/v121_firstboot_guard /data/adb/modules/v122_ghost_guard /data/adb/modules/v123_ghost_guard /data/adb/modules/v124_ghost_guard /data/adb/modules/v125_ghost_guard /data/adb/modules/v1251_ghost_guard /data/adb/modules/v126_ghost_guard /data/adb/modules/v1261_ghost_guard /data/adb/modules/v127_ghost_guard /data/adb/modules/v1273_ghost_guard /data/adb/modules/v128_ghost_guard /data/adb/modules/v129_ghost_guard /data/adb/modules/v130_ghost_guard /data/adb/modules/v131_ghost_guard "$V132_DST";
          mkdir -p "$V132_DST";
          cp -af "$V132_SRC"/. "$V132_DST"/;
          chown -R 0:0 "$V132_DST" 2>/dev/null || true;
          chmod 0755 "$V132_DST/customize.sh" "$V132_DST/post-fs-data.sh" "$V132_DST/post-mount.sh" "$V132_DST/boot-completed.sh" "$V132_DST/service.sh" "$V132_DST/bin/logcat-wrapper" "$V132_DST/zygisk/arm64-v8a.so" "$V132_DST/zygisk/armeabi-v7a.so" 2>/dev/null || true;
          chmod 0644 "$V132_DST/module.prop" "$V132_DST/skip_mount" "$V132_DST/target_package" "$V132_DST/app_scope" "$V132_DST/kernel_localversion_expected" "$V132_DST/zygisknext_linker_mode" "$V132_DST/app_clock_policy" "$V132_DST/src/module.cpp" "$V132_DST/src/zygisk_min.hpp" 2>/dev/null || true;
          rm -f "$V132_DST/disable" "$V132_DST/remove";
          ui_print "V132: all-app ghost uptime sync staged at $V132_DST";
        else
          ui_print "V132: /data/adb unavailable; ghost guard auto-activation skipped";
          ui_print "V132: install the bundled KSU module manually after boot";
        fi;

        dump_boot;
        write_boot;
        EOF

        if [ -f "$ARTIFACT_DIR/kernel/Image.gz" ]; then
          cp -a "$ARTIFACT_DIR/kernel/Image.gz" "$AK3_DIR/Image.gz"
        elif [ -f "$ARTIFACT_DIR/kernel/Image" ]; then
          cp -a "$ARTIFACT_DIR/kernel/Image" "$AK3_DIR/Image"
        elif [ -f "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only" ]; then
          echo "WARNING: Image.gz not found, using Image.gz-dtb fallback. For HyperOS A14, Image.gz is preferred." | tee -a build.log
          cp -a "$ARTIFACT_DIR/kernel/Image.gz-dtb-inspection-only" "$AK3_DIR/Image.gz-dtb"
        else
          echo "ERROR: no kernel image found for AnyKernel3" | tee -a build.log
          exit 1
        fi

        cat > "$ARTIFACT_DIR/V132-README-FLASH.txt" <<EOF
        V132 - Xiaomi 11T Pro vili - HyperOS 1.0.22 Android 14
        KernelSU legacy + SuSFS + retained V119.1/V123 ghost layers + all-app Java uptimeMillis sync

        Proven V123 input evidence:
        - Root: 21 PASS / 1 WARN. ADB shell: 18 PASS / 1 WARN.
        - /proc/uptime and btime were aligned on ~17-day ghost axis.
        - ro.runtime.firstboot differed from ghost uptime by only 1 second.
        - preserved real logcat was 169552 bytes, wrapper 2659 bytes, hashes distinct.
        - logcat -v monotonic was aligned to ghost axis by 3 seconds (root) and 6 seconds (shell), watchdog timeout 0.
        - Remaining warning was framework/app session-relative MONOTONIC behavior.

        V132 new layer:
        - Keeps all V123 shell guards unchanged.
        - Adds public Zygisk API v5 canary libraries for arm64-v8a and armeabi-v7a.
        - Default app_scope=all-apps selects every Zygote app process with Android app-id >= 10000; single-package retains the V131 target_uid fallback.
        - Attempts android.os.SystemClock.uptimeMillis() and java.lang.System.nanoTime() JNI native entries.
        - Derives the ghost offset from fake /proc/uptime minus the original unhooked SystemClock.uptimeMillis(); CLOCK_MONOTONIC is a read-only fallback and CLOCK_BOOTTIME is intentionally not used because the retained kernel already ghosts it.
        - Does NOT hook elapsedRealtime because retained BOOTTIME is already ghosted.
        - Does NOT load into system_server and excludes core Android app-id values below 10000.
        - Any missing loader, invalid offset, or JNI lookup is fail-open; target_uid is required only in single-package mode.

        Dependency/bootstrap:
        - V132 retains the installed Zygisk implementation but can switch Zygisk Next linker mode using the workflow input; default system prioritizes compatibility, while keep preserves the current setting.
        - V132 retains the API-v5 ELF hardening and adds FD-safe companion telemetry, early target_uid failure probes, module contexts, and Zygisk Next loader/status evidence.
        - V132 install-time migration removes stale V124 through V131 ghost Zygisk modules so only one clock-hook generation is active.
        - If dependency staging fails, firstboot/logcat guards still work and the all-app Java guard remains fail-open.

        Validation after boot:
        1. Open several installed apps once after the loader-active reboot.
        2. su -c 'cat /data/local/tmp/V132-ghost-guard.log'
        3. su -c 'cat /data/local/tmp/V132-app-clock-hook.log'
        4. su -c 'cat /data/adb/modules/v132_ghost_guard/app_scope' (target_uid is used only by single-package mode)
        5. logcat -v monotonic -d -t 10
        6. Run tools/V132-check-ghost-uptime-noroot.sh as root and adb shell.

        Safety boundary:
        V132 does not change global vDSO, CLOCK_MONOTONIC core, System.nanoTime, ktime_get, hrtimer, futex, scheduler, alarm/timer deadlines, or system_server. Direct native app clock_gettime(CLOCK_MONOTONIC/RAW) remains real because this 5.4 tree has no time namespace support and translating only reads would break absolute deadlines.
        EOF

        mkdir -p "$ARTIFACT_DIR/flashable"
        (cd "$AK3_DIR" && zip -r9 "../$ZIP_NAME" . -x '*.git*' 2>&1 | tee -a ../build.log)
        mv "$ZIP_NAME" "$ARTIFACT_DIR/flashable/$ZIP_NAME"

        echo "" | tee -a build.log
        echo "===== FLASHABLE ZIP =====" | tee -a build.log
        ls -lh "$ARTIFACT_DIR/flashable" | tee -a build.log

        echo "===== FLASHABLE ZIP PREFLIGHT =====" | tee -a build.log
        AK_LIST="$RUNNER_TEMP/v132-anykernel-list.txt"
        AK_SCRIPT="$RUNNER_TEMP/v132-anykernel.sh"
        AK_PROP="$RUNNER_TEMP/v132-module.prop"
        AK_WRAP="$RUNNER_TEMP/v132-logcat-wrapper"
        AK_TARGET="$RUNNER_TEMP/v132-target-package"
        AK_SCOPE="$RUNNER_TEMP/v132-app-scope"
        AK_KLV="$RUNNER_TEMP/v132-kernel-localversion"
        AK_LINKER_MODE="$RUNNER_TEMP/v132-zygisknext-linker-mode"
        AK_CLOCK_POLICY="$RUNNER_TEMP/v132-app-clock-policy"
        AK_SERVICE="$RUNNER_TEMP/v132-service.sh"
        AK_POSTFS="$RUNNER_TEMP/v132-post-fs-data.sh"
        AK_POSTMOUNT="$RUNNER_TEMP/v132-post-mount.sh"
        AK_MANIFEST="$RUNNER_TEMP/v132-elf-manifest.txt"

        unzip -l "$ARTIFACT_DIR/flashable/$ZIP_NAME" >"$AK_LIST"
        cat "$AK_LIST" | tee -a build.log
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" anykernel.sh >"$AK_SCRIPT"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/module.prop >"$AK_PROP"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/bin/logcat-wrapper >"$AK_WRAP"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/target_package >"$AK_TARGET"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/app_scope >"$AK_SCOPE"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/kernel_localversion_expected >"$AK_KLV"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/zygisknext_linker_mode >"$AK_LINKER_MODE"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/app_clock_policy >"$AK_CLOCK_POLICY"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/service.sh >"$AK_SERVICE"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/post-fs-data.sh >"$AK_POSTFS"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/post-mount.sh >"$AK_POSTMOUNT"
        unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" v132-ksu-module/deps/ZYGISK-ELF-MANIFEST.txt >"$AK_MANIFEST"

        grep -E '[[:space:]]Image\.gz$' "$AK_LIST" >/dev/null
        grep '^BLOCK=' "$AK_SCRIPT" >/dev/null
        grep '^IS_SLOT_DEVICE=' "$AK_SCRIPT" >/dev/null
        grep -E '[[:space:]]v132-ksu-module/module\.prop$' "$AK_LIST" >/dev/null
        grep -E '[[:space:]]v132-ksu-module/app_clock_policy$' "$AK_LIST" >/dev/null
        grep -E '[[:space:]]v132-ksu-module/app_scope$' "$AK_LIST" >/dev/null
        grep -qx 'id=v132_ghost_guard' "$AK_PROP"
        grep 'V132: all-app ghost uptime sync staged' "$AK_SCRIPT" >/dev/null
        grep -E '[[:space:]]v132-ksu-module/bin/logcat-wrapper$' "$AK_LIST" >/dev/null
        sh -n "$AK_WRAP"
        grep '/dev/.v132-logcat-real' "$AK_WRAP" >/dev/null
        grep -Fxqx "$TARGET_PACKAGE" "$AK_TARGET"
        grep -Fxqx -- "$APP_SCOPE" "$AK_SCOPE"
        grep -Fxqx -- "$KERNEL_LOCALVERSION" "$AK_KLV"
        grep -Fxqx -- "$ZYGISKNEXT_LINKER_MODE" "$AK_LINKER_MODE"
        grep -Fxqx -- "$APP_CLOCK_POLICY" "$AK_CLOCK_POLICY"
        sh -n "$AK_SERVICE"
        grep -qx 'api_version=5' "$AK_MANIFEST"
        grep -qx 'arm64_hash_style=sysv+gnu' "$AK_MANIFEST"
        grep -qx 'arm32_hash_style=sysv+gnu' "$AK_MANIFEST"
        for abi in arm64-v8a armeabi-v7a; do
          unzip -p "$ARTIFACT_DIR/flashable/$ZIP_NAME" "v132-ksu-module/zygisk/$abi.so" >"$RUNNER_TEMP/ak-v132-$abi.so"
          readelf -Ws "$RUNNER_TEMP/ak-v132-$abi.so" >"$RUNNER_TEMP/ak-v132-$abi.symbols.txt"
          readelf -d "$RUNNER_TEMP/ak-v132-$abi.so" >"$RUNNER_TEMP/ak-v132-$abi.dynamic.txt"
          grep 'zygisk_module_entry' "$RUNNER_TEMP/ak-v132-$abi.symbols.txt" >/dev/null
          grep 'zygisk_companion_entry' "$RUNNER_TEMP/ak-v132-$abi.symbols.txt" >/dev/null
          grep -q 'NEEDED.*libc.so' "$RUNNER_TEMP/ak-v132-$abi.dynamic.txt"
          grep -q '(HASH)' "$RUNNER_TEMP/ak-v132-$abi.dynamic.txt"
          grep -q '(GNU_HASH)' "$RUNNER_TEMP/ak-v132-$abi.dynamic.txt"
        done
        grep 'cp -f /system/bin/logcat' "$AK_POSTFS" >/dev/null
        grep 'real_size.*-le 8192' "$AK_POSTFS" >/dev/null
        if grep 'mount --bind /system/bin/logcat' "$AK_POSTFS" >/dev/null; then
          echo "ERROR: V122 recursive file-bind preservation accidentally reintroduced" | tee -a build.log
          exit 1
        fi
        grep '/dev/.v132-logcat-wrapper' "$AK_POSTMOUNT" >/dev/null
        if grep -E '^(block|is_slot_device|ramdisk_compression|patch_vbmeta_flag)=' "$AK_SCRIPT" >/dev/null; then
          echo "ERROR: legacy lowercase AnyKernel3 variables detected" | tee -a build.log
          exit 1
        fi
        sha256sum "$ARTIFACT_DIR/flashable/$ZIP_NAME" | tee -a build.log
        echo "===== V132 ANYKERNEL PREFLIGHT COMPLETE =====" | tee -a build.log
    - name: Pack modules inspection zip
      shell: bash
      run: |
        set -Eeuo pipefail
        ARTIFACT_DIR="${ARTIFACT_DIR}"
        echo "===== PACK MODULES INSPECTION ZIP =====" | tee -a build.log
        FIRST_KO="$(find "$ARTIFACT_DIR/modules" -type f -name '*.ko' -print -quit 2>/dev/null || true)"
        if [ -n "$FIRST_KO" ]; then
          (cd "$ARTIFACT_DIR/modules" && zip -r9 "../${KERNEL_NAME}-modules-inspection-only-${GITHUB_RUN_NUMBER}.zip" . 2>&1 | tee -a ../../build.log)
        else
          echo "No modules found." | tee -a build.log
        fi
    - name: Verify V132 artifact and kernel release before upload
      if: success()
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "ERROR: V132 final preflight rc=$rc line=$LINENO command=$BASH_COMMAND" | tee -a build.log; exit $rc' ERR
        echo "===== V132 FINAL ARTIFACT PAYLOAD PREFLIGHT =====" | tee -a build.log
        test -d "${ARTIFACT_DIR}"
        test -s "${ARTIFACT_DIR}/kernel/Image.gz"
        test -s "${ARTIFACT_DIR}/kernel/kernel-release.txt"
        grep -Fqx "$(cat V132-kernel-release.txt)" "${ARTIFACT_DIR}/kernel/kernel-release.txt"
        test -s "${ARTIFACT_DIR}/ksu-modules/V132-ghost-app-clock-guard-KSU.zip"
        FLASH_ZIP="$(find "${ARTIFACT_DIR}/flashable" -maxdepth 1 -type f -name "${KERNEL_NAME}-AnyKernel3-*.zip" -print -quit)"
        test -n "$FLASH_ZIP"
        test -s "$FLASH_ZIP"
        unzip -t "$FLASH_ZIP" >/dev/null
        echo "artifact_dir=${ARTIFACT_DIR}" | tee -a build.log
        echo "kernel_release=$(cat "${ARTIFACT_DIR}/kernel/kernel-release.txt")" | tee -a build.log
        echo "flash_zip=$FLASH_ZIP" | tee -a build.log
        echo "flash_zip_bytes=$(stat -c %s "$FLASH_ZIP")" | tee -a build.log
        echo "ksu_zip_bytes=$(stat -c %s "${ARTIFACT_DIR}/ksu-modules/V132-ghost-app-clock-guard-KSU.zip")" | tee -a build.log
        echo "V132 artifact payload preflight PASS" | tee -a build.log
    - name: Finalize artifact logs
      if: always()
      shell: bash
      run: |
        set +e
        if [ -d "${ARTIFACT_DIR}" ]; then
          mkdir -p "${ARTIFACT_DIR}/logs"
          cp -a setup.log "${ARTIFACT_DIR}/logs/setup.log" 2>/dev/null || true
          cp -a build.log "${ARTIFACT_DIR}/logs/build.log" 2>/dev/null || true
          cp -a "${APT_NETWORK_LOG}" "${ARTIFACT_DIR}/logs/${APT_NETWORK_LOG}" 2>/dev/null || true
          echo "Final artifact logs refreshed after AnyKernel3 packaging." | tee -a build.log
          cp -a build.log "${ARTIFACT_DIR}/logs/build.log" 2>/dev/null || true
        fi
    - name: Show real errors if failed
      if: failure()
      shell: bash
      run: |
        echo "===== SETUP ERROR LINES ====="
        if [ -f setup.log ]; then
          grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\.lld|make(\[[0-9]+\])?: \*\*\*' setup.log | tail -200 || true
        else
          echo "setup.log missing"
        fi

        echo ""
        echo "===== APT NETWORK LOG ====="
        if [ -f "${APT_NETWORK_LOG}" ]; then
          tail -250 "${APT_NETWORK_LOG}" || true
        else
          echo "${APT_NETWORK_LOG} missing"
        fi

        echo ""
        echo "===== BUILD ERROR LINES ====="
        if [ -f build.log ]; then
          grep -nEi 'error:|fatal:|failed|no such file|not found|permission denied|cannot|undefined reference|ld\.lld|make(\[[0-9]+\])?: \*\*\*' build.log | tail -300 || true
          echo ""
          echo "===== LAST 250 BUILD LINES ====="
          tail -250 build.log || true
        else
          echo "build.log missing"
        fi
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: V132-vili-hyperos-a14-app-clock-guard-${{ github.run_number }}
        path: '${{ env.ARTIFACT_DIR }}/**

          setup.log

          build.log

          ${{ env.APT_NETWORK_LOG }}

          '
        if-no-files-found: error
        compression-level: 6
        retention-days: 14
