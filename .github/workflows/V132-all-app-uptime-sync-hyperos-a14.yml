        - BOOTTIME was already on the ghost axis and differed from the companion snapshot only by milliseconds, confirming the snapshot itself was coherent.
        - V130 then armed uptimeMillis and nanoTime with the full offset inside bin.mt.plus. Runtime logcat immediately showed PerfMonitor latency around 1555199997 ms and Choreographer reports around 94 million skipped frames.
        - This is a mixed-domain failure: Java nanoTime was shifted while display/vsync timestamps entering Choreographer remained on the real native timebase.
        - V130 audit totals looked mostly green because the old audit had no hard frame-coherence gate. V132 explicitly adds FAIL accounting for this class of error.

        V132 design:
        - Preserve the exact V119.1/V123 kernel/readout baseline, KSU Next, SUSFS, firstboot guard, logcat wrapper, pristine vDSO hashes and audio compatibility hashes.
        - Preserve the proven V130 root companion one-shot snapshot transport and FD-close discipline.
        - Derive ghost offset from native CLOCK_MONOTONIC first, with CLOCK_MONOTONIC_RAW fallback, before any Java hook is installed. This avoids using a temporarily mutated Java clock as the reference.
        - Default app_scope=all-apps selects Android Zygote app specializations by app-id >= 10000, including secondary-user and isolated processes while excluding system_server/core Android UIDs.
        - app_scope=single-package retains the V131 target_uid canary for controlled rollback and A/B testing.
        - Default app_clock_policy=uptime-only: hook SystemClock.uptimeMillis only and leave System.nanoTime real to protect Choreographer/vsync coherence.
        - app_clock_policy=shadow performs all probes and transport with no Java mutation.
        - app_clock_policy=legacy-full-canary is rejected with all-apps and may reproduce V130 only under single-package controlled A/B.
        - The runtime audit now has FAIL_COUNT and rejects extreme Choreographer skipped-frame or PerfMonitor latency signatures instead of reporting a misleading green summary.
        - App-UID denial of /proc/uptime is classified as expected sandbox behavior; framework session-relative Runtime uptime is informational because system_server remains intentionally untouched.

        Deferred work:
