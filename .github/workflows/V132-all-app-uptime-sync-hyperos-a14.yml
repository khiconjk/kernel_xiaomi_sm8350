        # leaving them in dmesg creates avoidable noise. Prefer disabling the single-line
        # printk/pr_* statement when the whole statement is on one line. For split strings,
        # fall back to neutral wording inside the string literal to avoid breaking C syntax.
        neutral_map = {
            'newfstatat su->sh!': 'file check ok',
            'newfstatat su->sh': 'file check ok',
            'faccessat su->sh!': 'access check ok',
            'faccessat su->sh': 'access check ok',
            'do_execveat_common su found': 'exec check ok',
            'packages.list detected': 'package list cached',
            'su->sh!': 'event ok',
            'su->sh': 'event ok',
            'su found': 'exec ok',
        }

        def quiet_source(text: str):
            changed = False
            out_lines = []
            quieted_lines = 0
            for line in text.splitlines(keepends=True):
                line_l = line
                if any(x in line_l for x in suspicious) and ('pr_' in line_l or 'printk' in line_l) and ';' in line_l:
                    indent = line[:len(line) - len(line.lstrip())]
                    newline = '\n' if line.endswith('\n') else ''
                    out_lines.append(indent + '/* Vili CI V71: quiet root/security dmesg noise. */' + newline)
                    changed = True
                    quieted_lines += 1
                    continue
                new_line = line
                if any(x in new_line for x in suspicious):
                    for old, new in neutral_map.items():
                        new_line = new_line.replace(old, new)
                    if new_line != line:
                        changed = True
                out_lines.append(new_line)
            return ''.join(out_lines), changed, quieted_lines

        changed_files = []
        total_quieted = 0
        for root in roots:
            if not root.exists():
                continue
            for p in root.rglob('*'):
                if not p.is_file() or p.suffix not in suffixes:
                    continue
                data = p.read_text(errors='ignore')
                new, changed, quieted = quiet_source(data)
                if changed:
                    p.write_text(new)
                    changed_files.append(str(p))
                    total_quieted += quieted

        print('Changed files:')
        for f in changed_files:
            print('  ' + f)
        if not changed_files:
            print('  none; root/security dmesg strings may already be quiet')
        print(f'Quieted single-line printk/pr_* statements: {total_quieted}')

        bad = []
        for root in roots:
            if not root.exists():
                continue
            for p in root.rglob('*'):
                if not p.is_file() or p.suffix not in suffixes:
                    continue
                data = p.read_text(errors='ignore')
                for frag in suspicious:
                    if frag in data:
                        bad.append((str(p), frag))
        if bad:
            print('ERROR: suspicious root/security dmesg fragments still present:')
            for path, frag in bad[:80]:
                print(f'  {frag} in {path}')
            raise SystemExit(1)
        print('V71 root/security dmesg noise cleanup verification OK')
        PY_QUIET_ROOT_SECURITY_V71

        echo "===== ROOT/SECURITY DMESG NOISE V71 VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'newfstatat su->sh|faccessat su->sh|do_execveat_common su found|packages.list detected|su->sh|su found' drivers/kernelsu fs kernel security 2>/dev/null | head -80 | tee -a ../setup.log || true
