        for rel, terms in targets:
            p = Path(rel)
            print(f'===== V95 SOURCE CONTEXT {rel} =====')
            if not p.exists():
                print('MISSING')
                continue
            s = p.read_text(errors='ignore')
            hits = [t for t in terms if t in s]
            print('hits=' + (','.join(hits) if hits else 'none'))
            shown = 0
            for t in hits:
                idx = s.find(t)
                if idx >= 0:
                    print(f'--- term={t} offset={idx} ---')
                    print(s[max(0, idx-800):idx+1600])
                    shown += 1
                if shown >= 5:
                    break

        print('===== V95 DECISION =====')
        print('No sched_clock/local_clock core patch is applied in V95.')
        print('Runtime V94 already showed dmesg timestamps follow fake uptime, so printk display patch is unnecessary and may double-shift.')
        print('If a future V96 is attempted, it should be a display-only printk formatter guard, not sched_clock core.')
        PY_V95_SCHED_CLOCK_GUARD

        echo "V95 sched_clock surface guard OK" | tee -a ../setup.log
    - name: V96 add sched clock readout probe only
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== V96 SCHED_CLOCK / LOCAL_CLOCK READOUT PROBE ONLY =====" | tee -a ../setup.log
        echo "V96 does not patch sched_clock(), local_clock(), ktime_get(), printk, timer core, scheduler core, or vDSO. It only adds a read-only /proc/ghost_sched_clock_probe entry so runtime can compare sched_clock/local_clock/ktime_get against fake /proc uptime." | tee -a ../setup.log

        echo "===== V96 REQUIRED BASE MARKER LOCK =====" | tee -a ../setup.log
        for spec in \
          "fs/proc/uptime.c:Vili CI V80" \
          "fs/proc/stat.c:Vili CI V82" \
          "fs/proc/softirqs.c:Vili CI V85" \
          "kernel/irq/proc.c:Vili CI V88"
        do
          file="${spec%%:*}"
          marker="${spec#*:}"
          echo "-- checking $file :: $marker" | tee -a ../setup.log
          if ! grep -q "$marker" "$file"; then
            echo "ERROR: required base marker missing: $file :: $marker" | tee -a ../setup.log
            exit 1
          fi
        done

        echo "===== V96 FORBID OLD RISKY PATCHES =====" | tee -a ../setup.log
        if grep -RqsE 'Vili CI V92|ghost_uptime_vdso_shift_ts|ghost_uptime_vdso_offset_sec|arch_sys_boot_offset for vDSO updater' kernel/time/vsyscall.c 2>/dev/null; then
          echo "ERROR: stale V92 vDSO basetime patch found" | tee -a ../setup.log
          exit 1
        fi

        cat > fs/proc/ghost_sched_clock_probe.c <<'EOF_V96_PROBE'
        // SPDX-License-Identifier: GPL-2.0
        /*
         * Vili CI V96: sched_clock/local_clock readout probe only.
         *
         * This file does not modify sched_clock(), local_clock(), ktime_get(),
         * printk, timer core, scheduler core, or vDSO. It only exposes a
         * temporary read-only proc entry for controlled runtime comparison.
         */
        #include <linux/init.h>
        #include <linux/kernel.h>
        #include <linux/ktime.h>
        #include <linux/proc_fs.h>
        #include <linux/sched/clock.h>
        #include <linux/seq_file.h>
        #include <linux/types.h>

        static int ghost_sched_clock_probe_show(struct seq_file *m, void *v)
        {
                u64 sched_ns = sched_clock();
                u64 local_ns = local_clock();
                u64 mono_ns = ktime_get_ns();
                u64 boot_ns = ktime_get_boottime_ns();
                u64 raw_ns = ktime_get_raw_ns();

                seq_puts(m, "Vili CI V96 sched_clock/local_clock readout probe only\n");
                seq_printf(m, "sched_clock_ns=%llu\n", sched_ns);
                seq_printf(m, "local_clock_ns=%llu\n", local_ns);
                seq_printf(m, "ktime_get_ns=%llu\n", mono_ns);
                seq_printf(m, "ktime_get_boottime_ns=%llu\n", boot_ns);
                seq_printf(m, "ktime_get_raw_ns=%llu\n", raw_ns);
                seq_printf(m, "sched_clock_sec=%llu.%09llu\n",
                           div_u64(sched_ns, NSEC_PER_SEC),
                           sched_ns % NSEC_PER_SEC);
                seq_printf(m, "local_clock_sec=%llu.%09llu\n",
                           div_u64(local_ns, NSEC_PER_SEC),
                           local_ns % NSEC_PER_SEC);
                seq_printf(m, "ktime_get_sec=%llu.%09llu\n",
                           div_u64(mono_ns, NSEC_PER_SEC),
                           mono_ns % NSEC_PER_SEC);
                seq_printf(m, "boottime_sec=%llu.%09llu\n",
                           div_u64(boot_ns, NSEC_PER_SEC),
                           boot_ns % NSEC_PER_SEC);
                seq_printf(m, "raw_sec=%llu.%09llu\n",
                           div_u64(raw_ns, NSEC_PER_SEC),
                           raw_ns % NSEC_PER_SEC);
                return 0;
        }

        static int __init ghost_sched_clock_probe_init(void)
        {
                proc_create_single("ghost_sched_clock_probe", 0444, NULL,
                                   ghost_sched_clock_probe_show);
                return 0;
        }
        late_initcall(ghost_sched_clock_probe_init);
        EOF_V96_PROBE

        if ! grep -q 'ghost_sched_clock_probe.o' fs/proc/Makefile; then
          printf '\n# Vili CI V96: sched_clock/local_clock readout probe only\nobj-y += ghost_sched_clock_probe.o\n' >> fs/proc/Makefile
        fi

        echo "===== V96 VERIFY SOURCE =====" | tee -a ../setup.log
        grep -RnsE 'Vili CI V96|ghost_sched_clock_probe|sched_clock\(|local_clock\(|ktime_get_ns|ktime_get_boottime_ns|ktime_get_raw_ns|proc_create_single' fs/proc/ghost_sched_clock_probe.c fs/proc/Makefile 2>/dev/null | head -220 | tee -a ../setup.log || true

        if ! grep -q 'proc_create_single("ghost_sched_clock_probe"' fs/proc/ghost_sched_clock_probe.c; then
          echo "ERROR: V96 proc entry creation missing" | tee -a ../setup.log
          exit 1
        fi
        if grep -Rqs 'Vili CI V96' kernel/sched kernel/time kernel/printk arch/arm64 drivers/clocksource 2>/dev/null; then
          echo "ERROR: V96 marker leaked into forbidden core files" | tee -a ../setup.log
          grep -Rns 'Vili CI V96' kernel/sched kernel/time kernel/printk arch/arm64 drivers/clocksource 2>/dev/null | tee -a ../setup.log || true
          exit 1
        fi

        echo "V96 sched_clock/local_clock readout probe patch OK" | tee -a ../setup.log
    - name: V119.1 remove V96 real-clock debug probe before production build
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== V119.1 REMOVE V96 REAL-CLOCK DEBUG PROBE =====" | tee -a ../setup.log
        echo "The V119 runtime report proved /proc/ghost_sched_clock_probe directly exposed ~450s MONOTONIC/RAW while BOOTTIME was ~25 days. Keep the evidence in old logs, but do not ship this debug endpoint in production." | tee -a ../setup.log

        python3 - <<'PY_V119_REMOVE_V96_PROBE'
        from pathlib import Path

        makefile = Path('fs/proc/Makefile')
        source = Path('fs/proc/ghost_sched_clock_probe.c')

        if makefile.exists():
            text = makefile.read_text(errors='ignore')
            lines = text.splitlines()
            out = []
            for line in lines:
                if 'Vili CI V96: sched_clock/local_clock readout probe only' in line:
                    continue
                if 'ghost_sched_clock_probe.o' in line:
                    continue
                out.append(line)
            makefile.write_text('\n'.join(out).rstrip() + '\n')

        if source.exists():
            source.unlink()

        final_make = makefile.read_text(errors='ignore') if makefile.exists() else ''
        if 'ghost_sched_clock_probe.o' in final_make or 'Vili CI V96: sched_clock/local_clock readout probe only' in final_make:
            raise SystemExit('ERROR: V96 probe Makefile registration still present')
        if source.exists():
            raise SystemExit('ERROR: V96 probe source still present')

        print('V119.1 production cleanup removed fs/proc/ghost_sched_clock_probe.c and its Makefile registration.')
        PY_V119_REMOVE_V96_PROBE

        git diff --check -- fs/proc/Makefile
        if grep -RqsE 'ghost_sched_clock_probe|Vili CI V96: sched_clock/local_clock readout probe only' fs/proc 2>/dev/null; then
          echo "ERROR: V96 direct real-clock probe still exists in production fs/proc sources" | tee -a ../setup.log
          grep -RnsE 'ghost_sched_clock_probe|Vili CI V96: sched_clock/local_clock readout probe only' fs/proc 2>/dev/null | tee -a ../setup.log || true
          exit 1
        fi
        echo "V119.1 V96 probe removal verified." | tee -a ../setup.log
    - name: Mark V75 process age audit baseline
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== V75 PROCESS AGE AUDIT BASELINE =====" | tee -a ../setup.log
        echo "V75 intentionally keeps V74 FIX3 kernel behavior unchanged. It is a deeper validation step focused on process-age surfaces: /proc/[pid]/stat field22, toybox ps output, pid lifetimes, and Android core/app process consistency." | tee -a ../setup.log
        echo "No CLOCK_MONOTONIC, CLOCK_MONOTONIC_RAW, scheduler core, hrtimer core, local_clock, sched_clock, ktime_get(), or timekeeping_get_delta changes." | tee -a ../setup.log
    - name: Cache WeebX Clang
      uses: actions/cache@v4
      with:
        path: ~/.cache/weebx-clang
        key: weebx-clang-${{ runner.os }}-v2
    - name: Setup WeebX Clang
      shell: bash
      run: |
        set -Eeuo pipefail
        CLANG_DIR="$HOME/.cache/weebx-clang/clang"
        TMP_DIR="$RUNNER_TEMP/weebx-clang"
        mkdir -p "$CLANG_DIR" "$TMP_DIR"

        echo "===== WEEBX CLANG SETUP =====" | tee -a setup.log
        echo "Toolchain cache dir: $CLANG_DIR" | tee -a setup.log

        if [ ! -x "$CLANG_DIR/bin/clang" ]; then
          rm -rf "$CLANG_DIR" "$TMP_DIR"
          mkdir -p "$CLANG_DIR" "$TMP_DIR/extract"

          CLANG_URL="$(curl -fsSL https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt | tr -d '\r\n')"
          if [ -z "$CLANG_URL" ]; then
            echo "ERROR: empty WeebX Clang URL" | tee -a setup.log
            exit 1
          fi

          echo "Downloading: $CLANG_URL" | tee -a setup.log
          curl -L --fail --retry 10 --retry-all-errors --retry-delay 5 "$CLANG_URL" -o "$TMP_DIR/clang.tar.gz" 2>&1 | tee -a setup.log
          tar -xf "$TMP_DIR/clang.tar.gz" -C "$TMP_DIR/extract" 2>&1 | tee -a setup.log

          # WeebX release may ship clang as bin/clang-20 instead of bin/clang.
          # Find either layout, then normalize the installed toolchain below.
          CLANG_BIN="$(find "$TMP_DIR/extract" -type f \( -path '*/bin/clang' -o -path '*/bin/clang-[0-9]*' \) -print | sort -V | tail -n 1 || true)"
          if [ -z "$CLANG_BIN" ]; then
            echo "ERROR: clang/clang-N binary not found inside archive" | tee -a setup.log
            echo "===== FIRST 250 FILES IN TOOLCHAIN ARCHIVE =====" | tee -a setup.log
            find "$TMP_DIR/extract" -maxdepth 4 -type f | head -250 | tee -a setup.log || true
            exit 1
          fi

          chmod +x "$CLANG_BIN" || true
          CLANG_ROOT="$(dirname "$(dirname "$CLANG_BIN")")"
          echo "Detected clang binary: $CLANG_BIN" | tee -a setup.log
          echo "Detected clang root: $CLANG_ROOT" | tee -a setup.log
          cp -a "$CLANG_ROOT"/. "$CLANG_DIR"/
        fi

        mkdir -p "$CLANG_DIR/bin"
        chmod -R u+rx "$CLANG_DIR/bin" || true

        cd "$CLANG_DIR/bin"

        # Normalize common binary names expected by Android kernel Makefiles.
        if [ ! -x clang ]; then
          CAND="$(find . -maxdepth 1 -type f -name 'clang-[0-9]*' -print | sort -V | tail -n 1 || true)"
          if [ -n "$CAND" ]; then
            ln -sf "${CAND#./}" clang
          fi
        fi

        if [ ! -x clang++ ]; then
          CXX_CAND="$(find . -maxdepth 1 -type f -name 'clang++-[0-9]*' -print | sort -V | tail -n 1 || true)"
          if [ -n "$CXX_CAND" ]; then
            ln -sf "${CXX_CAND#./}" clang++
          elif [ -x clang ]; then
            ln -sf clang clang++
          fi
        fi

        if [ ! -x ld.lld ] && [ -x lld ]; then
          ln -sf lld ld.lld
        fi

        # Some custom clang archives include GNU-style names but not every LLVM alias.
        [ ! -x llvm-strip   ] && [ -x strip   ] && ln -sf strip   llvm-strip   || true
        [ ! -x llvm-objcopy ] && [ -x objcopy ] && ln -sf objcopy llvm-objcopy || true
        [ ! -x llvm-objdump ] && [ -x objdump ] && ln -sf objdump llvm-objdump || true
        [ ! -x llvm-readelf ] && [ -x readelf ] && ln -sf readelf llvm-readelf || true
        [ ! -x llvm-ar      ] && [ -x ar      ] && ln -sf ar      llvm-ar      || true
        [ ! -x llvm-nm      ] && [ -x nm      ] && ln -sf nm      llvm-nm      || true

        if [ ! -x "$CLANG_DIR/bin/clang" ]; then
          echo "ERROR: clang still not executable after compatibility symlink setup" | tee -a ../../setup.log
          echo "===== TOOLCHAIN BIN DIR =====" | tee -a ../../setup.log
          ls -lah "$CLANG_DIR/bin" | tee -a ../../setup.log || true
          exit 1
        fi

        echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
        echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

        echo "" | tee -a ../../setup.log
        echo "===== CLANG VERSION =====" | tee -a ../../setup.log
        "$CLANG_DIR/bin/clang" --version | tee -a ../../setup.log
        echo "" | tee -a ../../setup.log
        echo "===== NORMALIZED TOOLCHAIN BINARIES =====" | tee -a ../../setup.log
        ls -lah "$CLANG_DIR/bin" | grep -E 'clang|lld|llvm-|aarch64|arm-linux' | head -250 | tee -a ../../setup.log || true
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-vili-hyperos-a14-v111-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: 'ccache-vili-hyperos-a14-v111-${{ github.ref_name }}-

          ccache-vili-hyperos-a14-

          '
    - name: Prepare defconfig
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        export PATH="$CLANG_DIR/bin:$PATH"
        export CCACHE_DIR="$HOME/.ccache"
        export KBUILD_BUILD_USER="$KBUILD_BUILD_USER"
        export KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST"
        export KBUILD_BUILD_VERSION="$KERNEL_BUILD_VERSION"
        export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_TIMESTAMP"
        export SOURCE_DATE_EPOCH="$KERNEL_SOURCE_DATE_EPOCH"
        ccache -M 5G || true
        ccache -z || true

        MAKE_ARGS=(
          O="$OUT_DIR"
          ARCH=arm64
          SUBARCH=arm64
          LLVM=1
          LLVM_IAS=1
          CC="ccache clang"
          HOSTCC="ccache clang"
          HOSTCXX="ccache clang++"
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          AR=llvm-ar
          NM=llvm-nm
          LD=ld.lld
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          STRIP=llvm-strip
        )

        echo "===== MAKE ${DEFCONFIG} =====" | tee -a ../build.log
        rm -rf "$OUT_DIR"
        mkdir -p "$OUT_DIR"
        make "${MAKE_ARGS[@]}" "$DEFCONFIG" 2>&1 | tee -a ../build.log
        test -f "$OUT_DIR/.config"

        echo "" | tee -a ../build.log
        echo "===== V132 WORKFLOW KERNEL VERSION OVERRIDE =====" | tee -a ../build.log
        case "${KERNEL_LOCALVERSION}" in
          -*) ;;
          *) echo "ERROR: kernel_localversion must start with '-'" | tee -a ../build.log; exit 1 ;;
        esac
        LOCALVERSION_BODY="${KERNEL_LOCALVERSION#-}"
        case "$LOCALVERSION_BODY" in
          ''|*[!A-Za-z0-9._+-]*) echo "ERROR: kernel_localversion contains unsupported characters; allowed: A-Za-z0-9._+-" | tee -a ../build.log; exit 1 ;;
        esac
        if [ "${#KERNEL_LOCALVERSION}" -gt 56 ]; then echo "ERROR: kernel_localversion is longer than 56 characters" | tee -a ../build.log; exit 1; fi
        case "${KERNEL_BUILD_VERSION}" in ''|*[!0-9]*) echo "ERROR: kernel_build_version must be numeric" | tee -a ../build.log; exit 1 ;; esac
        case "${TARGET_PACKAGE}" in ''|*[!A-Za-z0-9._-]*) echo "ERROR: target_package contains unsupported characters" | tee -a ../build.log; exit 1 ;; esac
        case "${APP_SCOPE}" in all-apps|single-package) ;; *) echo "ERROR: invalid app_scope=$APP_SCOPE" | tee -a ../build.log; exit 1 ;; esac
        case "${APP_CLOCK_POLICY}" in uptime-only|shadow|legacy-full-canary) ;; *) echo "ERROR: invalid app_clock_policy=$APP_CLOCK_POLICY" | tee -a ../build.log; exit 1 ;; esac
        if [ "${APP_SCOPE}" = all-apps ] && [ "${APP_CLOCK_POLICY}" = legacy-full-canary ]; then
          echo "ERROR: legacy-full-canary is forbidden with app_scope=all-apps; global nanoTime offset breaks cross-process/vsync coherence" | tee -a ../build.log
          exit 1
        fi
        [ -x scripts/config ] || { echo "ERROR: scripts/config is required for deterministic LOCALVERSION override" | tee -a ../build.log; exit 1; }
        scripts/config --file "$OUT_DIR/.config" --set-str LOCALVERSION "$KERNEL_LOCALVERSION"
        scripts/config --file "$OUT_DIR/.config" -d LOCALVERSION_AUTO
        echo "KERNEL_LOCALVERSION=$KERNEL_LOCALVERSION" | tee -a ../build.log
        echo "KERNEL_BUILD_VERSION=$KERNEL_BUILD_VERSION" | tee -a ../build.log
        echo "TARGET_PACKAGE=$TARGET_PACKAGE" | tee -a ../build.log
        echo "APP_SCOPE=$APP_SCOPE" | tee -a ../build.log

        echo "" | tee -a ../build.log
        echo "===== CONFIG AFTER DEFCONFIG =====" | tee -a ../build.log
        grep -nE "CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_BUILD_ARM64_DT_OVERLAY|CONFIG_KSU|CONFIG_KERNELSU|CONFIG_SUSFS|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_LTO" "$OUT_DIR/.config" | tee -a ../build.log || true

        echo "" | tee -a ../build.log
        if [ "${ENABLE_KERNELSU}" = "true" ]; then
          echo "" | tee -a ../build.log
          echo "===== FORCE KERNELSU MANUAL-HOOK CONFIG BEFORE OLDDEFCONFIG =====" | tee -a ../build.log
          if [ -x scripts/config ]; then
            scripts/config --file "$OUT_DIR/.config" \
              -e KSU \
              -e KSU_MANUAL_HOOK \
              -d KSU_KPROBES_HOOK \
              -d KSU_DEBUG \
              -e KSU_SUSFS \
              -d KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SUS_SU \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -d KSU_SUSFS_ENABLE_LOG || true
          else
            sed -i '/CONFIG_KSU/d;/CONFIG_KERNELSU/d' "$OUT_DIR/.config" 2>/dev/null || true
            printf '%s\n' \
              'CONFIG_KSU=y' \
              'CONFIG_KSU_MANUAL_HOOK=y' \
              '# CONFIG_KSU_KPROBES_HOOK is not set' \
              '# CONFIG_KSU_DEBUG is not set' \
              '# CONFIG_KSU_SUSFS_SUS_KSTAT is not set' \
              'CONFIG_KSU_SUSFS_SUS_SU=y' \
              '# CONFIG_KSU_SUSFS_ENABLE_LOG is not set' \
              >> "$OUT_DIR/.config"
          fi
          grep -nE "CONFIG_KSU|CONFIG_KERNELSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS" "$OUT_DIR/.config" | tee -a ../build.log || true
        fi

        echo "===== OLDDEFCONFIG =====" | tee -a ../build.log
        make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a ../build.log

        if [ "${ENABLE_KERNELSU}" = "true" ] && [ -x scripts/config ]; then
          echo "" | tee -a ../build.log
          echo "===== FORCE DISABLE SUSFS SUS_KSTAT AFTER OLDDEFCONFIG V61 =====" | tee -a ../build.log
          scripts/config --file "$OUT_DIR/.config" -d KSU_SUSFS_SUS_KSTAT || true
          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee -a ../build.log
        fi

        echo "" | tee -a ../build.log
        echo "===== CONFIG AFTER OLDDEFCONFIG V61 =====" | tee -a ../build.log
        grep -nE "CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO|CONFIG_KSU|CONFIG_KERNELSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_HAVE_SYSCALL_TRACEPOINTS" "$OUT_DIR/.config" | tee -a ../build.log || true

        echo "" | tee -a ../build.log
        echo "===== V132 SYNCCONFIG BEFORE KERNELRELEASE =====" | tee -a ../build.log
        # scripts/setlocalversion reads include/config/auto.conf. The kernelrelease target is intentionally
        # no-sync-config in this 5.4 tree, so synchronize Kconfig explicitly after scripts/config/olddefconfig.
        make "${MAKE_ARGS[@]}" syncconfig 2>&1 | tee -a ../build.log
        test -f "$OUT_DIR/include/config/auto.conf"

        echo "-- .config LOCALVERSION --" | tee -a ../build.log
        grep -nE '^CONFIG_LOCALVERSION=|^# CONFIG_LOCALVERSION_AUTO' "$OUT_DIR/.config" | tee -a ../build.log || true
        echo "-- auto.conf LOCALVERSION --" | tee -a ../build.log
        grep -nE '^CONFIG_LOCALVERSION=|^CONFIG_LOCALVERSION_AUTO=' "$OUT_DIR/include/config/auto.conf" | tee -a ../build.log || true

        CFG_LV="$(sed -n 's/^CONFIG_LOCALVERSION=//p' "$OUT_DIR/.config" | head -n1)"
        AUTO_LV="$(sed -n 's/^CONFIG_LOCALVERSION=//p' "$OUT_DIR/include/config/auto.conf" | head -n1)"
        CFG_LV="$(printf '%s' "$CFG_LV" | sed 's/^"//;s/"$//')"
        AUTO_LV="$(printf '%s' "$AUTO_LV" | sed 's/^"//;s/"$//')"
        echo "requested_localversion=$KERNEL_LOCALVERSION" | tee -a ../build.log
        echo "dotconfig_localversion=$CFG_LV" | tee -a ../build.log
        echo "autoconf_localversion=$AUTO_LV" | tee -a ../build.log
        if [ "$CFG_LV" != "$KERNEL_LOCALVERSION" ]; then
          echo "ERROR: .config LOCALVERSION does not match requested value" | tee -a ../build.log
          exit 1
        fi
        if [ "$AUTO_LV" != "$KERNEL_LOCALVERSION" ]; then
          echo "ERROR: include/config/auto.conf LOCALVERSION is stale after syncconfig" | tee -a ../build.log
          exit 1
        fi
        if grep -q '^CONFIG_LOCALVERSION_AUTO=y' "$OUT_DIR/include/config/auto.conf"; then
          echo "ERROR: CONFIG_LOCALVERSION_AUTO unexpectedly enabled in auto.conf" | tee -a ../build.log
          exit 1
        fi

        FINAL_KREL="$(make -s "${MAKE_ARGS[@]}" kernelrelease)"
        echo "V132 kernelrelease=$FINAL_KREL" | tee -a ../build.log
        case "$FINAL_KREL" in
          *"$KERNEL_LOCALVERSION") ;;
          *)
            echo "ERROR: kernelrelease does not end with requested LOCALVERSION: $KERNEL_LOCALVERSION" | tee -a ../build.log
            echo "===== DEBUG scripts/setlocalversion =====" | tee -a ../build.log
            (cd "$OUT_DIR" && "$OLDPWD/scripts/setlocalversion" "$OLDPWD" 2>&1) | tee -a ../build.log || true
            exit 1
            ;;
        esac
        printf '%s\n' "$FINAL_KREL" > ../V132-kernel-release.txt
        if [ "${ENABLE_KERNELSU}" = "true" ]; then
          if ! grep -q '^CONFIG_KSU=y' "$OUT_DIR/.config"; then
            echo "ERROR: CONFIG_KSU=y missing in final .config" | tee -a ../build.log
            echo "===== KernelSU Kconfig =====" | tee -a ../build.log
            sed -n '1,220p' drivers/kernelsu/Kconfig | tee -a ../build.log || true
            exit 1
          fi
          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y' "$OUT_DIR/.config"; then
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK=y missing in final .config" | tee -a ../build.log
            echo "This kernel already has manual KernelSU hooks, so KPROBES mode is not the target." | tee -a ../build.log
            echo "===== KernelSU Kconfig =====" | tee -a ../build.log
            sed -n '1,260p' drivers/kernelsu/Kconfig | tee -a ../build.log || true
            exit 1
          fi
