        s = pattern.sub(
            '/* Vili CI V74 FIX3: tighten early-task window from 120s to 30s. */\n'
            '#define GHOST_UPTIME_TASK_EARLY_BOOT_NS (30ULL * 1000000000ULL)',
            s,
            count=1,
        )

