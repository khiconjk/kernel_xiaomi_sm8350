    - name: Patch V80 proc uptime idle field sync
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== PATCH V80 /PROC/UPTIME IDLE FIELD SYNC =====" | tee -a ../setup.log
        echo "V77 fixed process-age, but /proc/uptime field2 still exposed real idle seconds. V80 shifts field2 idle display by ghost offset * possible CPUs. Display-only; no MONOTONIC/RAW/timekeeping/scheduler core changes." | tee -a ../setup.log

        python3 - <<'PY_V80_PROC_UPTIME_IDLE' 2>&1 | tee -a ../setup.log
        from pathlib import Path
        import re

        p = Path('fs/proc/uptime.c')
        if not p.exists():
            raise SystemExit('ERROR: fs/proc/uptime.c not found')

        s = p.read_text(errors='ignore')

        if '<linux/ghost_uptime.h>' not in s:
            includes = list(re.finditer(r'^#include\s+<[^>]+>\s*$', s, flags=re.M))
            if includes:
                pos = includes[-1].end()
                s = s[:pos] + '\n#include <linux/ghost_uptime.h>' + s[pos:]
            else:
                s = '#include <linux/ghost_uptime.h>\n' + s

        marker = 'Vili CI V80: sync /proc/uptime idle field'
        if marker not in s:
            block_lines = [
                '        /* Vili CI V80: sync /proc/uptime idle field to fake uptime scale. */',
                '        if (ghost_uptime_offset_sec())',
                '                idle.tv_sec += ghost_uptime_offset_sec() * num_possible_cpus();',
            ]
            block = '\n'.join(block_lines)

            patterns = [
                r'(idle\.tv_sec\s*=\s*div_u64_rem\([^;]+;\s*\n\s*idle\.tv_nsec\s*=\s*[^;]+;)',
                r'(idle\.tv_sec\s*=\s*[^;]+;\s*\n\s*idle\.tv_nsec\s*=\s*[^;]+;)',
            ]

            inserted = False
            for pat in patterns:
                m = re.search(pat, s, flags=re.S)
                if m:
                    s = s[:m.end()] + '\n' + block + s[m.end():]
                    inserted = True
                    break

            if not inserted:
                m = re.search(r'(seq_printf\s*\(\s*m\s*,)', s)
                if not m:
                    raise SystemExit('ERROR: cannot find idle field assignment or seq_printf in fs/proc/uptime.c')
                s = s[:m.start()] + block + '\n' + s[m.start():]

        if 'num_possible_cpus()' not in s:
            raise SystemExit('ERROR: V80 idle field patch missing num_possible_cpus()')
        if 'ghost_uptime_offset_sec()' not in s:
            raise SystemExit('ERROR: V80 idle field patch missing ghost_uptime_offset_sec()')
        if marker not in s:
            raise SystemExit('ERROR: V80 marker missing')

        p.write_text(s)
        print('Patched fs/proc/uptime.c: V80 /proc/uptime idle field sync')
        PY_V80_PROC_UPTIME_IDLE

        echo "===== V80 /PROC/UPTIME IDLE FIELD VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'Vili CI V80|ghost_uptime_offset_sec\(\)|num_possible_cpus\(\)|seq_printf' fs/proc/uptime.c 2>/dev/null | head -160 | tee -a ../setup.log || true
        if ! grep -q 'Vili CI V80: sync /proc/uptime idle field' fs/proc/uptime.c; then
          echo "ERROR: V80 marker missing in fs/proc/uptime.c" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'idle.tv_sec += ghost_uptime_offset_sec() \* num_possible_cpus();' fs/proc/uptime.c; then
          echo "ERROR: V80 idle boost assignment missing" | tee -a ../setup.log
          exit 1
        fi
        echo "V80 /proc/uptime idle field sync patch OK" | tee -a ../setup.log
    - name: Patch V82 proc stat output idle jiffies sync
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== PATCH V82 /PROC/STAT OUTPUT IDLE JIFFIES SYNC =====" | tee -a ../setup.log
        echo "V81 get_idle_time hook did not affect this tree's /proc/stat output. V82 patches the output-stage seq_put_decimal_ull idle fields directly: aggregate cpu gets offset*NR_CPUS*USER_HZ and cpuN gets offset*USER_HZ. No MONOTONIC/RAW/timekeeping/scheduler core changes." | tee -a ../setup.log

        python3 - <<'PY_V82_PROC_STAT_OUTPUT_IDLE' 2>&1 | tee -a ../setup.log
        from pathlib import Path
        import re

        p = Path('fs/proc/stat.c')
        if not p.exists():
            raise SystemExit('ERROR: fs/proc/stat.c not found')

        s = p.read_text(errors='ignore')

        # Make sure we are not carrying the ineffective V81 get_idle_time output patch.
        if 'Vili CI V81: sync /proc/stat CPU idle jiffies' in s:
            raise SystemExit('ERROR: V82 must be based on V80/V77, not V81-patched stat.c')

        if '<linux/ghost_uptime.h>' not in s:
            includes = list(re.finditer(r'^#include\s+<[^>]+>\s*$', s, flags=re.M))
            if includes:
                pos = includes[-1].end()
                s = s[:pos] + '\n#include <linux/ghost_uptime.h>' + s[pos:]
            else:
                s = '#include <linux/ghost_uptime.h>\n' + s

        if '<linux/kernel_stat.h>' not in s:
            # Usually already included; do not hard require.
            pass

        helper_marker = 'Vili CI V82: /proc/stat output-stage idle clock_t sync'
        if helper_marker not in s:
            # Insert helper before show_stat() if possible.
            show_pos = s.find('static int show_stat')
            if show_pos < 0:
                show_pos = s.find('show_stat')
            if show_pos < 0:
                raise SystemExit('ERROR: cannot find show_stat in fs/proc/stat.c')

            helper_lines = [
                '/* Vili CI V82: /proc/stat output-stage idle clock_t sync. */',
                'static u64 ghost_uptime_proc_stat_idle_clock_t(u64 base, bool aggregate)',
                '{',
                '        u64 off = ghost_uptime_offset_sec();',
                '',
                '        if (!off)',
                '                return base;',
                '',
                '        off *= USER_HZ;',
                '        if (aggregate)',
                '                off *= num_possible_cpus();',
                '',
                '        return base + off;',
                '}',
                '',
                '',
            ]
            s = s[:show_pos] + '\n'.join(helper_lines) + s[show_pos:]

        target = 'seq_put_decimal_ull(p, " ", nsec_to_clock_t(idle));'
        if target not in s:
            idx = s.find('nsec_to_clock_t(idle)')
            if idx >= 0:
                print(s[max(0, idx-500):idx+700])
            raise SystemExit('ERROR: cannot find idle seq_put_decimal_ull output lines')

        replacement_agg = 'seq_put_decimal_ull(p, " ", ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), true));'
        replacement_cpu = 'seq_put_decimal_ull(p, " ", ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), false));'

        count_before = s.count(target)
        if count_before < 2:
            print(f'ERROR: expected at least 2 idle output lines, found {count_before}')
            idx = s.find(target)
            if idx >= 0:
                print(s[max(0, idx-700):idx+900])
            raise SystemExit(1)

        # Replace first occurrence: aggregate "cpu  " line. Second occurrence: per-cpu cpuN loop.
        s = s.replace(target, replacement_agg, 1)
        s = s.replace(target, replacement_cpu, 1)

        if target in s:
            print('WARNING: additional nsec_to_clock_t(idle) outputs remain after first two replacements:')
            idx = s.find(target)
            print(s[max(0, idx-700):idx+900])

        if 'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), true)' not in s:
            raise SystemExit('ERROR: aggregate V82 replacement missing')
        if 'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), false)' not in s:
            raise SystemExit('ERROR: per-cpu V82 replacement missing')
        if 'off *= USER_HZ;' not in s or 'off *= num_possible_cpus();' not in s:
            raise SystemExit('ERROR: V82 helper body incomplete')

        p.write_text(s)
        print('Patched fs/proc/stat.c: V82 output-stage /proc/stat idle jiffies sync')
        PY_V82_PROC_STAT_OUTPUT_IDLE

        echo "===== V82 /PROC/STAT OUTPUT IDLE VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'Vili CI V82|ghost_uptime_proc_stat_idle_clock_t|nsec_to_clock_t\(idle\)|USER_HZ|num_possible_cpus' fs/proc/stat.c 2>/dev/null | head -240 | tee -a ../setup.log || true
        if ! grep -q 'Vili CI V82: /proc/stat output-stage idle clock_t sync' fs/proc/stat.c; then
          echo "ERROR: V82 helper marker missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), true)' fs/proc/stat.c; then
          echo "ERROR: V82 aggregate idle output replacement missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_proc_stat_idle_clock_t(nsec_to_clock_t(idle), false)' fs/proc/stat.c; then
          echo "ERROR: V82 per-cpu idle output replacement missing" | tee -a ../setup.log
          exit 1
        fi
        echo "V82 /proc/stat output-stage idle jiffies sync patch OK" | tee -a ../setup.log
    - name: Patch V85 proc softirqs display sync
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== PATCH V85 /PROC/SOFTIRQS DISPLAY SYNC =====" | tee -a ../setup.log
        echo "V84 showed /proc/softirqs TIMER/SCHED/RCU counters still look like real-session counters. V85 changes /proc/softirqs display only for TIMER/SCHED/RCU; no irq core, scheduler core, MONOTONIC/RAW/timekeeping changes." | tee -a ../setup.log

        python3 - <<'PY_V85_PROC_SOFTIRQS' 2>&1 | tee -a ../setup.log
        from pathlib import Path
        import re

        p = Path('fs/proc/softirqs.c')
        if not p.exists():
            raise SystemExit('ERROR: fs/proc/softirqs.c not found')

        s = p.read_text(errors='ignore')

        if '<linux/ghost_uptime.h>' not in s:
            incs = list(re.finditer(r'^#include\s+<[^>]+>\s*$', s, flags=re.M))
            pos = incs[-1].end() if incs else 0
            s = s[:pos] + '\n#include <linux/ghost_uptime.h>' + s[pos:]

        if '<linux/limits.h>' not in s:
            incs = list(re.finditer(r'^#include\s+<[^>]+>\s*$', s, flags=re.M))
            pos = incs[-1].end() if incs else 0
            s = s[:pos] + '\n#include <linux/limits.h>' + s[pos:]

        marker = 'Vili CI V85: /proc/softirqs display counter sync'
        if marker not in s:
            show_pos = s.find('static int show_softirqs')
            if show_pos < 0:
                show_pos = s.find('show_softirqs')
            if show_pos < 0:
                raise SystemExit('ERROR: cannot find show_softirqs in fs/proc/softirqs.c')

            helper_lines = [
                '/* Vili CI V85: /proc/softirqs display counter sync.',
                ' * Display-only: keep real counters internally, but avoid exposing tiny',
                ' * real-session TIMER/SCHED/RCU softirq counts next to fake multi-day uptime.',
                ' */',
                'static unsigned int ghost_uptime_proc_softirq_count(unsigned int nr,',
                '                                                    unsigned int cpu,',
                '                                                    unsigned int base)',
                '{',
                '        u64 off = ghost_uptime_offset_sec();',
                '        u64 add = 0;',
                '',
                '        if (!off)',
                '                return base;',
                '',
                '        if (nr == TIMER_SOFTIRQ)',
                '                add = off * 50ULL;',
                '        else if (nr == SCHED_SOFTIRQ)',
                '                add = off * 28ULL;',
                '        else if (nr == RCU_SOFTIRQ)',
                '                add = off * 24ULL;',
                '        else',
                '                return base;',
                '',
                '        add += (u64)cpu * 97ULL;',
                '',
                '        if (add > (u64)UINT_MAX - base)',
                '                return UINT_MAX;',
                '',
                '        return base + (unsigned int)add;',
                '}',
                '',
                '',
            ]
            helper = '\n'.join(helper_lines)
            s = s[:show_pos] + helper + s[show_pos:]

        target = 'kstat_softirqs_cpu(i, j)'
        repl = 'ghost_uptime_proc_softirq_count(i, j, kstat_softirqs_cpu(i, j))'
        if repl not in s:
            if target not in s:
                idx = s.find('kstat_softirqs_cpu')
                if idx >= 0:
                    print(s[max(0, idx-600):idx+900])
                raise SystemExit('ERROR: cannot find kstat_softirqs_cpu(i, j) output call')
            s = s.replace(target, repl, 1)

        if repl not in s:
            raise SystemExit('ERROR: V85 softirq output replacement missing')
        if 'nr == TIMER_SOFTIRQ' not in s or 'nr == SCHED_SOFTIRQ' not in s or 'nr == RCU_SOFTIRQ' not in s:
            raise SystemExit('ERROR: V85 helper missing softirq family checks')
        if 'UINT_MAX' not in s:
            raise SystemExit('ERROR: V85 saturation guard missing')

        p.write_text(s)
        print('Patched fs/proc/softirqs.c: V85 TIMER/SCHED/RCU display counter sync')
        PY_V85_PROC_SOFTIRQS

        echo "===== V85 /PROC/SOFTIRQS VERIFY =====" | tee -a ../setup.log
