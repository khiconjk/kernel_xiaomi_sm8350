        import re

        roots = [Path('arch/arm64'), Path('drivers'), Path('kernel'), Path('fs'), Path('init')]
        suffixes = {'.c', '.h', '.S'}

        targets = [
            'KPI: boot metric hidden',
            'boot metric hidden',
            'KPI: Bootloader start count',
            'KPI: Bootloader end count',
            'KPI: Bootloader display count',
            'KPI: Bootloader load kernel count',
            'KPI: Kernel MPM timestamp',
            'KPI: Kernel MPM Clock frequency',
            'Bootloader start count',
            'Bootloader end count',
            'Bootloader display count',
            'Bootloader load kernel count',
            'Kernel MPM timestamp',
            'Kernel MPM Clock frequency',
        ]

        log_call = re.compile(r'\b(pr_(?:emerg|alert|crit|err|warn|warning|notice|info|debug)|printk|dev_(?:emerg|alert|crit|err|warn|warning|notice|info|dbg))\s*\(')

        def suppress_multiline_calls(src: str):
            changed = False
            count = 0
            lines = src.splitlines(keepends=True)
            out = []
            i = 0
            while i < len(lines):
                line = lines[i]
                if log_call.search(line) and any(t in line for t in targets):
                    indent = line[:len(line) - len(line.lstrip())]
                    out.append(indent + '/* Vili CI V73: suppressed boot KPI/MPM dmesg counter line. */\n')
                    changed = True
                    count += 1
                    # If the printk is multiline, skip until statement semicolon.
                    if ';' not in line:
                        i += 1
                        while i < len(lines):
                            if ';' in lines[i]:
                                break
                            i += 1
                    i += 1
                    continue

                # Also handle V72 replacement strings inside non-matching one-line log calls.
                if any(t in line for t in targets) and ';' in line and ('KPI:' in line or 'boot metric hidden' in line):
                    indent = line[:len(line) - len(line.lstrip())]
                    out.append(indent + '/* Vili CI V73: suppressed boot KPI/MPM residual counter line. */\n')
                    changed = True
                    count += 1
                    i += 1
                    continue

                out.append(line)
                i += 1

            return ''.join(out), changed, count

        changed_files = []
        total = 0
        for root in roots:
            if not root.exists():
                continue
            for p in root.rglob('*'):
                if not p.is_file() or p.suffix not in suffixes:
                    continue
                try:
                    data = p.read_text(errors='ignore')
                except Exception:
                    continue
                if not any(t in data for t in targets):
                    continue
                new, changed, count = suppress_multiline_calls(data)
                if changed:
                    p.write_text(new)
                    changed_files.append(str(p))
                    total += count

        print('Changed files:')
        for f in changed_files:
            print('  ' + f)
        if not changed_files:
            print('  none; target KPI/MPM lines may already be absent or source uses split strings')
        print(f'Suppressed boot KPI/MPM log statements: {total}')

        leftovers = []
        for root in roots:
            if not root.exists():
                continue
            for p in root.rglob('*'):
                if not p.is_file() or p.suffix not in suffixes:
                    continue
                try:
                    data = p.read_text(errors='ignore')
                except Exception:
                    continue
                for t in targets:
                    if t in data:
                        leftovers.append((str(p), t))
                        break

        if leftovers:
            print('WARNING: residual target strings after V73 hard suppress:')
            for path, frag in leftovers[:120]:
                print(f'  {frag} in {path}')
        else:
            print('V73 hard suppress source verification OK')
        PY_HARD_SUPPRESS_KPI_V73

        echo "===== V73 HARD SUPPRESS SOURCE VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'KPI: boot metric hidden|boot metric hidden|KPI: Bootloader|KPI: Kernel MPM|Bootloader start count|Bootloader end count|Bootloader display count|Bootloader load kernel count|Kernel MPM timestamp|Kernel MPM Clock frequency' arch/arm64 drivers kernel fs init 2>/dev/null | head -120 | tee -a ../setup.log || true
    - name: Port ghost uptime from ssS21 RTC to sm8350
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== PORT GHOST UPTIME PROC SYNC + CLOCK_BOOTTIME + TIMERLIST + PRINTK DMESG V67 SAFE NO MONOTONIC =====" | tee -a ../setup.log
        echo "Goal: start from V62 PASS backup, add one narrow display-only layer: sync printk/dmesg timestamp display. Do not patch boot_offset, MONOTONIC, RAW, scheduler, hrtimer core, or timekeeping_get_delta." | tee -a ../setup.log

        python3 - <<'PY_GHOST_UPTIME_V61' 2>&1 | tee -a ../setup.log
        from pathlib import Path
        import re

        def read(path):
            return Path(path).read_text(errors='ignore')

        def write(path, data):
            Path(path).write_text(data)

        # 1) Shared header.
        hdr = Path('include/linux/ghost_uptime.h')
        hdr.parent.mkdir(parents=True, exist_ok=True)
        hdr.write_text("""/* SPDX-License-Identifier: GPL-2.0 */
        #ifndef _LINUX_GHOST_UPTIME_H
        #define _LINUX_GHOST_UPTIME_H

        #include <linux/types.h>
        #include <linux/math64.h>

        /* Vili CI V61: randomized fake boot offset range. */
        #define GHOST_UPTIME_MIN_DAYS        15ULL
        #define GHOST_UPTIME_MAX_DAYS        25ULL
        #define GHOST_UPTIME_NS_PER_SEC      1000000000ULL
        #define GHOST_UPTIME_SEC_PER_DAY     86400ULL
        #define GHOST_UPTIME_NS_PER_DAY      (GHOST_UPTIME_SEC_PER_DAY * GHOST_UPTIME_NS_PER_SEC)

        extern u64 arch_sys_boot_offset;

        static inline u64 ghost_uptime_offset_ns(void)
        {
                return arch_sys_boot_offset;
        }

        static inline u64 ghost_uptime_offset_sec(void)
        {
                return div_u64(arch_sys_boot_offset, GHOST_UPTIME_NS_PER_SEC);
        }

        #endif /* _LINUX_GHOST_UPTIME_H */
        """.replace('          ', ''))

        # 2) timekeeping.c: keep global random offset, do not modify boot_offset, and add STEP 2 CLOCK_BOOTTIME API wrappers plus VDSO boot offset in V61.
        tk = Path('kernel/time/timekeeping.c')
        if not tk.exists():
            raise SystemExit('ERROR: kernel/time/timekeeping.c missing')
        t = read(tk)

        if '<linux/ghost_uptime.h>' not in t:
            anchor = '#include "timekeeping_internal.h"'
            if anchor in t:
                t = t.replace(anchor, anchor + '\n#include <linux/ghost_uptime.h>\n#include <linux/random.h>\n#include <linux/export.h>', 1)
            else:
                m = list(re.finditer(r'^#include .*$', t, flags=re.M))
                if not m:
                    raise SystemExit('ERROR: no include anchor found in timekeeping.c')
                pos = m[-1].end()
                t = t[:pos] + '\n#include <linux/ghost_uptime.h>\n#include <linux/random.h>\n#include <linux/export.h>' + t[pos:]

        global_anchor = 'int __read_mostly timekeeping_suspended;'
        global_block = """

        /* Vili CI V61: ghost uptime fake boot offset in ns. */
        u64 arch_sys_boot_offset __read_mostly;
        EXPORT_SYMBOL_GPL(arch_sys_boot_offset);

        static void __init ghost_uptime_init_offset(void)
        {
                u32 rnd = 0;
                u64 days;

                if (arch_sys_boot_offset)
                        return;

                get_random_bytes(&rnd, sizeof(rnd));
                days = GHOST_UPTIME_MIN_DAYS +
                       (rnd % (GHOST_UPTIME_MAX_DAYS - GHOST_UPTIME_MIN_DAYS + 1));
                arch_sys_boot_offset = days * GHOST_UPTIME_NS_PER_DAY;
        }
        """.replace('          ', '')
        if 'arch_sys_boot_offset' not in t:
            if global_anchor not in t:
                raise SystemExit('ERROR: timekeeping_suspended anchor not found')
            t = t.replace(global_anchor, global_anchor + global_block, 1)
        elif 'ghost_uptime_init_offset' not in t:
            if global_anchor not in t:
                raise SystemExit('ERROR: timekeeping_suspended anchor not found for existing offset patch')
            t = t.replace(global_anchor, global_anchor + global_block, 1)

        init_anchor = 'read_persistent_wall_and_boot_offset(&wall_time, &boot_offset);'
        init_block = """

        /* Vili CI V61: initialize ghost uptime offset only; do not modify boot_offset. */
        ghost_uptime_init_offset();
        """.replace('          ', '')
        if 'Vili CI V61: initialize ghost uptime offset only' not in t:
            if init_anchor not in t:
                raise SystemExit('ERROR: read_persistent_wall_and_boot_offset anchor not found')
            t = t.replace(init_anchor, init_anchor + init_block, 1)

        # Safety: if this workflow is ever reapplied on a dirty tree, remove old V52/V53 boot_offset shifting blocks.
        old_bootshift_re = r'''
        /\* Vili CI V5[23]:.*?boot offset.*?\*/
        \s*ghost_uptime_init_offset\(\);
        \s*if \(arch_sys_boot_offset\) \{
        \s*u64 ghost_sec = ghost_uptime_offset_sec\(\);
        \s*if \(ghost_sec\)
        \s*boot_offset\.tv_sec \+= \(time64_t\)ghost_sec;
        \s*\}
        '''
        t = re.sub(old_bootshift_re, '\n', t, flags=re.S)

        # V61 STEP 2: sync CLOCK_BOOTTIME API read paths only.
        # This intentionally does NOT mutate tk->offs_boot / boot_offset. It only offsets reads
        # that explicitly request TK_OFFS_BOOT. MONOTONIC, RAW, REALTIME, TAI, vDSO, scheduler,
        # hrtimer core and timekeeping_get_delta remain untouched in this step.
        def patch_exported_function(src, signature_re, export_name, marker, patcher):
            pattern = signature_re + r'.*?EXPORT_SYMBOL_GPL\(' + re.escape(export_name) + r'\);'
            m = re.search(pattern, src, flags=re.S)
            if not m:
                raise SystemExit('ERROR: function %s not found in timekeeping.c' % export_name)
            block = m.group(0)
            if marker in block:
                return src
            new_block = patcher(block)
            if new_block == block or marker not in new_block:
                raise SystemExit('ERROR: failed to patch %s' % export_name)
            return src[:m.start()] + new_block + src[m.end():]

        def patch_get_with_offset(block):
            old = 'return ktime_add_ns(base, nsecs);'
            new = ('/* Vili CI V61: CLOCK_BOOTTIME API + VDSO sync, offset TK_OFFS_BOOT reads only. */\n'
                   '\tif (offs == TK_OFFS_BOOT && ghost_uptime_offset_ns())\n'
                   '\t\treturn ktime_add_ns(ktime_add_ns(base, nsecs), ghost_uptime_offset_ns());\n'
                   '\treturn ktime_add_ns(base, nsecs);')
            if old not in block:
                raise SystemExit('ERROR: ktime_get_with_offset return anchor not found')
            return block.replace(old, new, 1)

        def patch_get_coarse_with_offset(block):
            old = 'return ktime_add_ns(base, nsecs);'
            new = ('/* Vili CI V61: CLOCK_BOOTTIME coarse API sync, offset TK_OFFS_BOOT reads only. */\n'
                   '\tif (offs == TK_OFFS_BOOT && ghost_uptime_offset_ns())\n'
                   '\t\treturn ktime_add_ns(ktime_add_ns(base, nsecs), ghost_uptime_offset_ns());\n'
                   '\treturn ktime_add_ns(base, nsecs);')
            if old not in block:
                raise SystemExit('ERROR: ktime_get_coarse_with_offset return anchor not found')
            return block.replace(old, new, 1)

        def patch_mono_to_any(block):
            old = 'return tconv;'
            new = ('/* Vili CI V61: CLOCK_BOOTTIME mono conversion sync, offset TK_OFFS_BOOT only. */\n'
                   '\tif (offs == TK_OFFS_BOOT && ghost_uptime_offset_ns())\n'
                   '\t\ttconv = ktime_add_ns(tconv, ghost_uptime_offset_ns());\n'
                   '\treturn tconv;')
            if old not in block:
                raise SystemExit('ERROR: ktime_mono_to_any return anchor not found')
            return block.replace(old, new, 1)

        t = patch_exported_function(
            t,
            r'ktime_t\s+ktime_get_with_offset\s*\(\s*enum tk_offsets\s+offs\s*\)\s*\{',
            'ktime_get_with_offset',
            'Vili CI V61: CLOCK_BOOTTIME API + VDSO sync',
            patch_get_with_offset,
        )
        t = patch_exported_function(
            t,
            r'ktime_t\s+ktime_get_coarse_with_offset\s*\(\s*enum tk_offsets\s+offs\s*\)\s*\{',
            'ktime_get_coarse_with_offset',
            'Vili CI V61: CLOCK_BOOTTIME coarse API sync',
            patch_get_coarse_with_offset,
        )
        t = patch_exported_function(
            t,
            r'ktime_t\s+ktime_mono_to_any\s*\(\s*ktime_t\s+tmono\s*,\s*enum tk_offsets\s+offs\s*\)\s*\{',
            'ktime_mono_to_any',
            'Vili CI V61: CLOCK_BOOTTIME mono conversion sync',
            patch_mono_to_any,
        )

        if 'Vili CI V61: ktime_get_boot_fast_ns ghost offset' not in t:
            old_fast = 'return (ktime_get_mono_fast_ns() + ktime_to_ns(tk->offs_boot));'
            new_fast = ('/* Vili CI V61: ktime_get_boot_fast_ns ghost offset for boot fast readers only. */\n'
                        '\treturn (ktime_get_mono_fast_ns() + ktime_to_ns(tk->offs_boot) + ghost_uptime_offset_ns());')
            if old_fast in t:
                t = t.replace(old_fast, new_fast, 1)
            else:
                t2, n = re.subn(
                    r'return\s*\(ktime_get_mono_fast_ns\(\)\s*\+\s*ktime_to_ns\(tk->offs_boot\)\);',
                    new_fast,
                    t,
                    count=1,
                )
                if n != 1:
                    raise SystemExit('ERROR: ktime_get_boot_fast_ns return anchor not found')
                t = t2

        # V61 STEP 2: expose the same BOOTTIME offset to VDSO/userspace elapsedRealtime.
        # This does not modify boot_offset/tk->offs_boot itself. It only changes
        # tk->monotonic_to_boot, which this 5.4 tree uses as the timespec
        # representation for VDSO update.
        vdso_helper = """

        /* Vili CI V61: fake BOOTTIME offset exported to VDSO/userspace only. */
        static inline ktime_t ghost_uptime_fake_offs_boot_ktime(ktime_t offs_boot)
        {
                if (!ghost_uptime_offset_ns())
                        return offs_boot;
                return ktime_add_ns(offs_boot, ghost_uptime_offset_ns());
        }

        static inline void ghost_uptime_sync_vdso_boot_offset(struct timekeeper *tk)
        {
                if (!tk)
                        return;
                tk->monotonic_to_boot = ktime_to_timespec64(ghost_uptime_fake_offs_boot_ktime(tk->offs_boot));
        }
        """.replace('          ', '')

        if 'ghost_uptime_sync_vdso_boot_offset' not in t:
            if global_anchor not in t:
                raise SystemExit('ERROR: timekeeping_suspended anchor not found for V61 VDSO helper')
            insert_pos = t.find('static inline void tk_normalize_xtime')
            if insert_pos < 0:
                raise SystemExit('ERROR: tk_normalize_xtime anchor not found for V61 VDSO helper')
            t = t[:insert_pos] + vdso_helper + '\n' + t[insert_pos:]

        # V61: the vili timekeeping.c may use spaces, tabs, or comments between
        # tk_update_ktime_data(tk) and update_vsyscall(tk), so do a regex anchor instead
        # of a literal two-line string. This fixes the previous setup.log failure:
        # ERROR: timekeeping_update update_vsyscall anchor not found for V61
        if 'Vili CI V61: sync VDSO/userspace CLOCK_BOOTTIME exposure before update_vsyscall' not in t:
            pattern = r'(tk_update_ktime_data\s*\(\s*tk\s*\)\s*;\s*)(update_vsyscall\s*\(\s*tk\s*\)\s*;)'
            repl = (r'\1/* Vili CI V61: sync VDSO/userspace CLOCK_BOOTTIME exposure before update_vsyscall. */\n'
                    r'\tghost_uptime_sync_vdso_boot_offset(tk);\n'
                    r'\t\2')
            t2, n = re.subn(pattern, repl, t, count=1, flags=re.S)
            if n != 1:
                raise SystemExit('ERROR: timekeeping_update update_vsyscall regex anchor not found for V61')
            t = t2

        sleep_anchor = 'tk->monotonic_to_boot = ktime_to_timespec64(tk->offs_boot);'
        sleep_repl = '/* Vili CI V61: keep VDSO/userspace BOOTTIME offset synced after suspend-time injection. */\n\ttk->monotonic_to_boot = ktime_to_timespec64(ghost_uptime_fake_offs_boot_ktime(tk->offs_boot));'
        if sleep_anchor in t and 'Vili CI V61: keep VDSO/userspace BOOTTIME offset synced after suspend-time injection' not in t:
            t = t.replace(sleep_anchor, sleep_repl, 1)

        write(tk, t)

        # 2b) kernel/time/timer_list.c: V61 now-at-only display sync.
        # V61 original failed with timer_list.c: expected expression after a complex active-timer
        # expires-at block replacement. This fix deliberately patches only the header line:
        #   now at <ns>
        # It does not alter hrtimer core scheduling, deadlines, callbacks, active timer
        # expires-at printing, tickdevice next_event, or timekeeping_get_delta.
        tl = Path('kernel/time/timer_list.c')
        if not tl.exists():
            raise SystemExit('ERROR: kernel/time/timer_list.c missing for V61 timer_list now-at display sync')
        q = read(tl)
        if '<linux/ghost_uptime.h>' not in q:
            m = list(re.finditer(r'^#include[^\n]+\n', q, flags=re.M))
            if not m:
                raise SystemExit('ERROR: no include anchor found in timer_list.c')
            pos = m[-1].end()
            q = q[:pos] + '#include <linux/ghost_uptime.h>\n' + q[pos:]

        helper = (
            '/* Vili CI V61: /proc/timer_list header now-at display-only helper.\n'
            ' * This intentionally does not change hrtimer core timebase or scheduling.\n'
            ' */\n'
            'static inline u64 ghost_uptime_timer_list_show_ns(u64 ns)\n'
            '{\n'
            '        return ns + ghost_uptime_offset_ns();\n'
            '}\n'
        )
        if 'ghost_uptime_timer_list_show_ns' not in q:
            anchor = 'struct timer_list_iter {'
            if anchor not in q:
                raise SystemExit('ERROR: timer_list_iter anchor not found in timer_list.c')
            q = q.replace(anchor, helper + '\n' + anchor, 1)

        if 'Vili CI V61: timer_list header now-at display sync only' not in q:
            literal_old = 'SEQ_printf(m, "now at %Ld nsecs\\n", (unsigned long long)now);'
            literal_new = ('/* Vili CI V61: timer_list header now-at display sync only. */\n'
                           '\tSEQ_printf(m, "now at %Ld nsecs\\n", '
                           '(unsigned long long)ghost_uptime_timer_list_show_ns(now));')
            if literal_old in q:
                q = q.replace(literal_old, literal_new, 1)
            else:
                q2, n = re.subn(
                    r'SEQ_printf\(m,\s*"now at %Ld nsecs\\\\n",\s*\(unsigned long long\)\s*now\s*\);',
                    literal_new,
                    q,
                    count=1,
                    flags=re.S,
                )
                if n != 1:
                    raise SystemExit('ERROR: timer_list header now-at anchor not found for V61')
                q = q2

        # 2c) kernel/time/timer_list.c: V61 FIX2 active timer expires-at absolute display sync.
        # The previous V61 replaced the whole SEQ_printf argument list directly and the tree
        # failed with timer_list.c: expected expression. This fixed variant keeps the original
        # print_timer() structure, declares two local u64 show variables at the top of the
        # function, then prints those two absolute values only. The [in ...] deltas remain
        # calculated from the real timer base-local now.
        if 'Vili CI V61F: timer_list active timer expires-at local-var display sync only' not in q:
            sig_pat = (
                r'(static\s+void\s+print_timer\s*\(\s*struct\s+seq_file\s*\*m\s*,\s*'
                r'struct\s+hrtimer\s*\*taddr\s*,\s*struct\s+hrtimer\s*\*timer\s*,\s*'
                r'int\s+idx\s*,\s*u64\s+now\s*\)\s*\{\s*)'
            )
            def add_timer_locals(m):
                return m.group(1) + '\n\tu64 ghost_show_soft_ns;\n\tu64 ghost_show_expire_ns;\n'
            q2, n = re.subn(sig_pat, add_timer_locals, q, count=1, flags=re.S)
            if n != 1:
                raise SystemExit('ERROR: print_timer signature anchor not found for V61F expires local vars')
            q = q2

            expires_old_pat = (
                r'SEQ_printf\(m,\s*" # expires at %Lu-%Lu nsecs \[in %Ld to %Ld nsecs\]\\n",\s*'
                r'\(unsigned long long\)\s*ktime_to_ns\(hrtimer_get_softexpires\(timer\)\),\s*'
                r'\(unsigned long long\)\s*ktime_to_ns\(hrtimer_get_expires\(timer\)\),\s*'
                r'\(long long\)\(ktime_to_ns\(hrtimer_get_softexpires\(timer\)\)\s*-\s*now\),\s*'
                r'\(long long\)\(ktime_to_ns\(hrtimer_get_expires\(timer\)\)\s*-\s*now\)\);'
            )
            expires_new = (
                '/* Vili CI V61F: timer_list active timer expires-at local-var display sync only. */\n'
                '\tghost_show_soft_ns = ghost_uptime_timer_list_show_ns(ktime_to_ns(hrtimer_get_softexpires(timer)));\n'
                '\tghost_show_expire_ns = ghost_uptime_timer_list_show_ns(ktime_to_ns(hrtimer_get_expires(timer)));\n'
                '\tSEQ_printf(m, " # expires at %Lu-%Lu nsecs [in %Ld to %Ld nsecs]\\n",\n'
                '\t\t (unsigned long long)ghost_show_soft_ns,\n'
                '\t\t (unsigned long long)ghost_show_expire_ns,\n'
                '\t\t (long long)(ktime_to_ns(hrtimer_get_softexpires(timer)) - now),\n'
                '\t\t (long long)(ktime_to_ns(hrtimer_get_expires(timer)) - now));'
            )
            q2, n = re.subn(expires_old_pat, lambda _m: expires_new, q, count=1, flags=re.S)
            if n != 1:
                raise SystemExit('ERROR: timer_list active expires-at print anchor not found for V61F')
            q = q2

        # 2d) kernel/time/timer_list.c: V62 FIX tickdevice next_event absolute display sync.
        # This is display-only for /proc/timer_list. It does not change the real clockevent
        # deadline, clockevent programming, hrtimer core, scheduler, or timekeeping delta.
        # V62 original stopped in setup with:
        #   ERROR: timer_list tickdevice next_event print anchor not found for V62
        # so this version uses several anchors, then falls back to replacing only the
        # ktime_to_ns(dev->next_event) expression inside print_tickdevice().
        if 'Vili CI V62: timer_list tickdevice next_event display sync only' not in q:
            next_event_new = (
                '/* Vili CI V62: timer_list tickdevice next_event display sync only. */\n'
                '\tSEQ_printf(m, " next_event: %Ld nsecs\\n",\n'
                '\t\t (unsigned long long)ghost_uptime_timer_list_show_ns(ktime_to_ns(dev->next_event)));'
            )

            replaced = False
            exact_candidates = [
                'SEQ_printf(m, " next_event: %Ld nsecs\\n", (unsigned long long) ktime_to_ns(dev->next_event));',
                'SEQ_printf(m, " next_event: %Lu nsecs\\n", (unsigned long long) ktime_to_ns(dev->next_event));',
                'SEQ_printf(m, " next_event: %llu nsecs\\n", (unsigned long long) ktime_to_ns(dev->next_event));',
            ]
            for old_line in exact_candidates:
                if old_line in q:
                    q = q.replace(old_line, next_event_new, 1)
                    replaced = True
                    break

            if not replaced:
                q2, n = re.subn(
                    r'SEQ_printf\(m,\s*" next_event: %[^"]* nsecs\\n",\s*'
                    r'\(unsigned long long\)\s*ktime_to_ns\s*\(\s*dev->next_event\s*\)\s*\);',
                    lambda _m: next_event_new,
                    q,
                    count=1,
                    flags=re.S,
                )
                if n == 1:
                    q = q2
                    replaced = True

            if not replaced and 'ktime_to_ns(dev->next_event)' in q:
                q = q.replace(
                    'ktime_to_ns(dev->next_event)',
                    'ghost_uptime_timer_list_show_ns(ktime_to_ns(dev->next_event))',
                    1,
                )
                # Add the marker before the first visible next_event print so verification can find it.
                q = q.replace(
                    'SEQ_printf(m, " next_event:',
                    '/* Vili CI V62: timer_list tickdevice next_event display sync only. */\n\tSEQ_printf(m, " next_event:',
                    1,
                )
                replaced = True

            if not replaced:
                print('WARNING: timer_list tickdevice next_event display anchor not found for V62 FIX; continuing with V61 FIX2 behavior')


        # 2e) kernel/printk/printk.c: V63 FIX display-only dmesg/printk timestamp sync.
        # This changes only what dmesg/syslog readers see. It does NOT change local_clock(),
        # sched_clock(), printk log storage, scheduler, timer core, or timekeeping delta.
        pk = Path('kernel/printk/printk.c')
        if not pk.exists():
            raise SystemExit('ERROR: kernel/printk/printk.c missing for V63 printk/dmesg display sync')
        r = read(pk)

        if 'Vili CI V63 FIX: printk/dmesg timestamp display-only helper' not in r:
            helper = (
                '\n/* Vili CI V63 FIX: printk/dmesg timestamp display-only helper.\n'
                ' * Keep printk storage/local_clock untouched; only shift timestamps\n'
                ' * when exporting dmesg/syslog text to userspace.\n'
                ' */\n'
                'extern u64 arch_sys_boot_offset;\n'
                'static inline u64 ghost_uptime_printk_show_ns(u64 ns)\n'
                '{\n'
                '\tu64 off = READ_ONCE(arch_sys_boot_offset);\n'
                '\n'
                '\tif (!off)\n'
                '\t\treturn ns;\n'
                '\tif (ns > U64_MAX - off)\n'
                '\t\treturn ns;\n'
                '\treturn ns + off;\n'
                '}\n\n'
            )
            # Put helper immediately after the include block so all later printk helpers can use it.
            incs = list(re.finditer(r'^#include[^\n]+\n', r, flags=re.M))
            if not incs:
                raise SystemExit('ERROR: include anchor not found in printk.c for V63 FIX')
            insert_at = incs[-1].end()
            r = r[:insert_at] + helper + r[insert_at:]

        if 'Vili CI V63 FIX: dmesg human timestamp display sync' not in r:
            old = 'static size_t print_time(u64 ts, char *buf)\n{\n\tunsigned long rem_nsec = do_div(ts, 1000000000);'
            new = ('static size_t print_time(u64 ts, char *buf)\n'
                   '{\n'
                   '\tunsigned long rem_nsec;\n'
                   '\n'
                   '\t/* Vili CI V63 FIX: dmesg human timestamp display sync. */\n'
                   '\tts = ghost_uptime_printk_show_ns(ts);\n'
                   '\trem_nsec = do_div(ts, 1000000000);')
            if old not in r:
                # If the older V63 bad patch partially applied in a reused workspace, normalize it.
                old_bad = ('static size_t print_time(u64 ts, char *buf)\n'
                           '{\n'
                           '\t/* Vili CI V63: dmesg human timestamp display sync. */\n'
                           '\tts = ghost_uptime_printk_show_ns(ts);\n'
                           '\tunsigned long rem_nsec = do_div(ts, 1000000000);')
                if old_bad not in r:
                    raise SystemExit('ERROR: print_time anchor not found in printk.c for V63 FIX')
                r = r.replace(old_bad, new, 1)
            else:
                r = r.replace(old, new, 1)

        if 'Vili CI V63 FIX: /dev/kmsg extended timestamp display sync' not in r:
            old = '\tu64 ts_usec = msg->ts_nsec;\n\tchar caller[20];'
            new = ('\tu64 ts_usec = msg->ts_nsec;\n'
                   '\tchar caller[20];\n'
                   '\n'
                   '\t/* Vili CI V63 FIX: /dev/kmsg extended timestamp display sync. */\n'
                   '\tts_usec = ghost_uptime_printk_show_ns(ts_usec);')
            if old not in r:
                old_bad = ('\tu64 ts_usec = msg->ts_nsec;\n'
                           '\t/* Vili CI V63: /dev/kmsg extended timestamp display sync. */\n'
                           '\tts_usec = ghost_uptime_printk_show_ns(ts_usec);\n'
                           '\tchar caller[20];')
                if old_bad not in r:
                    raise SystemExit('ERROR: msg_print_ext_header ts_nsec anchor not found in printk.c for V63 FIX')
                r = r.replace(old_bad, new, 1)
            else:
                r = r.replace(old, new, 1)

        # Guard: storage path must stay unmodified. V63 is display-only.
        if 'msg->ts_nsec = ghost_uptime' in r or 'msg->ts_nsec += arch_sys_boot_offset' in r:
            raise SystemExit('ERROR: V63 FIX must not modify stored printk msg->ts_nsec')

        # Guard: the helper must appear before the first call.
        helper_pos = r.find('static inline u64 ghost_uptime_printk_show_ns')
        call_pos = r.find('ghost_uptime_printk_show_ns(')
        if helper_pos < 0 or call_pos < 0 or helper_pos != call_pos:
            # call_pos points to helper itself when helper is first occurrence; find the next call.
            next_call = r.find('ghost_uptime_printk_show_ns(', helper_pos + 1)
            if helper_pos < 0 or next_call < 0 or helper_pos > next_call:
                raise SystemExit('ERROR: V63 FIX helper ordering verification failed')

        write(pk, r)

        # Hard guard: V61 must not contain the previous unsafe V60 original
        # arithmetic block that caused timer_list.c: expected expression.
        if 'Vili CI V60: timer_list active timer display sync only' in q or 'show_soft - show_now' in q:
            raise SystemExit('ERROR: unsafe old V60 active timer expires patch still present')

        write(tl, q)

        # 3) fs/stat.c: shift procfs only. Do NOT shift sysfs/tmpfs/nsfs/devpts/debugfs/tracefs; V55 runtime log showed 1970 kstat artifacts when broader kstat spoofing was active.
        st = Path('fs/stat.c')
        if not st.exists():
            raise SystemExit('ERROR: fs/stat.c missing')
        s = read(st)

        marker = '/**\n * generic_fillattr'
        if marker not in s:
            raise SystemExit('ERROR: generic_fillattr comment anchor not found')
        stat_includes = ''
        if '<linux/ghost_uptime.h>' not in s:
            stat_includes += '#include <linux/ghost_uptime.h>\n'
        if '<linux/timekeeping.h>' not in s:
            stat_includes += '#include <linux/timekeeping.h>\n'
        if '<linux/magic.h>' not in s:
            stat_includes += '#include <linux/magic.h>\n'
        if stat_includes:
            s = s.replace(marker, stat_includes + marker, 1)

        helper = """

        /* Vili CI V61: procfs shift plus old sysfs/pstore timestamp sanitizer. */
        #ifndef GHOST_UPTIME_MIN_VALID_REALTIME
        #define GHOST_UPTIME_MIN_VALID_REALTIME 1600000000LL
        #endif

        #ifndef SYSFS_MAGIC
        #define SYSFS_MAGIC 0x62656572
        #endif

        #ifndef PSTOREFS_MAGIC
        #define PSTOREFS_MAGIC 0x6165676C
        #endif

        #ifndef DEBUGFS_MAGIC
        #define DEBUGFS_MAGIC 0x64626720
        #endif

        #ifndef TRACEFS_MAGIC
        #define TRACEFS_MAGIC 0x74726163
        #endif

        static bool ghost_uptime_is_procfs(const struct inode *inode)
        {
                if (!inode || !inode->i_sb)
                        return false;
                return inode->i_sb->s_magic == PROC_SUPER_MAGIC;
        }

        static bool ghost_uptime_is_old_pseudo_fs(const struct inode *inode)
        {
                unsigned long magic;

                if (!inode || !inode->i_sb)
                        return false;

                magic = inode->i_sb->s_magic;
                return magic == SYSFS_MAGIC ||
                       magic == PSTOREFS_MAGIC ||
                       magic == DEBUGFS_MAGIC ||
                       magic == TRACEFS_MAGIC;
        }

        static bool ghost_uptime_ts_is_old(const struct timespec64 *ts)
        {
                return ts && ts->tv_sec > 0 &&
                       ts->tv_sec < (time64_t)GHOST_UPTIME_MIN_VALID_REALTIME;
        }

        static void ghost_uptime_shift_ts(struct timespec64 *ts, u64 off_sec)
        {
                if (!ts || !off_sec)
                        return;

                if (ts->tv_sec > (time64_t)off_sec)
                        ts->tv_sec -= (time64_t)off_sec;
                else if (ts->tv_sec > 0)
                        ts->tv_sec = 0;
        }

        static void ghost_uptime_set_ts(struct timespec64 *ts, time64_t sec)
        {
                if (!ts || sec <= 0)
                        return;
                ts->tv_sec = sec;
                ts->tv_nsec = 0;
        }

        static void ghost_uptime_sanitize_old_pseudo_ts(struct kstat *stat, u64 off_sec)
        {
                time64_t now;
                time64_t fake_boot_sec;

                if (!stat || !off_sec)
                        return;

                if (!ghost_uptime_ts_is_old(&stat->atime) &&
                    !ghost_uptime_ts_is_old(&stat->mtime) &&
                    !ghost_uptime_ts_is_old(&stat->ctime) &&
                    !ghost_uptime_ts_is_old(&stat->btime))
                        return;

                now = ktime_get_real_seconds();
                if (now <= (time64_t)(off_sec + GHOST_UPTIME_MIN_VALID_REALTIME))
                        return;

                fake_boot_sec = now - (time64_t)off_sec;
                ghost_uptime_set_ts(&stat->atime, fake_boot_sec);
                ghost_uptime_set_ts(&stat->mtime, fake_boot_sec);
                ghost_uptime_set_ts(&stat->ctime, fake_boot_sec);
                ghost_uptime_set_ts(&stat->btime, fake_boot_sec);
        }

        static bool ghost_uptime_stat_has_old_ts(const struct kstat *stat)
        {
                if (!stat)
                        return false;

                return ghost_uptime_ts_is_old(&stat->atime) ||
                       ghost_uptime_ts_is_old(&stat->mtime) ||
                       ghost_uptime_ts_is_old(&stat->ctime) ||
                       ghost_uptime_ts_is_old(&stat->btime);
        }

        static void ghost_uptime_shift_proc_ts_or_sanitize(struct kstat *stat, u64 off_sec)
        {
                if (!stat || !off_sec)
                        return;

                /* Vili CI V67: procfs inode timestamps can be mixed.
                 * /proc/uptime may have a valid realtime inode timestamp, while
                 * /proc/stat can carry an old 1970-era timestamp on this tree.
                 * Blind subtraction turns that into a visible 1970 regression.
                 * If any procfs timestamp is old, sanitize the whole kstat to
                 * fake boot realtime instead of subtracting the ghost offset.
                 */
                if (ghost_uptime_stat_has_old_ts(stat)) {
                        ghost_uptime_sanitize_old_pseudo_ts(stat, off_sec);
                        return;
                }

                ghost_uptime_shift_ts(&stat->atime, off_sec);
                ghost_uptime_shift_ts(&stat->mtime, off_sec);
                ghost_uptime_shift_ts(&stat->ctime, off_sec);
                ghost_uptime_shift_ts(&stat->btime, off_sec);
        }

        static void ghost_uptime_shift_stat(struct inode *inode, struct kstat *stat)
        {
                u64 off_sec;

                off_sec = ghost_uptime_offset_sec();
                if (!off_sec)
                        return;

                if (ghost_uptime_is_procfs(inode)) {
                        ghost_uptime_shift_proc_ts_or_sanitize(stat, off_sec);
                        return;
                }

                if (ghost_uptime_is_old_pseudo_fs(inode))
                        ghost_uptime_sanitize_old_pseudo_ts(stat, off_sec);
        }
        """.replace('          ', '')
        if 'ghost_uptime_should_shift_stat' not in s:
            sig = 'void generic_fillattr(struct inode *inode, struct kstat *stat)'
            if sig not in s:
                raise SystemExit('ERROR: generic_fillattr signature not found')
            s = s.replace(sig, helper + '\n' + sig, 1)
        else:
            # Source tree should be clean in CI, but this makes the patch safe if reapplied.
            s = re.sub(r'/\* Vili CI V5[23]:.*?static void ghost_uptime_shift_stat\(struct inode \*inode, struct kstat \*stat\)\s*\{.*?\n\}', helper.strip(), s, flags=re.S)

        if 'ghost_uptime_shift_stat(inode, stat);' not in s:
            target = 'stat->blocks = inode->i_blocks;\n}'
            repl = 'stat->blocks = inode->i_blocks;\n\tghost_uptime_shift_stat(inode, stat);\n}'
            if target not in s:
                raise SystemExit('ERROR: generic_fillattr blocks anchor not found')
            s = s.replace(target, repl, 1)
        write(st, s)

        # 4) /proc/uptime content: V61 uses patched CLOCK_BOOTTIME path.
        # Do not keep the V57 direct addition here, otherwise /proc/uptime would double-add the ghost offset.
        up = Path('fs/proc/uptime.c')
        if not up.exists():
            raise SystemExit('ERROR: fs/proc/uptime.c missing')
        u = read(up)
        uptime_anchor = 'ktime_get_boottime_ts64(&uptime);'
        if uptime_anchor not in u:
            raise SystemExit('ERROR: uptime ktime_get_boottime_ts64 anchor not found')
        u = re.sub(r'\n\s*/\* Vili CI V5[0-9]: make /proc/uptime reflect ghost boot age\. \*/\s*\n\s*if \(ghost_uptime_offset_sec\(\)\)\s*\n\s*uptime\.tv_sec \+= \(time64_t\)ghost_uptime_offset_sec\(\);', '', u, flags=re.S)
        uptime_marker = '/* Vili CI V61: /proc/uptime now follows patched CLOCK_BOOTTIME path; no second offset here. */'
        if uptime_marker not in u:
            u = u.replace(uptime_anchor, uptime_anchor + '\n\t' + uptime_marker, 1)
        write(up, u)

        # 5) /proc/stat btime: subtract the same visible offset from btime.
        ps = Path('fs/proc/stat.c')
        if not ps.exists():
            raise SystemExit('ERROR: fs/proc/stat.c missing')
        p = read(ps)
        if '<linux/ghost_uptime.h>' not in p:
            includes = list(re.finditer(r'^#include .*$', p, flags=re.M))
            if not includes:
                raise SystemExit('ERROR: include anchor not found in proc stat.c')
            pos = includes[-1].end()
            p = p[:pos] + '\n#include <linux/ghost_uptime.h>' + p[pos:]

        btime_helper = """

        /* Vili CI V61: keep /proc/stat btime consistent with fake /proc/uptime. */
        static u64 ghost_uptime_fake_btime_sec(const struct timespec64 *boottime)
        {
                u64 btime;
                u64 off_sec;

                if (!boottime || boottime->tv_sec <= 0)
                        return 0;

                btime = (u64)boottime->tv_sec;
                off_sec = ghost_uptime_offset_sec();

                if (!off_sec)
                        return btime;
                if (btime > off_sec)
                        return btime - off_sec;
                return 0;
        }
        """.replace('          ', '')
        if 'ghost_uptime_fake_btime_sec' not in p:
            sig = 'static int show_stat(struct seq_file *p, void *v)'
            if sig not in p:
                raise SystemExit('ERROR: show_stat signature not found in fs/proc/stat.c')
            p = p.replace(sig, btime_helper + '\n' + sig, 1)

        old = '(unsigned long long)boottime.tv_sec,\n\t\ttotal_forks'
        new = '(unsigned long long)ghost_uptime_fake_btime_sec(&boottime),\n\t\ttotal_forks'
        if old in p:
            p = p.replace(old, new, 1)
        elif 'ghost_uptime_fake_btime_sec(&boottime)' not in p:
            # Fallback for single-line/minified formatting.
            p2, n = re.subn(r'\(unsigned long long\)boottime\.tv_sec', r'(unsigned long long)ghost_uptime_fake_btime_sec(&boottime)', p, count=1)
            if n != 1:
                raise SystemExit('ERROR: btime boottime.tv_sec anchor not found in fs/proc/stat.c')
            p = p2
        write(ps, p)

        print('Wrote include/linux/ghost_uptime.h')
        print('Patched kernel/time/timekeeping.c: arch_sys_boot_offset plus CLOCK_BOOTTIME API wrapper offset, no boot_offset shift')
        print('Patched fs/stat.c: procfs shift/sanitize plus old sysfs/pstore timestamp sanitizer V67')
        print('Patched fs/proc/uptime.c: no direct offset; follows patched CLOCK_BOOTTIME path')
        print('Patched fs/proc/stat.c: btime offset sync')
        PY_GHOST_UPTIME_V61

        echo "===== GHOST UPTIME V61 VERIFY =====" | tee -a ../setup.log
        grep -RnsE 'arch_sys_boot_offset|ghost_uptime|GHOST_UPTIME|ghost_uptime_shift_stat|ghost_uptime_fake_btime_sec|TK_OFFS_BOOT|CLOCK_BOOTTIME' include/linux/ghost_uptime.h kernel/time/timekeeping.c kernel/time/timer_list.c kernel/printk/printk.c fs/stat.c fs/proc/uptime.c fs/proc/stat.c 2>/dev/null | head -260 | tee -a ../setup.log || true

        if ! grep -q 'arch_sys_boot_offset' kernel/time/timekeeping.c; then
          echo "ERROR: arch_sys_boot_offset missing from timekeeping.c" | tee -a ../setup.log
          exit 1
        fi
        if grep -q 'boot_offset.tv_sec +=.*ghost' kernel/time/timekeeping.c; then
          echo "ERROR: V61 must not shift boot_offset.tv_sec" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_shift_stat' fs/stat.c; then
          echo "ERROR: ghost_uptime_shift_stat missing from fs/stat.c" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_sanitize_old_pseudo_ts' fs/stat.c; then
          echo "ERROR: V61 sysfs/pstore old timestamp sanitizer missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_shift_proc_ts_or_sanitize' fs/stat.c; then
          echo "ERROR: V67 procfs old timestamp sanitizer missing" | tee -a ../setup.log
          exit 1
        fi
        if grep -q 'TMPFS_MAGIC\|NSFS_MAGIC\|DEVPTS_SUPER_MAGIC\|0x01021994\|0x6e736673\|0x00001cd1' fs/stat.c; then
          echo "ERROR: V61 must not globally shift tmpfs/nsfs/devpts timestamps" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: /proc/uptime now follows patched CLOCK_BOOTTIME path' fs/proc/uptime.c; then
          echo "ERROR: /proc/uptime V61 no-double marker missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: CLOCK_BOOTTIME API + VDSO sync' kernel/time/timekeeping.c; then
          echo "ERROR: V61 CLOCK_BOOTTIME API patch missing in ktime_get_with_offset" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: CLOCK_BOOTTIME coarse API sync' kernel/time/timekeeping.c; then
          echo "ERROR: V61 CLOCK_BOOTTIME coarse patch missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: ktime_get_boot_fast_ns ghost offset' kernel/time/timekeeping.c; then
          echo "ERROR: V61 ktime_get_boot_fast_ns patch missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_sync_vdso_boot_offset' kernel/time/timekeeping.c; then
          echo "ERROR: V61 VDSO/userspace BOOTTIME sync helper missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: sync VDSO/userspace CLOCK_BOOTTIME exposure before update_vsyscall' kernel/time/timekeeping.c; then
          echo "ERROR: V61 update_vsyscall BOOTTIME sync call missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'ghost_uptime_fake_btime_sec(&boottime)' fs/proc/stat.c; then
          echo "ERROR: /proc/stat btime patch missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61: timer_list header now-at display sync only' kernel/time/timer_list.c; then
          echo "ERROR: V61 timer_list now-at patch missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V61F: timer_list active timer expires-at local-var display sync only' kernel/time/timer_list.c; then
          echo "ERROR: V61 timer_list expires-at display patch missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V62: timer_list tickdevice next_event display sync only' kernel/time/timer_list.c; then
          echo "WARNING: V62 timer_list tickdevice next_event display patch marker missing; build will continue as V61 FIX2 for safety" | tee -a ../setup.log
        fi

        if ! grep -q 'Vili CI V63 FIX: dmesg human timestamp display sync' kernel/printk/printk.c; then
          echo "ERROR: V63 dmesg human timestamp display patch missing" | tee -a ../setup.log
          exit 1
        fi
        if ! grep -q 'Vili CI V63 FIX: /dev/kmsg extended timestamp display sync' kernel/printk/printk.c; then
          echo "ERROR: V63 /dev/kmsg extended timestamp display patch missing" | tee -a ../setup.log
          exit 1
        fi
        echo "V67 SAFE ghost uptime stable baseline OK: CLOCK_BOOTTIME + timer_list now/expires/next_event + printk/dmesg display-only, no MONOTONIC patch" | tee -a ../setup.log
    - name: Patch V68 task starttime proc stat sync without MONOTONIC core
      shell: bash
      run: |
        set -Eeuo pipefail
        cd kernel
        echo "===== PATCH V68 FIX2 TASK STARTTIME /PROC PID STAT SYNC =====" | tee -a ../setup.log
        python3 - <<'PY_V68_TASK_STARTTIME_FIX2' 2>&1 | tee -a ../setup.log
        from pathlib import Path
        import re
        import textwrap

        arr = Path('fs/proc/array.c')
        if not arr.exists():
            raise SystemExit('ERROR: fs/proc/array.c missing')

        s = arr.read_text(errors='ignore')

        # Some Android kernel trees are line-preserved, some are partially minified.
        # Insert the include in a way that is safe for both layouts.
        if '<linux/ghost_uptime.h>' not in s:
            if s.startswith('// SPDX'):
                nl = s.find('\n')
                if nl >= 0:
                    s = s[:nl+1] + '#include <linux/ghost_uptime.h>\n' + s[nl+1:]
                else:
                    s = '#include <linux/ghost_uptime.h>\n' + s
            else:
                s = '#include <linux/ghost_uptime.h>\n' + s

        helper = textwrap.dedent(r'''

        /* Vili CI V68 FIX2: task starttime sync for /proc/[pid]/stat field 22.
         * This is deeper than dmesg/timer_list display cleanup, but still avoids
         * global CLOCK_MONOTONIC/RAW and scheduler clock changes that caused V65
         * bootloop.  Field 22 is exported as clock ticks since boot.
         *
         * Fix2 policy:
         * - V59/V63 can make task->real_start_time appear in fake BOOTTIME
         *   scale already.  V68 FIX added the offset again, producing field-22
         *   values around 2x fake uptime and negative age.
         * - /proc/[pid]/stat field 22 is ticks since boot, so early boot tasks
         *   such as init/system_server should be close to zero, while newly
         *   launched shell/app tasks should be near the current fake uptime.
         * - If start_ns is already fake-scale and still inside the first early
         *   boot window, rebase it by subtracting the ghost offset.  If it is
         *   old real-scale and not early, shift it forward.  Otherwise leave it.
         */
        #define GHOST_UPTIME_TASK_EARLY_BOOT_NS (120ULL * 1000000000ULL)

        static unsigned long long ghost_uptime_proc_task_start_time_ticks(const struct task_struct *task)
        {
                u64 start_ns;
                u64 off_ns;
                u64 off_sec;

                if (!task)
                        return 0;

                start_ns = task->real_start_time;
                off_sec = ghost_uptime_offset_sec();
                off_ns = off_sec * 1000000000ULL;

                if (off_ns) {
                        if (start_ns >= off_ns) {
                                if ((start_ns - off_ns) < GHOST_UPTIME_TASK_EARLY_BOOT_NS)
                                        start_ns -= off_ns;
                        } else if (start_ns >= GHOST_UPTIME_TASK_EARLY_BOOT_NS) {
                                start_ns += off_ns;
                        }
                }

                return nsec_to_clock_t(start_ns);
        }
        ''')

        if 'ghost_uptime_proc_task_start_time_ticks' not in s:
            m = re.search(r'static\s+int\s+do_task_stat\s*\(', s)
            if not m:
                raise SystemExit('ERROR: do_task_stat signature not found in fs/proc/array.c')
            s = s[:m.start()] + helper + '\n' + s[m.start():]

        if 'start_time = ghost_uptime_proc_task_start_time_ticks(task);' not in s:
            s2, n = re.subn(
                r'start_time\s*=\s*nsec_to_clock_t\s*\(\s*task->real_start_time\s*\)\s*;',
                'start_time = ghost_uptime_proc_task_start_time_ticks(task);',
                s,
                count=1,
            )
            if n != 1:
                idx = s.find('real_start_time')
                print('ERROR: task real_start_time assignment anchor not found in fs/proc/array.c')
                if idx >= 0:
                    print('===== real_start_time context =====')
                    print(s[max(0, idx-300): idx+300])
                raise SystemExit(1)
            s = s2

        arr.write_text(s)
        print('Patched fs/proc/array.c: /proc/[pid]/stat field 22 task starttime sync V68 FIX2')
