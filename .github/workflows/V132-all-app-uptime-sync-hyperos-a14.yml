                "\t\t{\n"
                "\t\t\tint vili_susfs_ret = ksu_vili_handle_susfs_prctl(arg2, arg3, arg4, arg5);\n"
                "\t\t\tif (vili_susfs_ret != -EOPNOTSUPP)\n"
                "\t\t\t\treturn vili_susfs_ret;\n"
                "\t\t}\n"
                "\t}\n"
                "#endif\n")


        if 'Vili CI: direct SuSFS prctl bridge level 3 try_umount debug v8 v8' not in s:
            m = re.search(r'SYSCALL_DEFINE5\s*\(\s*prctl\s*,', s)
            if not m:
                raise SystemExit('ERROR: cannot find SYSCALL_DEFINE5(prctl) in kernel/sys.c')
            brace = s.find('{', m.end())
            if brace < 0:
                raise SystemExit('ERROR: cannot find opening brace for SYSCALL_DEFINE5(prctl) in kernel/sys.c')
            s = s[:brace+1] + bridge_call + s[brace+1:]

        if s != orig:
            sysc.write_text(s)
            print('Patched kernel/sys.c with direct SuSFS prctl syscall bridge.')
        else:
            print('kernel/sys.c already has direct SuSFS prctl syscall bridge.')

        final = sysc.read_text(errors='ignore')
        if 'ksu_vili_handle_susfs_prctl' not in final or 'Vili CI: direct SuSFS prctl bridge level 3 try_umount debug v8 v8' not in final:
            raise SystemExit('ERROR: direct SuSFS prctl bridge injection verification failed in kernel/sys.c')

