        cat >"$TOOLS/V132-collect-in-twrp.sh" <<'EOF_V126_TWRP'
        #!/sbin/sh
        # V132 read-only bootloop collector for Xiaomi 11T Pro (vili).
        # Run in TWRP/OrangeFox terminal: sh /sdcard/V132-collect-in-twrp.sh

        set -u

        if [ -d /sdcard ] && [ -w /sdcard ]; then
          BASE=/sdcard
        else
          BASE=/tmp
        fi

        STAMP="$(date +%Y%m%d-%H%M%S 2>/dev/null || echo unknown)"
        NAME="V132-bootloop-logs-${STAMP}"
        OUT="${BASE}/${NAME}"
        ARCHIVE="${BASE}/${NAME}.tar.gz"
        TAR_ERROR="${BASE}/${NAME}-tar-error.txt"
        mkdir -p "$OUT"

        run_to() {
          target="$1"
          shift
          {
            echo "COMMAND: $*"
            "$@"
          } >"$OUT/$target" 2>&1 || true
        }

        {
          echo "collector=V132"
          echo "started_utc=$(date -u 2>/dev/null || true)"
          echo "output=$OUT"
          echo "This collector never writes to a block device."
        } >"$OUT/00-summary.txt"

        run_to 01-uname.txt uname -a
        run_to 02-props.txt getprop
        run_to 03-cmdline.txt cat /proc/cmdline
        run_to 04-mounts.txt cat /proc/mounts
        run_to 05-proc-mtd.txt cat /proc/mtd
        run_to 06-partitions.txt cat /proc/partitions
        run_to 07-block-links.txt ls -la /dev/block /dev/block/by-name /dev/block/bootdevice/by-name
        run_to 08-block-sysfs.txt sh -c 'for f in /sys/class/block/sda15/size /sys/class/block/sda15/start /sys/class/block/sda15/dev; do echo "===== $f ====="; cat "$f" 2>&1; done'
        run_to 09-device-tree-model.txt sh -c 'for f in /proc/device-tree/model /proc/device-tree/compatible; do echo "===== $f ====="; tr "\000" "\n" < "$f" 2>/dev/null; done'
        run_to 20-recovery-dmesg.txt dmesg
        run_to 21-kernel-state.txt sh -c 'cat /proc/uptime; echo; head -20 /proc/stat; echo; cat /proc/interrupts; echo; cat /proc/timer_list 2>/dev/null; echo; cat /proc/softirqs'
        run_to 24-suspend-stats.txt sh -c '
        for root in /sys/power/suspend_stats /sys/kernel/debug/suspend_stats; do
          echo "===== $root ====="
          if [ -d "$root" ]; then
            found=0
            for child in "$root"/*; do
              [ -f "$child" ] || continue
              found=1
              echo "--- ${child##*/} ---"
              cat "$child" 2>&1 || true
            done
            [ "$found" -eq 1 ] || echo "directory has no readable regular child files"
          elif [ -r "$root" ]; then
            cat "$root" 2>&1 || true
          else
            echo "unavailable"
          fi
        done'
        run_to 22-recovery-log.txt sh -c 'cat /tmp/recovery.log 2>/dev/null; cat /cache/recovery/last_log 2>/dev/null'
        run_to 23-logcat.txt sh -c 'logcat -b all -d -v threadtime 2>/dev/null'

        mkdir -p /sys/fs/pstore 2>/dev/null || true
        if ! grep -q ' /sys/fs/pstore ' /proc/mounts 2>/dev/null; then
          mount -t pstore pstore /sys/fs/pstore 2>"$OUT/10-pstore-mount-error.txt" || true
        fi
        run_to 11-pstore-status.txt sh -c 'grep pstore /proc/mounts; ls -la /sys/fs/pstore'
        mkdir -p "$OUT/pstore"
        cp -a /sys/fs/pstore/. "$OUT/pstore/" 2>"$OUT/12-pstore-copy-error.txt" || true
        run_to 13-last-kmsg.txt sh -c 'cat /proc/last_kmsg 2>/dev/null'
        run_to 14-pstore-registration.txt sh -c 'dmesg | grep -iE "pstore|ramoops|mtdoops|block2mtd|panic|oops"'
        run_to 15-sysinfo-userspace.txt sh -c 'echo "===== /proc/uptime ====="; cat /proc/uptime 2>/dev/null; echo; echo "===== uptime commands ====="; command -v uptime 2>/dev/null; uptime 2>/dev/null; command -v toybox 2>/dev/null && toybox uptime 2>/dev/null; command -v busybox 2>/dev/null && busybox uptime 2>/dev/null'

        # V103 showed this exact mapping. Read it only when the active cmdline confirms it.
        BLOCK=/dev/block/sda15
        EXPECTED_MAP='block2mtd.block2mtd=/dev/block/sda15,2097152'
        if grep -q "$EXPECTED_MAP" /proc/cmdline 2>/dev/null && [ -b "$BLOCK" ]; then
          SECTORS="$(cat /sys/class/block/sda15/size 2>/dev/null || echo 0)"
          case "$SECTORS" in
            ''|*[!0-9]*) SECTORS=0 ;;
          esac
          BYTES=$((SECTORS * 512))
          {
            echo "mapping_confirmed=$EXPECTED_MAP"
            echo "block=$BLOCK"
            echo "sectors=$SECTORS"
            echo "bytes=$BYTES"
            echo "mode=read-only"
          } >"$OUT/30-mtdoops-read-info.txt"

          if [ "$BYTES" -gt 0 ] && [ "$BYTES" -le 67108864 ]; then
            dd if="$BLOCK" of="$OUT/31-mtdoops-sda15-full.bin" bs=1048576 \
              2>"$OUT/31-mtdoops-dd.txt" || true
            RAW="$OUT/31-mtdoops-sda15-full.bin"
          else
            dd if="$BLOCK" of="$OUT/31-mtdoops-sda15-first-4MiB.bin" bs=1048576 count=4 \
              2>"$OUT/31-mtdoops-first-dd.txt" || true
            RAW="$OUT/31-mtdoops-sda15-first-4MiB.bin"
            if [ "$SECTORS" -gt 8192 ]; then
              SKIP_MIB=$((SECTORS / 2048 - 4))
              dd if="$BLOCK" of="$OUT/32-mtdoops-sda15-last-4MiB.bin" bs=1048576 skip="$SKIP_MIB" count=4 \
                2>"$OUT/32-mtdoops-last-dd.txt" || true
            fi
          fi

          if command -v strings >/dev/null 2>&1; then
            strings -a -t d "$RAW" >"$OUT/33-mtdoops-strings.txt" 2>&1 || true
            [ ! -f "$OUT/32-mtdoops-sda15-last-4MiB.bin" ] || \
              strings -a -t d "$OUT/32-mtdoops-sda15-last-4MiB.bin" >>"$OUT/33-mtdoops-strings.txt" 2>&1 || true
          fi
          command -v gzip >/dev/null 2>&1 && gzip -9 "$OUT"/*.bin 2>/dev/null || true
        else
          {
            echo "SKIPPED: exact V103 block2mtd mapping was not present or $BLOCK was not a block device."
            echo "No raw partition was read."
          } >"$OUT/30-mtdoops-read-info.txt"
        fi

        cat >"$OUT/V132-UPLOAD-README.txt" <<'EOF'
        Send this complete archive together with the GitHub Actions V132 artifact.
        The pstore directory may be empty. The mtdoops files are read-only snapshots
        and can contain the previous panic when pstore/ramoops does not.
        EOF

        rm -f "$ARCHIVE" "$TAR_ERROR"
        if tar -czf "$ARCHIVE" -C "$BASE" "$NAME" 2>"$TAR_ERROR"; then
          rm -f "$TAR_ERROR"
          echo "DONE: $ARCHIVE"
        else
          cp -a "$TAR_ERROR" "$OUT/90-tar-error.txt" 2>/dev/null || true
          ARCHIVE="${BASE}/${NAME}.tar"
          tar -cf "$ARCHIVE" -C "$BASE" "$NAME"
          rm -f "$TAR_ERROR"
          echo "DONE: $ARCHIVE"
        fi
        echo "Folder kept at: $OUT"
        EOF_V126_TWRP
        chmod 0755 "$TOOLS/V132-collect-in-twrp.sh"
        sh -n "$TOOLS/V132-collect-in-twrp.sh" 2>&1 | tee -a setup.log
        sha256sum "$TOOLS/V132-collect-in-twrp.sh" | tee -a setup.log

        echo "===== V132 WRITE RUNTIME AUDIT DIRECT =====" | tee -a setup.log
        cat >"$TOOLS/V132-check-ghost-uptime-noroot.sh" <<'EOF_V132_AUDIT_DIRECT'
        #!/system/bin/sh
        # V132 non-root ghost-uptime audit for Xiaomi 11T Pro (vili).
        # The script is read-only, never invokes su, and works from adb shell or a
        # normal Android terminal. ADB shell can read more surfaces than an app UID.

        set -u
        umask 077

        VERSION="V132"
        STAMP="$(date +%Y%m%d-%H%M%S 2>/dev/null || echo unknown)"

        choose_output()
        {
        	if [ "$#" -gt 0 ] && [ -n "${1:-}" ]; then
        		case "$1" in
        			*.txt) printf '%s\n' "$1" ;;
        			*) printf '%s/%s-noroot-uptime-audit-%s.txt\n' "${1%/}" "$VERSION" "$STAMP" ;;
        		esac
        		return
        	fi

        	for dir in /sdcard/Download /data/local/tmp /sdcard /tmp .; do
        		if [ -d "$dir" ] && [ -w "$dir" ]; then
        			printf '%s/%s-noroot-uptime-audit-%s.txt\n' "${dir%/}" "$VERSION" "$STAMP"
        			return
        		fi
        	done

        	printf './%s-noroot-uptime-audit-%s.txt\n' "$VERSION" "$STAMP"
        }

        OUT="$(choose_output "${1:-}")"
        OUT_DIR="${OUT%/*}"
        [ "$OUT_DIR" = "$OUT" ] && OUT_DIR=.
        mkdir -p "$OUT_DIR" 2>/dev/null || true
        if ! : >"$OUT" 2>/dev/null; then
        	OUT="./${VERSION}-noroot-uptime-audit-${STAMP}.txt"
        	: >"$OUT" || exit 1
        fi

        say()
        {
        	printf '%s\n' "$*" >>"$OUT"
        }

        section()
        {
        	say ""
        	say "===== $* ====="
        }

        capture()
        {
        	title="$1"
        	shift
        	section "$title"
        	{
        		printf 'COMMAND:'
        		for arg in "$@"; do printf ' %s' "$arg"; done
        		printf '\n'
        		"$@"
        	} >>"$OUT" 2>&1 || say "RESULT: unavailable or permission denied (exit=$?)"
        }

        read_first()
        {
        	[ -r "$1" ] || return 1
        	awk 'NR == 1 { print $1; exit }' "$1" 2>/dev/null
        }

        integer_part()
        {
        	printf '%s\n' "$1" | awk -F. 'NR == 1 { print $1 + 0 }'
        }

        numeric_or_zero()
        {
        	case "${1:-}" in
        		''|*[!0-9]*) printf '0\n' ;;
        		*) printf '%s\n' "$1" ;;
        	esac
        }

        decimal_add()
        {
        	awk -v a="${1:-0}" -v b="${2:-0}" 'BEGIN { printf "%.0f\n", a + b }'
        }

        less_than_half_uptime_us()
        {
        	awk -v idle_us="${1:-0}" -v uptime_sec="${2:-0}" \
        		'BEGIN { exit !(uptime_sec > 0 && idle_us < uptime_sec * 500000) }'
        }

        parse_uptime_text_seconds()
        {
        	# Toybox commonly prints: "HH:MM:SS up N days, H:MM, N users, ..."
        	# Parse only the duration between "up" and "users". The result is rounded
        	# to minutes by uptime(1), so later comparisons deliberately allow 180s.
        	printf '%s\n' "$1" | awk '
        	{
        		seen = 0
        		seconds = 0
        		for (i = 1; i <= NF; i++) {
        			token = $i
        			gsub(/,/, "", token)
        			if (!seen) {
        				if (token == "up")
        					seen = 1
        				continue
        			}

        			next_token = $(i + 1)
        			gsub(/,/, "", next_token)
        			if (token ~ /^[0-9]+$/ && next_token ~ /^days?$/) {
        				seconds += token * 86400
        				i++
        				continue
        			}
        			if (token ~ /^[0-9]+:[0-9]+$/) {
        				split(token, hm, ":")
        				seconds += hm[1] * 3600 + hm[2] * 60
        				continue
        			}
        			if (token ~ /^[0-9]+$/ && next_token ~ /^mins?$/) {
        				seconds += token * 60
        				i++
        				continue
        			}
        			if (token ~ /^[0-9]+$/ && next_token ~ /^users?$/)
        				break
        		}
        		if (seen)
        			printf "%.0f\n", seconds
        	}'
        }

        WARN_COUNT=0
        PASS_COUNT=0
        INFO_COUNT=0
        FAIL_COUNT=0

        fail()
        {
            FAIL_COUNT=$((FAIL_COUNT + 1))
            say "FAIL[$FAIL_COUNT]: $*"
        }

        warn()
        {
        	WARN_COUNT=$((WARN_COUNT + 1))
        	say "WARN[$WARN_COUNT]: $*"
        }

        pass()
        {
        	PASS_COUNT=$((PASS_COUNT + 1))
        	say "PASS[$PASS_COUNT]: $*"
        }

        info()
        {
        	INFO_COUNT=$((INFO_COUNT + 1))
        	say "INFO[$INFO_COUNT]: $*"
        }

        say "${VERSION} NON-ROOT GHOST-UPTIME AUDIT"
        say "started_utc=$(date -u 2>/dev/null || true)"
        say "report=$OUT"
        say "mode=read-only; no su; no root required"
        say "scope=ADB shell sees more than an ordinary third-party app UID"

        section "IDENTITY AND BUILD"
        id >>"$OUT" 2>&1 || true
        uname -a >>"$OUT" 2>&1 || true
        for prop in \
        	ro.product.device ro.build.display.id ro.build.fingerprint \
        	ro.build.version.release ro.build.version.sdk ro.build.date.utc \
        	ro.boot.slot_suffix sys.boot_completed ro.runtime.firstboot; do
        	value="$(getprop "$prop" 2>/dev/null || true)"
        	say "$prop=$value"
        done
        if command -v getenforce >/dev/null 2>&1; then
        	say "selinux=$(getenforce 2>/dev/null || true)"
        	KERNEL_RELEASE="$(uname -r 2>/dev/null || true)"
        	say "kernel_release=${KERNEL_RELEASE:-unavailable}"
        	if [ "$(id -u 2>/dev/null || echo -1)" = "0" ] && [ -r /data/adb/modules/v132_ghost_guard/kernel_localversion_expected ]; then
        		EXPECTED_LOCALVERSION="$(cat /data/adb/modules/v132_ghost_guard/kernel_localversion_expected 2>/dev/null | tr -d '\r\n' || true)"
        		say "kernel_localversion_expected=${EXPECTED_LOCALVERSION:-unavailable}"
        		case "$KERNEL_RELEASE" in
        			*"$EXPECTED_LOCALVERSION") pass "V132 running kernel release matches the workflow-selected LOCALVERSION" ;;
        			*) warn "running kernel release does not end with workflow-selected LOCALVERSION ($EXPECTED_LOCALVERSION)" ;;
        		esac
        	fi
        fi

        PROC_UP_RAW="$(read_first /proc/uptime || true)"
        PROC_UP_SEC="$(integer_part "${PROC_UP_RAW:-0}")"
        PROC_UP_SEC="$(numeric_or_zero "$PROC_UP_SEC")"

        section "PRIMARY UPTIME CROSS-CHECK"
        say "proc_uptime_raw=${PROC_UP_RAW:-unavaileble}"
        if [ "$PROC_UP_SEC" -gt 0 ]; then
        	pass "/proc/uptime readable; integer seconds=$PROC_UP_SEC"
        else
            AUDIT_UID="$(id -u 2>/dev/null || echo -1)"
            case "$AUDIT_UID" in
                ''|*[!0-9]*) warn "/proc/uptime is unavailable or not numeric" ;;
                *) if [ "$AUDIT_UID" -ge 10000 ]; then info "/proc/uptime denied to app UID as expected; companion snapshot is the authoritative app-facing reference"; else warn "/proc/uptime is unavailable or not numeric"; fi ;;
            esac
        fi

        UPTIME_TEXT=""
        SYSINFO_UP_SEC=0
        if command -v uptime >/dev/null 2>&1; then
        	UPTIME_TEXT="$(uptime 2>&1 || true)"
        	say "uptime_command=$UPTIME_TEXT"
        	SYSINFO_UP_SEC="$(parse_uptime_text_seconds "$UPTIME_TEXT" || true)"
        	SYSINFO_UP_SEC="$(numeric_or_zero "$SYSINFO_UP_SEC")"
        	say "uptime_command_parsed_seconds=$SYSINFO_UP_SEC"
        fi
        if command -v toybox >/dev/null 2>&1; then
        	say "toybox_uptime=$(toybox uptime 2>&1 || true)"
        fi
        if command -v busybox >/dev/null 2>&1; then
        	say "busybox_uptime=$(busybox uptime 2>&1 || true)"
        fi

        BTIME="$(awk '$1 == "btime" { print $2; exit }' /proc/stat 2>/dev/null || true)"
        NOW_EPOCH="$(date +%s 2>/dev/null || true)"
        BTIME="$(numeric_or_zero "$BTIME")"
        NOW_EPOCH="$(numeric_or_zero "$NOW_EPOCH")"
        say "proc_stat_btime=$BTIME"
        say "wall_epoch_now=$NOW_EPOCH"
        if [ "$BTIME" -gt 0 ] && [ "$NOW_EPOCH" -gt "$BTIME" ] && [ "$PROC_UP_SEC" -gt 0 ]; then
        	WALL_AGE=$((NOW_EPOCH - BTIME))
        	DIFF=$((WALL_AGE - PROC_UP_SEC))
        	[ "$DIFF" -lt 0 ] && DIFF=$((-DIFF))
        	say "wall_clock_minus_btime_sec=$WALL_AGE"
        	say "abs_diff_vs_proc_uptime_sec=$DIFF"
        	if [ "$DIFF" -le 10 ]; then
        		pass "/proc/stat btime agrees with /proc/uptime within 10 seconds"
        	else
        		warn "/proc/stat btime differs from /proc/uptime by ${DIFF}s"
        	fi
        else
        	info "btime comparison skipped because wall clock or fields were unavailable"
        fi

        HZ="$(getconf CLK_TCK 2>/dev/null || true)"
        HZ="$(numeric_or_zero "$HZ")"
        [ "$HZ" -gt 0 ] || HZ=100
        say "userspace_CLK_TCK=$HZ"
        SELF_START_SEC=0
        for pid in self 1; do
        	stat_file="/proc/$pid/stat"
        	start_ticks="$(sed 's/^.*) //' "$stat_file" 2>/dev/null | awk 'NR == 1 { print $20; exit }')"
        	start_ticks="$(numeric_or_zero "$start_ticks")"
        	start_sec=$((start_ticks / HZ))
        	say "pid_${pid}_start_ticks=$start_ticks"
        	say "pid_${pid}_start_seconds_on_exposed_monotonic_axis=$start_sec"
        	[ "$pid" != self ] || SELF_START_SEC="$start_sec"
        	if [ "$PROC_UP_SEC" -gt 0 ] && [ "$start_sec" -gt $((PROC_UP_SEC + 10)) ]; then
        		warn "/proc/$pid/stat starttime is more than 10 seconds later than exposed uptime"
        	fi
        done

        EXPOSED_UP_SEC="$PROC_UP_SEC"
        EXPOSED_UP_SOURCE="/proc/uptime"
        if [ "$EXPOSED_UP_SEC" -le 0 ] && [ "$SELF_START_SEC" -gt 0 ]; then
        	EXPOSED_UP_SEC="$SELF_START_SEC"
        	EXPOSED_UP_SOURCE="/proc/self/stat starttime"
        	info "/proc/uptime unavailable; using current-process starttime as an approximate exposed-uptime reference"
        fi
        say "exposed_uptime_reference_source=$EXPOSED_UP_SOURCE"
        say "exposed_uptime_reference_seconds=$EXPOSED_UP_SEC"

        FIRSTBOOT_MS="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
        FIRSTBOOT_SEC="$(printf '%s\n' "$FIRSTBOOT_MS" | awk '/^[0-9]+$/ { printf "%.0f\n", $1 / 1000; exit }')"
        FIRSTBOOT_SEC="$(numeric_or_zero "$FIRSTBOOT_SEC")"
        REAL_BOOT_AGE_SEC=0
        if [ "$FIRSTBOOT_SEC" -gt 0 ] && [ "$NOW_EPOCH" -gt "$FIRSTBOOT_SEC" ]; then
        	REAL_BOOT_AGE_SEC=$((NOW_EPOCH - FIRSTBOOT_SEC))
        fi
        say "runtime_firstboot_epoch_ms=${FIRSTBOOT_MS:-unavailable}"
        say "runtime_firstboot_epoch_sec=$FIRSTBOOT_SEC"
        say "runtime_firstboot_age_seconds=$REAL_BOOT_AGE_SEC"
        if [ "$FIRSTBOOT_SEC" -gt 0 ] && [ "$EXPOSED_UP_SEC" -gt 0 ]; then
        	FIRSTBOOT_DIFF=$((REAL_BOOT_AGE_SEC - EXPOSED_UP_SEC))
        	[ "$FIRSTBOOT_DIFF" -ge 0 ] || FIRSTBOOT_DIFF=$((-FIRSTBOOT_DIFF))
        	say "runtime_firstboot_abs_diff_vs_exposed_reference_sec=$FIRSTBOOT_DIFF"
        	if [ "$FIRSTBOOT_DIFF" -le 300 ]; then
        		pass "V132 ro.runtime.firstboot is aligned with the ghost uptime reference within 300 seconds"
        	elif [ "$EXPOSED_UP_SEC" -gt 86400 ] && awk -v real="$REAL_BOOT_AGE_SEC" -v fake="$EXPOSED_UP_SEC" 'BEGIN { exit !(real > 0 && real < fake / 4) }'; then
        		warn "V132 firstboot guard is not active: ro.runtime.firstboot still exposes the short privileged/root boot age"
        	else
        		warn "ro.runtime.firstboot differs from the exposed ghost uptime reference by ${FIRSTBOOT_DIFF}s"
        	fi
        else
        	info "ro.runtime.firstboot alignment check unavailable for this UID"
        fi

        section "V132 GHOST USERSPACE GUARD ACTIVATION"
        V132_HEALTH_LOG=/data/local/tmp/V132-module-health.log
        if [ "$(id -u 2>/dev/null || echo -1)" = "0" ]; then
            if [ -r "$V132_HEALTH_LOG" ]; then
                say "-- V132 module health log tail --"
                tail -n 80 "$V132_HEALTH_LOG" >>"$OUT" 2>&1 || true
            else
                say "v132_module_health_log_readable=no"
            fi
            say "legacy_v1261_module_present=$([ -d /data/adb/modules/v1261_ghost_guard ] && echo yes || echo no)"
        fi
        V132_MOD="/data/adb/modules/v132_ghost_guard"
        if [ "$(id -u 2>/dev/null || echo -1)" = "0" ]; then
            if [ -f "$V132_MOD/module.prop" ]; then
                say "v132_module_present=yes"
                grep -E '^(id|name|version|versionCode)=' "$V132_MOD/module.prop" >>"$OUT" 2>/dev/null || true
                if [ -e "$V132_MOD/disable" ]; then
                    warn "V132 ghost userspace guard module exists but is disabled"
                elif [ -e "$V132_MOD/remove" ]; then
                    warn "V132 ghost userspace guard module is marked for removal"
                else
                    pass "V132 ghost userspace guard module directory is present and enabled"
                fi
                say "v132_post_fs_data_present=$([ -f "$V132_MOD/post-fs-data.sh" ] && echo yes || echo no)"
                say "v132_post_mount_present=$([ -f "$V132_MOD/post-mount.sh" ] && echo yes || echo no)"
                say "v132_boot_completed_present=$([ -f "$V132_MOD/boot-completed.sh" ] && echo yes || echo no)"
                say "v132_logcat_wrapper_present=$([ -f "$V132_MOD/bin/logcat-wrapper" ] && echo yes || echo no)"
            else
                say "v132_module_present=no"
                warn "V132 ghost userspace guard is missing from /data/adb/modules; AnyKernel auto-activation was skipped or /data was unavailable during flashing"
            fi

            REAL=/dev/.v132-logcat-real
            WRAP=/dev/.v132-logcat-wrapper
            TARGET=/system/bin/logcat
            real_size="$(wc -c <"$REAL" 2>/dev/null | tr -cd '0-9')"
            wrap_size="$(wc -c <"$WRAP" 2>/dev/null | tr -cd '0-9')"
            target_size="$(wc -c <"$TARGET" 2>/dev/null | tr -cd '0-9')"
            real_size="$(numeric_or_zero "$real_size")"
            wrap_size="$(numeric_or_zero "$wrap_size")"
            target_size="$(numeric_or_zero "$target_size")"
            say "v132_runtime_real_logcat_present=$([ -x "$REAL" ] && echo yes || echo no)"
            say "v132_runtime_wrapper_present=$([ -x "$WRAP" ] && echo yes || echo no)"
            say "v132_real_logcat_size=$real_size"
            say "v132_wrapper_size=$wrap_size"
            say "v132_system_logcat_size=$target_size"

            if [ -e "$REAL" ]; then ls -lZ "$REAL" >>"$OUT" 2>/dev/null || true; fi
            if [ -e "$WRAP" ]; then ls -lZ "$WRAP" >>"$OUT" 2>/dev/null || true; fi

            if command -v sha256sum >/dev/null 2>&1; then
                real_hash="$(sha256sum "$REAL" 2>/dev/null | awk '{print $1}' || true)"
                wrap_hash="$(sha256sum "$WRAP" 2>/dev/null | awk '{print $1}' || true)"
                target_hash="$(sha256sum "$TARGET" 2>/dev/null | awk '{print $1}' || true)"
                say "v132_real_logcat_sha256=${real_hash:-unavailable}"
                say "v132_wrapper_sha256=${wrap_hash:-unavailable}"
                say "v132_system_logcat_sha256=${target_hash:-unavailable}"
                if [ -n "$real_hash" ] && [ -n "$wrap_hash" ] && [ "$real_hash" = "$wrap_hash" ]; then
                    warn "V132 recursion guard FAILED: preserved real logcat is identical to the wrapper"
                elif [ "$real_size" -gt 8192 ] && [ -n "$target_hash" ] && [ -n "$wrap_hash" ] && [ "$target_hash" = "$wrap_hash" ]; then
                    pass "V132 wrapper is active and the preserved real logcat remains a distinct executable"
                elif [ "$real_size" -gt 8192 ] && [ -n "$target_hash" ] && [ -n "$real_hash" ] && [ "$target_hash" = "$real_hash" ]; then
                    info "V132 fail-open state: stock logcat is active because wrapper validation/mount was skipped"
                else
                    warn "V132 logcat integrity state is ambiguous; inspect guard log before relying on the wrapper"
                fi
            fi

            if [ -r /data/local/tmp/V132-ghost-guard.log ]; then
                say "-- V132 ghost guard log tail --"
                tail -n 80 /data/local/tmp/V132-ghost-guard.log >>"$OUT" 2>&1 || true
            else
                say "v132_guard_log_readable=no"
            fi
        else
            info "V132 module activation and runtime integrity checks require root privileges"
        fi

        section "V132 APP-FACING JAVA MONOTONIC CANARY"
        V132_APP_LOG=/data/local/tmp/V132-app-clock-hook.log
        V132_LOADER_HEALTH=/data/local/tmp/V132-loader-health.log
        V132_TARGET_PIDS=""

        manifest_get()
        {
            key="$1"
            file="$2"
            [ -r "$file" ] || return 1
            awk -F= -v k="$key" '$1 == k { sub(/^[^=]*=/, ""); print; exit }' "$file" 2>/dev/null
        }

        if [ "$(id -u 2>/dev/null || echo -1)" = "0" ]; then
            V132_MOD="/data/adb/modules/v132_ghost_guard"
            V132_SCOPE="$(head -n 1 "$V132_MOD/app_scope" 2>/dev/null | tr -d '\r\n' || true)"
            V132_PKG="$(head -n 1 "$V132_MOD/target_package" 2>/dev/null | tr -d '\r\n' || true)"
            V132_UID="$(head -n 1 "$V132_MOD/target_uid" 2>/dev/null | tr -cd '0-9' || true)"
            say "v132_app_scope=${V132_SCOPE:-unavailable}"
            say "v132_target_package=${V132_PKG:-unavailable}"
            say "v132_target_uid=${V132_UID:-unavailable}"
            say "v132_zygisk_arm64_present=$([ -f "$V132_MOD/zygisk/arm64-v8a.so" ] && echo yes || echo no)"
            say "v132_zygisk_arm32_present=$([ -f "$V132_MOD/zygisk/armeabi-v7a.so" ] && echo yes || echo no)"

            V132_MANIFEST="$V132_MOD/deps/ZYGISK-ELF-MANIFEST.txt"
            say "v132_elf_manifest_present=$([ -r "$V132_MANIFEST" ] && echo yes || echo no)"
            if [ -r "$V132_MANIFEST" ]; then
                say "-- V132 Zygisk ELF manifest --"
                cat "$V132_MANIFEST" >>"$OUT" 2>/dev/null || true
                MAN_API="$(manifest_get api_version "$V132_MANIFEST" || true)"
                MAN_A64="$(manifest_get arm64_sha256 "$V132_MANIFEST" || true)"
                MAN_A32="$(manifest_get arm32_sha256 "$V132_MANIFEST" || true)"
                say "v132_manifest_api_version=${MAN_API:-unavailable}"
                if command -v sha256sum >/dev/null 2>&1; then
                    RUN_A64="$(sha256sum "$V132_MOD/zygisk/arm64-v8a.so" 2>/dev/null | awk '{print $1}' || true)"
                    RUN_A32="$(sha256sum "$V132_MOD/zygisk/armeabi-v7a.so" 2>/dev/null | awk '{print $1}' || true)"
                    say "v132_arm64_runtime_sha256=${RUN_A64:-unavailable}"
                    say "v132_arm32_runtime_sha256=${RUN_A32:-unavailable}"
                    if [ -n "$MAN_A64" ] && [ -n "$MAN_A32" ] &&
                       [ "$RUN_A64" = "$MAN_A64" ] && [ "$RUN_A32" = "$MAN_A32" ]; then
                        pass "V132 Zygisk ELFs match the build-time manifest for both ABIs"
                    else
                        warn "V132 Zygisk ELF SHA256 does not match the build-time manifest"
                    fi
                else
                    info "sha256sum unavailable; V132 ELF manifest cannot be verified byte-for-byte on device"
                fi
                if [ "$MAN_API" = "5" ]; then
                    pass "V132 module manifest declares current public Zygisk API v5"
                else
                    warn "V132 module manifest API version is unexpected: ${MAN_API:-unavailable}"
                fi
            else
                warn "V132 Zygisk ELF manifest is missing"
            fi

            case "${V132_PKG:-}" in
                ''|unavailable) ;;
                *) V132_TARGET_PIDS="$(pidof "$V132_PKG" 2>/dev/null || true)" ;;
            esac
            say "v132_target_process_pids=${V132_TARGET_PIDS:-none}"
            if [ -n "$V132_TARGET_PIDS" ]; then
                V132_FIRST_PID="$(printf '%s\n' "$V132_TARGET_PIDS" | awk '{print $1}')"
                V132_EXE="$(readlink "/proc/$V132_FIRST_PID/exe" 2>/dev/null || true)"
                say "v132_target_first_pid=$V132_FIRST_PID"
                say "v132_target_exe=${V132_EXE:-unavailable}"
                if [ -r "/proc/$V132_FIRST_PID/maps" ]; then
                    say "v132_target_maps_readable=yes"
                    V132_MAP_HINTS="$(grep -E 'v132|zygisk|app_process(32|64)?' "/proc/$V132_FIRST_PID/maps" 2>/dev/null | tail -n 30 || true)"
                    if [ -n "$V132_MAP_HINTS" ]; then
                        say "-- V132 target maps hints --"
                        printf '%s\n' "$V132_MAP_HINTS" >>"$OUT"
                    else
                        info "target maps are readable but contain no pathname hint for V132; Zygisk Next anonymous-memory mode can legitimately hide module paths"
                    fi
                else
                    say "v132_target_maps_readable=no"
                fi
            fi

            V132_STALE_ENABLED=""
            for old in \
                v124_ghost_guard v125_ghost_guard v1251_ghost_guard \
                v126_ghost_guard v1261_ghost_guard v127_ghost_guard v1273_ghost_guard \
                v128_ghost_guard v129_ghost_guard v130_ghost_guard v131_ghost_guard; do
                if [ -d "/data/adb/modules/$old" ] &&
                   [ ! -e "/data/adb/modules/$old/disable" ] &&
                   [ ! -e "/data/adb/modules/$old/remove" ]; then
                    V132_STALE_ENABLED="$V132_STALE_ENABLED $old"
                fi
            done
            V132_STALE_ENABLED="$(printf '%s' "$V132_STALE_ENABLED" | sed 's/^ *//')"
            say "v132_stale_ghost_modules_enabled=${V132_STALE_ENABLED:-none}"
            if [ -z "$V132_STALE_ENABLED" ]; then
                pass "V132 is the only enabled recent ghost app-clock module"
            else
                warn "stale ghost Zygisk modules are still enabled: $V132_STALE_ENABLED"
            fi

            REZ_ACTIVE=0
            ZN_ACTIVE=0
            REZ_STAGED=0
            if [ -f /data/adb/modules/rezygisk/module.prop ] &&
               [ ! -e /data/adb/modules/rezygisk/disable ] &&
               [ ! -e /data/adb/modules/rezygisk/remove ]; then
                REZ_ACTIVE=1
            fi
            if [ -f /data/adb/modules/zygisksu/module.prop ] &&
               [ ! -e /data/adb/modules/zygisksu/disable ] &&
               [ ! -e /data/adb/modules/zygisksu/remove ]; then
                ZN_ACTIVE=1
            fi
            if [ -f /data/adb/modules_update/rezygisk/module.prop ] ||
               [ -e /data/local/tmp/V132-rezygisk-reboot-required ]; then
                REZ_STAGED=1
            fi
            say "rezygisk_active=$REZ_ACTIVE"
            say "zygisknext_active=$ZN_ACTIVE"
            say "rezygisk_staged_reboot_required=$REZ_STAGED"
            say "v132_rezygisk_dependency_present=$([ -f "$V132_MOD/deps/ReZygisk-v1.0.0-515-333d423-release.zip" ] && echo yes || echo no)"
            if [ "$REZ_ACTIVE" -eq 1 ]; then
                grep -E '^(id|name|version|versionCode)=' /data/adb/modules/rezygisk/module.prop >>"$OUT" 2>/dev/null || true
                pass "ReZygisk is present and enabled for the V132 app-process guard"
            elif [ "$ZN_ACTIVE" -eq 1 ]; then
                grep -E '^(id|name|version|versionCode)=' /data/adb/modules/zygisksu/module.prop >>"$OUT" 2>/dev/null || true
                say "v132_zygisknext_cli_present=$([ -x /data/adb/modules/zygisksu/bin/zygiskd ] && echo yes || echo no)"
                V132_LINKER_MODE="$(head -n 1 /data/adb/modules/v132_ghost_guard/zygisknext_linker_mode 2>/dev/null | tr -d '\r\n' || true)"
                say "v132_requested_linker_mode=${V132_LINKER_MODE:-keep}"
                if [ -r /data/adb/zygisksu/linker ]; then say "v132_zygisknext_linker_state=$(cat /data/adb/zygisksu/linker 2>/dev/null | tr -d '\r\n')"; else say "v132_zygisknext_linker_state=unavailable"; fi
                pass "An existing Zygisk Next loader is enabled; V132 records and optionally applies the workflow-selected linker compatibility mode"
            elif [ "$REZ_STAGED" -eq 1 ]; then
                warn "V132 staged ReZygisk but one additional reboot is required before hooks can load"
            else
                warn "No enabled Zygisk-compatible loader is active"
            fi

            if [ -r "$V132_LOADER_HEALTH" ]; then
                say "-- V132 loader health log tail --"
                tail -n 180 "$V132_LOADER_HEALTH" >>"$OUT" 2>&1 || true
                ZN_MODULES64_LINE="$(grep -E '(^|[[:space:]])modules64[:=]' "$V132_LOADER_HEALTH" 2>/dev/null | tail -n 1 || true)"
                ZN_MODULES32_LINE="$(grep -E '(^|[[:space:]])modules32[:=]' "$V132_LOADER_HEALTH" 2>/dev/null | tail -n 1 || true)"
                ZN_ISSUES_LINE="$(grep -E '(^|[[:space:]])modules_with_issue[:=]' "$V132_LOADER_HEALTH" 2>/dev/null | tail -n 1 || true)"
                ZN_LINKER_LINE="$(grep -E '(^|[[:space:]])linker[:=]' "$V132_LOADER_HEALTH" 2>/dev/null | tail -n 1 || true)"
                say "v132_zn_status_modules64=${ZN_MODULES64_LINE:-unavailable}"
                say "v132_zn_status_modules32=${ZN_MODULES32_LINE:-unavailable}"
                say "v132_zn_status_modules_with_issue=${ZN_ISSUES_LINE:-unavailable}"
                say "v132_zn_status_linker=${ZN_LINKER_LINE:-unavailable}"
            else
                say "v132_loader_health_log_readable=no"
            fi

            case "${V132_SCOPE:-}" in
                all-apps) pass "V132 all-app scope is armed for Android app-id >= 10000; target_uid is intentionally unused" ;;
                *) case "$V132_UID" in
                    ''|0) warn "V132 target UID is unresolved; single-package hook remains fail-open" ;;
                    *) pass "V132 target package UID is resolved for single-package injection" ;;
                   esac ;;
            esac
        else
            info "V132 Zygisk engine, manifest and app-scope checks require root privileges"
        fi

        if [ -r "$V132_APP_LOG" ]; then
            say "-- V132 app clock hook log tail --"
            tail -n 120 "$V132_APP_LOG" >>"$OUT" 2>&1 || true
            V132_HOOK_UID_COUNT="$(grep 'preAppSpecialize uid=' "$V132_APP_LOG" 2>/dev/null | sed -n 's/.*preAppSpecialize uid=\([0-9][0-9]*\).*/\1/p' | sort -u | wc -l | tr -cd '0-9' || true)"
            V132_HOOK_UID_COUNT="$(numeric_or_zero "$V132_HOOK_UID_COUNT")"
            say "v132_distinct_hooked_app_uids=$V132_HOOK_UID_COUNT"
            UID_PROBE_LINE="$(grep 'preAppSpecialize_probe uid=' "$V132_APP_LOG" 2>/dev/null | tail -n 1 || true)"
            ENTER_LINE="$(grep 'preAppSpecialize_enter uid=' "$V132_APP_LOG" 2>/dev/null | tail -n 1 || true)"
            OFFSET_PROBE_LINE="$(grep 'offset_probe_ns=' "$V132_APP_LOG" 2>/dev/null | tail -n 1 || true)"
            PRE_LINE="$(grep 'preAppSpecialize uid=' "$V132_APP_LOG" 2>/dev/null | tail -n 1 || true)"
            UP_LINE="$(grep 'uptimeMillis raw=' "$V132_APP_LOG" 2>/dev/null | tail -n 1 || true)"
            NANO_LINE="$(grep 'nanoTime raw=' "$V132_APP_LOG" 2>/dev/null | tail -n 1 || true)"
            POST_LINE="$(grep 'postAppSpecialize uid=' "$V132_APP_LOG" 2>/dev/null | tail -n 1 || true)"

            PRE_OFF_MS="$(printf '%s\n' "$PRE_LINE" | sed -n 's/.* offset_ms=\([0-9][0-9]*\).*/\1/p')"
            PRE_UP_HOOK="$(printf '%s\n' "$PRE_LINE" | sed -n 's/.* uptime_hook=\([01]\).*/\1/p')"
            PRE_NANO_HOOK="$(printf '%s\n' "$PRE_LINE" | sed -n 's/.* nano_hook=\([01]\).*/\1/p')"
            UP_FAKE_MS="$(printf '%s\n' "$UP_LINE" | sed -n 's/.* fake=\([0-9][0-9]*\).*/\1/p')"
            NANO_FAKE_NS="$(printf '%s\n' "$NANO_LINE" | sed -n 's/.* fake=\([0-9][0-9]*\).*/\1/p')"
            UID_SOURCE="$(printf '%s\n' "$ENTER_LINE" | sed -n 's/.* target_uid_source=\([^ ]*\).*/\1/p')"
            OFFSET_SOURCE="$(printf '%s\n' "$OFFSET_PROBE_LINE" | sed -n 's/.* source=\([^ ]*\).*/\1/p')"
            CLOCK_POLICY="$(printf '%s\n' "$PRE_LINE" | sed -n 's/.* policy=\([^ ]*\).*/\1/p')"
            FAKE_PROBE_NS="$(printf '%s\n' "$OFFSET_PROBE_LINE" | sed -n 's/.* fake_uptime_ns=\([0-9][0-9]*\).*/\1/p')"
            ORIG_UP_MS="$(printf '%s\n' "$OFFSET_PROBE_LINE" | sed -n 's/.* orig_uptime_ms=\([0-9][0-9]*\).*/\1/p')"
            MONO_PROBE_NS="$(printf '%s\n' "$OFFSET_PROBE_LINE" | sed -n 's/.* mono_ns=\([0-9][0-9]*\).*/\1/p')"
            RAW_PROBE_NS="$(printf '%s\n' "$OFFSET_PROBE_LINE" | sed -n 's/.* raw_ns=\([0-9][0-9]*\).*/\1/p')"
            BOOT_PROBE_NS="$(printf '%s\n' "$OFFSET_PROBE_LINE" | sed -n 's/.* boottime_ns=\([0-9][0-9]*\).*/\1/p')"
            POST_UP_FAKE_MS="$(printf '%s\n' "$POST_LINE" | sed -n 's/.* uptimeMillis_fake=\([0-9][0-9]*\).*/\1/p')"
            POST_UP_RAW_MS="$(printf '%s\n' "$POST_LINE" | sed -n 's/.* uptimeMillis_raw=\([0-9][0-9]*\).*/\1/p')"
            OFFSET_NS="$(printf '%s\n' "$OFFSET_PROBE_LINE" | sed -n 's/.*offset_probe_ns=\([0-9-][0-9-]*\).*/\1/p')"

            PRE_OFF_MS="$(numeric_or_zero "$PRE_OFF_MS")"
            PRE_UP_HOOK="$(numeric_or_zero "$PRE_UP_HOOK")"
            PRE_NANO_HOOK="$(numeric_or_zero "$PRE_NANO_HOOK")"
            UP_FAKE_MS="$(numeric_or_zero "$UP_FAKE_MS")"
            POST_UP_FAKE_MS="$(numeric_or_zero "$POST_UP_FAKE_MS")"
            NANO_FAKE_NS="$(numeric_or_zero "$NANO_FAKE_NS")"

            say "v132_pre_probe=${UID_PROBE_LINE:-unavailable}"
            say "v132_target_uid_source=${UID_SOURCE:-unavailable}"
            say "v132_offset_source=${OFFSET_SOURCE:-unavailable}"
            say "v132_app_clock_policy=${CLOCK_POLICY:-unavailable}"
            say "v132_probe_fake_uptime_ns=${FAKE_PROBE_NS:-unavailable}"
            say "v132_probe_orig_uptime_ms=${ORIG_UP_MS:-unavailable}"
            say "v132_probe_mono_ns=${MONO_PROBE_NS:-unavailable}"
            say "v132_probe_raw_ns=${RAW_PROBE_NS:-unavailable}"
            say "v132_probe_boottime_ns=${BOOT_PROBE_NS:-unavailable}"
            say "v132_post_uptimeMillis_raw_ms=${POST_UP_RAW_MS:-unavailable}"
            say "v132_post_uptimeMillis_fake_ms=${POST_UP_FAKE_MS:-unavailable}"
            say "v132_offset_probe_ns=${OFFSET_NS:-unavailable}"
            say "v132_java_offset_ms=$PRE_OFF_MS"
            say "v132_uptime_hook_installed=$PRE_UP_HOOK"
            say "v132_nano_hook_installed=$PRE_NANO_HOOK"
            say "v132_last_uptimeMillis_fake_ms=$UP_FAKE_MS"
            say "v132_last_nanoTime_fake_ns=$NANO_FAKE_NS"

            case "${CLOCK_POLICY:-unavailable}" in
                uptime-only)
                    [ "$PRE_UP_HOOK" -eq 1 ] || fail "V132 uptime-only policy did not install SystemClock.uptimeMillis"
                    [ "$PRE_NANO_HOOK" -eq 0 ] || fail "V132 uptime-only policy unexpectedly installed System.nanoTime; this recreates the V130 frame-time hazard"
                    ;;
                shadow)
                    [ "$PRE_UP_HOOK" -eq 0 ] || fail "V132 shadow policy unexpectedly installed uptimeMillis"
                    [ "$PRE_NANO_HOOK" -eq 0 ] || fail "V132 shadow policy unexpectedly installed nanoTime"
                    ;;
                legacy-full-canary)
                    info "legacy-full-canary intentionally reproduces the V130 nanoTime experiment; use only for controlled A/B"
                    ;;
                *)
                    [ -z "$PRE_LINE" ] || warn "V132 clock policy telemetry is missing or unknown"
                    ;;
            esac

            if [ -n "$ENTER_LINE" ]; then
                pass "V132 eligible app process reached preAppSpecialize through the Zygisk loader"
            elif [ -n "${V132_TARGET_PIDS:-}" ]; then
                if [ -n "$UID_PROBE_LINE" ]; then
                    warn "V132 module reached preAppSpecialize but target_uid could not be read; inspect module SELinux/context/target_uid evidence"
                else
                    warn "V132 target process is running but no preAppSpecialize probe/entry exists; loader discovery/injection remains the blocker; inspect Zygisk Next status modules64/modules_with_issue/linker"
                fi
            else
                info "No eligible app process telemetry is present yet; launch apps after the loader-active reboot"
            fi
            if [ "${V132_SCOPE:-}" = all-apps ]; then
                if [ "$V132_HOOK_UID_COUNT" -gt 0 ]; then
                    pass "V132 all-app policy has hook telemetry from $V132_HOOK_UID_COUNT distinct Android app UID(s)"
                else
                    warn "V132 all-app policy is configured but no hooked app UID is present in telemetry"
                fi
            fi

            if [ -n "$OFFSET_PROBE_LINE" ] && [ "${OFFSET_NS:-0}" != "0" ]; then
                pass "V132 produced a non-zero Java MONOTONIC offset probe using ${OFFSET_SOURCE:-unknown} reference"
            elif [ -n "$OFFSET_PROBE_LINE" ]; then
                warn "V132 reached offset probing but produced zero/invalid offset"
            fi

            if [ "$UP_FAKE_MS" -le 0 ] && [ "$POST_UP_FAKE_MS" -gt 0 ]; then UP_FAKE_MS="$POST_UP_FAKE_MS"; fi
            if [ "$PRE_UP_HOOK" -eq 1 ] && [ "$UP_FAKE_MS" -gt 0 ] && [ "$EXPOSED_UP_SEC" -gt 0 ]; then
                UP_FAKE_SEC=$((UP_FAKE_MS / 1000))
                UP_JAVA_DIFF=$((UP_FAKE_SEC - EXPOSED_UP_SEC)); [ "$UP_JAVA_DIFF" -ge 0 ] || UP_JAVA_DIFF=$((-UP_JAVA_DIFF))
                say "v132_uptimeMillis_abs_diff_vs_ghost_sec=$UP_JAVA_DIFF"
                if [ "$UP_JAVA_DIFF" -le 120 ]; then
                    pass "V132 app SystemClock.uptimeMillis is on the ghost uptime axis"
                else
                    warn "V132 uptimeMillis hook executed but differs from the ghost reference by ${UP_JAVA_DIFF}s"
                fi
            elif [ "$PRE_UP_HOOK" -eq 1 ]; then
                info "V132 uptimeMillis hook installed but no runtime call evidence has been captured yet"
            elif [ -n "$PRE_LINE" ]; then
                warn "V132 target process specialized but SystemClock.uptimeMillis JNI lookup did not install"
            else
                info "No V132 target-process hook evidence yet"
            fi

            if [ "$PRE_NANO_HOOK" -eq 1 ] && [ "$NANO_FAKE_NS" -gt 0 ] && [ "$EXPOSED_UP_SEC" -gt 0 ]; then
                NANO_FAKE_SEC=$((NANO_FAKE_NS / 1000000000))
                NANO_DIFF=$((NANO_FAKE_SEC - EXPOSED_UP_SEC)); [ "$NANO_DIFF" -ge 0 ] || NANO_DIFF=$((-NANO_DIFF))
                say "v132_nanoTime_abs_diff_vs_ghost_sec=$NANO_DIFF"
                if [ "$NANO_DIFF" -le 120 ]; then
                    pass "V132 target-app System.nanoTime hook executed on the ghost MONOTONIC axis"
                else
                    warn "V132 System.nanoTime hook executed but differs from the ghost reference by ${NANO_DIFF}s"
                fi
            elif [ "$PRE_NANO_HOOK" -eq 1 ]; then
                info "System.nanoTime hook installed but runtime call evidence is absent; ART intrinsic execution may bypass JNI"
            elif [ -n "$PRE_LINE" ]; then
                info "System.nanoTime hook was not installed; V132 does not patch ART globally"
            fi
        else
            say "v132_app_clock_hook_log_readable=no"
            if [ "$(id -u 2>/dev/null || echo -1)" = "0" ] && [ -n "${V132_TARGET_PIDS:-}" ]; then
                warn "V132 target process is running but app-clock telemetry is absent; inspect loader health/status before changing kernel clocks"
            else
                info "V132 app clock hook log is absent/unreadable; launch one or more apps after boot and rerun"
            fi
        fi

        if [ "$SYSINFO_UP_SEC" -gt 0 ] && [ "$EXPOSED_UP_SEC" -gt 0 ]; then
        	SYSINFO_DIFF=$((SYSINFO_UP_SEC - EXPOSED_UP_SEC))
        	[ "$SYSINFO_DIFF" -ge 0 ] || SYSINFO_DIFF=$((-SYSINFO_DIFF))
        	say "sysinfo_abs_diff_vs_exposed_reference_sec=$SYSINFO_DIFF"
        	if [ "$SYSINFO_DIFF" -le 180 ]; then
        		pass "retained V109 sysinfo uptime agrees with the exposed monotonic reference within 180 seconds"
        	else
        		warn "sysinfo uptime differs from the exposed monotonic reference by ${SYSINFO_DIFF}s; possible duplicate or missing offset"
        	fi
        else
        	info "sysinfo consistency comparison skipped because uptime output or a reference was unavailable"
        fi

        section "CPUIDLE SYSFS TIME (V108 RETAINED LAYER)"
        CPU_FOUND=0
        CPU_CHECKED=0
        CPU_WARN=0
        for cpu_dir in /sys/devices/system/cpu/cpu[0-9]*; do
        	[ -d "$cpu_dir" ] || continue
        	CPU_FOUND=$((CPU_FOUND + 1))
        	cpu_name="${cpu_dir##*/}"
        	online=1
        	if [ -r "$cpu_dir/online" ]; then
        		online="$(read_first "$cpu_dir/online" || echo 0)"
        		online="$(numeric_or_zero "$online")"
        	fi
        	say "-- $cpu_name online=$online --"
        	sum_us=0
        	states=0
        	for state_dir in "$cpu_dir"/cpuidle/state[0-9]*; do
        		[ -d "$state_dir" ] || continue
        		states=$((states + 1))
        		state_name="$(read_first "$state_dir/name" || true)"
        		state_time="$(read_first "$state_dir/time" || true)"
        		state_usage="$(read_first "$state_dir/usage" || true)"
        		state_disable="$(read_first "$state_dir/disable" || true)"
        		state_time="$(numeric_or_zero "$state_time")"
        		# Android's /system/bin/sh may use signed 32-bit arithmetic. cpuidle
        		# microseconds exceed INT_MAX quickly, so sum through awk instead.
        		sum_us="$(decimal_add "$sum_us" "$state_time")"
        		say "${state_dir##*/}: name=${state_name:-?} time_us=$state_time usage=${state_usage:-?} disable=${state_disable:-?}"
        	done
        	say "$cpu_name.cpuidle_state_count=$states"
        	say "$cpu_name.cpuidle_sum_us=$sum_us"
        	if [ "$online" -eq 1 ] && [ "$states" -gt 0 ] && [ "$EXPOSED_UP_SEC" -gt 0 ]; then
        		CPU_CHECKED=$((CPU_CHECKED + 1))
        		percent="$(awk -v a="$sum_us" -v b="$EXPOSED_UP_SEC" 'BEGIN { if (b > 0) printf "%.2f", (100 * a / (b * 1000000)); else print "0.00" }')"
        		say "$cpu_name.cpuidle_sum_percent_of_exposed_reference=$percent"
        		# Idle sum can legitimately be lower than uptime under load, but a very
        		# small value compared with a multi-day fake uptime is a strong leak.
        		if less_than_half_uptime_us "$sum_us" "$EXPOSED_UP_SEC"; then
        			CPU_WARN=$((CPU_WARN + 1))
        			warn "$cpu_name cpuidle time is below 50% of exposed uptime; likely real-boot-age leak"
        		else
        			pass "$cpu_name cpuidle time is no longer obviously shorter than exposed uptime"
        		fi
        	fi
        done
        say "cpuidle_cpu_dirs=$CPU_FOUND checked_online=$CPU_CHECKED warned=$CPU_WARN"
        if [ "$CPU_FOUND" -eq 0 ]; then
        	info "cpuidle sysfs is absent on this runtime"
        fi

        section "CPUFREQ TIME_IN_STATE (RETAINED V110)"
        TIS_FOUND=0
        TIS_CHECKED=0
        TIS_LEAK=0
        TIS_WARN=0
        audit_tis_file()
        {
        	tis="$1"
        	[ -r "$tis" ] || return 0
        	TIS_FOUND=$((TIS_FOUND + 1))
        	say "-- $tis --"
        	tis_ticks="$(awk '$2 ~ /^[0-9]+$/ { total += $2 } END { printf "%.0f\n", total + 0 }' "$tis" 2>/dev/null || echo 0)"
        	tis_ticks="$(numeric_or_zero "$tis_ticks")"
        	cat "$tis" >>"$OUT" 2>&1 || true
        	tis_seconds="$(awk -v ticks="$tis_ticks" -v hz="$HZ" 'BEGIN { if (hz > 0) printf "%.2f", ticks / hz; else print "0.00" }')"
        	tis_percent="$(awk -v ticks="$tis_ticks" -v hz="$HZ" -v up="$EXPOSED_UP_SEC" 'BEGIN { if (hz > 0 && up > 0) printf "%.2f", 100 * ticks / (hz * up); else print "0.00" }')"
        	say "sum_raw_ticks=$tis_ticks"
        	say "sum_seconds_at_CLK_TCK=$tis_seconds"
        	say "sum_percent_of_exposed_reference=$tis_percent"
        	if [ "$EXPOSED_UP_SEC" -gt 0 ]; then
        		TIS_CHECKED=$((TIS_CHECKED + 1))
        		if awk -v ticks="$tis_ticks" -v hz="$HZ" -v up="$EXPOSED_UP_SEC" \
        			'BEGIN { exit !(hz > 0 && up > 0 && ticks / hz < up / 2) }'; then
        			TIS_LEAK=1
        			TIS_WARN=$((TIS_WARN + 1))
        		fi
        	fi
        }

        # The per-CPU paths are normally symlinks to policy paths. Prefer the canonical
        # policy list so one physical counter is not reported repeatedly.
        for tis in /sys/devices/system/cpu/cpufreq/policy[0-9]*/stats/time_in_state; do
        	audit_tis_file "$tis"
        done
        if [ "$TIS_FOUND" -eq 0 ]; then
        	for tis in /sys/devices/system/cpu/cpu[0-9]*/cpufreq/stats/time_in_state; do
        		audit_tis_file "$tis"
        	done
        fi
        say "cpufreq_time_in_state_files=$TIS_FOUND checked=$TIS_CHECKED warned=$TIS_WARN"
        if [ "$TIS_FOUND" -eq 0 ]; then
        	info "no readable cpufreq time_in_state file"
        else
        	info "cpufreq time_in_state found; its tick sum is reported as seconds and percent of the exposed reference"
        	if [ "$TIS_CHECKED" -eq 0 ]; then
        		info "V110 cpufreq comparison skipped because no exposed uptime reference was available"
        	elif [ "$TIS_LEAK" -eq 1 ]; then
        		warn "retained V110 cpufreq time_in_state is below 50% of exposed uptime in ${TIS_WARN} readable path(s)"
        	else
        		pass "retained V110 cpufreq time_in_state totals are no longer obviously shorter than exposed uptime"
        	fi
        fi

        section "PROC STAT SOFTIRQ DUPLICATE (V111 TARGET)"
        if [ -r /proc/stat ]; then
        	say "-- selected /proc/stat counters --"
        	awk '$1 ~ /^(intr|ctxt|btime|processes|procs_running|procs_blocked|softirq)$/ { print }' \
        		/proc/stat >>"$OUT" 2>&1 || true
        	STAT_SOFT_TOTAL="$(awk '$1 == "softirq" { print $2; exit }' /proc/stat 2>/dev/null || echo 0)"
        	STAT_SOFT_TOTAL="$(numeric_or_zero "$STAT_SOFT_TOTAL")"
        	say "proc_stat_softirq_total=$STAT_SOFT_TOTAL"

        	if [ -r /proc/softirqs ]; then
        		# Sum every per-CPU numeric cell. This is the same underlying kernel
        		# counter family exported independently by /proc/stat.
        		PROC_SOFT_TOTAL="$(awk 'NR > 1 { for (i = 2; i <= NF; i++) if ($i ~ /^[0-9]+$/) total += $i } END { printf "%.0f\n", total + 0 }' /proc/softirqs 2>/dev/null || echo 0)"
        		PROC_SOFT_TOTAL="$(numeric_or_zero "$PROC_SOFT_TOTAL")"
        		SOFT_ABS_DIFF="$(awk -v a="$STAT_SOFT_TOTAL" -v b="$PROC_SOFT_TOTAL" 'BEGIN { d = a - b; if (d < 0) d = -d; printf "%.0f\n", d }')"
        		SOFT_DIFF_PERCENT="$(awk -v d="$SOFT_ABS_DIFF" -v b="$PROC_SOFT_TOTAL" 'BEGIN { if (b > 0) printf "%.6f", 100 * d / b; else print "0.000000" }')"
        		say "proc_softirqs_sum=$PROC_SOFT_TOTAL"
        		say "softirq_absolute_diff=$SOFT_ABS_DIFF"
        		say "softirq_diff_percent=$SOFT_DIFF_PERCENT"

        		# The files are opened one after another, so a small live-counter race is
        		# expected. Accept either <=100,000 events or <=0.1 percent difference.
        		if awk -v d="$SOFT_ABS_DIFF" -v p="$SOFT_DIFF_PERCENT" \
        			'BEGIN { exit !(d <= 100000 || p <= 0.1) }'; then
        			pass "V111 /proc/stat softirq duplicates the shifted /proc/softirqs axis within read-race tolerance"
        		else
        			warn "V111 /proc/stat softirq still disagrees with /proc/softirqs; send this report before another patch"
        		fi
        	else
        		info "/proc/softirqs is not readable, so V111 duplicate-counter comparison is unavailable"
        	fi
        else
        	info "/proc/stat is not readable for this UID"
        fi

        section "PROC STAT INTR DUPLICATE AGGREGATE (RETAINED V114)"
        if [ -r /proc/stat ] && [ -r /proc/interrupts ]; then
        	STAT_INTR_TOTAL="$(awk '$1 == "intr" { print $2; exit }' /proc/stat 2>/dev/null || echo 0)"
        	STAT_INTR_TOTAL="$(numeric_or_zero "$STAT_INTR_TOTAL")"
        	# Sum exactly the CPU columns.  V114's older audit incorrectly summed every
        	# numeric token after the IRQ label (including hardware IRQ IDs/numeric
        	# action names) and excluded IPI/arch rows whose labels are not numeric.
        	# fs/proc/stat.c includes both regular IRQ and arch IRQ statistics, so accept
        	# every colon-labelled row and stop after the CPU columns from the header.
        	PROC_IRQ_TOTAL="$(awk '
        		NR == 1 {
        			cpu_cols = 0
        			for (i = 1; i <= NF; i++)
        				if ($i ~ /^CPU[0-9]+$/)
        					cpu_cols++
        			next
        		}
        		$1 ~ /:$/ && cpu_cols > 0 {
        			for (i = 2; i <= cpu_cols + 1 && i <= NF; i++)
        				if ($i ~ /^[0-9]+$/)
        					total += $i
        		}
        		END { printf "%.0f\n", total + 0 }
        	' /proc/interrupts 2>/dev/null || echo 0)"
        	PROC_IRQ_TOTAL="$(numeric_or_zero "$PROC_IRQ_TOTAL")"
        	INTR_ABS_DIFF="$(awk -v a="$STAT_INTR_TOTAL" -v b="$PROC_IRQ_TOTAL" 'BEGIN { d = a - b; if (d < 0) d = -d; printf "%.0f\n", d }')"
        	INTR_DIFF_PERCENT="$(awk -v d="$INTR_ABS_DIFF" -v b="$PROC_IRQ_TOTAL" 'BEGIN { if (b > 0) printf "%.6f", 100 * d / b; else print "0.000000" }')"
        	say "proc_stat_intr_total=$STAT_INTR_TOTAL"
        	say "proc_interrupts_irq_cells_sum=$PROC_IRQ_TOTAL"
        	say "intr_absolute_diff=$INTR_ABS_DIFF"
        	say "intr_diff_percent=$INTR_DIFF_PERCENT"

        	# /proc/stat and /proc/interrupts are sampled sequentially.  The retained V114
        	# display layer must follow the V88 arch_timer + arch_mem_timer shift, while
        	# ordinary interrupt activity can advance between the two reads.
        	if awk -v d="$INTR_ABS_DIFF" -v p="$INTR_DIFF_PERCENT" \
        		'BEGIN { exit !(d <= 100000 || p <= 0.1) }'; then
        		pass "retained V114 /proc/stat intr mirrors the V88-shifted /proc/interrupts aggregate within read-race tolerance"
        	else
        		warn "retained V114 /proc/stat intr disagrees with the corrected /proc/interrupts CPU-cell sum"
        	fi
        else
        	info "/proc/stat or /proc/interrupts is not readable, so retained V114 intr comparison is unavailable"
        fi

        section "PROC STAT CONTEXT SWITCH READOUT (V115 RETAINED)"
        if [ -r /proc/stat ]; then
        	STAT_CTXT_TOTAL="$(awk '$1 == "ctxt" { print $2; exit }' /proc/stat 2>/dev/null || echo 0)"
        	STAT_CTXT_TOTAL="$(numeric_or_zero "$STAT_CTXT_TOTAL")"
        	say "proc_stat_ctxt_total=$STAT_CTXT_TOTAL"
        	if [ "$EXPOSED_UP_SEC" -gt 0 ] && awk -v c="$STAT_CTXT_TOTAL" 'BEGIN { exit !(c + 0 > 0) }'; then
        		CTXT_PER_SEC="$(awk -v c="$STAT_CTXT_TOTAL" -v u="$EXPOSED_UP_SEC" 'BEGIN { if (u > 0) printf "%.2f", c / u; else print "0.00" }')"
        		say "proc_stat_ctxt_per_exposed_second=$CTXT_PER_SEC"
        		# V115 adds ten times the retained V114 timer-IRQ display offset.  With
        		# eight possible CPUs and V88 rates 40+4/s, the synthetic axis is about
        		# 3520 context switches/s, close to the 3463/s measured on V114.
        		if awk -v r="$CTXT_PER_SEC" 'BEGIN { exit !(r >= 3000 && r <= 5000) }'; then
        			pass "retained V115 /proc/stat ctxt is on the expected ghost-uptime display axis"
        		else
        			warn "retained V115 /proc/stat ctxt rate is outside the expected 3000-5000/s display range"
        		fi
        	else
        		info "retained V115 ctxt comparison skipped because ctxt or exposed uptime is unavailable"
        	fi
        else
        	info "/proc/stat is not readable, so the retained V115 ctxt comparison is unavailable"
        fi

        section "PROC STAT PROCESSES READOUT (RETAINED V119.1)"
        if [ -r /proc/stat ]; then
        	STAT_PROCESSES="$(awk '$1 == "processes" { print $2; exit }' /proc/stat 2>/dev/null || echo 0)"
        	STAT_PROCESSES="$(numeric_or_zero "$STAT_PROCESSES")"
        	say "proc_stat_processes_total=$STAT_PROCESSES"
        	if [ "$EXPOSED_UP_SEC" -gt 0 ] && awk -v p="$STAT_PROCESSES" 'BEGIN { exit !(p + 0 > 0) }'; then
        		PROCESSES_PER_SEC="$(awk -v p="$STAT_PROCESSES" -v u="$EXPOSED_UP_SEC" 'BEGIN { if (u > 0) printf "%.4f", p / u; else print "0.0000" }')"
        		say "proc_stat_processes_per_exposed_second=$PROCESSES_PER_SEC"
        		# V119.1 adds one synthetic historical process for every ghost-offset
        		# second. Real total_forks is still included, so the observed rate should
        		# normally be at least ~1/s but can be somewhat higher on an active boot.
        		if awk -v r="$PROCESSES_PER_SEC" 'BEGIN { exit !(r >= 0.75 && r <= 8.0) }'; then
        			pass "V119.1 /proc/stat processes no longer exposes a tiny real-session-only history"
        		else
        			warn "V119.1 /proc/stat processes rate is outside the expected 0.75-8.0/s ghost-history range"
        		fi
        	else
        		info "V119.1 processes comparison skipped because processes or exposed uptime is unavailable"
        	fi
        else
        	info "/proc/stat is not readable, so the V119.1 processes comparison is unavailable"
        fi

        section "CLOCK DOMAIN HARDENING (RETAINED V119.1)"
        if [ -r /proc/ghost_sched_clock_probe ]; then
        	say "ghost_sched_clock_probe_readable=yes"
        	head -n 80 /proc/ghost_sched_clock_probe >>"$OUT" 2>&1 || true
        	warn "V96 debug probe is still shipped and directly exposes sched_clock/local_clock/MONOTONIC/RAW; production cleanup failed"
        else
        	say "ghost_sched_clock_probe_readable=no"
        	pass "V119.1 production image no longer exposes the V96 direct real-clock proc probe"
        fi

        section "OTHER READABLE TIME SURFACES"
        for path in \
        	/proc/pressure/cpu /proc/pressure/io /proc/pressure/memory \
        	/sys/power/suspend_stats \
        	/sys/kernel/debug/suspend_stats \
        	/sys/kernel/debug/wakeup_sources \
        	/sys/kernel/wakeup_reasons/last_suspend_time \
        	/sys/kernel/wakeup_reasons/last_resume_reason \
        	/proc/timer_list /proc/softirqs /proc/interrupts; do
        	say "-- $path --"
        	if [ -d "$path" ]; then
        		say "readable_directory=yes"
        		child_found=0
        		for child in "$path"/*; do
        			[ -f "$child" ] || continue
        			child_found=1
        			say "-- child ${child##*/} --"
        			head -n 80 "$child" >>"$OUT" 2>&1 || true
        		done
        		[ "$child_found" -eq 1 ] || say "directory has no readable regular child files"
        	elif [ -r "$path" ]; then
        		say "readable=yes"
        		head -n 80 "$path" >>"$OUT" 2>&1 || true
        	else
        		say "readable=no"
        	fi
        done

        section "BOOT AND SERVICE PROPERTIES"
        if command -v getprop >/dev/null 2>&1; then
        	getprop 2>/dev/null | grep -E '\[(ro\.boottime\.|ro\.runtime\.firstboot|sys\.boot_completed|init\.svc\.)' | head -n 250 >>"$OUT" 2>&1 || true
        else
        	info "getprop unavailable"
        fi
        if command -v settings >/dev/null 2>&1; then
        	say "global.boot_count=$(settings get global boot_count 2>/dev/null || true)"
        fi

        section "DUMPSYS / FRAMEWORK CLOCK EVIDENCE (V132)"
        if command -v dumpsys >/dev/null 2>&1; then
        	ALARM_RUNTIME="$(dumpsys alarm 2>/dev/null | sed -n 's/^[[:space:]]*Runtime uptime (elapsed):[[:space:]]*//p' | head -n 1 || true)"
        	say "alarm_runtime_uptime_elapsed=${ALARM_RUNTIME:-unavailable}"
        	for service in alarm power batterystats activity; do
        		say "-- dumpsys $service --"
        		dumpsys "$service" 2>/dev/null | \
        			grep -iE 'uptime|elapsed|realtime|start clock|time since|last wake|last sleep|boot' | \
        			head -n 180 >>"$OUT" 2>&1 || say "unavailable or no matching lines"
        	done
        	if [ -n "$ALARM_RUNTIME" ] && [ "$EXPOSED_UP_SEC" -gt 86400 ]; then
        		info "framework service Runtime uptime remains session-relative by design; V132 keeps system_server untouched because global MONOTONIC mutation already failed in V118"
        	else
        		info "dumpsys framework duration evidence needs manual review"
        	fi
        else
        	info "dumpsys unavailable for this UID"
        fi

        section "LOGCAT MONOTONIC EVIDENCE (V132)"
        if command -v logcat >/dev/null 2>&1; then
            LOGCAT_TMP="${OUT}.logcat.$$"
            rm -f "$LOGCAT_TMP" 2>/dev/null || true
            logcat -v monotonic -d -t 40 >"$LOGCAT_TMP" 2>&1 &
            LOGCAT_PID=$!
            LOGCAT_TIMEOUT=0
            i=0
            while kill -0 "$LOGCAT_PID" 2>/dev/null; do
                i=$((i + 1))
                if [ "$i" -ge 6 ]; then
                    LOGCAT_TIMEOUT=1
                    kill -TERM "$LOGCAT_PID" 2>/dev/null || true
                    sleep 1
                    kill -KILL "$LOGCAT_PID" 2>/dev/null || true
                    break
                fi
                sleep 1
            done
            wait "$LOGCAT_PID" 2>/dev/null || true

            LOGCAT_MONO="$(head -n 80 "$LOGCAT_TMP" 2>/dev/null || true)"
            rm -f "$LOGCAT_TMP" 2>/dev/null || true
            printf '%s\n' "$LOGCAT_MONO" >>"$OUT"

            V132_FRAME_BREAK="$(printf '%s\n' "$LOGCAT_MONO" | grep -E 'Choreographer: Skipped [0-9]{6,} frames|PerfMonitor.*latency=[0-9]{7,}ms' | tail -n 20 || true)"
            if [ -n "$V132_FRAME_BREAK" ]; then
                say "v132_clock_coherence_frame_break=yes"
                printf '%s\n' "$V132_FRAME_BREAK" >>"$OUT"
                fail "target/runtime log contains extreme frame-time skew consistent with a mixed Java-vsync clock domain"
            else
                say "v132_clock_coherence_frame_break=no"
            fi

            if [ "$LOGCAT_TIMEOUT" -eq 1 ]; then
                warn "V132 logcat -v monotonic exceeded the 6-second watchdog; wrapper recursion or a blocked real binary is still present"
            fi

            LOGCAT_MONO_LAST="$(printf '%s\n' "$LOGCAT_MONO" | awk '
                /^[[:space:]]*[0-9]+\.[0-9]+[[:space:]]/ {
                    x=$1
                    sub(/\..*/, "", x)
                    if (x ~ /^[0-9]+$/) last=x
                }
                END { if (last != "") print last }
            ')"
            LOGCAT_MONO_LAST="$(numeric_or_zero "$LOGCAT_MONO_LAST")"
            LOGCAT_REF_SEC="$SELF_START_SEC"
            LOGCAT_REF_SOURCE="/proc/self/stat starttime"
            if [ "$LOGCAT_REF_SEC" -le 0 ]; then
                LOGCAT_REF_SEC="$EXPOSED_UP_SEC"
                LOGCAT_REF_SOURCE="$EXPOSED_UP_SOURCE"
            fi
            say "logcat_monotonic_reference_source=$LOGCAT_REF_SOURCE"
            say "logcat_monotonic_reference_seconds=$LOGCAT_REF_SEC"
            say "logcat_monotonic_last_seconds=$LOGCAT_MONO_LAST"
            say "logcat_monotonic_watchdog_timeout=$LOGCAT_TIMEOUT"
            if [ "$LOGCAT_MONO_LAST" -gt 0 ] && [ "$LOGCAT_REF_SEC" -gt 0 ]; then
                LOGCAT_DIFF=$((LOGCAT_REF_SEC - LOGCAT_MONO_LAST))
                [ "$LOGCAT_DIFF" -ge 0 ] || LOGCAT_DIFF=$((-LOGCAT_DIFF))
                say "logcat_monotonic_abs_diff_vs_fake_monotonic_reference_sec=$LOGCAT_DIFF"
                if [ "$LOGCAT_TIMEOUT" -eq 0 ] && [ "$LOGCAT_DIFF" -le 120 ]; then
                    pass "V132 logcat -v monotonic is aligned with the fake MONOTONIC process-start reference without hanging"
                elif [ "$LOGCAT_REF_SEC" -gt 86400 ] && awk -v logt="$LOGCAT_MONO_LAST" -v fake="$LOGCAT_REF_SEC" 'BEGIN { exit !(logt > 0 && logt < fake / 4) }'; then
                    warn "V132 logcat wrapper is not active or failed open: logcat still exposes the short real-session MONOTONIC axis"
                else
                    warn "logcat -v monotonic differs from the fake MONOTONIC reference by ${LOGCAT_DIFF}s"
                fi
            elif [ "$LOGCAT_TIMEOUT" -eq 0 ]; then
                info "logcat monotonic timestamp was unavailable or unparsable for this UID"
            fi
        else
            info "logcat unavailable for this UID"
        fi

        section "KERNEL LOG ACCESS"
        if dmesg >/dev/null 2>&1; then
        	say "dmesg_readable=yes"
        	dmesg 2>/dev/null | head -n 20 >>"$OUT" || true
        	SUSPEND_ERRORS="$(dmesg 2>/dev/null | grep -iE 'alarmtimer|failed to suspend|Some devices failed to suspend|error -16' | tail -n 40 || true)"
        	if [ -n "$SUSPEND_ERRORS" ]; then
        		say "suspend_error_evidence=yes"
        		printf '%s\n' "$SUSPEND_ERRORS" >>"$OUT"
        		warn "kernel log contains suspend/alarmtimer failure evidence; investigate before relying on deep sleep"
        	else
        		say "suspend_error_evidence=no"
        	fi
        else
        	say "dmesg_readable=no"
        fi
        if [ -r /dev/kmsg ]; then
        	say "/dev/kmsg_readable=yes (not consumed by this audit)"
        else
        	say "/dev/kmsg_readable=no"
        fi

        section "SUMMARY"
        say "passes=$PASS_COUNT"
        say "failures=$FAIL_COUNT"
        say "warnings=$WARN_COUNT"
        say "information=$INFO_COUNT"
        say "current_v132_target=coherence-first all-app uptime sync; companion snapshot remains authoritative, offset is derived from native MONOTONIC/RAW before Java mutation, app-id >= 10000 processes hook uptimeMillis only, nanoTime remains real, and severe mixed-domain frame skew is a hard audit failure"
        say "retained_v119_1_processes_target=/proc/stat processes receives one readout-only synthetic historical event per ghost-offset second; real total_forks accounting is unchanged"
        say "retained_v115_target=/proc/stat ctxt receives ten times the retained V114 timer-IRQ synthetic display offset"
        say "retained_v114_target=/proc/stat intr aggregate duplicates the V88-shifted /proc/interrupts display counters at readout"
        say "retained_v111_target=/proc/stat softirq duplicates the already-shifted /proc/softirqs counters at readout"
        say "retained_v110_target=cpufreq time_in_state sysfs totals receive one readout-only ghost offset"
        say "retained_v109_target=sysinfo uptime consumes the already-shifted BOOTTIME value exactly once"
        say "retained_v108_target=cpuidle state time remains shifted at readout"
        say "timer_list_finding=/proc/timer_list is already on the fake uptime axis from retained V61"
        say "clock_probe_finding=V96 /proc/ghost_sched_clock_probe must be absent from the production build because it directly exposed real MONOTONIC/RAW"
        say "v132_firstboot_target=retained KernelSU post-fs-data guard aligns ro.runtime.firstboot with the ghost uptime reference; boot-completed refresh corrects later wall-clock drift"
        say "v132_logcat_target=retained V123 recursion-proof display-only logcat wrapper remains unchanged and fail-open"
        say "v132_app_clock_target=all Android app specializations with app-id >= 10000 are eligible by default; V132 receives fake /proc/uptime from its root companion, derives offset from native MONOTONIC with RAW fallback, and hooks uptimeMillis without any system_server/global clock patch"
        say "remaining_limitation=V132 intentionally leaves direct native clock_gettime(CLOCK_MONOTONIC/RAW), System.nanoTime, core UID processes, SurfaceFlinger/vsync timestamps and framework durations unchanged; those domains cannot be shifted safely by this kernel without deadline translation"
        say "psi_note=/proc/pressure total values are workload stall accumulators, not direct uptime counters; retained V119.1 intentionally does not synthesize them"
        say "important=Run from adb shell when possible. An untrusted app UID may be denied /proc/uptime, /proc/stat and dumpsys, while Java/native clock APIs can still differ from shell-readable proc surfaces."
        say "important=This shell audit cannot directly invoke Java SystemClock APIs; dumpsys is only an indirect framework cross-check."

        printf 'DONE: %s\n' "$OUT"
        printf 'Summary: PASS=%s FAIL=%s WARN=%s INFO=%s\n' "$PASS_COUNT" "$FAIL_COUNT" "$WARN_COUNT" "$INFO_COUNT"

        [ "$FAIL_COUNT" -eq 0 ] || exit 2
        exit 0
        EOF_V132_AUDIT_DIRECT
        chmod 0755 "$TOOLS/V132-check-ghost-uptime-noroot.sh"
        sh -n "$TOOLS/V132-check-ghost-uptime-noroot.sh" 2>&1 | tee -a setup.log
        sha256sum "$TOOLS/V132-check-ghost-uptime-noroot.sh" | tee -a setup.log
        echo "===== V132 RUNTIME AUDIT WRITE COMPLETE =====" | tee -a setup.log

        cat >"$TOOLS/V132-README-TOOLS.txt" <<'EOF_V126_README'
        V132 tools

        V132 coherence-first all-app ghost uptime sync:
        1. Flash the V132 AnyKernel3 ZIP. It stages /data/adb/modules/v132_ghost_guard when /data/adb is writable; otherwise install the bundled KSU ZIP manually after boot.
        2. Reboot once. V123 firstboot + recursion-proof logcat guards remain active without extra dependencies.
        3. V132 tries the official stable ReZygisk v1.0.0 asset first, then the IzzySoft mirror. The embedded module must report version v1.0.0 (515-333d423-release). If both external sources are unavailable, the kernel/AnyKernel build still completes and the package clock guard remains fail-open until a compatible loader is installed manually.
        4. If the reboot-required marker exists after the first V132 boot, reboot once more so ReZygisk can load the V132 Zygisk SO. Existing enabled loaders are respected; V132 never installs a second loader.
        5. Default app_scope=all-apps hooks uptimeMillis for every Zygote app process whose Android app-id is >= 10000; system_server and core UIDs remain untouched. single-package retains the V131 canary path.
        6. Open several apps after the loader-active boot, then run the root audit and inspect distinct hooked UIDs in /data/local/tmp/V132-app-clock-hook.log.
        7. If /data/adb was unavailable while flashing, install ksu-modules/V132-ghost-app-clock-autoloader-KSU.zip manually in KernelSU Manager and reboot.

        Expected root evidence when the guard loads:
        - app_scope=all-apps; target_uid is intentionally absent. In single-package mode it is resolved from /data/system/packages.list.
        - preAppSpecialize logs policy=...; default uptime-only must report uptime_hook=1 and nano_hook=0.
        - distinct_hooked_app_uids increases as apps are launched.
        - companion fake uptime, native MONOTONIC/RAW probes and selected policy are recorded; extreme frame-time skew is a hard FAIL.
        - logcat -v monotonic remains within about 120 seconds of the ghost axis with watchdog_timeout=0.

        V132 does NOT modify kernel vDSO, ktime_get, scheduler, hrtimer, futex, alarm deadlines, system_server, or SurfaceFlinger clocks. The default uptime-only policy deliberately leaves System.nanoTime real; legacy-full-canary is diagnostic only.

        Runtime audit:
        1. adb push V132-check-ghost-uptime-noroot.sh /data/local/tmp/
        2. adb shell chmod 755 /data/local/tmp/V132-check-ghost-uptime-noroot.sh
        3. adb shell su -c /data/local/tmp/V132-check-ghost-uptime-noroot.sh
        4. adb shell /data/local/tmp/V132-check-ghost-uptime-noroot.sh
        5. Pull the DONE paths printed by each run.

        Bootloop collector in TWRP/OrangeFox:
        1. Copy V132-collect-in-twrp.sh to /sdcard.
        2. Open Recovery > Advanced > Terminal.
        3. Run: sh /sdcard/V132-collect-in-twrp.sh
        4. Send the resulting V132-bootloop-logs-*.tar.gz file.

        Both audit/collector scripts are read-only. The TWRP script reads /dev/block/sda15 only when /proc/cmdline contains the exact block2mtd mapping observed in V103.
        EOF_V126_README


        echo "===== V132 DIAGNOSTICS STRUCTURE SELF-CHECK =====" | tee -a setup.log
        grep -q 'VERSION="V132"' "$TOOLS/V132-check-ghost-uptime-noroot.sh"
        grep -q 'v132_ghost_guard' "$TOOLS/V132-check-ghost-uptime-noroot.sh"
        grep -q 'v132_pre_probe=' "$TOOLS/V132-check-ghost-uptime-noroot.sh"
        grep -q 'ZYGISK-ELF-MANIFEST.txt' "$TOOLS/V132-check-ghost-uptime-noroot.sh"
        test -s "$TOOLS/V132-check-ghost-uptime-noroot.sh"
        sh -n "$TOOLS/V132-check-ghost-uptime-noroot.sh"
        if grep -Eq '^[A-Za-z0-9+/]{60,}={0,2}$' "$TOOLS/V132-check-ghost-uptime-noroot.sh"; then
          echo "ERROR: audit output still contains standalone base64 payload lines" | tee -a setup.log
          exit 1
        fi
        echo "V132 diagnostics structure self-check PASS" | tee -a setup.log

        echo "===== V132 DIAGNOSTICS STEP COMPLETE =====" | tee -a setup.log
    - name: Build V132 all-app KernelSU uptime sync guard
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "ERROR: V132 app-clock build rc=$rc line=$LINENO command=$BASH_COMMAND" | tee -a setup.log; exit $rc' ERR
        echo "===== V132 APP CLOCK MODULE BUILD START =====" | tee -a setup.log
        MODDIR="V132-ghost-app-clock-guard-module"
        MODZIP="V132-ghost-app-clock-guard-KSU.zip"
        rm -rf "$MODDIR" "$MODZIP"
        mkdir -p "$MODDIR/bin" "$MODDIR/zygisk" "$MODDIR/src" "$MODDIR/deps" "$MODDIR/linkstub/arm64-v8a" "$MODDIR/linkstub/armeabi-v7a"
        : >"$MODDIR/skip_mount"

        cat >"$MODDIR/module.prop" <<'EOF_V132_MODULE_PROP'
        id=v132_ghost_guard
        name=V132 Ghost Uptime Coherence-First App Clock Guard
        version=V132
        versionCode=1320
        author=khiconjk
        description=V132 all-app ghost uptime sync: hooks only SystemClock.uptimeMillis in Android app processes with app-id >= 10000, retains native MONOTONIC/nanoTime, and leaves system_server/core UIDs untouched.
        EOF_V132_MODULE_PROP

        printf '%s
        ' "$TARGET_PACKAGE" >"$MODDIR/target_package"
        printf '%s\n' "$APP_SCOPE" >"$MODDIR/app_scope"
        printf '%s
        ' "$KERNEL_LOCALVERSION" >"$MODDIR/kernel_localversion_expected"
        printf '%s\n' "$ZYGISKNEXT_LINKER_MODE" >"$MODDIR/zygisknext_linker_mode"
        printf '%s\n' "$APP_CLOCK_POLICY" >"$MODDIR/app_clock_policy"

        cat >"$MODDIR/customize.sh" <<'EOF_V132_CUSTOMIZE'
        #!/system/bin/sh
        # V132 install-time migration: keep exactly one active ghost guard generation.
        ui_print "- V132: removing stale ghost-uptime guard generations"
        for old in \
          v120_firstboot_guard v1201_firstboot_guard v121_firstboot_guard \
          v122_ghost_guard v123_ghost_guard v124_ghost_guard \
          v125_ghost_guard v1251_ghost_guard v126_ghost_guard v1261_ghost_guard \
          v127_ghost_guard v1273_ghost_guard v128_ghost_guard v129_ghost_guard \
          v130_ghost_guard v131_ghost_guard; do
          rm -rf "/data/adb/modules/$old" "/data/adb/modules_update/$old" 2>/dev/null || true
        done
        ui_print "- V132: stale ghost guards cleaned; reboot after install"
        EOF_V132_CUSTOMIZE

        cat >"$MODDIR/post-fs-data.sh" <<'EOF_V132_POSTFS'
        #!/system/bin/sh
        # V132: firstboot guard + recursion-proof preservation of the genuine logcat.
        # KernelSU runs this stage before module mounts. Never use setprop here.
        MODDIR=${0%/*}
        LOG=/data/local/tmp/V132-ghost-guard.log
        REAL_RUNTIME=/dev/.v132-logcat-real
        WRAP_SOURCE="$MODDIR/bin/logcat-wrapper"

        logmsg()
        {
            printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)" "$*" >>"$LOG" 2>/dev/null || true
        }

        apply_v132_zygisknext_linker_mode()
        {
            mode="$(head -n 1 "$MODDIR/zygisknext_linker_mode" 2>/dev/null | tr -d '\r\n' || true)"
            case "$mode" in
                keep|'')
                    logmsg "post-fs-data Zygisk Next linker mode=keep; no global loader change"
                    return 0
                    ;;
                system|builtin) ;;
                *)
                    logmsg "post-fs-data invalid Zygisk Next linker mode=$mode; keeping current setting"
                    return 0
                    ;;
            esac
            ZN=/data/adb/modules/zygisksu/bin/zygiskd
            if [ ! -x "$ZN" ]; then
                logmsg "post-fs-data Zygisk Next CLI unavailable; requested linker=$mode will retry at service stage"
                return 0
            fi
            if command -v timeout >/dev/null 2>&1; then
                timeout 5 "$ZN" linker "$mode" >>"$LOG" 2>&1
                rc=$?
            else
                "$ZN" linker "$mode" >>"$LOG" 2>&1
                rc=$?
            fi
            logmsg "post-fs-data Zygisk Next linker apply requested=$mode rc=$rc"
            return 0
        }

        apply_v132_zygisknext_linker_mode

        apply_firstboot_guard()
        {
            phase="$1"
            up_raw=""
            if [ -r /proc/uptime ]; then
                read up_raw _rest </proc/uptime 2>/dev/null || up_raw=""
            fi
            up_sec="${up_raw%%.*}"
            now_sec="$(date +%s 2>/dev/null || true)"

            case "$up_sec" in
                ''|*[!0-9]*) logmsg "$phase invalid ghost uptime: ${up_raw:-unavailable}"; return 0 ;;
            esac
            case "$now_sec" in
                ''|*[!0-9]*) logmsg "$phase invalid wall clock: ${now_sec:-unavailable}"; return 0 ;;
            esac
            [ "$up_sec" -gt 0 ] || { logmsg "$phase ghost uptime is zero"; return 0; }
            [ "$now_sec" -gt "$up_sec" ] || { logmsg "$phase wall clock not usable yet"; return 0; }

            fake_boot_ms=$(( (now_sec - up_sec) * 1000 ))
            old="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
            if command -v resetprop >/dev/null 2>&1; then
                resetprop -n ro.runtime.firstboot "$fake_boot_ms" >/dev/null 2>&1 || {
                    logmsg "$phase resetprop failed; old=$old target=$fake_boot_ms"
                    return 0
                }
                new="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
                logmsg "$phase ghost_uptime_sec=$up_sec wall_epoch_sec=$now_sec old=$old target=$fake_boot_ms new=$new"
            else
                logmsg "$phase resetprop unavailable; old=$old target=$fake_boot_ms"
            fi
        }

        file_size()
        {
            wc -c <"$1" 2>/dev/null | tr -cd '0-9'
        }

        file_hash()
        {
            if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$1" 2>/dev/null | awk '{print $1}'
            else
                cksum "$1" 2>/dev/null | awk '{print $1 ":" $2}'
            fi
        }

        apply_firstboot_guard post-fs-data

        resolve_v132_target_uid()
        {
            scope="$(head -n 1 "$MODDIR/app_scope" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$scope" = all-apps ]; then
                rm -f "$MODDIR/target_uid" >/dev/null 2>&1 || true
                chmod 0644 "$MODDIR/app_scope" 2>/dev/null || true
                if command -v chcon >/dev/null 2>&1; then
                    chcon u:object_r:system_file:s0 "$MODDIR/app_scope" >/dev/null 2>&1 || true
                    chcon -R u:object_r:system_file:s0 "$MODDIR/zygisk" >/dev/null 2>&1 || true
                fi
                logmsg "post-fs-data app_scope=all-apps; app-id >= 10000 uptimeMillis sync armed"
                return 0
            fi
            pkg="$(head -n 1 "$MODDIR/target_package" 2>/dev/null | tr -d '\r\n' || true)"
            case "$pkg" in
                ''|*[!A-Za-z0-9._-]*)
                    rm -f "$MODDIR/target_uid" >/dev/null 2>&1 || true
                    logmsg "post-fs-data target package is invalid: ${pkg:-unavailable}"
                    return 0
                    ;;
            esac

            uid=""
            if [ -r /data/system/packages.list ]; then
                uid="$(awk -v p="$pkg" '$1==p {print $2; exit}' /data/system/packages.list 2>/dev/null || true)"
            fi
            case "$uid" in
                ''|*[!0-9]*)
                    rm -f "$MODDIR/target_uid" >/dev/null 2>&1 || true
                    logmsg "post-fs-data target_uid unresolved package=$pkg; Java canary stays fail-open"
                    return 0
                    ;;
            esac

            printf '%s\n' "$uid" >"$MODDIR/target_uid" 2>/dev/null || {
                logmsg "post-fs-data cannot write target_uid package=$pkg uid=$uid"
                return 0
            }
            chmod 0644 "$MODDIR/target_uid" "$MODDIR/target_package" 2>/dev/null || true
            if command -v chcon >/dev/null 2>&1; then
                chcon u:object_r:system_file:s0 "$MODDIR/target_uid" "$MODDIR/target_package" >/dev/null 2>&1 || true
                chcon -R u:object_r:system_file:s0 "$MODDIR/zygisk" >/dev/null 2>&1 || true
            fi
            logmsg "post-fs-data target_package=$pkg target_uid=$uid Java clock canary armed"
        }

        resolve_v132_target_uid

        # Clean only V122/V132 runtime remnants. They live on tmpfs and are recreated each boot.
        umount /system/bin/logcat >/dev/null 2>&1 || true
        rm -f /dev/.v122-logcat-real /dev/.v122-logcat-wrapper "$REAL_RUNTIME" >/dev/null 2>&1 || true

        if [ ! -x /system/bin/logcat ]; then
            logmsg "post-fs-data ERROR: /system/bin/logcat is missing or not executable"
            exit 0
        fi

        # V122 used a file bind-mount as the preserved "real" executable. Runtime evidence
        # showed that path could resolve to the wrapper itself (same 2477-byte file), causing
        # recursion. V132 makes a byte-for-byte copy before module mounts and validates it.
        if ! cp -f /system/bin/logcat "$REAL_RUNTIME" >/dev/null 2>&1; then
            logmsg "post-fs-data ERROR: cannot copy genuine logcat to $REAL_RUNTIME"
            exit 0
        fi
        chmod 0755 "$REAL_RUNTIME" 2>/dev/null || true
        chown 0:0 "$REAL_RUNTIME" 2>/dev/null || true
        if command -v chcon >/dev/null 2>&1; then
            chcon u:object_r:system_file:s0 "$REAL_RUNTIME" >/dev/null 2>&1 || true
        fi

        real_size="$(file_size "$REAL_RUNTIME")"
        wrap_size="$(file_size "$WRAP_SOURCE")"
        real_hash="$(file_hash "$REAL_RUNTIME")"
        wrap_hash="$(file_hash "$WRAP_SOURCE")"
        case "$real_size" in ''|*[!0-9]*) real_size=0 ;; esac
        case "$wrap_size" in ''|*[!0-9]*) wrap_size=0 ;; esac

        if [ "$real_size" -le 8192 ]; then
            logmsg "post-fs-data ERROR: copied logcat is implausibly small (${real_size} bytes); wrapper will remain disabled"
            rm -f "$REAL_RUNTIME" >/dev/null 2>&1 || true
            exit 0
        fi
        if [ -n "$real_hash" ] && [ -n "$wrap_hash" ] && [ "$real_hash" = "$wrap_hash" ]; then
            logmsg "post-fs-data ERROR: copied logcat hash equals wrapper hash; recursion prevented"
            rm -f "$REAL_RUNTIME" >/dev/null 2>&1 || true
            exit 0
        fi

        # A copied binary on /dev must actually be executable before V132 is allowed to
        # cover the system path. Failure is safe: post-mount simply leaves stock logcat.
        if ! "$REAL_RUNTIME" -h >/dev/null 2>&1; then
            logmsg "post-fs-data ERROR: copied logcat cannot execute from /dev; wrapper will remain disabled"
            rm -f "$REAL_RUNTIME" >/dev/null 2>&1 || true
            exit 0
        fi

        logmsg "post-fs-data preserved genuine logcat copy size=$real_size hash=$real_hash path=$REAL_RUNTIME"
        exit 0
        EOF_V132_POSTFS

        cat >"$MODDIR/post-mount.sh" <<'EOF_V132_POSTMOUNT'
        #!/system/bin/sh
        # V132: bind the validated wrapper only after proving the preserved real logcat
        # is a distinct executable. Any failure leaves stock /system/bin/logcat untouched.
        MODDIR=${0%/*}
        LOG=/data/local/tmp/V132-ghost-guard.log
        WRAP_SOURCE="$MODDIR/bin/logcat-wrapper"
        WRAP_RUNTIME=/dev/.v132-logcat-wrapper
        REAL_RUNTIME=/dev/.v132-logcat-real
        TARGET=/system/bin/logcat

        logmsg()
        {
            printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)" "$*" >>"$LOG" 2>/dev/null || true
        }

        file_size()
        {
            wc -c <"$1" 2>/dev/null | tr -cd '0-9'
        }

        file_hash()
        {
            if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$1" 2>/dev/null | awk '{print $1}'
            else
                cksum "$1" 2>/dev/null | awk '{print $1 ":" $2}'
            fi
        }

        [ -x "$REAL_RUNTIME" ] || {
            logmsg "post-mount SAFE-SKIP: validated real logcat is unavailable"
            exit 0
        }
        [ -f "$WRAP_SOURCE" ] || {
            logmsg "post-mount SAFE-SKIP: wrapper source is missing"
            exit 0
        }

        real_size="$(file_size "$REAL_RUNTIME")"
        wrap_size="$(file_size "$WRAP_SOURCE")"
        real_hash="$(file_hash "$REAL_RUNTIME")"
        wrap_hash="$(file_hash "$WRAP_SOURCE")"
        case "$real_size" in ''|*[!0-9]*) real_size=0 ;; esac
        case "$wrap_size" in ''|*[!0-9]*) wrap_size=0 ;; esac

        if [ "$real_size" -le 8192 ] || [ "$real_size" -eq "$wrap_size" ]; then
            logmsg "post-mount SAFE-SKIP: real_size=$real_size wrap_size=$wrap_size; recursion guard tripped"
            exit 0
        fi
        if [ -n "$real_hash" ] && [ -n "$wrap_hash" ] && [ "$real_hash" = "$wrap_hash" ]; then
            logmsg "post-mount SAFE-SKIP: real logcat and wrapper hashes are identical"
            exit 0
        fi
        if ! "$REAL_RUNTIME" -h >/dev/null 2>&1; then
            logmsg "post-mount SAFE-SKIP: preserved real logcat no longer executes"
            exit 0
        fi

        rm -f "$WRAP_RUNTIME" >/dev/null 2>&1 || true
        if ! cp -f "$WRAP_SOURCE" "$WRAP_RUNTIME" >/dev/null 2>&1; then
            logmsg "post-mount SAFE-SKIP: cannot stage wrapper"
            exit 0
        fi
        chmod 0755 "$WRAP_RUNTIME" 2>/dev/null || true
        chown 0:0 "$WRAP_RUNTIME" 2>/dev/null || true
        if command -v chcon >/dev/null 2>&1; then
            if ! chcon u:object_r:system_file:s0 "$WRAP_RUNTIME" >/dev/null 2>&1; then
                logmsg "post-mount SAFE-SKIP: chcon system_file failed"
                rm -f "$WRAP_RUNTIME" >/dev/null 2>&1 || true
                exit 0
            fi
        fi

        ctx="$(ls -Z "$WRAP_RUNTIME" 2>/dev/null || true)"
        case "$ctx" in
            *u:object_r:system_file:s0*) ;;
            *)
                logmsg "post-mount SAFE-SKIP: wrapper lacks system_file label: $ctx"
                rm -f "$WRAP_RUNTIME" >/dev/null 2>&1 || true
                exit 0
                ;;
        esac

        if ! mount --bind "$WRAP_RUNTIME" "$TARGET" >/dev/null 2>&1; then
            logmsg "post-mount SAFE-SKIP: bind wrapper over $TARGET failed"
            exit 0
        fi

        target_hash="$(file_hash "$TARGET")"
        real_hash_after="$(file_hash "$REAL_RUNTIME")"
        if [ -z "$target_hash" ] || [ -z "$wrap_hash" ] || [ "$target_hash" != "$wrap_hash" ] ||
           [ -z "$real_hash_after" ] || [ "$real_hash_after" != "$real_hash" ]; then
            umount "$TARGET" >/dev/null 2>&1 || true
            logmsg "post-mount ERROR: post-bind integrity check failed; stock logcat restored"
            exit 0
        fi

        logmsg "post-mount V132 wrapper active real_size=$real_size wrap_size=$wrap_size real_hash=$real_hash wrapper_hash=$wrap_hash"
        exit 0
        EOF_V132_POSTMOUNT

        cat >"$MODDIR/boot-completed.sh" <<'EOF_V132_BOOTCOMPLETED'
        #!/system/bin/sh
        # V132: refresh firstboot after RTC/NITZ/NTP has stabilized and record wrapper integrity.
        LOG=/data/local/tmp/V132-ghost-guard.log
        REAL_RUNTIME=/dev/.v132-logcat-real
        WRAP_RUNTIME=/dev/.v132-logcat-wrapper
        TARGET=/system/bin/logcat

        logmsg()
        {
            printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)" "$*" >>"$LOG" 2>/dev/null || true
        }

        up_raw=""
        if [ -r /proc/uptime ]; then
            read up_raw _rest </proc/uptime 2>/dev/null || up_raw=""
        fi
        up_sec="${up_raw%%.*}"
        now_sec="$(date +%s 2>/dev/null || true)"
        case "$up_sec" in ''|*[!0-9]*) up_sec=0 ;; esac
        case "$now_sec" in ''|*[!0-9]*) now_sec=0 ;; esac

        if [ "$up_sec" -gt 0 ] && [ "$now_sec" -gt "$up_sec" ] && command -v resetprop >/dev/null 2>&1; then
            fake_boot_ms=$(( (now_sec - up_sec) * 1000 ))
            old="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
            resetprop -n ro.runtime.firstboot "$fake_boot_ms" >/dev/null 2>&1 || true
            new="$(getprop ro.runtime.firstboot 2>/dev/null || true)"
            logmsg "boot-completed ghost_uptime_sec=$up_sec wall_epoch_sec=$now_sec old=$old target=$fake_boot_ms new=$new"
        fi

        real_size="$(wc -c <"$REAL_RUNTIME" 2>/dev/null | tr -cd '0-9')"
        wrap_size="$(wc -c <"$WRAP_RUNTIME" 2>/dev/null | tr -cd '0-9')"
        target_size="$(wc -c <"$TARGET" 2>/dev/null | tr -cd '0-9')"
        logmsg "boot-completed logcat_integrity real_size=${real_size:-0} wrapper_size=${wrap_size:-0} target_size=${target_size:-0}"

        MODDIR=${0%/*}
        scope="$(head -n 1 "$MODDIR/app_scope" 2>/dev/null | tr -d '\r\n' || true)"
        pkg="$(head -n 1 "$MODDIR/target_package" 2>/dev/null | tr -d '\r\n' || true)"
        uid=""
        case "$scope" in
            all-apps)
                rm -f "$MODDIR/target_uid" >/dev/null 2>&1 || true
                chmod 0644 "$MODDIR/app_scope" 2>/dev/null || true
                if command -v chcon >/dev/null 2>&1; then
                    chcon u:object_r:system_file:s0 "$MODDIR/app_scope" >/dev/null 2>&1 || true
                    chcon -R u:object_r:system_file:s0 "$MODDIR/zygisk" >/dev/null 2>&1 || true
                fi
                logmsg "boot-completed app_scope=all-apps; app-id >= 10000 uptimeMillis sync armed"
                ;;
            *) case "$pkg" in
            ''|*[!A-Za-z0-9._-]*) ;;
            *)
                if [ -r /data/system/packages.list ]; then
                    uid="$(awk -v p="$pkg" '$1==p {print $2; exit}' /data/system/packages.list 2>/dev/null || true)"
                fi
                ;;
            esac
            case "$uid" in
            ''|*[!0-9]*)
                logmsg "boot-completed target_uid unresolved package=${pkg:-unavailable}; Java canary remains fail-open"
                ;;
            *)
                printf '%s\n' "$uid" >"$MODDIR/target_uid" 2>/dev/null || true
                chmod 0644 "$MODDIR/target_uid" "$MODDIR/target_package" 2>/dev/null || true
                if command -v chcon >/dev/null 2>&1; then
                    chcon u:object_r:system_file:s0 "$MODDIR/target_uid" "$MODDIR/target_package" >/dev/null 2>&1 || true
                    chcon -R u:object_r:system_file:s0 "$MODDIR/zygisk" >/dev/null 2>&1 || true
                fi
                logmsg "boot-completed target_package=$pkg target_uid=$uid Java clock canary armed"
                ;;
            esac
            ;;
        esac

        # V132: bootstrap exactly one compatible Zygisk loader when none exists.
        # Never auto-reboot; a successful first install writes a reboot-required marker.
        REZ_DEP="$MODDIR/deps/ReZygisk-v1.0.0-515-333d423-release.zip"
        REZ_INSTALL_LOG=/data/local/tmp/V132-rezygisk-install.log
        REZ_REBOOT_MARKER=/data/local/tmp/V132-rezygisk-reboot-required

        loader_enabled()
        {
            d="$1"
            [ -f "$d/module.prop" ] && [ ! -e "$d/disable" ] && [ ! -e "$d/remove" ]
        }

        bootstrap_rezygisk()
        {
            if loader_enabled /data/adb/modules/rezygisk; then
                rm -f "$REZ_REBOOT_MARKER" >/dev/null 2>&1 || true
                logmsg "boot-completed ReZygisk already enabled; Java hook loader ready"
                return 0
            fi
            if loader_enabled /data/adb/modules/zygisksu; then
                rm -f "$REZ_REBOOT_MARKER" >/dev/null 2>&1 || true
                logmsg "boot-completed existing Zygisk Next enabled; respecting existing loader"
                return 0
            fi

            # Respect an explicit user-disabled/remove state instead of silently replacing it.
            if [ -d /data/adb/modules/rezygisk ] || [ -d /data/adb/modules/zygisksu ]; then
                logmsg "boot-completed loader module directory exists but is disabled/removed; auto-install skipped to respect user state"
                return 0
            fi

            if [ -f /data/adb/modules_update/rezygisk/module.prop ] || [ -e "$REZ_REBOOT_MARKER" ]; then
                logmsg "boot-completed ReZygisk already staged; reboot still required"
                return 0
            fi

            [ -r "$REZ_DEP" ] || {
                logmsg "boot-completed ReZygisk dependency missing: $REZ_DEP"
                return 0
            }

            KSUD=/data/adb/ksu/bin/ksud
            if [ ! -x "$KSUD" ]; then
                KSUD="$(command -v ksud 2>/dev/null || true)"
            fi
            [ -n "$KSUD" ] && [ -x "$KSUD" ] || {
                logmsg "boot-completed ksud unavailable; ReZygisk bootstrap skipped"
                return 0
            }

            : >"$REZ_INSTALL_LOG" 2>/dev/null || true
            if "$KSUD" module install "$REZ_DEP" >>"$REZ_INSTALL_LOG" 2>&1; then
                printf 'V132 installed pinned ReZygisk dependency; reboot once to activate Java hooks.\n' >"$REZ_REBOOT_MARKER" 2>/dev/null || true
                chmod 0644 "$REZ_REBOOT_MARKER" "$REZ_INSTALL_LOG" 2>/dev/null || true
                logmsg "boot-completed ReZygisk v1.0.0 staged successfully; ONE REBOOT REQUIRED; no automatic reboot performed"
            else
                rc=$?
                logmsg "boot-completed ReZygisk install failed rc=$rc; inspect $REZ_INSTALL_LOG"
            fi
        }

        bootstrap_rezygisk

        exit 0
        EOF_V132_BOOTCOMPLETED

        cat >"$MODDIR/service.sh" <<'EOF_V132_SERVICE'
        #!/system/bin/sh
        MODDIR=${0%/*}
        LOG=/data/local/tmp/V132-module-health.log
        LOADER_LOG=/data/local/tmp/V132-loader-health.log
        APPLOG=/data/local/tmp/V132-app-clock-hook.log
        logmsg() { printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)" "$*" >>"$LOG" 2>/dev/null || true; }
        loaderlog() { printf '%s %s\n' "$(date '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo unknown)" "$*" >>"$LOADER_LOG" 2>/dev/null || true; }

        n=0
        while [ "$(getprop sys.boot_completed 2>/dev/null)" != "1" ]; do
            sleep 2
            n=$((n+1))
            [ "$n" -lt 90 ] || break
        done

        pkg="$(head -n 1 "$MODDIR/target_package" 2>/dev/null | tr -d '\r\n' || true)"
        scope="$(head -n 1 "$MODDIR/app_scope" 2>/dev/null | tr -d '\r\n' || true)"
        uid="$(head -n 1 "$MODDIR/target_uid" 2>/dev/null | tr -cd '0-9' || true)"
        pids=""
        case "$pkg" in ''|*[!A-Za-z0-9._-]*) ;; *) pids="$(pidof "$pkg" 2>/dev/null || true)" ;; esac
        mode="$(head -n 1 "$MODDIR/zygisknext_linker_mode" 2>/dev/null | tr -d '\r\n' || true)"

        loader=none
        if [ -f /data/adb/modules/rezygisk/module.prop ] && [ ! -e /data/adb/modules/rezygisk/disable ] && [ ! -e /data/adb/modules/rezygisk/remove ]; then loader=rezygisk; fi
        if [ -f /data/adb/modules/zygisksu/module.prop ] && [ ! -e /data/adb/modules/zygisksu/disable ] && [ ! -e /data/adb/modules/zygisksu/remove ]; then loader=zygisksu; fi

        logmsg "module=v132_ghost_guard scope=${scope:-unavailable} pkg=${pkg:-unavailable} uid=${uid:-unresolved} pids=${pids:-none} loader=$loader linker_mode=${mode:-keep} arm64=$([ -f "$MODDIR/zygisk/arm64-v8a.so" ] && echo yes || echo no) arm32=$([ -f "$MODDIR/zygisk/armeabi-v7a.so" ] && echo yes || echo no) manifest=$([ -f "$MODDIR/deps/ZYGISK-ELF-MANIFEST.txt" ] && echo yes || echo no) app_log=$([ -r "$APPLOG" ] && echo yes || echo no) kernel=$(uname -r 2>/dev/null || echo unavailable)"

        : >"$LOADER_LOG" 2>/dev/null || true
        loaderlog "module=v132_ghost_guard selected_loader=$loader requested_linker_mode=${mode:-keep}"
        loaderlog "module_contexts_begin"
        ls -ldZ "$MODDIR" "$MODDIR/zygisk" "$MODDIR/zygisk/arm64-v8a.so" "$MODDIR/zygisk/armeabi-v7a.so" "$MODDIR/app_scope" "$MODDIR/target_uid" "$MODDIR/target_package" 2>&1 >>"$LOADER_LOG" || true
        loaderlog "module_contexts_end"

        if [ "$loader" = "zygisksu" ]; then
            ZN=/data/adb/modules/zygisksu/bin/zygiskd
            if [ -r /data/adb/modules/zygisksu/module.prop ]; then
                while IFS= read -r line; do
                    case "$line" in id=*|name=*|version=*|versionCode=*) loaderlog "zygisksu_$line" ;; esac
                done </data/adb/modules/zygisksu/module.prop
            fi
            loaderlog "zygiskd_present=$([ -x "$ZN" ] && echo yes || echo no)"
            for f in /data/adb/zygisksu/linker /data/adb/zygisksu/memory_type /data/adb/zygisksu/denylist_enforce; do
                [ -r "$f" ] || continue
                loaderlog "state_file=$f value=$(cat "$f" 2>/dev/null | tr -d '\r\n')"
            done

            case "$mode" in
                system|builtin)
                    if [ -x "$ZN" ]; then
                        if command -v timeout >/dev/null 2>&1; then timeout 5 "$ZN" linker "$mode" >>"$LOADER_LOG" 2>&1; rc=$?; else "$ZN" linker "$mode" >>"$LOADER_LOG" 2>&1; rc=$?; fi
                        loaderlog "linker_apply requested=$mode rc=$rc"
                    else
                        loaderlog "linker_apply requested=$mode rc=127 reason=zygiskd_missing"
                    fi
                    ;;
                *) loaderlog "linker_apply requested=keep rc=0 action=none" ;;
            esac

            # Capture read-only status/help candidates; unsupported subcommands are non-fatal.
            if [ -x "$ZN" ]; then
                loaderlog "zygiskd_status_begin"
                if command -v timeout >/dev/null 2>&1; then timeout 5 "$ZN" status >>"$LOADER_LOG" 2>&1 || true; else "$ZN" status >>"$LOADER_LOG" 2>&1 || true; fi
                loaderlog "zygiskd_status_end"
                loaderlog "zygiskd_help_begin"
                if command -v timeout >/dev/null 2>&1; then timeout 5 "$ZN" --help >>"$LOADER_LOG" 2>&1 || true; else "$ZN" --help >>"$LOADER_LOG" 2>&1 || true; fi
                loaderlog "zygiskd_help_end"
            fi
            if command -v zn >/dev/null 2>&1; then
                loaderlog "zn_status_begin"
                if command -v timeout >/dev/null 2>&1; then timeout 5 zn status >>"$LOADER_LOG" 2>&1 || true; else zn status >>"$LOADER_LOG" 2>&1 || true; fi
                loaderlog "zn_status_end"
            fi

            loaderlog "enabled_zygisk_modules_begin"
            for so in /data/adb/modules/*/zygisk/arm64-v8a.so; do
                [ -f "$so" ] || continue
                d=${so%/zygisk/arm64-v8a.so}
                [ -e "$d/disable" ] && continue
                [ -e "$d/remove" ] && continue
                loaderlog "enabled_module=$(basename "$d") so=$so"
            done
            loaderlog "enabled_zygisk_modules_end"
        elif [ "$loader" = "rezygisk" ]; then
            if [ -r /data/adb/modules/rezygisk/module.prop ]; then
                while IFS= read -r line; do case "$line" in id=*|name=*|version=*|versionCode=*) loaderlog "rezygisk_$line" ;; esac; done </data/adb/modules/rezygisk/module.prop
            fi
        fi
        exit 0
        EOF_V132_SERVICE

        cat >"$MODDIR/bin/logcat-wrapper" <<'EOF_V132_LOGCAT_WRAPPER'
        #!/system/bin/sh
        # V132 display-only guard for /system/bin/logcat.
        # It never changes kernel clocks. It modifies only rendered timestamps when the
        # caller explicitly requests a monotonic text format.
        REAL=/dev/.v132-logcat-real

        [ -x "$REAL" ] || exit 126

        # Hard anti-recursion guard. V122 runtime evidence showed its preserved "real"
        # path could become the wrapper itself; V132 refuses to run in that condition.
        self_size="$(wc -c <"$0" 2>/dev/null | tr -cd '0-9')"
        real_size="$(wc -c <"$REAL" 2>/dev/null | tr -cd '0-9')"
        case "$self_size" in ''|*[!0-9]*) self_size=0 ;; esac
        case "$real_size" in ''|*[!0-9]*) real_size=0 ;; esac
        [ "$real_size" -gt 8192 ] || exit 126
        [ "$real_size" -ne "$self_size" ] || exit 126

        if command -v sha256sum >/dev/null 2>&1; then
            self_hash="$(sha256sum "$0" 2>/dev/null | awk '{print $1}')"
            real_hash="$(sha256sum "$REAL" 2>/dev/null | awk '{print $1}')"
            [ -z "$self_hash" ] || [ -z "$real_hash" ] || [ "$self_hash" != "$real_hash" ] || exit 126
        fi

        want_monotonic=0
        binary_mode=0
        for arg in "$@"; do
            case "$arg" in
                *monotonic*) want_monotonic=1 ;;
                -B|--binary) binary_mode=1 ;;
            esac
        done

        if [ "$want_monotonic" -ne 1 ] || [ "$binary_mode" -eq 1 ]; then
            exec "$REAL" "$@"
        fi

        # /proc/self/stat field 22 is already on the retained ghost MONOTONIC display axis.
        start_ticks="$(awk '{print $22; exit}' /proc/self/stat 2>/dev/null || true)"
        hz="$(getconf CLK_TCK 2>/dev/null || true)"
        case "$start_ticks" in ''|*[!0-9]*) exec "$REAL" "$@" ;; esac
        case "$hz" in ''|*[!0-9]*) hz=100 ;; esac
        [ "$hz" -gt 0 ] 2>/dev/null || hz=100

        marker="v132-ghost-$$-$(date +%s 2>/dev/null || echo 0)"
        if command -v log >/dev/null 2>&1; then
            log -t V132Ghost "$marker" >/dev/null 2>&1 || true
        fi

        probe="$("$REAL" -v monotonic -d -t 24 2>/dev/null | awk '
